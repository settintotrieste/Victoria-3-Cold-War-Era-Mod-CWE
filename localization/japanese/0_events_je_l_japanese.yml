    british_rhodesia_nyasaland.sgc.t:0 "ローデシア・ニヤサランド連邦？"
    british_rhodesia_nyasaland.sgc.d:0 "ローデシア・ニヤサランド連邦は、中央アフリカ連邦（CAF）としても知られる植民地連邦でした。この連邦は、自治権を持つ英国植民地である南部ローデシアと、英国の保護国である北部ローデシアおよびニヤサランドのアフリカ南部の3領土で構成されていました。"
    british_malaysia.sgc.t:0 "マレーシアの形成？"
    british_malaysia.sgc.d:0 "マレーシア連邦は、1963年9月16日にマラヤ連邦、シンガポール、北ボルネオ（サバ）、サラワクが合邦して形成されました。"
    british_decolonisation.20.option.1:0 "植民地をマラヤに割譲する"
    british_decolonisation.20.option.2:0 "植民地は英国に留まるべきだ！"
    british_west_indies.sgc.t:0 "西インド諸島連邦の形成？"
    british_west_indies.sgc.d:0 "西インド連邦は、1958年1月3日から1962年5月31日まで存在した短命な政治連合でした。トリニダード・トバゴ、バルバドス、ジャマイカ、リーワード諸島およびウィンドワード諸島の島々を含む、大英帝国の構成員であったカリブ海の様々な島々が集まって連邦を形成し、その首都はトリニダード・トバゴのポート・オブ・スペインに置かれました。明らかに連邦の目的は、単一の国家として英国から独立した政治単位を作ることでした。"
    british_singapore.sgc.t:0 "シンガポールに自治権？"
    british_singapore.sgc.d:0 "$generic_self_rule_decolonisation_loc_desc$"
    british_singapore_state.sgc.t:0 "シンガポールにさらなる自治権？"
    british_singapore_state.sgc.d:0 "脱植民地化の進展と、英国のマレー半島からの離脱が進む流れの中で、ロンドンの英国植民地省とシンガポール立法議会との間では、シンガポールの自治をめぐる憲法制定協議がすでに行われていました。その結果、1958年にはシンガポール国憲法が制定され、1959年には総督府が廃止されるとともに、全51議席が選挙で選ばれる自治立法議会が成立しました。"
