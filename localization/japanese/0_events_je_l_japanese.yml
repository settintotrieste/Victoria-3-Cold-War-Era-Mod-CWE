    french_vietnam_state.indy.t:0 "ベトナム国？"
    french_vietnam_state.indy.d:0 "1949年5月20日フランス国民議会はコーチシナとベトナム本土の再統合を承認しました。この決定は6月4日に発効し、7月2日にベトナム国が正式に宣言されました。1949年から1954年にかけて、コーチシナとの再統合を経たベトナム国はフランス連合内の連合国家としてフランスから部分的な自治を認められていました。"
    french_syria.indy.t:0 "シリアの独立？"
    french_syria.indy.d:0 "フランスの委任統治領であった時期（1923年〜1946年）を経て誕生したこの新国家は、かつてオスマン帝国が支配したシリア諸州から生まれた最大のアラブ国家となりました。1945年10月24日シリア共和国が国際連合の原加盟国となったことで、民主的な議会制共和国として法的な独立を獲得し、これによりフランスの委任統治は法的に終結しました（ただしフランス軍が撤退したのは1946年4月のことでした）。"
    french_saarland.indy.t:0 "ザール保護国を設立する？"
    french_saarland.indy.d:0 "ヨーロッパでの第二次世界大戦終結から2か月後の1945年7月、連合国軍は占領した地域からそれぞれの占領地区へと再配置を進めていました。1945年7月10日アメリカ軍がザールから撤退し、フランス軍が占領行政を敷きました。1946年2月16日フランスはザールを連合国の占領地区から切り離して独立したザール保護国を設立し、ザールは事実上ドイツに対する連合国管理理事会の共同管轄下から外れました。"
    
