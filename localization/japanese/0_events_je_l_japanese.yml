    je_term_limits:0 "[SCOPE.sCharacter('the_current_president_scope').GetPrimaryRoleTitle]の職"
    je_term_limits_reason:0 "[COUNTRY.GetName]の憲法の下では、何人も[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の職に二度を超えて選出されることはなく、また他の者が[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]に選出された任期のうち二年を超えて[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の職にあった者、あるいは[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の職務を代行した者は、[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の職に一度を超えて選出されることはありません。したがって[SCOPE.sCharacter('the_current_president_scope').GetFullName]は[SCOPE.sCharacter('the_current_president_scope').GetHerHis]の任期上限である8年に達した時点で退任します。"
