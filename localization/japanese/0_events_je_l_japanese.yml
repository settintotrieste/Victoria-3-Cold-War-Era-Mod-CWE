    ig_armed_forces_economic_ideology.t:0 "[SCOPE.gsInterestGroup('armed_forces_ig').GetName]が経済イデオロギーを変更"
    ig_armed_forces_economic_ideology.d:0 "[SCOPE.gsInterestGroup('armed_forces_ig').GetName]の指導者である[SCOPE.sCharacter('armed_forces_ig_leader').GetFullName]が[SCOPE.sCountry('ig_armed_forces_country').GetName]のための新たな経済体制への支持を表明しました。提案された体制は現在政府の多数派が採用しているものとは根本的に異なります。[SCOPE.gsInterestGroup('armed_forces_ig').GetName]はこの急進的な手法について[SCOPE.sCountry('ig_armed_forces_country').GetName]を苦しめる現在の経済問題を解決するには強力かつ断固とした型破りな行動が必要だと述べて正当化しました。"
    ig_armed_forces_economic_ideology.f:0 "このイベントは[SCOPE.gsInterestGroup('armed_forces_ig').GetName]が[concept_opposition]に属し、政府に怒っており、かつ経済が債務不履行または不健全な状態にあるときに発生します。新たに選ばれる経済イデオロギーは、常に政府内で最も影響力の大きい利益団体の経済イデオロギーと正反対のものになります。"
    
    ig_armed_forces_economic_ideology_dictatorship.t:0 "[SCOPE.gsInterestGroup('armed_forces_ig').GetName]が経済イデオロギーを変更"
    ig_armed_forces_economic_ideology_dictatorship.d:0 "[SCOPE.sCharacter('rulers_scope').GetFullName]への忠誠を示すため[SCOPE.gsInterestGroup('armed_forces_ig').GetName]の指導者である[SCOPE.sCharacter('armed_forces_ig_leader').GetFullName]将軍が政府の経済政策を称賛する声明を発表し支持を誓いました。将軍はさらに政府に反対する者を先回りして排除するため軍の人事刷新を行うと発表しました。"
    ig_armed_forces_economic_ideology_dictatorship.f:0 "このイベントは[SCOPE.gsInterestGroup('armed_forces_ig').GetName]が[concept_government]の状態にあり、政府に満足しているときに発生します。選ばれる新たな経済イデオロギーは常に政府内で最も影響力の高い利益団体のものと同じになります。"
    ig_armed_forces_ideology_system.2.tt:0 "[concept_ruler]の[concept_interest_group]または[SCOPE.gsInterestGroup('armed_forces_ig').GetName]の出身でない[concept_general]や[concept_admiral]を交代させ[SCOPE.gsInterestGroup('armed_forces_ig').GetName]を刷新します"

