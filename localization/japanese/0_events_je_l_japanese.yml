    je_foreign_central_bank:0 "[SCOPE.sCountry('foreign_central_bank').GetAdjectiveNoFlag]の中央銀行"
    je_foreign_central_bank_reason:0 "我々は[concept_currency_union]に属しているため、[SCOPE.sCountry('foreign_central_bank').GetName]銀行が[ROOT.GetCountry.GetName]の中央銀行となります。つまり[SCOPE.sCountry('foreign_central_bank').GetName]の中央銀行が[ROOT.GetCountry.GetName]の#White 中央銀行利子率#!を決定します。\n\n中央銀行は金融政策を用いて景気変動を管理し、インフレが低く安定した状態、すなわち物価の安定を実現します。中央銀行は通常、公開市場で証券を売買して貨幣供給量を調整することで金融政策を実行します。公開市場操作は短期の利子率に影響を与え、それがより長期の利子率や経済活動へ波及します。中央銀行が利子率を引き下げれば金融政策は緩和的となり、引き上げれば引き締め的となります。\n\n現在の利子率：[SCOPE.GetRootScope.GetCountry.GetCustom('central_bank_current_monetary_policy_custom_title')]\n\n今月の平均コア[concept_market_price]：[GetPlayer.MakeScope.Var('core_interest_rate_now').GetValue]％\n\n前月の平均コア[concept_market_price]：[GetPlayer.MakeScope.Var('core_interest_rate_prev').GetValue]％\n\nコア[concept_market_price]の算出に用いる商品（[GetPlayer.MakeScope.Var('core_interest_rate_total_factors').GetValue]が利用可能）：$cir_grain$ $cir_meat$ $cir_fish$ $cir_fruit$ $cir_tea$ $cir_coffee$ $cir_groceries$ $cir_liquor$ $cir_tobacco$ $cir_wine$ $cir_transportation$ $cir_real_estate$ $cir_electricity$ $cir_communication_services$ $cir_services$ $cir_furniture$ $cir_telecommunications$ $cir_computers$"
