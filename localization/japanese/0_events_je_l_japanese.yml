    notification_party_update_notification_name:0 "[SCOPE.gsInterestGroup('IG_expelled_from_party').GetName]が[SCOPE.sParty('new_IG_party').GetName]に合流"
    notification_party_update_notification_desc:0 "選挙での勝算を高めるため[SCOPE.gsInterestGroup('IG_expelled_from_party').GetName]は相違を棚上げし[SCOPE.sParty('new_IG_party').GetName]との政治同盟に加わりました。\n\nこれは現在の[GetLawType('law_first_past_the_post').GetGroup.GetName]が[Concept('concept_party', '$concept_parties$')]に二大政党制への統合を促しているためです。"
    
    notification_party_leave_update_notification_name:0 "[SCOPE.gsInterestGroup('IG_expelled_from_party').GetName]が[SCOPE.sParty('party_affected_by_expulsion_IG').GetName]から離脱"
    notification_party_leave_update_notification_desc:0 "埋めがたい相違を理由に[SCOPE.gsInterestGroup('IG_expelled_from_party').GetName]は[SCOPE.sParty('party_affected_by_expulsion_IG').GetName]からの離脱を決めました。\n\nこれは[SCOPE.gsInterestGroup('IG_expelled_from_party').GetName]の[concept_approval]が#r 不満#!であるためです。"
    
    notification_mega_party_leave_update_notification_name:0 "[SCOPE.gsInterestGroup('IG_expelled_from_party').GetName]が[SCOPE.sParty('party_affected_by_expulsion_IG').GetName]から離脱"
    notification_mega_party_leave_update_notification_desc:0 "埋めがたい相違を理由に[SCOPE.gsInterestGroup('IG_expelled_from_party').GetName]は[SCOPE.sParty('party_affected_by_expulsion_IG').GetName]からの離脱を決めました。\n\nこれは[SCOPE.sParty('party_affected_by_expulsion_IG').GetName]が#y 巨大政党#!であり[SCOPE.gsInterestGroup('IG_expelled_from_party').GetName]の[concept_approval]が#r 体制派#!ではないためです。"
    
    notification_no_gov_party_update_notification_name:0 "[concept_government]が崩壊"
    notification_no_gov_party_update_notification_desc:0 "[concept_government]の[concept_interest_group]がいずれも[concept_party]を持たないため[concept_government]は崩壊しました。その結果[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]は解散され臨時の[concept_election]が実施されます。"
    
    ban_party_hopping_decision:0 "党籍変更を禁止"
    ban_party_hopping_decision_desc:0 "この決定は選出された議員が就任後に所属政党を変えることを禁じます。政党の安定を強め有権者の信頼を保ち日和見的な鞍替えを減らすことを目的としています。\n\n@information!この決定により[Concept('concept_interest_group', '$concept_interest_groups$')]は選挙での力を強めるために[concept_election]の途中で[concept_party]を変えられなくなります。"
    
    amendment_party_hopping_banned:0 "党籍変更の禁止"
    amendment_party_hopping_banned_desc:0 "選出された議員は就任後に所属政党を変更することが禁止されています。\n\n@information!この決定により[Concept('concept_interest_group', '$concept_interest_groups$')]は選挙での勢力を強めるために[concept_election]の途中で[concept_party]を変更できなくなります。"
    
