    the_troubles_custom_name:0 "北アイルランド紛争"
    the_troubles_custom_desc:0 "北アイルランド紛争は1960年代後半から1998年まで約30年にわたって北アイルランドで続いた民族主義的な紛争です。主な争点は北アイルランドの帰属でした。歴史的経緯から大半がアルスターのプロテスタントであったユニオニストとロイヤリストは、北アイルランドが連合王国に留まることを望みました。一方、大半がアイルランドのカトリック教徒であったアイルランド・ナショナリストとリパブリカンは、北アイルランドが連合王国を離れ統一アイルランドに加わることを望みました。紛争の舞台は主に北アイルランドでしたが、暴力は時にアイルランド共和国やイングランド、さらにはヨーロッパ大陸にも波及しました。"
    blm_custom_name:0 "奴隷制の遺産"
    blm_custom_desc:0 "植民地時代初期に最初のアフリカ人が到来してから内戦の後に至るまで、アフリカ系アメリカ人の大半は奴隷とされていました。自由身分のアフリカ系アメリカ人でさえ政治的・社会的・経済的自由を制限され、内戦の前後を通じてリンチ、人種隔離、黒人取締法、ジム・クロウ法をはじめとする様々な差別にさらされてきました。公民権運動によって公的な人種差別は連邦政府により段階的に違法とされ、アメリカ社会の多くの層からも社会的・道徳的に容認できないものと見なされるようになりました。それでもなお黒人アメリカ人に対する人種差別は合衆国に根強く残り、社会経済的な格差として表れ続けています。"
    years_of_lead_custom_name:0 "鉛の時代"
    years_of_lead_custom_desc:0 "「鉛の時代」とは[ROOT.GetCountry.GetName]における政治的暴力と社会的混乱の時期を指す言葉で、極左と極右の双方による政治テロや暴力的衝突が相次いだことで知られています。"
    naxalite_insurgency_custom_name:0 "ナクサライト・毛沢東主義派の反乱"
    naxalite_insurgency_custom_desc:0 "ナクサライト・毛沢東主義派の反乱は、ナクサライトまたはナクサルと呼ばれる毛沢東主義勢力（毛沢東主義の政治思想を支持する共産主義者の集団）とインド政府との間で続いている紛争です。ナクサライトは放置された農業労働者や貧困層のための土地の権利の改善と雇用の拡大を求める戦いであると称し、警察や政府職員をたびたび標的にしてきました。"
    tamil_tigers_insurgency_custom_name:0 "タミル・タイガーの反乱"
    tamil_tigers_insurgency_custom_desc:0 "タミル・イーラム解放のトラは、スリランカ北東部を拠点としたタミル人の武装組織でした。シンハラ人が支配するスリランカ政府によるスリランカ・タミル人への絶え間ない差別と暴力的な迫害を受け、LTTEは島の北東部にタミル・イーラムと呼ばれるタミル人の独立国家を樹立するために戦いました。"
    communist_insurgency_custom_name:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の共産主義反乱"
    communist_insurgency_custom_desc:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]共産党は[concept_government]を打倒し社会主義共和国を樹立することを目的として宣戦布告しました。"
    generic_insurgency_custom_name:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の反乱"
    generic_insurgency_custom_desc:0 "[ROOT.GetCountry.GetAdjective]社会の急進派は[concept_government]を武力で打倒することを使命としています。"
    theocratic_insurgency_custom_name:0 "対テロ戦争"
    theocratic_insurgency_custom_desc:0 "対テロ戦争は[ROOT.GetCountry.GetName]で宗教過激派を鎮圧するための軍事作戦です。これらの過激派は[concept_government]を打倒し神権国家を樹立しようとしています。"
    
