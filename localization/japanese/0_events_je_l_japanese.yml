    je_sovereign_wealth_fund:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の政府系ファンド"
    je_sovereign_wealth_fund_reason:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]投資公社は国家が[ROOT.GetCountry.GetAdjective]の民間部門に投資できるようにする政府所有の企業です。こうした投資活動による配当は政府が運営する政府系ファンドに積み立てられます。この仕組みにより政府は民間部門の政府所有率に応じた額の資金を[concept_investment_pool]へ注入したり引き出したりできます。\n\n#BOLD 政府系ファンドの規模：#!#Green @money![GetPlayer.MakeScope.Var('sovereign_wealth_fund_size_display').GetValue]M#!\n\n#BOLD 月ごとの最大注入・引出額：#!@money![GetPlayer.MakeScope.Var('sovereign_wealth_fund_withdrawal_amount').GetValue]\n\n#BOLD 国有民間企業の数：#![GetPlayer.MakeScope.Var('sovereign_wealth_fund_gov_buildings').GetValue]/[GetPlayer.MakeScope.Var('sovereign_wealth_fund_all_buildings').GetValue]\n\n#BOLD 議長：#![ROOT.GetCountry.GetRuler.GetFullName]"
    je_sovereign_wealth_fund_status:0 "残高：#Green @money![GetPlayer.MakeScope.Var('sovereign_wealth_fund_size_display').GetValue]M#!"
    
