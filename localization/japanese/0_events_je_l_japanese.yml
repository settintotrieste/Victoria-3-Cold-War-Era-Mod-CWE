    je_end_imperial_preference_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('imperial_conference_custom_adjective')]特恵は[ROOT.GetCountry.GetAdjective]帝国全域で施行される相互的な関税引き下げの制度です。\n\nゲーム上では[SCOPE.GetRootScope.GetCountry.GetCustom('imperial_conference_custom_adjective')]特恵は[ROOT.GetCountry.GetName]が[concept_dominion]と[concept_customs_union]を共有することで表現されます。\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('imperial_conference_custom_adjective')]特恵を廃止すると[concept_customs_union]が[concept_dominion]と共有している[ROOT.GetCountry.GetName]は解消されます。"
    
