    cfa_franc_zone:0 "CFAフラン圏"
    cfa_franc_zone_desc:0 "[ROOT.GetCountry.GetName]が主導するCFAフランは、西アフリカ8か国で使われる西アフリカCFAフランと中部アフリカ6か国で使われる中部アフリカCFAフランという2つの通貨の名称です。両者は別個の通貨ですが常に等価を保っており事実上交換可能です。\n\nこの広範な[concept_currency_union]を失えば我が国の威信は傷つきます。その維持を目指すべきです。"
    franc_zone:0 "フラン圏"
    franc_zone_desc:0 "[ROOT.GetCountry.GetName]が主導するフラン圏は、世界に類を見ない経済的・通貨的・文化的な圏域です。実に多様な国家や領域から成り立っており、かつてのフランス植民地帝国の発展と変遷の結果として生まれました。\n\nこの広範な[concept_currency_union]を失えば我が国の威信は傷つきます。その維持を目指すべきです。"
    sterling_zone:0 "ポンド圏"
    sterling_zone_desc:0 "[ROOT.GetCountry.GetName]が主導するスターリング圏は、自国通貨をポンドに固定するか、ポンドをそのまま自国通貨として用いる国々の集まりでした。この圏域は1931年にポンドが金本位制を離脱した後、1930年代前半に非公式な形で現れ始めました。歴史的にポンド建てで多くの貿易を行ってきた国々の通貨が、金ではなくポンドに固定されるようになったのです。ロンドンのイングランド銀行が通貨圏内の金融政策の協調を主導しました。独自通貨を持つメンバー国は外貨準備の大部分をロンドンのポンド残高として保有していました。\n\nこの広大な[concept_currency_union]の維持を目指すべきです。失えば我が国の威信への打撃となります。"
    dollar_zone:0 "ドル圏"
    ruble_zone:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]ルーブル圏"
    generic_currency_zone:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]通貨圏"
    generic_currency_zone_desc:0 "[ROOT.GetCountry.GetName]は5つ以上の主権国家をメンバーとする主要な[concept_currency_union]の盟主です。これにより[ROOT.GetCountry.GetAdjective]の中央銀行は国際金利に対する大きな影響力と多大な威信を得ています。\n\nこの広大な[concept_currency_union]の維持を目指すべきです。失えば我が国の威信への打撃となります。"
    
    je_multilateral_development_banks_1.tt:0 "この国は、少なくとも他に1つの国と$multilateral_development_bank$[concept_diplomatic_pact]を有しています"
    je_multilateral_development_banks_2.tt:0 "この国は、いかなる国とも$multilateral_development_bank$[concept_diplomatic_pact]を有していません"
    je_multilateral_development_banks:0 "多国間開発銀行"
    je_multilateral_development_banks_reason:0 "多国間開発銀行は出資者である主権国家が設立した超国家的な金融機関です。その業務範囲はこれらの国家が定めた開発援助・協力政策を反映しています。\n\n[ROOT.GetCountry.GetName]の政府は国家支出を賄うため多国間開発銀行から資金を借り入れることができます。\n\n国際債務は#Yellow XDR#!建てであり、XDRは世界平均為替レートに基づいて算出されます。したがって[ROOT.GetCountry.GetAdjectiveNoFlag]の通貨が強いほど借入は安上がりになり、弱ければその逆となります。\n\nヒント：[ROOT.GetCountry.GetAdjective]の為替レートは$lawgroup_monetary_policy$[concept_law]で調整できます。\n\n為替レート：@money!1 = [GetPlayer.MakeScope.Var('currency_exchange_rate').GetValue] #Yellow XDR#!\n\n借入限度額（外貨建て）：#Yellow XDR#! #Green [GetPlayer.MakeScope.Var('currency_borrowing_pool_display').GetValue]M#!\n\n借入限度額（[ROOT.GetCountry.GetAdjectiveNoFlag]の通貨建て）：#Green @money![GetPlayer.MakeScope.Var('currency_borrowing_pool_domestic_display').GetValue]M#!\n\n月間借入限度額：#o @money![GetPlayer.MakeScope.Var('currency_borrow_money_monthly_limit_display').GetValue]M#!\n\n[ROOT.GetCountry.GetName]は以下の地域銀行に加盟しています：#BOLD $ASIAN_DEVELOPMENT_BANK$ $ASIAN_INFRASTRUCTURE_INVESTMENT_BANK$ $EUROPEAN_INVESTMENT_BANK$ $INTERNATIONAL_INVESTMENT_BANK$ $INTER_AMERICAN_DEVELOPMENT_BANK$ $AFRICAN_DEVELOPMENT_BANK$ $NORDIC_INVESTMENT_BANK$ $CARIBBEAN_DEVELOPMENT_BANK$ $ISLAMIC_DEVELOPMENT_BANK$ $NEW_DEVELOPMENT_BANK$ $EURASIAN_DEVELOPMENT_BANK$ $NORTH_AMERICAN_DEVELOPMENT_BANK$ #!"
    je_multilateral_development_banks_status:0 "元金：#Yellow XDR#! #Green [GetPlayer.MakeScope.Var('currency_borrowed_money_display').GetValue]M#!\n年利子率：#o [GetPlayer.MakeScope.Var('currency_rate_international_local').GetValue]%#!\n年間返済額：@money!#Red [GetPlayer.MakeScope.Var('currency_borrowed_money_yearly_repayment_display').GetValue]#! / #Yellow XDR#! #Red [GetPlayer.MakeScope.Var('currency_borrowed_money_exchange_adjusted_repayment').GetValue]#!"
    
    je_start_borrow_multilateral_banks_button:0 "資金の借入を開始する"
    je_start_borrow_multilateral_banks_button_desc:0 "[ROOT.GetCountry.GetName]政府は年利#o [GetPlayer.MakeScope.Var('currency_rate_international_local').GetValue]％#!で国際開発金融機関からの借入を開始します。\n\n注：借入限度額は#Yellow XDR#!#Green [GetPlayer.MakeScope.Var('currency_borrowing_pool_display').GetValue]M#!で、これは#Green @money![GetPlayer.MakeScope.Var('currency_borrowing_pool_domestic_display').GetValue]M#!に相当します。"
    je_stop_borrow_multilateral_banks_button:0 "資金の借入を停止する"
    je_stop_borrow_multilateral_banks_button_desc:0 "[ROOT.GetCountry.GetName]政府は年利#o [GetPlayer.MakeScope.Var('currency_rate_international_local').GetValue]％#!での国際開発金融機関からの借入を停止します。\n\n注：借入限度額は#Yellow XDR#!#Green [GetPlayer.MakeScope.Var('currency_borrowing_pool_display').GetValue]M#!で、これは#Green @money![GetPlayer.MakeScope.Var('currency_borrowing_pool_domestic_display').GetValue]M#!に相当します。"
    je_start_repay_multilateral_banks_button:0 "資金の返済を開始する"
    je_start_repay_multilateral_banks_button_desc:0 "[ROOT.GetCountry.GetName]政府は国際開発金融機関からの借入の一部返済を開始します。\n\n注：@money!#Red [GetPlayer.MakeScope.Var('currency_borrowed_money_yearly_repayment_display').GetValue]#!で#Yellow XDR#!#Red [GetPlayer.MakeScope.Var('currency_borrowed_money_exchange_adjusted_repayment').GetValue]#!相当の債務を返済します。"
    je_stop_repay_multilateral_banks_button:0 "資金の返済を停止する"
    je_stop_repay_multilateral_banks_button_desc:0 "[ROOT.GetCountry.GetName]政府は国際開発金融機関からの借入の一部返済を停止します。\n\n注：@money!#Red [GetPlayer.MakeScope.Var('currency_borrowed_money_yearly_repayment_display').GetValue]#!で#Yellow XDR#!#Red [GetPlayer.MakeScope.Var('currency_borrowed_money_exchange_adjusted_repayment').GetValue]#!相当の債務を返済します。"
    
    borrow_repay_multilateral_banks.tt:0 "過去1か月間に国際的な債務の借入または返済を行いませんでした"
    
