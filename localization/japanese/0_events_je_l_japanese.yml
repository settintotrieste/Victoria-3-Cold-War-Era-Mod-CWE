    regime_change_failsafe.t: "[ROOT.GetCountry.GetNameNoFormatting]の新体制"
    regime_change_failsafe.d: "先の[concept_war]で[concept_regime_change][concept_war_goal]が強制され[ROOT.GetCountry.GetName]が敗北したことにより、戦勝国である外国勢力[SCOPE.sCountry('foreign_power_regime_change').GetName]は[ROOT.GetCountry.GetName]に新体制を樹立しました。この新体制は[SCOPE.sCountry('foreign_power_regime_change').GetName]と同じ[concept_government_type]と[Concept('concept_law', '$concept_laws$')]を持ちます。さらに[SCOPE.sCountry('foreign_power_regime_change').GetName]の[concept_ruler]と同じ[concept_interest_group]を持つ[concept_politician]が[ROOT.GetCountry.GetName]の新たな[concept_ruler]に就任します。"
    regime_change_failsafe.f: "このイベントは[ROOT.GetCountry.GetName]が[concept_regime_change][concept_war_goal]を受け入れたために発生しました。"
    regime_change_failsafe.option: "我が国にとって暗黒の日だ。"
    
    abolish_dynastic_republic.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting]の継承危機"
    abolish_dynastic_republic.d: "先代の[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の死により[ROOT.GetCountry.GetName]では継承危機が生じています。故[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の[concept_heir]である[GetPlayer.GetRuler.GetFullName]は職に就くには幼すぎるためです。\n\n子供の[Concept('concept_ruler', '$concept_rulers$')]を認める（すなわち君主制を創設する）よう憲法を改正しない限り[GetPlayer.GetRuler.GetLastName]家の政治王朝は終焉を迎えます。"
    abolish_dynastic_republic.f: "このイベントは現在の[concept_ruler]が成人していないために発生しました。"
    abolish_dynastic_republic.option.1: "世襲共和制もこれまでだ。"
    abolish_dynastic_republic.option.2: "君主制を宣言すれば問題は解決する！"
    
