    climate_change_system.option.2:0 "いや、地球温暖化はでっち上げだ！"
    
    montreal_protocol_climate.t:0 "モントリオール議定書"
    montreal_protocol_climate.d:0 "モントリオール議定書は気候変動への対処を目的としたものではありませんでしたが、この問題をめぐる後の外交の手本となった歴史的な環境協定です。最終的に世界のすべての国がこの条約を批准し、クロロフルオロカーボン（CFC）などオゾン層を破壊する物質の生産を停止する義務を負いました。議定書はこうしたオゾン層破壊物質の約99％を削減することに成功しています。2016年には締約国がキガリ修正によって気候変動の一因となる強力な温室効果ガスであるハイドロフルオロカーボン（HFC）の生産削減にも合意しました。"
    earth_summit_climate.t:0 "地球サミット"
    earth_summit_climate.d:0 "アメリカ合衆国を含む197か国が批准したこの画期的な協定は、気候変動に明示的に取り組んだ初の世界的な条約です。大気中の温室効果ガス濃度の安定化を目指す国際的な協議の場として、締約国会議（COP）と呼ばれる年次会合を設けました。これらの会合から京都議定書とパリ協定が生まれています。"
    kyoto_protocol_climate.t:0 "京都議定書"
    kyoto_protocol_climate.d:0 "1997年に採択され2005年に発効した京都議定書は、法的拘束力を持つ初の気候条約でした。先進国に対して排出量を1990年比で平均5％削減することを義務付け、各国の進捗を監視する仕組みを設けました。しかし主要な炭素排出国である中国やインドを含む途上国には行動を義務付けませんでした。アメリカは1998年に署名したものの批准はせず、後に署名を撤回しました。"
    paris_climate_accords_climate.t:0 "パリ協定"
    paris_climate_accords_climate.d:0 "これまでで最も重要な世界的気候協定であるパリ協定は、すべての国に排出削減目標の設定を求めています。各国政府は「国が決定する貢献（NDC）」と呼ばれる目標を定め、世界の平均気温の上昇を産業革命前から2°C（3.6°F）未満に抑え、さらに1.5°C（2.7°F）未満に抑える努力を追求することを目指します。また今世紀後半には、温室効果ガスの排出量と大気からの除去量が等しくなる世界全体での実質ゼロ排出の達成も目標としています。"
    
    generic_climate_summit_timer.tt:0 "過去5年間に気候サミットは開催されていません。"
