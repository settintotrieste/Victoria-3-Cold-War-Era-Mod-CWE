    OECD_member:0 "OECDメンバー"
    OECD_leader:0 "OECDリーダー"
    form_OECD_decision:0 "OECDを形成する"
    form_OECD_decision_desc:0 "経済協力開発機構は38の加盟国からなる国際機関であり、経済発展と世界貿易の促進を目的として1961年に設立されました。加盟国が民主主義と市場経済への支持を掲げるフォーラムであり、政策経験の比較、共通の問題への答えの模索、優れた実践の特定、そして加盟国の国内政策と国際政策の調整の場を提供しています。"
