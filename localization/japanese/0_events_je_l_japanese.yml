    OPEC_oil_embargo_action_break_name:0 "[concept_OPEC_oil_embargo]を終了する"
    OPEC_oil_embargo_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]が[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]に対して[Concept('concept_OPEC_oil_embargo', '$concept_OPEC_oil_embargoing$')]を行っています。"
    OPEC_oil_embargo_desc:0 "#header $OPEC_oil_embargo$#!\n$TOOLTIP_DELIMITER$\n他の[concept_country]に[concept_OPEC_oil_embargo]を課す[concept_ongoing_diplomatic_action]です。"
    OPEC_oil_embargo_action_notification_name:0 "[concept_OPEC_oil_embargo]"
    OPEC_oil_embargo_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName]が我が国への[Concept('concept_OPEC_oil_embargo', '$concept_OPEC_oil_embargoing$')]を開始しました。我が国が相手の[concept_market]に設立した[Concept('concept_trade_route','$concept_trade_routes$')]はすべて機能しなくなります。"
    OPEC_oil_embargo_action_notification_third_party_name:0 "[concept_OPEC_oil_embargo]"
