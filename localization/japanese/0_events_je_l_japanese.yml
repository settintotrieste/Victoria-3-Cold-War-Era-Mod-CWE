    je_wto_system: "世界貿易機関"
    je_wto_system_reason: "世界貿易機関（WTO）は国際貿易を規制し円滑化する政府間組織です。WTOは貿易協定を交渉するための枠組みを提供し、加盟国間の物品・サービス・知的財産の貿易を促進します。こうした協定は通常、関税や輸入割当その他の制限の削減または撤廃を目指すものです。\n\nWTOは貿易の枠組みを絶えず更新しているため、WTOによる[concept_tariffs]の削減量は毎年変動します。\n\n注：削減される[concept_tariffs]の量は世界経済の見通しに左右されます。"
    
