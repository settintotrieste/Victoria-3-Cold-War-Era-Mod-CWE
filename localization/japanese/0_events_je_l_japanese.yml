    espionage_election_interference.t:0 "[SCOPE.sCountry('espionage_target').GetName]で選挙干渉を行う機会"
    espionage_election_interference.d:0 "[SCOPE.sCountry('espionage_target').GetName]で活動する[SCOPE.sCountry('espionage_attacker').GetAdjective]の工作員が[SCOPE.sCountry('espionage_target').GetAdjective]政府の与党の選挙運動を妨害する機会を見つけました。彼らは[SCOPE.sCountry('espionage_target').GetAdjective]の有権者の間に与党についての根拠のない主張を流布し、その評判を傷つけることを提案しています。この秘密工作により[SCOPE.sCountry('espionage_target').GetAdjective]政府のいずれかの政党の選挙の勢いが低下するはずです。"
