    reserve_powers_veto.t:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ceremonial_body_custom_title')]が法案を拒否"
    reserve_powers_veto.d:0 "[SCOPE.sCharacter('ceremonial_head_of_state').GetPrimaryRoleTitle][SCOPE.sCharacter('ceremonial_head_of_state').GetFullName]は[SCOPE.sLaw('current_law_scope').GetName]を制定するための[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の法案に拒否権を行使しました。ただし政府は[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]で絶対多数を占めていれば、この拒否権を覆すことができます。"
    reserve_powers_veto.f:0 "このイベントは[SCOPE.gsInterestGroup('ceremonial_head_of_state_ig').GetName]が現在制定中の法律に反対または強く反対しているために発生しました。"
    reserve_powers_system_accept_option:0 "拒否権を受け入れ、法案を取り下げる。"
    reserve_powers_system_reject_option:0 "[SCOPE.sCharacter('ceremonial_head_of_state').GetPrimaryRoleTitle]の拒否権を拒否する！"
    reserve_powers_system_coup_option:0 "[SCOPE.sCharacter('ceremonial_head_of_state').GetPrimaryRoleTitle]の拒否権を単に無視する。"
    
    judiciary_veto.t:0 "法律制定への法的異議申し立て"
    judiciary_veto.d:0 "[SCOPE.gsInterestGroup('legal_challenge_plaintiff_scope').GetName]の有力者たちは[SCOPE.sLaw('current_law_scope').GetName]を制定するという[concept_government]の法案の合法性を争うため、[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]で訴訟を起こしました。彼らはこの法案が[ROOT.GetCountry.GetName]の憲法に違反しており、[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]が先んじて差し止めるべきだと主張しました。この主張は裁判官たちの支持を得て、直ちに彼らに有利な命令が下されました。"
    judiciary_veto.f:0 "このイベントは、[SCOPE.sLaw('current_law_scope').GetName]に反対または強く反対する[concept_interest_group]が存在し、さらに[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]がその[concept_interest_group]による司法手段を用いた立法阻止の試みを支持するほど進歩的または反動的であるために発生しました。"
    judicial_veto_accept_option:0 "裁判所の判断を受け入れよう！"
    judicial_veto_reject_option:0 "裁判所の判断を迂回する立法を行う。"
    
    ig_angry_with_government:0 "反発した利益集団"
    
    je_abolish_filibuster_button:0 "討論終結規則を廃止する"
    je_abolish_filibuster_button_desc:0 "上院の無制限討論の伝統は、フィリバスターの行使を許してきました。フィリバスターとは、討論を長引かせ、法案・決議・修正案その他の討論可能な議題の採決を遅延または阻止するための行為を漠然と指す言葉です。これを可能にしているのが討論終結規則であり、法律が制定段階へ進むには、正式に選出され宣誓した上院議員の5分の3、すなわち定数100名の上院のうち60名が討論終結に賛成しなければならないと定めています。"
    je_fire_council_chairperson_button:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ceremonial_ruler_custom_title')]を解任する"
    je_fire_council_chairperson_button_desc:0 "[concept_government]はいつでも[SCOPE.GetRootScope.GetCountry.GetCustom('government_ceremonial_ruler_custom_title')]を交代させることができます。今こそそうすべきではないでしょうか？"
    fire_ceremonial_head_of_state_timer.tt:0 "過去12か月以内に[SCOPE.GetRootScope.GetCountry.GetCustom('government_ceremonial_ruler_custom_title')]を解任していない"
