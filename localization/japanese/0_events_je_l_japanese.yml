    concept_progressive_judiciary:0 "進歩的"
    concept_progressive_judiciary_desc:0 "進歩的な裁判官とは、憲法は成文化された文書であり、したがって、その時々の社会政治的な状況に従って解釈されるべきであると考える人々のことです。これはやがて、市民の基本的自由を拡大する決定へとつながるでしょう。"
    concept_conservative_judiciary:0 "司法条文主義者"
    concept_conservative_judiciary_desc:0 "司法条文主義者の裁判官とは、憲法は成文化された文書であり、したがって、その時々の社会政治的な状況に従って解釈されるべきではないと考える人々のことです。憲法が完璧に書かれていることは稀であるため、これはやがて、市民の基本的自由を弱める決定へとつながるでしょう。"
    
    judiciary_progress_generic_desc:0 "画期的な判決において[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]は[ROOT.GetCountry.GetAdjectiveNoFlag]人の市民の基本的自由を束縛する法律を違憲と判断しました。判決理由として裁判所は[ROOT.GetCountry.GetName]における法の支配を維持し強化する必要性を挙げています。ただしこれはあくまで司法判断であるため[concept_government]は法案を可決してこれを覆すことができます。"
    judiciary_regress_generic_desc:0 "重大な転機となる判決において[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]は[ROOT.GetCountry.GetAdjectiveNoFlag]人の市民の基本的自由を守る法律が骨抜きにされうると判断しました。判決理由として裁判所は憲法の曖昧でおそらくは杜撰な文言が法の抜け穴を生み出し従来は許されないと考えられてきた行為を可能にしていると論じました。ただしこれはあくまで司法判断であるため[concept_government]は法案を可決してこれを覆すことができます。"
    
