    1948_Universal_Declaration_of_Human_Rights.t:0 "世界人権宣言"
    1948_Universal_Declaration_of_Human_Rights.d:0 "1948年12月10日、国際連合総会は世界人権宣言を採択しました。これはすべての人々の固有の尊厳と平等な権利をうたう画期的な文書です。第二次世界大戦の余波の中で起草されたこの宣言は基本的な自由と保護を定め、現代の国際人権法の礎となりました。"
    1960_UNGA_Resolution_1514.t:0 "植民地独立付与宣言"
    1960_UNGA_Resolution_1514.d:0 "1960年12月14日、国際連合総会は決議1514を採択し、すべての人民が自決と独立の権利を有すると宣言しました。この歴史的な決議は脱植民地化の流れを加速させ、数十もの国々が植民地支配から解放されるに至りました。"
    1961_UN_Committee_On_Decolonisation.t:0 "脱植民地化特別委員会"
    1961_UN_Committee_On_Decolonisation.d:0 "1961年11月27日、国際連合は決議1514の履行を監視する任を負った脱植民地化特別委員会を設置しました。24か国委員会とも呼ばれるこの委員会は、植民地主義の終焉と世界各地での自決権の承認を訴える中心的な機関となりました。"
    1970_UNGA_Resolution_2625.t:0 "友好関係原則宣言"
    1970_UNGA_Resolution_2625.d:0 "1970年10月24日、国際連合総会は決議2625を採択し、主権平等、内政不干渉、人民の自決権などの国際法上の原則を確認しました。この宣言は脱植民地化と国家間の平和的協力のための法的枠組みを強化しました。"
    2000_Millennium_Development_Goals.t:0 "ミレニアム開発目標"
    2000_Millennium_Development_Goals.d:0 "2000年9月8日、国際連合はミレニアム開発目標を採択しました。これは2015年までに貧困の削減、保健の改善、教育の普及を目指す8つの野心的な目標です。この取り組みは新世紀における開発と協力への世界的な決意を示すものでした。"
    historical_un_events.option.1:0 "本件へのご配慮に感謝する。"
    
    je_generic_decolonisation_overlord_system:0 "反植民地感情"
    je_generic_decolonisation_overlord_system_reason:0 "20世紀半ばは諸国が帝国支配を解体していく反植民地主義の時代でした。アフリカからアジアに至るまで、独立運動は同盟関係や冷戦戦略を塗り替えました。主権とは国境以上のものであり、資源・アイデンティティ・運命を自らの手に握るという要求でした。列強は急速に脱植民地化する世界への適応を迫られたのです。\n\n[ROOT.GetCountry.GetName]が[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]を領有しているため、これらの州の住民は民族自決か[ROOT.GetCountry.GetAdjective]市民としての完全な権利を要求しています。"
    
    je_generic_decolonisation_colonial_purge_button:0 "植民地粛清を実施"
    je_generic_decolonisation_colonial_purge_button_desc:0 "[ROOT.GetCountry.GetAdjective][concept_government]は植民地および主権を持たない[Concept('concept_subject', '$concept_subjects$')]において、反植民地運動の扇動者と支持者をすべて暴力的に粛清します。"
    
    je_generic_decolonisation_subject_system:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]民族主義"
    je_generic_decolonisation_subject_system_reason:0 "20世紀半ばは諸国が帝国支配を解体していく反植民地主義の時代でした。アフリカからアジアに至るまで、独立運動は同盟関係や冷戦戦略を塗り替えました。主権とは国境以上のものであり、資源・アイデンティティ・運命を自らの手に握るという要求でした。列強は急速に脱植民地化する世界への適応を迫られたのです。\n\n[ROOT.GetCountry.GetName]は外国勢力の植民地[concept_subject]であるため、[ROOT.GetCountry.GetAdjective]の先住民は独立を要求しています。"
    
    je_generic_decolonisation_civil_disobedience_button:0 "反植民地抗議を呼びかける"
    je_generic_decolonisation_civil_disobedience_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')][GetPlayer.GetRuler.GetFullName]はすべての[ROOT.GetCountry.GetAdjective]の人々に対し、[concept_overlord]への不服従を呼びかけます。"
    
    je_mandate_decolonisation_system:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]の委任統治領"
    je_mandate_decolonisation_system_reason:0 "委任統治領は第一次世界大戦後に国際的な監督下に置かれた地域として生まれ、多くは国際連盟を通じて植民地保有国が統治しました。\n\n過渡的な統治を意図したものでしたが、実際には後見の名の下で帝国の影響力を広げることも少なくありませんでした。\n\n冷戦期に入ると委任統治領を保有する国々は、それらに独立を認めるよう国際的な圧力を受けるようになりました。\n\n国際連合は[ROOT.GetCountry.GetName]による[concept_mandate]の恒久的な保有を認めていないため、すべての委任統治領が独立を認められるまで[ROOT.GetCountry.GetName]は外交制裁を受けます。"
    
