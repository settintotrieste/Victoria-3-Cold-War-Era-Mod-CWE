    je_G8_system:0 "[GetPlayer.MakeScope.Var('G8_members_counter').GetValue]カ国グループ"
    je_G8_system_reason:0 "グループ・オブ・[GetPlayer.MakeScope.Var('G8_members_counter').GetValue]は民主主義の[Concept('concept_major_power','$concept_major_powers$')]で構成される政府間の政治・経済フォーラムです。\n\n財務相による臨時の会合に端を発するG[GetPlayer.MakeScope.Var('G8_members_counter').GetValue]は、その後、世界的な重要課題、とりわけ貿易・安全保障・経済・気候変動の分野での解決策を協議し調整する、注目度の高い公式の場となりました。\n\nG[GetPlayer.MakeScope.Var('G8_members_counter').GetValue]は条約に基づくものではなく、常設の事務局や事務所も持ちません。運営は加盟国の間で毎年持ち回る議長国制によって行われ、議長国がグループの優先課題を定めてサミットを主催します。"
    
