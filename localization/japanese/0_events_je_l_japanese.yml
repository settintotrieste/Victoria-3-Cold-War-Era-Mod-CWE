    oil_cartel_desc_1: "[ROOT.GetCountry.GetAdjective]の石油・ガス産業は一握りの企業に支配されており、それらが[ROOT.GetCountry.GetName]における石油とガスの生産を独占しています。この力によって、これらの企業は[GetBuildingType('building_oil_rig').GetName]の産出量を調整することで国内の[GetGoods('oil').GetName]の価格を事実上決定できます。\n\nしかし[concept_government]は石油生産を規制し、民間企業ではなく[concept_government]が石油価格を決定するようにすることもできます。\n\n注：石油・ガス産業を規制すると[concept_government]が[GetGoods('oil').GetName]の生産枠を設定できるようになり、規制を緩和すると民間部門が[GetGoods('oil').GetName]の[concept_market_price]に基づいて生産枠を設定するようになります。"
    oil_cartel_desc_2: "[ROOT.GetCountry.GetName]の社会主義経済の下では、石油・ガス産業は石油省を通じて[concept_government]が直接管理・規制しています。これにより[concept_government]はすべての[GetBuildingType('building_oil_rig').GetName]の産出量を直接管理できます。"
    
