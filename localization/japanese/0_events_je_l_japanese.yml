    colonial_empire_bankroll.t:0 "[SCOPE.sCountry('colonial_empire_debtor').GetName]が財政支援を要請"
    colonial_empire_bankroll.d:0 "[SCOPE.sCountry('colonial_empire_debtor').GetName]の[concept_government]は深刻な財政難に直面しており[concept_overlord]からの財政支援を切実に必要としています。我々は[concept_overlord]として、その債務が完済され国民所得が黒字に転じるまで[SCOPE.sCountry('colonial_empire_debtor').GetAdjective]の国家財政を[concept_bankroll_subject]法的義務を負っています。"
