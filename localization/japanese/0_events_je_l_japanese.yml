    je_troubling_events_system_reason:0 "$generic_insurgency_custom_desc$\n\n[Concept('character_role_terrorist','$character_role_terrorists$')]は[ROOT.GetCountry.GetName]で定期的に#y テロ攻撃#!を行います。\n\n[concept_character]の[concept_interest_group]の[concept_clout]が#y 10％#!を超える場合、[concept_character_role_terrorist]は#y ゲリラ#!になることがあります。\n\n@information![concept_loyalty]が#y 25％#!を下回ると[concept_agitator]はテロリストになります。"
