    je_resident_general:0 "[ROOT.GetCountry.GetNameNoFlag]における外国の影響力"
    je_resident_general_reason:0 "一連の不幸な出来事の結果[ROOT.GetCountry.GetName]は外国勢力の影響下に置かれてしまいました。外国勢力の利益は彼らが[ROOT.GetCountry.GetName]に駐在させた外国の外交官によって守られており[concept_government]はその意見を無視できません。\n\n我々は[concept_autonomy]を#y 独立#!まで高める（我々が[concept_subject]である場合）か、他国と#y $dominate_politics$#!の[concept_diplomatic_pact]を結んでいる場合に#y $dp_end_dominate_politics$#!の[concept_diplomatic_play]を用いることで外国の影響力を排除できます。"
    
    resident_general_character_label.tt:0 "[SCOPE.sCharacter('resident_general_character_label').GetPrimaryRoleTitle]：[SCOPE.sCharacter('resident_general_character_label').GetFullName]（[SCOPE.sCharacter('resident_general_character_label').GetHomeCountry.GetName]）"
    
    resident_general_system:0 "統監制度"
    
    je_end_protectorate_button:0 "$protectorate$ステータスを終了する"
    je_end_protectorate_button_desc:0 "[ROOT.GetCountry.GetAdjective][concept_government]は完全な主権国家となり[concept_overlord]の影響下にはもはやないことを宣言します。[concept_overlord]がこの宣言を受け入れれば[ROOT.GetCountry.GetAdjective][concept_protectorate]は終了します。\n\n@warning![concept_overlord]が完全な主権の宣言を受け入れない場合[ROOT.GetCountry.GetName]は#y $dp_independence$#![concept_diplomatic_play]を宣言します。"
    
    protectorate_independence.t:0 "[SCOPE.sCountry('protectorate_subject_country').GetAdjectiveNoFlag][concept_protectorate]の終了？"
    protectorate_independence.d:0 "[SCOPE.sCountry('protectorate_subject_country').GetName]の[concept_government]は自らがもはや[ROOT.GetCountry.GetName]の[concept_protectorate]ではないとする一方的な宣言を発しました。[concept_overlord]である我々に残された選択肢は2つしかありません。[ROOT.GetCountry.GetAdjective]の影響力を拒む彼らを受け入れるか、武力によって彼らが[concept_protectorate]を終わらせるのを阻止するかです。"
    protectorate_independence.f:0 "[SCOPE.sCountry('protectorate_subject_country').GetName]がこの決定を下したのは[ROOT.GetCountry.GetName]との[concept_relations]が#r 敵対的#!であったか、[concept_liberty_desire]が#r 100#!に達していたためです。"
    
    protectorate_independence.option.1:0 "[SCOPE.sCountry('protectorate_subject_country').GetName]に別れを告げよう。"
    protectorate_independence.option.2:0 "我が軍が黙ってはいない。"
    
