    je_subverted_civil_service_1.tt:0 "官僚機構は切り崩され、その長は[concept_ruler]とイデオロギー的に一致する人物に交代します"
    je_subvert_civil_service:0 "官僚機構の粛清"
    je_subvert_civil_service_reason:0 "[ROOT.GetCountry.GetName]が$law_politicised_bureaucrats$[concept_law]を採用しているため、[concept_government]は[concept_government]で最も強力な[concept_interest_group]と同じイデオロギー的信条を持つ官僚を任命できます。つまり十分に長い時間が経てば、官僚機構は[concept_government]のイデオロギー的信条へ完全に染まることになります。\n\n毎月一定の確率で$ig_intelligentsia$の[concept_ideology]が[concept_government]で最も強力な[concept_interest_group]のものと一致するよう変更されます。"
    
    je_evolved_civil_service_3.tt:0 "$ig_intelligentsia$[concept_interest_group]が国内で最も強力な[concept_interest_group]と同じ[concept_ideology]を持っていない"
    je_evolved_civil_service_2.tt:0 "$ig_intelligentsia$[concept_interest_group]が国内で最も強力な[concept_interest_group]と同じ[concept_ideology]を持っている"
    je_evolved_civil_service_1.tt:0 "官僚機構はイデオロギーを変更し、その長は国内で最も強力な[concept_interest_group]の指導者とイデオロギー的に一致する人物に交代します"
    je_evolve_civil_service:0 "官僚機構の改革"
    je_evolve_civil_service_reason:0 "[ROOT.GetCountry.GetName]が$law_elitist_bureaucrats$[concept_law]を採用しているため、官僚の任命過程はエリート主義的かつ政治的なものとなっています。つまり十分に長い時間が経てば、官僚機構は[ROOT.GetCountry.GetName]で最も強力な[concept_interest_group]のイデオロギー的信条へ完全に染まることになります。\n\n毎月一定の確率で$ig_intelligentsia$の[concept_ideology]が[ROOT.GetCountry.GetName]で最も強力な[concept_interest_group]のものと一致するよう変更されます。" 
    
