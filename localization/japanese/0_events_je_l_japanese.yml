    change_dynamic_IG_ideology.t:0 "[concept_interest_group][Concept('concept_ideology','$concept_ideologies$')]の変化"
    change_dynamic_IG_ideology.d:0 "[Concept('concept_interest_group', '$concept_interest_groups$')]の[concept_leader]の[concept_ideology]により[ROOT.GetCountry.GetName]の特定の[Concept('concept_interest_group', '$concept_interest_groups$')]の[Concept('concept_ideology','$concept_ideologies$')]が変化しました。"
    change_dynamic_IG_ideology.f:0 "各[concept_interest_group]には持ちうる[concept_leader][concept_ideology]の種類ごとに[Concept('concept_ideology','$concept_ideologies$')]の一覧があらかじめ定められています。この変化は毎年1回適用されます。"
    
