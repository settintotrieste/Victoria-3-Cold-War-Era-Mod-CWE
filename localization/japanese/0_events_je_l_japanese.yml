    change_capital_BRZ_decision:0 "首都をブラジリアに移転"
    change_capital_BRZ_decision_desc:0 "ブラジリアは1956年にルシオ・コスタ、オスカー・ニーマイヤー、ジョアキン・カルドーゾによって設計された計画都市であり、首都をリオデジャネイロからより国土の中心に近い場所へ移すという構想の一環でした。"
    change_capital_BUR_decision:0 "首都をネピドーに移転"
    change_capital_BUR_decision_desc:0 "首都が移された理由にはいくつかの推測があります。ネピドーは旧首都ヤンゴンよりも国土の中央に位置しています。またシャン州、カヤー州、カイン州に隣接する交通の要衝でもあります。政府と軍の指導者たちは、近隣に軍と政府の強固な存在があれば慢性的に混乱の続くこれらの地域に安定をもたらせると考えたのです。"
    
    SEATO_form.t:0 "東南アジア条約機構？"
    SEATO_form.d:0 "東南アジア条約機構（SEATO）は東南アジアにおける共産主義のさらなる伸長を阻止することを主目的とし、東南アジアの集団防衛のために設立された国際機構です。1954年9月にフィリピンのマニラで署名された東南アジア集団防衛条約によって創設されました。正式な機構としてのSEATOは1955年2月19日にタイのバンコクで開かれた締約国会議において発足しました。本部もバンコクに置かれました。8か国がこの機構に加盟しました。"
    SEATO_form.f:0 "このイベントは各国を$USA$の勢力圏へ招請します。該当する場合は従属国の自治度を低下させ、そうでない場合は$USA$と参加国の間に$defensive_pact$を結びます。"
    CENTO_form.t:0 "中央条約機構？"
    CENTO_form.d:0 "中央条約機構（CENTO）は冷戦期の軍事同盟です。1955年2月24日にイラン、イラク、パキスタン、トルコ、イギリスによって結成され、1979年3月16日に解散しました。合意に至る交渉ではアメリカの圧力と軍事・経済援助の約束が決定的な役割を果たしましたが、アメリカ自身は当初参加できませんでした。"
    CENTO_form.f:0 "このイベントは各国を$USA$の勢力圏へ招請します。該当する場合は従属国の自治度を低下させ、そうでない場合は$USA$と参加国の間に$defensive_pact$を結びます。"
    indo_soviet_form.t:0 "インド・ソ連平和友好協力条約？"
    indo_soviet_form.d:0 "インド・ソ連平和友好協力条約は1971年8月にインドとソビエト連邦の間で署名された条約であり、相互の戦略的協力を定めたものです。これは冷戦下でインドが取ってきた非同盟の立場からの大きな転換であり、1971年の印パ戦争の一因ともなりました。この条約はパキスタンと中国およびアメリカとの結び付きが強まったことを受けて結ばれました。"
    cuban_soviet_form.t:0 "キューバのソ連核兵器？"
    cuban_soviet_form.d:0 "1962年5月、ソ連第一書記ニキータ・フルシチョフは、戦略ミサイルの開発と配備で優位を広げるアメリカに対抗するためソ連の中距離核ミサイルをキューバに配備するという案に動かされました。キューバ指導部はアメリカが再びキューバに侵攻してくると強く予想しており、核ミサイル配備の案を熱烈に承認しました。ソ連のR-12ミサイルの第一陣は9月8日の夜に到着し、9月16日には第二陣が続きました。R-12は熱核弾頭を搭載可能な準中距離弾道ミサイルでした。"
    USA_SPA_form.t:0 "マドリード協定？"
    USA_SPA_form.d:0 "1953年9月23日にフランコ体制下のスペインとアメリカ合衆国が調印したマドリード協定は、同年のコンコルダート（政教条約）とともに第二次世界大戦後のスペインの国際的孤立を打破する重要な試みでした。この協定は3つの個別の行政協定の形をとり、アメリカ合衆国がスペインに経済・軍事援助を提供することを約束するものでした。その見返りとして、アメリカ合衆国はスペイン領内に空軍基地と海軍基地を建設・使用することを認められました。"
    USA_ROC_form.t:0 "米華相互防衛条約？"
    USA_ROC_form.d:0 "米華相互防衛条約は、アメリカ合衆国と中華民国（台湾）の間で締結された防衛条約で、1955年から1980年まで効力を持ちました。その目的は中華人民共和国による侵攻から台湾島を防衛することでした。"
    SOV_PRC_form.t:0 "中ソ友好条約？"
    SOV_PRC_form.d:0 "中ソ友好同盟相互援助条約は、1950年2月14日に中華人民共和国とソビエト社会主義共和国連邦の間で締結された、同盟・集団安全保障・援助・協力に関する二国間条約です。"
    SOV_NVM_form.t:0 "ソ連・ベトナム友好条約？"
    SOV_NVM_form.d:0 "ソビエト連邦は東欧の衛星国や新たに成立した中華人民共和国とともに、第一次インドシナ戦争中の1950年1月にベトナム民主共和国を最初に外交承認した国でした。"
    USA_YUG_form.t:0 "米ユーゴの雪解け？"
    USA_YUG_form.d:0 "1948年のティトー＝スターリン決裂は、アメリカと新生社会主義共和国との関係における大きな転換点となりました。ユーゴスラビアは1948年夏に初めてアメリカへ支援を要請しました。トルーマン政権はユーゴスラビアに対して多額の援助、借款、軍事支援を行うことを決定しました。これは地域におけるソ連の野心に対抗するため、アメリカが共産主義国家へ軍事援助を行った最初の事例となり、米ユーゴ関係の一層の進展につながりました。ティトーはソ連の反対を押し切って1949年に国連安全保障理事会の議席獲得に成功しましたが、これにはアメリカの後押しがありました。1949年にアメリカはユーゴスラビアへ借款を供与し、1950年にはその額を増やしたうえで大規模な無償援助と軍事援助を続けました。"
    PRC_PB_form.t:0 "中華圏を形成する？"
    PRC_PB_form.d:0 "1956年、ソ連の指導者ニキータ・フルシチョフはスターリンとスターリン主義を批判しました。毛沢東ら中国指導部はこれに愕然とし、以後中華人民共和国とソ連はレーニン主義理論の解釈と適用をめぐって次第に対立を深めていきました。1961年には両国の埋めがたいイデオロギー上の相違から、中華人民共和国はソ連の共産主義を「修正主義の裏切り者」の所業として公式に非難するに至りました。東側諸国にとって中ソ対立とは、世界共産主義革命を誰が率いるのか、そして世界の前衛党が政治的助言や資金援助、軍事支援を中国とソ連のどちらに求めるのかという問題でした。こうして両国は、それぞれの勢力圏にある国々の前衛党を通じて世界共産主義の主導権を争いました。"
    NAM_PB_form.t:0 "非同盟運動？"
    NAM_PB_form.d:0 "非同盟運動（NAM）は冷戦下の対立の中で発展途上国の利益を推進することを目的に設立されました。設立から最初の30年間、この運動は脱植民地化や新たな独立国家の形成、そして国際関係の民主化において重要な役割を果たしました。"
    USA_SOV_INF.t:0 "中距離核戦力全廃条約？"
    USA_SOV_INF.d:0 "中距離核戦力全廃条約（INF条約）はアメリカ合衆国とソビエト連邦（およびその継承国であるロシア連邦）との間で結ばれた軍備管理条約です。1987年12月8日、アメリカのロナルド・レーガン大統領とソ連のミハイル・ゴルバチョフ書記長が条約に署名しました。アメリカ上院は1988年5月27日に条約を承認し、レーガンとゴルバチョフは1988年6月1日にこれを批准しました。INF条約は両国が保有する射程500～1,000キロメートル（310～620マイル）（短距離準中距離）および1,000～5,500キロメートル（620～3,420マイル）（中距離）の核・通常弾頭の地上発射型弾道ミサイル、巡航ミサイル、ミサイル発射機をすべて禁止しました。空中発射型および海洋発射型のミサイルには適用されませんでした。"
    USA_SOV_START.t:0 "戦略兵器削減条約？"
    USA_SOV_START.d:0 "START I（戦略兵器削減条約）は戦略攻撃兵器の削減と制限に関するアメリカ合衆国とソビエト連邦の二国間条約です。条約は1991年7月31日に署名され、1994年12月5日に発効しました。この条約により締約国は6,000発を超える核弾頭と合計1,600基を超える大陸間弾道ミサイル（ICBM）および爆撃機の配備を禁じられました。STARTは史上最大かつ最も複雑な軍備管理条約として交渉され、2001年末に最終的な履行が完了した結果、当時存在したすべての戦略核兵器の約80％が撤去されました。"
    USA_CNG_form.t:0 "コンゴ動乱への国連介入？"
    USA_CNG_form.d:0 "国際連合コンゴ活動（ONUC）は1960年にコンゴ動乱への対応としてコンゴ共和国に派遣された国連平和維持軍です。ONUCは本格的な軍事能力を備えた国連初の平和維持活動であり、規模と範囲において現在も最大級の国連活動のひとつです。"
    GBR_FPDA_form.t:0 "五カ国防衛取極？"
    GBR_FPDA_form.d:0 "五カ国防衛取極（FPDA）は英連邦諸国であるオーストラリア・マレーシア・ニュージーランド・シンガポール・イギリスの間で結ばれた一連の多国間協定により成立した二国間防衛関係の枠組みです。FPDAは1967年にイギリスがスエズ以東の軍を1971年11月1日までに撤退させると決定し、英・マラヤ防衛協定に基づくマラヤへの防衛保障が終了したことを受けて設けられました。五カ国防衛取極のもと加盟5カ国（オーストラリア・マレーシア・ニュージーランド・シンガポール・イギリス）はマレーシアとシンガポールに対する武力侵略が生じた場合に相互に協議することで合意しました。"
    USA_ANZUS_form.t:0 "ANZUS同盟？"
    USA_ANZUS_form.d:0 "太平洋安全保障条約（ANZUS条約）は1951年に調印されたオーストラリア・ニュージーランド・アメリカ合衆国の間の集団安全保障協定です。この条約はまず締約国が国際連合の目的を改めて遵守することを確認し、自衛の場合を除いて武力の行使や威嚇を禁じています。"
    vietnam_laos_form.t:0 "ラオス・ベトナム友好条約？"
    vietnam_laos_form.d:0 "1977年7月18日にビエンチャンで調印されたラオス・ベトナム友好協力条約はラオス人民民主共和国とベトナム社会主義共和国の緊密な同盟関係を正式なものとしました。この条約は政治・経済・文化・安全保障の各分野における長期的な協力を定めたもので、両国が独立のための共同闘争の中で築いた深い絆を反映しています。"
    turkey_northern_cyprus_form.t:0 "トルコのキプロス侵略？"
    turkey_northern_cyprus_form.d:0 "1974年7月20日、トルコはキプロスに侵攻し、作戦はその後1か月にわたって2段階で進められました。ギリシャ系とトルコ系のキプロス人による民族間の暴力を背景に、5日前にギリシャ軍事政権の後押しで起きたキプロスのクーデターへの対応として行われたこの侵攻により、トルコは島の北部を占領しました。"
    greece_cyprus_form.t:0 "キプロスの傀儡国？"
    greece_cyprus_form.d:0 "1974年7月15日、ギリシャ軍事政権の後押しを受けたキプロス国家警備隊が軍事クーデターを実行しました。首謀者たちは現職のキプロス大統領マカリオス3世大主教を解任し、エノシス（ギリシャへの併合）を支持する民族主義者ニコス・サンプソンを擁立しました。サンプソン政権は傀儡国と評され、その最終目的はギリシャによる島の併合でした。当面の措置として、クーデター派は「キプロス・ギリシャ共和国」の樹立を宣言しました。"
    
