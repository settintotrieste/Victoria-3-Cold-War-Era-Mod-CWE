    je_backbenchers_plot_system:0 "[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]に対する党内陰謀"
    je_backbenchers_plot_system_reason:0 "[ROOT.GetCountry.GetName]の議会制の下では[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]は[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の信任を得ている間のみ在職できます。\n\nこうした[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の信任は通常最大の[concept_party]の指導者であることによって得られます。\n\nしかし[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetPrimaryRoleTitle]の[concept_party]のメンバーは党内の指導権争いを起こして[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]を失脚させることがあります。\n\n@warning![SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]は以下の条件で失職します：\n\n- 陰謀の理由が犯罪に関係しない場合、タイマー終了時に[concept_government]内のいずれかの[concept_interest_group]の支持が#y 中立#!未満であるとき。または\n\n- 陰謀の理由が犯罪に関係する場合、[concept_government]の[concept_legitimacy]が#r 80％#!を下回ってはなりません。\n\n@information!失職した場合、[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetSheHe]が#y 犯罪#!を犯していれば[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]は[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]で裁判にかけられる可能性があります。"
    je_backbenchers_plot_system_1.tt:0 "[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]が失職します"
    je_backbenchers_plot_system_2.tt:0 "[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]が失職しません"
    je_backbenchers_plot_system_3.tt:0 "[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]は最近平議員の陰謀の標的になっていません"
    je_backbenchers_plot_system_4.tt:0 "[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]はもはや[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]ではありません"
    je_backbenchers_plot_system_5.tt:0 "[SCOPE.sCharacter('backbenchers_plot_prime_minister_scope').GetFullName]が腐敗しているか反逆者であるか不法に権力を掌握しているか、または[concept_government]内に不満を持つ[concept_interest_group]が1つ以上存在します"
    
