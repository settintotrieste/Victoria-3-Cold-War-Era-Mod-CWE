    je_OPEC_system:0 "石油輸出国機構"
    je_OPEC_system_reason:0 "1960年に設立された石油輸出国機構（OPEC）は、主要な産油国による連合体であり、市場を安定させ国際価格に影響を及ぼすためエネルギー政策を調整しています。生産量を管理することで、OPECは生産国に公正な利益を、消費国に安定した供給を確保しようとしています。\n\nその決定は国際貿易や産業の成長、地政学的関係にまで波及し、現代の資源外交における中心的存在となっています。\n\n加盟は各国に集団的な交渉力を与える一方で、国益と世界のエネルギー需要を両立させる複雑な交渉に各国を縛りつけ、石油の輸出入に依存する世界各国の経済の行方を左右します。\n\nメンバー総数：[GetGlobalVariable('OPEC_member_count').GetValue]"
    
    je_OPEC_increase_oil_quota_button:0 "石油生産枠の引き上げ"
    je_OPEC_increase_oil_quota_button_desc:0 "OPECの石油生産枠は、世界の供給を管理し価格を安定させるために石油輸出国機構が定めた合意上限です。OPECのリーダーである我々は、すべてのOPECメンバーの石油生産枠を決定できます。"
    
    je_OPEC_decrease_oil_quota_button:0 "石油生産枠の引き下げ"
    je_OPEC_decrease_oil_quota_button_desc:0 "OPECの石油生産枠は、世界の供給を管理し価格を安定させるために石油輸出国機構が定めた合意上限です。OPECのリーダーである我々は、すべてのOPECメンバーの石油生産枠を決定できます。"
    
    je_OPEC_ignore_oil_quota_button:0 "石油生産枠の無視"
    je_OPEC_ignore_oil_quota_button_desc:0 "OPECの石油生産割当量は世界の供給を管理し価格を安定させるために石油輸出国機構が定めた合意上限です。しかし我々は国益のためにこれを無視することもできます。"
    
    je_OPEC_restore_oil_quota_button:0 "石油割当量を遵守する"
    je_OPEC_restore_oil_quota_button_desc:0 "OPECの石油生産割当量は世界の供給を管理し価格を安定させるために石油輸出国機構が定めた合意上限です。現在我々はこの割当量を無視していますが他のOPEC加盟国の歓心を買うために遵守へ戻ることもできます。"
    
    OPEC_quota_timer.tt:0 "過去12か月以内にOPEC石油生産割当量を変更していません"
    OPEC_oil_quota_defiance_timer.tt:0 "過去12か月以内にOPEC石油生産割当量に違反していません"
    
    OPEC_oil_quota.t:0 "OPEC石油割当量の変更"
    OPEC_oil_quota.1.d:0 "[ROOT.GetCountry.GetName]が加盟する石油輸出国機構の議長がOPEC石油生産割当量の変更を発表しました。\n\n今後の石油生産割当量は「非常に低い」水準となります。"
    OPEC_oil_quota.2.d:0 "[ROOT.GetCountry.GetName]が加盟する石油輸出国機構の議長がOPEC石油生産割当量の変更を発表しました。\n\n今後の石油生産割当量は「低い」水準となります。"
    OPEC_oil_quota.3.d:0 "[ROOT.GetCountry.GetName]が加盟する石油輸出国機構の議長がOPEC石油生産割当量の変更を発表しました。\n\n今後の石油生産割当量は「中程度」の水準となります。"
    OPEC_oil_quota.4.d:0 "[ROOT.GetCountry.GetName]が加盟する石油輸出国機構の議長がOPEC石油生産割当量の変更を発表しました。\n\n今後の石油生産割当量は「高い」水準となります。"
    OPEC_oil_quota.5.d:0 "[ROOT.GetCountry.GetName]が加盟する石油輸出国機構の議長がOPEC石油生産割当量の変更を発表しました。\n\n今後の石油生産割当量は「非常に高い」水準となります。"
    OPEC_oil_quota.f:0 "OPECの石油生産割当はOPECのリーダーによって決定されます。\n\n[ROOT.GetCountry.GetName]はOPECの加盟国であるため、条約によってその割当に従う義務を負っています。\n\nしかし条約を無視し、望むだけ石油を汲み上げることもできます。その代償として多少の悪名を負い、他のOPEC加盟国との関係が悪化します。"
    OPEC_accept_quota:0 "割当に忠実に従う"
    OPEC_reject_quota:0 "割当に従うことは拒否する。石油を自由に流せ！"
    
