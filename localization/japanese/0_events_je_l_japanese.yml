    USA_civil_rights_movement.t:0 "公民権運動"
    USA_civil_rights_movement.d:0 "公民権運動は1954年から1968年にかけてアメリカ合衆国で展開された社会運動であり、法制化された人種隔離・差別・選挙権剥奪の撤廃を目指すものでした。この運動の起源は19世紀後半の再建期にさかのぼり、1940年代に現代的な基盤が築かれましたが、最大の立法上の成果を挙げたのは長年にわたる直接行動と草の根の抗議を経た1960年代のことでした。非暴力抵抗と市民的不服従による主要な運動は最終的に連邦法においてすべてのアメリカ国民の公民権に対する新たな保護を勝ち取りました。"
    USA_assassinate_MLK.t:0 "マーティン・ルーサー・キング・ジュニア暗殺？"
    USA_assassinate_MLK.d:0 "アフリカ系アメリカ人の聖職者で公民権運動の指導者であったマーティン・ルーサー・キング・ジュニアは1968年4月4日午後6時1分（中部標準時）にテネシー州メンフィスのロレイン・モーテルで銃撃され致命傷を負いました。彼はセント・ジョセフ病院に急送されましたが午後7時5分に死亡しました。彼は公民権運動の著名な指導者であり、非暴力と市民的不服従を貫いたことで知られるノーベル平和賞受賞者でした。"
    USA_blm_protests.t:0 "ジョージ・フロイド抗議運動"
    USA_blm_protests.d:0 "ジョージ・フロイド抗議運動は、2020年5月26日にアメリカ合衆国のミネアポリスで始まった警察の暴力に対する一連の抗議活動です。この市民騒乱と抗議活動は、46歳のアフリカ系アメリカ人男性ジョージ・フロイドが逮捕の際に殺害されたことへの国際的な反応の一部として始まりました。抗議活動はブラック・ライヴズ・マター（BLM）運動を支持してたちまち全米に広がり、60か国以上の2,000を超える都市や町にまで波及しました。世論調査によれば、アメリカ国内でデモに参加した人は延べ1,500万人から2,600万人に上ると推計されており、この抗議活動はアメリカ史上最大規模のものとなりました。"
    GBR_1967_HKG_riots.t:0 "香港反植民地暴動"
    GBR_1967_HKG_riots.d:0 "1967年香港暴動は、イギリスの植民地支配下にあった香港で発生した大規模な反政府暴動です。小規模な労働争議として始まったデモは、やがて植民地政府に対する抗議へと拡大しました。この抗議活動は、数か月前にポルトガル領マカオで起きた反植民地デモの成功に一部触発されたものでした。"
    POR_1966_MCA_riots.t:0 "12・3事件"
    POR_1966_MCA_riots.d:0 "12・3事件は、1966年12月3日にマカオで発生したポルトガルの植民地支配に対する一連の政治デモと暴動です。中華人民共和国（中国本土）の文化大革命に触発されたこの事件は、マカオの汚職と植民地主義に抗議していた現地の中国人デモ参加者を植民地当局が警察力で暴力的に弾圧したことへの直接の反発として起こりました。"
    PRC_2014_HKG_protests.t:0 "雨傘運動"
    PRC_2014_HKG_protests.d:0 "雨傘革命と呼ばれることが多く、雨傘運動や占領運動とも呼ばれる一連の路上座り込み抗議が2014年9月26日から12月15日にかけて香港で発生しました。抗議は全国人民代表大会常務委員会（NPCSC）が香港の選挙制度改革案に関する決定を下したことを受けて始まりました。この決定は極めて制限的であり、中国共産党（CCP）による香港行政長官候補者の事前審査に等しいものと広く受け止められました。"
    PRC_2019_HKG_protests.t:0 "香港民主化デモ"
    PRC_2019_HKG_protests.d:0 "2019～2020年香港民主化デモは、香港政府が犯罪人引き渡しに関する逃亡犯条例の改正案を提出したことに反対する一連のデモです。これは香港史上最大規模のデモとなりました。抗議者はキャリー・ラム行政長官の辞任と、立法会選挙および行政長官選挙における普通選挙の実施を要求しました。"
    protests_of_1968.t:0 "1968年の抗議運動"
    protests_of_1968.d:0 "1968年の抗議運動は世界規模で社会対立が激化したもので、主に左派政治の台頭、反戦感情、公民権運動の高まり、沈黙の世代とベビーブーム世代における若者の対抗文化、そして国家の軍隊や官僚機構に対する民衆の反乱によって特徴づけられます。"
    JAP_Sanrizuka_Struggle.t:0 "三里塚闘争"
    JAP_Sanrizuka_Struggle.d:0 "三里塚闘争とは日本政府と三里塚の農村共同体との間で起きた紛争と暴動を指し、成田国際空港（当時は新東京国際空港）の建設に対して農民・地域住民・左翼団体が組織的に反対したものです。この闘争は、政府が地域住民の大半の関与も同意も得ずに三里塚への空港建設を決定したことに端を発しています。"
    JAP_sarin_attack.t:0 "地下鉄サリン事件"
    JAP_sarin_attack.d:0 "地下鉄サリン事件は1995年3月20日に日本の東京でカルト教団オウム真理教の信者たちによって引き起こされた国内テロ事件です。実行犯は5か所で同時に攻撃を行い、ラッシュアワーの東京メトロ（当時は帝都高速度交通営団）の3路線でサリンを散布しました。この事件で13人が死亡し、50人が重傷を負い（うち数人は後に死亡）、1,000人近くが一時的な視覚障害に見舞われました。"
    USA_WTC_attack_1993.t:0 "世界貿易センター爆破事件"
    USA_WTC_attack_1993.d:0 "1993年の世界貿易センター爆破事件は1993年2月26日に起きたテロ攻撃で、ニューヨーク市の世界貿易センターの北棟の地下でバンに積まれた爆弾が爆発しました。重さ1,336ポンド（606kg）の尿素硝酸塩と水素ガスによる強化型爆弾は北棟を隣の南棟へ倒壊させ、両方の超高層ビルを崩落させて数万人を殺害することを狙っていました。その目論見は失敗したものの、妊婦を含む6人が死亡し、1,000人以上が負傷しました。"
    USA_WTC_attack_2001.t:0 "アメリカ同時多発テロ事件"
    USA_WTC_attack_2001.d:0 "アメリカ同時多発テロ事件は2001年にアルカイダがアメリカ合衆国に対して実行した、イスラム主義者による4件の同時自爆テロです。その朝、19人のテロリストが東海岸のニューイングランドおよび中部大西洋岸地域からカリフォルニアへ向かう予定の旅客機4機をハイジャックしました。ハイジャック犯は最初の2機をニューヨーク市の世界貿易センターのツインタワーに激突させ、続く2機を首都攻撃のためワシントンD.C.またはその近郊の標的へ向かわせました。3番目のグループは米国防総省の本部であるペンタゴンへの突入に成功しましたが、4機目は乗客の抵抗によりペンシルベニア州の田園地帯に墜落しました。"
    GBR_London_attack_2005.t:0 "ロンドン同時爆破事件"
    GBR_London_attack_2005.d:0 "2005年7月7日のロンドン同時爆破事件は「7/7」とも呼ばれ、イスラム過激派のテロリストが朝の通勤ラッシュ時にロンドンの公共交通機関を利用する通勤客を狙って実行した、4件の組織的な自爆テロです。3人のテロリストがインナー・ロンドンを走るロンドン地下鉄の車内で、手製爆弾3発を相次いで別々に爆発させました。その後、4人目のテロリストがタヴィストック・スクエアで2階建てバスの車内で爆弾を爆発させました。"
    GBR_Brighton_attack_1984.t:0 "ブライトン・ホテル爆破事件"
    GBR_Brighton_attack_1984.d:0 "1984年10月12日、アイルランド共和軍暫定派（IRA）はイングランドのブライトンにあるグランド・ホテルで英国政府要人の暗殺を企てました。マーガレット・サッチャー首相と閣僚たちが保守党大会のために到着する前に、パトリック・マギーが長時間の遅延式時限爆弾をホテルに仕掛けていたのです。保守党の下院議員で副院内総務長のサー・アンソニー・ベリーを含む5人が死亡し、さらに31人が負傷しました。サッチャーは間一髪で爆発を逃れました。"
    GER_Munich_Massacre_1972.t:0 "ミュンヘン事件"
    GER_Munich_Massacre_1972.d:0 "ミュンヘン事件は、西ドイツのミュンヘンで開かれた1972年夏季オリンピックの期間中に、パレスチナの武装組織「黒い九月」のメンバー8人が起こしたテロ事件です。彼らは選手村に侵入してイスラエル選手団の2人を殺害し、さらに9人を人質に取りました。"
    RUS_Moscow_attack_1999.t:0 "ロシア高層アパート連続爆破事件"
    RUS_Moscow_attack_1999.d:0 "ロシア高層アパート連続爆破事件は、1999年9月にロシアの都市ブイナクスク、モスクワ、ヴォルゴドンスクで4棟の集合住宅を襲った一連の爆発で、300人以上が死亡し1,000人以上が負傷して、国中に恐怖が広がりました。この爆破事件はダゲスタン侵攻とともに第二次チェチェン戦争の引き金となりました。当時首相だったウラジーミル・プーチンは危機への対応で人気を大きく高め、数か月のうちに大統領の座に就きました。"
    HND_Bombay_attack_1993.t:0 "ボンベイ同時爆破事件"
    HND_Bombay_attack_1993.d:0 "1993年ボンベイ同時爆破事件は、1993年3月12日にマハーラーシュトラ州ボンベイ（現ムンバイ）で発生した12件の連続爆弾テロです。この1日の攻撃で257人が死亡し1,400人が負傷しました。攻撃を指揮したのは、ムンバイを拠点とする国際犯罪組織Dカンパニーの首領ダーウード・イブラーヒームでした。"
    IDO_Bali_attack_2002.t:0 "バリ島爆弾テロ事件"
    IDO_Bali_attack_2002.d:0 "2002年10月12日、インドネシアのバリ島の観光地クタで連続爆破事件が発生しました。この攻撃で202人（オーストラリア人88人、インドネシア人38人、イギリス人23人のほか20以上の国籍の人々）が死亡し、さらに209人が負傷しました。過激派イスラム主義組織ジェマ・イスラミアの構成員らがこの事件に関して有罪判決を受け、うち3人には死刑が言い渡されました。"
    FRA_Paris_attack_1995.t:0 "フランスのイスラム過激派による連続爆弾テロ"
    FRA_Paris_attack_1995.d:0 "1995年、パリとリヨンの公共交通機関およびヴィルールバンヌの学校を標的とした一連の攻撃が行われました。実行したのはアルジェリア内戦をフランスへ拡大しようとしたアルジェリアの武装イスラム集団（GIA）です。死者8人はすべて7月25日の最初の攻撃によるもので、この攻撃では190人も負傷しました。"
    USA_Oklahoma_attack_1995.t:0 "オクラホマシティ連邦政府ビル爆破事件"
    USA_Oklahoma_attack_1995.d:0 "オクラホマシティ連邦政府ビル爆破事件は、ウェーコ包囲事件の終結から2年目にあたる1995年4月19日、アメリカ合衆国オクラホマ州オクラホマシティのアルフレッド・P・マラー連邦ビルに対して行われた、トラック爆弾による国内テロです。この爆破事件は2001年のアメリカ同時多発テロ以前ではアメリカ史上最悪のテロ行為でした。反政府過激派で白人至上主義者のティモシー・マクベイとテリー・ニコルズによって実行され、午前9時2分に発生したこの爆破で168人が死亡、680人が負傷し、建物の3分の1以上が破壊されたため取り壊しを余儀なくされました。"
    HND_Operation_Blue_Star.t:0 "ブルースター作戦？"
    HND_Operation_Blue_Star.d:0 "ブルースター作戦は1984年6月1日から10日にかけてインド軍が実施した作戦で、シク教過激派のジャルネイル・シン・ビンドランワレら分離主義者を、シク教最高の聖地である黄金寺院の建物から排除することを目的としていました。寺院の敷地内での軍事行動は世界中のシク教徒から批判され、シク教とシク教徒社会全体への攻撃と受け止められました。"
    HND_Anti_Sikh_Riots.t:0 "反シク教徒暴動"
    HND_Anti_Sikh_Riots.d:0 "1984年の反シク教徒暴動は1984年シク教徒虐殺とも呼ばれ、インディラ・ガンディーがシク教徒の護衛に暗殺されたことを受けてインド各地で起きた、シク教徒に対する一連の組織的なポグロムです。政府の推計ではデリーで約2,800人、全国で3,350人のシク教徒が殺害されました。"
    ITA_Piazza_Fontana_attack_1969.t:0 "フォンターナ広場爆破事件"
    ITA_Piazza_Fontana_attack_1969.d:0 "フォンターナ広場爆破事件は1969年12月12日に発生したテロ事件で、イタリア・ミラノのフォンターナ広場（ドゥオーモ近く）にある国立農業銀行の本店で爆弾が爆発し、17人が死亡、88人が負傷しました。実行したのは「第三の立場」を掲げるネオファシストの準軍事テロ組織「オルディネ・ヌオーヴォ（新秩序）」で、身元不明の協力者がいた可能性もあります。"
    HND_assassinate_MKG.t:0 "マハトマ・ガンディー暗殺？"
    HND_assassinate_MKG.d:0 "1948年1月30日午後5時17分、ガンディーは祈祷集会で演説するため、姪孫たちとビルラー邸（現ガンディー・スムリティ）の庭を歩いていました。そこへヒンドゥー民族主義者のナトゥーラーム・ゴードセーが現れ、至近距離から拳銃でガンディーの胸に3発の銃弾を撃ち込みました。一説にはガンディーは即死したとされています。"
    USA_taft_act.t:0 "タフト＝ハートレー法？"
    USA_taft_act.d:0 "1947年労使関係法は、タフト＝ハートレー法の名で広く知られる、労働組合の活動と権限を制限するアメリカ合衆国の連邦法です。第80回合衆国議会がハリー・S・トルーマン大統領の拒否権を覆して可決し、1947年6月23日に成立しました。タフト＝ハートレー法は1945年から1946年にかけて起きた大規模なストライキの波を受けて提出されたものです。"
    PRC_tibetan_uprising.t:0 "チベット蜂起"
    PRC_tibetan_uprising.d:0 "1959年のチベット蜂起は1959年3月10日に始まりました。1951年の十七か条協定締結以来、中華人民共和国（PRC）の実効支配下にあったチベットの首都ラサで反乱が勃発したのです。当初の蜂起は中国とチベットの全般的な緊張と混乱のさなかに起こりました。中国政府がダライ・ラマ14世を逮捕するのではないかとチベットの抗議者たちが恐れたためです。抗議運動は反中感情と分離主義によっても勢いづきました。"
    HND_tibetan_movement.t:0 "ダライ・ラマの亡命？"
    HND_tibetan_movement.d:0 "1959年のチベット蜂起が始まると、身の危険を感じたダライ・ラマと側近たちはCIA特殊活動部の支援を受けてチベットを脱出しました。一行は1959年3月30日にインドへ入り、4月18日にアッサムのテズプルに到着しました。その後、ダライ・ラマはインドのダラムサラにチベット亡命政府を樹立しました。この地はしばしば「リトル・ラサ」と呼ばれます。亡命政府の樹立後、ダライ・ラマは自身に従って亡命した約8万人のチベット難民を農業入植地に定住させました。"
    HND_tibetan_movement.option.1:0 "インドにいさせておけ。"
    HND_tibetan_movement.option.2:0 "お断りだ！"
    POL_pope_movement.t:0 "教皇ヨハネ・パウロ2世の選出？"
    POL_pope_movement.d:0 "教皇ヨハネ・パウロ2世は反共産主義の精神的な拠り所となりました。1979年の祖国ポーランド訪問は自主管理労働組合「連帯」を中心とする宗教的・民族主義的な高揚を呼び起こし、反体制派を奮い立たせました。これが2年後の教皇暗殺未遂事件につながったとも言われています。"
    POL_pope_movement.option.1:0 "あの男は厄介者だ！"
    POL_pope_movement.option.2:0 "ある程度の信教の自由を認める。"
    POL_solidarity_movement.t:0 "「連帯」運動"
    POL_solidarity_movement.d:0 "「連帯」は1980年8月にポーランドのグダニスクにあるレーニン造船所で結成されたポーランドの労働組合です。組合員数は1981年9月に1000万人に達し、国の生産年齢人口の3分の1を占めました。1980年代の「連帯」は広範な反権威主義の社会運動であり、市民的抵抗の手法を用いて労働者の権利と社会変革を推し進めました。1980年代初頭、政府はポーランドに戒厳令を敷き政治弾圧を行うことで組合の壊滅を図りました。"
    AFG_mujahideen_movement.t:0 "アフガン・ムジャーヒディーン"
    AFG_mujahideen_movement.d:0 "アフガン・ムジャーヒディーンは、ソ連・アフガン戦争とそれに続く第一次アフガン内戦においてアフガニスタン民主共和国およびソビエト連邦と戦ったイスラム主義の抵抗組織です。"
    JAP_recruit_scandal.t:0 "リクルート事件"
    JAP_recruit_scandal.d:0 "リクルート事件はインサイダー取引と汚職をめぐる疑獄事件であり、1988年に多くの有力な日本の政治家が辞任に追い込まれました。事件に関与した政治家には竹下登首相、中曽根康弘元首相、藤波孝生元内閣官房長官などが含まれます。自民党政権の議員に加え、公明党、民社党、日本社会党の幹部の関与も明らかになりました。"
    ITA_maxi_trial.t:0 "マキシ裁判？"
    ITA_maxi_trial.d:0 "マキシ裁判はシチリアのパレルモで行われたシチリア・マフィアに対する刑事裁判です。裁判は1986年2月10日（重罪院の初日）から1992年1月30日（最高破毀院の最終日）まで続き、ウッチャルドーネ刑務所の敷地内にこのために特設された掩蔽壕型の法廷で開かれました。"
    GBR_poll_tax_riots.t:0 "人頭税？"
    GBR_poll_tax_riots.d:0 "人頭税暴動は、マーガレット・サッチャー首相率いる保守党政権が導入したコミュニティ・チャージ（通称「人頭税」）への抗議活動の最中にイギリス各地の町や都市で起きた一連の暴動です。最大の抗議は、イングランドとウェールズで同税が施行される直前の1990年3月31日土曜日にロンドン中心部で起こりました。"
    FRA_yellow_vests.t:0 "黄色いベスト運動"
    FRA_yellow_vests.d:0 "黄色いベスト運動は2018年11月17日に始まった、フランスにおけるポピュリスト的な草の根の週次抗議行動です。当初は原油・燃料価格の高騰や生活費の高さ、経済的不平等が運動の動機でした。運動はフランスの税負担が労働者層と中間層、とりわけ農村部や都市近郊部に不均衡にのしかかっていると主張しました。抗議者たちは燃料税の引き下げ、富裕税（連帯富裕税）の復活、最低賃金の引き上げなどを要求しました。"
    RUS_Khodorkovsky_Case.t:0 "ミハイル・ホドルコフスキー裁判？"
    RUS_Khodorkovsky_Case.d:0 "2001年、ホドルコフスキーは国内の「市民社会の構築と強化」を目指す改革派の組織「オープン・ロシア」を設立しました。2003年10月、彼はロシア当局に逮捕され、詐欺罪で起訴されました。その直後、ウラジーミル・プーチン大統領の政府は脱税容疑でユコスの株式を凍結しました。プーチン政権はユコスへの措置をさらに強め、同社の株価は暴落し、ホドルコフスキーの資産の大半が消え去りました。2005年5月、彼は有罪判決を受け、禁錮9年を言い渡されました。"
    RUS_Politkovskaya_murder.t:0 "アンナ・ポリトコフスカヤ暗殺？"
    RUS_Politkovskaya_murder.d:0 "2006年10月7日、ロシアのジャーナリストで作家、人権活動家でもあるアンナ・ポリトコフスカヤがモスクワ中心部の自宅アパートのエレベーター内で射殺されました。彼女はチェチェン紛争への反対とウラジーミル・プーチンへの批判で知られていました。チェチェン戦争に関する著書や『プーチニズム』などを執筆し、その活動により数々の国際的な賞を受けました。請負殺人とみられる彼女の殺害は国際社会から強い反発を招きました。"
    RUS_snow_revolution.t:0 "雪の革命？"
    RUS_snow_revolution.d:0 "雪の革命は2011年に（2011年ロシア下院選挙の結果への抗議として）始まり、2012年から2013年にかけて続きました。抗議の発端は、ロシア内外のジャーナリストや政治活動家、一般市民による選挙不正の告発でした。"
    RUS_Navalny_murder.t:0 "アレクセイ・ナワリヌイの死？"
    RUS_Navalny_murder.d:0 "アレクセイ・アナトリエヴィチ・ナワリヌイはロシアの野党指導者であり弁護士、反汚職活動家、そして政治犯でした。2021年1月にロシアへ帰国したナワリヌイは、ドイツで入院していた間に執行猶予の条件に違反したとして直ちに拘束されました。2023年8月には過激主義の罪でさらに懲役19年の判決を受けました。2023年12月、ナワリヌイは3週間近く刑務所から所在不明となり、その後ヤマロ・ネネツ自治管区にある北極圏の矯正収容所で再び姿を現しました。2024年2月16日、ロシア刑務所庁はナワリヌイが47歳で死亡したと発表しました。"
    BYE_Minsk_attack_2011.t:0 "ミンスク地下鉄爆破事件"
    BYE_Minsk_attack_2011.d:0 "2011年ミンスク地下鉄爆破事件は2011年4月11日にベラルーシのミンスク地下鉄で爆弾が爆発し、15人が死亡、204人が負傷した事件です。爆発は現地時間17時55分、中心部のカストルィチニツカヤ駅で発生しました。検察庁は刑事捜査を開始し、この事件をテロ攻撃と認定しました。4月13日に逮捕された容疑者2人は爆破を自白しましたが、動機は不明なままでした。2012年3月、実行犯のジミトリー・カナヴァラウとウラジスラウ・カヴァリョウの両名は銃殺刑に処されました。"
    BYE_May_Protests.t:0 "五月の大規模抗議"
    BYE_May_Protests.d:0 "2020～2021年ベラルーシ抗議運動は、ベラルーシ政府とアレクサンドル・ルカシェンコ大統領に対する一連の大規模な政治デモと抗議活動です。ベラルーシ史上最大の反政府抗議となったこのデモは、ルカシェンコが6選を目指した2020年大統領選挙の前から選挙期間中にかけて始まりました。これに対抗して比較的小規模な政府支持集会もいくつか開かれました。"
    JAP_1970_uprising.t:0 "三島由紀夫によるクーデター未遂"
    JAP_1970_uprising.d:0 "1970年11月25日、三島と彼の民兵組織の4人は東京都心の自衛隊駐屯地に入り、総監を人質に取り、自衛隊に決起して日本の1947年憲法（三島はこれを「敗戦憲法」と呼んでいました）を打倒するよう促しましたが、失敗に終わりました。演説を行い「天皇陛下万歳！」と叫んだ後、彼は割腹自決しました。"
    USA_assassinate_DJT.t:0 "ドナルド・トランプ暗殺未遂事件"
    USA_assassinate_DJT.d:0 "2024年7月13日、元アメリカ合衆国大統領で2024年大統領選挙における共和党の事実上の候補者であったドナルド・トランプは、ペンシルベニア州バトラー近郊での屋外選挙集会で演説中に暗殺未遂に遭い、一命を取り留めました。"
    PER_big_party.t:0 "ペルシア帝国建国2500年祭？"
    PER_big_party.d:0 "ペルシア帝国建国2500年祭は、キュロス大王による古代アケメネス朝の建国を祝うため、1971年10月にイランで催された一連の壮麗な祝典からなる国家行事でした。この祝典の目的は、イランの古代文明と歴史を際立たせるとともに、シャー・モハンマド・レザー・パフラヴィーの下での近代的な発展を誇示することにありました。"
    ISR_assassinate_YR.t:0 "イツハク・ラビン暗殺？"
    ISR_assassinate_YR.d:0 "1992年、ラビンはイスラエル・パレスチナ和平プロセスの推進を掲げて首相に再選されました。彼はオスロ合意の一環としてパレスチナ指導部といくつかの歴史的な協定に調印しました。1994年、ラビンは長年の政敵シモン・ペレスおよびパレスチナの指導者ヤーセル・アラファートとともにノーベル平和賞を受賞しました。同年にはヨルダンとの平和条約にも調印しています。1995年11月、彼はオスロ合意の内容に反対する過激派のイガル・アミルによって暗殺されました。"
    USA_assassinate_DJT_2.t:0 "ドナルド・トランプ暗殺未遂事件（2度目）"
    USA_assassinate_DJT_2.d:0 "2024年9月15日、フロリダ州ウェストパームビーチのゴルフクラブでドナルド・トランプが暗殺未遂の標的となりました。共和党の大統領候補である彼が別の暗殺未遂を生き延びてから、わずか9週間後のことでした。トランプがプレーしていた位置から数ホール先に配置されていたシークレットサービスの警護官が、約400ヤード離れたコース沿いの植え込みからAK系ライフルの銃口が突き出ているのに気付きました。パームビーチ郡のリック・ブラッドショー保安官によれば、警護官が発砲すると犯人はライフルを捨ててSUVで逃走し、銃のほかリュックサック2つ、照準用のスコープ、GoProカメラを現場に残していきました。男はその後、隣接する郡で警察に身柄を拘束されました。"
    GBR_diana_death.t:0 "ダイアナ元皇太子妃の死"
    GBR_diana_death.d:0 "1997年8月31日未明、ダイアナ元皇太子妃はその夜フランス・パリのアルマ橋トンネルで起きた自動車事故で負った傷がもとで亡くなりました。ダイアナの恋人ドディ・アルファイドと、メルセデス・ベンツW140を運転していたアンリ・ポールは車内で死亡しているのが発見されました。ドディのボディーガードであるトレヴァー・リース＝ジョーンズは重傷を負い、事故の唯一の生存者となりました。ダイアナは36歳でした。彼女の死はイギリス国内と世界中に深い悲しみを呼び起こし、テレビ中継された葬儀は推定25億人が視聴しました。"
    GBR_diana_death.option.1:0 "彼女は国民のプリンセスだった！"
    GBR_diana_death.option.2:0 "王族の死を悼む。"
    IRQ_civil_war_2006.t:0 "イラク内戦"
    IRQ_civil_war_2006.d:0 "イラク内戦は2006年から2008年にかけて、イラク・イスラム国やマフディー軍などシーア派とスンニ派の宗派的な武装集団のほか、イラク政府とアメリカ主導の有志連合軍の間で戦われた武力紛争です。2006年2月、十二イマーム派の聖地とされるアスカリ廟が爆破されたことを機に、有志連合と政府に対する反乱は宗派間の内戦へと拡大しました。"
    JOR_civil_war_1970.t:0 "黒い九月"
    JOR_civil_war_1970.d:0 "黒い九月事件は、フセイン国王率いるヨルダンとヤーセル・アラファト議長率いるパレスチナ解放機構（PLO）との間で起きた武力紛争です。1970年9月17日、ヨルダン軍はアンマンやイルビドなどPLOが大きな勢力を持つ都市を包囲し、パレスチナ難民キャンプを拠点に活動するフェダイーンの陣地への攻撃を開始しました。フェダイーンは都市から次々と駆逐され、7月23日のアジュルーン攻勢で包囲された2,000人が降伏したことで紛争は正式に終結しました。ヨルダンはフェダイーンがシリア経由でレバノンへ移ることを認め、彼らは後にレバノン内戦に関与することになります。"
    GUA_civil_war_1960.t:0 "グアテマラ内戦"
    GUA_civil_war_1960.d:0 "グアテマラ内戦は、1960年から1996年にかけてグアテマラ政府と複数の左派反乱勢力との間で戦われた内戦です。内戦中、グアテマラ政府軍はマヤ系住民に対するジェノサイドを行ったとされ、民間人への人権侵害も広く行われました。この争いの背景には、長年にわたる不公平な土地分配の問題がありました。主にヨーロッパ系の裕福なグアテマラ人や、アメリカのユナイテッド・フルーツ社などの外国企業が土地の大半を支配していました。彼らはその見返りに税をほとんど納めておらず、劣悪な条件で土地を耕す農村の貧しい先住民との対立を招きました。"
    COS_civil_war_1948.t:0 "コスタリカ内戦"
    COS_civil_war_1948.d:0 "コスタリカ内戦は1948年3月12日から4月24日にかけて起こりました。この紛争は1948年2月8日の大統領選挙に端を発します。この選挙では野党候補のオティリオ・ウラテが与党のラファエル・アンヘル・カルデロン・グアルディアを破りました。立法議会の多数を占める与党派議員はウラテの勝利を不正によるものだと主張し、3月1日に議会は選挙結果の無効を議決しました。これを受けて選挙に参加していなかった実業家ホセ・フィゲーレス・フェレールが、テオドロ・ピカド大統領の政府に対する武装蜂起を率いました。戦後フィゲーレスは軍を解体し、臨時政府評議会の議長として18か月にわたり国を統治しました。評議会の下で12月には憲法制定議会の選挙が行われ、同議会は1949年に新憲法を採択しました。その後評議会は解散し、権力は新たな立憲大統領となったウラテへ移譲されました。"
    AFG_civil_war_1979.t:0 "アフガン抵抗運動"
    AFG_civil_war_1979.d:0 "1978年4月27日、アフガニスタン人民民主党（PDPA）とそれに忠実な軍部隊は暴力的なクーデターでダーウード・ハーンとその家族および護衛を殺害し、首都カーブルを掌握してアフガニスタン民主共和国（DRA）の樹立を宣言しました。革命評議会が率いる新たな共産主義政府は民衆の支持を得られませんでした。宗教指導者たちが政府に対するジハードを宣言する中、1979年5月にアフマド・シャー・マスードはパンジシールで新共産主義政府に対抗すべく、ペシャワールで準備を進めていました。"
    PAL_assassinate_YA.t:0 "ヤーセル・アラファトの死？"
    PAL_assassinate_YA.d:0 "ヤーセル・アラファートはパレスチナの政治指導者です。1969年から2004年までパレスチナ解放機構（PLO）の議長を、1994年から2004年までパレスチナ自治政府（PNA）の大統領を務めました。思想的にはアラブ民族主義者かつ社会主義者であり、ファタハの創設メンバーとして1959年から2004年まで同党を率いました。アラファートは短い闘病の末、2004年11月11日に75歳で急逝しました。その死因はその後も議論の的となり、さまざまな説が唱えられてきました。しかしフランスとロシアの調査団による公式調査では、他殺の証拠は見つかりませんでした。"
    CNG_assassinate_LDK.t:0 "ローラン・カビラ暗殺？"
    CNG_assassinate_LDK.d:0 "コンゴ民主共和国大統領ローラン＝デジレ・カビラは、2001年1月16日にキンシャサの大理石宮殿にある公邸内の執務室で暗殺されました。実行犯は18歳の護衛ラシディ・ミゼレで、以前はラシディ・カセレカとも特定されていました。ミゼレはその後射殺されました。1週間後カビラの遺体は国葬のためコンゴへ戻され、その10日後に息子のジョゼフ・カビラが大統領に就任しました。"
    ARG_dirty_war_1974.t:0 "汚い戦争？"
    ARG_dirty_war_1974.d:0 "「汚い戦争」とは、アルゼンチンの軍事政権（軍民独裁政権）がコンドル作戦の一環として1974年から1983年にかけて行った国家テロの時代を指して用いた名称です。この作戦の間、軍・治安部隊およびアルゼンチン反共同盟（AAA、トリプルA）などの暗殺部隊は、あらゆる政治的反対派や社会主義・ペロン党左派・モントネーロス運動に関わると見なされた者を追い詰めました。"
    JAP_assassinate_SA.t:0 "安倍晋三暗殺？"
    JAP_assassinate_SA.d:0 "2022年7月8日、日本の元内閣総理大臣で現職の衆議院議員であった安倍晋三は、奈良県奈良市の大和西大寺駅前で行われた政治イベントで演説中に暗殺されました。安倍は自由民主党（自民党）候補の応援演説を行っていたところを41歳の山上徹也に手製の銃で撃たれ、致命傷を負いました。安倍はドクターヘリで橿原市の奈良県立医科大学附属病院へ搬送されましたが、同病院で死亡が確認されました。"
    PHI_drug_war_2016.t:0 "麻薬戦争？"
    PHI_drug_war_2016.d:0 "麻薬戦争とは、2016年6月30日から2022年6月30日まで在任したロドリゴ・ドゥテルテ大統領の政権下で始まった強力な麻薬撲滅キャンペーンです。このキャンペーンによって国内の麻薬の蔓延は減少しましたが、警察や正体不明の襲撃者によるとされる超法規的殺害が汚点となりました。2016年以降に殺害された麻薬容疑者の数は2022年までに政府の公式集計で6,252人とされていますが、フィリピン国家警察と自警団による「麻薬撲滅作戦」で殺害された民間人は1万2,000人から3万人に上ると推定されています。"
    MEX_drug_war_2006.t:0 "ミチョアカン作戦？"
    MEX_drug_war_2006.d:0 "ミチョアカン作戦は、麻薬畑の根絶と麻薬密売の撲滅を目的とした連邦警察とメキシコ軍による合同作戦です。2006年12月11日に開始され、公安長官、メキシコ司法長官、内務長官、メキシコ海軍、メキシコ陸軍が作戦を監督しました。作戦の構成組織ではないにもかかわらず、州警察や市警察が参加したこともあります。この合同作戦は組織犯罪（この場合は麻薬密売）に対する作戦の中でも最多の軍・警察要員を動員し、最も多くの州の部隊を投入した作戦として際立っています。"
    USA_great_wall_2017.t:0 "トランプの壁？"
    USA_great_wall_2017.d:0 "トランプの壁は、ドナルド・トランプの第1次政権下で始まったメキシコ・アメリカ合衆国国境障壁の拡張であり、2016年大統領選挙に向けたトランプの選挙公約の重要な柱でした。トランプは選挙運動を通じて不法移民対策として国境の壁の建設を訴えました。"
    LEB_civil_war_1975.t:0 "レバノン内戦？"
    LEB_civil_war_1975.d:0 "レバノン内戦は、レバノンのキリスト教徒とイスラム教徒の間の緊張から生じた内戦です。社会経済的な格差と1970年代のレバノンにおけるパレスチナ解放機構（PLO）戦闘員の存在が対立を激化させました。1975年、レバノンのイスラム教徒と左派はPLOを支持してより大きな政治権力を求め、一方で政治的優位の維持を図るキリスト教徒はPLOに反対しました。各派は1976年初頭まで激しく戦い、レバノンは北部をキリスト教徒が、南部をイスラム教徒が支配する事実上の分断状態に陥りました。"
    SYR_civil_war_2011.t:0 "シリア内戦？"
    SYR_civil_war_2011.d:0 "シリア内戦は、国家の支援を受けた勢力と非国家勢力が入り乱れてシリアで起きた多面的な紛争です。2011年3月、バッシャール・アル＝アサドの統治への民衆の不満から、地域に広がったアラブの春の一環としてシリア全土で大規模な抗議行動と民主化集会が起こりました。政府の治安機関による数か月にわたる弾圧の後、自由シリア軍をはじめとする様々な武装反政府勢力が国内各地で結成され、シリアでの武装蜂起が始まりました。2012年半ばまでに蜂起は本格的な内戦へと発展しました。"
    LBY_civil_war_2014.t:0 "リビア内戦？"
    LBY_civil_war_2014.d:0 "リビア内戦（2014〜2020年）は第二次リビア内戦とも呼ばれ、2014年から2020年までの6年間にリビアで複数の武装勢力、主に代議院（HoR）と国民合意政府（GNA）の間で戦われた多国間の内戦です。"
    TUR_pogrom_1955.t:0 "イスタンブール・ポグロム？"
    TUR_pogrom_1955.d:0 "イスタンブール・ポグロムは1955年9月6日から7日にかけて主にイスタンブールのギリシャ系少数民族を標的に行われた国家主導の反ギリシャ暴動です。このポグロムはトルコの与党民主党が各種治安組織（戦術動員グループ、対ゲリラ組織、国家保安局）の協力を得て画策したものでした。事件の発端はギリシャ・マケドニア地方テッサロニキにあるトルコ領事館――1881年にムスタファ・ケマル・アタテュルクが生まれた家――の爆破でした。実際には爆弾は領事館のトルコ人案内係が仕掛けたもので、彼は後に逮捕され自白しています。"
    BUR_genocide_2016.t:0 "ロヒンギャ虐殺？"
    BUR_genocide_2016.d:0 "ロヒンギャ虐殺はミャンマー軍がイスラム教徒のロヒンギャに対して行っている一連の迫害と殺害です。この虐殺はこれまで2つの段階に分かれています。第1段階は2016年10月から2017年1月にかけての軍による弾圧で、第2段階は2017年8月から続いています。この危機により100万人を超えるロヒンギャが国外へ逃れました。大半はバングラデシュへ避難し世界最大の難民キャンプが生まれました。そのほかインド、タイ、マレーシアなど南アジアや東南アジア各地へ逃れた人々もいますが、彼らは逃れた先でも迫害を受け続けています。"
    NGE_pogrom_1966.t:0 "反イボ人ポグロム？"
    NGE_pogrom_1966.d:0 "1966年5月からナイジェリア北部に住むイボ人をはじめとする南部出身者に対する一連の虐殺が始まり、1966年9月29日以降に頂点に達しました。殺害されたイボ人と東部出身者は8,000人から30,000人と推定されています。さらに100万人のイボ人が北部州から東部へ逃れました。この殺戮への報復としてポートハーコートなど東部の都市では北部出身者が虐殺されました。"
    SER_genocide_1995.t:0 "スレブレニツァの虐殺？"
    SER_genocide_1995.d:0 "スレブレニツァの虐殺とは、ボスニア紛争中の1995年7月にスレブレニツァの町とその周辺で8,000人以上のボシュニャク人ムスリムの男性と少年が殺害されたジェノサイドです。主にラトコ・ムラディッチ率いるボスニア・セルビア人のスルプスカ共和国軍の部隊によって実行されましたが、セルビア人準軍事組織「スコーピオンズ」も加わりました。この虐殺は第二次世界大戦終結以降のヨーロッパで初めて法的にジェノサイドと認定された事件です。"
    POR_academic_crisis_1962.t:0 "大学危機？"
    POR_academic_crisis_1962.d:0 "大学危機とは、1962年にエスタド・ノヴォ体制が推し進めたポルトガル政府の政策を指す呼び名で、ポルトガル学生全国書記局をはじめとする複数の学生団体・組織の排斥と閉鎖を伴うものでした。この組織の構成員の多くは反体制派の活動家であり、その中には多くの共産主義者も含まれていました。学生たちはデモで応じ、3月24日にはリスボンで大規模な学生デモが行われましたが、機動隊に激しく鎮圧され数百人の学生が負傷しました。その直後学生たちはストライキを開始しました。これらの出来事が1962年の大学危機として知られるようになりました。"
    POR_coup_1975.t:0 "共産主義者のクーデター計画？"
    POR_coup_1975.d:0 "ポルトガルは「進行中の革命過程」（Processo Revolucionário Em Curso）として知られる混乱の時期を経験しました。PRECのこの段階は1975年11月25日のクーデターまで続きました。このクーデターは極左将校の一団、とりわけオテロ・サライヴァ・デ・カルヴァーリョが主導したものです。これは強大な共産党の信用を失墜させるための、共産主義者による権力奪取の陰謀だったとされています。その後より中道的な将校たちによる逆クーデターが成功しましたが、この時期は自由民主主義勢力と左派・共産主義政党との絶え間ない軋轢に彩られていました。"
    SPA_coup_1981.t:0 "スペインのクーデター計画？"
    SPA_coup_1981.d:0 "1981年2月、治安警備隊とスペイン軍の一部がスペインでクーデターを企てました。このクーデターの失敗はスペインをフランコ体制へ戻そうとする最後の本格的な試みとなり、スペインの民主化プロセスを確固たるものにしました。国王フアン・カルロス1世はクーデターの阻止に大きな役割を果たし、その結果君主制は新たな正統性を得ました。"
    SPA_BSQ_devolution.t:0 "ゲルニカ憲章？"
    SPA_BSQ_devolution.d:0 "1979年のバスク自治州自治憲章は、ゲルニカ憲章として広く知られており、アラバ、ビスカヤ、ギプスコアの各歴史的領域からなるバスク自治州の政治体制を定める法文書です。これにより同地域は1978年のスペイン憲法が想定する自治州の一つとなりました。憲章は議院内閣制を確立し、首班（行政府の長）すなわちレンダカリはバスク自治州議会が議員の中から選出します。議会は普通選挙で選ばれ、自治州を構成する3つの歴史的領域からそれぞれ25名ずつ、計75名の議員で構成されます。"
    TUR_coup_2016.t:0 "トルコのクーデター計画？"
    TUR_coup_2016.d:0 "2016年7月15日の夜、「国内平和評議会」を名乗るトルコ軍内の一派が、政府やレジェップ・タイイップ・エルドアン大統領をはじめとする国家機関に対してクーデターを企てました。彼らはアンカラ、イスタンブール、マルマリスのほか、ボスポラス橋のアジア側入口など各地の掌握を試みましたが、国家に忠実な部隊と市民に打ち破られ失敗に終わりました。政府はクーデターの首謀者がギュレン運動とつながっている証拠があると発表しました。同運動はトルコ共和国によってテロ組織に指定されており、ペンシルベニアに亡命していたトルコの実業家で著名なイスラム学者でもあるフェトフッラー・ギュレンが率いています。"
    BOL_coup_1966.t:0 "ボリビアの反乱？"
    BOL_coup_1966.d:0 "ニャンカワスー・ゲリラ、またの名をボリビア民族解放軍（ELN）は、ゲリラ指導者チェ・ゲバラが率いた主にボリビア人とキューバ人からなるゲリラ集団で、1966年から1967年にかけてボリビアのコルディジェラ地方で活動しました。一行はサンタクルス・デ・ラ・シエラ市の南西250キロメートル、リオ・グランデ川の季節性支流であるニャンカワスー川の対岸にある農場に拠点を設けました。ゲリラはボリビア政府を打倒し社会主義国家を樹立するための第一歩となる武装抵抗の拠点、すなわち「フォコ」として活動することを目指していました。ゲリラはボリビアの哨戒部隊を幾度も撃破しましたが最終的に敗北し、ゲバラは捕らえられて処刑されました。"
    BOL_assassinate_CG.t:0 "チェ・ゲバラの処刑？"
    BOL_assassinate_CG.d:0 "エルネスト・「チェ」・ゲバラはアルゼンチン出身のマルクス主義革命家であり、医師、著述家、ゲリラ指導者、外交官、軍事理論家でもありました。ゲバラは1965年にキューバを離れ、アフリカと南米の両大陸で革命を扇動しようとしました。まずコンゴ・キンシャサで失敗し、次いで赴いたボリビアでCIAの支援を受けたボリビア軍に捕らえられ、即座に処刑されました。"
    USA_1992_LA_riots.t:0 "ロサンゼルス暴動？"
    USA_1992_LA_riots.d:0 "1992年ロサンゼルス暴動は、1992年4月から5月にかけてアメリカ合衆国カリフォルニア州ロサンゼルス郡で発生した一連の暴動と騒乱です。ロドニー・キングの逮捕時に暴行を加え過剰な力を行使したとして起訴されたロサンゼルス市警察（LAPD）の警官4人に陪審が無罪評決を下したことを受け、4月29日にサウス・セントラル・ロサンゼルスで騒乱が始まりました。この事件は居合わせたジョージ・ホリデイによってビデオに撮影されており、さまざまな報道機関やメディアで繰り返し放送されていました。"
    IDO_1998_riots.t:0 "ペリスティワ？"
    IDO_1998_riots.d:0 "1998年5月のインドネシア暴動は、単に「98年事件（ペリスティワ98）」とも呼ばれ、インドネシアで起きた大規模な暴力と社会不安の事件です。その多くは同国の華人系住民を標的としていました。事件は主にメダン、ジャカルタ、スラカルタの各都市で発生し、インドネシアの他の地域でも小規模な事件が起きました。西側の支援を受けたスハルト政権のもとで、インドネシアの華人に対しては広範かつ組織的な差別が行われていました。暴動の引き金となったのは汚職と、食糧不足や大量失業などの経済問題でした。"
    PAP_assassinate_PJP_1981.t:0 "ヨハネ・パウロ2世の第一次暗殺未遂？"
    PAP_assassinate_PJP_1981.d:0 "1981年5月13日、バチカン市国のサン・ピエトロ広場で、教皇ヨハネ・パウロ2世は広場に入る際にメフメト・アリ・アージャに銃撃され負傷しました。教皇は2発の銃弾を受け、大量に出血しました。アージャはその場で取り押さえられ、のちにイタリアの裁判所で終身刑を言い渡されました。教皇は暗殺未遂についてアージャを赦しました。アージャは教皇の要請によりイタリアのカルロ・アツェリオ・チャンピ大統領から恩赦を受け、2000年6月にトルコへ送還されました。"
    PAP_assassinate_PJP_1982.t:0 "ヨハネ・パウロ2世の第二次暗殺未遂？"
    PAP_assassinate_PJP_1982.d:0 "2度目の暗殺未遂は、最初の暗殺未遂からちょうど1年となる前日の1982年5月12日にポルトガルのファティマで起きました。1人の男が銃剣でヨハネ・パウロ2世を刺そうとしたのです。男は警備員に阻止されました。のちにスタニスワフ・ジヴィシュは、ヨハネ・パウロ2世はこの襲撃で負傷していたものの、命に別状のない傷を隠し通したと語っています。"
    USA_Jonestown_Massacre.t:0 "ジョーンズタウンの虐殺"
    USA_Jonestown_Massacre.d:0 "人民寺院農業計画（通称「ジョーンズタウン」）は、ジム・ジョーンズが率いたアメリカの宗教運動「人民寺院」がガイアナの辺境に築いた入植地です。1978年11月18日にこの入植地と近隣のポート・カイトゥマの滑走路、そしてガイアナの首都ジョージタウンにある寺院運営の施設で計918人が死亡したことで、ジョーンズタウンは世界的に悪名を馳せました。ジョーンズタウンとジョージタウンでの死を表す言葉は時代とともに変化してきました。事件直後の報道の多くはこれらの死を集団自殺と呼んでいました。"
    GUY_Rupununi_Uprising.t:0 "ルプヌニ蜂起"
    GUY_Rupununi_Uprising.d:0 "ルプヌニ蜂起は1969年1月2日にガイアナで始まった分離主義者の反乱で、22,300平方マイル（58,000平方キロメートル）の土地の支配を狙う牧場主たちが主導しました。ガイアナが英国から独立して2年足らずで起きたこの蜂起は、国家としての存立と社会の結束が問われた最初にして最も深刻な試練となりました。反乱者たちは最終的にガイアナ国防軍によって鎮圧され、指導者たちはベネズエラへ逃亡しました。"
    PRC_Lin_Biao_Incident.t:0 "林彪事件"
    PRC_Lin_Biao_Incident.d:0 "林彪事件は1971年9月13日午前3時に中国共産党副主席の林彪を乗せた航空機が起こした事故です。林彪とその家族数名を含むホーカー・シドレー・トライデントの搭乗者全員が、機体がモンゴルの大地に墜落したことで死亡しました。林彪は毛沢東暗殺計画に失敗した後、ソ連への亡命を図っていたとされています。"
    PRC_Anti_Corruption_Drive_2012.t:0 "反腐敗運動"
    PRC_Anti_Corruption_Drive_2012.d:0 "2012年の中国共産党（CCP）第18回全国代表大会の閉幕後、中国で広範な反腐敗運動が始まりました。中国共産党総書記の習近平の主導で進められたこの運動は、中国共産党による統治の歴史において最大規模の組織的な反腐敗の取り組みとなりました。"
    SAF_Sharpeville_Massacre_1960.t:0 "シャープビル虐殺？"
    SAF_Sharpeville_Massacre_1960.d:0 "1959年、ANCに幻滅した党員たちがアザニア・パン・アフリカニスト会議（PAC）を結成し、1960年3月21日にパス法に反対するデモを組織しました。その抗議行動の一つはシャープビルのタウンシップで行われ、シャープビル虐殺事件で69人が警察によって殺害されました。シャープビル事件を受けて政府は非常事態を宣言しました。ANCとPACの指導者を含む1万8000人以上が逮捕され、両組織は非合法化されました。抵抗運動は地下に潜り、一部の指導者は国外へ亡命し、また一部は国内で破壊工作やテロ活動に従事しました。"
    SAF_Mahlabatini_Declaration_1974.t:0 "マーラバティーニ信念宣言"
    SAF_Mahlabatini_Declaration_1974.d:0 "マーラバティーニ信念宣言は、南アフリカの政治指導者マンゴスツ・ブテレジとハリー・シュワルツが1974年1月4日に定めた基本原則の声明です。クワズール・ナタールのマーラバティーニで署名されたことからその名が付きました。その目的は多人種社会における合意に基づく統治と人種間の平和の青写真を示すことにあり、万人への機会、協議、連邦制の構想、そして権利章典を重視していました。また、政治的変革は非暴力的手段によって行われなければならないことを初めて確認したものでもありました。"
    VNZ_Pact_of_Puntofijo_1958.t:0 "プントフィホ協定？"
    VNZ_Pact_of_Puntofijo_1958.d:0 "プントフィホ協定は、1958年の大統領選挙の結果の受け入れと新たな民主体制の維持を目的として、ベネズエラの三大政党である民主行動党（AD）、COPEI（キリスト教社会党）、民主共和同盟（URD）の代表者間で結ばれた正式な取り決めです。この協定は、署名した政党が選挙結果を尊重し、一党支配を防ぎ、権力を分かち合い、独裁を防ぐために協力することを文書で保証するものでした。"
    VNZ_Caracazo_1989.t:0 "カラカソ？"
    VNZ_Caracazo_1989.d:0 "カラカソとは、カルロス・アンドレス・ペレス大統領の緊縮政策を受けて1989年2月27日にベネズエラの都市グアレナスで始まり、カラカスと周辺の町へ広がった抗議・暴動・略奪の波の呼称です。1週間に及んだ衝突で多数の死者が出ており、その数は数百人から数千人と推計され、各種の報告によれば主に治安部隊と軍の関与によるものでした。暴動と抗議は主に政府の経済改革と、それに伴うガソリン価格と交通運賃の値上げに反発して始まりました。"
    SPA_assassinate_LCB.t:0 "ルイス・カレーロ・ブランコ暗殺？"
    SPA_assassinate_LCB.d:0 "1973年12月20日、スペイン首相ルイス・カレーロ・ブランコは、バスク分離主義組織ETAがトンネルに仕掛けた大量の爆薬の爆発によって暗殺されました。作戦名「オグロ作戦」（人食い鬼作戦）とも呼ばれるこの暗殺は、1939年のスペイン内戦終結以来フランコ体制に対する最大の攻撃とされ、スペインの政治に広範な影響を及ぼしました。"
    SOV_doctors_plot_1951.t:0 "医師団陰謀事件？"
    SOV_doctors_plot_1951.d:0 "「医師団陰謀事件」は、ソ連国家が主導した反知識人・反ユダヤ主義（反コスモポリタニズムを装ったもの）のキャンペーンで、著名な医学専門家からなる反ソ陰謀団（その多くがユダヤ系）が政府と共産党の指導者の殺害を企てたとする陰謀論に基づいていました。1951年から1953年にかけて、ユダヤ系が大半を占めるモスクワの医師たちがソ連指導者の暗殺を企てたとして告発されました。彼らは国際ユダヤ勢力と西側（主にアメリカとイギリス）の情報機関の利益に奉仕したとして非難されました。その後多くの医師が解雇・逮捕され、自白を強いるための拷問を受けました。"
    THI_massacre_1976.t:0 "タマサート大学虐殺事件？"
    THI_massacre_1976.d:0 "血の水曜日事件（1976年10月6日虐殺事件）は1976年10月6日にバンコクのタマサート大学と隣接するサナームルアンを占拠していた左派デモ隊に対しタイ警察が行った暴力的な弾圧と、右派準軍事組織および群衆による私刑です。10月6日午前5時30分から11時にかけて警察はアサルトライフル、グレネードランチャー、対装甲弾、手榴弾などの軍用兵器を用いて包囲されたデモ隊を弾圧しました。デモ隊は一時抵抗を試みましたが、すぐに制圧されました。"
    THI_massacre_1992.t:0 "暴虐の5月？"
    THI_massacre_1992.d:0 "暴虐の5月とは1992年5月にタイで勃発した暴力的な政治危機を指します。かつてクーデターを主導したスチンダー・クラープラユーン将軍が選挙を経ずに首相に任命されたことに抗議してバンコクで大規模な抗議運動が起こりました。チャムロン・シームアンに率いられたデモ隊は民主的改革を求めましたが、軍の残忍な弾圧を受け、数十人の死者と数百人の負傷者を出したうえ報道も広く検閲されました。危機はプーミポン・アドゥンヤデート国王がテレビ中継の場で介入し、対立する両陣営に和解を促したことで頂点に達しました。スチンダーはその直後に辞任し、新たな選挙とより民主的な統治への移行に道が開かれました。"
    ETH_massacre_1976.t:0 "ケイ・シビル？"
    ETH_massacre_1976.d:0 "エチオピアの赤色テロはケイ・シビルとしても知られ、1976年から1978年にかけてエチオピアおよび現在のエリトリアでデルグが競合する他のマルクス・レーニン主義勢力に対して行った暴力的な政治弾圧です。ケイ・シビルは1974年のデルグによるハイレ・セラシエ皇帝の打倒と、それに続くエチオピア内戦による政情不安の中でデルグの支配を固めようとする試みでした。ケイ・シビルはロシア内戦の赤色テロを手本としており、1977年2月3日にメンギスツ・ハイレ・マリアムがデルグ議長に就任した後に最も顕著になりました。ケイ・シビルの間に1万人から98万人が殺害されたと推定されています。"
    ROC_massacre_1948.t:0 "白色テロ？"
    ROC_massacre_1948.d:0 "白色テロとは、国民党（KMT）政権下で台湾の民間人や政治的反対者に対して行われた政治的弾圧です。白色テロの時代は一般に、1948年の動員戡乱時期臨時条款に基づき1949年5月19日に台湾で戒厳令が布告された時に始まり、「反国家」活動の訴追を可能にしていた刑法第100条が1992年9月21日に廃止されたことで終わったとされています。"
    IDO_massacre_1965.t:0 "インドネシアの反共大虐殺？"
    IDO_massacre_1965.d:0 "1965年から1966年にかけてインドネシアでは、主にインドネシア共産党（PKI）の党員や支持者とみなされた人々を標的とする大規模な殺戮と社会不安が起きました。ほかにも共産主義への共鳴を疑われた人々、ゲルワニの女性、労働組合員、アバンガンのジャワ人、華人、無神論者、いわゆる「不信心者」、そして左翼とみなされた人々全般が被害を受けました。最も広く公表されている推計では少なくとも50万人から100万人が殺害され、200万人から300万人に上るとする推計もあります。ジェノサイドやポリティサイドとも呼ばれるこの残虐行為は、スハルト率いるインドネシア軍によって扇動されたものでした。"
    GBR_princess_of_wales_1981.t:0 "ダイアナとチャールズ王子の結婚？"
    GBR_princess_of_wales_1981.d:0 "ダイアナ妃（旧名ダイアナ・フランセス・スペンサー）はイギリス王室の一員でした。チャールズ3世（当時のウェールズ公）の最初の妻であり、ウィリアム王子とヘンリー王子の母です。その社会活動と華やかさで国際的なアイコンとなり、長く人気を集め続けました。1981年7月にセント・ポール大聖堂で挙式してウェールズ公妃となり、その役割は大衆から熱烈に歓迎されました。夫妻にはウィリアムとヘンリーの2人の息子が生まれ、2人は当時それぞれイギリス王位継承順位の第2位と第3位にありました。"
    USA_Tea_Party_Movement_2009.t:0 "ティーパーティー運動？"
    USA_Tea_Party_Movement_2009.d:0 "ティーパーティー運動は2007年に始まった共和党内の財政保守派によるアメリカの政治運動で、ロン・ポール下院議員の大統領選挙運動を機に一躍主流へと躍り出ました。この運動は民主党のバラク・オバマ大統領の政策への反発から拡大し、共和党が下院で63議席を獲得して過半数を奪った2010年の「波乱の選挙」の大きな要因となりました。"
    USA_MAGA_Movement_2016.t:0 "MAGA運動？"
    USA_MAGA_Movement_2016.d:0 "「アメリカを再び偉大に」（MAGA）運動と「アメリカ・ファースト」運動は右派ポピュリズム、右派反グローバリズム、国民保守主義、新ナショナリズムなどの思想から成り、反自由主義的・権威主義的な、時に専制的な信条を色濃く帯びています。2010年代後半から2020年代初頭にかけて、MAGA支持者はアメリカ共和党内の最大派閥となりました。"
    USA_assassinate_CJK.t:0 "チャーリー・カーク暗殺？"
    USA_assassinate_CJK.d:0 "チャールズ・ジェームズ・カークはアメリカの保守派政治活動家、作家、メディアパーソナリティです。2012年に学生団体ターニング・ポイントUSA（TPUSA）を共同設立し、その事務局長を務めました。また、ターニング・ポイント・アクションの最高経営責任者であり、国家政策評議会の一員でもありました。晩年には共和党内のポピュリズム的なMAGA運動を代表する最も著名な論客の一人となりました。2025年9月10日、カークはユタ・バレー大学のキャンパスで開かれたTPUSAの公開討論会で演説中に銃撃され、死亡しました。その死は国際的な注目を集め、国内外の著名人が政治的暴力を非難する事態となりました。"
    USA_Nation_of_Islam_1952.t:0 "マルコムXの仮釈放？"
    USA_Nation_of_Islam_1952.d:0 "マルコムX（本名マルコム・リトル、のちのエル＝ハジ・マリク・エル＝シャバズ）はアフリカ系アメリカ人の革命家であり、ムスリムの説教師、人権活動家でもありました。1965年に暗殺されるまで公民権運動の著名な人物でした。1964年に脱退するまでネーション・オブ・イスラム（NOI）のスポークスマンを務め、黒人の地位向上とアフリカ系アメリカ人社会におけるイスラム教の普及を声高に訴えました。暴力を説いていると非難された物議を醸す人物である一方で、人種的正義を追い求めたことからアフリカ系アメリカ人とムスリムの社会では称えられる人物でもあります。"
    USA_assassinate_MLX.t:0 "マルコムXの暗殺？"
    USA_assassinate_MLX.d:0 "公民権運動で人気を集めたアフリカ系アメリカ人のムスリムの説教師で人権活動家のマルコムXは、1965年2月21日にニューヨーク市マンハッタンのワシントンハイツ地区にあるオーデュボン・ボールルームでアフロ・アメリカン統一機構に向けて演説する準備をしていたところを何発も撃たれ、その傷により39歳で亡くなりました。ネーション・オブ・イスラムのメンバー3人（ムハンマド・アブドゥル・アジズ、ハリル・イスラム、トーマス・ヘイガン）が殺人罪で起訴され、有罪判決を受けて不定期の終身刑を言い渡されましたが、2021年11月にアジズとイスラムの冤罪が認められました。"
    JAP_protest_1960.t:0 "安保闘争"
    JAP_protest_1960.d:0 "安保闘争とは、アメリカ合衆国が日本国内に軍事基地を維持することを認める日米安全保障条約に反対して、1959年から1960年にかけて、また1970年に再び日本全国で起こった一連の大規模な抗議運動です。1960年の安保闘争は改定された日米安全保障条約の発効を阻止できませんでしたが、岸内閣を総辞職に追い込み、予定されていたアイゼンハワー大統領の訪日を中止させました。岸の後を継いで首相となった池田勇人は野党に対してはるかに融和的な姿勢をとり、岸が進めていた憲法改正の計画を無期限に棚上げしました。さらに所得倍増計画を打ち出し、国民の関心を激しい政治闘争から全国的な高度経済成長の推進へと向け直しました。"
    NEJ_Jamal_Khashoggi_2003.t:0 "ジャマル・カショギ事件？"
    NEJ_Jamal_Khashoggi_2003.d:0 "2003年のジャマル・カショギはサウジアラビアの著名なジャーナリスト兼編集者であり、王室と近い関係にありながらも独立した論調で尊敬を集めていました。彼は一時アル・ワタン紙の編集長を務めましたが、改革派としての立場から宗教的保守主義を批判する記事を掲載したことで解任されました。"
    NEJ_Jamal_Khashoggi_2018.t:0 "ジャマル・カショギ暗殺？"
    NEJ_Jamal_Khashoggi_2018.d:0 "2018年10月2日、サウジアラビアのジャーナリストであるジャマル・カショギがイスタンブールのサウジアラビア総領事館内で殺害されました。15人からなる実行部隊が彼を待ち伏せて殺害したもので、皇太子を批判する著名人を黙らせるための命令によるものとされています。遺体は切断され、見つかることはありませんでした。この事件は世界的な非難を巻き起こし、外交上の波紋を広げました。"
    JAP_protest_1952.t:0 "血のメーデー事件"
    JAP_protest_1952.d:0 "血のメーデー事件とは1952年5月1日に東京の皇居前にある皇居外苑で起きたデモ隊と警官隊との激しい衝突のことです。日米安全保障条約に抗議する大群衆が解散を拒んだため、デモ隊と警官隊の間で流血の乱闘となりました。最終的に警官隊は群衆に向けて発砲し、2人が死亡、22人が銃創を負いました。この衝突による負傷者は合わせて約2,300人（デモ参加者1,500人、警察官800人）に上りました。"
    JAP_protest_1955.t:0 "砂川闘争"
    JAP_protest_1955.d:0 "砂川闘争は1955年から1957年にかけて日本で起きた抗議運動で、米空軍立川基地の近隣の砂川村への拡張に反対するものでした。高まりつつあった反基地運動の頂点で起きた「流血の砂川」は、在日米軍基地に対する数多くの抗議の中でも最も激しく暴力的なものとして記憶されています。"
    PRC_ethnic_unity_law_2026.t:0 "民族団結進歩促進法？"
    PRC_ethnic_unity_law_2026.d:0 "民族団結進歩促進法は少数民族に関する中国の法律です。この法律は全国人民代表大会民族委員会によって起草され、2025年9月8日に全人代へ提出されました。2026年3月12日に全人代で採択され、同日に習近平国家主席が署名し、2026年7月1日に施行されました。この法律は民族問題に関する習近平の政策を法制化し、中国共産党の指導の下でさらなる民族融合を推し進めるものです。国外の研究者や人権活動家からは批判を受けており、域外での法執行を推進する点は国境を越えた弾圧になぞらえられています。"
    SVM_buddhist_crisis_1963.t:0 "仏教徒危機"
    SVM_buddhist_crisis_1963.d:0 "仏教徒危機とは1963年5月から11月にかけて南ベトナムで生じた政治的・宗教的緊張の時期であり、南ベトナム政府による一連の弾圧行為と主に仏教徒活動家が主導した市民的抵抗運動によって特徴づけられます。この危機の発端は、5月8日に中部の都市フエで仏教旗の掲揚禁止に抗議していた非武装の市民9人が銃撃された事件でした。"
    
    GER_post_war_deportations.t:0 "戦後のドイツ人追放？"
    GER_post_war_deportations.d:0 "ヨーロッパにおける第二次世界大戦は1945年5月のドイツの敗北をもって終結しました。同盟国はポツダム協定において占領の条件、ドイツ領土の削減、そして戦後のポーランド・チェコスロバキア・ハンガリーから同盟国占領地区へのドイツ系住民の追放について合意しました。ポツダム協定後、ソ連の支配下にある東欧諸国の全域でドイツ系住民の追放が相次ぎました。対象地域においてドイツ国家またはドイツ人が所有していた財産や物資は没収され、ソ連へ移送されるか国有化されるか、あるいは住民の間で再分配されました。"
    GER_post_war_deportations.option.1:0 "ドイツ人を追放せよ！"
    GER_post_war_deportations.option.2:0 "彼らの残留を認める。"
    
    ISR_post_war_migration.t:0 "キブツ・ガルヨート？"
    ISR_post_war_migration.d:0 "1948年から1951年にかけて、主にホロコースト後のヨーロッパとアラブ・イスラム世界からユダヤ人の大規模な移民の波が押し寄せました。建国時に65万人だったイスラエルのユダヤ人人口は、約68万8000人の移民の流入により3年半で2倍以上に増加しました。1949年には単年として史上最多となる24万9954人のユダヤ人移民がイスラエルに到着しました。多くのディアスポラ共同体がアリヤー（帰還）を果たしたことから、この移民の時期はしばしばキブツ・ガルヨート（直訳すると「離散者の集結」）と呼ばれます。"
    historical_pop_transfer.option.1:0 "移住を認める。"
    historical_pop_transfer.option.2:0 "出国を阻止せよ！"
    
    POL_post_war_deportations.t:0 "第一次ポーランド人帰還？"
    POL_post_war_deportations.d:0 "1944年から1946年にかけての戦前ポーランド東半部からのポーランド人住民移送は第二次世界大戦末期から戦後にかけて行われたポーランド人の強制移住です。これは第二次世界大戦の主要連合国が承認したソビエト連邦の政策によるものでした。公式の統計によれば1945年から1946年にかけての国家管理下の追放でソビエト連邦西端の共和国から約116万7000人のポーランド人が去りましたが、これは移送に登録した者の50％にも満たない数でした。スターリンの死後、1955年から1959年にかけてもポーランド系住民の大規模な移送が再び行われました。"
    POL_post_war_deportations.option.1:0 "ポーランド人を追放せよ！"
    POL_post_war_deportations.option.2:0 "我が国に留まらせよう。"
    
    POL_post_war_deportations_2.t:0 "第二次ポーランド人帰還？"
    POL_post_war_deportations_2.d:0 "ソビエト連邦に併合された地域（クレシ・ヴショドニェと呼ばれる）に住むポーランド人の第二次強制帰還（あるいは追放）は1955年から1959年にかけて行われました。数十年にわたるポーランド共産主義政権のプロパガンダによって広まった「帰還」という呼称は国外追放を覆い隠す婉曲表現です。1944年から1946年の帰還と区別するため「第二次帰還」と呼ばれることもあります。"
    
