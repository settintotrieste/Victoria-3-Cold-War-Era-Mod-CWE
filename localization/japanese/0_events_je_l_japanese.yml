    join_OECD_decision_desc:0 "経済協力開発機構は38の加盟国からなる国際機関であり、経済発展と世界貿易の促進を目的として1961年に設立されました。加盟国が民主主義と市場経済への支持を掲げるフォーラムであり、政策経験の比較、共通の問題への答えの模索、優れた実践の特定、そして加盟国の国内政策と国際政策の調整の場を提供しています。"
    leave_OECD_decision:0 "OECDを脱退する"
    leave_OECD_decision_desc:0 "経済協力開発機構は38の加盟国からなる国際機関であり、経済発展と世界貿易の促進を目的として1961年に設立されました。加盟国が民主主義と市場経済への支持を掲げるフォーラムであり、政策経験の比較、共通の問題への答えの模索、優れた実践の特定、そして加盟国の国内政策と国際政策の調整の場を提供しています。"
    OECD_application_var:0 "最近OECDへの加盟を申請した"
    OECD_application_choice.t:0 "[SCOPE.sCountry('OECD_applicant').GetName]がOECDへの加盟を申請しています"
    OECD_application_choice.d:0 "[SCOPE.sCountry('OECD_applicant').GetName]がOECDへの加盟を申請しました。[SCOPE.sCountry('OECD_leader').GetName]が現在OECDの議長国を務めているため、[SCOPE.sCountry('OECD_applicant').GetName]を機構に受け入れるかどうかは我々の判断に委ねられています。"
    OECD_application_choice.option.1:0 "承認する"
    OECD_application_choice.option.2:0 "拒否する"
    OECD_application_rejection.t:0 "OECDへの加盟申請が拒否されました"
    OECD_application_rejection.d:0 "OECDのリーダーである[SCOPE.sCountry('OECD_leader').GetName]は、その偉大な組織への加入という我々の謙虚な願いを拒絶しました。彼らは地政学的な理由を引き合いに出し、我々の加盟を拒否しています。"
    OECD_application_rejection.1:0 "どうせ奴らには我々に見合う価値などないのだ！"
    OECD_application_acceptance.t:0 "OECDへの加盟申請が受理されました"
    OECD_application_acceptance.d:0 "OECDの主導国である[SCOPE.sCountry('OECD_leader').GetName]は、その偉大な機構に加わりたいという我々の謙虚な願いを快く受け入れてくれました。地政学的な理由から我々の加盟を受け入れたとのことです。"
    OECD_application_acceptance.1:0 "彼らの寛大さに感謝しよう！"
