    space_rocket_completed.d:0 "[ROOT.GetCountry.GetName]はロケットの宇宙への打ち上げに成功しました。これは国家の技術発展における大きな前進です。"
    satellite_completed.d:0 "[ROOT.GetCountry.GetName]は人工衛星の打ち上げに成功しました。これは国家の技術発展における大きな前進です。"
    astronaut_completed.d:0 "[ROOT.GetCountry.GetName]は宇宙飛行士の宇宙への派遣に成功しました。これは国家の技術発展における大きな前進です。"
    space_probe_completed.d:0 "[ROOT.GetCountry.GetName]は探査機の宇宙への打ち上げに成功しました。これは国家の技術発展における大きな前進です。"
    moon_mission_completed.d:0 "[ROOT.GetCountry.GetName]は人類の月面着陸に成功しました。これは国家の技術発展における大きな前進です。"
    space_station_completed.d:0 "[ROOT.GetCountry.GetName]は宇宙ステーションの軌道投入に成功しました。これは国家の技術発展における大きな前進です。"
    space_telescope_completed.d:0 "[ROOT.GetCountry.GetName]は宇宙望遠鏡の軌道投入に成功しました。これは国家の技術発展における大きな前進です。"
    mars_mission_completed.d:0 "[ROOT.GetCountry.GetName]は人類の火星到達に成功しました。これは国家の技術発展における大きな前進です。"
    moon_base_completed.d:0 "[ROOT.GetCountry.GetName]は月面研究基地の建設に成功しました。これは国家の技術発展における大きな前進です。"
    mars_base_completed.d:0 "[ROOT.GetCountry.GetName]は火星研究基地の建設に成功しました。これは国家の技術発展における大きな前進です。"
    
