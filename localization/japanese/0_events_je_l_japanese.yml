    notification_guerrilla_attack_foiled_desc: "[ROOT.GetCountry.GetAdjective]軍は#y [SCOPE.sState('guerrilla_attack_state').GetCityHubName]#!（[SCOPE.sState('guerrilla_attack_state').GetName]）でのゲリラ攻撃を撃退しました。"
    
