    je_economic_outlook_system_reason:0 "[ROOT.GetCountry.GetName]の国家経済見通しは成長率・雇用水準・インフレ率といった要素を含む、将来の経済状態の予測を示す指標です。一定期間における経済全体の健全性と動向の見通しとして機能します。\n\n現在の経済スコア：[GetPlayer.MakeScope.Var('economic_strength_var').GetValue] / 40\n\n現在の経済見通し：[SCOPE.GetRootScope.GetCountry.GetCustom('economic_outlook_custom_title')]\n\n#BOLD スコア内訳：#! $economic_strength_economic_laws$ $economic_strength_government_finances$ $economic_strength_corruption$ $economic_strength_stock_market$ $economic_strength_national_economy$ $economic_strength_global_economy$ $economic_strength_core_inflation$ $economic_strength_wars$"
