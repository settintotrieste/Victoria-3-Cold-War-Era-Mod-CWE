    british_iraq.indy.t:0 "イラク占領の終結？"
    british_iraq.indy.d:0 "1941年4月1日、ラシード・アリー・アル=ガイラーニーとゴールデン・スクエアの面々がクーデターを起こしました。続く英イラク戦争では、枢軸国と結ぶ彼の政権が西側諸国への石油供給を断つことを恐れ、イギリスがイラクへ侵攻します。ハーシム家の王政によるクーデター前の政府が復活した後は軍事占領が続きました。占領は1947年10月26日に終わりましたが、イギリスは1954年までイラクに軍事基地を維持し、その後アッシリア人部隊は解散させられました。"
    british_malaysia.indy.t:0 "イギリスのシンガポール撤退？"
    british_malaysia.indy.d:0 "1967年7月18日、イギリスは1970年代半ばまでにシンガポールから軍を撤退させると発表しました。その6か月後、期限は1971年へと繰り上げられます。イギリス軍の突然の撤退はシンガポールの防衛と経済の安全保障に深刻な問題を突きつけました。これに対しシンガポールは急速な工業化計画に着手し、外国投資を呼び込むため労働法を厳格化し、他国との軍事協力によって防衛力を高め、軍事支出を3倍に増やしたのです。"
    british_malta_2.indy.t:0 "イギリスのマルタ撤退？"
    british_malta_2.indy.d:0 "マルタは1964年9月21日にマルタ国として独立を果たしました（独立記念日）。1964年憲法のもとでマルタは当初エリザベス2世をマルタ女王すなわち国家元首として戴き、総督が女王に代わって行政権を行使しました。1971年にドム・ミントフ率いるマルタ労働党が総選挙に勝利し、マルタは1974年12月13日にコモンウェルス内の共和国であることを宣言しました（共和国記念日）。独立後まもなく防衛協定が結ばれ、1972年の再交渉を経て1979年3月31日に失効しました（自由の日）。協定の失効に伴いイギリス軍基地は閉鎖され、かつてイギリスが管理していた土地はマルタ政府に引き渡されました。"
