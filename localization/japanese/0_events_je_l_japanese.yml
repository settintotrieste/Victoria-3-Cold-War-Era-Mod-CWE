    seikan_tunnel.tt:0 "$STATE_HOKKAIDO$または$STATE_TOHOKU$を、この国と平和状態にあり友好的な関係にある十分に独立した国が所有している"
    channel_tunnel.tt:0 "$STATE_HOME_COUNTIES$または$STATE_FRENCH_LOW_COUNTRIES$を、この国と平和状態にあり友好的な関係にある十分に独立した国が所有している"
    zhuhai_bridge.tt:0 "$STATE_SHAOZHOU$または$STATE_GUANGDONG$を、この国と平和状態にあり友好的な関係にある十分に独立した国が所有している"
    
    spending_policy_ideology.t:0 "政府支出に関する新たな世論"
    spending_policy_ideology.d:0 "[ROOT.GetCountry.GetName]の新たな経済状況を受けて[SCOPE.gsInterestGroup('affected_IG_scope').GetName][concept_interest_group]は政府支出の適切な水準に関する立場を変更する意向を表明しました。"
    spending_policy_ideology.f:0 "このイベントは経済状況が政府支出に関する適切な動的[concept_ideology]と一致しなくなったために発生しました。"
    
    population_policy_ideology.t:0 "人口政策に関する新たな世論"
    population_policy_ideology.d:0 "[ROOT.GetCountry.GetName]における新たな社会経済情勢を受けて[SCOPE.gsInterestGroup('affected_IG_scope').GetName] [concept_interest_group]は人口増加の分野における政府介入の適切な程度について立場を変える意向を表明しました。"
    population_policy_ideology.f:0 "このイベントは平均[concept_sol]が人口政策の適切な動的[concept_ideology]と一致しなくなったため発生しました。\n\n#BOLD [concept_ideology]の変化は以下のとおりです：#!\n\n#BOLD #green 25以上[concept_sol]#! - $ideology_pro_population$ [concept_ideology]\n\n#BOLD #yellow 10～25[concept_sol]#! - $ideology_neutral_population$ [concept_ideology]\n\n#BOLD #red 10以下[concept_sol]#! - $ideology_anti_population$ [concept_ideology]"
    
    dynamic_ideology_system_1.option:0 "変更を受け入れる。"
    dynamic_ideology_system_2.option:0 "[concept_interest_group]に潜む我々のスパイを使ってこれを阻止する。"
    
    changing_civil_defence_level:0 "民間防衛レベルを最近変更"
    
    je_civil_defence:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]民間防衛"
    je_civil_defence_reason:0 "民間防衛とは国家の市民（一般に非戦闘員）を人為的災害や自然災害から守るための取り組みです。予防・軽減・準備・対応または緊急避難と復旧という緊急事態対応の原則に基づいています。\n\nこのModでは民間防衛によって核戦争や戦略爆撃の影響が軽減されます。\n\n注：民間防衛の強度はより高度な軍事技術を研究することで高められます。"
    je_civil_defence_increase_civil_defence_button:0 "予算を増やす"
    je_civil_defence_increase_civil_defence_button_desc:0 "国家は民間防衛への予算配分を増やしてそのレベルを引き上げます。"
    je_civil_defence_decrease_civil_defence_button:0 "予算を減らす"
    je_civil_defence_decrease_civil_defence_button_desc:0 "国家は民間防衛への予算配分を減らしてそのレベルを引き下げます。"
    
    USA_PER_Hostage_Crisis.t:0 "イランアメリカ大使館人質事件？"
    USA_PER_Hostage_Crisis.d:0 "イランアメリカ大使館人質事件はイランとアメリカ合衆国の間で起きた外交的対立です。イラン革命を支持する「イマームの路線に従うムスリム学生団」に属する武装したイランの大学生たちがテヘランのアメリカ大使館を占拠し、アメリカの外交官と市民53名を人質に取りました。その中にはホセイン・デフガーン、モハンマド・アリー・ジャアファリー、モハンマド・バーゲリーらがいました。"
    USA_SOV_U2_Incident.t:0 "U-2撃墜事件？"
    USA_SOV_U2_Incident.d:0 "1960年5月1日、ソ連領内の奥深くで写真偵察を行っていたアメリカのU-2偵察機がソ連防空軍によって撃墜されました。アメリカ人パイロットのフランシス・ゲーリー・パワーズが操縦する同機はパキスタンのペシャワールから離陸しており、地対空ミサイルの直撃を受けてスヴェルドロフスク（現エカテリンブルク）近郊に墜落しました。パワーズはパラシュートで降下し、捕らえられました。"
    USA_SOV_Able_Archer.t:0 "エイブル・アーチャー83危機？"
    USA_SOV_Able_Archer.d:0 "エイブル・アーチャー83は1983年11月にNATOが実施した年次軍事演習です。1983年11月7日に始まったこの年の演習では新たな独自形式の暗号通信や無線封止、政府首脳の参加など、例年には見られなかった要素がいくつも導入されました。この現実味の増大に加え、アメリカとソ連の緊張関係やヨーロッパへのパーシングII核ミサイル配備が迫っていたことから、ソ連の政治局員や軍人の一部はエイブル・アーチャー83が本物の核先制攻撃の準備を隠すための欺瞞だと考えました。これに対しソ連は核戦力を臨戦態勢に置き、東ドイツとポーランドの航空部隊に警戒態勢を敷きました。"
    SOV_USA_KOR_Incident.t:0 "大韓航空007便撃墜事件"
    SOV_USA_KOR_Incident.d:0 "大韓航空007便はニューヨークからアラスカ州アンカレッジを経由してソウルへ向かう大韓航空の定期便でした。1983年9月1日、同便はソ連のスホーイSu-15迎撃機によって撃墜されました。このボーイング747旅客機はアンカレッジからソウルへ向かう途中でしたが、乗員の航法ミスにより予定の航路から外れ、ソ連の飛行禁止空域を通過してしまいました。ソ連空軍はこの国籍不明機を領空に侵入したアメリカの偵察機とみなし、警告射撃の後に空対空ミサイルで撃墜しました。"
    USA_GUA_Overthrow.t:0 "PBSUCCESS作戦？"
    USA_GUA_Overthrow.d:0 "1953年8月、アイゼンハワーはハコボ・アルベンス打倒を目的とするCIAの作戦を承認しました。作戦名はPBSUCCESS作戦です。この作戦には「心理戦および政治工作」のために270万米ドルの予算が与えられました。カスティージョ・アルマスはグアテマラからの亡命者や近隣諸国の住民から小規模な傭兵部隊を募るのに十分な資金を受け取りました。この部隊は解放軍と呼ばれました。CIAはニカラグアとホンジュラスに訓練キャンプを設け、武器と数機の爆撃機を供与しました。"
    SOV_AFG_Overthrow.t:0 "嵐333号作戦"
    SOV_AFG_Overthrow.d:0 "作戦名「嵐333号作戦」として知られるタージベグ宮殿襲撃は、1979年12月27日にソ連がアフガニスタンで実行した軍事襲撃です。特殊部隊と空挺部隊が厳重に要塞化されたカーブルのタージベグ宮殿を急襲し、アフガニスタンの指導者ハフィーズッラー・アミーンを暗殺しました。アミーンはアフガニスタン人民民主党（PDPA）のハルク派に属し、1978年4月のサウル革命で権力を握っていました。これがソ連・アフガン戦争の始まりとなりました。"
    EGR_WGR_Berlin_Wall.t:0 "ベルリンの壁？"
    EGR_WGR_Berlin_Wall.d:0 "ベルリンの壁は1961年から1989年まで西ベルリンを取り囲み、東ベルリンおよびドイツ民主共和国から隔てていた警備付きのコンクリート障壁です。ベルリンの壁の建設は1961年8月13日にDDR政府によって開始されました。巨大なコンクリート壁に沿って監視塔が並び、その内側には対車両壕や釘床などの防御設備を備えた広い区域（後に「死の帯」と呼ばれる）が設けられていました。壁建設の主な目的は、東ドイツ市民の西側への逃亡を阻止することでした。"
    EGR_WGR_Berlin_Wall_Fall.t:0 "ベルリンの壁崩壊？"
    EGR_WGR_Berlin_Wall_Fall.d:0 "平和革命のさなかの1989年11月9日に起きたベルリンの壁崩壊は、東ベルリンの通行制限が群衆に押し切られ撤廃されたことで、ベルリンの壁と比喩としての鉄のカーテンが崩れ去る始まりとなりました。壁は各所で突破され、翌年6月には計画的な解体が始まりました。"
    USA_CUB_Overthrow.t:0 "ピッグス湾侵攻？"
    USA_CUB_Overthrow.d:0 "ピッグス湾侵攻は1961年にアメリカ合衆国とキューバ民主革命戦線（DRF）がキューバ南西岸で行い失敗に終わった上陸作戦です。DRFはフィデル・カストロのキューバ革命に反対する亡命キューバ人で構成され、米国政府が秘密裏に資金を提供し指揮していました。作戦は冷戦の最盛期に行われ、その失敗はキューバ・アメリカ・ソ連の関係に影響を与えました。"
    GBR_Chagos_Island_deport.t:0 "チャゴス人の追放？"
    GBR_Chagos_Island_deport.d:0 "イギリスはアメリカの要請を受けて1968年にチャゴス諸島の住民の追放を開始し、1973年4月27日にペロス・バニョス環礁に残っていたチャゴス人を追放して強制移住を完了しました。"
    USA_SOV_Azorian_Incident.t:0 "アゾリアン計画？"
    USA_SOV_Azorian_Incident_1.t:0 "沈没したソ連潜水艦をアメリカが回収"
    USA_SOV_Azorian_Incident.d:0 "アゾリアン計画は1974年に米国中央情報局（CIA）が専用に建造された船ヒューズ・グローマー・エクスプローラーを用いて太平洋の海底に沈んだソ連の潜水艦K-129を引き揚げようとした計画です。K-129は1968年にハワイの北西約1,560マイル（2,510km）の地点で沈没しました。アゾリアン計画は冷戦期で最も複雑かつ高価で秘匿性の高い諜報作戦のひとつであり、その費用は約$800 million, or $49億ドル（現在の価値）に上りました。"
    USA_Reagan_Doctrine.t:0 "レーガン・ドクトリン？"
    USA_Reagan_Doctrine.d:0 "レーガン・ドクトリンは冷戦末期にソ連の世界的影響力を圧倒するためレーガン政権が実行したアメリカ合衆国の戦略です。レーガン・ドクトリンのもとアメリカはアフリカ、アジア、ラテンアメリカにおいてソ連が支援する親共産主義政権を「巻き返す」べく反共ゲリラや抵抗運動に公然・非公然の援助を行いました。このドクトリンは冷戦に勝利するための政権全体の戦略の一環としてこれらの地域におけるソ連の影響力を削ぐことを目的としていました。"
    SOV_Brezhnev_Doctrine.t:0 "ブレジネフ・ドクトリン？"
    SOV_Brezhnev_Doctrine.d:0 "ブレジネフ・ドクトリンは中東欧のソ連圏のいずれかの国における「社会主義体制」への脅威はすべての国への脅威であり、ゆえに他の社会主義国による介入が正当化されると宣言したソ連の外交政策です。これは同じ1968年に先立って行われたソ連主導のチェコスロバキア占領と同国の改革派政権の打倒を正当化するために宣言されました。ここでいう「社会主義」とはクレムリンに忠実な共産党による支配を意味していました。"
    GBR_Atlanticism.t:0 "サッチャー流の大西洋主義？"
    GBR_Atlanticism_1.t:0 "特別な関係？"
    GBR_Atlanticism.d:0 "サッチャーは首相在任中にアメリカのロナルド・レーガン大統領との大西洋を挟んだ関係を大いに重視しました。他の西側同盟国がさほど声を上げない場面でも、彼女はしばしばレーガンの政策を公然と支持しました。たとえば1986年のアメリカによるリビア・アラブ・ジャマーヒリーヤ爆撃のような空襲にイギリスの基地を使用することをアメリカ軍機に許可したほか、イギリスをはじめとする西欧諸国を標的としたソ連のSS-20核ミサイル配備への対抗として、アメリカの巡航ミサイルとパーシング・ミサイルのイギリス国内への配備を認めました。"
    NOR_Dag_Hammarskjold_death.t:0 "ダグ・ハマーショルドの死？"
    NOR_Dag_Hammarskjold_death.d:0 "1961年9月18日、ハマーショルドは国連コンゴ活動の部隊とモイーズ・チョンベ率いるカタンガ軍との停戦交渉に向かう途中でした。彼の乗ったダグラスDC-6旅客機SE-BDYは北ローデシア（現ザンビア）のンドラ近郊で墜落しました。ハマーショルドは墜落により死亡し、他の乗客15人も全員が亡くなりました。国連には継承順位が定められていなかったため、ハマーショルドの死は後継者危機を引き起こし、安全保障理事会が後任を投票で選ぶことになりました。墜落の経緯はいまだに明らかになっていません。1962年のローデシアの調査は操縦士の過失が原因と結論づけましたが、その後の国連の調査では墜落の原因を特定できませんでした。"
    LEB_Crisis_1958.t:0 "レバノン危機"
    LEB_Crisis_1958.d:0 "1958年のレバノン危機は国内の政治的・宗教的緊張によって引き起こされた政治危機であり、アメリカの軍事介入を伴いました。介入は約3か月続き、支援を要請したカミール・シャムーン大統領がレバノン大統領の任期を終えるまで続きました。アメリカ軍とレバノン政府軍はベイルート港とベイルート国際空港を占領しました。危機が収束するとアメリカは撤退しました。"
    ITA_SAN_1957.t:0 "ロヴェレータ事件？"
    ITA_SAN_1957.d:0 "ロヴェレータ事件（fatti di Rovereta）は1957年にサンマリノで起きた憲法危機です。予定されていた執政の選出を阻むため大評議会が意図的に定足数割れの状態に置かれました。任期の切れた退任予定の執政に対抗してロヴェレータ村に臨時政府が樹立されました。イタリアは臨時政府を承認し、イタリアのカラビニエリが自国領に接する工場の三方を警護しました。10月11日に執政側が屈して臨時政府を承認し、危機は終息しました。"
    HND_PAK_KAS_1999.t:0 "カルギル戦争？"
    HND_PAK_KAS_1999.d:0 "カルギル戦争は1999年5月から7月にかけてインドとパキスタンの間で戦われた戦争です。戦場となったのは当時インド統治下のジャンムー・カシミール州に属していたラダックのカルギル県と、実効支配線（LoC）沿いの地域でした。"
    HND_PAK_KAS_2025.t:0 "印パ危機？"
    HND_PAK_KAS_2025.d:0 "2025年4月22日のパハルガム・テロ事件を受けてインドとパキスタンの間に危機が生じました。発端はカシミールで武装勢力がインド人観光客25人を殺害したことでした。当初は抵抗戦線（TRF）が犯行声明を出しました。4月24日以降、実効支配線（LoC）沿いで両国の武力衝突が報告されました。2025年5月7日にインドがパキスタン領内へミサイル攻撃を行い、両国間の軍事衝突に発展しました。同日パキスタン軍はジャンムーのプーンチに猛攻撃を加えて応戦し、民間人16人が死亡し数百戸の家屋が破壊されました。2025年5月10日、両国間の合意を受けて停戦が発表されました。"
    SOV_ALB_Vlora_Incident.t:0 "ヴロラ事件？"
    SOV_ALB_Vlora_Incident.d:0 "ヴロラ事件は1961年にアルバニアとソ連の間で起きた軍事的対立です。アルバニア人民軍がヴロラ海軍基地を封鎖し、ソ連の艦船と装備が接収されました。この事件は両国間の外交的緊張の高まりを浮き彫りにし、最終的にソ連軍はアルバニアから追放されました。"
    SRL_TAE_civil_war_end.t:0 "北部攻勢？"
    SRL_TAE_civil_war_end.d:0 "2008年から2009年にかけてのSLA北部攻勢は、スリランカ北部地方でスリランカ軍と分離主義勢力タミル・イーラム解放のトラ（LTTE）との間で戦われた武力紛争です。戦いはスリランカ軍（SLA）が島北部のLTTE防衛線の突破を図る攻勢から始まり、25年に及ぶ内戦を軍事的勝利によって終結させることを目指していました。"
    USA_SOV_Great_Seal_Bug.t:0 "国璽盗聴器事件"
    USA_SOV_Great_Seal_Bug.d:0 "1945年、ソ連の少年団員がモスクワ駐在のアメリカ大使に国璽を彫刻した木製の紋章を贈りました。その内部には電源を持たない受動型盗聴器「ザ・シング」が隠されていました。7年間発見されることなくソ連の盗聴を可能にしたこの装置は、冷戦期の諜報・監視技術における画期となりました。国璽盗聴器が露見したのは、大使への贈呈から7年後の1952年のことです。国務省による定期的な調査の中で発見され、木製の紋章の内部に受動型盗聴器が隠されていたことが明らかになりました。1960年5月26日、ヘンリー・カボット・ロッジ・ジュニア米国大使は国連安全保障理事会での劇的な演示の中でこの盗聴器を公開しました。"
    iraq_kuwait_showdown_1961.t:0 "イラク・クウェート危機"
    iraq_kuwait_showdown_1961.d:0 "1958年、アブドルカリーム・カーシムがイラクで権力を掌握しました。西側諸国は彼を予測不能な人物とみなし、イラクを不安定な国と見ていました。1961年6月25日、イギリスがクウェートにおける権限を放棄したのを受けて、カーシムはクウェートをイラクに編入すると宣言しました。イギリスは軍事的脅威が差し迫っていると判断しました。"
    Operation_Vantage.t:0 "ヴァンテージ作戦？"
    Operation_Vantage_1.t:0 "イラク・クウェート危機へのイギリスの介入"
    Operation_Vantage.d:0 "ヴァンテージ作戦は、1961年に新たに独立したクウェートを隣国イラクの領有権主張から守るために行われたイギリスの軍事作戦です。イギリスはクウェートのシャイフ、アブドゥッラー3世・アル＝サーリム・アル＝サバーハからの保護要請に応じ、数日のうちに陸海空の戦力を展開させました。イラクは攻撃に踏み切らず、イギリス軍はその後アラブ連盟の部隊と交代しました。"
    Operation_Caban.t:0 "カバン作戦？"
    Operation_Caban.d:0 "カバン作戦は1979年の中央アフリカ・クーデターとしても知られ、1979年9月にフランスの情報機関SDECEが実施した無血の軍事作戦です。皇帝ボカサ1世を廃位し、亡命していた前大統領ダビド・ダッコを復権させ、中央アフリカ帝国の国名を中央アフリカ共和国へ戻すものでした。"
    FRA_NZL_Rainbow_Warrior_Incident.t:0 "レインボー・ウォリアー号の撃沈？"
    FRA_NZL_Rainbow_Warrior_Incident.d:0 "1985年7月10日、フランスの秘密工作員がニュージーランドのオークランドでグリーンピースの船レインボー・ウォリアー号を爆破しました。ムルロア環礁での核実験への抗議を阻止するためでした。船は沈没し、写真家フェルナンド・ペレイラが死亡しました。「サタニック作戦」と名付けられたこの秘密攻撃は世界的な非難を招き、フランスとニュージーランドの関係を悪化させました。"
    FRA_NZL_Rainbow_Warrior_Incident_1.t:0 "レインボー・ウォリアー号の撃沈"
    USA_Donroe_Doctrine_2026.t:0 "ドンロー主義？"
    USA_Donroe_Doctrine_2026.d:0 "ドンロー主義は「モンロー主義へのトランプ系論」とも呼ばれ、ドナルド・トランプ大統領の南北アメリカにおける外交政策の原則を指します。歴史的なモンロー主義を翻案したもので、第2次トランプ政権が西半球におけるアメリカの優位を確立しようとしていると見なされていることを表しています。"
    USA_VNZ_Overthrow_2026.t:0 "「絶対的決意」作戦？"
    USA_VNZ_Overthrow_2026.d:0 "2026年1月3日、アメリカ合衆国はベネズエラへの軍事攻撃を開始し、現職のベネズエラ大統領ニコラス・マドゥロとその妻シリア・フロレスを拘束しました。「絶対的決意」作戦と名付けられたこの作戦は現地時間の午前2時頃に始まり、爆発が確認されました。米軍はベネズエラ北部各地のインフラを爆撃して防空網を制圧し、その間に拘束部隊がカラカスのマドゥロの邸宅を襲撃しました。マドゥロとフロレスは裁判を受けるため米軍によってニューヨーク市へ移送されました。"
    USA_PER_START.t:0 "イラン核合意？"
    USA_PER_START.d:0 "包括的共同作業計画（JCPOA）はイラン核合意とも呼ばれ、制裁の緩和などと引き換えにイランの核開発計画を制限する合意でした。JCPOAのもとでイランは兵器級のウランやプルトニウムの製造につながりうる核燃料サイクル活動を制限し、核開発計画を抑制することに同意しました。JCPOAは稼働する遠心分離機の数と種類、ウラン濃縮度、そしてイランが保有する濃縮ウランの量を制限しました。フォルドゥ、ナタンズ、アラクの主要施設は医療・産業研究などの民生用途に転用されました。イランは核燃料サイクル関連活動に対するIAEAのより踏み込んだ監視措置を受け入れることにも同意しました。"
    RUS_UKR_Minsk.t:0 "ミンスク合意？"
    RUS_UKR_Minsk.d:0 "ミンスク合意は武装したロシア系分離主義勢力とウクライナ軍の間で戦われ、ロシア正規軍が中心的な役割を担ったドンバス戦争の終結を目指す一連の国際合意でした。2014年8月末のイロヴァイスクでの敗北を受けて、ロシアはウクライナに第一次ミンスク議定書（ミンスクI）への署名を強いました。この合意は停戦、前線からの重火器の撤退、捕虜の解放、ドンバスの一部地域に自治を認めるウクライナの憲法改正、そして国境管理のウクライナ政府への返還を含む一連の措置で構成されていました。"
    YUG_ITA_Treaty_of_Osimo.t:0 "オージモ条約？"
    YUG_ITA_Treaty_of_Osimo.d:0 "オージモ条約は1975年11月10日にイタリアのオージモでイタリアとユーゴスラビアが署名した条約で、トリエステ自由地域を両国間で最終的に分割するものでした。港湾都市トリエステと北西に延びる細い沿岸部（A地区）はイタリアに、イストリア半島北西部の一部（B地区）はユーゴスラビアに帰属することになりました。"
    Korean_Armistice_Agreement_1953.t:0 "朝鮮戦争休戦協定？"
    Korean_Armistice_Agreement_1953.d:0 "朝鮮戦争休戦協定は朝鮮戦争の戦闘行為を停止させた休戦協定です。国連軍司令部（UNC）を代表してアメリカ陸軍のウィリアム・ハリソン・ジュニア中将とマーク・W・クラーク将軍が、朝鮮人民軍（KPA）を代表して北朝鮮の指導者金日成と南日将軍が、中国人民志願軍（PVA）を代表して彭徳懐がこれに署名しました。休戦協定は1953年7月27日に調印され、「最終的な平和的解決が達成されるまで朝鮮におけるあらゆる戦闘行為と武力行使の完全な停止を確保する」ことを目的としていました。"
    
