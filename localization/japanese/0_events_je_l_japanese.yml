    je_reserved_powers:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ceremonial_body_custom_title')]"
    je_reserved_powers_reason:0 "[ROOT.GetCountry.GetName]の憲法の下では、[SCOPE.GetRootScope.GetCountry.GetCustom('government_ceremonial_body_custom_title')]は[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]で可決されたあらゆる法案に対して限定的な拒否権を持ちます。ただし[SCOPE.GetRootScope.GetCountry.GetCustom('government_ceremonial_body_custom_title')]が法案を拒否しても、その拒否権は後に[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の過半数の賛成によって覆される場合があります。\n\n#BOLD [SCOPE.sCharacter('ceremonial_head_of_state').GetPrimaryRoleTitle]：#![SCOPE.sCharacter('ceremonial_head_of_state').GetFullName]（[SCOPE.sCharacter('ceremonial_head_of_state').GetInterestGroup.GetName]）\n\n注：[SCOPE.sCharacter('ceremonial_head_of_state').GetPrimaryRoleTitle]は、[SCOPE.sCharacter('ceremonial_head_of_state').GetInterestGroup.GetName]が[concept_law]に#r 反対#!または#r 強く反対#!している場合、[concept_government]が[Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enacted$')]しようとしているあらゆる[Concept('concept_law','$concept_laws$')]に拒否権を行使します。\n\n注：この[concept_journal_entry]は[GetLawType('law_hybrid_chamber').GetName][concept_law]を廃止することで取り除けます。"
    
