    je_the_cold_war_democratic:0 "冷戦（民主主義ブロック）"
    je_the_cold_war_democratic_reason:0 "冷戦とは[ROOT.GetCountry.GetName]と[SCOPE.sCountry('communist_rival_superpower').GetName]およびそれぞれの同盟国である民主主義ブロックと共産主義ブロックの間に続く地政学的緊張の時代です。[ROOT.GetCountry.GetName]は共産主義の超大国を一つも残さないことで、世界的影響力を巡るこのイデオロギー的・地政学的闘争に勝利しなければなりません！"
    
