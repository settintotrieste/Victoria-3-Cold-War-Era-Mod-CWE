    je_constitutionalise_national_values_button:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('national_value_name')]を憲法化する"
    je_constitutionalise_national_values_button_desc:0 "[concept_government]は、[ROOT.GetCountry.GetName]の国家的価値観がこれ以上変化するのを防ぎ、[SCOPE.GetRootScope.GetCountry.GetCustom('national_value_name')]を支持する[Concept('concept_interest_group', '$concept_interest_groups$')]を満足させるために、[SCOPE.GetRootScope.GetCountry.GetCustom('national_value_name')]の価値観を憲法化することができます。\n\nなお、[SCOPE.GetRootScope.GetCountry.GetCustom('national_value_name')]の価値観を憲法に制定することで、特定の法律が制定できなくなる可能性があることに注意してください。"
    
    je_unconstitutionalise_national_values_button:0 "国家的価値観を非憲法化する"
    je_unconstitutionalise_national_values_button_desc:0 "以前の[concept_government]が[SCOPE.GetRootScope.GetCountry.GetCustom('national_value_name')]の価値観を憲法に制定しました。これにより、[ROOT.GetCountry.GetName]の国家的価値観は[SCOPE.GetRootScope.GetCountry.GetCustom('national_value_name')]として固定され、特定の法律が制定できなくなりました。\n\nこの憲法に制定された価値観を廃止することで、国内で50％以上の[concept_clout]を持つ[concept_interest_group]の[concept_ideology]に従って国家的価値観が変化できるようになり、特定の法律の制定に関する制限が解除されます。"
    
