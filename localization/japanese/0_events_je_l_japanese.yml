    devolution_system_1.d:0 "[SCOPE.sState('state_to_release').GetName]の[SCOPE.sCulture('culture_to_release').GetName]人は[ROOT.GetCountry.GetName]に対し、自らの[concept_homeland]に内政上のより大きな自治を認めるよう求めています。"
    devolution_system_1.f:0 "[SCOPE.sCulture('culture_to_release').GetName]の要求を受け入れると[SCOPE.sCulture('culture_to_release').GetName]の[concept_homeland]に$XFC$が創設され、その後自動的に適切な国へ変換されます。"
