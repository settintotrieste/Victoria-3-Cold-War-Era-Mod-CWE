    je_space_race_space_rocket_button_desc:0 "打ち上げ機とは、ペイロード（有人宇宙船や人工衛星）を地表または低層大気から宇宙空間へ運ぶために設計された、ロケット推進の機体です。最も一般的な形式は弾道ミサイル型の多段式ロケットです。"
    je_space_race_satellite_button_desc:0 "人工衛星とは、天体の周回軌道へ意図的に投入された物体です。通信中継・気象予報・航法（GPS）・放送・科学研究・地球観測など、その用途は多岐にわたります。軍事的にはさらに偵察・早期警戒・信号諜報、そして兵器の投射にも用いられ得ます。"
    je_space_race_astronaut_button_desc:0 "宇宙飛行士とは、有人宇宙飛行計画によって訓練と装備を与えられ、宇宙船の船長または乗組員として派遣される人物です。"
    je_space_race_space_probe_button_desc:0 "宇宙探査機とは、宇宙を探査し科学的情報を収集するために送り出される無人の装置です。"
    je_space_race_moon_mission_button_desc:0 "月面着陸とは宇宙船が月の表面に到達することです。"
    je_space_race_space_station_button_desc:0 "宇宙ステーションとは乗組員を長期間軌道上で維持できる宇宙船であり、宇宙居住施設の一種です。"
    je_space_race_space_telescope_button_desc:0 "宇宙望遠鏡または宇宙天文台とは天体を観測するために宇宙空間に設置された望遠鏡です。"
    je_space_race_mars_mission_button_desc:0 "火星着陸とは宇宙船が火星の表面に到達することです。"
    je_space_race_moon_base_button_desc:0 "月面基地とは月の地表または地下に設けられた施設であり、人類の月面での活動を可能にします。"
    je_space_race_mars_base_button_desc:0 "火星基地とは火星の地表または地下に設けられた施設であり、人類の火星での活動を可能にします。"
    
    je_space_race_fake_moon_mission_button:0 "月面着陸を捏造する"
    je_space_race_fake_moon_mission_button_desc:0 "我が国最高の映画スタジオに資金を出し、[ROOT.GetCountry.GetAdjectiveNoFlag]が月に着陸する本物さながらの映像を制作させます。[ROOT.GetCountry.GetNameNoFlag]が実際に月へ着陸したと世界に信じ込ませるのです。"
    moon_mission_faked.t:0 "月面着陸の捏造が発覚"
    moon_mission_faked.d:0 "[ROOT.GetCountry.GetNameNoFlag]の[ROOT.GetCountry.GetAdjectiveNoFlag]人が月に着陸する粗雑な映像で世界を欺こうという試みは誰も信じさせられず、かえってこの国への嘲笑を世界中に広げました。"
    moon_mission_faked_success.t:0 "月面着陸の捏造に成功"
    moon_mission_faked_success.d:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の宇宙飛行士が月に着陸する捏造映像は、[ROOT.GetCountry.GetNameNoFlag]が実際に月へ着陸したと世界に信じ込ませることに成功しました。"
    
    je_space_race_fake_mars_mission_button:0 "火星着陸を捏造する"
    je_space_race_fake_mars_mission_button_desc:0 "我が国最高の映画スタジオに資金を出し、[ROOT.GetCountry.GetAdjectiveNoFlag]が火星に着陸する本物さながらの映像を制作させます。[ROOT.GetCountry.GetNameNoFlag]が実際に火星へ着陸したと世界に信じ込ませるのです。"
    mars_mission_faked.t:0 "火星着陸の捏造が発覚"
    mars_mission_faked.d:0 "[ROOT.GetCountry.GetNameNoFlag]の[ROOT.GetCountry.GetAdjectiveNoFlag]人が火星に着陸する粗雑な映像で世界を欺こうという試みは誰も信じさせられず、かえってこの国への嘲笑を世界中に広げました。"
    mars_mission_faked_success.t:0 "火星着陸の捏造に成功"
    mars_mission_faked_success.d:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の宇宙飛行士が火星に着陸する捏造映像は、[ROOT.GetCountry.GetNameNoFlag]が実際に火星へ着陸したと世界に信じ込ませることに成功しました。"
    
