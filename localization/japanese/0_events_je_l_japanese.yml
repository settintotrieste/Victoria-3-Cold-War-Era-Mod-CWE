    join_nuclear_non_proliferation_treaty_decision:0 "核兵器不拡散条約に署名する"
    join_nuclear_non_proliferation_treaty_decision_desc:0 "核兵器不拡散条約は、核兵器および兵器技術の拡散を防止し、原子力の平和利用における協力を促進し、核軍縮ならびに全面完全軍縮の達成という目標を推進することを目的とした国際条約です。この条約に署名すると、この国のすべての核兵器が撤去され、進行中の核兵器開発計画も終了することに注意してください。"
    signed_NPT_1_tt:0 "この国は核兵器不拡散条約に署名し、少なくとも10年間はその拘束を受けます。"
    
    leave_nuclear_non_proliferation_treaty_decision:0 "核兵器不拡散条約を破棄する"
    leave_nuclear_non_proliferation_treaty_decision_desc:0 "核兵器不拡散条約は、核兵器および兵器技術の拡散を防止し、原子力の平和利用における協力を促進し、核軍縮ならびに全面完全軍縮の達成という目標を推進することを目的とした国際条約です。この条約を破棄すれば、この国は再び核兵器開発計画を開始できるようになります。"
    signed_NPT_2_tt:0 "この国は少なくとも10年間、核兵器不拡散条約の締約国となっています。"
    
    did_not_sign_NPT_tt:0 "この国は核兵器不拡散条約の締約国ではありません"
    
    join_chemical_non_proliferation_treaty_decision:0 "化学兵器禁止条約に署名する"
    join_chemical_non_proliferation_treaty_decision_desc:0 "化学兵器禁止条約（CWC）は、オランダのハーグに本部を置く政府間機関である化学兵器禁止機関（OPCW）が運用する軍備管理条約です。1997年4月29日に発効しました。化学兵器の使用を禁じるとともに、ごく限られた目的（研究、医療、医薬、防護）を除き、化学兵器およびその前駆物質の大規模な開発、生産、貯蔵、移譲を禁止しています。"
    signed_CWC_1_tt:0 "この国は化学兵器禁止条約に署名し、少なくとも10年間はその拘束を受けます。"
    
    leave_chemical_non_proliferation_treaty_decision:0 "化学兵器禁止条約を破棄する"
    leave_chemical_non_proliferation_treaty_decision_desc:0 "化学兵器禁止条約（CWC）は、オランダのハーグに本部を置く政府間機関である化学兵器禁止機関（OPCW）が運用する軍備管理条約です。1997年4月29日に発効しました。化学兵器の使用を禁じるとともに、ごく限られた目的（研究、医療、医薬、防護）を除き、化学兵器およびその前駆物質の大規模な開発、生産、貯蔵、移譲を禁止しています。この条約を破棄すれば、この国は再び化学兵器計画を開始できるようになります。"
    signed_CWC_2_tt:0 "この国は化学兵器禁止条約に署名してから少なくとも10年が経過しています。"
    
    did_not_sign_CWC_tt:0 "この国は化学兵器禁止条約の署名国ではありません"
    
    join_biological_non_proliferation_treaty_decision:0 "生物兵器禁止条約に署名する"
    join_biological_non_proliferation_treaty_decision_desc:0 "生物兵器禁止条約（生物毒素兵器禁止条約）は、生物兵器および毒素兵器の開発、生産、取得、移譲、貯蔵、使用を禁止し、これらを事実上廃絶する軍縮条約です。"
    signed_BWC_1_tt:0 "この国は生物兵器禁止条約に署名し、少なくとも10年間はその拘束を受けます。"
    
    leave_biological_non_proliferation_treaty_decision:0 "生物兵器禁止条約を破棄する"
    leave_biological_non_proliferation_treaty_decision_desc:0 "生物兵器禁止条約（生物兵器および毒素兵器禁止条約）は、生物兵器・毒素兵器の開発・生産・取得・移譲・貯蔵・使用を禁じることでこれらを事実上撤廃する軍縮条約です。この条約を破棄すれば、この国は再び生物兵器計画を開始できます。"
    signed_BWC_2_tt:0 "この国は10年以上にわたり生物兵器禁止条約の締約国です。"
    
    did_not_sign_BWC_tt:0 "この国は生物兵器禁止条約の締約国ではありません"
    
    generic_decolonisation_indy.1.tt:0 "[SCOPE.sCountry('overlord_in_question_scopes').GetName]に独立戦争を宣言する！"
    generic_decolonisation_indy.t:0 "[ROOT.GetCountry.GetAdjective]の独立戦争？"
    generic_decolonisation_indy.d:0 "[ROOT.GetCountry.GetAdjective]人は[SCOPE.sCountry('overlord_in_question_scopes').GetName]が[ROOT.GetCountry.GetName]への独立付与に消極的であることに憤慨しています。高まる民族主義的感情を受け、政府の一部は[SCOPE.sCharacter('puppet_leader_in_question_scopes').GetFullName]に急進的な提案を持ちかけました。[ROOT.GetCountry.GetName]は独立を宣言し、[SCOPE.sCountry('overlord_in_question_scopes').GetName]との一切の関係を一方的に断つべきだというのです。"
    generic_decolonisation_indy.f:0 "[ROOT.GetCountry.GetAdjective]の独立のために戦うことを拒めば、政府の全員が臆病者の汚名を着ることになるでしょう。"
    generic_decolonisation_indy.option.1:0 "自由のために戦え！"
    generic_decolonisation_indy.option.2:0 "ふん、自由など過大評価されている……"
    
    self_governing_colony.tt:0 "[SCOPE.sCulture('culture_to_release').GetName]植民地に$semi_autonomous_colony$を創設する"
    generic_decolonisation_indy_2a.t:0 "[SCOPE.sCulture('culture_to_release').GetName]の自治？"
    generic_decolonisation_indy_2b.t:0 "[SCOPE.sState('state_to_release').GetName]に自治を？"
    generic_decolonisation_indy_2.d:0 "[SCOPE.sState('state_to_release').GetName]の[SCOPE.sCulture('culture_to_release').GetName]人は[ROOT.GetCountry.GetName]に対し、自らの[concept_homeland]に自治を認めるよう求めています。"
    generic_decolonisation_indy_2.f:0 "[SCOPE.sCulture('culture_to_release').GetName]の要求を受け入れると、[SCOPE.sCulture('culture_to_release').GetName]の[concept_homeland]に$XFC$が創設され、その後自動的に適切な国へと変換されます。"
    generic_decolonisation_indy_2.option.1:0 "内政の自治を求める彼らのささやかな要求を受け入れよう。"
    generic_decolonisation_indy_2.option.2:0 "ならぬ、[SCOPE.sState('state_to_release').GetName]では直接統治を維持する！"
    
    generic_decolonisation_indy.3.t:0 "[SCOPE.sState('state_to_release').GetName]における脱植民地化の失敗"
    generic_decolonisation_indy.3.d:0 "[SCOPE.sState('state_to_release').GetName]の[SCOPE.sCulture('primary_culture_scope').GetName]人は自国の脱植民地化の方法を決められず、この植民地は外国勢力による直接統治に戻ることになります。"
    generic_decolonisation_indy.3.f:0 "このイベントは[SCOPE.sCountry('failed_country_scope').GetName]国家タグが変化できる対象国が存在しなかったため発生しました。そのため[SCOPE.sCountry('failed_country_scope').GetName]は宗主国に再併合されます。宗主国が存在しない場合は[concept_primary_cultures]を共有するいずれかの国に併合されます。"
    generic_decolonisation_indy_3.option:0 "悲しくはあるが不幸ではない。"
    
    generic_decolonisation_indy.4.t:0 "[ROOT.GetCountry.GetNameNoFlag]の独立"
    generic_decolonisation_indy.4.d:0 "[SCOPE.sState('indy_capital').GetCityHubName]で執り行われた盛大な式典において[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')][ROOT.GetCountry.GetRuler.GetFullName]が[ROOT.GetCountry.GetName]の外国人支配者から[ROOT.GetCountry.GetName]の人民へ権力を移譲しました。続いて新たな[ROOT.GetCountry.GetAdjective]の国旗が掲揚され、参列した群衆は歓喜に沸きました。"
    generic_decolonisation_indy.4.f:0 "我ら[ROOT.GetCountry.GetNameNoFlag]の人民は、ここに[ROOT.GetCountry.GetNameNoFlag]の独立を宣言する。権力の移譲およびその他の事項は、秩序ある形で可能な限り速やかに実行される。\n\n[ROOT.GetCountry.GetNameNoFlag]の人民の名において\n\n[ROOT.GetCountry.GetRuler.GetFullName]"
    generic_decolonisation_indy.4.option.1:0 "あらゆる民のための国家を築き上げるのだ！"
    generic_decolonisation_indy.4.option.2:0 "[SCOPE.sCulture('preferred_culture').GetName]の大義万歳！"
    
