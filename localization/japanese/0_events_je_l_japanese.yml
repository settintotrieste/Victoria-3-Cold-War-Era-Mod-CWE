    je_world_tension_system_reason:0 "世界緊張度とは、世界各国の間に広がる恐怖と不安の全体的な水準を表すものです。表示される数値は0％から100％の間を取ります。\n\n一般に世界緊張度が高いほど、好戦的な行動を取ることへの世論の支持は強まります。\n\n世界緊張度はAIの攻撃性や軍事化の度合いへの影響から株式市場への波及まで、ゲームにさまざまな効果を及ぼします。\n\n現在の世界緊張度：[GetPlayer.MakeScope.Var('world_tension_amount_display').GetValue]％"
    
