    espionage_conduct_economic_sabotage.t:0 "[SCOPE.sCountry('espionage_target').GetName]で経済破壊工作を行う機会"
    espionage_conduct_economic_sabotage.d:0 "[SCOPE.sCountry('espionage_target').GetName]で活動する[SCOPE.sCountry('espionage_attacker').GetAdjective]の工作員が[SCOPE.sCountry('espionage_target').GetAdjective]の工場、鉱山、鉄道の経済活動を妨害する機会を見つけました。彼らは労働争議を煽り[SCOPE.sCountry('espionage_target').GetAdjective]のサプライチェーンにおける重要な施設を爆破することを提案しています。この秘密工作は12か月にわたり[SCOPE.sCountry('espionage_target').GetName]の製造業、鉱業、インフラ施設の生産量を低下させるはずです。"
    espionage_conduct_economic_sabotage.f:0 "[SCOPE.sCountry('espionage_target').GetAdjective]の情報機関に我々の行動が察知される可能性があり、その場合[SCOPE.sCountry('espionage_target').GetName]との関係が著しく悪化することに注意してください。"   
    
