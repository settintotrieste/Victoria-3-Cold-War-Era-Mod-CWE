    UN_imf_interest_rate.f:0 "[SCOPE.sCountry('imf_interest_rate_target').GetName]は現在IMFから資金を借り入れているため、世界平均利子率ではなくIMFの利子率が適用されます。IMFの利子率は世界平均の経済見通しによって決まり、見通しが悪いほど利子率は低くなり、その逆も同様です。"
