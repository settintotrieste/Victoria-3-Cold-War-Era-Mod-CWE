    steal_nuclear_weapons.t:0 "[SCOPE.sCountry('former_nuclear_weapons_country').GetAdjectiveNoFlag]の大量破壊兵器の廃棄"
    steal_nuclear_weapons.d:0 "[ROOT.GetCountry.GetName]の査察官が[SCOPE.sCountry('former_nuclear_weapons_country').GetName]に到着し、[SCOPE.sCountry('former_nuclear_weapons_country').GetAdjective]のすべての大量破壊兵器の押収を開始しました。査察官は国内の核兵器・生物兵器・化学兵器をすべて撤去する予定です。"
    steal_nuclear_weapons.f:0 "[ROOT.GetCountry.GetName]はこれらの兵器を自ら保有するか廃棄するかを選択できます。"
    steal_nuclear_weapons.option.1:0 "大量破壊兵器を廃棄せよ！"
    steal_nuclear_weapons.option.2:0 "見つけた者勝ちだ！"
    
