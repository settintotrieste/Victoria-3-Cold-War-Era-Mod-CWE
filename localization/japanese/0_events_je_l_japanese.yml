    british_vanuatu.indy.t:0 "共同統治領ニューヘブリディーズを解消する？"
    british_vanuatu.indy.d:0 "共同統治領ニューヘブリディーズは1980年7月30日、英仏の共同統治領がバヌアツとして独立を果たしたことで終焉を迎えました。1906年以来数十年に及んだ二重の植民地統治を経てこの群島は共同統治の体制を解消し、主権を獲得した最後の英領太平洋植民地となると同時に、同地域で初めて独立を達成したフランス領ともなりました。"
