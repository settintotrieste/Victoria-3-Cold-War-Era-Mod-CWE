    je_vote_of_no_confidence_system_reason:0 "[ROOT.GetCountry.GetName]の議会制のもとでは[concept_government]は[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の信任を得ていなければなりません。\n\n現在の[concept_government]が[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の議席の#y 50％#!未満しか握っていないことにつけ込み[concept_opposition]は[concept_government]を倒して新たな[Concept('concept_election','$concept_elections$')]を実施させるため不信任投票を提出しました。\n\n@information!不信任投票を乗り切るには期限までに[concept_government]が[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]で少なくとも#y 単純多数#!を確保している必要があります。"
    
