    concept_sdr:0 "特別引出権"
    concept_sdr_desc:0 "特別引出権（SDR）は加盟国の公的準備を補完するためにIMFが創設した国際準備資産です。SDRは通貨ではなく、IMF加盟国の自由利用可能通貨に対する潜在的な請求権です。そのためSDRは各国に流動性を供給できます。"
    
