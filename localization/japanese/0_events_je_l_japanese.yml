    law_enactment_timer_2.tt:0 "最近法律の制定が一時停止・再開・妨害されていない（妨害された場合は6か月）"
    law_enactment_foreign_assistance.tt:0 "[ROOT.GetCountry.GetName]に駐在する外国の[concept_diplomat_character]のいずれかが現在の[concept_law]が[Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enacted$')]されることに#g 賛成#!または#g 強く賛成#!している"
    
