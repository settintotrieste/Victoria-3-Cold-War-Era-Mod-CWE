    je_term_limits_swiss:0 "[ROOT.GetCountry.GetRuler.GetLastName]の連邦大統領職"
    je_term_limits_swiss_reason:0 "スイス連邦大統領は、スイスの行政府である7人構成の連邦参事会の議長です。連邦議会によって任期1年で選出され、連邦参事会の会議を主宰するとともに特別な儀礼上の職務を担います。同輩中の首席であり、連邦大統領は他の6人の参事に優越する権限を持たず、担当する省庁の長も引き続き務めます。慣例としてこの職務は在任年数の順に持ち回りとなり、連邦副大統領が翌年に大統領職を引き継ぎます。"
    je_term_limits_swiss_goal:0 "[ROOT.GetCountry.GetRuler.GetFullName]大統領が任期の上限に達しました"
    je_term_limits_swiss_status:0 "在任期間[GetPlayer.MakeScope.Var('term_limit_var').GetValue]／12か月"
    
    je_term_limits.3.tt:0 "$SWI$である"
    
    je_term_limits_yugoslav:0 "[ROOT.GetCountry.GetRuler.GetLastName]の連邦幹部会"
    je_term_limits_yugoslav_reason:0 "ユーゴスラビアでは1971年の1963年憲法改正以降、集団指導制の幹部会が存在していました。別個の条項によりヨシップ・ブロズ・チトーには無期限の任期が認められており、新設の幹部会議長職は彼の死後まで発効しないものとされました。1980年5月4日にチトーが死去すると、当時の幹部会副議長が幹部会議長の職を継承しました。以後、幹部会議長の職は毎年持ち回りとなり、各議長はその前年に副議長を務めることとなりました。"
    je_term_limits_yugoslav_goal:0 "[ROOT.GetCountry.GetRuler.GetFullName]幹部会議長が任期の上限に達しました"
    je_term_limits_yugoslav_status:0 "在任期間[GetPlayer.MakeScope.Var('term_limit_var').GetValue]／12か月"
    
    je_term_limits_collective_HOS:0 "[SCOPE.sCharacter('the_current_president_scope').GetPrimaryRoleTitle]の職"
    je_term_limits_collective_HOS_reason:0 "[COUNTRY.GetName]の憲法の下では、執行権は単一の人物ではなく合議体に委ねられます。集団指導制の国家元首は憲法上の評議会として機能し、共同の審議と法に定められた手続きを通じて国家を代表します。各構成員は対等な地位を持ち、決定には憲法の定めに応じて過半数または全会一致の同意が必要です。[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の職は毎年持ち回りとなります。"
    je_term_limits_collective_HOS_goal:0 "[SCOPE.sCharacter('the_current_president_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('the_current_president_scope').GetFullName]が任期の上限に達しました"
