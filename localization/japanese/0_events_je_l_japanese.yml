    portuguese_macau.sgc.d:0 "1974年のポルトガル革命の後、非植民地化政策がマカオの中華人民共和国（PRC）への返還への道を開きました。1976年2月17日、ポルトガル議会はマカオ組織規程を可決し、マカオを「ポルトガルの施政下にある領域」と規定しました。この表現は1976年のポルトガル憲法にも盛り込まれ、それまでの海外州という位置づけに取って代わりました。従来の憲法とは異なり、マカオはポルトガル領土の不可分の一部には含まれませんでした。"
    
