    je_fire_head_of_state_button:0 "[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]を交代させる"
    je_fire_head_of_state_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]は議会の多数派を利用して[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('head_of_state_pm_scope').GetFullName]を罷免する動議を可決させます。"
    
    je_elected_head_of_state_button:0 "選出制の[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]を制定"
    je_elected_head_of_state_button_desc:0 "[ROOT.GetCountry.GetName]の憲法を改正し現在は任命職である[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]の職を直接選挙で選出される職へと改めます。"
    
    je_appointed_head_of_state_button:0 "任命制の[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]を制定"
    je_appointed_head_of_state_button_desc:0 "[ROOT.GetCountry.GetName]の憲法を改正し現在は選出職である[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]の職を直接任命される職へと改めます。"
    
    breached_separation_of_powers.t:0 "憲政危機"
    breached_separation_of_powers.d:0 "[ROOT.GetCountry.GetName]の憲法では[Concept('concept_official_character','$head_of_state$')]の職と[Concept('concept_official_character','$prime_minister$')]の職は別々の人物が務めなければなりません。しかし[GetPlayer.GetRuler.GetFullName]はどういうわけか両方の職を同時に占める方法を見つけ出し三権分立の原則に違反しています。[GetPlayer.GetRuler.GetFullName]がいずれかの職を辞任しない限り憲政危機が引き起こされるでしょう。"
    breached_separation_of_powers.f:0 "このイベントは[concept_country]が[GetLawType('law_HOG_prime_minister').GetName]または[GetLawType('law_HOG_president_prime_minister').GetName]の[concept_law]を有しているために発生しました。"
    breached_separation_of_powers_option.1:0 "[concept_ruler]に留まり他のすべての役職を辞任する。"
    breached_separation_of_powers_option.2:0 "[concept_ruler]を辞任し他のすべての役職に留まる。"
    breached_separation_of_powers_option.3:0 "三権分立の原則を違法に廃止する。"
    
    head_of_state_dimissed.tt:0 "現在の[Concept('concept_official_character','$head_of_state$')]が解任されます"
    
    head_of_state_system_replace.t:0 "[SCOPE.sCharacter('ceremonial_head_of_state').GetPrimaryRoleTitle][SCOPE.sCharacter('ceremonial_head_of_state').GetLastName]が解任！"
    head_of_state_system_replace.d:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]は前例のない措置として[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]に[SCOPE.sCharacter('ceremonial_head_of_state').GetPrimaryRoleTitle][SCOPE.sCharacter('ceremonial_head_of_state').GetFullName]の解任を指示しました。この措置を違憲だと非難する者もいますが露骨な政治的クーデターを止める力は彼らにはありません。"
    head_of_state_system_replace.f:0 "このイベントでは次の[SCOPE.sCharacter('ceremonial_head_of_state').GetPrimaryRoleTitle]を誰にするか選ぶことができます。"
    head_of_state_system_replace.option.1:0 "忠実な支持者を[SCOPE.sCharacter('ceremonial_head_of_state').GetPrimaryRoleTitle]に任命する。"
    head_of_state_system_replace.option.2:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]に決めさせる。"
    head_of_state_system_replace.option.3:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle][GetPlayer.GetRuler.GetFullName]を任命する。"
    
    head_of_government:0 "政府首班"
    
    head_of_government_dimissed.tt:0 "現在の[Concept('concept_official_character','$head_of_government$')]は解任されます"
    
    head_of_government_system_replace.t:0 "[SCOPE.sCharacter('ceremonial_head_of_government').GetPrimaryRoleTitle][SCOPE.sCharacter('ceremonial_head_of_government').GetLastName]解任！"
    head_of_government_system_replace.d:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]は前例のない措置として[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]に[SCOPE.sCharacter('ceremonial_head_of_government').GetPrimaryRoleTitle][SCOPE.sCharacter('ceremonial_head_of_government').GetFullName]の解任を命じました。これを違憲だと非難する者もいますが、この露骨な政治的クーデターを止める力は彼らにはありません。"
    head_of_government_system_replace.f:0 "このイベントでは次の[SCOPE.sCharacter('ceremonial_head_of_government').GetPrimaryRoleTitle]を誰にするか選択できます。"
    head_of_government_system_replace.option.1:0 "忠実な人物を[SCOPE.sCharacter('ceremonial_head_of_government').GetPrimaryRoleTitle]に任命する。"
    head_of_government_system_replace.option.2:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]に決めさせる。"
    head_of_government_system_replace.option.3:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle][GetPlayer.GetRuler.GetFullName]を任命する。"
    
    je_foreign_head_of_state_system:0 "[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]職"
    je_foreign_head_of_state_system_reason:0 "[ROOT.GetCountry.GetName]の憲法の下では[SCOPE.sCharacter('head_of_state_pm_scope').GetCountry.GetName]の[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]が[ROOT.GetCountry.GetName]の[Concept('concept_official_character','$head_of_state$')]を務めます。この役職は主に儀礼的なものですが[ROOT.GetCountry.GetName]の[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]は今なお[ROOT.GetCountry.GetName]の[GetPlayer.GetRuler.GetPrimaryRoleTitle]の行動を制限する一定の権限を行使できます。\n\n既定では[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]は我々の[concept_overlord]の[concept_ruler]または[Concept('concept_official_character','$head_of_state$')]です。\n\n#y [SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]：#![SCOPE.sCharacter('head_of_state_pm_scope').GetFullName]"
    
    territory_leased: "$state_transfer$（租借）"
    territory_leased_effects_desc: "この[concept_treaty]の期間中は$state_transfer_effects_desc$"
    territory_leased_article_short_desc: "この[concept_treaty]の期間中は$territory_article_short_desc$"
    
    territory_lease_terminated.t:0 "[SCOPE.sState('territory_lease_state').GetName]の租借終了"
    territory_lease_terminated.d:0 "[ROOT.GetCountry.GetName]による[SCOPE.sState('territory_lease_state').GetName]の[concept_state]の租借は根拠となる[concept_treaty]からの脱退により終了しました。これにより国際法上[ROOT.GetCountry.GetName]は[SCOPE.sState('territory_lease_state').GetName]を[SCOPE.sCountry('territory_lease_landlord').GetName]に返還する義務を負います。"
    territory_lease_terminated.f:0 "#y $territory_leased$#![concept_article]を含む[concept_treaty]から脱退したため、このイベントが発生しました。"
    territory_lease_terminated.1:0 "[SCOPE.sState('territory_lease_state').GetName]を無条件で返還する。"
    territory_lease_terminated.2:0 "[SCOPE.sState('territory_lease_state').GetName]を[concept_special_administrative_region]として返還することを提案する。"
    territory_lease_terminated.3:0 "[SCOPE.sState('territory_lease_state').GetName]の返還を拒否する。"
    
    territory_lease_terminated_SAR.t:0 "[SCOPE.sState('territory_lease_state').GetName]の租借終了"
    territory_lease_terminated_SAR.d:0 "[SCOPE.sCountry('territory_lease_tenant').GetName]の[SCOPE.sState('territory_lease_state').GetName]における[concept_state]の租借は根拠となる[concept_treaty]から離脱したため終了しました。これにより国際法上[SCOPE.sCountry('territory_lease_tenant').GetName]は[SCOPE.sState('territory_lease_state').GetName]を[SCOPE.sCountry('territory_lease_landlord').GetName]へ返還する義務を負います。\n\nしかし[SCOPE.sCountry('territory_lease_tenant').GetName]は[SCOPE.sState('territory_lease_state').GetName]が[SCOPE.sCountry('territory_lease_landlord').GetName]の[concept_special_administrative_region]とされない限り返還を拒否しています。"
    territory_lease_terminated_SAR.f:0 "このイベントは#y $territory_leased$#![concept_article]を含む[concept_treaty]から離脱したため発生しました。"
    territory_lease_SAR.1:0 "[SCOPE.sCountry('territory_lease_tenant').GetAdjectiveNoFormatting]の提案を受け入れる。"
    territory_lease_SAR.2:0 "[SCOPE.sState('territory_lease_state').GetName]を武力で奪還する。"
    
    territory_lease_terminated_war.t:0 "[SCOPE.sState('territory_lease_state').GetName]の租借終了"
    territory_lease_terminated_war.d:0 "[SCOPE.sCountry('territory_lease_tenant').GetName]の[SCOPE.sState('territory_lease_state').GetName]における[concept_state]の租借は根拠となる[concept_treaty]から離脱したため終了しました。これにより国際法上[SCOPE.sCountry('territory_lease_tenant').GetName]は[SCOPE.sState('territory_lease_state').GetName]を[SCOPE.sCountry('territory_lease_landlord').GetName]へ返還する義務を負います。\n\nしかし[SCOPE.sCountry('territory_lease_tenant').GetName]は条約上の義務に反して[SCOPE.sState('territory_lease_state').GetName]の返還を拒否しています。"
