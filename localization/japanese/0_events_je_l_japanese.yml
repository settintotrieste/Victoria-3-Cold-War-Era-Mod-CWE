    judiciary_veto.tt:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]が[concept_law][Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enactment$')]に#r 反対#!"  
