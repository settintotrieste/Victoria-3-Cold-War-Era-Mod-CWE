    colonial_lose_relations.tt:0 "すべての[ROOT.GetCountry.GetAdjective]の[concept_subject]との[concept_relations]が#r 50#!減少します"
    
    notification_colonial_purge_notification_name:0 "[SCOPE.sCountry('overlord_country').GetAdjective]による[SCOPE.sCountry('subject_country').GetName]の粛清"
    notification_colonial_purge_notification_desc:0 "[SCOPE.sCountry('overlord_country').GetAdjective]の[concept_government]は[SCOPE.sCountry('subject_country').GetName]で反植民地派の反体制分子を粛清しました。その結果[SCOPE.sCountry('subject_country').GetName]の[concept_liberty_desire]が#g 20#!減少し、[SCOPE.sCountry('subject_country').GetName]のすべての[Concept('concept_primary_cultures','$concept_primary_culture$')]系POPの#r 0.50％#!が命を落としました。"
    
    je_occupation_of_austria:0 "オーストリアの占領"
    je_occupation_of_austria_reason:0 "ヨーロッパにおける第二次世界大戦の終結に際しオーストリアは連合国に占領され、1945年4月27日にナチス・ドイツからの独立を宣言しました。1949年にドイツが東西ドイツに分断された一方で、オーストリアは西側連合国とソビエト連邦による共同占領下に置かれ続けました。\n\n1949年にドイツが東西ドイツに分断された一方で、オーストリアは西側連合国とソビエト連邦による共同占領下に置かれ続けました。"
    
    je_occupation_of_austria_end_occupation_button:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]のオーストリア占領を終了する"
    je_occupation_of_austria_end_occupation_button_desc:0 "[ROOT.GetCountry.GetAdjective][concept_government]はオーストリアの軍事占領を終了します。これによりオーストリアに対する我々の[concept_condominium]は終了し、[concept_condominium]の他のすべての加盟国にもオーストリア占領の終了を促します。"
    
    je_occupation_of_berlin:0 "ベルリンの占領"
    je_occupation_of_berlin_reason:0 "ヨーロッパにおける第二次世界大戦の終結に際しベルリンは連合国軍に制圧され、1945年4月27日に正式にナチス・ドイツから分離されました。市はアメリカ合衆国、イギリス、フランス、ソビエト連邦がそれぞれ管理する4つの占領地区に分割されました。\n\n西ベルリンは法律上は西側連合国の統治下にとどまりましたが、実質的にはほぼ西ドイツの一部として扱われました。ただし住民は西ドイツのパスポートを保持していませんでした。"
    
    je_occupation_of_berlin_end_occupation_button:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]のベルリン占領を終了する"
    je_occupation_of_berlin_end_occupation_button_desc:0 "[ROOT.GetCountry.GetAdjective][concept_government]はベルリンの軍事占領を終了します。これによりベルリンに対する我々の[concept_condominium]は終了し、[concept_condominium]の他のすべての加盟国にもベルリン占領の終了を促します。"
    
    je_occupation_of_trieste:0 "トリエステの占領"
    je_occupation_of_trieste_reason:0 "トリエステ自由地域は第二次世界大戦後に国際連合安全保障理事会の直接の管轄下に置かれた南ヨーロッパの独立地域で、イタリアとユーゴスラビアの間に位置しアドリア海北部に面していました。\n\nこの地域は1947年2月10日にイタリアとの平和条約の議定書によって設立され、民族的・文化的に混在する住民を中立の独立国家として受け入れることを目的としていました。また中央ヨーロッパとの交易における戦略的重要性から、イタリアとユーゴスラビアの領土要求を沈静化させる狙いもありました。\n\n地域は1947年9月15日に発足しました。その統治は2つの区域に分けられ、一方は港湾都市トリエステと北西へ延びる狭い沿岸地帯（A地区）、もう一方（B地区）はイストリア半島北西部のごく一部で構成されていました。"
    
    je_occupation_of_trieste_end_occupation_button:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]のトリエステ占領を終了する"
    je_occupation_of_trieste_end_occupation_button_desc:0 "[ROOT.GetCountry.GetAdjective][concept_government]はトリエステの軍事占領を終了します。これによりトリエステに対する我々の[concept_condominium]が終了し、[concept_condominium]の他のすべての加盟国にもトリエステの占領を終了するよう呼びかけます。"
    
    law_imposition_events.1.d: "[SCOPE.sC('foreign_imposition_country').GetNameNoFlag]は我々の[SCOPE.sLaw('foreign_imposition_law').GetGroup.GetName]を[SCOPE.sLaw('foreign_imposition_law').GetName]へ改革するよう要求してきました。"
    je_law_imposition_reason: "[SCOPE.sC('foreign_imposition_country').GetName]は我々が[SCOPE.sLaw('foreign_imposition_law').GetName]を制定することが不可欠であると宣言しました。"
    
    Expeditionary_Force:0 "外国遠征軍"
    
    je_law_enactment_system:0 "[SCOPE.GetRootScope.GetCountry.GetLawBeingEnacted.GetName]を制定する法案"
    je_law_enactment_system_reason:0 "[ROOT.GetCountry.GetAdjective][concept_government]は[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]において[SCOPE.sLaw('current_law_scope').GetName][concept_law]を[Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enact$')]しようとしています。\n\n[SCOPE.sLaw('current_law_scope').GetName]を制定する#y 法案#!が成立するには、国家の諸機関が[concept_law]に#r 反対#!しないことが必要です。反対された場合、#y 法案#!は[Concept('concept_enactment_setback', '$concept_enactment_setbacks$')]に直面するか、完全に#r 拒否#!されることさえあります。\n\n@information![concept_law][Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enactment$')]手続きの開始時に#y [SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]#!内のすべての[Concept('concept_interest_group', '$concept_interest_groups$')]が[concept_government]への支持を再評価します。\n\n[SCOPE.GetRootScope.GetCountry.GetLawBeingEnacted.GetName]に#y 中立#!または#g 賛成#!の[Concept('concept_interest_group', '$concept_interest_groups$')]は[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]で[concept_government]を支持します。\n\n@warning![SCOPE.sLaw('current_law_scope').GetName]に反対している主要な政府機関と役職者は以下のとおりです。"
    
    cabinet_minister_veto.tt:0 "閣僚[SCOPE.sCharacter('cabinet_minister').GetFullName]が[concept_law][Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enactment$')]に#r 反対#!"
    reserved_powers_holder_veto.tt:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ceremonial_body_custom_title')]（[SCOPE.sCharacter('reserved_powers_holder').GetFullName]）が[concept_law][Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enactment$')]に#r 反対#!"   
    head_of_paramilitary_veto.tt:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('paramilitary_group_custom_title')]司令官[SCOPE.sCharacter('head_of_paramilitary').GetFullName]が[concept_law][Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enactment$')]に#r 反対#!"   
