    reserve_powers_pm_veto.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]の反対"
    reserve_powers_pm_veto.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')] [SCOPE.sCharacter('ceremonial_head_of_state').GetFullName]は[SCOPE.sLaw('current_law_scope').GetName]を制定するための[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]での法案への賛成を拒んでいます。ただし[concept_government]に十分な[concept_legitimacy]があれば[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')] [GetPlayer.GetRuler.GetFullName]は[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]に圧力をかけて法案に賛成させることができます。"
    reserve_powers_pm_veto.f: "このイベントは[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]が現在制定中の[concept_law]に反対または強く反対しているため発生しました。ただし[concept_legitimacy]が50を超えていれば[concept_ruler]は[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]の反対を押し切ることができます。"
    
