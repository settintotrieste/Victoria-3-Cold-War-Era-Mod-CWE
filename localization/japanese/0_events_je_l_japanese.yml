    wedding.1.t:0 "王室の婚礼"
    wedding.1.d:0 "国民は[SCOPE.sCharacter('royal_marriage_character').GetHerHis]いとも慈悲深き陛下[SCOPE.sCharacter('royal_marriage_character').GetPrimaryRoleTitle][SCOPE.sCharacter('royal_marriage_character').GetFirstName]と麗しき[SCOPE.sCountry('marriage_country').GetName]の[SCOPE.sCharacter('foreign_ruler').GetPrimaryRoleTitle][SCOPE.sCharacter('foreign_ruler').GetFirstName]のご成婚を祝福しています。"
    wedding.1.f:1 "「本日[SCOPE.sCharacter('royal_marriage_character').GetHerHis]いとも慈悲深き陛下[SCOPE.sCharacter('royal_marriage_character').GetPrimaryRoleTitle][SCOPE.sCharacter('royal_marriage_character').GetFirstNameNoFormatting]のご成婚という最も荘厳な儀式が[SCOPE.sState('capital_scope').GetCityHubName]にて執り行われた。生来忠誠心に満ちたこの国の人々がこの慶事にあたって日々の生業を休んで祝日を共に祝い、王座への敬愛を公然と示すのも驚くにはあたらない。」"
    wedding.1.a:0 "最上流の身分の者だけを招待する。"
    wedding.1.b:0 "盛大な公開の結婚式で民衆をなだめる。"
    
    wedding.2.t: "王室の伴侶"
    wedding.2.d: "[SCOPE.sCharacter('royal_marriage_character').GetPrimaryRoleTitle][SCOPE.sCharacter('royal_marriage_character').GetFullName]は相応に高貴な生まれの伴侶との縁組を求めています。"
    wedding.2.f: "「母さん、どうして私は[SCOPE.sCharacter('royal_marriage_character').GetPrimaryRoleTitle]と結婚できないの？どうして[SCOPE.sCharacter('royal_marriage_character').GetSheHe]はどこかの外国の上流気取りと結婚しなきゃいけないの？」\n\n「私たちは平民なのよ。お偉方が私たちの身分まで降りてくるなんてありえないの。」"
    wedding.2.a: "[SCOPE.sCountry('marriage_country_1').GetName]の[SCOPE.sCharacter('foreign_ruler_1').GetPrimaryRoleTitle][SCOPE.sCharacter('foreign_ruler_1').GetFullName]と結婚する。"
    wedding.2.b: "[SCOPE.sCountry('marriage_country_2').GetName]の[SCOPE.sCharacter('foreign_ruler_2').GetPrimaryRoleTitle][SCOPE.sCharacter('foreign_ruler_2').GetFullName]と結婚する。"
    wedding.2.c: "[SCOPE.sCountry('marriage_country_3').GetName]の[SCOPE.sCharacter('foreign_ruler_3').GetPrimaryRoleTitle][SCOPE.sCharacter('foreign_ruler_3').GetFullName]と結婚する。"
    
