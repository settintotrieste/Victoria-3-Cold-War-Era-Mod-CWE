    je_private_media_system: "[ROOT.GetCountry.GetAdjectiveNoFormatting]のメディア"
    je_private_media_system_reason: "[ROOT.GetCountry.GetName]のメディア産業は大手民間報道網の連合体に支配されており、これらが国内のあらゆるニュースの発信を独占しています。そのため報道網の所有者である[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant]と[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant]は[ROOT.GetCountry.GetAdjective]国民の心を左右する大きな影響力を持っています。\n\nその影響力を[concept_government]に向けて行使されたくないのであれば、民間メディアの忠誠を得ることが重要です。\n\n@warning!進捗バーが100％に達すると、メディアは[concept_government]を後押し（民間メディア忠実性が50％以上の場合）または攻撃（民間メディア忠実性が50％未満の場合）する行動を起こします。\n\n注：#y 民間メディア忠実性#!は[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant]と[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant]の支持度がいずれも中立以上であれば上昇し、これらの利益団体の支持度がマイナスの場合、または[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant]か[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant]が[concept_government]に含まれていない場合は低下します。"
    
