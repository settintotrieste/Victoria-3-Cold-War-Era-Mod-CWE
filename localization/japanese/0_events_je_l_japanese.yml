    je_term_limits_monarchy:0 "選挙君主制"
    je_term_limits_monarchy_reason:0 "[SCOPE.sCharacter('the_current_president_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('the_current_president_scope').GetFullName]は[ROOT.GetCountry.GetName]の[concept_monarch_character]です。\n\n[ROOT.GetCountry.GetName]は#y 選挙君主制#!を採用しており、[SCOPE.GetRootScope.GetCountry.GetCustom('monarch_custom_title')]は5年ごとに各地の王家の間で持ち回りとなります。つまり[SCOPE.GetRootScope.GetCountry.GetCustom('monarch_custom_title')]は5年ごとにランダムで変わります。"
