    je_one_party_system: "[ROOT.GetCountry.GetAdjectiveNoFlag]中央委員会"
    je_one_party_system_reason: "[ROOT.GetCountry.GetName]において合法な[concept_party]は支配政党ただ1つです。とはいえ支配政党の中央委員会内には複数の派閥が存在し支配政党の思想的方向性に影響を及ぼしています。これは次期党首ひいては国の[concept_ruler]を誰にするかを決めることによって行われます。\n\n中央委員会は急進派・穏健派・改革派の3派閥で構成されています。これらの派閥はいずれも党と[concept_country]の指導権を争っています。\n\nどの派閥が優勢かは中央委員会の$Party_Radicalism$によって決まります。優勢な派閥は次に生成される[concept_politician]の[concept_ideology]を決める可能性が大幅に高くなります。\n\n#y 党議長#!：[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')] [GetPlayer.GetRuler.GetFullName]\n\n注：$Party_Radicalism$はより#red 独裁的#!な[concept_ruler]が選ばれる可能性を高めます。"
    
    je_party_system: "[SCOPE.sParty('ruling_party_scope').GetName]"
    je_party_system_reason: "[SCOPE.sParty('ruling_party_scope').GetName]は[ROOT.GetCountry.GetName]を統治する[SCOPE.GetRootScope.GetCountry.GetCustom('party_or_party_faction_name')]です。\n\n[SCOPE.sParty('ruling_party_scope').GetName]は急進派、穏健派、改革派の3つの派閥で構成されています。これらの派閥はいずれも[SCOPE.GetRootScope.GetCountry.GetCustom('party_or_party_faction_name')]と[concept_country]の主導権を争っています。\n\nどの派閥が優勢になるかは[SCOPE.sParty('ruling_party_scope').GetName]の$Party_Radicalism$によって決まります。優勢な派閥は次に生成される[concept_politician]の[concept_ideology]を決める可能性が大幅に高くなります。\n\n#y 党首#!：[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')] [GetPlayer.GetRuler.GetFullName]\n\n注：$Party_Radicalism$は[concept_government]に属する[concept_interest_group]に所属するすべての[Concept('concept_politician', '$concept_politicians$')]の平均[concept_character] [concept_ideology]の影響を受けます。\n\n注：$Party_Radicalism$はより#red 独裁的#!な[concept_ruler]が選ばれる可能性を高めます。"
    
