    je_judiciary_expand_court_button_desc:0 "[concept_government]は立法により[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]の判事の総数を最大20名まで増やすことができます。新たに空いた席は該当する場合政府が任命する判事によって埋められます。"
    court_is_expanded.tt:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]が判事1名分拡大されます"
    conservative_judge_appointed.tt:0 "#BOLD [concept_conservative_judiciary]の判事を1名任命#!"
    progressive_judge_appointed.tt:0 "#BOLD [concept_progressive_judiciary]の判事を1名任命#!"
    
    judge_appointment_process:0 "\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]の#y 進歩度#!は判事の通常の任命と退任を反映するため毎年評価されます。\n\n#y 進歩度#!の増減率は次の主要な国家高官（該当する場合）の[concept_ideology]によって左右されます：\n\n- $character_role_ruler$\n\n- $character_role_head_of_state$\n\n- $character_role_head_of_government$\n\n- $character_role_reserved_powers_holder$\n\n- #o 官僚機構の長#!"
    
    je_judiciary_foreign:0 "[SCOPE.sCountry('legal_union_foreign_supreme_court').GetNameNoFlag]の[SCOPE.GetRootScope.GetCountry.GetCustom('foreign_supreme_court_name')]"
    je_judiciary_foreign_reason:0 "[SCOPE.sCountry('legal_union_foreign_supreme_court').GetName]の[SCOPE.GetRootScope.GetCountry.GetCustom('foreign_supreme_court_name')]は[ROOT.GetCountry.GetName]の司法における最高裁判所です。憲法または制定法の論点を含むすべての訴訟に対する最終的な上訴管轄権を持ち、判事の自律性の水準によっては一方的に法を改正することもあります。\n\n[ROOT.GetCountry.GetName]は[SCOPE.sCountry('legal_union_foreign_supreme_court').GetName]と$legal_union$にあるため[SCOPE.GetRootScope.GetCountry.GetCustom('foreign_supreme_court_name')]の判事は[SCOPE.sCountry('legal_union_foreign_supreme_court').GetAdjectiveNoFlag]政府によって選任されます。\n\n注：[concept_progressive_judiciary]の判事は$HUMAN_RIGHTS$および$POWER_STRUCTURE$の分野においてより民主的な[Concept('concept_law','$concept_laws$')]を支持します。"
    je_judiciary_foreign_status:0 "裁判官の[GetPlayer.MakeScope.Var('judiciary_progressiveness').GetValue]％が[concept_progressive_judiciary]"
    
