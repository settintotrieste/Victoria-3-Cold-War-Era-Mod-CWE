    je_nuclear_weapons_info_panel:0 "核軍拡競争"
    je_nuclear_weapons_info_panel_reason:0 "[ROOT.GetCountry.GetName]は現在ライバル国と核軍拡競争を繰り広げています。\n\nそのため[ROOT.GetCountry.GetName]は自国と『不良』以下の関係にあるすべての核保有国を上回る核攻撃力を確保するよう努めなければなりません。\n\n核攻撃力（総計）：[GetPlayer.MakeScope.Var('nuclear_strike_power_display').GetValue]\n\n核攻撃防御力：[GetPlayer.MakeScope.Var('nuclear_strike_defence_display').GetValue]\n\n敵の核攻撃力（総計）：[GetPlayer.MakeScope.Var('nuclear_strike_power_enemy_display').GetValue]\n\n敵の核攻撃防御力：[GetPlayer.MakeScope.Var('nuclear_strike_defence_enemy_display').GetValue]\n\n推定正味核攻撃力：[GetPlayer.MakeScope.Var('nuclear_strike_power_THIS_enemy_ratio').GetValue]\n\n敵の推定正味核攻撃力：[GetPlayer.MakeScope.Var('nuclear_strike_power_enemy_THIS_ratio').GetValue]\n\n敵国数：[GetPlayer.MakeScope.Var('nuclear_enemy_counter_display').GetValue]\n\n核兵器優位スコア：[GetPlayer.MakeScope.Var('nuclear_strike_power_ratio').GetValue]"
