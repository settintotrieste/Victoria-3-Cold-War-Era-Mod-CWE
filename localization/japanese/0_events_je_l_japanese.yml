    je_organised_crime_system:0 "組織犯罪"
    je_organised_crime_system_reason:0 "怪しげな人物や裏取引の噂が街中に広まっています。ささいなゆすりに始まったものが密輸、恐喝、闇市場からなる広大なネットワークへと発展しました。国家は決断しなければなりません。鉄の意志でこれらの犯罪組織を抑え込むか、それとも密かにその影響力から利益を得るか。\n\n@information!#y 組織犯罪#!は[ROOT.GetCountry.GetName]の[GetLawType('law_very_low_anti_corruption').GetGroup.GetName]が弱いか[GetLawType('law_lenient_policing').GetGroup.GetName][Concept('concept_law','$concept_laws$')]である場合に発生します。\n\n@warning!#y 組織犯罪#!が存在すると国の[Concept('concept_law','$concept_laws$')]で禁止されていても[concept_investment_pool]は以下の[Concept('concept_building','$concept_buildings$')]を建設できます：\n\n•[GetBuildingType('building_opium_plantation').GetName]\n\n•[GetBuildingType('building_liquor_factory').GetName]\n\n•[GetBuildingType('building_vineyard').GetName]\n\n•[GetBuildingType('building_tobacco_plantation').GetName]。"
    je_organised_crime_system_status:0 "深刻度：[GetPlayer.MakeScope.Var('organised_crime_effect_var').GetValue]％"
    
    organised_crime_system:0 "組織犯罪"
