    espionage_instigate_domestic_unrest.t:0 "[SCOPE.sCountry('espionage_target').GetName]で騒乱を扇動する機会"
    espionage_instigate_domestic_unrest.d:0 "[SCOPE.sCountry('espionage_target').GetName]で活動する[SCOPE.sCountry('espionage_attacker').GetAdjective]の工作員が騒乱と混乱を煽る機会を見つけました。彼らは主要な報道機関に扇動的な政治的メッセージを掲載させ暴動や抗議を引き起こすことを提案しています。この秘密工作は12か月にわたり[SCOPE.sCountry('espionage_target').GetName]の急進派を増加させるはずです。"
    espionage_instigate_domestic_unrest.f:0 "[SCOPE.sCountry('espionage_target').GetAdjective]の情報機関に我々の行動が察知される可能性があり、その場合[SCOPE.sCountry('espionage_target').GetName]との関係が著しく悪化することに注意してください。"
    
    espionage_instigate_domestic_unrest_target.t:0 "[SCOPE.sCountry('suspected_espionage_attacker').GetAdjective]のスパイによる国内騒乱の扇動"
    espionage_instigate_domestic_unrest_target.d:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('secret_police_custom_title')]の報告によれば[SCOPE.sCountry('suspected_espionage_attacker').GetAdjective]のスパイが国内の報道界における影響力を用い、人種的・宗教的な敵意を煽る扇動的な記事を次々と掲載させて[SCOPE.sCountry('espionage_victim').GetName]に騒乱を引き起こしました。"
    espionage_instigate_domestic_unrest_target.f:0 "[SCOPE.sCountry('suspected_espionage_attacker').GetName]が秘密工作を行ったというのはあくまで推測にすぎないため、裏切りを非難するのは見当違いかもしれません。"
    
