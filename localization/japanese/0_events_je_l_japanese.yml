    enact_primogeniture_system_decision_desc:0 "男子優先長子相続制とは息子が娘に先立って王位を継承する王位継承制度です。この規則のもとでは姉がいても弟がいれば姉は飛ばされ、男性であるというだけで弟が優先されます。君主に息子が一人もいない場合は娘が王位を継承できます。"
    
    remove_primogeniture_system_decision:0 "男子優先王位長子相続制を廃止する"
    remove_primogeniture_system_decision_desc:0 "男子優先長子相続制とは息子が娘に先立って王位を継承する王位継承制度です。この規則のもとでは姉がいても弟がいれば姉は飛ばされ、男性であるというだけで弟が優先されます。君主に息子が一人もいない場合は娘が王位を継承できます。"
    
    enact_primogeniture_system.tt:0 "男性の[concept_royal_character]の[Concept('concept_character', '$concept_characters$')]のみが[concept_monarch_character]になれます"
    remove_primogeniture_system.tt:0 "性別を問わず[concept_royal_character]の[Concept('concept_character', '$concept_characters$')]が[concept_monarch_character]になれます"
    primogeniture_system_timer.tt:0 "過去5年以内に男子優先王位長子相続制を制定または廃止していないこと"
    
    regency.2.t: "新たな摂政"
    regency.2.d: "[ROOT.GetCountry.GetName]の[concept_regent_character]職が空席となったため、[concept_government]は新たな[concept_regent_character]を決めなければなりません。有望な候補者が何人もこの高貴な職に名乗りを上げています。"
    regency.2.f: "「誠に遺憾ながら私は……」\n\n[ROOT.GetCountry.GetNameNoFormatting]の摂政は書きかけの一文をもう一度見つめると紙を丁寧に折りたたみ暖炉へ滑り込ませました。いや、これでは駄目だ。誤解を招きかねず、権力に飢えた男だと中傷する材料にされかねない。もっと中立的でなければならない。最悪の政敵でさえ曲解できない文言でなければ。彼は新たな紙を手に取りました。\n\n「私は陛下のもとへ伺うことを自らの務めと感じ……」"
    regency.2.a: "[SCOPE.gsInterestGroup('ig_candidate_1').GetName]の中から新たな候補者を任命する。"
    regency.2.b: "[SCOPE.gsInterestGroup('ig_candidate_2').GetLeader.GetFullName]こそ現政府を最もよく体現している。"
    regency.2.c: "[SCOPE.gsInterestGroup('ig_candidate_3').GetLeader.GetFullName]は王室への忠誠を証明している。"
    regency.2.e: "民衆に人気の候補者[SCOPE.gsInterestGroup('ig_candidate_4').GetLeader.GetFullName]を選ぶ。"
    
    regency.3.t: "戴冠の日"
    regency.3.d: "[SCOPE.sCharacter('monarch_scope').GetFullName]が[concept_monarch_character]となる資格を得たため[SCOPE.sCharacter('monarch_scope').GetSheHe]は[ROOT.GetCountry.GetAdjective]の王位に就けるようになりました。摂政期は終わりを迎えました。"
    regency.3.f: "摂政は司祭が最後の塗油を執り行うのを見守っていました。昨日から今日にかけての[SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle]の変わりようは摂政の想像をはるかに超えるほど際立っていました。[SCOPE.sCharacter('monarch_scope').GetSheHe|U]は以前よりも背筋を伸ばして立ち[SCOPE.sCharacter('monarch_scope').GetHerHis]の顔には身についた決意の表情が浮かんでいます。[SCOPE.sCharacter('monarch_scope').GetHerHis]の頭に載せられた王冠は重さなど無いかのように見えました。\n\n司祭が身を引くとファンファーレが鳴り響き宮殿の城壁の外からは礼砲の轟きがそれに重なりました。\n\n「先に約束したことを私は必ず履行し守り抜く」と[SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle]は唱えました。「[SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')]よ、我を助けたまえ。」"
    regency.3.a: "[SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle]万歳！"
    
    eterna_regency_5_tt: "現職の[Concept('concept_ruler','$RULER_TITLE_REGENT$')]が#v 5年#!を超えて在任しています（現在[Character.MakeScope.Var('regency_years').GetValue|v0]）"
    
    female_princess_lose_title_upon_marriage.tt:0 "[ROOT.GetCountry.GetNameNoFlag]の#y 王室典範#!では[SCOPE.sCharacter('royal_marriage_character').GetPrimaryRoleTitle][SCOPE.sCharacter('royal_marriage_character').GetFullName]は平民と結婚すると[SCOPE.sCharacter('royal_marriage_character').GetHerHis]の[concept_royal_character]の称号を失います"
    
    remove_princess_restriction_decision:0 "王室典範の改革"
    remove_princess_restriction_decision_desc:0 "[concept_government]は憲法改正を行い王族の女性が王族以外の男性と結婚した後も[concept_royal_character]としての地位を保持できるようにします。この改正は王位継承を男系男子に限る制限（存在する場合）には変更を加えません。"
    disable_female_princess_lose_title_upon_marriage.tt:0 "#y 女性#!の[Concept('concept_character', '$concept_characters$')][concept_royal_character]は結婚後も[concept_royal_character]としての地位を保持します"
    
    regency.1.t: "摂政"
    regency.1.d: "[ROOT.GetCountry.GetAdjectiveNoFormatting]王家における最近の出来事により現在[ROOT.GetCountry.GetAdjectiveNoFormatting][concept_monarch_character]となる資格を持つ[concept_royal_character]がいません。したがって[ROOT.GetCountry.GetAdjectiveNoFormatting]君主制の憲法上の職務を担う摂政を設けなければなりません。摂政の編成は現政府に委ねられました。"
    regency.1.f: "このイベントは国内に[concept_monarch_character][concept_character]が存在しないか、[concept_monarch_character]となる資格を持つ[concept_royal_character][Concept('concept_character', '$concept_characters$')]がいないため発生しました。"
    regency.1.a: "[SCOPE.gsInterestGroup('ig_candidate_1').GetLeader.GetFullName]が当然の選択だ。"
    regency.1.b: "[SCOPE.gsInterestGroup('ig_candidate_2').GetLeader.GetFullName]ならば君主制を守り抜くと信頼できる。"
    regency.1.c: "[SCOPE.gsInterestGroup('ig_candidate_3').GetLeader.GetFullName]とは妥協できるだろう。"
    regency.1.e: "[SCOPE.gsInterestGroup('ig_candidate_4').GetLeader.GetFullName]を任命すれば民衆の支持を得られるだろう。"
    
    je_dismiss_regent_button:0 "摂政を解任"
    je_dismiss_regent_button_desc:0 "[concept_government]が[SCOPE.sCharacter('regent_character').GetPrimaryRoleTitle][SCOPE.sCharacter('regent_character').GetFullName]を解任します。"
    dismiss_regent_timer.tt:0 "過去#y 5年間#!に摂政を解任していない"
    
    historical_terrorists_events.option:0 "憂慮すべき知らせだ…"
    
    ITA_terrorist_Renato_Curcio.t:0 "レナート・クルチョの台頭"
    ITA_terrorist_Renato_Curcio.d:0 "赤い旅団の共同創設者レナート・クルチョは1970年代にイタリアで吹き荒れた左翼テロの中心人物として台頭しました。共産主義思想に突き動かされた彼の行動は共和国を不安定にし、国家の権威を揺るがしました。"
    GER_terrorist_Ulrike_Meinhof.t:0 "ウルリケ・マインホフの台頭"
    GER_terrorist_Ulrike_Meinhof.d:0 "ジャーナリストから武装闘争家へ転じたウルリケ・マインホフはドイツ赤軍の創設者の一人となりました。彼女の過激な思想と指導力は西ドイツにおける左翼テロの時代を形作りました。"
    JAP_terrorist_Fusako_Shigenobu.t:0 "重信房子の台頭"
    JAP_terrorist_Fusako_Shigenobu.d:0 "日本赤軍の創設者である重信房子は1970年代で最も悪名高い共産主義テロ組織の一つを率いました。彼女の執念と過激な思想は日本を世界的な左翼武装闘争の波へと引き込みました。"
    GER_terrorist_Andreas_Baader.t:0 "アンドレアス・バーダーの台頭"
    GER_terrorist_Andreas_Baader.d:0 "ドイツ赤軍の共同創設者アンドレアス・バーダーは西ドイツにおける暴力的な武装闘争の象徴となりました。彼の無謀な指導と過激な思想は1970年代に組織をテロ活動へと駆り立てました。"
    FRA_terrorist_Carlos_the_Jackal.t:0 "カルロス・ザ・ジャッカルの台頭"
    FRA_terrorist_Carlos_the_Jackal.d:0 "ベネズエラ生まれの武装闘争家カルロス・ザ・ジャッカルは1970年代のヨーロッパで暴力的な活動と共産主義運動とのつながりによって悪名を馳せました。そのカリスマ性と冷酷さにより彼は国際テロリズムで最も恐れられた人物の一人となりました。"
    GBR_terrorist_Bobby_Sands.t:0 "ボビー・サンズの台頭"
    GBR_terrorist_Bobby_Sands.d:0 "IRA暫定派のメンバーであったボビー・サンズは、投獄中にアイルランド共和主義者の抵抗の象徴となりました。1981年の彼のハンガーストライキは世界の注目を集め、彼を北アイルランド紛争で最も悪名高い人物の一人にしました。"
    HND_insurgent_Charu_Majumdar.t:0 "チャル・マジュムダールの台頭"
    HND_insurgent_Charu_Majumdar.d:0 "ナクサライト運動の創始者チャル・マジュムダールは、1960年代後半にインドで急進的な共産主義者の反乱を起こしました。彼の指導力と思想は、インド農村部で数十年にわたる武装闘争を鼓舞しました。"
    
    je_british_palestine:0 "パレスチナ委任統治領"
    je_british_palestine_reason:0 "パレスチナ委任統治領は、1920年から1948年までイギリスの統治下にあった地政学的実体です。オスマン帝国の崩壊後に創設され国際連盟によって正式化されたこの委任統治領は、現在のイスラエル、ヨルダン川西岸、ガザを包含し、ユダヤ人の民族的郷土の建設を促進すると同時に現地住民の権利を保護するという二重の義務を負っていました。\n\nパレスチナの政治はイスラエルが支配しているため、[ROOT.GetCountry.GetName]が[GetLawType('law_multicultural').GetName][concept_law]を有し、かつ[GetLawType('law_state_religion').GetName][concept_law]を有していない場合を除き、独立時に[ROOT.GetCountry.GetName]は#y $ISR$#!になります。"
    
    je_request_international_alliance_intervention_button:0 "集団安全保障を発動"
    je_request_international_alliance_intervention_button_desc:0 "同盟条約は、加盟国が武力攻撃の被害を受けた場合、他のすべての同盟加盟国がこの暴力行為を全加盟国に対する武力攻撃とみなし、攻撃を受けた加盟国を支援するために必要と認める行動をとることを定めています。\n\n@information!同盟の集団防衛義務は同盟条約によって地理的に制限されています。そのため、加盟国が同盟の#y 地理的防衛範囲#!外の[concept_state]を対象とする[concept_war_goal]の標的となっている場合、集団安全保障の仕組みは発動できません。"
    
    war_goal_target_state_in_alliance_geographical_limits.tt:0 "[concept_war_goal]の対象となっている[ROOT.GetCountry.GetAdjective][concept_state]がすべて該当する国際同盟の#y 地理的防衛範囲#!内にある"
    country_has_truce_with_international_alliance_member.tt:0 "敵国と[concept_war]状態にないか[concept_truce]を結んでいない#y 同盟加盟国が少なくとも1か国#!存在する"
    war_goal_target_state_in_alliance_annex_goal.tt:0 "#y 併合型#!の[concept_war_goal]の対象となっている[ROOT.GetCountry.GetName]"
    war_goal_target_state_in_alliance_subject_goal.tt:0 "#y 従属化型#!の[concept_war_goal]の対象となっている[ROOT.GetCountry.GetName]"
    
    international_alliance_geographical_limits_desc:0 "@information!同盟の集団防衛義務は同盟条約によって地理的に制限されています。そのため加盟国が同盟の#y 地理的保護範囲#!外にある[concept_state]を対象とする[concept_war_goal]の標的となった場合は集団安全保障の仕組みを発動できません。"
    
    invoke_collective_security.tt:0 "同じ#y 国際同盟#!の全加盟国に[ROOT.GetCountry.GetName]の[concept_war]への支援を要請する"
    
    je_foreign_monarchy:0 "外国君主制"
    je_foreign_monarchy_reason:0 "[SCOPE.sCharacter('constitutional_monarch_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('constitutional_monarch_scope').GetFirstName]は[ROOT.GetCountry.GetName]の[concept_monarch_character]です。$constitutional_monarchy_type_desc$ [SCOPE.GetRootScope.GetCountry.GetCustom('viceroy_monarchy_type_custom_desc')]\n\n@information![SCOPE.sCharacter('constitutional_monarch_scope').GetCountry.GetAdjective] [GetLawType('law_HOS_monarch').GetName]とのつながりが断たれると[ROOT.GetCountry.GetName]は自動的に[GetLawType('law_HOS_president').GetName]になります。"
    
    amendment_council_state:0 "大衆国"
    amendment_council_state_desc:0 "基礎人民会議と人民委員会を通じて運営される直接民主制を採用します。"
    
    enact_council_state_decision:0 "大衆国を制定"
    enact_council_state_decision_desc:0 "憲法を改正し基礎人民会議と人民委員会を通じて運営される直接民主制を創設します。"
    
    character_ineligible_as_office_holder:0 "犯罪歴"
    character_ineligible_as_office_holder_desc:0 "この[concept_character]には犯罪歴があるため憲法上#y 元首#!または#y 政府首班#!に就くことができません。"
    
    ineligible_ruler_character.t:0 "事実上の支配者[SCOPE.sCharacter('ineligible_ruler_character').GetFullName]"
    ineligible_ruler_character.d:0 "[SCOPE.sCharacter('ineligible_ruler_character').GetFullName]は憲法により[ROOT.GetCountry.GetName]の#y 元首#!または#y 政府首脳#!となることを禁じられていますが、[concept_government]における[SCOPE.sCharacter('ineligible_ruler_character').GetHerHis]の政治的盟友の巧みな支援を受け、正式な在任者は[SCOPE.sCharacter('ineligible_ruler_character').GetFullName]のために[SCOPE.sCharacter('ineligible_ruler_character').GetPrimaryRoleTitle]の地位を設け、事実上[concept_country]を運営させています。当然ながらこれは[SCOPE.sCharacter('ineligible_ruler_character').GetFullName]の政敵には受け入れられず、彼らは[SCOPE.sCharacter('ineligible_ruler_character').GetHerHim]が[concept_law]に違反していると非難しています。"
    ineligible_ruler_character.f:0 "#y $character_ineligible_as_office_holder$#![concept_character_trait]を持つ[concept_character]が[concept_ruler]になると、事実上の統治が生じます。これにより事実上の統治が続く間、事実上の統治者に対して一定の留保権限を持つ別個の行政府が置かれます。"
    ineligible_ruler_character.option.1:0 "素晴らしい。"
    
    recruit_politician_character.t:0 "新たな党員の募集"
    recruit_politician_character.d:0 "与党が新党員の勧誘運動を開始しました。さまざまな思想的背景を持つ人々から入党の申し込みが寄せられています。党首[ROOT.GetCountry.GetRuler.GetFullName]は[ROOT.GetCountry.GetRuler.GetSheHe]が迎え入れたい人物を選ばなければなりません。"
    recruit_politician_character.f:0 "新たな党員は常に[concept_ruler]と同じ[concept_interest_group]を持ちます。"
    recruit_politician_character.option.1:0 "$ideology_autocratic$の候補者を採用する。"
    recruit_politician_character.option.2:0 "$ideology_power_hungry$の候補者を採用する。"
    recruit_politician_character.option.3:0 "$ideology_elitist$の候補者を採用する。"
    recruit_politician_character.option.4:0 "$ideology_democratic$の候補者を採用する。"
    recruit_politician_character.option.5:0 "$ideology_liberal$の候補者を採用する。"
    recruit_politician_character.option.6:0 "多様性枠の候補者を採用する。"
    
    je_party_system_recruit_politician_button:0 "新たな党員を募集"
    je_party_system_recruit_politician_button_desc:0 "与党は新たな党員を迎えるための募集活動を開始します。これにより党議長が選んだ[concept_ideology]を持つ[concept_politician]を党に迎え入れられます。"
    
    recruit_politician_timer.tt:0 "過去#y 3か月#!以内に新たな党員を募集していない"
    
    terrorist_prison_breakout.t:0 "[SCOPE.sCharacter('prisoner_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('prisoner_scope').GetFullName]が脱獄しました！"
    terrorist_prison_breakout.d:0 "[SCOPE.sCharacter('terrorist_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('terrorist_scope').GetFullName]が[SCOPE.sCharacter('prisoner_scope').GetFullName]を[SCOPE.sCharacter('prisoner_scope').GetHerHis]の獄中から解放する作戦を指揮しました。ゲリラと我が国の治安部隊との激しい銃撃戦の末、[SCOPE.sCharacter('prisoner_scope').GetFullName]は無事解放され、[SCOPE.sCharacter('terrorist_scope').GetFullName]のゲリラ組織に加わりました。"
    terrorist_prison_breakout.f:0 "このイベントは[ROOT.GetCountry.GetName]の[concept_prisoner_character]と同じ[concept_interest_group]を持つ[concept_character_role_terrorist]が[concept_country]にいる場合に発生します。"
    terrorist_prison_breakout.option:0 "何たる失態だ…"
    
    character_role_head_of_armed_forces:0 "[concept_head_of_armed_forces_character]"
    character_role_head_of_armed_forces_title:0 "[concept_head_of_armed_forces_character]"
    concept_head_of_armed_forces_character:0 "軍部の長"
    concept_head_of_armed_forces_character_desc:0 "この[concept_character]は[concept_country]の軍部の長です。"
    
    character_role_head_of_paramilitary:0 "[concept_head_of_paramilitary_character]"
    character_role_head_of_paramilitary_title:0 "[concept_head_of_paramilitary_character]"
    concept_head_of_paramilitary_character:0 "準軍事組織の長"
    concept_head_of_paramilitary_character_desc:0 "この[concept_character]は国家の準軍事組織の長です。"
    
    je_appoint_vice_president_button:0 "副[concept_ruler]を任命する"
    je_appoint_vice_president_button_desc:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]は[concept_character]を[ROOT.GetCountry.GetRuler.GetHerHis]副官に任命します。"
    
    ruler_change_after_elections_only.tt:0 "[concept_election]の直後です"
    
    je_power_struggle_system:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]の権力闘争"
    je_power_struggle_system_reason:0 "[ROOT.GetCountry.GetName]の専制的な[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]が[concept_heir]を残さずに死去したため[concept_government]に権力の空白が生じました。これにより[concept_government]の有力な派閥の間で次の[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の座をめぐる指導権争いが始まっています。\n\n最初に#g 100％#!の進捗に到達した#y 指導者候補#!が[ROOT.GetCountry.GetName]の次の[concept_ruler]として地位を固めます。\n\n#y 指導者候補：#!\n• [SCOPE.sCharacter('power_struggle_candidate_1').GetPrimaryRoleTitle][SCOPE.sCharacter('power_struggle_candidate_1').GetFullName]：#y [GetPlayer.MakeScope.Var('power_struggle_candidate_1').GetValue]％#!\n• [SCOPE.sCharacter('power_struggle_candidate_2').GetPrimaryRoleTitle][SCOPE.sCharacter('power_struggle_candidate_2').GetFullName]：#y [GetPlayer.MakeScope.Var('power_struggle_candidate_2').GetValue]％#!\n• [SCOPE.sCharacter('power_struggle_candidate_3').GetPrimaryRoleTitle][SCOPE.sCharacter('power_struggle_candidate_3').GetFullName]：#y [GetPlayer.MakeScope.Var('power_struggle_candidate_3').GetValue]％#!\n\n@information!#y 指導権の進捗#!は各#y 指導者候補#!の[concept_popularity]、[concept_prominence]、[concept_interest_group]の[concept_clout]に基づいて算出されます。1か月あたりの最大進捗は#y 5％#!です。"
    je_power_struggle_system_status:0 "[concept_country]に権力の空白が生じました。最初に#y 100％#!の進捗に到達した#y 指導者候補#!が次の[concept_ruler]となります。"
    
    power_struggle_candidate_1_completed.tt:0 "[SCOPE.sCharacter('power_struggle_candidate_1').GetFullName]の#y 指導権の進捗#!が#g 100％#!に到達した"
    power_struggle_candidate_2_completed.tt:0 "[SCOPE.sCharacter('power_struggle_candidate_2').GetFullName]の#y 指導権の進捗#!が#g 100％#!に到達した"
    power_struggle_candidate_3_completed.tt:0 "[SCOPE.sCharacter('power_struggle_candidate_3').GetFullName]の#y 指導権の進捗#!が#g 100％#!に到達した"
    
