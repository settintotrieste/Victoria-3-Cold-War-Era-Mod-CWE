    je_post_ww2_rationing:0 "第二次世界大戦後の配給制"
    je_post_ww2_rationing_reason:0 "第二次世界大戦後の配給制は戦争による物資不足に対処するため多くの国で実施された希少資源の統制分配制度です。各国の政府は配給手帳・配給券・点数制度を導入し食料・衣料・燃料その他の生活必需品の入手を管理しました。\n\nイギリスでは配給制は戦時中に始まり1954年まで続き肉・砂糖・乳製品などが対象となりました。\n\n同様の措置はヨーロッパ大陸や日本など戦争で混乱に見舞われた地域でも採られました。配給制は戦後復興期において公平な分配を確保し経済を安定させ復興を支えることを目的としていました。"
    post_ww2_rationing_modifier:0 "第二次世界大戦後の配給制"
    
    enforce_parliamentary_regime_system.t:0 "[GetPlayer.GetRuler.GetLastName]内閣の危機"
    enforce_parliamentary_regime_system.d:0 "度重なる内閣改造の結果、[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')][GetPlayer.GetRuler.GetFullName]の[concept_interest_group]は思いがけず[concept_government]から外れてしまいました。\n\n[ROOT.GetCountry.GetAdjective]政府の議院内閣制では[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の[concept_party]または[concept_interest_group]も[concept_government]に含まれている必要があるため、[GetPlayer.GetRuler.GetInterestGroup.GetName]を[concept_government]へ再び迎え入れるか[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]が辞任しなければなりません。"
    enforce_parliamentary_regime_system.f:0 "このイベントは[ROOT.GetCountry.GetName]の[concept_government_type]が#y 議院内閣制#!であるにもかかわらず[concept_ruler]の[concept_interest_group]が[concept_government]に含まれていないため発生しました。"
    
