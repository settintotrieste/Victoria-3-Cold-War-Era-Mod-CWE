    dutch_west_papua.sgc.t:0 "ニューヨーク協定？"
    dutch_west_papua.sgc.d:0 "ニューヨーク協定（1962年8月15日調印）は、アメリカと国際連合の仲介によりインドネシアとオランダの間で結ばれた条約で、西ニューギニア（西イリアン）の統治権をオランダ側からインドネシアへ移譲するものです。まず国連による暫定統治を置き、その後インドネシアの主権下に移し、1969年までに「自由選択法」と呼ばれる住民投票を実施すると約束されました。"
