    je_climate_change_system:0 "地球規模の気候変動"
    je_climate_change_system_reason:0 "気候変動とは気温や気象パターンの長期的な変化を指します。こうした変化は自然に起こることもありますが、1800年代以降は人間の活動が気候変動の主な原因となっています。その主因は熱を閉じ込めるガスを生む化石燃料（石炭、石油、ガスなど）の燃焼です。\n\n現在の気候状況：[SCOPE.GetRootScope.GetCountry.GetCustom('climate_effect_name')]\n\n目標：気候指標を+2.0°C以下に抑える\n\n現在の世界気温：+[GetPlayer.MakeScope.Var('climate_change_status_total_display').GetValue]°C\n\n世界気温の年間変化：[GetPlayer.MakeScope.Var('climate_change_progress_rate_display').GetValue]°C\n\nヒント：より良い$lawgroup_environmental_policy$[concept_law]を制定することで気候変動の進行を遅らせることができます。"
    je_climate_change_system_status:0 "気候指標：+[GetPlayer.MakeScope.Var('climate_change_status_total_display').GetValue]°C"
    
    climate_change_effects_1:0 "極めて軽微な気候異常"
