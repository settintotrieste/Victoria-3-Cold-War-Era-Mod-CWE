    je_head_of_state_system:0 "[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]職"
    je_head_of_state_system_reason:0 "[ROOT.GetCountry.GetName]の憲法では[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]が[Concept('concept_official_character','$head_of_state$')]と定められています。この役職は主に儀礼的なものですが、[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]は[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の行動を制限する一定の権限を行使できます。\n\n既定では[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]は[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]によって任命されます。任命される[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]は[concept_government]で最も高い[concept_clout]を持つ[concept_interest_group]の[concept_politician]となります。\n\n[SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]が選挙で選ばれる場合は[concept_country]で最も高い[concept_popularity]を持つ[concept_politician]が選出されます。\n\n#y [SCOPE.sCharacter('head_of_state_pm_scope').GetPrimaryRoleTitle]：#![SCOPE.sCharacter('head_of_state_pm_scope').GetFullName]"
    je_head_of_state_system_status_term:0 "在任期間[GetPlayer.MakeScope.Var('character_role_head_of_state_term').GetValue]/5年"
    je_head_of_state_system_goal:0 "[SCOPE.sCharacter('head_of_state_pm_scope').GetFullName]が任期を満了した"
    
