    je_armed_forces_system:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の軍部"
    je_armed_forces_system_reason:0 "[ROOT.GetCountry.GetAdjective]の軍部は将校や兵士、そしてそれを支える諸機関からなる、あなたの国家の軍事体制そのものです。軍部は強力な[concept_interest_group]であり、秩序や階級、そして拡張を好む傾向があります。その影響力は規律ある統治を通じて安定をもたらし得ますが、歯止めが利かなければ軍国主義や権威主義に陥る危険があります。\n\n#y 軍部の長：#![SCOPE.sCharacter('head_of_armed_forces').GetPrimaryRoleTitle][SCOPE.sCharacter('head_of_armed_forces').GetFullName]\n\n注：軍部の腐敗は、より厳格な#y $lawgroup_corruption_policy$#![Concept('concept_law','$concept_laws$')]を制定することで減らせます。"
    
    je_armed_forces_system_dismiss_military_chief_button:0 "軍部の長を解任"
    je_armed_forces_system_dismiss_military_chief_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は軍部の長を解任し、[concept_commander_rank]で次位にある人物を後任に据えます。"
    
    je_armed_forces_system_subvert_armed_forces_button:0 "軍部の掌握"
    je_armed_forces_system_subvert_armed_forces_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は[ROOT.GetCountry.GetAdjectiveNoFormatting]の軍部に属する不忠な者たちに辞職するよう圧力をかけ、思想的に忠実な軍人と入れ替えます。"
    
    je_armed_forces_system_reform_armed_forces_button:0 "軍部の改革"
    je_armed_forces_system_reform_armed_forces_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は国民を代表する軍人を要職に任命し、軍のイデオロギー的傾向が民意を反映するようにします。"
    
    je_armed_forces_system_restore_armed_forces_button:0 "軍を非政治化する"
    je_armed_forces_system_restore_armed_forces_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は[ROOT.GetCountry.GetAdjectiveNoFormatting]軍が自らの人員を任命することを認めます。これにより軍はエリート主義的かつテクノクラート的な組織となるでしょう。"
    
