    je_non_competitive_elections: "[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]"
    je_non_competitive_elections_reason: "[ROOT.GetCountry.GetName]は[GetLawType('law_single_party_state').GetName]であるため、#y [SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]#!の[Concept('concept_election','$concept_elections$')]は[Concept('concept_non_competitive_election','$concept_non_competitive_elections$')]の枠組みのもとで実施されます。\n\nすべての候補者は[ROOT.GetCountry.GetName]の唯一の与党またはその統制下にある社会団体から指名されなければなりません。\n\n有権者は与党の候補者に反対票を投じることも認められていますが、その票は指定された投票所でしか受け付けられません。一方で与党への支持は白票を投じるだけで表明できます。\n\n@information! [Concept('concept_non_competitive_election','$concept_non_competitive_elections$')]は#y 5年#!ごとに実施され、[concept_war]中は停止されます。\n\n@information! #y $lawgroup_distribution_of_power$#![Concept('concept_law','$concept_laws$')]は[concept_government]の[concept_votes]を変更できます。"
    
    je_controlled_elections_disabled_button: "選挙を停止する"
    je_controlled_elections_disabled_button_desc: "[concept_government]は追って通知があるまで[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の選挙を一切実施しません。\n\n注：通常5年ごとに実施される[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の選挙が無効になります。"
    je_controlled_elections_enabled_button: "選挙を再開する"
    je_controlled_elections_enabled_button_desc: "[concept_government]は[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の選挙の実施を再開します。\n\n注：[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の選挙は5年ごとに実施されます。"
    
