    irish_open_border.t:0 "アイルランドの開放国境"
    irish_open_border.d:0 "歴史的な経緯から南アイルランドと北アイルランドの国境は開かれたままとなっています。そのためアイルランド島のどちらの側の市民も自由に行き来できます。ゲーム内ではこれを[SCOPE.sCountry('irish_country').GetName]が[SCOPE.sCountry('british_country').GetName]の関税同盟に参加している状態として表現しています。"
