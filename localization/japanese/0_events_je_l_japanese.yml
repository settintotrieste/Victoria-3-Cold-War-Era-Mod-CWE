    je_imf_system:0 "国際通貨基金"
    je_imf_system_reason:0 "IMFは1930年代の大恐慌の余波を受け、国際経済協力の枠組みを構築する目的で1944年に設立されました。IMFは現実のまたは潜在的な国際収支問題を抱える加盟国に対し、緊急融資を含む融資を行います。その狙いは根本的な問題を是正しつつ、外貨準備の再建、通貨の安定、輸入代金の支払いの継続、力強い経済成長の条件の回復を支援することにあります。\n\n@information!#y [ROOT.GetCountry.GetAdjectiveNoFormatting]の通貨#!の強さは[concept_country]の#y 利子率#!と#y 鋳貨率#!によって決まります。"
