    PAP_1958_revolution.t: "教皇ヨハネ23世の在位？"
    PAP_1958_revolution.d: "教皇ヨハネ23世は1958年10月28日から1963年6月に死去するまでカトリック教会の首長およびバチカン市国の元首を務めました。彼の大きな目標は教会の司牧的役割と国政への必然的な関与を重視し教会を近代化することでした。"
    PAP_1963_revolution.t: "教皇パウロ6世の在位？"
    PAP_1963_revolution.d: "教皇パウロ6世は1963年6月21日から1978年8月6日に死去するまでカトリック教会の首長およびバチカン市国の元首を務めました。ヨハネ23世の後を継いで第2バチカン公会議を継続し、1965年に閉会させるとともにその数多くの改革を実行しました。また東方正教会やプロテスタント諸教会とのエキュメニカルな関係改善を推し進め、多くの歴史的な会談と合意をもたらしました。"
    PAP_1978_revolution.t: "教皇ヨハネ・パウロ2世の在位？"
    PAP_1978_revolution.d: "教皇ヨハネ・パウロ2世は1978年から2005年に死去するまでカトリック教会の首長およびバチカン市国の元首を務めました。民主主義のために独裁と戦い、祖国ポーランドをはじめヨーロッパ各地で共産主義支配を終わらせる一助となったと評価されています。[14]ヨハネ・パウロ2世のもとでカトリック教会はアフリカとラテンアメリカで影響力を大きく拡大し、ヨーロッパをはじめ世界各地でも影響力を保ちました。"
    PAP_2005_revolution.t: "教皇ベネディクト16世の在位？"
    PAP_2005_revolution.d: "教皇ベネディクト16世は2005年4月19日から2013年2月28日に退位するまでカトリック教会の首長およびバチカン市国の元首を務めました。ベネディクトは教皇ヨハネ・パウロ2世の死去を受けて開かれた2005年のコンクラーヴェで教皇に選出されました。退位に際して「名誉教皇」と呼ばれることを選び、2022年に死去するまでこの称号を保持しました。"
    PAP_2013_revolution.t: "教皇フランシスコの在位？"
    PAP_2013_revolution.d: "教皇フランシスコはカトリック教会の首長でありバチカン市国の元首です。イエズス会出身の初の教皇であり、アメリカ大陸および南半球出身の初の教皇であり、8世紀のシリア出身の教皇グレゴリウス3世以来初めてヨーロッパ以外で生まれ育った教皇です。"
    PAP_GENERIC_revolution.t: "新教皇"
    PAP_GENERIC_revolution.d: "ローマのカトリック教会は前教皇の逝去を受けて新たな教皇を選出しました。新教皇はコンクラーヴェと呼ばれる手続きを通じて枢機卿団により選ばれました。コンクラーヴェでは80歳未満の枢機卿が秘密投票を行い、候補者が3分の2の多数を得るまで投票を繰り返します。"
    PAP_GENERIC_revolution.f: "このイベントは世界に教皇である[concept_character]が存在しないため発生しました。"
    
    controlled_election.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting]立法選挙"
    controlled_election.d: "本日#o [SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]#!の選挙が実施されました。候補者は[ROOT.GetCountry.GetName]の唯一の与党または与党が統制する公的団体から推薦を受ける必要がありました。有権者は与党候補者に反対票を投じることもできましたが、それには投票ブースを使わねばならず、一方で与党への賛成票は白票を提出するだけで投じることができました。\n\n結果：#g [GetPlayer.MakeScope.Var('controlled_elections_vote_result_display').GetValue]％#!が[concept_government]を支持"
    controlled_election.f: "[ROOT.GetCountry.GetName]は[Concept('concept_non_competitive_election','$concept_non_competitive_elections$')]であるため[Concept('concept_election','$concept_elections$')]は主に[concept_government]に対する信任投票として機能します。[Concept('concept_radical','$concept_radicals$')]の数が[Concept('concept_loyalist','$concept_loyalists$')]の数を上回ると[concept_government]の正統性が損なわれます。\n\n注：[Concept('concept_non_competitive_election','$concept_non_competitive_elections$')]の効果は次の式に従って減少します：[Concept('concept_radical','$concept_radicals$')]の合計÷[Concept('concept_loyalist','$concept_loyalists$')]の合計＋（[Concept('concept_radical','$concept_radicals$')]の合計×100）"
    controlled_elections_system_option.1: "投票結果を尊重する。"
    controlled_elections_system_option.2: "結果を操作せよ！"
    controlled_elections_system_option: "民意は示された！"
    
