    je_law_enactment_system_pause_enactment_button_desc:0 "[concept_government]は追って通知があるまで[SCOPE.GetRootScope.GetCountry.GetLawBeingEnacted.GetName]の[Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enactment$')]を一時停止します。"
