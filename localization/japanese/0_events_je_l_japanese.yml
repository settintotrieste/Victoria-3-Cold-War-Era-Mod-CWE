    request_imf_loan_decision:0 "国際通貨基金の融資を求める"
    request_imf_loan_decision_desc:0 "IMFは1930年代の大恐慌の余波を受けて1944年に設立され、国際的な経済協力の枠組みを築くことを目的としています。IMFは国際収支上の問題に直面している、あるいは直面する恐れのある加盟国に対し緊急融資を含む融資を提供します。その狙いは根本的な問題を是正しつつ、外貨準備の再建、通貨の安定、輸入代金の支払いの継続、そして力強い経済成長の条件の回復を支援することにあります。"
    IMF_loan_request.t:0 "[SCOPE.sCountry('imf_loan_debtor').GetName]へのIMFの融資に参加しますか？"
    IMF_loan_request.d:0 "[SCOPE.sCountry('imf_loan_debtor').GetName]は現在、国際収支の均衡を保つうえで深刻な困難に直面しています。その結果、同国の外交官は現在の未払い債務の返済を助ける融資を求めて国連の国際通貨基金に接触しました。IMFの資金は主に各国が加盟時に出資金（クォータ）として払い込む資金でまかなわれているため、[SCOPE.sCountry('imf_loan_creditor').GetName]は[SCOPE.sCountry('imf_loan_debtor').GetName]への資金提供を要請されています。"
    IMF_loan_request.f:0 "[SCOPE.sCountry('imf_loan_debtor').GetName]への融資を選択すると、[ROOT.GetCountry.GetName]は[concept_obligation]と引き換えに[SCOPE.sCountry('imf_loan_debtor').GetName]の[Concept('concept_credit','$concept_credit_debt$')]の5％を引き受けるか、[Concept('concept_bankroll','$concept_bankrolling$')][SCOPE.sCountry('imf_loan_debtor').GetName]を開始します。"
    imf_loan_option.1:0 "彼らに融資を行おう。"
    imf_loan_option.2:0 "我が国自身も財政的に苦しい…"
    imf_loan_option.3:0 "このイベントで二度と煩わせるな！"
    
    IMF_loan_terms.t:0 "IMF経済改革"
    IMF_loan_terms.d:0 "IMFと[SCOPE.sCountry('imf_loan_debtor').GetName]の融資協定の条件として、債務国は自由市場と政府支出の抑制を促すため経済体制の全面的な改革に着手しなければなりません。よって[SCOPE.sCountry('imf_loan_debtor').GetName]の政府は市場を世界に開放し国営企業を民営化し通貨の増発を抑制する法律を成立させる義務を負います。"
    IMF_loan_terms.f:0 "このイベントは債務協定の締結時または協定の有効期間中に自由で競争的な市場に関するIMFの要件を満たさなかったために発生しました。"
    imf_loan_terms:0 "IMFの命令に従うほかない。"
    
