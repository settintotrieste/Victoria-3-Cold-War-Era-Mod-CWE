    GBR_change_monarch_1952.t: "国王ジョージ6世の崩御"
    GBR_change_monarch_1952.d: "戦争の心労はジョージの健康を蝕んでいました。それはヘビースモーカーであったことで悪化し、やがて肺がんのほか動脈硬化症やバージャー病などを患うに至りました。1952年1月31日、ジョージは側近の忠告を押し切ってロンドン空港へ赴き、ケニア経由でオーストラリアへの外遊に向かうエリザベスとフィリップを見送りました。これが彼の最後の公の場への登場となりました。6日後の2月6日朝7時30分（GMT）、彼はノーフォークのサンドリンガム・ハウスで寝台の上で亡くなっているのが発見されました。夜のうちに冠動脈血栓症により56歳で死去したのでした。"
    GBR_change_monarch_2022.t: "女王エリザベス2世の崩御"
    GBR_change_monarch_2022.d: "連合王国およびその他の英連邦王国の女王エリザベス2世は2022年9月8日にスコットランドのバルモラル城で96歳で死去しました。70年214日に及ぶエリザベスの治世は歴代英国君主の中で最長でした。直ちに長男のチャールズ3世が王位を継承しました。"
    JAP_change_monarch_1989.t: "昭和天皇の崩御"
    JAP_change_monarch_1989.d: "1987年9月22日、数か月にわたり消化器の不調を抱えていた昭和天皇は膵臓の手術を受けました。医師団は十二指腸がんを発見しました。術後数か月は順調に回復しているように見えました。しかし約1年後の1988年9月19日、天皇は皇居で倒れ、その後の数か月間は内出血が続いて容体が悪化していきました。天皇は1989年1月7日午前6時33分、87歳で崩御しました。"
    JAP_change_monarch_2019.t: "明仁天皇の退位？"
    JAP_change_monarch_2019.d: "2016年7月13日、公共放送のNHKは当時82歳の天皇が高齢を理由に数年以内に退位し、長男の徳仁皇太子に譲位する意向であると報じました。2017年5月19日、明仁天皇の退位を可能にする法案が内閣から提出されました。同年6月8日に国会で可決され、この法律は天皇の退位等に関する皇室典範特例法として知られるようになりました。これにより徳仁への譲位に向けた政府の準備が始まりました。2017年12月、安倍晋三首相は明仁天皇の退位を2019年4月30日の終わりとし、徳仁が2019年5月1日付で第126代天皇に即位すると発表しました。"
    BEL_change_monarch_2013.t: "アルベール2世国王の退位？"
    BEL_change_monarch_2013.d: "ベルギー国王アルベール2世は高齢と健康上の懸念を理由に2013年7月21日に退位しました。在位20年を経て、ベルギー建国記念日の式典で王位を息子のフィリップに譲りました。アルベールは退位の演説で国民の団結を訴え、王位の平穏な継承を印象づけました。"
    SPA_change_monarch_2014.t: "フアン・カルロス1世国王の退位？"
    SPA_change_monarch_2014.d: "スペイン国王フアン・カルロス1世は同月初めに退位の意向を表明した後、2014年6月19日に退位しました。健康上の問題と世代交代の必要を理由に、王位を息子のフェリペ6世に譲りました。退位の背景には相次ぐ不祥事による人気の低下があり、議会の承認を経て正式に成立しました。"
    NET_change_monarch_1980.t: "ユリアナ女王の退位？"
    NET_change_monarch_1980.d: "オランダ女王ユリアナは在位32年を経て71歳の誕生日である1980年4月30日に退位しました。彼女は高齢と次世代へ責務を引き継ぎたいという思いを理由に挙げ、娘のベアトリクスが王位を継ぎました。この退位は終身在位よりも自発的な引退を重んじるオランダ王室の伝統を反映したものでした。"
    NET_change_monarch_2013.t: "ベアトリクス女王の退位？"
    NET_change_monarch_2013.d: "オランダ女王ベアトリクスは33年の在位を経て2013年4月30日に退位しました。彼女は新しい世代に道を譲りたいという思いを理由に挙げ、息子のウィレム＝アレクサンダーに王位を譲りました。この退位は一つの時代の終わりを告げるとともに、オランダにとって1世紀以上ぶりとなる男性君主の時代の始まりとなりました。"
    LUX_change_monarch_1964.t: "シャルロット大公の退位？"
    LUX_change_monarch_1964.d: "ルクセンブルク大公シャルロットは45年の統治を経て1964年11月12日に退位しました。彼女は高齢と刷新の必要性を理由に挙げ、息子のジャンに位を譲りました。その治世は第二次世界大戦と戦後復興にまたがり、彼女は国民の団結と不屈の象徴となりました。"
    LUX_change_monarch_2000.t: "ジャン大公の退位？"
    LUX_change_monarch_2000.d: "ルクセンブルク大公ジャンは在位36年を経て2000年10月7日に退位しました。彼は次世代へ責務を引き継ぎたいという思いを理由に挙げ、息子のアンリに権力を移譲しました。ジャンの治世は戦後の近代化で知られ、また彼はそれ以前の第二次世界大戦で兵士として戦い、国民の不屈の象徴ともなりました。"
    LUX_change_monarch_2025.t: "アンリ大公の退位？"
    LUX_change_monarch_2025.d: "ルクセンブルク大公アンリは25年近い在位を経て2025年10月3日に退位しました。彼は世代交代と継続性の重要性を理由に挙げ、長男のギヨームに位を譲りました。この継承はルクセンブルク市の大公宮で行われた公式の式典によって執り行われました。"
    DEN_change_monarch_2024.t: "マルグレーテ2世女王の退位？"
    DEN_change_monarch_2024.d: "デンマーク女王マルグレーテ2世は2024年1月14日に退位し、52年にわたる在位に幕を下ろしました。女王は大晦日の新年演説で世代交代を理由にこの決断を表明しました。息子のフレデリクが国王フレデリク10世として王位を継承しました。デンマーク王室における自発的な退位は、約900年ぶりのことでした。"
    NOR_change_monarch_1957.t: "国王ホーコン7世の崩御"
    NOR_change_monarch_1957.d: "国王ホーコン7世は長く敬愛された治世の末、1957年に崩御しました。ノルウェー独立と戦時下の不屈の象徴であった国王の死は一つの時代の終わりを告げるとともに、オーラヴ5世の治世の始まりとなり、ノルウェー王室に新たな章を開きました。"
    NOR_change_monarch_1991.t: "国王オーラヴ5世の崩御"
    NOR_change_monarch_1991.d: "国王オーラヴ5世は1991年に崩御しました。その謙虚さと戦時中の奉仕から「国民の王」として愛された国王の死は全国的な哀悼に包まれ、息子のハーラル5世が即位して、近代的で親しみやすい王室の伝統を受け継ぎました。"
    SWE_change_monarch_1950.t: "国王グスタフ5世の崩御"
    SWE_change_monarch_1950.d: "国王グスタフ5世は1950年に92歳で崩御し、2度の世界大戦をまたいだ43年の治世を終えました。その死によって王位はグスタフ6世アドルフへと移り、スウェーデンは近代的な立憲君主制への歩みを続けました。"
    SWE_change_monarch_1973.t: "国王グスタフ6世の崩御"
    SWE_change_monarch_1973.d: "国王グスタフ6世アドルフは1973年に崩御しました。学術への深い関心と堅実な指導力で記憶される国王の死は一つの時代の終わりを告げ、カール16世グスタフの即位によってスウェーデン王室は世代交代を迎えました。"
    GRE_change_monarch_1964.t: "国王パウロスの崩御"
    GRE_change_monarch_1964.d: "ギリシャ国王パウロスは戦後復興と冷戦の緊張に彩られた治世の末、1964年に崩御しました。息子のコンスタンティノス2世が王位を継ぎましたが、高まる政情不安がやがて王制の行く末を脅かすことになります。"
    THI_change_monarch_2016.t: "国王プミポン・アドゥンヤデート・マヒドンの崩御"
    THI_change_monarch_2016.d: "国王プミポン・アドゥンヤデートは70年に及ぶタイ史上最長の治世の末、2016年に崩御しました。その道徳的権威と開発事業によって敬愛された国王の死は国民に深い衝撃を与えました。ワチラロンコン王太子がラーマ10世として王位を継承しました。"
    CAM_change_monarch_2004.t: "国王ノロドム・シハヌークの崩御"
    CAM_change_monarch_2004.d: "ノロドム・シハヌーク国王が2012年に死去しました。国王はカンボジア近代史において極めて重要な役割を果たしました。君主から政治家へ、そして再び君主へと歩んだ複雑な生涯は、息子ノロドム・シハモニへの平和的な継承をもって幕を閉じました。"
    CHI_change_monarch_1967.t: "溥儀の死"
    CHI_change_monarch_1967.d: "中国最後の皇帝である溥儀が、共産党政権下での長年の思想改造を経て1967年に死去しました。幼くして皇帝となり、のちに満洲国の傀儡君主となった彼の死は、帝政中国の最後の黄昏を象徴するものでした。"
    AUS_change_monarch_2011.t: "オットー・フォン・ハプスブルクの死"
    AUS_change_monarch_2011.d: "オーストリア＝ハンガリー帝国最後の継承者オットー・フォン・ハプスブルクが、2011年7月4日に98歳で死去しました。ウィーンでの葬儀は640年続いた王朝の象徴的な終焉となりました。遺体は皇帝納骨堂に埋葬され、心臓はハプスブルク家の伝統に従い別途ハンガリーに埋葬されました。"
    EGY_change_monarch_1952.t: "フアード2世の誕生"
    EGY_change_monarch_1952.d: "エジプトのフアード2世が1952年1月16日にカイロのアブディーン宮殿で誕生しました。ファルーク1世国王とナリマン・サデク王妃の子である彼は、わずか数か月後に父の退位を受けて即位し、1953年に王政が廃止されるまでの短い期間在位したエジプト最後の君主となりました。"
    PER_change_monarch_1960.t: "レザー・パフラヴィーの誕生"
    PER_change_monarch_1960.d: "イラン皇太子レザー・パフラヴィーが1960年10月31日にテヘランで誕生しました。シャー・モハンマド・レザー・パフラヴィーとファラ・ディーバ皇后の子である彼は、1967年に孔雀の玉座の継承者に指名されました。その誕生はパフラヴィー朝の存続を象徴するものでした。"
    JOR_change_monarch_1962.t: "アブドゥッラー2世の誕生"
    JOR_change_monarch_1962.d: "アブドゥッラー2世は1962年1月30日にヨルダンのアンマンで、フセイン国王とムナ王妃の長男として誕生しました。預言者ムハンマドの血を引くハーシム家の一員として、誕生と同時に皇太子に宣下されました。ヨルダンの伝統と国際的な教育を併せ持つ生い立ちが、のちの指導者としての資質を形作りました。"
    
