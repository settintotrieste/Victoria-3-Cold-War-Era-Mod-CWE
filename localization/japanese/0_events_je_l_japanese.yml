    je_tekhpromfinplans:0 "技術・生産・財務計画"
    je_tekhpromfinplans_reason:0 "[ROOT.GetCountry.GetAdjective]の$law_semi_command_economy$のもとでは投資の決定は分権化されています。企業は技術・生産・財務計画と呼ばれる年次計画を提出し、四半期ごと・月ごとの生産計画を定めます。国家計画当局はこれらの計画を承認（または却下）し、資材と資金を割り当てます。企業は計画の範囲内で製品を販売します。\n\nこの制度により[concept_government]は[concept_gold_reserves]から[concept_investment_pool]へ資金を移し、国営企業が自律的に[Concept('concept_building', '$concept_buildings$')]を建設できるようにします。"
    je_tekhpromfinplans_status:0 "[concept_investment_pool]：#Green [GetPlayer.MakeScope.Var('tekhpromfinplans_fund_size').GetValue]M#!"
    
    je_start_inject_tekhpromfinplans_button:0 "事業の承認を開始する"
    je_start_inject_tekhpromfinplans_button_desc:0 "週間固定純収入が@money!#yellow 10000#!以上であれば、[concept_government]は分権化された国営企業が提出する投資計画を毎月承認し、その計画を実行できるよう[concept_treasury]から[concept_investment_pool]へ資金を移します。"
    je_stop_inject_tekhpromfinplans_button:0 "事業の承認を停止する"
    je_stop_inject_tekhpromfinplans_button_desc:0 "[concept_government]は分権化された国営企業が提出する投資計画の承認を停止します。"
    
    start_tekhpromfinplans.tt:0 "過去1か月以内に事業の承認を開始または停止していない"
    
    je_state_run_companies:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]の国営企業"
    je_state_run_companies_reason:0 "[ROOT.GetCountry.GetName]は[GetLawType('law_command_economy').GetName]を持ちながらも、半自律的な国営[Concept('concept_company','$concept_companies$')]を有しています。\n\n[ROOT.GetCountry.GetAdjective][concept_government]は[concept_treasury]から追加の物資と資金を提供し、これらの企業が自由に使えるようにすることで投資を拡大できます。\n\nこの制度により[concept_government]は[concept_gold_reserves]から[concept_investment_pool]へ資金を移し、国営企業が自律的に[Concept('concept_building', '$concept_buildings$')]を建設できるようにします。"
