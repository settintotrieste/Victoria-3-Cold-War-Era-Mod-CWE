    concept_upper_house:0 "上院"
    concept_upper_house_desc:0 "上院とは二院制議会を構成する二つの議院の一方であり、もう一方が下院です。正式に上院とされる議院は通常より小規模で、下院よりも権限が制限されている場合が多くあります。"
    concept_lower_house:0 "下院"
    concept_lower_house_desc:0 "下院とは二院制議会を構成する二つの議院の一方であり、もう一方が上院です。公式には上院の「下位」に位置づけられているものの、世界各地の議会では下院がより大きな権力を握り、あるいは強い政治的影響力を及ぼすようになっています。"
    
