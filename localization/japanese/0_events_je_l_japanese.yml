    je_join_superstate_free_trade_zone_button:0 "共同市場に参加"
    je_join_superstate_free_trade_zone_button_desc:0 "共同市場は一般に[concept_customs_union]の創設に向けた第一段階とされます。通常は物品に関税が無く資本・労働者・サービスの移動が比較的自由な自由貿易圏を基盤としますが、その他の貿易障壁の削減はそれほど進んでいません。\n\nゲーム内では、同じ超国家構想を共有し超国家共同市場への参加を選んだすべての国の間で[concept_trade_privilege]と$transit_rights$[concept_treaty]が創設されることで表現されます。"
    
    je_leave_superstate_free_trade_zone_button:0 "共同市場から離脱"
    je_leave_superstate_free_trade_zone_button_desc:0 "共同市場は一般に[concept_customs_union]の創設に向けた第一段階とされます。通常は物品に関税が無く資本・労働者・サービスの移動が比較的自由な自由貿易圏を基盤としますが、その他の貿易障壁の削減はそれほど進んでいません。\n\nゲーム内では、同じ超国家構想を共有し超国家共同市場への参加を選んだすべての国の間で[concept_trade_privilege]と$transit_rights$[concept_treaty]が創設されることで表現されます。"
    
    je_join_superstate_customs_union_button:0 "単一市場に参加"
    je_join_superstate_customs_union_button_desc:0 "単一市場は統合された地域経済の最終段階にして究極の目標です。国境に関係なく物品・サービス（金融サービスを含む）・資本・人の完全に自由な移動が求められます。\n\nゲーム内では、同じ超国家構想を共有し超国家関税同盟への参加を選んだすべての国の間で[concept_customs_union]が創設されることで表現されます。"
    
    je_leave_superstate_customs_union_button:0 "単一市場から離脱"
    je_leave_superstate_customs_union_button_desc:0 "[concept_customs_union]は単一市場の最終段階にして究極の目標です。国境にとらわれず財、サービス（金融サービスを含む）、資本、人が完全に自由に移動できることが求められます。\n\nゲーム内では、同じ超国家構想を共有し超国家関税同盟への加盟を選んだすべての国の間で[concept_customs_union]を形成することで表現されています。"
    
    je_join_superstate_currency_union_button:0 "通貨同盟に加盟"
    je_join_superstate_currency_union_button_desc:0 "同じ$custom_loc_superstate_full_title$のメンバーで構成される[concept_currency_union]を創設できます。\n\nゲーム内では、この国と自国の[concept_market]の指導国との間で[concept_currency_union]を形成することで表現されています。"
    
    je_leave_superstate_currency_union_button:0 "通貨同盟から離脱"
    je_leave_superstate_currency_union_button_desc:0 "同じ$custom_loc_superstate_full_title$のメンバーで構成される[concept_currency_union]から離脱できます。\n\nゲーム内では、この国と自国の[concept_market]の指導国との間で[concept_currency_union]を形成することで表現されています。"
    
    je_join_superstate_defence_union_button:0 "防衛連合に加盟"
    je_join_superstate_defence_union_button_desc:0 "同じ$custom_loc_superstate_full_title$のメンバーで構成される地域防衛連合を創設できます。\n\nゲーム内では、同じ超国家構想を共有し超国家防衛連合への加盟を選んだすべての国の間で[concept_defensive_pact]を形成することで表現されています。"
    
    je_leave_superstate_defence_union_button:0 "防衛連合から離脱"
    je_leave_superstate_defence_union_button_desc:0 "同じ$custom_loc_superstate_full_title$のメンバーで構成される地域防衛連合から離脱できます。\n\nゲーム内では、同じ超国家構想を共有し超国家防衛連合への加盟を選んだすべての国の間で[concept_defensive_pact]を形成することで表現されています。"
    
    je_join_superstate_political_union_button:0 "政治連合に加盟"
    je_join_superstate_political_union_button_desc:0 "同じ$custom_loc_superstate_full_title$のメンバーで構成される地域政治連合を創設できます。\n\nゲーム内では超国家のメンバーの過半数が制定した法律の調和として表現されます。\n\n@warning!加盟国の50%超（つまり[GetPlayer.MakeScope.Var('superstate_members_majority').GetValue]）が制定した[concept_law]は我々も自動的に制定します。"
    
    je_superstate_warning_custom_title:0 "\n\n@warning![ROOT.GetCountry.GetName]は#y [SCOPE.GetRootScope.GetCountry.GetCustom('je_superstate_adjective_custom_title')]政治同盟#!の一員であるため、#yellow $custom_loc_superstate_full_title$#!の[concept_power_bloc_leader]は任意の[concept_power_bloc_member]に対し、自ら選んだ[Concept('concept_law', '$concept_laws$')]を[Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enact$')]するよう要請できます。"
    
    je_leave_superstate_political_union_button:0 "政治同盟から離脱"
    je_leave_superstate_political_union_button_desc:0 "同じ$custom_loc_superstate_full_title$メンバーとともに地域政治同盟を創設できます。\n\nゲーム内では超国家メンバーの過半数が制定した法律を調和させる形で表現されます。"
    
    je_create_superstate_final_union_button:0 "連合国家を創設"
    je_create_superstate_final_union_button_desc:0 "$custom_loc_superstate_full_title$メンバーで構成される統一国家を創設できます。\n\nゲーム内ではこの国が超国家の国タグに変わり、すべての超国家メンバーと[concept_confederal_state][concept_diplomatic_pact]を結成する形で表現されます。その後、各メンバーは超国家に併合されるかどうかを選択できます。"
    
    je_join_superstate_final_union_button:0 "連合国家に参加"
    je_join_superstate_final_union_button_desc:0 "$custom_loc_superstate_full_title$メンバーで構成される統一された超国家に参加できます。\n\nゲーム内ではこの国が超国家の国タグに併合される形で表現されます。"
    
    superstate_add_primary_culture.tt:0 "$custom_loc_superstate_full_title$がこの国の[concept_primary_cultures]を獲得します"
