    je_cohabitation_system: "[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]職"
    je_cohabitation_system_reason: "[ROOT.GetCountry.GetName]の憲法の下では[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の行政権は[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]と分担されています。これにより[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]は国の法律と政策の策定に一定の発言権を持ちます。\n\n@information![SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]は[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]が#r 不支持#!とする[Concept('concept_law','$concept_laws$')]の制定に#y 拒否権#!を行使できます。\n\n現在の[SCOPE.GetRootScope.GetCountry.GetCustom('government_prime_minister_custom_title')]：[SCOPE.sCharacter('cohabitation_pm_scope').GetFullName]"
    
