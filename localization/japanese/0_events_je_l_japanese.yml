    je_UN_system:0 "国際連合"
    je_UN_system_reason:0 "国際連合（UN）は国際平和と安全の維持、諸国間の友好関係の発展、国際協力の達成、そして諸国の行動を調和させるための中心となることを目的に掲げる政府間組織です。\n\n国連には総会、安全保障理事会、経済社会理事会、国際司法裁判所、国連事務局、信託統治理事会の6つの主要機関があります。ただし信託統治理事会は1994年以降活動を停止しています。\n\n国連の行政上の最高責任者は事務総長です。\n\n安保理理事国総数：[GetGlobalVariable('UN_unsc_members_counter').GetValue]\n\n$un_headquarters_country_label.tt$\n\n$unsg_character_label.tt$"
