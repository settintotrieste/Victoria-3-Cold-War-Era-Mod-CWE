    british_hong_kong.sgc.t:0 "香港に自治権？"
    british_hong_kong.sgc.d:0 "中英共同声明の後、香港政府は1984年7月18日に公表された諮問文書『グリーンペーパー：香港における代議政制のさらなる発展』を通じて民主化の検討を開始しました。同文書は1985年から立法局に24名の間接選挙議員を加えることを提案しました。うち12名は区議会、市政局、区域市政局で構成される選挙人団が選び、残る12名は職能別選挙区が選びます。これに加えて官守議員（政府高官）と総督が任命する非官守議員も残されます。これは中央レベルでの代議政制へ向けた第一歩であり、1988年の選挙後にさらなる見直しが予定されていました。"
    british_WIF_state.indy.t:0 "カリブ海における変革の風？"
    british_WIF_state.indy.d:0 "西インド諸島連合州（West Indies Associated States）は、東カリブ海にある複数の島々の総称です。これらの島の立ち位置は、1967年にイギリスの植民地からイギリスとの自由連合における州へと変更されました。時間の経過とともに、連合州は完全な独立へと向かい、その先駆けとなったのは1974年のグレナダでした。続いて、1978年にドミニカ、1979年にセントルシアとセントビンセント、1981年にアンティグア・バーブーダ、そして1983年にセントクリストファー・ネービスが独立を果たしました。"
    british_cyrenaica.sgc.t:0 "キレナイカに自治権？"
    british_cyrenaica.sgc.d:0 "キレナイカ首長国は、1949年3月1日にサイイド・イドリースがイギリスの後ろ盾を得てキレナイカをセヌーシー派の独立首長国であると一方的に宣言したことで成立しました。サイイド・イドリースはベンガジで開かれた「国民会議」において自らキレナイカ首長を名乗りました。イギリスによる承認は国際連合の姿勢を動かすには至らず、1949年11月21日に可決された決議によってイギリスとフランスはリビアの独立準備を進めるよう指示されました。"
    british_tuvalu.sgc.t:0 "ツバルに自治権？"
    british_tuvalu.sgc.d:0 "$generic_self_rule_decolonisation_loc_desc$"
    
    british_canada.indy.t:0 "カナダの独立？"
    british_canada.indy.d:0 "1981年、カナダの庶民院と上院は一連の憲法改正案を制定するようイギリス議会に要請する決議を可決しました。この改正はカナダに対して立法を行うイギリス議会の最後の権限を終わらせ、憲法改正の手続きを完全にカナダ内部で完結させるものでした。"
    british_australia.indy.t:0 "オーストラリアの独立？"
    british_australia.indy.d:0 "オーストラリア法はオーストラリアと英国の間に残されていた憲法上の結びつきを断ち切る一方で、君主はオーストラリア女王という独立した地位において維持されました。"
    british_new_zealand.indy.t:0 "ニュージーランドの独立？"
    british_new_zealand.indy.d:0 "1983年、ニュージーランド人が起草し当時のニュージーランド首相が署名した新たな特許状が発せられました。この特許状はニュージーランドを「ニュージーランド王国」と宣言し、1917年の帝国特許状を廃止しました。ニュージーランド議会に残る英国との最後の実質的な憲法上の結びつきは、1986年憲法法（1987年1月1日施行）によって取り除かれました。同法は、ニュージーランドの要請と同意に基づいて同国のために立法する英国議会の残余権限を廃止しました。"
    british_cyprus.indy.t:0 "キプロスの独立？"
    british_cyprus.indy.d:0 "キプロスは1960年、EOKAが主導した武装闘争を経て独立を認められました。チューリッヒ・ロンドン協定に基づき1960年8月16日に正式な独立を達成した当時の総人口は573,566人で、うち442,138人（77.1％）がギリシャ系、104,320人（18.2％）がトルコ系、27,108人（4.7％）がその他でした。英国はアクロティリとデケリアの2つの主権基地領域を保持し、政府職と公職は民族別の割当で配分され、少数派のトルコ系キプロス人には恒久的な拒否権と議会・行政における30％の枠が与えられ、3つの母国には保障国としての権利が認められました。"
