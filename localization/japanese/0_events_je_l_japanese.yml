    UN_peacekeeping_join_war.t:0 "[SCOPE.sCountry('un_peacekeeping_applicant').GetName]を支援する国連平和維持活動"
    UN_peacekeeping_join_war.d:0 "国連安全保障理事会の承認の下、国連事務総長は[SCOPE.sCountry('un_peacekeeping_aggressor').GetName]に対する防衛戦争で[SCOPE.sCountry('un_peacekeeping_applicant').GetName]を支援するため平和維持部隊を編成しました。"
    UN_peacekeeping_join_war.f:0 "平和維持活動に参加すると[ROOT.GetCountry.GetName]は[SCOPE.sCountry('un_peacekeeping_aggressor').GetName]との[concept_diplomatic_play]において[SCOPE.sCountry('un_peacekeeping_applicant').GetName]の側で参戦します。"
