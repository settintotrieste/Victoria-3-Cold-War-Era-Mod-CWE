    H3N2_1968.t:0 "香港インフルエンザ"
    H3N2_1968.d:0 "香港インフルエンザは、1968年から1969年にかけて発生したインフルエンザのパンデミックであり、世界中で100万から400万人の死者を出しました。これは歴史上最も致命的なパンデミックの一つであり、A型インフルエンザウイルスのH3N2型によって引き起こされました。最初の記録的な発生は、1968年7月13日にイギリス領香港で確認されました。この発生は、香港に広がる前に中国本土で始まったのではないかと推測されています。"
    SARS_2003.t:0 "SARSのアウトブレイク"
    SARS_2003.d:0 "重症急性呼吸器症候群コロナウイルス（SARS-CoVまたはSARS-CoV-1）によって引き起こされた2002年から2004年にかけてのSARSのアウトブレイクは、30の国と地域で8,000人以上が感染し、世界中で少なくとも774人の死者を出しました。このアウトブレイクは、2002年11月に中国の広東省仏山市で初めて確認されました。世界保健機関（WHO）は2003年2月にこの発生の通知を受け、2003年3月に世界的な警告を発しました。アウトブレイクの主要な期間は約8ヶ月間に及び、世界保健機関は2003年7月5日にSARSの封じ込めを宣言しました。"
    H1N1_2009.t:0 "H1N1パンデミック"
    H1N1_2009.d:0 "H1N1ウイルスを原因とし、世界保健機関（WHO）により2009年6月から2010年8月にかけて宣言されたた2009年の豚インフルエンザパンデミックは、H1N1ウイルスが関与した近年のインフルエンザ・パンデミックとしては3例目となるものでした。ヒトへの感染が最初に確認されたのは、メキシコのベラクルス州にある田舎町、ラ・グロリアでした。このウイルスは、鳥、豚、ヒトのインフルエンザウイルスの間で以前に生じた3種のウイルス遺伝子の再集合によって形成されたH1N1ウイルスの新たな株に、さらにユーラシア豚インフルエンザウイルスが組み合わさって生じたものと見られています。"
    COVID_2019.t:0 "COVID-19パンデミック"
    COVID_2019.d:0 "COVID-19パンデミックは、重症急性呼吸器症候群コロナウイルス2 (SARS-CoV-2) によって引き起こされた、新型コロナウイルス感染症 (COVID-19) の世界的なパンデミックです。この新型ウイルスは、2019年12月に中国・湖北省の省都である武漢でのアウトブレイクにおいて最初に確認され、その後アジアの他地域、そして2020年初頭に世界中へと広がりました。世界保健機関 (WHO) は2020年1月30日にこのアウトブレイクを「国際的に懸念される公衆衛生上の緊急事態 (PHEIC)」と宣言し、2020年3月11日にアウトブレイクがパンデミックになったと判断しました。"
    
    historical_pandemics.option.1:0 "なんてことだ！"
    
    biological_weapons_fallout.t:0 "人為的パンデミック"
    biological_weapons_fallout.d:0 "[ROOT.GetCountry.GetName]に対して使用された生物兵器が、この国で流行を引き起こしました。この問題を解決するには、ワクチンを開発する必要があります。"
    biological_weapons_fallout.f:0 "このイベントは、[ROOT.GetCountry.GetName]が生物兵器の攻撃を受けたことにより発生しました。"
    
    biological_weapons_fallout.option:0 "なんてことだ！"
    
    end_conscription.t:0 "徴兵制を廃止しますか？"
    end_conscription.d:0 "[ROOT.GetCountry.GetName]において、数多くの有力政治家が徴兵制の廃止を求めています。彼らは、徴兵制は民主主義の原則と相容れず、もはや必要ないと主張しています。"
    
    nuclear_accident_1979.t:0 "スリーマイル島原子力発電所事故"
    nuclear_accident_1979.d:0 "スリーマイル島原子力発電所事故は、アメリカ合衆国ペンシルベニア州の州都であるハリスバーグ近郊、ロンドンデリー・タウンシップのサスケハナ川沿いにあるスリーマイル島原子力発電所の2号炉 (TMI-2) で発生したメルトダウンです。この事故は1979年3月28日午前4時に始まり、環境中に放射性ガスや放射性ヨウ素が放出されました。"
    nuclear_accident_1986.t:0 "チェルノブイリ原子力発電所事故"
    nuclear_accident_1986.d:0 "チェルノブイリ原子力発電所事故は、1986年4月26日、ソビエト連邦のウクライナ・ソビエト社会主義共和国北部、ベラルーシ・ソビエト社会主義共和国との国境にほど近いプリピャチ市近郊にあるチェルノブイリ原子力発電所4号炉の爆発によって発生しました。事故の後、プリピャチは放棄され、その代替として、計画都市スラブチッチが新たに建設されました。"
    nuclear_accident_2011.t:0 "福島第一原子力発電所事故"
    nuclear_accident_2011.d:0 "福島第一原子力発電所事故は、2011年3月11日に日本の福島県大熊町にある福島第一原子力発電所で発生した重大な原子力事故です。事故の直接的な原因は2011年の東日本大震災と津波であり、これにより電力網が遮断され、発電所内のほぼ全ての予備電源が損傷しました。その結果、原子炉停止後に十分な冷却を行うことができなくなり、 封じ込めの機能が損なわれ、放射性物質が周辺環境へと放出される事態に至りました。"
    
    historical_nuclear_accidents.option.1:0 "なんてことだ！"
    
