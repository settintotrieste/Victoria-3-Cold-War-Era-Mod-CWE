    state_church_veto.t:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('state_church_name')]が法案に反対"
    state_church_veto.d:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('state_church_name')]は[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]で現在制定中の法案に強い反対を表明しました。多くの宗教指導者が支持者に対しこの法案が立法の煉獄へ落とされるよう祈ることを呼びかけています。"
