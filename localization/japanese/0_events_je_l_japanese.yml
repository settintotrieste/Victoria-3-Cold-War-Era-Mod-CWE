    form_ibero_american_organisation_decision:0 "イベロアメリカ諸国機構を形成する"
    form_ibero_american_organisation_decision_desc:0 "イベロアメリカ諸国機構は、ヨーロッパと南北アメリカのイベリア語圏23カ国にアフリカの1カ国を加えて構成される国際機関です。OEIの加盟国はイベロアメリカとイベリア半島のすべての主権国家に赤道ギニアを加えたものです。加盟国はすべてポルトガル語かスペイン語を話す国であり、主にカタルーニャ語を話すアンドラもこれに加わっていますが、世界のイベリア語圏諸国のすべてが参加しているわけではありません。"
