    request_imf_loan.tt:0 "IMFの債権国に対し[ROOT.GetCountry.GetName]の[Concept('concept_credit','$concept_credit_debt$')]の#white 5％#!の引き受けか[concept_bankroll][ROOT.GetCountry.GetName]のいずれかを要請する"
    
