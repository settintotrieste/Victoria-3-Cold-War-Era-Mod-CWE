    ruler_veto.tt:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')][GetPlayer.GetRuler.GetFullName]が[concept_law][Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enactment$')]に#r 反対#!" 
