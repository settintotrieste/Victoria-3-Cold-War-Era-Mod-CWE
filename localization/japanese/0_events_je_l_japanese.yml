    form_commonwealth_decision:0 "イギリス連邦を結成する"
    form_commonwealth_decision_desc:0 "イギリス連邦はかつてイギリスの植民地であった国々による政治的連合であり、加盟国は「自由かつ対等」とみなされます。加盟国同士に法的な義務はありませんが、英語の使用と歴史的つながりによって結びついています。連邦加盟国の市民権は一部の加盟国、特にイギリスにおいて優遇をもたらします。イギリス連邦憲章は民主主義・人権・法の支配という共通の価値を定めており、4年ごとに開催されるコモンウェルスゲームズがこれを広めています。"
