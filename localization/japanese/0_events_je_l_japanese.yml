    je_political_investigations_system_reason:0 "検察当局が[SCOPE.sCharacter('investigated_character_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('investigated_character_scope').GetFullName]の活動について犯罪捜査を行っています。阻止されなければこの捜査は[SCOPE.sCharacter('investigated_character_scope').GetHerHim]の起訴を勧告する結果に終わるでしょう。\n\n[SCOPE.sCharacter('investigated_character_scope').GetFullName]が[Concept('concept_official_character','$head_of_state$')]である場合、[SCOPE.sCharacter('investigated_character_scope').GetSheHe]はまず#y 弾劾#!され、その後[SCOPE.sCharacter('investigated_character_scope').GetSheHe]は[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]で裁かれます。\n\n[SCOPE.sCharacter('investigated_character_scope').GetFullName]が[Concept('concept_official_character','$head_of_government$')]である場合、[SCOPE.sCharacter('investigated_character_scope').GetSheHe]はまず#y [SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]から解任#!され、その後[SCOPE.sCharacter('investigated_character_scope').GetSheHe]は[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]で裁かれることになります。"
