    je_space_race_system_reason:0 "宇宙開発とは、天文学と宇宙技術を用いて宇宙空間を探査することです。現在の宇宙探査は主に望遠鏡を用いる天文学者によって行われていますが、実地の探査は無人の探査機と有人宇宙飛行の双方によって進められています。\n\n現在の宇宙プロジェクト：[SCOPE.GetRootScope.GetCountry.GetCustom('space_project_custom_title')]"
