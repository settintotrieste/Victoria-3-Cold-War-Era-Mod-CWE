    wedding.3.t: "退位"
    wedding.3.d1: "[ROOT.GetCountry.GetName]における[SCOPE.gsInterestGroup('monarch_ig').GetName]に不利な政治情勢に憤慨し、[SCOPE.sCharacter('abdicating_monarch').GetPrimaryRoleTitle][SCOPE.sCharacter('abdicating_monarch').GetFirstName]は退位を決意しました。"
    wedding.3.d2: "[SCOPE.sCharacter('abdicating_monarch').GetHerHis]の[concept_popularity]の欠如が[SCOPE.sLawType('monarchy_law').GetName]という制度に益よりも害をもたらしかねないと悟り[SCOPE.sCharacter('abdicating_monarch').GetPrimaryRoleTitle][SCOPE.sCharacter('abdicating_monarch').GetFirstName]は退位を決意しました。"
    wedding.3.d3: "[SCOPE.sCharacter('abdicating_monarch').GetPrimaryRoleTitle][SCOPE.sCharacter('abdicating_monarch').GetFirstName]の衰弱により[SCOPE.sCharacter('abdicating_monarch').GetHerHim]は統治に堪えない状態となりました。まれに正気を取り戻した折に[SCOPE.sCharacter('abdicating_monarch').GetSheHe]は退位に同意しました。"
    wedding.3.d4: "息苦しい宮廷生活に疲れた[SCOPE.sCharacter('abdicating_monarch').GetPrimaryRoleTitle][SCOPE.sCharacter('abdicating_monarch').GetFirstName]はより自由な暮らしを楽しむために退位しました。しかし突然の退位の本当の理由については様々な噂が飛び交っています。"
    wedding.3.f: "「[SCOPE.sCharacter('abdicating_monarch').GetPrimaryRoleTitle]が狂ったらしいぞ。[SCOPE.sCharacter('abdicating_monarch').GetHerHis]の馬と結婚しようとしたとか何とか」\n\n「[SCOPE.GetRootScope.GetCountry.GetCustom('generic_newspaper_type')]でそんなくだらない記事を読んでいるのか？もっと高尚な問題だ。明らかに[SCOPE.gsInterestGroup('monarch_ig').GetNameNoFormatting]の情勢に関わることだよ」\n\n「そんな複雑な話じゃない。みんな[SCOPE.sCharacter('abdicating_monarch').GetPrimaryRoleTitle]を嫌っているから[SCOPE.sCharacter('abdicating_monarch').GetSheHe]は去るしかない。単純な民主主義さ」"
    wedding.3.a: "限られた名士のみで非公開の戴冠式を行う。"
    wedding.3.b: "盛大な公開戴冠式を行う。"
    wedding.3.c: "次の君主が誰になるか見届けよう。"
    
