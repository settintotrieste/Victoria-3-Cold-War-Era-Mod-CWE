    je_one_china_policy_ROC:0 "国際連合に加盟する"
    je_one_china_policy_ROC_reason:0 "国共内戦の遺産として、現在[SCOPE.sCountry('republic_of_china_un_seat').GetName]が国際連合で『中国』を代表しています。これは[SCOPE.sCountry('republic_of_china_un_seat').GetName]が国際的承認を得ている一方で[ROOT.GetCountry.GetName]は得ていないことを意味します。このような状況は[ROOT.GetCountry.GetAdjective]人にとって重大な不正義です。我々は国際連合における[SCOPE.sCountry('republic_of_china_un_seat').GetName]の議席を獲得せねばなりません。"
    
    je_kmt_becomes_taiwan_button:0 "台湾になる"
    je_kmt_becomes_taiwan_button_desc:0 "[ROOT.GetCountry.GetName]は、自らを台湾と改称し、中国本土に対するすべての請求権を放棄することで、「一つの中国」政策を終わらせることができます。"
