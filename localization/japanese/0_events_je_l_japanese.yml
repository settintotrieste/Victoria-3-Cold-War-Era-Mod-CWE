    je_cultural_suppression_system:0 "[ROOT.GetCountry.GetName]における文化的抑圧"
    je_cultural_suppression_system_reason:0 "[ROOT.GetCountry.GetAdjective]政府は非倫理的な手法を組み合わせて[ROOT.GetCountry.GetName]の被差別民を組織的に抑圧しています。\n\n毎月無作為に選ばれた被差別[concept_culture]および／または[concept_religion]のPOPグループの1％が迫害されます。これはすべての被差別POPが[ROOT.GetCountry.GetName]を去るか$law_slavery_cultural$法が廃止されるまで続きます。"
    je_cultural_suppression_system.tt:0 "国内に被差別POPが残っていません"
    
    cultural_suppression_discovered.t:0 "[SCOPE.sCountry('country_committing_cultural_suppression').GetName]における文化的抑圧"
    cultural_suppression_discovered.d:0 "国際監視団は[SCOPE.sCountry('country_committing_cultural_suppression').GetName]が被差別人口をすべて根絶する計画を進めていることを突き止めました。この暴露は国際社会に衝撃を与え、国連事務総長をはじめとする要人が[SCOPE.sCountry('country_committing_cultural_suppression').GetName]を強く非難しています。[ROOT.GetCountry.GetName]はこの人道に対する罪にどう対応すべきでしょうか？"
    cultural_suppression_discovered.f:0 "[SCOPE.sCountry('country_committing_cultural_suppression').GetName]に対する国際的非難の強さは文化的抑圧を非難することを選んだ国の数によって決まります。"
    cultural_suppression_system_option.1:0 "[SCOPE.sCountry('country_committing_cultural_suppression').GetName]の蛮行を非難する！"
    cultural_suppression_system_option.2:0 "何も言わない"
    
    cultural_suppression_discovered_notice.t:0 "[ROOT.GetCountry.GetName]の文化的抑圧計画が発覚"
    cultural_suppression_discovered_notice.d:0 "国際監視団は[ROOT.GetCountry.GetName]が被差別人口をすべて根絶する計画を進めていることを突き止めました。この暴露は国際社会に衝撃を与え、国連事務総長をはじめとする要人が[SCOPE.sCountry('country_committing_cultural_suppression').GetName]を強く非難しています。"
    cultural_suppression_discovered_notice.f:0 "[ROOT.GetCountry.GetName]は文化的抑圧を理由に非難した国1つにつき悪名を1得ます。またこのような人道に対する罪を犯したとして国連から制裁を受ける可能性もあります。"
    cultural_suppression_system_notice_option:0 "やむを得まい……"
    
    je_espionage_system:0 "敵対的諜報活動の実行"
    je_espionage_system_reason:0 "[ROOT.GetCountry.GetAdjective]の情報機関は国外の敵に対する敵対的隠密活動を行うため海外に工作員を派遣しました。\n\n進捗バーが満たされると[ROOT.GetCountry.GetName]は対象となる国からランダムに1か国を攻撃する機会を得ます。\n\n[ROOT.GetCountry.GetName]が敵対的諜報活動を行う国が多いほど進捗バーが満たされるまでの時間は長くなります。"
    je_espionage_system_1_tt:0 "この国はいかなる国に対しても敵対的諜報活動を行っていません"
    je_espionage_system_2_tt:0 "この国は少なくとも1か国に対して敵対的諜報活動を行っています"
    
