    cuban_missile_crisis.t:0 "キューバ危機"
    cuban_missile_crisis.d:0 "キューバ危機は1962年10月16日から28日まで13日間にわたって続いたアメリカ合衆国とソビエト連邦の対立です。アメリカがイタリアとトルコに核ミサイルを配備したのに対抗してソ連がキューバに核ミサイルを配備したことで発生しました。この対立は冷戦が全面核戦争へ最も近づいた瞬間であったと広く考えられています。"
    cuban_missile_crisis_1.option.1:0 "キューバに禁輸を課す！"
    cuban_missile_crisis_1.option.2:0 "これで構わない…"
    cuban_missile_crisis_2.option.1:0 "キューバから撤退しつつアメリカにも核の撤去を要求する"
    cuban_missile_crisis_2.option.2:0 "妥協は拒否する！"
    cuban_missile_crisis_USA_END.t:0 "ソ連の対案"
    cuban_missile_crisis_USA_END.d:0 "ソビエト連邦はソ連がキューバから核兵器を撤去する代わりにアメリカ合衆国がソ連と国境を接する国々から核兵器を撤去することを提案しています。"
    cuban_missile_crisis_3.option.1:0 "取引に応じる"
    cuban_missile_crisis_3.option.2:0 "取引を拒否する"
    cuban_missile_crisis_SOV_END.t:0 "米ソ核緊張緩和条約"
    cuban_missile_crisis_SOV_END.d:0 "すべての攻撃用ミサイルとイリューシンIl-28軽爆撃機がキューバから撤収されるとアメリカによる海上封鎖は11月20日に正式に解除されました。イタリアとトルコからのアメリカのミサイル撤去はケネディとフルシチョフの間の秘密協定であったため、この妥協はフルシチョフとソ連にとって屈辱的なものとなりました。ソ連は自ら引き起こした事態から退却したと見なされたのです。"
