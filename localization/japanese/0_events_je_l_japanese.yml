    leave_GATT_decision: "関税及び貿易に関する一般協定から脱退する"
    leave_GATT_decision_desc: "関税及び貿易に関する一般協定（GATT）は多数の国家間で結ばれた法的協定であり、関税や輸入割当などの貿易障壁を削減・撤廃して国際貿易を促進することを全体的な目的としていました。1947年から1995年にかけて全9回のラウンドからなる一連の世界的な貿易交渉を通じて改定されてきました。国際貿易におけるその役割は1995年に世界貿易機関（WTO）へとおおむね引き継がれました。"
    
