    french_community.sgc.t:0 "フランス共同体"
    french_community.sgc.d:0 "フランス共同体は、脱植民地化が進む1958年10月にフランスと残存するアフリカ植民地との間で設けられた憲法上の組織です。1946年に植民地帝国を再編したフランス連合に取って代わるものでした。共同体は1995年にフランス議会が正式に廃止するまで形式上は存続しましたが、1960年末までにアフリカの加盟国がすべて独立を宣言して離脱したため、実質的には消滅し機能を停止していました。"
