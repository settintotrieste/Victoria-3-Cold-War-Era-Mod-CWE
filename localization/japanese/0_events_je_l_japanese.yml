    peaceful_revolution_generic.t:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]革命"
    peaceful_revolution_generic.d:0 "本日[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')] [ROOT.GetCountry.GetRuler.GetFullName]が無血革命によって失脚しました。怒れる抗議者の群衆が警備の手薄な大統領官邸に押し入り[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]を冷酷に処刑したのです。これを受けて内閣は総辞職し新政府の樹立は反乱者たちに委ねられました。"
    peaceful_revolution_generic.f:0 "革命的な[concept_political_movement]によってすべての[ROOT.GetCountry.GetAdjective][concept_state]が反乱を起こすところだったため、このイベントが発生しました。"
    peaceful_revolution_generic.option:0 "恐ろしい！"
    
    brezhnev_doctrine.t:0 "[SCOPE.sCountry('brezhnev_doctrine_target').GetName]で革命"
    brezhnev_doctrine.d:0 "民衆革命により[SCOPE.sCountry('brezhnev_doctrine_target').GetName]の我らが傀儡共産主義政権が打倒されました。指導部は離反した同国の秩序を回復するため[ROOT.GetCountry.GetAdjective]軍の出動を求めています。"
    brezhnev_doctrine.f:0 "[ROOT.GetCountry.GetName]の[concept_subject]が共産主義政府を打倒し[ROOT.GetCountry.GetAdjective]の支配からの離脱を宣言したため、このイベントが発生しました。"
    
    revolution_crushed_recently:0 "内戦の遺産"
    je_civil_war_system:0 "[ROOT.GetCountry.GetAdjectiveNoFlag][concept_civil_war]"
    je_civil_war_system_reason:0 "[ROOT.GetCountry.GetName]で[concept_civil_war]が勃発しました。[concept_government]は反乱軍との$stop_endless_revolutions$[concept_diplomatic_action]を成立させるか[concept_civil_war]軍事的に戦争に勝利しなければなりません。"
    
    European_Economic_Community.t:0 "ローマ条約？"
    European_Economic_Community.d:0 "ローマ条約により欧州経済共同体（EEC）が創設されました。この条約は1957年3月25日にベルギー、フランス、イタリア、ルクセンブルク、オランダ、西ドイツによって調印され、1958年1月1日に発効しました。条約は関税の段階的な引き下げと関税同盟の設立を掲げ、加盟国間で財・労働・サービス・資本の単一市場を創設することを提案しました。また共通農業政策、共通運輸政策、欧州社会基金の創設も提案し、欧州委員会を設置しました。"
    European_Single_Market.t:0 "マーストリヒト条約？"
    European_Single_Market.d:0 "欧州連合条約は一般にマーストリヒト条約として知られ、欧州連合（EU）の基本条約です。1992年に当時の欧州諸共同体の加盟12か国の間で締結され、欧州統合の過程における新たな段階を告げるものでした。主な内容は欧州市民権の共有、将来的な単一通貨の導入、そして（より曖昧ながら）共通外交・安全保障政策に関する規定です。"
    European_Single_Currency.t:0 "ユーロを導入するか？"
    European_Single_Currency.d:0 "ユーロは1999年1月1日に誕生しましたが、その実現は1960年代から欧州連合（EU）とその前身組織の目標でした。厳しい交渉の末、1993年にマーストリヒト条約が発効し、英国とデンマークを除くすべてのEU加盟国を対象に1999年までに経済通貨同盟（EMU）を創設することが目標とされました（ただしデンマークはユーロとの固定相場制を採っています）。"
    European_Political_Union.t:0 "リスボン条約？"
    European_Political_Union.d:0 "リスボン条約には、閣僚理事会の少なくとも45の政策分野で全会一致から特定多数決への移行、その多数の算定方法の新たな二重多数決への変更、通常立法手続きにおいて閣僚理事会とともに二院制の立法府を構成する欧州議会の権限強化、EUへの単一の法人格の付与、そして任期の長い欧州理事会議長と外務・安全保障政策上級代表の創設が盛り込まれました。また条約は、EUの権利章典である基本権憲章に法的拘束力を与えました。さらに条約は初めて加盟国にEUから離脱する明示的な法的権利を認め、そのための手続きを定めました。"
    
    NAFTA.t:0 "北米自由貿易協定？"
    NAFTA.d:0 "北米自由貿易協定は、カナダ、メキシコ、アメリカ合衆国が署名した協定で、北米に三国間の貿易圏を創設しました。協定は1994年1月1日に発効し、1988年に米国とカナダの間で結ばれた米加自由貿易協定に取って代わりました。NAFTA貿易圏は国内総生産で世界最大級の貿易圏の一つとなりました。"
    
    ASEAN_Economic_Community.t:0 "北米自由貿易協定？"
    ASEAN_Economic_Community.d:0 "ASEANは物品・サービス・熟練労働者・資本の自由な移動を確保することを目標に、2015年末までに4つの自由に基づく単一市場を確立する計画を立てていました。ASEAN経済共同体は2015年に発足しましたが、共同市場の創設に必要な調和規定の約20％は先送りされ、新たな期限として2025年が設定されました。"
    
    Trans_Pacific_Partnership.t:0 "環太平洋パートナーシップ協定？"
    Trans_Pacific_Partnership.d:0 "環太平洋パートナーシップ協定（TPP）はオーストラリア・ブルネイ・カナダ・チリ・日本・マレーシア・メキシコ・ニュージーランド・ペルー・シンガポール・ベトナム・アメリカ合衆国の環太平洋12経済圏の間で提案された貿易協定です。アメリカでは2016年2月4日に署名されたものの、二大政党の大統領候補であったドナルド・トランプとヒラリー・クリントンを含む多くの民主党員と共和党員の反対により批准されませんでした。新たに選出されたドナルド・トランプ大統領は就任後の2017年1月にアメリカのTPPからの離脱を正式に表明し、そのためTPPは必要な批准を得られず発効に至りませんでした。"
    
    RCEP.t:0 "地域的な包括的経済連携協定？"
    RCEP.d:0 "地域的な包括的経済連携協定はオーストラリア・ブルネイ・カンボジア・中国・インドネシア・日本・韓国・ラオス・マレーシア・ミャンマー・ニュージーランド・フィリピン・シンガポール・タイ・ベトナムのアジア太平洋諸国による自由貿易協定です。発効から20年以内に署名国間の輸入関税の約90％を撤廃し、電子商取引・貿易・知的財産に関する共通ルールを定めることが見込まれています。"
    
    five_year_plan_system.t:0 "五カ年計画"
    five_year_plan_system.d:0 "五カ年計画は[concept_government]が発表する一連の社会・経済発展計画です。計画は社会主義経済の重要な特徴であり、全国を対象に策定される計画には通常すべての地域に向けた詳細な経済発展の指針が含まれます。"
