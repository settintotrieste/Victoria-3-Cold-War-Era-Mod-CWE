    palace_coup.t:0 "[ROOT.GetCountry.GetNameNoFlag]で宮廷クーデター？"
    palace_coup.d:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('paramilitary_group_custom_title')]が[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')] [SCOPE.sCharacter('palace_coup_ruler').GetFullName]に対して宮廷クーデターを起こしました。彼らの目的は[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]をより急進的な人物にすげ替えることです。[ROOT.GetCountry.GetAdjectiveNoFlag] $ig_armed_forces$は反乱者を撃退し秩序を回復する用意がありますが、首都は多大な犠牲を払うことになるでしょう。いかがなさいますか？"
    palace_coup.f:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('paramilitary_group_custom_title')]の忠実性が0％まで低下したため、このイベントが発生しました。"
    
    palace_coup_accept_option:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('paramilitary_group_custom_title')]に屈する"
    palace_coup_reject_option:0 "軍が反乱者どもを粉砕する！"
    
    paramilitary_group_veto.t:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('paramilitary_group_custom_title')]が[SCOPE.sLaw('current_law_scope').GetName]に反対！"
    paramilitary_group_veto.d:0 "[SCOPE.gsInterestGroup('paramilitary_group_ig').GetName][concept_interest_group]の側につき強大な政治力を持つ[SCOPE.GetRootScope.GetCountry.GetCustom('paramilitary_group_custom_title')]は[SCOPE.sLaw('current_law_scope').GetName]を施行しようとする[concept_government]を強く非難しました。彼らはこの[concept_law]が[ROOT.GetCountry.GetName]の最善の利益にならないと考えており[SCOPE.sLaw('current_law_scope').GetName]を施行する法案の撤回を要求しています。応じなければ政府に対して独断で行動を起こすかもしれません。"
    paramilitary_group_veto.f:0 "このイベントは[SCOPE.GetRootScope.GetCountry.GetCustom('paramilitary_group_custom_title')]の司令官である[SCOPE.sCharacter('head_of_paramilitary').GetFullName]（[SCOPE.gsInterestGroup('paramilitary_group_ig').GetName]）が現在施行中の[concept_law]に#r 反対#!または#r 強く反対#!しているため発生しました。[SCOPE.GetRootScope.GetCountry.GetCustom('paramilitary_group_custom_title')]を無効にする法律が施行されようとしている場合にも発生します。"
    
    paramilitary_group_system_accept_option:0 "[SCOPE.sLaw('current_law_scope').GetName]の施行を中止する"
    paramilitary_group_system_reject_option:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('paramilitary_group_custom_title')]の脅しをはねつける"
    
