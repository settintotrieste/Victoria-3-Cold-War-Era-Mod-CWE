    je_judiciary:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]"
    je_judiciary_reason:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]は[ROOT.GetCountry.GetName]の司法における最高裁判所です。憲法または制定法の争点を含むあらゆる訴訟について終審の上訴管轄権を持ち、裁判官の自律性の程度によっては単独で法を改正することもあります。$judge_appointment_process$ \n\n注：[concept_progressive_judiciary]の裁判官は$HUMAN_RIGHTS$と$POWER_STRUCTURE$の分野でより民主的な[Concept('concept_law','$concept_laws$')]を支持します。"
