    appoint_prime_minister.f: "このイベントは[concept_government]に[concept_interest_group]が2つ以上存在するために発生しました。[concept_government]で最大の[concept_interest_group]ではない[concept_interest_group]から政治家を選ぶと[SCOPE.gsInterestGroup('most_powerful_gov_ig').GetName]の怒りを買います。"
