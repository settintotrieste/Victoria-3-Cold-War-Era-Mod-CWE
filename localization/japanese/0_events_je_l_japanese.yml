    espionage_instigate_secessionist_movement.t:0 "[SCOPE.sCountry('espionage_target').GetName]で分離主義運動を扇動する機会"
    espionage_instigate_secessionist_movement.d:0 "[SCOPE.sCountry('espionage_target').GetName]で活動する[SCOPE.sCountry('espionage_attacker').GetAdjective]の工作員が[SCOPE.sCountry('espionage_target').GetAdjective]政府に対する民族主義的感情を煽る機会を見つけました。彼らは[SCOPE.sCountry('espionage_target').GetAdjective]の未編入州に暮らす人々の間に反帝国主義のプロパガンダを広めることを提案しています。この秘密工作により12か月にわたって[SCOPE.sCountry('espionage_target').GetName]に属する未編入州の急進派が増加するはずです。"
