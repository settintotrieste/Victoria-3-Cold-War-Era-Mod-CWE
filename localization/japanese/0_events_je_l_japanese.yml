    coup.2.d: "[SCOPE.gsInterestGroup('coup_ig').GetName]は[ROOT.GetCountry.GetAdjective]の民主主義に対するクーデターを成功させました。[SCOPE.sCharacter('coup_leader').GetFullName]は国家非常事態を宣言し、[SCOPE.sCharacter('coup_leader').GetHerHim]が独裁体制のもとで国を率いることを可能にしました。"
    
    je_national_religious_order: "国教"
    je_national_religious_order_reason: "[ROOT.GetCountry.GetName]の憲法のもと、[concept_government]は特定の[concept_religion]を国の公式な国教として定めています。この国教は[ROOT.GetCountry.GetName]の最高聖職者である[ROOT.GetCountry.GetNameNoFormatting]の[SCOPE.GetRootScope.GetCountry.GetCustom('religious_leader_title_custom_title')]によって管理・指導されています。\n\n[concept_government]は財政援助やその他の特権によって国教を支援しており、これにより[concept_government]は教義・秩序・礼拝に関する事項を含め、国教の統治機関の運営に大きな影響力を持っています。また[concept_government]は現在の[ROOT.GetCountry.GetNameNoFormatting]の[SCOPE.GetRootScope.GetCountry.GetCustom('religious_leader_title_custom_title')]を解任することもできます。\n\n注：宗教的急進主義が高いほど[ROOT.GetCountry.GetName]で$ideology_agitator_anti_human_rights$、$ideology_agitator_nationalist$、$ideology_agitator_pro_war_rights$、$ideology_agitator_theocrat$の[SCOPE.GetRootScope.GetCountry.GetCustom('religious_leader_title_custom_title')]が出現する可能性が高まります。\n\n注：宗教的急進主義は[GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant]の[concept_interest_group]の[concept_approval]がマイナスのときに上昇し、[concept_approval]がプラスのときに低下します。"
