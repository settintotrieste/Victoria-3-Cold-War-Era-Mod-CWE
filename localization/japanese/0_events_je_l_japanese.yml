    trade_union_veto.d:0 "有力な労働組合が[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]で現在制定中の法案に強い反対を表明しました。多くの労働運動指導者が支持者に対し政治家へ圧力をかけて法案を叩き潰すよう呼びかけています。"
    trade_union_veto.f:0 "このイベントは[SCOPE.gsInterestGroup('trade_union_ig').GetName]が現在制定中の法律に反対または強く反対しているために発生しました。"
    
    big_business_veto.t:0 "大企業が法案に反対"
    big_business_veto.d:0 "有力な産業界の大物たちが[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]で現在制定中の法案に強い反対を表明しました。多くのCEOがロビイストに対し法案の議会通過を妨害するよう求めています。"
    big_business_veto.f:0 "このイベントは[SCOPE.gsInterestGroup('industrialist_ig').GetName]が現在制定中の法律に反対または強く反対しているために発生しました。"
    
