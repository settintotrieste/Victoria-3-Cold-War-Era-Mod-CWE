    je_olympic_stadium_button:0 "オリンピックスタジアムを建設"
    je_olympic_stadium_button_desc:0 "オリンピックスタジアムとは通常オリンピックのメインスタジアムを指す名称です。開会式と閉会式の会場となります。"
    je_olympic_sports_centre_button:0 "オリンピックスポーツセンターを建設"
    je_olympic_sports_centre_button_desc:0 "オリンピックスポーツセンターは水泳競技やその他の屋内競技が行われる施設です。"
    je_olympic_village_button:0 "オリンピック選手村を建設"
    je_olympic_village_button_desc:0 "オリンピック選手村はすべての選手団を収容するために開催都市またはその近郊に建設、あるいは転用される居住施設群です。"
    je_olympic_media_centre_button:0 "オリンピックメディアセンターを建設"
    je_olympic_media_centre_button_desc:0 "メディアセンターはオリンピック期間中に世界各地から訪れる数千人の記者やメディア技術者を迎え入れます。"
    
