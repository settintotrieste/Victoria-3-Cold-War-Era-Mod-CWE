    concept_OPEC_oil_embargoing:1 "禁輸"
    concept_OPEC_oil_embargo_desc:6 "[concept_OPEC_oil_embargo]とは、OPECとそのメンバーが特定の国へ石油を輸出しないことで共同歩調をとる状態です。ただしOPECメンバーの中には、禁輸対象国と良好な関係にある場合に禁輸へ参加しないことを選ぶ国もあります。注：V3エンジンは現時点で特定の財に限った禁輸に対応していないため、この外交行動では全面禁輸が発動されます。"
    
    DIPLO_ACTION_CREATE_OPEC_EMBARGO:0 "[SCOPE.sCountry('OPEC_embargo_target').GetName]に対する[concept_OPEC_oil_embargo]に参加する"
    OPEC_embargo_invitation.t:0 "[SCOPE.sCountry('OPEC_embargo_target').GetName]へのOPEC石油禁輸？"
    OPEC_embargo_invitation.d:0 "OPECの盟主である[SCOPE.sCountry('OPEC_leader').GetName]は、すべてのOPECメンバーに[SCOPE.sCountry('OPEC_embargo_target').GetName]への石油輸出を停止するよう求める決議を可決しました。[ROOT.GetCountry.GetName]もOPECのメンバーであるため、この禁輸に参加するか否かを選択できます。"
    OPEC_embargo_invitation.f:0 "[SCOPE.sCountry('OPEC_leader').GetName]は[SCOPE.sCountry('OPEC_embargo_target').GetName]への石油禁輸を開始しました。両国は敵対関係にあり、さらに[SCOPE.sCountry('OPEC_leader').GetName]は他のすべてのOPECメンバーと$relations_amicable$の関係にあったため、OPECにこうした要請を行う自信を得たのです。注：V3エンジンは現時点で特定の財に限った禁輸に対応していないため、この外交行動では全面禁輸が発動されます。"
    OPEC_accept_embargo:0 "石油禁輸に参加する！"
    OPEC_reject_embargo:0 "貴重な石油を誰からも奪うつもりはない。"
    
    special_administrative_region_system.1.t:0 "[SCOPE.sCountry('SAR_country').GetName]特別行政区"
    special_administrative_region_system.1.d:0 "[ROOT.GetCountry.GetName]は[SCOPE.sCountry('SAR_country').GetName]に新たな特別行政区を設置すると発表しました。これにより[SCOPE.sCountry('SAR_country').GetName]の人々は[ROOT.GetCountry.GetAdjective]への従属を続ける見返りとして、内政においてより大きな自治を得ます。国際社会はこの報せを大きな喝采をもって迎えました。"
    special_administrative_region_system.1.f:0 "[SCOPE.sCountry('SAR_country').GetName]特別行政区となったのは、従属国の首都が[ROOT.GetCountry.GetName]の故地であったためです。この取り決めにより[SCOPE.sCountry('SAR_country').GetName]は国際法上[ROOT.GetCountry.GetName]に正当に帰属するものと見なされ、この領域が非植民地化システムを通じて独立を求めることはできなくなります。"
    special_administrative_region_system_option:0 "素晴らしい！"
    DIPLO_ACTION_CREATE_SAR_SUBJECT_TYPE:0 "[SCOPE.sCountry('SAR_country').GetName]特別行政区を創設する"
    
    dominion_clean_up_system.1.t:0 "[SCOPE.sCountry('dominion_to_satellite_country').GetAdjective]衛星国"
    dominion_clean_up_system.1.d:0 "[ROOT.GetCountry.GetName]が[SCOPE.sCountry('dominion_to_satellite_country').GetName]に及ぼす支配の度合いから、後者が前者の$subject_type_satellite$となったことはますます明白になっています。"
    dominion_clean_up_system.1.f:0 "[SCOPE.sCountry('dominion_to_satellite_country').GetName]は$subject_type_dominion$から$subject_type_satellite$へと転換されました。$subject_type_dominion$を持てるのは君主制国家のみであり、[ROOT.GetCountry.GetName]は君主制ではないためです。"
    dominion_clean_up_system_option:0 "了解"
    DIPLO_ACTION_CREATE_SATELLITE_SUBJECT_TYPE:0 "[SCOPE.sCountry('dominion_to_satellite_country').GetName]が$subject_type_satellite$になる"
    
    restore_correct_capital_system.t:0 "[ROOT.GetCountry.GetName]の新たな首都？"
    restore_correct_capital_system.d:0 "[ROOT.GetCountry.GetName]の現在の首都である[SCOPE.sState('wrong_capital').GetName]は、歴史家からも国民からも我が国の正しい首都とは見なされていません。そこで正しい州を首都に定めるための動議が議会に提出されました。"
    restore_correct_capital_system.f:0 "このイベントは[ROOT.GetCountry.GetName]の首都が史実と異なるために発生しました。"
    restore_correct_capital_system_option.1:0 "首都を移そう！"
    restore_correct_capital_system_option.2:0 "[SCOPE.sState('wrong_capital').GetName]のほうが首都にふさわしい。"
    
    impeached_politician:0 "議会に弾劾された"
    survived_impeachment:0 "弾劾を免れた"
    je_impeachment_system:0 "[SCOPE.sCharacter('impeached_president_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('impeached_president_scope').GetFullName]の弾劾"
    je_impeachment_system_reason:0 "[ROOT.GetCountry.GetName]の憲法の下、[SCOPE.sCharacter('impeached_president_scope').GetPrimaryRoleTitle]は反逆罪・収賄罪その他の重罪および軽罪について弾劾訴追され有罪とされた場合、その職を解かれます。\n\n[SCOPE.sCharacter('impeached_president_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('impeached_president_scope').GetFullName]が弾劾に値する罪を犯したため、[SCOPE.sCharacter('impeached_president_scope').GetHerHim]を罷免するための弾劾条項が[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]で可決されました。ただし憲法は[SCOPE.sCharacter('impeached_president_scope').GetPrimaryRoleTitle]を有罪とし罷免するには上院の3分の2の賛成を要すると定めています。\n\nタイマーが尽きた時点で[concept_legitimacy]が#r 33%#!を超えていない場合、または[concept_government]が#y 単純過半数#!を得ていない場合、[SCOPE.sCharacter('impeached_president_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('impeached_president_scope').GetFullName]は弾劾され罷免されます。\n\n弾劾された場合、[SCOPE.sCharacter('impeached_president_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('impeached_president_scope').GetFullName]は[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]で裁判にかけられます。"
    je_impeachment_system_1.tt:0 "[SCOPE.sCharacter('impeached_president_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('impeached_president_scope').GetFullName]は弾劾され罷免されます"
    je_impeachment_system_2.tt:0 "[SCOPE.sCharacter('impeached_president_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('impeached_president_scope').GetFullName]は弾劾されず罷免されません"
    je_impeachment_system_3.tt:0 "[SCOPE.sCharacter('impeached_president_scope').GetFullName]は腐敗しているか、反逆者であるか、不法に権力を掌握しています。"
    je_impeachment_system_4.tt:0 "[SCOPE.sCharacter('impeached_president_scope').GetFullName]は最近弾劾されていません。"
    je_impeachment_system_5.tt:0 "[SCOPE.sCharacter('impeached_president_scope').GetFullName]はもはや大統領ではありません"
    
