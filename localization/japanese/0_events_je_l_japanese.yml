    moderate_nuclear_accident:0 "中規模の原子力事故"
    mild_nuclear_accident:0 "軽度の原子力事故"
    anti_nuclear_energy_modifier:0 "反原発運動"
    
    1995_JAP_earthquake.t:0 "阪神・淡路大震災"
    1995_JAP_earthquake.d:0 "阪神・淡路大震災は1995年1月17日、阪神地域を含む日本の兵庫県南部で発生しました。モーメントマグニチュードは6.9、気象庁震度階級で最大震度7（改正メルカリ震度階級でXI～XII）を記録し、揺れは約20秒間続きました。震源は震央の地下17kmで、震央は神戸市の中心部から20km離れた淡路島北端にありました。この地震による死者は約6,434人にのぼり、そのうち約4,600人が神戸市の住民でした。"
    2004_IDO_earthquake.t:0 "スマトラ島沖地震"
    2004_IDO_earthquake.d:0 "2004年12月26日、インドネシア・スマトラ島北部の西方沖を震源とするマグニチュード（Mw）9.2～9.3の巨大地震が発生しました。この海底の巨大衝上断層地震はビルマプレートとインドプレートの境界にある断層の破壊によって引き起こされ、一部の地域ではメルカリ震度階級で最大IXに達しました。ボクシング・デーの祝日にちなんで「ボクシング・デー津波」あるいは「アジア津波」と呼ばれる最大30m（100フィート）の巨大津波がインド洋沿岸の各地を襲い、14か国で推定227,898人が死亡しました。これは記録に残る史上最悪の自然災害の一つです。"
    2011_JAP_earthquake.t:0 "東日本大震災"
    2011_JAP_earthquake.d:0 "2011年3月11日、東北地方の牡鹿半島の東72km（45マイル）の太平洋でMw9.0～9.1の海底の巨大衝上断層地震が発生しました。揺れは約6分間続き、津波を引き起こしました。これは日本で観測された史上最大の地震であり、1900年に近代的な地震観測が始まって以来、世界で4番目の規模の地震でした。"
    1975_PRC_flood.t:0 "板橋ダム決壊"
    1975_PRC_flood.d:0 "1975年8月、台風ニーナの上陸に伴い中国河南省の板橋ダムをはじめ61基のダムが決壊しました。この決壊は史上3番目に死者の多い洪水を引き起こし、約30の市と県を含む12,000km²（300万エーカー）の地域で総人口1,015万人が被災しました。死者数の推計は26,000人から240,000人までと幅があります。洪水により500万～680万戸の家屋も倒壊しました。このダム決壊は文化大革命のさなかに起こりました。"
    1970_BNG_cyclone.t:0 "ボーラ・サイクロン"
    1970_BNG_cyclone.d:0 "1970年のボーラ・サイクロンは1970年11月12日に東パキスタン（現在のバングラデシュ）とインドの西ベンガル州を襲った壊滅的な熱帯低気圧です。記録上最悪の死者を出した熱帯低気圧であり、世界でも最悪級の人道的災害の一つとされています。少なくとも30万人、多ければ50万人がこの嵐で命を落としました。その主な原因はガンジス・デルタの低地の島々の大部分を水没させた高潮でした。"
    1991_BNG_cyclone.t:0 "バングラデシュ・サイクロン"
    1991_BNG_cyclone.d:0 "1991年のバングラデシュ・サイクロンは記録上最も多くの死者を出した熱帯低気圧の一つです。この海域で観測された中でも屈指の勢力を持つこの熱帯低気圧は6.1メートル（20フィート）の高潮を引き起こして沿岸部を浸水させ、少なくとも138,866人の死者と約17億米ドル（1991年時点）の被害をもたらしました。この壊滅的な被害を受けてアメリカ合衆国などはシー・エンジェル作戦を実施しました。これは史上最大級の軍事救援活動の一つです。"
    2008_BUR_cyclone.t:0 "サイクロン・ナルギス"
    2008_BUR_cyclone.d:0 "特に非常に激しいサイクロン・ストーム「ナルギス」は2008年5月上旬にミャンマーの記録史上最悪の自然災害を引き起こした、極めて破壊的で多くの死者を出した熱帯低気圧です。サイクロンは2008年5月2日金曜日にミャンマーへ上陸し、高潮は人口密集地のエーヤワディー・デルタを40キロメートルにわたって遡上しました。これにより壊滅的な被害が生じ、少なくとも138,373人が死亡しました。"
    2010_HAI_earthquake.t:0 "ハイチ大地震"
    2010_HAI_earthquake.d:0 "2010年のハイチ地震は2010年1月12日火曜日の現地時間16時53分（UTC21時53分）にハイチを襲った、マグニチュード7.0（Mw）の壊滅的な地震です。震源はハイチの首都ポルトープランスの西約25キロメートル（16マイル）、ウエスト県のレオガンの町の近くでした。被災者は推定300万人に上ります。死者数の推計は10万人から約16万人とするものから、ハイチ政府発表の22万人から31万6千人とするものまで幅があります。"
    1992_GBR_monument_damaged.t:0 "ウィンザー城火災"
    1992_GBR_monument_damaged.d:0 "1992年11月20日、世界最大の居住城郭であり英国君主の公邸の一つでもあるウィンザー城で火災が発生しました。城は甚大な被害を受け、その後5年をかけて3650万ポンドの費用で完全に修復されました。修復事業は保存建築事務所ドナルド・インソール・アソシエイツが主導しました。この火災を機にエリザベス2世女王は自身の収入に納税するようになり、また修復費用を賄うため女王のもう一つの公邸であるバッキンガム宮殿が一般公開されることとなりました。"
    2019_FRA_monument_damaged.t:0 "ノートルダム大聖堂火災"
    2019_FRA_monument_damaged.d:0 "2019年4月15日、中央ヨーロッパ夏時間の18時20分直前、フランスのパリにある中世のカトリック大聖堂ノートルダム・ド・パリの屋根裏で構造火災が発生しました。鎮火までに大聖堂の木造の尖塔（フレッシュ）は崩落し、木造屋根の大部分が焼失したうえ上部の壁も深刻な損傷を受けました。石造りのヴォールト天井が崩れ落ちる燃えた屋根をおおむね食い止めたため、内部の大規模な損壊は免れました。多くの美術品や聖遺物が安全な場所へ移されましたが、煙による被害を受けたものもあり、外部の美術品の一部は損傷または破壊されました。"
    1999_VNZ_mudslide.t:0 "バルガスの悲劇"
    1999_VNZ_mudslide.d:0 "バルガスの悲劇は1999年12月15日（10日間にわたって）ベネズエラのバルガス州で発生した自然災害です。豪雨による鉄砲水と土石流で数万人が死亡し、数千戸の家屋が破壊され、州のインフラは完全に崩壊しました。救援隊員によるとロス・コラレス地区は3メートル（9.8フィート）の泥に埋もれ、多くの家屋がそのまま海へ押し流されました。セロ・グランデやカルメン・デ・ウリアといった町はまるごと消滅しました。この災害でバルガスの人口の最大10％が死亡しました。"
    2019_JAP_monument_damaged.t:0 "首里城火災"
    2019_JAP_monument_damaged.d:0 "首里城は、日本の沖縄県首里にある琉球のグスク（城）です。1429年から1879年まで、琉球王国の宮殿として使用されていましたが、その後は長らく放置されていました。そして、1945年の沖縄戦においてほぼ完全に破壊されました。2019年10月31日の朝、城の正殿を含む構造物が再び火災によって消失しました。"
    1991_PHI_eruption.t:0 "ピナトゥボ山の噴火"
    1991_PHI_eruption.d:0 "1991年にフィリピンのルソン火山弧で起きたピナトゥボ山の噴火は20世紀で2番目に大きな火山噴火であり、これを上回るのは1912年のアラスカ・ノヴァルプタ山の噴火のみです。ピナトゥボ山から30km（19マイル）以内の橋はほぼすべてが破壊されました。低地の町のいくつかは浸水したり一部が泥に埋もれたりしました。水を含んで重くなった火山灰で屋根が崩落して840人以上が死亡し、ほかにも数名が負傷しました。"
    2022_TON_eruption.t:0 "フンガ・トンガ＝フンガ・ハアパイの噴火"
    2022_TON_eruption.d:0 "2021年12月、南太平洋のトンガ諸島にある海底火山フンガ・トンガ＝フンガ・ハアパイで噴火が始まりました。噴火はそのほぼ4週間後の2022年1月15日に極めて大規模かつ強力な最盛期を迎えました。フンガ・トンガ＝フンガ・ハアパイは同国の主島トンガタプ島の北65キロメートル（40マイル）に位置し、ニュージーランドからフィジーまで延びる沈み込み帯である、活動の非常に活発なトンガ・ケルマデック諸島火山弧の一部です。"
    2025_BUR_earthquake.t:0 "マンダレー地震"
    2025_BUR_earthquake.d:0 "2025年3月28日12時50分54秒（ミャンマー標準時）、Mw7.7の地震がミャンマーのザガイン地域を襲いました。震央は同国第2の都市マンダレーの近くでした。この横ずれ断層型の地震は改正メルカリ震度階級で最大IX（激しい）に達しました。1912年以来ミャンマーを襲った中で最も強力な地震であり、同国の近代史上2番目に死者の多い地震となりました。これを上回るのは1930年のバゴー地震の上限推計値のみです。地震はミャンマーに甚大な被害をもたらし、隣国タイでも大きな被害が出ました。中国の雲南省でも数百戸の家屋が損壊しました。"
    2018_USA_wildfire.t:0 "カリフォルニア・キャンプ・ファイア"
    2018_USA_wildfire.d:0 "2018年に北カリフォルニアのビュート郡で発生したキャンプ・ファイアは、カリフォルニア州史上最悪の死者と被害を出した山火事です。火災は2018年11月8日の朝、フェザー川渓谷でパシフィック・ガス・アンド・エレクトリック社（PG&E）の保守の行き届いていなかった送電線の一部が、強いおろし風の中で故障したことで始まりました。この風に煽られた火はコンカウ、マガリア、ビュート・クリーク・キャニオン、パラダイスの各地域を急速に襲い、その大部分を焼き尽くしました。火災はその後さらに2週間燃え続け、153,336エーカー（62,050ヘクタール）を焼いたのち、11月25日の日曜日に鎮圧されました。キャンプ・ファイアにより85人が死亡し、5万人以上が住まいを追われ、1万8千棟以上の建物が焼失しました。被害額は推定165億米ドルに上ります。"
    1976_CHI_earthquake.t:0 "唐山地震"
    1976_CHI_earthquake.d:0 "1976年の唐山地震は、7月27日19時42分55秒（UTC）に中国河北省唐山市周辺を襲ったMw7.6の地震です。最大震度はメルカリ震度階級でXIに達しました。"
    1948_TKM_earthquake.t:0 "アシガバート地震"
    1948_TKM_earthquake.d:0 "1948年のアシガバート地震は10月6日にトルクメニスタンのアシガバート近郊で発生し、表面波マグニチュードは7.3、メルカリ震度階級での最大震度はXでした。ソビエト政府の検閲により、この地震はソ連のメディアでほとんど報じられませんでした。"
    2026_VNZ_earthquake.t:0 "ベネズエラ北部地震"
    2026_VNZ_earthquake.d:0 "2026年6月24日、2つの大規模な横ずれ断層型地震がベネズエラ北西部と中部を襲いました。両地震の震源はいずれもヤラクイ州の州都サン・フェリペの西にあるベロエス郡でした。最初の地震はMw7.2で、ベネズエラ時間18時04分に発生し前震と分類されました。その39秒後にMw7.5の本震が続きました。2つの地震は国内の広い範囲に被害をもたらし、とりわけラ・グアイラとカラカスの被害が甚大でした。2,640人以上が死亡し、12,600人以上が負傷し、数万人が行方不明と報告されました。"
    
    national_landmark_damaged:0 "国家的名所が損壊"
    
    united_in_fear:0 "恐怖による団結"
    
    eastern_europe_sovietisation.t:0 "[SCOPE.sCountry('eastern_europe_sovietisation_target').GetName]のソビエト化？"
    eastern_europe_sovietisation.d:0 "当初ソビエトは他の東側諸国の政治における自らの役割を隠しており、体制の転換は西側の「ブルジョワ民主主義」の修正であるかのように見せかけられていました。モスクワで訓練を受けた幹部が権力の要職に就き、社会・政治の転換に関する命令を遂行しました。土地や工業資産の収用によってブルジョワジーの社会的・経済的な力を排除することが最優先とされました。人事、一般警察、秘密警察、青年組織を担う重要部局は共産主義者によって厳格に運営されました。こうした手続きは共産主義者が無制限の権力を手にし、ソビエトの政策を無条件に支持する政治家だけが残るまで繰り返されました。"
    eastern_europe_sovietisation.f:0 "このイベントは[SCOPE.sCountry('eastern_europe_sovietisation_target').GetName]が[SCOPE.sCountry('eastern_europe_sovietisation_initiator').GetName]の影響圏内にあるために発生しました。"
    eastern_europe_sovietisation.option.1:0 "[SCOPE.sCountry('eastern_europe_sovietisation_target').GetName]に共産主義政権を樹立せよ！"
    eastern_europe_sovietisation.option.2:0 "その必要はない。"
    eastern_europe_sovietisation_target.option.1:0 "[SCOPE.sCountry('eastern_europe_sovietisation_initiator').GetAdjective]の支配を受け入れる。"
    eastern_europe_sovietisation_target.option.2:0 "我々は自由になるのだ！"
    Turkish_Straits_Crisis.t:0 "トルコ海峡危機？"
    Turkish_Straits_Crisis.d:0 "トルコ海峡危機は冷戦期にソビエト連邦とトルコの間で起きた領土紛争です。第二次世界大戦の終結後、トルコはソビエト政府から黒海と地中海を結ぶトルコ海峡の通航を共同で軍事管理するよう圧力を受けました。トルコ政府がこれを拒否すると地域の緊張が高まり、ソビエトによる武力の誇示とジョージア・トルコ国境沿いの領土割譲の要求へとつながりました。"
    Turkish_Straits_Crisis.1.option.1:0 "トルコに譲歩を要求せよ！"
    Turkish_Straits_Crisis.1.option.2:0 "トルコには手を出さない。"
    Turkish_Straits_Crisis.2.option.1:0 "ソ連の要求を拒否せよ！"
    Turkish_Straits_Crisis.2.option.2:0 "ソ連の支配を受け入れよ！"
    Turkish_Straits_Crisis.3.t:0 "トルコ、ソ連の圧力に抵抗"
    Turkish_Straits_Crisis.3.d:0 "ソ連からの高まる圧力に屈したトルコは、数日のうちにアメリカ合衆国へ支援を求めました。政権と協議したトルーマン大統領はトルコへ海軍任務部隊を派遣しました。1946年10月9日、アメリカとイギリスの両政府はトルコへの支持を改めて表明しました。10月26日、ソ連はトルコ海峡の管理に関する新たな首脳会談の具体的な要求を（主張そのものは取り下げずに）撤回し、その後まもなく威圧のために展開していた軍の大半を同地域から引き揚げました。"
    Turkish_Straits_Crisis.3.option.1:0 "要求を取り下げる！"
    Turkish_Straits_Crisis.3.option.2:0 "戦争の時だ！"
    Berlin_Crisis.t:0 "ベルリン危機？"
    Berlin_Crisis.d:0 "1961年のベルリン危機は、ドイツの首都ベルリンと第二次世界大戦後のドイツの地位をめぐる冷戦期ヨーロッパ最後の大規模な政治的・軍事的事件でした。危機は東ドイツによるベルリンの壁の建設と、それに伴う事実上の都市分断で頂点に達しました。ベルリン危機は1961年6月、ソ連のニキータ・フルシチョフ首相がウィーン首脳会談でアメリカのジョン・F・ケネディ大統領と会談した際に、西ベルリンの西側諸国軍を含むすべての軍のベルリンからの撤退を求める最後通牒を再び突きつけたことで始まりました。"
    Berlin_Crisis.1.option.1:0 "ベルリンの支配を要求する！"
    Berlin_Crisis.1.option.2:0 "西ドイツには手を出さない。"
    Berlin_Crisis.2.option.1:0 "ソ連の要求を拒否せよ！"
    Berlin_Crisis.2.option.2:0 "ソ連の支配を受け入れよ！"
    Berlin_Crisis.3.t:0 "アメリカ、ソ連の圧力に抵抗"
    Berlin_Crisis.3.d:0 "合意には至らず、1961年8月、フルシチョフの後ろ盾を得た東ドイツの指導者ヴァルター・ウルブリヒトは国境の封鎖と西ベルリンを囲む壁の建設を命じました。10月には連合国要員の自由な通行をめぐる対立からチェックポイント・チャーリーで米ソの戦車が短期間にらみ合いました。この対峙はフルシチョフとケネディが戦車を撤退させ緊張を緩和することで合意し、平和裏に終わりました。"
    Berlin_Crisis.3.option.1:0 "要求を取り下げる！"
    Berlin_Crisis.3.option.2:0 "戦争の時だ！"
    Berlin_Ultimatum.t:0 "ベルリン最後通牒？"
    Berlin_Ultimatum.d:0 "1958年11月フルシチョフは西側諸国に対し6か月以内にベルリンから撤退しベルリンを非武装の自由都市とするよう求める最後通牒を突きつけました。フルシチョフはこの期限が過ぎれば西ベルリンとの交通路の管理権をすべて東ドイツに引き渡すと宣言しました。そうなれば西側諸国は東ドイツの許可がある場合にしか西ベルリンに出入りできなくなります。"
    Berlin_Ultimatum.1.option.1:0 "ベルリンの管理権を要求せよ！"
    Berlin_Ultimatum.1.option.2:0 "ベルリンには手を出さない。"
    Berlin_Ultimatum.2.option.1:0 "ソ連の要求を拒否せよ！"
    Berlin_Ultimatum.2.option.2:0 "ソ連の最後通牒を受け入れる！"
    Berlin_Ultimatum.3.t:0 "アメリカ、ソ連の圧力に抵抗"
    Berlin_Ultimatum.3.d:0 "NATOから見れば共産圏の奥深くにある西ベルリンに軍事的価値はありませんでした。しかし西ベルリンはソ連によるヨーロッパ支配への抵抗を示す何よりの象徴でした。アイゼンハワーはベルリンについて「政治的立場ゆえにまったく非論理的な軍事的態勢を取らざるを得ない事例」だと述べています。1959年2月にはイギリスのハロルド・マクミラン首相がモスクワを訪れフルシチョフと長時間にわたって協議しました。会談はおおむね友好的に進み最後通牒は撤回されました。"
    Berlin_Ultimatum.3.option.1:0 "要求を取り下げる！"
    Berlin_Ultimatum.3.option.2:0 "戦争の時だ！"
    Berlin_Blockade.t:0 "ベルリン封鎖？"
    Berlin_Blockade.d:0 "ベルリン封鎖は冷戦初期の大規模な国際危機の一つです。第二次世界大戦後のドイツが複数の国に分割占領されていたさなかソ連は西側同盟国の管理下にあるベルリンの占領地区へ通じる鉄道・道路・運河を封鎖しました。ソ連は西側同盟国が新たに導入したドイツマルクを西ベルリンから撤回すれば封鎖を解くと持ちかけました。"
    Berlin_Blockade.1.option.1:0 "ベルリンの管理権を要求せよ！"
    Berlin_Blockade.1.option.2:0 "ベルリンには手を出さない。"
    Berlin_Blockade.2.option.1:0 "ソ連の要求を拒否せよ！"
    Berlin_Blockade.2.option.2:0 "ソ連の最後通牒を受け入れる！"
    Berlin_Blockade.3.t:0 "アメリカ、ソ連の圧力に抵抗"
    Berlin_Blockade.3.d:0 "西側同盟国は1948年6月26日から1949年9月30日にかけてベルリン大空輸を組織し、西ベルリンの人々へ物資を届けました。都市の規模と人口を考えれば困難な偉業でした。当初は空輸が成功するはずがないと結論づけていたソ連にとって、その継続的な成功は次第に大きな屈辱となっていきました。1949年5月12日、東ベルリンの経済問題を理由にソ連は西ベルリンの封鎖を解除しました。しかし米英はソ連が封鎖を再開し西側の補給線を妨害しようとしているだけではないかと警戒し、しばらくの間は空路での補給を続けました。"
    Berlin_Blockade.3.option.1:0 "要求を取り下げる！"
    Berlin_Blockade.3.option.2:0 "戦争の時だ！"
    
    renovate_capital_decision:0 "首都再建"
    renovate_capital_decision_desc:0 "我らが[concept_capital_state]は古い都市ですが、狭苦しい中世風の街路や建物は決して都市のためになっていません。近代的な交通網を整備し衛生上の問題を解消するため、[concept_capital_state]の改造に投資して我が国の首都にふさわしい都市にすることができます。"
    
    je_renovate_capital_system:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]の再建"
    je_renovate_capital_system_reason:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]の専属建築家は、広大な大都市である[ROOT.GetCountry.GetCapital.GetCityHubName]を#yellow [ROOT.GetCountry.GetAdjectiveNoFlag]帝都#!へと変貌させる任務を与えられました。それは大[ROOT.GetCountry.GetAdjectiveNoFlag]「世界帝国」の輝かしき新首都であり、文明世界の中心となるものです。これは途方もない事業となるでしょう。\n\n国内の新聞はその設計を「真に記念碑的であり…あらゆる期待をはるかに超えている」と評し、[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]自身も「この石の砂漠から千年帝国の首都が生まれるのだ」と高らかに宣言しました。国外の報道はそれほど熱狂的ではないものの、概ね同意しています。たとえばある外国の新聞は、この計画を近代における「おそらく最も野心的な都市計画」と評しました。"
    je_renovate_capital_system_goal:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]の再建が完了しました"
    
    renovate_capital_dev_cost:0 "首都の再建コスト"
    grand_capital:0 "壮麗な都市"
    
    foreign_triggered_enactment.t:0 "[SCOPE.sCountry('manipulator_country').GetAdjectiveNoFlag]による[ROOT.GetCountry.GetAdjectiveNoFlag]の政治への干渉"
    foreign_triggered_enactment.d:0 "[SCOPE.sCountry('manipulator_country').GetName]に属する工作員が[ROOT.GetCountry.GetAdjective]の[concept_government]に対し[SCOPE.sLaw('law_to_be_enacted').GetName]を制定するよう扇動しています。\n\nこれに応じなければ[ROOT.GetCountry.GetName]における親[SCOPE.sCountry('manipulator_country').GetAdjectiveNoFlag]派の政治派閥である[SCOPE.gsInterestGroup('target_interest_group').GetName]の反感を買うでしょう。"
    foreign_triggered_enactment.f:0 "このイベントは[SCOPE.sCountry('manipulator_country').GetName]が[ROOT.GetCountry.GetName]に対して$conduct_hostile_espionage_8$[concept_diplomatic_pact]を有しているために発生しました。"
    
    foreign_triggered_enactment.option.1:0 "外国の影響に屈する。"
    foreign_triggered_enactment.option.2:0 "圧力に抵抗せねばならない！"
    
    seikan_tunnel_decision:0 "青函トンネルを建設する"
    seikan_tunnel_decision_desc:0 "青函トンネルは日本にある全長53.85km（33.46マイル）の三線軌条の鉄道トンネルです。そのうち23.3km（14.5マイル）は本州の青森県と北方の北海道を隔てる津軽海峡の海底下を通っています。"
    channel_tunnel_decision:0 "英仏海峡トンネルを建設する"
    channel_tunnel_decision_desc:0 "英仏海峡トンネルは1994年に開通した全長50.46km（31.35マイル）の海底鉄道トンネルで、ドーバー海峡のイギリス海峡の下を通りフォークストン（イングランド、ケント）とコケル（フランス、パ＝ド＝カレー）を結んでいます。グレートブリテン島とヨーロッパ大陸を結ぶ唯一の固定連絡路です。"
    zhuhai_bridge_decision:0 "港珠澳大橋を建設する"
    zhuhai_bridge_decision_desc:0 "港珠澳大橋（HZMB）は、3つの斜張橋、1つの海底トンネル、および4つの人工島で構成される55km（34マイル）の橋梁・トンネルシステムです。世界最長の海上橋かつ海上固定路です。港珠澳大橋は、香港、マカオ、並びに中国の珠江デルタの大都市である珠海を結ぶ、伶仃チャネルと九洲チャネルにまたがっています。"
    palm_islands_decision:0 "パーム・アイランドを建設する"
    palm_islands_decision_desc:0 "パーム・アイランドは、アラブ首長国連邦ドバイの海岸沿いにある、パーム・ジュメイラ、デイラ・アイランド、パーム・ジェベル・アリの3つの人工群島で構成されています。"
    
