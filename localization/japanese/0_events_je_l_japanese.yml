    je_civil_service_system:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の官僚機構"
    je_civil_service_system_reason:0 "[ROOT.GetCountry.GetAdjective]の官僚機構は国家機構を支える専門的な官僚組織です。法の執行や徴税や記録の管理を担う公務員たちは政治情勢の移り変わりの中でも継続性と安定の維持に努めます。\n\n官僚機構の長：[SCOPE.sCharacter('head_of_civil_service').GetFullName]\n\n注：官僚機構の腐敗はより厳格な#y $lawgroup_corruption_policy$#![Concept('concept_law','$concept_laws$')]を制定することで減らせます。"
    
