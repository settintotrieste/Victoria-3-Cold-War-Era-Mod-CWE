    enact_cult_of_personality_decision:0 "$amendment_cult_of_personality$を創設"
    enact_cult_of_personality_decision_desc:0 "[concept_government]は[concept_ruler]を中心とした個人崇拝を作り上げます。[concept_ruler]はマスメディアやプロパガンダなどの手段を用い、しばしば無批判な追従と称賛によって理想化された英雄的な、時に崇拝の対象となる像を作り出します。"
    
    enact_corporate_state_decision:0 "$law_corporate_state$を創設"
    enact_corporate_state_decision_desc:0 "国家コーポラティズムとは国家が市民や利益集団（労働組合や経済団体など）を先回りして組織し、国家公認の排他的な独占団体とする政治・経済体制です。この体制下ではこれらの団体は独立しておらず、政策の実施と社会の管理のために政府が統制する道具として機能します。"
    
    grant_washington_dc_statehood_decision:0 "$STATE_DISTRICT_OF_COLUMBIA$に州の地位を付与"
    grant_washington_dc_statehood_decision_desc:0 "$STATE_DISTRICT_OF_COLUMBIA$は現在国の議会で議決権を持つ代表を送る権利がありません。そこで[concept_government]はこの誤りを正す法案を可決します。\n\nこの決定により$STATE_DISTRICT_OF_COLUMBIA$は国の議会に議席を持てるようになります。"
    
