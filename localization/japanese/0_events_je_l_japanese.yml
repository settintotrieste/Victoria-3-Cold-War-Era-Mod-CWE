    anti_war_protest_war_exhaustion.t:0 "[SCOPE.sState('war_protest_state').GetName]での反戦デモ"
    anti_war_protest_war_exhaustion.d:0 "[SCOPE.sState('war_protest_state').GetName]では反戦感情が蔓延し[ROOT.GetCountry.GetAdjectiveNoFlag]の市民が我が国の戦争遂行に対する市民的不服従運動を展開するに至りました。軍は武力でデモを終わらせ関与者を見せしめとして処刑するよう進言しています。"
    anti_war_protest_war_exhaustion.f:0 "このイベントは[ROOT.GetCountry.GetName]の[concept_war_support]が0未満であるため発生しました。"
    anti_war_protest.option:0 "抗議させておけ"
    anti_war_protest_crush.option:0 "デモ隊を鎮圧しろ！"
    apply_pm_offense_defense_readjustment_minor_state.tt:0 "[SCOPE.sState('war_protest_state').GetName]のすべての$building_barracks$、$building_naval_base$、$building_conscription_center$が6か月間$pm_offense_defense_readjustment_minor$の修正を得ます"
    
    anti_war_protest_frenemies.t:0 "大規模な反戦デモ"
    anti_war_protest_frenemies.d:0 "自国と同じ文化的構成を持つ国と戦争状態にあると知り我が国の市民は衝撃を受けています。その結果[ROOT.GetCountry.GetName]の各地で大規模なデモが発生し同胞に対する無意味な戦争をやめるよう政府に求めています。"
    anti_war_protest_frenemies.f:0 "このイベントは[ROOT.GetCountry.GetName]が[ROOT.GetCountry.GetName]の[Concept('concept_primary_cultures','$concept_primary_culture$')]と同じ系統または特性を持つ[Concept('concept_primary_cultures','$concept_primary_culture$')]を擁する国と[concept_war]の状態にあるため発生しました。"
    
    anti_war_protest_blame_military.t:0 "司令官の解任を求める国民の請願"
    anti_war_protest_blame_military.d:0 "[ROOT.GetCountry.GetName]が苦境に陥っているため国民は不人気な軍指導者に矛先を向けています。国民は最近の連敗の責任を[SCOPE.sCharacter('unpopular_general').GetFullName]にあるとして無能の烙印を押しました。今や[SCOPE.sCharacter('unpopular_general').GetFullName]の解任を求める請願が[ROOT.GetCountry.GetRuler.GetFullName]に提出されています"
    anti_war_protest_blame_military.f:0 "このイベントは[ROOT.GetCountry.GetName]の[concept_war_support]が-25未満であり人気が25未満の将軍または提督が存在するため発生しました。"
    anti_war_protest_sack_general.option:0 "[SCOPE.sCharacter('unpopular_general').GetFullName]を解任する"
    anti_war_protest_keep_general.option:0 "[SCOPE.sCharacter('unpopular_general').GetFullName]を留任させる"
    sack_unpopular_general.tt:0 "[SCOPE.sCharacter('unpopular_general').GetFullName]が解任されます"
    
    anti_war_protest_sack_army_chief.t:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の最高司令部の混乱"
    anti_war_protest_sack_army_chief.d:0 "本日、[ROOT.GetCountry.GetAdjectiveNoFlag]軍の将軍たちによる定例会議が混乱に陥りました。[SCOPE.sCharacter('opposing_general').GetFullName]を筆頭とする複数の将軍が、[ROOT.GetCountry.GetName]が被った近年の壊滅的な連敗の責任を最高司令官[SCOPE.sCharacter('unpopular_army_chief').GetFullName]に問い、その辞任を要求したのです。[ROOT.GetCountry.GetAdjectiveNoFlag]の最高司令部におけるこの全面的な混乱は軍を分裂させており、[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')] [ROOT.GetCountry.GetRuler.GetFullName]が[SCOPE.sCharacter('unpopular_army_chief').GetFullName]を罷免しない限り、将校とその部下たちの間に大きな動揺を生むでしょう。"
    anti_war_protest_sack_army_chief.f:0 "このイベントは[ROOT.GetCountry.GetName]の[concept_war_support]が-25未満であるために発生しました。"
    anti_war_protest_sack_army_chief.option:0 "[SCOPE.sCharacter('unpopular_army_chief').GetFullName]を罷免する"
    anti_war_protest_keep_army_chief.option:0 "代わりに[SCOPE.sCharacter('opposing_general').GetFullName]を解任する"
    military_infighting:0 "軍内部の対立"
    apply_pm_offense_defense_readjustment_minor.tt:0 "すべての$building_barracks$、$building_naval_base$、$building_conscription_center$が6か月間$pm_offense_defense_readjustment_minor$補正を得ます"
    sack_army_chief.tt:0 "[SCOPE.sCharacter('unpopular_army_chief').GetFullName]が罷免されます"
    sack_opposing_general.tt:0 "[SCOPE.sCharacter('opposing_general').GetFullName]が罷免されます"
    
    remilitarise_war.t:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の再軍備？"
    remilitarise_war.d:0 "現在我々は[concept_war]にあるのですから、国を救うために師団の動員を開始できるよう、$law_peasant_levies$ [concept_law]を撤廃すべき時ではないでしょうか？"
    remilitarise_war.f:0 "このイベントは[ROOT.GetCountry.GetName]が[concept_war]にあり、$law_peasant_levies$ [concept_law]を有しているために発生しました。"
    remilitarise_war.option.1:0 "動員を開始せよ！"
    remilitarise_war.option.2:0 "やめておこう。"
    
    wartime_suspended_elections.t:0 "予定されていた選挙の停止"
    wartime_suspended_elections.d:0 "現在進行中の紛争を受け、政府は予定されていたすべての選挙を追って通知があるまで停止すると発表しました。国家の安全と統一に不可欠とされるこの措置は、戦闘が収束するまで効力を持ち続けます。当局は民主的手続きが放棄されたわけではなく、国家の安定と存続を守るために一時的に延期されたにすぎないと強調しています。"
    wartime_suspended_elections.f:0 "このイベントは[ROOT.GetCountry.GetName]が[concept_war]にあり、[concept_revolution]の状態にあるか領土の一部を占領されているために発生しました。"
    wartime_unsuspended_elections.t:0 "予定されていた選挙の再開"
    wartime_unsuspended_elections.d:0 "戦闘の終結に伴い、政府は選挙の停止措置を解除しました。民主的手続きは予定どおり再開され、代議制による統治への国家の決意が改めて示されます。"
    wartime_unsuspended_elections.f:0 "このイベントは[ROOT.GetCountry.GetName]がもはや[concept_war]ではないために発生しました"
    wartime_suspended_elections.option:0 "了解した。"
    
    wartime_suspended_elections:0 "戦争による選挙の停止"
    
