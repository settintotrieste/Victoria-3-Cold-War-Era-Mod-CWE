    je_guerrilla_war_system:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]の反乱"
    je_guerrilla_war_system_reason:0 "[ROOT.GetCountry.GetName]の一部の[Concept('character_role_terrorist','$character_role_terrorists$')]が十分な数の支持者を集め、国内の都市や町、インフラに広範な損害と荒廃をもたらすことを目的としたゲリラ組織を結成しました。\n\n@information![concept_clout]が#y 10％#!を超える[concept_interest_group]を持つ[Concept('character_role_terrorist','$character_role_terrorists$')]は#y ゲリラ#!になります。\n\nゲリラは[ROOT.GetCountry.GetName]で定期的に#y ゲリラ攻撃#!を行います。\n\n[ROOT.GetCountry.GetName]に対して#y $conduct_hostile_espionage$#!の[concept_diplomatic_pact]を用いる外国の[Concept('concept_country', '$concept_countries$')]も、これらの[Concept('character_role_terrorist','$character_role_terrorists$')]を利用して[ROOT.GetCountry.GetAdjectiveNoFormatting]の都市・産業・インフラを攻撃することがあります。"
    
    guerrilla_character_label.tt:0 "ゲリラ：[SCOPE.sCharacter('guerrilla_character').GetFullName]（[SCOPE.sCharacter('guerrilla_character').GetPoliticalMovement.GetName]）"
    international_guerrilla_character.tt:0 "国際ゲリラ：[SCOPE.sCharacter('international_guerrilla_character').GetFullName]（[SCOPE.sCharacter('international_guerrilla_character').GetCountry.GetName]）"
    
    no_guerrillas_in_country.tt:0 "[ROOT.GetCountry.GetName]にはもう#y ゲリラ#![Concept('concept_character', '$concept_characters$')]はいません"
    
    notification_domestic_guerrilla_attack_name: "[SCOPE.sState('guerrilla_attack_state').GetName]でのゲリラ攻撃"
    notification_domestic_guerrilla_attack_desc: "[concept_character_role_terrorist]の[SCOPE.sCharacter('guerrilla_attack_leader').GetFullName]が[SCOPE.sCharacter('guerrilla_attack_leader').GetPoliticalMovement.GetName]の大義を推し進めるため#y [SCOPE.sState('guerrilla_attack_state').GetCityHubName]#!（[SCOPE.sState('guerrilla_attack_state').GetName]）でゲリラ攻撃を指揮しました。これにより[concept_state]で多少の[concept_devastation]が生じました。"
    
    notification_international_guerrilla_attack_name: "[SCOPE.sState('guerrilla_attack_state').GetName]でのゲリラ攻撃"
    notification_international_guerrilla_attack_desc: "国際[concept_character_role_terrorist]の[SCOPE.sCharacter('guerrilla_attack_leader').GetFullName]が[SCOPE.sCharacter('guerrilla_attack_leader').GetPoliticalMovement.GetName]の大義を推し進め[ROOT.GetCountry.GetAdjective]の侵略と戦うため#y [SCOPE.sState('guerrilla_attack_state').GetCityHubName]#!（[SCOPE.sState('guerrilla_attack_state').GetName]）でゲリラ攻撃を画策しました。これにより[concept_state]で多少の[concept_devastation]が生じました。"
    
