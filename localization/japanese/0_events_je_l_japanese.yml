    moon_mission_completed.f:0 "一人の人間にとっては小さな一歩だが人類にとっては偉大な飛躍だ！"
    space_station_completed.f:0 "地球の眺めは実に見事だ"
    space_telescope_completed.f:0 "隣人の裏庭を覗く時間だ"
    mars_mission_completed.f:0 "我々は孤独なのか？"
    moon_base_completed.f:0 "月の住人は「ムーナー」と呼ぶべきだ"
    mars_base_completed.f:0 "火星の砂漠を楽しんでくれるといい"
    
    space_program_peril_scientists.t:0 "宇宙計画の人員"
    space_program_peril_scientists.d:0 "[ROOT.GetCountry.GetAdjective]の宇宙計画は現在の宇宙プロジェクトのために優秀な科学者を雇い入れる機会を得ました。しかしその科学者は我々の下で働く条件として非常に高額な報酬を要求しています。"
    space_program_peril_scientists.f:0 "やあ、どうも！"
    
    space_program_peril_materials.t:0 "宇宙計画の資材"
    space_program_peril_materials.d:0 "[ROOT.GetCountry.GetAdjective]の宇宙計画は現在の宇宙プロジェクトの部品に最高の資材を使用する機会を得ました。しかしこの優れた資材は決して安価ではありません。"
    space_program_peril_materials.f:0 "その資材はアンオブタニウムか？"
    
    space_program_peril_project_pace.t:0 "宇宙計画の進行速度"
    space_program_peril_project_pace.d:0 "[ROOT.GetCountry.GetAdjective]の宇宙計画は現在の宇宙プロジェクトの特定の開発段階を加速させる機会を得ました。しかし全員に残業をさせれば事故の危険が高まりプロジェクトの費用も増加します。"
    space_program_peril_project_pace.f:0 "速いに越したことはない"
    
    space_program_peril_100.t:0 "宇宙計画の後退"
    space_program_peril_100.d:0 "[ROOT.GetCountry.GetAdjective]の宇宙計画は大きな挫折に見舞われました。試作機の試験打ち上げが、離陸直後の爆発という結果に終わったのです。問題を解決して新たな試作機を製造するため、一から設計をやり直さねばなりません。"
    space_program_peril_100.f:0 "ああ、なんという惨事だ！"
    
    space_program_peril.option.1:0 "承認する"
    space_program_peril.option.2:0 "拒否する"
    space_program_peril_100.option.1:0 "仕方がない……"
    
