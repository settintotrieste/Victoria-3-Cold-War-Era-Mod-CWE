    je_gatt_system: "関税及び貿易に関する一般協定"
    je_gatt_system_reason: "関税及び貿易に関する一般協定（GATT）は多数の国家間で結ばれた法的協定であり、関税や輸入割当などの貿易障壁を削減・撤廃して国際貿易を促進することを全体的な目的としていました。1947年から1995年にかけて全9回のラウンドからなる一連の世界的な貿易交渉を通じて改定されてきました。国際貿易におけるその役割は1995年に世界貿易機関（WTO）へとおおむね引き継がれました。\n\nGATTは絶えず改定される協定であるため、GATTによる[concept_tariffs]の削減幅は毎年変動します。\n\n注：[concept_tariffs]の削減量は世界経済の見通しによって決まります。"
    
