    british_india.indy.t:0 "インドの独立？"
    british_india.indy.d:0 "1947年6月3日、最後の英領インド総督ルイス・マウントバッテン子爵は英領インドをインドとパキスタンに分割すると発表しました。1947年インド独立法が速やかに成立し、1947年8月14日11時57分にパキスタンが分離独立した国家として宣言されました。続いて1947年8月15日12時2分、インドは主権を持つ民主国家となりました。"
    british_palestine.indy.t:0 "イスラエルとパレスチナの独立？"
    british_palestine.indy.d:0 "1947年11月、国際連合はパレスチナの分割とアラブ人国家およびユダヤ人国家の個別樹立を勧告しました。1948年5月15日、イギリスは委任統治を放棄します。イギリス軍はパレスチナから撤退し、続く戦争での決着をユダヤ人とアラブ人に委ねたのです。"
