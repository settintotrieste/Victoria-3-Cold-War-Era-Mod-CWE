    UN_peacekeeping_resolution_NO.f:0 "国連平和維持決議は安保理常任理事国による拒否権行使があったか安保理または国連総会で単純過半数の賛成を得られなかったため否決されました。\n\n安保理で拒否権を行使した国：[SCOPE.sCountry('un_peacekeeping_vetoer').GetName]"
