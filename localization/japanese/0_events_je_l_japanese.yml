    USA_historical_election_system.t:0 "アメリカ大統領選挙"
    USA_historical_election_system.d:0 "アメリカ合衆国の大統領および副大統領の選挙は間接選挙です。50の州またはワシントンD.C.で有権者登録をした合衆国市民はこれらの職に直接投票するのではなく選挙人団の構成員に投票します。選ばれた選挙人は大統領と副大統領に対し選挙人票と呼ばれる直接投票を行います。選挙人票の絶対過半数（合衆国憲法修正第23条でD.C.の市民に投票権が与えられて以降は538票中270票以上）を獲得した候補者がその職に選出されます。"
    historical_election_system.f:0 "これは歴史的イベントであり、現在の[concept_ruler]を史実どおりの[concept_ruler]に設定することを目的としています。史実に沿わない選択肢を選ぶと、現在の[concept_government_type]に適用される#y 権力の委譲#!の設定に基づいて[concept_ruler]が選出されます。"
    
    GBR_historical_election_system.t:0 "イギリス総選挙"
    GBR_historical_election_system.d:0 "[ROOT.GetCountry.GetName]の首相は政府の首席大臣であり、イギリス内閣の長です。首相職は創設されたものではなく、職務の統合を通じて長い時間をかけて形作られてきたため、いつ初めて現れたかを示す明確な日付はありません。"
    
    FRA_historical_election_system.t:0 "フランス大統領選挙"
    FRA_historical_election_system.d:0 "フランス大統領はフランスの行政権を持つ国家元首であり、フランス軍の最高司令官です。大統領職は国の最高官職であり、フランスで最も高い地位にあります。"
    
    GER_historical_election_system.t:0 "ドイツ総選挙"
    GER_historical_election_system.d:0 "ドイツ首相はドイツの政治的指導者であり、政府の長です。首相は政府の他の全閣僚を選任し、閣議を主宰する責任を負います。"
    
    HND_historical_election_system.t:0 "インド総選挙"
    HND_historical_election_system.d:0 "インド首相はインド政府の最高行政責任者です。インド大統領は憲法上の名目的・儀礼的な国家元首ですが、実際には通常、行政権は首相とその選んだ閣僚会議に委ねられています。首相はインド共和国の主要な立法機関であるインド議会下院（ローク・サバー）で過半数を占める政党によって選ばれた指導者です。"
    
    BRZ_historical_election_system.t:0 "ブラジル大統領選挙"
    BRZ_historical_election_system.d:0 "大統領制は1889年、皇帝ペドロ2世に対する軍事クーデターで共和国が宣言されたことにより確立されました。以来ブラジルは6つの憲法、3度の独裁、3度の民主政期を経てきました。民主政期には投票は常に義務とされてきました。"
    
    IDO_historical_election_system.t:0 "インドネシア大統領選挙"
    IDO_historical_election_system.d:0 "インドネシア共和国大統領はインドネシア共和国の国家元首かつ政府の長です。大統領はインドネシア政府の行政府を率い、インドネシア国軍の最高司令官を務めます。2004年以降、正副大統領は任期5年で直接選挙により選ばれ、再選は1度まで、在任期間は最長10年です。"
    
    SKO_historical_election_system.t:0 "韓国大統領選挙"
    SKO_historical_election_system.d:0 "大韓民国大統領は大韓民国の国家元首であり政府の長でもあります。大統領は国務会議を主宰し、国の行政府の首長であると同時に大韓民国国軍の最高司令官を務めます。"
    
    MSY_historical_election_system.t:0 "マレーシア総選挙"
    MSY_historical_election_system.d:0 "マレーシア首相はマレーシアの政府の長であり、連邦政府の行政府を指揮します。首相はヤン・ディ・プルトゥアン・アゴンによって任命され、その判断において下院議員の過半数の信任を得る可能性が最も高いとされる下院議員が選ばれます。首相は通常、総選挙で最多議席を獲得した政党の党首が務めます。"
    
    RUS_historical_election_system.t:0 "ロシア大統領選挙"
    RUS_historical_election_system.d:0 "ロシア連邦大統領はロシアの行政権を持つ国家元首です。大統領は連邦国家評議会の議長であり、ロシア連邦軍の最高司令官でもあります。ロシアにおける最高の職位です。"
    
    SOV_historical_election_system.t:0 "ソ連大統領選挙"
    SOV_historical_election_system.d:0 "1990年ソビエト連邦大統領選挙は、5年任期の大統領を選出するため1990年3月14日にソビエト連邦で実施されました。これはソビエト連邦で行われた最初にして唯一の大統領選挙です。大統領職が創設されたのが1991年のソビエト連邦崩壊の前年である1990年だったためです。選挙は無投票で行われ、当時ソビエト連邦共産党書記長であったミハイル・ゴルバチョフが唯一の候補者でした。"
    
    ROC_historical_election_system.t:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]大統領選挙"
    ROC_historical_election_system.d:0 "中華民国総統は台湾総統とも呼ばれ、中華民国（台湾）の国家元首であると同時に中華民国国軍の最高司令官でもあります。この職はかつて1949年以前には中国大陸を統治する権限を有していましたが、国共内戦の終結以降、その管轄は台湾・澎湖・金門・馬祖およびその他の小島に限られています。"
    
    historical_election_system.f:0 "これは歴史的イベントであり、現在の[concept_ruler]を史実どおりの[concept_ruler]に設定することを目的としています。史実に沿わない選択肢を選ぶと、現在の[concept_government_type]に適用される#y 権力の委譲#!の設定に基づいて[concept_ruler]が選出されます。"
    
    historical_election_system.option.1:0 "史実に従う！"
    historical_election_system.option.2:0 "通常の規則で[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]を選出する。"
    
    je_olympic_games:0 "[GetPlayer.MakeScope.Var('olympic_games_year_display').GetValue] [SCOPE.sState('olympic_games_summit_location').GetCityHubName]オリンピック"
    je_olympic_games_reason:0 "夏季オリンピック競技大会は「オリンピアード競技大会」とも呼ばれ、しばしば夏季オリンピックと称される大規模な国際総合競技大会で、通常は4年に1度、閏年に開催されます。\n\nオリンピックの失敗を避けるため、オリンピック・インフラを建設しましょう。\n\n[GetPlayer.MakeScope.Var('olympic_games_year_display').GetValue]オリンピック競技大会は[SCOPE.sState('olympic_games_summit_location').GetCityHubName]、[SCOPE.sState('olympic_games_summit_location').GetName]（[ROOT.GetCountry.GetName]）で開催されます。"
    je_olympic_games_status:0 "目標期日：[GetPlayer.MakeScope.Var('olympic_games_year_display').GetValue]年夏"
    
    offered_olympics.t:0 "[GetPlayer.MakeScope.Var('olympic_games_year_display').GetValue]オリンピック競技大会を開催するか？"
    offered_olympics.d:0 "国際オリンピック委員会は[ROOT.GetCountry.GetName]に[GetPlayer.MakeScope.Var('olympic_games_year_display').GetValue]オリンピック競技大会の開催の機会を提示しました。受諾すれば[ROOT.GetCountry.GetName]は4年以内に大会に必要なインフラを建設することになります。"
    offered_olympics.f:0 "[ROOT.GetCountry.GetName]は戦争中でなく、国際的に孤立しておらず、十分に独立しているため選ばれました。"
    olympic_games_system.option.1:0 "受諾する"
    olympic_games_system.option.2:0 "辞退する"
    participation_olympics.t:0 "[GetPlayer.MakeScope.Var('olympic_games_year_display_event').GetValue] [SCOPE.sState('olympic_games_summit_location').GetCityHubName]オリンピック"
    participation_olympics.d:0 "[SCOPE.sCountry('recently_hosted_olympics').GetName]で開催された[GetPlayer.MakeScope.Var('olympic_games_year_display_event').GetValue]オリンピック競技大会には、世界中から数千人の選手が集まり、さまざまな競技に参加しました。その締めくくりとして、大会会場である[SCOPE.sState('olympic_games_summit_location').GetCityHubName]では盛大な式典が催されました。"
    participation_olympics.option.1:0 "正々堂々と参加する！"
    participation_olympics.option.2:0 "選手にドーピングさせる！"
    participation_olympics.option.3:0 "大会をボイコットする！"
    banned_olympics.t:0 "オリンピック代表チームのドーピング発覚"
    banned_olympics.d:0 "[ROOT.GetCountry.GetAdjective]のオリンピック代表チームが、先日[SCOPE.sCountry('recently_hosted_olympics').GetName]で開催されたオリンピック競技大会で禁止薬物を使用していたことが発覚しました。これを受けて国際オリンピック委員会は[ROOT.GetCountry.GetName]の次回オリンピック競技大会への参加を禁止しました。"
    banned_olympics.option:0 "言語道断だ！"
    bad_olympics.t:0 "[SCOPE.sCountry('recently_hosted_olympics').GetAdjectiveNoFlag]オリンピック競技大会に批判の声"
    bad_olympics.d:0 "予算削減とずさんな計画のせいで必要なオリンピックインフラの一部が大会に間に合いませんでした。その結果、選手たちは劣悪な環境での競技を強いられました。[SCOPE.sState('olympic_games_summit_location').GetCityHubName]オリンピックは運営が杜撰な紛れもない大失敗だとして各方面から非難を浴びています。"
    bad_olympics.f:0 "[ROOT.GetCountry.GetName]がオリンピック[concept_journal_entry]で完成度100％を達成できなかったため、このイベントが発生しました。"
    bad_olympics.option:0 "仕方がない。"
    
