    je_central_bank:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('central_bank_name_custom_title')]"
    je_central_bank_reason:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('central_bank_name_custom_title')]は[ROOT.GetCountry.GetName]の中央銀行です。\n\n中央銀行は金融政策によって景気変動を管理し物価の安定を図ります。物価の安定とはインフレが低く安定した状態を指します。中央銀行は通常、公開市場で証券を売買することで貨幣供給量を調整し金融政策を実施します。公開市場操作は短期金利に影響を与え、それが長期金利や経済活動にも波及します。中央銀行が金利を引き下げれば金融緩和、引き上げれば金融引き締めとなります。\n\n現在の利子率：[SCOPE.GetRootScope.GetCountry.GetCustom('central_bank_current_monetary_policy_custom_title')]\n\n今月のコア[concept_market_price]平均：[GetPlayer.MakeScope.Var('core_interest_rate_now').GetValue]％\n\n先月のコア[concept_market_price]平均：[GetPlayer.MakeScope.Var('core_interest_rate_prev').GetValue]％\n\nコア[concept_market_price]の算出に用いる商品（[GetPlayer.MakeScope.Var('core_interest_rate_total_factors').GetValue]が利用可能）：$cir_grain$ $cir_meat$ $cir_fish$ $cir_fruit$ $cir_tea$ $cir_coffee$ $cir_groceries$ $cir_liquor$ $cir_tobacco$ $cir_wine$ $cir_transportation$ $cir_real_estate$ $cir_electricity$ $cir_communication_services$ $cir_services$ $cir_furniture$ $cir_telecommunications$ $cir_computers$"
