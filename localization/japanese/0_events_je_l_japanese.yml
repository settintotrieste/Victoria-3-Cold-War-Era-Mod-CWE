    historical_interstate_wars.option.1:0 "宣戦布告だ！"
    historical_interstate_wars.option.2:0 "平和こそが望ましい選択だ。"
    historical_interstate_wars_accept.option.1:0 "最後通牒を受け入れる"
    historical_interstate_wars_reject.option.2:0 "平和など初めから選択肢になかった。戦争の時だ！"
    
    austria_formation.t:0 "オーストリアの独立？"
    austria_formation.d:0 "1955年5月15日、四大国（アメリカ・イギリス・フランス・ソ連）はウィーンでオーストリア国家条約に署名しました。これにより四カ国による占領は終結し、オーストリアは自由で独立した中立国であると宣言されました。"
    austria_formation.option.1:0 "統一され民主的で中立なオーストリア国家を望む"
    austria_formation.option.2:0 "オーストリアは分割したままにする！"
    austria_formation_1946.t:0 "第二次管理協定？"
    austria_formation_1946.d:0 "1946年6月28日、同盟国は第二次管理協定に署名し、オーストリア政府への支配を緩めました。議会は事実上、同盟国の統制から解放されます。以後その決定は四同盟国全会一致の投票によってのみ覆せるものとなり、ソ連の拒否権は西側の反対によって日常的に無効とされました。続く9年間でこの国は次第に外国の支配から脱し「後見下の国家」から完全な独立へと歩みを進めました。"
    austria_formation_1946.option.1:0 "占領地区を統一する。"
    austria_formation_1946.option.2:0 "オーストリアは分割したままにする！"
    
    united_states_formation_hawaii.t:0 "ハワイがアメリカの州に昇格？"
    united_states_formation_hawaii.d:0 "アイゼンハワー大統領は政権初期からハワイの州昇格を支持すると表明していましたが、そのための法案が議会を通過したのは1959年のハワイ州昇格法が初めてでした。アイゼンハワー大統領は1959年3月18日にこの法案へ署名し法律として成立させます。1959年6月にはハワイの市民が州昇格法案の受け入れを問う住民投票を行い、1959年8月21日、アイゼンハワー大統領はハワイを50番目の州として編入する公式宣言に署名しました。"
    united_states_formation_alaska.t:0 "アラスカがアメリカの州に昇格？"
    united_states_formation_alaska.d:0 "アイゼンハワー大統領は政権初期からアラスカの州昇格に支持を表明していましたが、実現の前に克服すべき懸念も示していました。最大の懸念は、アラスカがソビエト連邦と境を接していることによる国家安全保障の問題でした。もう一つの懸念は準州内の公有地の広さであり、留保されていない土地を新しい州政府へ移管するための妥当な妥協案をまとめる必要がありました。1959年1月3日、彼はアラスカを49番目の州として加入させる公式布告に署名しました。"
    united_states_formation.option.1:0 "はい"
    united_states_formation.option.2:0 "いいえ"
    
    tanzania_formation_zanzibar.t:0 "タンガニーカとザンジバルの統合？"
    tanzania_formation_zanzibar.d:0 "タンザニア連合共和国は、タンガニーカとザンジバルの統合の結果として1964年4月26日に成立しました。ジュリウス・ニエレレが初代大統領となり、シェイク・アベイド・カルメが初代副大統領兼革命評議会議長となりました。"
    tanzania_formation.option.1:0 "はい"
    tanzania_formation.option.2:0 "いいえ"
    
    india_formation_sikkim.t:0 "インドとシッキムの統合？"
    india_formation_sikkim.d:0 "インドは1973年4月にシッキムを掌握し、王制を打倒しました。1975年4月9日、シッキム議会は国王の廃位を発表し、操作された住民投票を通じてシッキムがインドの一部となったと宣言しました。5月16日、インド議会はシッキムが正式にインドの一州となったと発表しました。"
    india_formation.option.1:0 "はい"
    india_formation.option.2:0 "いいえ"
    
    HUN_1956_revolution.t:0 "ハンガリー革命？"
    HUN_1956_revolution.d:0 "1956年のハンガリー動乱は、ハンガリー人民共和国政府（1949年～1989年）と、政府のソ連への従属によって生じた政策に対する、全国規模の失敗した革命でした。蜂起は12日間続きましたが、1956年11月4日にソ連の戦車と部隊によって鎮圧されました。"
    HUN_2010_revolution.t:0 "ヴィクトル・オルバーンの台頭？"
    HUN_2010_revolution.d:0 "ヴィクトル・ミハーイ・オルバーンはハンガリーの法律家・政治家であり、2010年からハンガリー首相を務めています。2010年以降、オルバーンはハンガリーの民主主義を掘り崩し、司法の独立を弱め、報道の自由を制限してきました。オルバーンの第2次政権期には、2013年のハンガリー憲法改正をはじめ、物議を醸す憲法・立法上の改革がいくつも行われました。"
    HUN_2026_revolution.t:0 "ヴィクトル・オルバーンの失脚？"
    HUN_2026_revolution.d:0 "記録的な投票率となった2026年の議会選挙でオルバーンはペーテル・マジャール率いるティサ党に大敗しました。その後オルバーンはフィデスの党首にとどまると表明する一方で新議会の議席に就くことを拒否し、新議会は首相職に2期までの制限を設ける憲法改正を採択してオルバーンの首相復帰を封じました。"
    
    CZH_1968_revolution.t:0 "プラハの春？"
    CZH_1968_revolution.d:0 "プラハの春は、チェコスロバキア社会主義共和国における短期間の政治的自由化と大衆抗議でした。これは1968年1月5日、改革派のアレクサンデル・ドゥプチェクがチェコスロバキア共産党（KSČ）の第一書記に選出されたことから始まり、ソ連とワルシャワ条約機構加盟国の半数が改革を抑圧するために同国に侵攻した1968年8月21日まで続きました。"
    CZH_1968_revolution_1.t:0 "アレクサンデル・ドゥプチェクの台頭？"
    CZH_1968_revolution_1.d:0 "1968年1月、指導部と改革をめぐる問題はチェコスロバキア共産党中央委員会に委ねられました。委員会は大統領職と党首職を分離することでノヴォトニーへの不信任を示しました。彼は大統領にとどまったものの、第一書記の座はドゥプチェクに取って代わられました。ノヴォトニーは抵抗し、権力の喪失を防ぐため軍の一部を動員しようと試みました。皮肉にもこの件の調査が引き金となり、ノヴォトニーは数か月後に完全に失脚することとなりました。"
    CZH_1969_revolution.t:0 "チェコスロバキアの正常化？"
    CZH_1969_revolution.d:0 "1969年4月にフサークがドゥプチェクに代わってKSČの指導者となると、その政権は国内の政治情勢の「正常化」に速やかに着手しました。フサークの正常化が目指したのは、確固たる党支配の回復と、社会主義陣営の忠実な一員というチェコスロバキアの地位の再確立でした。侵攻後の2年間で新指導部は改革派の法律の一部（国民戦線法や出版法など）を撤回し、その他の法律も単に施行しないままとしました。プラハの春の間に大幅な自主性を認められていた経済企業は、中央計画と生産ノルマに基づく契約を通じて中央統制の下へと戻されました。"
    CZH_1969_revolution_1.t:0 "チェコスロバキア連邦？"
    CZH_1969_revolution_1.d:0 "連邦に関する憲法的法律の公布により、1960年のチェコスロバキア憲法のうち統治機構に関する58箇条が改正されました。チェコスロバキア国家はチェコ社会主義共和国とスロバキア社会主義共和国という「対等な二つの兄弟民族」の連邦であると宣言され、それぞれが連邦政府と並立し少なくとも建前の上では対等な地位を持つ共和国政府を備えることとなりました。二重国籍も定められました。中央政府がこれまで担ってきた機能の多くは、代わって二つの共和国政府の管轄下に置かれました。連邦政府は外交、国防、連邦備蓄、国家資源について排他的な管轄権を保持しました。"
    
    BUL_1954_revolution.t:0 "四月路線？"
    BUL_1954_revolution.d:0 "ヨシフ・スターリンの死後、集団指導を重んじる風潮が生まれました。強硬なスターリン主義者であったチェルヴェンコフが1954年にブルガリア共産党書記長の職を退くとジフコフがその座に就きましたが、チェルヴェンコフは首相として権力の大半を握り続けました。ニキータ・フルシチョフがソ連共産党第20回大会でスターリンを批判する有名な秘密報告を行うと、1956年4月にブルガリア共産党中央委員会総会が招集され、新たなフルシチョフ路線を採用することが決まりました。この総会でジフコフはチェルヴェンコフをスターリンの追随者として批判し、首相から一閣僚へと降格させました。その後ジフコフはソ連の雪解けに倣い、ブルガリアで比較的穏やかな社会的・政治的自由化と非スターリン化の政策を進めました。"
    BUL_1965_revolution.t:0 "四月の陰謀？"
    BUL_1965_revolution.d:0 "ジフコフが国家と共産党の指導者としての地位を強めていくなか、かつてのパルチザン指導者や現役軍人は、ジフコフ指導部の政策を修正主義的と見なして批判的な立場を取りました。1965年の「4月陰謀事件」と呼ばれる一連の出来事では、イヴァン・トドロフ＝ゴルニャ将軍とツヴャトコ・アネフ将軍、そしてツォロ・クラステフが、体制転覆を企てる高級将校の一団を組織しました。彼らの計画は、スターリン主義と毛沢東主義の原則に基づく親中派の指導部を国内に樹立することでした。クーデター計画は発覚し、1965年3月28日から4月12日にかけて首謀者の大半が逮捕され党から除名されました。"
    
    BYE_1994_revolution.t:0 "アレクサンドル・ルカシェンコの大統領就任？"
    BYE_1994_revolution.d:0 "政界に身を投じる前のルカシェンコは国営農場（ソフホーズ）の場長を務め、ソ連国境軍とソ連軍の双方で兵役に就いていました。1990年にはベラルーシ・ソビエト社会主義共和国最高会議の議員に選出されます。ソ連崩壊後はベラルーシ最高会議の暫定汚職対策委員会の長に就任しました。そして1994年、新憲法の採択を受けて行われた同国初の大統領選挙に勝利し大統領の座を手にしたのです。"
    
    NEJ_1964_revolution.t:0 "サウード国王の退位？"
    NEJ_1964_revolution.d:0 "サウードの治世下、サウジアラビアは1961年に非同盟運動へ加わりました。しかしサウードが国の債務に対処できなかったことから、異母弟で皇太子のファイサルとの権力闘争に陥り、ついにはサウードが退位を強いられファイサルが国王に宣されるに至ります。サウードは亡命し、一部の息子たちの支持を得て王位の奪還を試みましたが失敗に終わりました。"
    NEJ_1975_revolution.t:0 "ファイサル国王の暗殺？"
    NEJ_1975_revolution.d:0 "1975年3月25日、国王は異母兄弟ムサーイド・ビン・アブドゥルアジーズの息子ファイサル・ビン・ムサーイドに至近距離から銃撃され殺害されました。国王はアメリカから帰国したばかりでした。事件が起きたのはマジュリス（文字どおり「座る場所」）の最中でした。これは国王や指導者が住居を市民に開放し請願を受け付ける催しです。"
    NEJ_2005_revolution.t:0 "ファハド国王の死"
    NEJ_2005_revolution.d:0 "ファハド国王は2005年5月27日「安定しているが深刻な状態」でリヤドのキング・ファイサル専門病院に入院し、詳細不明の検査を受けました。匿名を条件にある当局者がAP通信へ非公式に語ったところでは、国王は2005年8月1日7時30分に84歳で死去しました。公式発表は10時にイヤード・マダニ情報相により国営テレビで行われました。"
    
    QAT_1960_revolution.t:0 "アリー・ビン・アブドゥッラー・アール・サーニーの退位？"
    QAT_1960_revolution.d:0 "1960年5月、シェイフ・アリーの従兄弟がベイルートの別荘でシェイフを銃により暗殺しようとしました。この暗殺未遂は金銭問題に絡むものだったとされています。シェイフ・アリーは1960年10月28日にアフマド・ビン・アリー・アール・サーニーへ位を譲り退位しました。"
    QAT_1972_revolution.t:0 "カタールのクーデター？"
    QAT_1972_revolution.d:0 "シェイフ・ハリーファは1972年2月22日の無血クーデターによりシェイフ・アフマドを廃位しました。当時シェイフ・アフマドは狩猟旅行でイランに滞在していました。廃位後シェイフ・アフマドは妻（先代のドバイ支配者の娘）と子供たちとともにドバイで自ら選んだ亡命生活を送りました。"
    QAT_1995_revolution.t:0 "カタールのクーデター？"
    QAT_1995_revolution.d:0 "1995年6月ハリーファ・ビン・ハマド・アール・サーニーがスイスのジュネーヴに滞在している間に、息子のハマド・ビン・ハリーファがまたも無血クーデターで権力を掌握しました。ハマド・ビン・ハリーファは父を反逆の罪で告発しインターポールに逮捕を要求しました。さらに死刑を求める内容を含む4つの罪状で父を訴追しました。" 
    QAT_2013_revolution.t:0 "ハマド・ビン・ハリーファ・アール・サーニーの退位？"
    QAT_2013_revolution.d:0 "2013年6月25日、シェイク・ハマド・ビン・ハリーファ・アール・サーニーはカタール首長の座を退き、息子のシェイク・タミーム・ビン・ハマド・アール・サーニーへ権力を移譲しました。湾岸政治では稀な自発的譲位であり、世代交代を印づけると同時に、地域の動乱と国際的な進出が続くなかでカタールの継続性を確かなものとしました。"
    
    MOR_1953_revolution.t:0 "モハメド・ベン・アラファのクーデター？"
    MOR_1953_revolution.d:0 "ベン・アラファは1953年8月21日、従兄弟のモハメド5世がフランス当局によって廃位された後にアラウィー朝の王位へ据えられました。フランスは1912年のフェズ条約に基づきモロッコに保護領を維持していたのです。1951年からモロッコ総督を務めていたオーギュスタン・ギヨーム将軍は、モハメド5世がモロッコ独立運動を支持したことから対立を深め、その打倒に向けた策動を主導しました。これはフランス人入植者や、マラケシュのパシャであるタミ・エル・グラウィら一部のモロッコ人指導者に支持されていました。"
    MOR_1955_revolution.t:0 "モハメド・ベン・アラファの打倒？"
    MOR_1955_revolution.d:0 "ベン・アラファはモロッコ国民からの正統性も人気も欠いており、さらにモロッコ国内の暴力がチュニジア情勢やアルジェリア戦争と結びつきを強めたため、フランス当局は1955年に彼を廃してモハメド5世を復位させることを検討しました。新たな総督に任命されたジルベール・グランヴァルは大宰相ムハンマド・アル・ムクリとの会談に踏み切ります。アル・ムクリはフランスへ渡り、ヴィシーでグランヴァルと会って、国中に広がる民衆の動揺を踏まえればベン・アラファは退く必要があると示唆しました。こうしてモハメド5世の復位が構想されたのです。10月1日、ベン・アラファは退位しました。"
    MOR_1961_revolution.t:0 "国王モハメド5世の崩御"
    MOR_1961_revolution.d:0 "1961年2月26日、モハメドはヴォー州出身の外科医が執刀した鼻中隔の平凡な手術の合併症により死去しました。その死は息子の王太子ムーレイ・ハサンによって国営ラジオで発表され、彼はハッサン2世として王位を継ぎました。"
    MOR_1970_revolution.t:0 "議会選挙の復活？"
    MOR_1970_revolution.d:0 "1970年8月21日、モロッコで議会選挙が実施されました。7月の国民投票による新憲法の採択を受けたものです。新たな代議院の定数は240議席で、うち90議席は小選挙区の公開投票による直接選挙、90議席は地方議員による選挙、60議席は4つの職能団体による選挙で選ばれました（農業会議所24議席、商工会議所16議席、手工業会議所10議席、被雇用者代表10議席）。"
    MOR_2011_revolution.t:0 "モロッコ憲法国民投票？"
    MOR_2011_revolution.d:0 "2011年7月1日、モロッコで憲法改正をめぐる国民投票が実施されました。2011年2月20日に1万人を超えるモロッコ人が民主的改革を求めるデモに参加して以来、各地で続いた一連の抗議行動に応えて国王が呼びかけたものです。"
    
    ALG_1965_revolution.t:0 "アルジェリアのクーデター？"
    ALG_1965_revolution.d:0 "1965年のアルジェリア・クーデターにより、ウアリ・ブーメディエン大佐が革命評議会議長として権力を握りました。この無血クーデターでアルジェリア初代大統領アフメド・ベン・ベラは逮捕され、その側近たちはブーメディエンと主にアルジェリア陸軍にいた同調者たちによって投獄されました。"
    ALG_1992_revolution.t:0 "アルジェリア内戦？"
    ALG_1992_revolution.d:0 "アルジェリア内戦は、1992年1月11日（イスラム主義勢力の選挙勝利を覆すクーデターを受けて）から2002年2月8日まで、アルジェリア政府と各種のイスラム主義反政府勢力との間で戦われた内戦です。当初は政府がイスラム主義運動の鎮圧に成功したかに見え、戦いは緩やかに始まりました。しかし武装集団が次々と現れてジハードを宣言し、1994年までに暴力は政府が持ちこたえられないのではと思われるほどの水準に達しました。"
    
    JOR_1951_revolution.t:0 "ヨルダン国王アブドゥッラー1世の暗殺？"
    JOR_1951_revolution.d:0 "1951年7月20日、ヨルダン初代国王アブドゥッラー1世がエルサレムのアル＝アクサー・モスクを訪問中に暗殺されました。アブドゥッラーはレバノン初代首相リヤード・アッ＝ソルフの葬儀で弔辞を述べるためエルサレムを訪れており、孫のフセイン王子とともにモスクで金曜礼拝に参列していました。アブドゥッラーは頭部と胸部を3発撃たれ、致命傷を負いました。暗殺犯である21歳のムスタファ・シュクリ・アシューは国王の護衛によって射殺されました。この暗殺は、息子タラールが精神疾患を患っていたことから継承危機を招きました。"
    JOR_1952_revolution.t:0 "ヨルダン国王タラールの退位？"
    JOR_1952_revolution.d:0 "ヨルダン国王タラールは父の暗殺を受けた短い治世の末、精神疾患を理由に1952年に退位しました。議会は首相タウフィーク・アブー・アル＝フダの主導のもと、被害妄想と不安定な言動の兆候を認めて国王を統治不能と宣言しました。息子のフセインが王位を継ぎ、長く変革に満ちた治世が始まりました。"
    JOR_1956_revolution.t:0 "ヨルダン軍のアラブ化？"
    JOR_1956_revolution.d:0 "ヨルダン軍指揮部のアラブ化により、フセイン国王はアラブ軍団を指揮していた英国人高級将校を解任し、1956年3月1日に同軍団はヨルダン軍へと改称されました。アラブ軍団の英国人司令官グラッブ・パシャは、アラブ人として初めて同軍団の司令官となったラディ・アンナーブ少将に交代しました。フセインが軍指揮部のアラブ化を図った狙いは、英国人将校をヨルダン人将校に置き換え、英国からの政治的独立を明確にし、英国を警戒する近隣アラブ諸国との関係を改善することにありました。この決定が公表されるとヨルダンの街は大きな祝賀に沸きました。"
    JOR_1957_revolution.t:0 "ナセル主義者の粛清？"
    JOR_1957_revolution.d:0 "1957年4月、ヨルダン国王フセインはナーセル主義者が主導したクーデター未遂を鎮圧し、アラブ民族主義派の将校を粛清して議会を解散しました。ザルカを中心とするこの弾圧は汎アラブ急進主義に対する決定的な転換となりました。続いて戒厳令が敷かれて王権は強化され、ヨルダンは西側諸国および反ナーセル主義の地域大国との連携をいっそう強めることになりました。"
    JOR_1989_revolution.t:0 "ヨルダンの春？"
    JOR_1989_revolution.d:0 "1989年4月18日、緊縮政策と物価高騰に対する抗議がヨルダン全土へ広がり、フセイン国王は戒厳令を解除して22年ぶりに議会選挙を復活させました。この「ヨルダンの春」は政治的自由化への決定的な転換点となり、民主化改革を促してハーシム王国に反体制の声が現れる余地を開きました。"
    JOR_1999_revolution.t:0 "ヨルダン国王フセイン1世の死？"
    JOR_1999_revolution.d:0 "ヨルダン国王フセインは癌との闘病の末、1999年2月7日に63歳で死去しました。その死は現代ヨルダンを形作った46年間の治世の終わりを意味していました。アンマンの街路は弔問の人々で埋め尽くされ、息子のアブドゥッラー2世が速やかに宣誓就任して円滑な権力移行が確保されました。"
    
    EGY_1952_revolution.t:0 "七月革命？"
    EGY_1952_revolution.d:0 "1952年7月23日、自由将校運動によるクーデターでファールーク国王が打倒され革命が始まりました。この陸軍将校たちの集団はムハンマド・ナギーブとガマール・アブドゥル・ナーセルに率いられていました。"
    EGY_1953_revolution.t:0 "共和国宣言？"
    EGY_1953_revolution.d:0 "共和国宣言は1953年6月18日にエジプト革命指導評議会が発した憲法宣言です。この宣言によってフアード2世は廃位されエジプト王国はエジプト共和国へ移行しました。"
    EGY_1954_revolution.t:0 "ガマール・アブドゥル・ナーセルの台頭？"
    EGY_1954_revolution.d:0 "1953年1月、ナセルはナギブの反対を押し切ってすべての政党を禁止し、解放機構のもとで一党制を築きました。解放機構は緩やかな組織の運動で、主な任務はRCC支持の集会や講演を組織することであり、ナセルがその書記長を務めました。ナギブがRCCの土地改革令と距離を置き、ワフド党やムスリム同胞団といったエジプトの既成政治勢力に接近してナセルからの独立の兆しを見せ始めると、ナセルは彼を失脚させる決意を固めます。1954年2月25日、その2日前にRCCが自分の不在のまま公式会合を開いたことを受け、ナギブは辞任を表明しました。2月26日、ナセルは辞任を受け入れてナギブを自宅軟禁下に置き、RCCはナセルをRCC議長兼首相であると宣言しました。"
    EGY_1970_revolution.t:0 "アンワル・サダトの台頭？"
    EGY_1970_revolution.d:0 "ムハンマド・アンワル・アッ＝サダトはエジプトの政治家であり軍人で、1970年10月15日より第3代エジプト大統領を務めました。大統領としての11年間で彼はエジプトの針路を変え、ナセル主義の政治的・経済的信条の多くから離れて複数政党制を復活させ、インフィターハ経済政策を打ち出しました。"
    EGY_1981_revolution.t:0 "アンワル・サダト暗殺？"
    EGY_1981_revolution.d:0 "第3代エジプト大統領アンワル・サダトは、1981年10月6日にカイロで行われた戦勝記念の年次パレードの最中に暗殺されました。このパレードはバドル作戦を祝うもので、同作戦でエジプト軍はヨム・キプール戦争の緒戦にスエズ運河を渡り、イスラエルからシナイ半島を奪還していました。暗殺はエジプト・イスラム聖戦の構成員によって実行されました。"
    EGY_2013_revolution.t:0 "エジプトのクーデター？"
    EGY_2013_revolution.d:0 "2013年のエジプトのクーデターは2013年7月3日に発生しました。エジプト軍の最高司令官アブドルファッターフ・アッ＝シーシー将軍が連合勢力を率い、民主的に選出されたエジプト大統領ムハンマド・ムルシーを権力の座から追放し、2012年のエジプト憲法を停止させました。この動きは、全国規模の抗議行動が広がるなか、抗議者との「対立を解消せよ」と政府に迫る軍の最後通牒の後に起こりました。"
    
    SYR_1949_revolution.t:0 "シリアのクーデター？"
    SYR_1949_revolution.d:0 "1949年3月のシリアのクーデターは、3月30日に発生した無血クーデターです。近代シリア史上初の軍事クーデターであり、民主的に選出された同国の政府を打倒しました。これを主導したのはシリア軍参謀総長フスニー・アル=ザイームで、彼は1949年4月11日にシリア大統領となりました。アル=ザイームの権力掌握を助けた将校にはサーミー・アル=ヒンナーウィーとアディーブ・アル=シーシャクリーがおり、両名はのちに相次いで同国の軍事指導者となります。"
    SYR_1954_revolution.t:0 "シリアのクーデター？"
    SYR_1954_revolution.d:0 "アディーブ・シーシャクリー大佐は1949年12月のクーデターで権力を握り、軍事独裁体制を築きました。シリアの指導者としてシーシャクリーはアラブ系多数派の願望を汲み取り、汎アラブ主義の政策を採用します。1954年のシリアのクーデターは同年2月に起こり、シーシャクリー政権の打倒を目指したものでした。反シーシャクリー運動を主導したのは元大統領アターシーと古参のドゥルーズ派指導者スルターン・アル=アトラシュです。"
    SYR_1955_revolution.t:0 "シュクリー・アル=クーワトリーの台頭？"
    SYR_1955_revolution.d:0 "クーワトリーは1955年、アディーブ・アル=シーシャクリー大統領の追放を受け、ハーシム・アル=アターシーの大統領在任中にシリアへ帰国しました。そして63歳で1955年8月の大統領選挙に立候補します。勝利には142議席のシリア議会で3分の2の多数を確保する必要がありましたが、第1回投票でクーワトリーは最大の対立候補ハーリド・アル=アズムを89対42で破りました。これにより第2回投票が行われ、クーワトリーは91票対アズムの41票で大統領の座を勝ち取りました。"
    SYR_1963_revolution.t:0 "シリアのクーデター？"
    SYR_1963_revolution.d:0 "1963年のシリアのクーデターは、アラブ社会主義バアス党シリア地域指導部の軍事委員会によるシリアでの権力掌握です。シリアのバアス党工作員たちの計画と進行中の陰謀は、1963年2月にイラクでバアス党が権力を掌握したことに触発されたものでした。"
    SYR_1966_revolution.t:0 "シリアのクーデター？"
    SYR_1966_revolution.d:0 "1966年2月23日、アル＝ハーフィズは参謀総長サラーフ・ジャディードが率いる急進的なバアス党の一派によって打倒されました。クーデターを警告する電報はエジプト大統領ガマール・アブドゥル＝ナーセルから大統領評議会書記長ナシーム・アル＝サファルジャラーニーへ、決行当日の早朝になってようやく送られました。このクーデターは大シリアの実現を目指すジャディードの「地域主義」（クトリー）派と、より伝統的な汎アラブ主義を掲げる「民族主義」（カウミー）派すなわちアル＝ハーフィズ派との党内対立から生じたものです。"
    SYR_1970_revolution.t:0 "修正革命？"
    SYR_1970_revolution.d:0 "修正革命は1970年11月13日にシリアでハーフィズ・アル＝アサド将軍が主導した無血クーデターです。アサドは国家とバアス党の「民族主義的社会主義路線」を維持し発展させると宣言しました。バアス党は思想の見直しを行いサラーフ・ジャディードの革命輸出路線を放棄します。新たな路線はソビエト連邦の支援を受けてシリア軍を増強しイスラエルを打倒することに重点を置きました。"
    SYR_1994_revolution.t:0 "バッシャール・アル＝アサドの台頭？"
    SYR_1994_revolution.d:0 "バッシャール・ハーフィズ・アル＝アサドはシリアの元政治家であり医師にして軍人です。1980年代に医師となり1990年代初頭にはロンドンで眼科医としての研修を受けていました。1994年に兄バーセル・アル＝アサドが自動車事故で死亡すると、後継者としての兄の役割を引き継ぐためシリアへ呼び戻されました。"
    SYR_2000_revolution.t:0 "ハーフィズ・アル＝アサドの死？"
    SYR_2000_revolution.d:0 "2000年6月10日、69歳のハーフィズ・アル＝アサドはレバノン首相アル＝フスとの電話中に心臓発作で死去しました。その死後、バアス党の忠誠派の支持を得て権力は息子バッシャールへと引き継がれ、シリアはアラブの共和国として初めて世襲体制を確立することとなりました。"
    SYR_2024_revolution.t:0 "バアス党政権の崩壊？"
    SYR_2024_revolution.d:0 "2024年12月8日、バッシャール・アル＝アサド大統領の率いるバアス党体制のシリアは反体制派の大攻勢によって崩壊しました。この攻勢はシャーム解放機構が主導し、2011年に始まったシリア内戦の一環として主にトルコの支援を受けるシリア国民軍がこれを支えました。ダマスカスの陥落は、1971年の修正革命でハーフィズ・アル＝アサドが権力を掌握して以来シリアを世襲の全体主義体制として統治してきたアサド家の支配の終わりを意味しました。"
    
    LEB_1952_revolution.t:0 "カミーユ・シャムーンの台頭？"
    LEB_1952_revolution.d:0 "1952年に汚職疑惑でベシャラ・エル・クーリー大統領が辞任を余儀なくされると、後任にはシャムーンが選出されました。シャムーン政権下のレバノンは好景気に沸き、とりわけ建設・銀行・観光の各部門が活況を呈しました。彼は1954年に株式会社の設立に関する法律を、1956年には銀行機密に関する法律を成立させました。"
    LEB_1989_revolution.t:0 "ターイフ合意？"
    LEB_1989_revolution.d:0 "ターイフ合意は、フランス統治時代のレバノンで特権的地位を与えられてきたマロン派キリスト教徒共同体から権力の一部を移し、国民協約による政治体制を再編しました。ターイフ合意の後、首相は伝統的な議会制と同じく立法府に対して責任を負うこととなりました。こうしてこの合意はキリスト教徒に有利だった権力分有の比率を50対50に改め、キリスト教徒の大統領に対してスンニ派の首相の権限を強化したのです。"
    
    SUD_1958_revolution.t:0 "スーダンのクーデター？"
    SUD_1958_revolution.d:0 "正式な独立の後、議会政治は政情不安と汚職、宗派対立、そして連邦制を求める南部の要求の黙殺に彩られていました。アンサール教団の支持を受けるウンマ党とアズハリの国民統一党（NUP）との分極化は経済発展を停滞させました。議会の膠着は1958年11月17日に突如終わりを迎えます。陸軍参謀総長イブラヒム・アッブード将軍が無血クーデターを実行し、同国初の軍事独裁を樹立したのです。アッブード率いる軍最高評議会は議会を解散して憲法を停止し、すべての政党を禁止しました。"
    SUD_1964_revolution.t:0 "アッブード将軍の失脚？"
    SUD_1964_revolution.d:0 "1964年までに、南部で激化する内戦と経済的不満の高まりが軍事政権の信頼を著しく損ないました。10月には大規模な抗議行動とゼネスト——いわゆる十月革命——がアッブード将軍を辞任に追い込みます。シッル・アル＝ハティム・アル＝ハリーファを首相とする暫定管理政権が発足しました。特筆すべきは、この内閣がスーダン史上初めてスーダン共産党、ムスリム同胞団、労働組合の代表を迎え入れたことです。"
    SUD_1969_revolution.t:0 "スーダンのクーデター？"
    SUD_1969_revolution.d:0 "1969年のスーダン・クーデターは、ガアファル・ニメイリ大佐が率いたイスマイル・アル＝アズハリ大統領の政権に対するクーデターであり、成功を収めました。これはスーダンの第二次民主主義期の終わりを告げ、16年におよぶニメイリ統治の始まりとなります。ニメイリ政権は急進的なアラブ民族主義と左派的な綱領を追求し、私有財産の広範な国有化を含む社会・経済発展のための社会主義政策を導入しました。"
    SUD_1985_revolution.t:0 "スーダンのクーデター？"
    SUD_1985_revolution.d:0 "1985年のスーダンクーデターは1985年4月6日にスーダンで発生した軍事クーデターです。一団の軍将校によって起こされたこのクーデターは国防相兼国軍最高司令官のアブドッラフマーン・スワール・アッ＝ザハブ元帥に率いられ、ガアファル・ニメイリ大統領の政権に対して行われました。"
    SUD_2019_revolution.t:0 "スーダンのクーデター？"
    SUD_2019_revolution.d:0 "2019年4月11日の夕刻にスーダンでクーデターが発生し、退陣を求める民衆の抗議を受けてオマル・アル＝バシール大統領がスーダン国軍によって追放されました。当時アフメド・アワド・イブン・アウフが率いる軍は政府と国民議会を打倒して3か月間の非常事態を国内に宣言し、のちに合意が成立するまでの2年間の移行期間を設けました。"
    SUD_2021_revolution.t:0 "スーダンのクーデター？"
    SUD_2021_revolution.d:0 "2021年10月25日、アブドゥル・ファッターフ・アル＝ブルハン将軍が率いるスーダン軍が軍事クーデターによってスーダン政府を掌握しました。当初は少なくとも5名の政府高官が拘束されました。文民のアブダラ・ハムドゥーク首相はクーデターへの支持表明を拒み10月25日に民衆の抵抗を呼びかけましたが、10月26日に自宅軟禁下へ置かれました。"
    
    EQG_1968_revolution.t:0 "マシアス・ンゲマの大統領時代？"
    EQG_1968_revolution.d:0 "フランシスコ・マシアス・ンゲマは赤道ギニアの政治家であり、1968年の独立から1979年に打倒されるまで同国の初代大統領を務めました。歴史上もっとも残虐な独裁者の一人として広く記憶されています。大統領として奇怪で不安定な振る舞いを見せ、同時代の多くの者が彼を正気ではないと考えたほどでした。"
    EQG_1973_revolution.t:0 "赤道ギニアの新憲法？"
    EQG_1973_revolution.d:0 "マシアス・ンゲマは1970年7月に野党を非合法化し1972年には自らを終身大統領とすることで全体主義的な権力をさらに強固なものとしました。この体制はテオドロ・オビアンが1979年8月に起こしたクーデター、すなわち赤道ギニア最高軍事評議会を樹立したいわゆる「自由クーデター」まで維持されましたが、新憲法が承認されたのは1982年8月のことでした。"
    EQG_1979_revolution.t:0 "テオドロ・オビアンのクーデター？"
    EQG_1979_revolution.d:0 "1979年の赤道ギニアのクーデターは1979年8月3日に発生し、フランシスコ・マシアス・ンゲマ大統領の甥であるテオドロ・オビアン・ンゲマ・ンバソゴが流血のクーデターによって彼を打倒しました。忠誠派と反乱軍の戦闘はマシアス・ンゲマが8月18日にカメルーンへ逃亡しようとして捕らえられるまで続きました。彼はブビ族に対するジェノサイドの罪およびその他の犯罪により死刑を宣告され1979年9月29日に銃殺刑に処されました。テオドロはそれ以来、当初は革命軍事評議会と最高軍事評議会の議長として、その後は大統領として指導者の座にあり続けています。"
    
    CMR_1960_revolution.t:0 "アマドゥ・アヒジョの大統領就任？"
    CMR_1960_revolution.d:0 "アマドゥ・ババトゥラ・アヒジョ（1924年8月24日～1989年11月30日）は1960年から1982年までカメルーンの初代大統領を務めた同国の政治家です。それ以前は1960年1月の独立から大統領職の創設に伴う同年5月まで初代首相を務めました。アヒジョは1960年のカメルーンの独立国家としての成立、そしてフランス語圏と英語圏の統合において大きな役割を果たしました。在任中アヒジョは中央集権的な政治体制を確立しました。"
    CMR_1966_revolution.t:0 "カメルーンの一党制国家？"
    CMR_1966_revolution.d:0 "1961年、アヒジョは一党制国家の樹立を訴え始めました。1962年3月12日、アヒジョは自らの体制への批判を禁じる法令を公布し、政府当局や法律に対する反逆で有罪となった者を投獄する権限を政府に与えました。1962年7月、アヒジョとともに政権に参加していた野党指導者たちが、一党制国家の主張は独裁的であるとして異議を唱えました。これらの指導者は政府への反逆を理由に逮捕・裁判にかけられ投獄されました。1966年9月1日、アヒジョの政党であるカメルーン国民同盟（CNU）が唯一の合法政党となりました。"
    CMR_1972_revolution.t:0 "カメルーンの憲法国民投票？"
    CMR_1972_revolution.d:0 "1972年5月20日、カメルーンで憲法国民投票が実施されました。新憲法は、従来の連邦制に代えて国家を単一国家とし、あわせてアマドゥ・アヒジョ大統領により大きな権限を与えるものでした。投票率98％、賛成99.99％で可決されたとされています。"
    CMR_1982_revolution.t:0 "アマドゥ・アヒジョの辞任？"
    CMR_1982_revolution.d:0 "アヒジョは表向き健康上の理由から1982年11月4日に辞任し、2日後にポール・ビヤ首相が後を継ぎました。自身のような北部のムスリムではなく南部のキリスト教徒であるビヤに譲ったことは、意外だと受け止められました。アヒジョの真意は明らかではありません。健康が回復した後に大統領職へ復帰するつもりだった可能性もあれば、ビヤはあくまで暫定的な役割で、後任の首相となった同じ北部出身のムスリムであるマイガリ・ベロ・ブバを最終的な後継者に据えるつもりだった可能性もあります。"
    
    NGE_1966_revolution.t:0 "ナイジェリアのクーデター？"
    NGE_1966_revolution.d:0 "ナイジェリアの軍事独裁とは、1966年から1999年まで（1979年から1983年までの中断を挟んで）ナイジェリア軍の将校たちが国の実権を握った時代を指します。軍はしばしばエリート層の暗黙の支持を得ながら、クーデターによって権力の座に就きました。"
    NGE_1999_revolution.t:0 "民主主義への回帰？"
    NGE_1999_revolution.d:0 "数週間にわたって国を事実上麻痺させた大規模な市民の抗議を受け、大統領はついに文民政権へ権力を委ねるという約束を果たしました。政治活動の禁止は解除され、政治犯は収容施設から釈放されました。そして新たな大統領を選ぶ選挙が実施されることになりました。"
    
    NIG_1960_revolution.t:0 "ハマニ・ディオリの大統領時代？"
    NIG_1960_revolution.d:0 "ハマニ・ディオリはニジェール共和国の初代大統領です。1960年にニジェールがフランスから独立した際、その地位に就きました。彼の政権では汚職が常態化していましたが、アフリカ問題の代弁者として、また紛争の調停者として人望を集め、国際的な尊敬を得ました。"
    NIG_1974_revolution.t:0 "ニジェールのクーデター？"
    NIG_1974_revolution.d:0 "1974年4月15日、セイニ・クンチェ中佐が軍事クーデターを主導し、14年に及ぶディオリの統治を終わらせました。クーデターは4月15日午前1時に始まり、ごく一部を除くすべての部隊がただちに首謀者側への支持を表明しました。抵抗したのはハマニ・ディオリ大統領の親衛隊であり、トゥアレグ人のみで構成された共和国親衛隊だけで、大統領夫人アイサ・ディオリの命令によるものでした。彼女と少数の親衛隊員は4月15日の夜明け後、大統領官邸で殺害されました。ディオリと国民議会議長ブブ・ハマ、そしてニアメにいた他の数名のPPNの政治家がこの作戦で逮捕されました。"
    NIG_1987_revolution.t:0 "セイニ・クンチェの死？"
    NIG_1987_revolution.d:0 "クンチェの健康は1986年末に衰え、1987年に入ってさらに悪化しました。彼は1987年11月10日、パリの病院で脳腫瘍により死去しました。アリ・サイブが後を継ぎ、1987年11月14日に最高軍事評議会（CMS）の議長に就任しました。"
    NIG_1993_revolution.t:0 "ニジェールにおける民主主義の回復？"
    NIG_1993_revolution.d:0 "1990年初頭、学生による騒乱とトゥアレグによるチンタバラデン襲撃をきっかけに1991年の国民会議が開かれ、最終的に一党制が解体されてサイブーはほぼ無力な存在となりました。1991年3月のMNSD党大会でサイブーは軍の支持を大きな後ろ盾として党首の座を維持します。しかし同年のうちに国民会議はサイブーが予定されていた大統領選挙に出馬することを禁じ、1991年11月のMNSD党大会では党首の座をママドゥ・タンジャに明け渡しました。1993年3月にマハマヌ・ウスマンが大統領に選出されると、サイブーは4月16日に大統領職をマハマヌへ引き渡し、故郷の村へと隠棲しました。現職大統領が平和的に野党へ権力を委譲した初めての事例でした。"
    NIG_1996_revolution.t:0 "ニジェールのクーデター？"
    NIG_1996_revolution.d:0 "1996年のニジェールクーデターは、1996年1月27日にニジェールのニアメで発生した軍事クーデターです。就任から3年近くが経っていたニジェール初の民選大統領マハマヌ・ウスマンを追放し、イブラヒム・バレ・マイナサラ将軍を国家元首の座に据えました。ハマ・アマドゥ首相はクーデターの最中に逮捕され、戦闘では複数の兵士と大統領警護隊員が死亡しました。"
    NIG_1999_revolution.t:0 "ニジェールのクーデター？"
    NIG_1999_revolution.d:0 "1999年のニジェールクーデターは1999年4月9日に発生し、イブラヒム・バレ・マイナサラ大統領の死と、4月11日のダウダ・マラム・ワンケの大統領就任という結果をもたらしました。マイナサラは不可解な状況下で待ち伏せを受け銃撃されています。現場はディオリ・ハマニ国際空港（国外脱出を図っていた最中であった可能性があります）か軍の基地のいずれかであり、実行したのは大統領警護隊の隊員と見られています。"
    NIG_2010_revolution.t:0 "ニジェールのクーデター？"
    NIG_2010_revolution.d:0 "2010年2月18日、ニジェールでクーデターが発生しました。兵士たちは正午に銃撃を加えながらニアメの大統領官邸を襲撃し、当時閣議を主宰していたマママドゥ・タンジャ大統領を拘束しました。同日遅く、反乱部隊はテレビを通じて、騎兵大隊長サルー・ジボを議長とする民主主義回復最高評議会（CSRD）の結成を発表しました。"
    NIG_2023_revolution.t:0 "ニジェールのクーデター？"
    NIG_2023_revolution.d:0 "2023年7月26日、ニジェールでクーデターが発生し、同国の大統領警護隊がモハメド・バズム大統領を解任して拘束しました。その後、大統領警護隊司令官のアブドゥラハマネ・チアニ将軍は、クーデターの成功を確認したうえで自らを国家の指導者と宣言し、母国防衛国家評議会を設立しました。"
    
    IVC_1960_revolution.t:0 "コートジボワールの新たな実力者？"
    IVC_1960_revolution.d:0 "コートジボワールは1960年、フェリックス・ウフエ＝ボワニに率いられて独立を達成しました。彼は1993年まで同国を統治します。地域の基準では比較的安定しており、西アフリカの近隣諸国と緊密な政治的・経済的関係を築く一方で、西側諸国、とりわけフランスとの密接な関係を維持しました。しかしその安定は1999年のクーデターと2度の内戦——2002年から2007年まで、そして2010年から2011年にかけて——によって損なわれました。"
    IVC_2000_revolution.t:0 "民主主義への回帰？"
    IVC_2000_revolution.d:0 "数週間にわたって国を事実上麻痺させた大規模な市民の抗議を受け、大統領はついに文民政権へ権力を委ねるという約束を果たしました。政治活動の禁止は解除され、政治犯は収容施設から釈放されました。そして新たな大統領を選ぶ選挙が実施されることになりました。"
    
    MAL_1960_revolution.t:0 "マリのクーデター？"
    MAL_1960_revolution.d:0 "セネガルの離脱を経て、マリ共和国が成立しました。長期にわたる一党支配の後、1991年のクーデターによって新憲法が制定され、マリは民主的な複数政党制国家となりました。2012年1月にはマリ北部で武力紛争が勃発し、トゥアレグ人の反乱勢力が北部の領域を制圧、4月には新国家アザワドの分離独立を宣言しました。この紛争は2012年3月の軍事クーデターと、その後のトゥアレグ勢力と他の反乱諸派との戦闘によってさらに複雑なものとなりました。"
    MAL_1991_revolution.t:0 "民主主義への回帰？"
    MAL_1991_revolution.d:0 "長期にわたる一党支配の後、1991年のクーデターによって新憲法が制定され、マリは民主的な複数政党制国家となりました。2012年1月にはマリ北部で武力紛争が勃発しました。この紛争は2012年3月の軍事クーデターと、その後のトゥアレグ勢力と他の反乱諸派との戦闘によってさらに複雑なものとなりました。クーデターの後には「全会一致」の国際的非難、周辺諸国による厳しい制裁、そしてトゥアレグ勢力によるマリ北部の急速な喪失が続きました。4月6日、軍事政権は制裁の解除と引き換えに権力の座を退くことに同意し、国民議会議長ディオンクンダ・トラオレが率いる暫定政府へ権力を委ねました。"
    
    CHA_1960_revolution.t:0 "チャドのクーデターか？"
    CHA_1960_revolution.d:0 "1960年、チャドはフランソワ・トンバルバイの指導の下で独立を達成しました。イスラム教徒の多い北部では彼の政策への反発が高まり、1965年の長期にわたる内戦の勃発へとつながりました。1979年に反乱勢力は首都を制圧し、南部の覇権に終止符を打ちました。その後、反乱軍の指揮官たちは互いに争い、最終的にイセン・ハブレが競合相手を打ち破りました。チャド・リビア紛争は1978年のリビアの侵攻によって始まり、1987年のフランスによる軍事介入（エペルヴィエ作戦）で終息しました。そのイセン・ハブレも1990年、自らの配下の将軍イドリス・デビによって打倒されました。"
    CHA_1991_revolution.t:0 "チャドのクーデターか？"
    CHA_1991_revolution.d:0 "デビは1990年12月にアブレに対するクーデターを主導して権力を握りました。前任者たちによる数十年の一党支配を経て1992年に複数政党制を導入したものの、その大統領在任中は一貫して彼の愛国救済運動が支配的な政党であり続けました。デビは1996年と2001年の大統領選挙に勝利し、任期制限が撤廃された後も2006年、2011年、2016年、2021年と勝利を重ねました。"
    
    RWA_1973_revolution.t:0 "ルワンダのクーデター？"
    RWA_1973_revolution.d:0 "フツ出身のハビャリマナはルワンダ初代大統領グレゴワール・カイバンダの下で国防相をはじめとする治安関係の要職を歴任しました。1973年のクーデターでカイバンダを打倒すると新たな大統領となり、やがて前任者の親フツ政策を引き継ぎます。その統治下でルワンダは全体主義的な一党制国家となり、与党MRNDの取り締まり役たちは「アニマシオン」と称する政治集会で大統領を讃える唱和と踊りを人々に強いました。"
    RWA_1994_revolution.t:0 "フツ政権の崩壊？"
    RWA_1994_revolution.d:0 "1990年、ツチ主導のルワンダ愛国戦線（RPF）が彼の政権に対してルワンダ内戦を開始しました。3年に及ぶ戦いの末、ハビャリマナは1993年にRPFとの和平合意としてアルーシャ協定に署名します。その翌年、ブルンジ大統領シプリアン・ンタリャミラも同乗していた彼の飛行機がキガリ近郊でミサイルによって撃墜され、彼は謎の死を遂げました。この暗殺は地域の民族対立に火をつけツチに対するジェノサイドを招く一因となりました。ツチのRPFは攻勢を再開し、着実に各地を制圧して7月中旬までに全土を掌握しました。"
    RWA_2000_revolution.t:0 "ポール・カガメの台頭？"
    RWA_2000_revolution.d:0 "ビジムングは2000年、RPFとの対立の末に辞任しました。辞任を強いられた可能性が高いとみられています。後任にはカガメが就きました。ビジムングはその後、汚職と民族対立の扇動の罪で投獄されましたが、人権団体はこの起訴を政治的な動機によるものだと指摘しています。カガメの統治は権威主義的とみなされており、人権団体は彼による政治的弾圧を非難しています。"
    
    GAM_1994_revolution.t:0 "ヤヒヤ・ジャメのクーデター？"
    GAM_1994_revolution.d:0 "1994年7月22日、ヤヒヤ・ジャメ率いる下級将校たちが汚職と失政を理由にガンビアのダウダ・ジャワラ大統領の政権を打倒しました。この無血クーデターはジャワラの30年近い統治を終わらせ、憲法を停止して軍事政権を樹立しました。"
    GAM_2017_revolution.t:0 "ヤヒヤ・ジャメの失脚？"
    GAM_2017_revolution.d:0 "2016年12月、ヤヒヤ・ジャメはガンビアの大統領選挙でアダマ・バロウに敗れたものの敗北を認めず、憲法上の危機を招きました。ECOWASが軍事介入に踏み切ると、ジャメは2017年に赤道ギニアへ亡命しました。バロウが大統領に就任し、ジャメの22年にわたる権威主義体制は終わりを迎え、新たな民主主義の時代が幕を開けました。"
    
    SEN_1960_revolution.t:0 "レオポール・セダール・サンゴールの台頭？"
    SEN_1960_revolution.d:0 "レオポール・セダール・サンゴールは1906年10月9日、セネガルのジョアルに生まれました。パリで教育を受け、詩人として頭角を現すとともにネグリチュード運動の創始者の一人としてアフリカの文化的アイデンティティを擁護しました。第二次世界大戦後に帰国すると政界に入り、セネガルを自治へと導き、フランスとの現実的な関係を保ちながらアフリカ社会主義を築き上げました。1960年9月6日には独立セネガルの初代大統領となり、若き国家を20年にわたる安定と末長く続く文化的復興へと導きました。詩的な構想力と卓越した政治手腕を併せ持つその姿は、脱植民地期のアフリカを作り変えた先駆的思想家として歴史に刻まれています。"
    SEN_1962_revolution.t:0 "ママドゥ・ディアのクーデター未遂？"
    SEN_1962_revolution.d:0 "1962年12月、セネガルのママドゥ・ディア首相は深刻なイデオロギー的亀裂のさなか、レオポール・セダール・サンゴール大統領に対するクーデターを画策したとして告発されました。筋金入りの社会主義者であったディアは経済政策と議会の掌握をめぐってサンゴールと衝突していました。ディアが不信任投票の阻止を図ると、サンゴールはこれを権力奪取の企てと解釈したのです。ディアは逮捕され反逆罪で裁かれて終身刑を宣告されましたが、多くの歴史家はこの事件を真のクーデターではなく政治的な策動とみなしています。彼の失脚はセネガル政治が大統領優位へと傾く転換点となり、二頭体制という短い実験に終止符を打ちました。"
    SEN_1975_revolution.t:0 "セネガルの部分的自由化？"
    SEN_1975_revolution.d:0 "レオポール・セダール・サンゴール大統領のもとでセネガルは事実上の一党制国家から統制された複数政党制へと移行しました。この「受動的革命」はそれぞれ異なるイデオロギー的立場を代表する3党までの合法化により限定的な野党活動を認めつつ、国家による厳しい監督を維持するものでした。この措置はサンゴールの権威を揺るがすことなく統治を近代化するために考案されたものです。1975年の自由化は政治的開放と体制の継続性のあいだで均衡を図る戦略的な試みを映し出しています。"
    SEN_1980_revolution.t:0 "セネガルにおける複数政党制民主主義の復活？"
    SEN_1980_revolution.d:0 "サンゴールの退任とアブドゥ・ディウフによる平和的な権力継承は民主主義の規範が深まったことを示すものでした。ディウフは1975年の部分的自由化を足がかりに政治的自由を拡大し、それまで課されていた硬直的なイデオロギーの枠組みを超えて、より多くの政党の活動を認めました。この移行は政治的安定と文民統治という西アフリカにおけるセネガルの評判を確かなものにします。1980年の転換は競争的な選挙と活気ある政治情勢の礎を築き、脱植民地期における漸進的かつ平和的な民主化の模範としてセネガルを際立たせました。"
    
    SIL_1964_revolution.t:0 "アルバート・マーガイの首相時代？"
    SIL_1964_revolution.d:0 "アルバート・マルガイは1964年から1967年までシエラレオネの首相を務め、兄ミルトン・マルガイの後を継ぎました。その政権は権力の集中と国民統合の推進に力を注ぎましたが、軍の政治利用や一党制国家への移行の試みといった政策は物議を醸しました。特定民族の優遇と強まる権威主義は国民の信頼を損ない、政情不安を招きました。"
    SIL_1968_revolution.t:0 "シアカ・スティーブンスの首相就任？"
    SIL_1968_revolution.d:0 "シアカ・スティーブンスは1968年から1971年までシエラレオネの首相を務め、長期政権の礎を築きました。その就任は政情不安と軍政の時代を経てのものであり、彼はただちに全人民会議のもとへ権力を集中させました。スティーブンスは経済ナショナリズムと中央集権的統治を掲げましたが、その在任中には権威主義の強まりと反対派の弾圧も進みました。1971年には共和制へ移行し、初代の執行大統領となりました。この時期の指導手法と政治的駆け引きは、大衆迎合的な言説と国家機構への厳しい統制を併せ持ち、その後数十年にわたって国の針路を決定づけました。"
    SIL_1985_revolution.t:0 "ジョゼフ・サイドゥ・モモの首相就任？"
    SIL_1985_revolution.d:0 "ジョゼフ・サイドゥ・モモは1985年にシエラレオネの首相となってシアカ・スティーブンスの後を継ぎ、のちに大統領職も引き継ぎました。元陸軍大将であったモモは改革と国家再生を誓いましたが、深刻化する経済危機と蔓延する汚職の中で成果を上げられませんでした。その政権は国民の不満の高まり、荒廃する社会基盤、生活水準の低下に直面しました。政治的自由化の試みもほとんど名目上のものにとどまり、与党の全人民会議が厳しい統制を保ち続けました。"
    SIL_1992_revolution.t:0 "ヴァレンタイン・ストラッサーのクーデター？"
    SIL_1992_revolution.d:0 "ヴァレンタイン・ストラッサーは1992年から1996年までシエラレオネの国家元首を務め、軍事クーデターの後に25歳で世界最年少の大統領となりました。その統治は改革と汚職撲滅の約束とともに始まりましたが、まもなく権威主義的な統制と激化する内戦によって特徴づけられるようになります。国家暫定統治評議会の議長としてストラッサーは経済の安定化と反乱勢力への対処に苦しみました。当初は国民の支持を得ていたものの、内部の不満と進展の欠如の中でその指導力は揺らいでいきました。"
    SIL_1996_revolution.t:0 "民主主義の復活？"
    SIL_1996_revolution.d:0 "1996年、シエラレオネは長年の軍政と社会不安を経て民主制へと復帰しました。2月と3月に実施された画期的な選挙は、1977年以来初の複数政党制による投票となりました。革命統一戦線（RUF）との紛争が続く中でも国民は民主的な手続きを受け入れ、シエラレオネ人民党（SLPP）のアハマド・テジャン・カバーを大統領に選出しました。この勝利は文民統治と立憲秩序への希望ある転換を示すものでした。選挙は議会における代表制も復活させ、国家暫定統治評議会による4年間の軍事支配を終わらせ、脆弱な和平プロセスの中で民主的な諸制度を蘇らせました。"
    
    GHA_1960_revolution.t:0 "クワメ・エンクルマの統治？"
    GHA_1960_revolution.d:0 "フランシス・クワメ・エンクルマはガーナの政治家であり、政治理論家であり、革命家でもありました。1952年から、英国からの独立を果たす1957年までゴールドコーストの首相を務めました。その後1957年から1966年までガーナの初代首相、次いで大統領を務めました。その政権は社会主義的であると同時に民族主義的でした。国家的な工業・エネルギー事業に資金を投じ、強固な国民教育制度を整備し、パン・アフリカ主義の文化を推進しました。エンクルマの下でガーナは脱植民地化の時代におけるアフリカの国際関係で主導的な役割を果たしました。"
    GHA_1966_revolution.t:0 "ガーナのクーデター？"
    GHA_1966_revolution.d:0 "1966年2月、ンクルマが北ベトナムと中国を国賓訪問している最中に、その政府は文民官僚機構の支持を受けた国軍と警察による暴力的なクーデターで打倒されました。ジョゼフ・アーサー・アンクラに率いられた首謀者たちは自らを国民解放評議会と称し、3年間にわたり軍事政権として国を統治しました。ンクルマを打倒したクーデターの指導者たちはただちに国境と刑務所の門を開き、ンクルマに反対するすべての者について亡命先からの帰国と予防拘禁からの釈放を認めました。彼らは官僚による内閣を任命し、可能な限り速やかに民主的な政府を回復すると約束しました。"
    GHA_1979_revolution.t:0 "ガーナのクーデター？"
    GHA_1979_revolution.d:0 "6月4日革命は、1979年にガーナで発生した蜂起であり、ガーナ軍の下級兵士と将校の対立によって引き起こされました。ローリングスは反乱を起こした下級将校たちによって軍革命評議会（AFRC）の議長に任命され、進行中の選挙が完了するまで国政を担いました。ローリングスは1979年9月にヒラ・リマン博士へ権力を移譲しました。その後ローリングスは1981年12月31日にリマン政権を打倒しました。"
    GHA_1992_revolution.t:0 "民主主義の回復？"
    GHA_1992_revolution.d:0 "1981年のクーデターで権力を握って以来、国を率いてきたジェリー・ローリングスは、その年の初めに複数政党制の選挙を実施することをしぶしぶ承諾していました。ローリングスは自身の国民民主会議を含む進歩同盟の候補として出馬し、得票率58.4％を得て決選投票を経ずに勝利しました。投票率は50.2％でした。"
    
    GUI_1960_revolution.t:0 "アフメド・セク・トゥーレの統治？"
    GUI_1960_revolution.d:0 "アハメド・セク・トゥーレはギニアの政治指導者にしてアフリカの政治家であり、1958年から1984年に死去するまでギニアの初代大統領を務めました。トゥーレはフランスからの独立獲得に関わった主要なギニア民族主義者の一人でした。1960年、トゥーレはPDGを唯一の合法政党と宣言しましたが、ギニアは独立以来すでに事実上の一党制国家でした。以後24年にわたり、トゥーレは国の統治権力をほぼ一手に握り続けました。"
    GUI_1984_revolution.t:0 "ギニアのクーデター？"
    GUI_1984_revolution.d:0 "1984年のギニアのクーデターは、1984年4月3日にギニアで起きた無血の軍事クーデターであり、ランサナ・コンテ大佐が主導しました。これにより1972年から首相の座にあったルイ・ランサナ・ベアボギが失脚しました。ベアボギは、長年大統領を務めたアハメド・セク・トゥーレが3月に合衆国のクリーブランド・クリニックで緊急の心臓手術中に死去して以降、暫定大統領を務めていました。"
    GUI_1993_revolution.t:0 "民主主義の回復？"
    GUI_1993_revolution.d:0 "独立以来初となる複数政党制の大統領選挙が1993年12月19日に実施されました。新たに結成された統一進歩党（PUP）の候補コンテは51.7％を得票し、決選投票をかろうじて回避しました。ギニア人民連合（RPG）のアルファ・コンデは19.6％を得票して2位でした。"
    
    GAB_1961_revolution.t:0 "レオン・ムバの台頭？"
    GAB_1961_revolution.d:0 "1961年に選出されたガボン初代大統領はレオン・ムバであり、その副大統領はオマール・ボンゴ・オンディンバでした。ムバは権力を握ると報道を統制し政治的なデモを弾圧して表現の自由を制限し、他の政党を徐々に権力から排除し、フランスに倣って憲法を改め大統領職に権力を集中させました。その大統領職にはムバ自身が就いています。1964年1月、ムバが一党制を敷くため国民議会を解散すると、軍がクーデターを起こして彼を権力の座から追い議会制民主主義を回復しようとしました。しかしフランス軍の空挺部隊が24時間以内に飛来しムバを復権させました。数日間の戦闘の末クーデターは終結し、反対派は投獄されて抗議と暴動が相次ぎました。"
    GAB_1967_revolution.t:0 "オマール・ボンゴの台頭？"
    GAB_1967_revolution.d:0 "オマール・ボンゴ・オンディンバはガボンの政治家であり、1967年から2009年に死去するまで第2代ガボン大統領を務めました。ガボン民主党（PDG）に所属するボンゴは、1960年代に初代大統領レオン・ムバのもとで若き高官として要職に抜擢され、1966年には自らの力で第2代副大統領に選出されました。1967年、ムバの死去を受けて彼は同国の大統領となりました。"
    GAB_1993_revolution.t:0 "ガボンの複数政党制民主主義？"
    GAB_1993_revolution.d:0 "1990年5月22日、ストライキや暴動、騒乱を経て、PDG中央委員会と国民議会は複数政党制への移行を進めるための憲法改正を承認しました。1994年まで有効な現職の大統領任期は尊重されることとなりました。以後の大統領選挙は複数の候補者によって争われ、大統領の任期は5年、再選は1回までと改められました。1993年12月、ボンゴは新たな複数政党制憲法のもとで行われた最初の大統領選挙に、約51.4％というかなりの僅差で勝利しました。"
    GAB_2009_revolution.t:0 "アリ・ボンゴの大統領就任？"
    GAB_2009_revolution.d:0 "アリ・ボンゴ・オンディンバはガボンの元政治家であり独裁者で、2009年から2023年のクーデターで失脚するまで第3代ガボン大統領を務めました。ガボン民主党に所属し、1967年から2009年に死去するまで大統領だったオマール・ボンゴの息子です。"
    GAB_2023_revolution.t:0 "ガボンのクーデター？"
    GAB_2023_revolution.d:0 "2023年8月30日、8月26日に実施された総選挙で現職のアリ・ボンゴ大統領が勝利したと発表された直後にガボンでクーデターが発生しました。指導者のブリス・オリギ・ンゲマはボンゴ家の一員であり、従兄弟にあたるアリ・ボンゴを打倒しました。このクーデターによりオマールとアリのボンゴ父子による56年間のガボン支配は終わりを迎えました。一部からは宮廷クーデターと評されています。"
    
    BEN_1960_revolution.t:0 "ダホメの一党制国家？"
    BEN_1960_revolution.d:0 "1960年、ダホメはフランスから独立し複数政党制民主主義を短期間試みました。同年末までにユベール・マガが権力を掌握し、野党を非合法化してダホメを一党制国家と宣言しました。"
    BEN_1970_revolution.t:0 "ダホメの三頭政治？"
    BEN_1970_revolution.d:0 "1970年、ダホメの政治危機はアフリカ初の合議制大統領職を生み出しました。ユベール・マガ、ジュスタン・アホマデグベ、スルー＝ミガン・アピティの3名が輪番制の三頭体制を組み、地域間の対立を均衡させるため各自が2年ずつ統治しました。革新的ではあったものの、この仕組みは不安定だと判明しました。"
    BEN_1972_revolution.t:0 "ベナン人民共和国？"
    BEN_1972_revolution.d:0 "ベナン人民共和国はアフリカ大陸のギニア湾に面した共産主義国家で、1990年に現在のベナンとなりました。人民共和国は1972年のダホメ共和国におけるクーデターを経て、1975年11月30日に成立しました。"
    BEN_1990_revolution.t:0 "ベナンにおける複数政党制民主主義の復活？"
    BEN_1990_revolution.d:0 "社会的・政治的混乱と壊滅的な経済状況、そして東欧における共産主義体制の崩壊を受け、ケレク大統領は自らの体制を終わらせることに同意しました。1989年2月にはベナンの11人の司教が署名した司牧書簡が人民共和国への非難を表明しました。1989年12月7日、ケレクは先手を打ち、マルクス・レーニン主義の放棄と政治局の解体、党中央委員会の閉鎖を告げる公式声明を発表して国民を驚かせました。1990年には暫定政権が樹立され、複数政党制の復活への道が開かれました。新憲法は1990年12月の国民投票で採択されました。ベナンという正式国名はそのまま維持され、国はベナン共和国となりました。"
    
    CUB_1959_revolution.t:0 "キューバ革命？"
    CUB_1959_revolution.d:0 "キューバ革命はフィデル・カストロが率いた武装蜂起であり、最終的にフルヘンシオ・バティスタの残虐な独裁政権を打倒しました。革命は1953年7月26日のキューバ軍兵営への襲撃失敗から始まりましたが、1958年末までにカストロの7月26日運動に集うゲリラ革命家たちがキューバで優位に立ち、1959年1月1日にバティスタを島からの逃亡へ追い込みました。"
    CUB_2006_revolution.t:0 "ラウル・カストロの台頭？"
    CUB_2006_revolution.d:0 "兄の病のため、カストロは2006年7月31日からの一時的な権力移譲により国家評議会議長代行となりました。なお病床にあった兄が2008年2月19日に再選を目指さないと表明したことを受け、カストロは2008年2月24日に国民議会によって正式に議長へ選出されました。2013年2月24日には議長に再選されました。その直後、カストロは2期目を最後の任期とし2018年には再選を目指さないと発表しました。"
    CUB_2019_revolution.t:0 "キューバ憲法国民投票？"
    CUB_2019_revolution.d:0 "2019年2月24日に実施されたキューバ憲法国民投票は、有効票の90.6％の賛成により新憲法を承認しました。この改革は私有財産の承認、大統領の任期制限、市民的権利の拡大、統治機構の改編をもたらしました。新憲法は2019年4月10日に発効しました。"
    
    HAI_1946_revolution.t:0 "クーデター？"
    HAI_1946_revolution.d:0 "政権は破産寸前で経済の低迷にも苦しむなか、レスコは債務返済の猶予を求めてアメリカに訴えましたが受け入れられませんでした。ドミニカ共和国のトルヒーヨとの関係も破綻しました。1946年、反体制系の新聞を封じ込めようとした彼の試みは激しい学生デモを招き、ポルトープランスで反乱が勃発しました。レスコは軍警備隊にデモの鎮圧を命じようとしましたが拒まれました。身の危険を確信したレスコと閣僚たちは国外へ亡命しました。やがてデュマルセ・エスティメがレスコの後を継いで共和国の元首となり、アメリカによる占領以来初のハイチの黒人大統領となりました。"
    HAI_1950_revolution.t:0 "クーデター？"
    HAI_1950_revolution.d:0 "1946年8月、デュマルセ・エスティメがダンテス・ルイ・ベルガルドを破りハイチ大統領に選出されました。マグロワールは野党の側に回りMOP（労農運動）を創設します。1950年5月、軍事評議会が組織したクーデターがエスティメ政権を打倒し、その指導者ポール・マグロワールを国家元首の座に据えました。マグロワールは同年10月に大統領へ選出されることになります。エスティメはフランク・ラヴォー率いるハイチ軍によってまもなく退けられ、亡命しました。"
    HAI_1957_revolution.t:0 "フランソワ・デュヴァリエの台頭？"
    HAI_1957_revolution.d:0 "フランソワ・デュヴァリエはハイチの政治家にしてブードゥー教の信奉者であり、1957年から1971年に死去するまでハイチ大統領を務めました。1958年の軍事クーデターを未然に阻止した後、その体制は急速に独裁的かつ専制的な色を強めました。政府の秘密暗殺部隊トントン・マクートは、デュヴァリエの反対者を見境なく拷問し殺害しました。デュヴァリエはさらにハイチの神話的要素を個人崇拝へ取り込むことで支配の強化を図りました。"
    HAI_1971_revolution.t:0 "フランソワ・デュヴァリエの死"
    HAI_1971_revolution.d:0 "1971年4月、ジャン＝クロード・デュヴァリエは父フランソワ・デュヴァリエの死を受けて19歳でハイチ大統領に就任しました。これは世界最年少の大統領であり、王族以外で20歳未満の国家指導者としても唯一の例です。"
    HAI_1986_revolution.t:0 "ジャン＝クロード・デュヴァリエの失脚"
    HAI_1986_revolution.d:0 "1985年に地方で反乱が始まりました。最初に街頭デモと食糧配給倉庫の襲撃が起きたのはゴナイーヴでした。1985年10月から1986年1月にかけて抗議はカパイシャンを含む他の6都市へ広がりました。デュヴァリエは1986年2月7日に国外へ逃亡しました。"
    HAI_1994_revolution.t:0 "民主主義の復活"
    HAI_1994_revolution.d:0 "1994年9月、アメリカはハイチ軍指導部の退陣と、アップホールド・デモクラシー作戦による2万人の米軍の平和的進駐を交渉で取り付けました。これにより民主的に選ばれたジャン＝ベルトラン・アリスティドの大統領復帰が実現し、彼は10月にハイチへ戻って任期を全うしました。合意の一環としてアリスティドはハイチ経済の立て直しを図るべく自由市場改革の実施を迫られましたが、その成果はまちまちでした。"
    HAI_2004_revolution.t:0 "クーデター？"
    HAI_2004_revolution.d:0 "数週間にわたる衝突の末、2004年2月29日にハイチでクーデターが発生しジャン＝ベルトラン・アリスティド大統領が解任されました。2月5日、ハイチ解放再建国民革命戦線を名乗る反乱勢力がハイチ第4の都市ゴナイーヴを掌握しました。2月22日までに反乱勢力は第2の都市カパイシャンを制圧し、2月末には首都ポルトープランスを包囲していました。2月29日朝、アリスティドは物議を醸す状況下で辞任し、米軍と治安要員によってハイチから空路で運び出されました。"
    
    DOM_1961_revolution.t:0 "ラファエル・トルヒーヨの暗殺？"
    DOM_1961_revolution.d:0 "1961年5月30日、ラファエル・トルヒーヨはアントニオ・インベルト・バレーラ将軍の率いる一団によって暗殺されました。直後にトルヒーヨの息子ラムフィスが一時的に国を掌握し謀議者の大半を処刑します。しかし1961年11月には名目上の大統領ホアキン・バラゲールがトルヒーヨ一族を国外へ追いやり体制を開放する改革に着手しました。この暗殺は内乱を招き、ドミニカ内戦と米国・米州機構（OAS）の介入を経て、1966年に複数政党制のもとでようやく安定しました。"
    DOM_1963_revolution.t:0 "フアン・ボッシュの選挙？"
    DOM_1963_revolution.d:0 "フアン・エミリオ・ボッシュ・イ・ガビーニョはドミニカの政治家・歴史家・作家・随筆家・教育者であり、1963年のごく短い期間ながらドミニカ共和国で初めて民主的に選出された大統領となった人物です。それ以前は25年以上にわたりラファエル・トルヒーヨの独裁体制に対抗するドミニカ亡命反体制派を率いていました。"
    
    GND_1979_revolution.t:0 "グレナダ革命？"
    GND_1979_revolution.d:0 "人民革命政府（PRG）は、マルクス・レーニン主義のニュージュエル運動が革命によってグレナダ政府を打倒した後、1979年3月13日に樹立を宣言されました。これによりグレナダは英連邦で唯一の社会主義国家となったのです。"
    GND_1984_revolution.t:0 "グレナダからの撤退？"
    GND_1984_revolution.d:0 "1983年12月に米軍がグレナダから撤退すると、スクーン総督はニコラス・ブラスウェイトを議長とする暫定諮問評議会を任命し新たな選挙の準備にあたらせました。1976年以来初となる民主的な選挙は1984年12月に実施され、ハーバート・ブレイズ率いる新国民党が勝利します。ブレイズは1989年12月に死去するまで首相を務めました。"
    
    RHO_UDI_1965.t:0 "一方的独立宣言？"
    RHO_UDI_1965.d:0 "ローデシア政府は、その大半が国内人口の約5％にすぎない白人少数派で構成されていました。イギリス植民地政府が脱植民地化を掲げた「変化の風」政策を進めるなか、自治の経験で劣る北方のアフリカ植民地が1960年代初頭に次々と独立を果たす一方で、ローデシアは新たに台頭した「多数決原理による統治なくして独立なし」の原則のもとで主権を拒まれ、これに憤慨しました。ローデシアの一方的独立宣言（UDI）は1965年11月11日にローデシア内閣が採択した声明であり、1923年以来自治を行ってきた南部アフリカのイギリス領である南ローデシア、すなわち単にローデシアが、自らを独立した主権国家とみなすと表明するものでした。"
    RHO_1979_revolution.t:0 "ソールズベリー合意？"
    RHO_1979_revolution.d:0 "内部和解協定（ソールズベリー合意とも呼ばれます）は1978年3月3日に署名された協定です。この協定により暫定政府が発足し、アフリカ人が初めて指導的地位に就くとともに、独立した文官制度・司法・警察・軍が創設されました。また協定はイアン・スミスと3人の黒人指導者（ムゾレワ、シトーレ、チラウ）からなる執行評議会と、閣僚評議会を設け、スミスは首相の地位にとどまりました。"
    RHO_1980_revolution.t:0 "ローデシアにおける白人支配の終焉？"
    RHO_1980_revolution.d:0 "1979年12月11日、ローデシア下院は90対0でイギリス植民地への復帰を可決しました。1979年12月12日に新総督クリストファー・ソームズが着任し、イギリスはジンバブエ・ローデシアを南ローデシア植民地として正式に統治下に置きました。制裁はイギリスが12月12日に、国際連合が12月16日に解除しました。1980年2月の選挙ではムガベ率いるZANUが圧勝しました。1980年4月、イギリスの代表としてチャールズ皇太子がハラレでの式典に臨み、新国家ジンバブエの独立を正式に承認しました。"
    ZIM_1987_revolution.t:0 "大統領制共和国？"
    ZIM_1987_revolution.d:0 "1987年後半、ジンバブエ議会は憲法を改正しました。12月30日には、国家元首・政府首班・軍最高司令官の役割を兼ねる新設の地位である執行大統領にムガベを就けると宣言しました。この地位は彼に、議会を解散し、戒厳令を布告し、無制限に任期を重ねて立候補する権限を与えました。"
    ZIM_1996_revolution.t:0 "グレース・ムガベの台頭？"
    ZIM_1996_revolution.d:0 "グレース・ントンビゾドワ・ムガベはジンバブエの実業家にして政治家であり、故ロバート・ムガベ大統領の未亡人です。彼女は1996年から、2017年のジンバブエ・クーデターで夫が権力の座を追われた1週間後にあたる2017年11月の辞任まで、ジンバブエの大統領夫人を務めました。ムガベの秘書として出発した彼女は与党ZANU–PF内で昇り詰め、その女性同盟の長となり、ジェネレーション40派の中心人物となりました。同時に、国内が経済的混乱にあった時期に特権と浪費で知られる存在ともなりました。"
    ZIM_2017_revolution.t:0 "ジンバブエのクーデター？"
    ZIM_2017_revolution.d:0 "2017年11月、ジンバブエのロバート・ムガベ大統領は大統領およびZANU–PF党首の座から退けられ、エマーソン・ムナンガグワがこれに取って代わりました。この蜂起は、93歳のムガベ大統領の後継者をめぐり、ZDFの後ろ盾を得たエマーソン・ムナンガグワ前第一副大統領と、より若いG40派の後ろ盾を得たグレース・ムガベ大統領夫人との間で与党ZANU–PF内の緊張が高まるなかで起こりました。"
    
    SAF_1970_revolution.t:0 "南アフリカのバントゥースタン？"
    SAF_1970_revolution.d:0 "プレトリア政府は南アフリカ国内に10、そして隣接する南西アフリカ（当時は南アフリカの統治下）に10のバントゥースタンを設立しました。指定された民族集団の構成員をそこに集住させて各領域を民族的に均質なものとし、南アフリカの各黒人民族集団のための自治国家を創設する基盤とするためです。1970年のバントゥー・ホームランド市民権法により、政府は黒人南アフリカ人から南アフリカ市民権を剥奪して国内に残されたわずかな政治的・市民的権利を奪い、彼らをこれらのホームランドの市民であると宣言しました。"
    SAF_1970_revolution.f:0 "ゲームエンジンの制約により、このModではバントゥースタンを独立した国家として表現できません。"
    SAF_1984_revolution.t:0 "行政権を持つ大統領？"
    SAF_1984_revolution.d:0 "1983年憲法で最も物議を醸した条項のひとつが、三院制議会の設置でした。これはカラードとインド系の人種集団が人種別に分離された形で議会に代表を送ることを認める立法上の仕組みです。あわせて首相職を廃止し、現職首相P・W・ボータの下に行政権を持つ国家大統領職を置くことも定められました。"
    SAF_1989_revolution.t:0 "P・W・ボータの失脚？"
    SAF_1989_revolution.d:0 "1989年1月18日、ボータ（当時73歳）は軽度の脳卒中に見舞われ、1月20日に予定されていたナミビアの政治指導者との会談に出席できなくなりました。その代役はJ・クリスティアン・ヒューニス大統領代行が務めました。2月2日、ボータは自らが指名した財務相バレンド・デュプレシーが後を継ぐと見込んで国民党（NP）の党首を辞任しました。しかし国民党の議員団が党首に選んだのは教育相F・W・デクラークであり、彼は改革派として党内での地位を固めるべく素早く動きました。一方で強硬派はボータを支持しました。"
    SAF_1994_revolution.t:0 "アパルトヘイトの終焉？"
    SAF_1994_revolution.d:0 "デクラークはマンデラと交渉してアパルトヘイトを完全に解体し普通選挙への移行を取り決めました。1993年にはアパルトヘイトがもたらした害悪について公に謝罪しました。そして1994年の人種を問わない選挙を取り仕切り、この選挙ではマンデラ率いるアフリカ民族会議（ANC）が勝利を収めました。"
    
    SAF_1954_revolution.t:0 "J・G・ストレイドムの首相就任？"
    SAF_1954_revolution.d:0 "ヨハネス・ヘラルドゥス・ストレイドムは南アフリカの政治家で、1954年11月30日から1958年8月24日に死去するまで第5代南アフリカ首相を務めました。非妥協的なアフリカーナー民族主義者であり国民党（NP）最大の派閥であるバースカップ（白人至上主義）派に属し、その統治下では国民党のアパルトヘイト政策をいっそう先鋭化させるとともに、共和制を求めて南アフリカ連邦との決別を推し進めました。"
    SAF_1958_revolution.t:0 "ヘンドリック・フルウールトの首相就任？"
    SAF_1958_revolution.d:0 "ヘンドリック・フレンシュ・フルウールトはオランダ生まれの南アフリカの政治家であり、応用心理学・哲学・社会学の研究者にして新聞編集者でもあり、1958年から南アフリカ首相を務めました。一般にアパルトヘイトの設計者とみなされ「アパルトヘイトの父」と呼ばれています。フルウールトは原住民問題大臣（1950〜1958年）として、次いで首相（1958〜1966年）として、制度化された人種隔離と白人至上主義の体制であるアパルトヘイトを社会的に作り上げ、その政策を実行するうえで大きな役割を果たしました。"
    SAF_1966_revolution.t:0 "ヘンドリック・フルウールトの暗殺？"
    SAF_1966_revolution.d:0 "1966年9月6日、フルウールトは議会職員のディミトリ・ツァフェンダスに何度も刺されました。まもなく死亡し、ツァフェンダスは1999年に獄中で死去するまで収監されました。1966年のフルウールト暗殺を受けて国民党はフォルスターを後継者に選出し、彼はフルウールトのアパルトヘイト立法を引き継ぎました。その一環として1968年にはカラード（混血）有権者の白人代表に留保されていた最後の4議席が廃止されました（実施は1970年）。"
    SAF_1978_revolution.t:0 "ピーター・ウィレム・ボータの首相就任？"
    SAF_1978_revolution.d:0 "ピーテル・ウィレム・ボータDMSは南アフリカの政治家であり、1978年から1984年まで最後の南アフリカ首相を務め、1984年から1989年の辞任までは初代の執行権を持つ南アフリカ国家大統領を務めました。強硬な政治姿勢から「ディ・フロート・クロコディル」（アフリカーンス語で「大鰐」）の異名で呼ばれ、アパルトヘイト時代の南アフリカにおける最後の強硬派指導者と見なされています。"
    
    ARAB_2011_revolution.t:0 "アラブの春？"
    ARAB_2011_revolution.d:0 "アラブの春は2010年代初頭にアラブ世界の広範囲へ波及した一連の反政府抗議・蜂起・武装反乱です。汚職と経済停滞への反発からチュニジアで始まりました。チュニジアから抗議行動はリビア・エジプト・イエメン・シリア・バーレーンの5か国へ広がりました。多くのアラブの春のデモが当局・親政府民兵・対抗デモ隊・軍による暴力的な対応に直面したため、当初の革命と抗議の波は2012年半ばまでに衰えました。"
    
    TUR_1950_revolution.t:0 "ジェラル・バヤルの選出？"
    TUR_1950_revolution.d:0 "トルコ史上初の自由選挙となった1950年の総選挙で、民主党は53％の得票を得て勝利しました。バヤル自身は大統領就任を望んでいませんでしたが、議会は1950年5月22日に彼をトルコ大統領へ選出しました。バヤルの大統領在任中は西側陣営との関係が改善し、トルコ海峡危機を経てトルコは1951年[19]に朝鮮戦争へ参戦し、1952年2月にはNATOへ加盟しました。民主党による10年間の統治のあいだにトルコ社会は大きな変容を遂げました。私企業を奨励するインフレ的な経済政策が採られましたが、国家の役割が縮小されることはありませんでした。政治参加が拡大し、多数のアナトリア出身者が政界と実業界へ進出しました。世俗主義そのものが放棄されたわけではないものの、一党制時代の露骨な世俗主義政策は取りやめられました。"
    TUR_1960_revolution.t:0 "トルコのクーデター？"
    TUR_1960_revolution.d:0 "1960年のトルコクーデターはトルコ共和国で最初のクーデターでした。発生したのは1960年5月27日です。このクーデターは軍の指揮系統から外れて行動した38名の若手将校の一団によって実行されました。メンデレスをはじめとするトルコ政府要人の処刑から1か月後の1961年10月15日に総選挙が実施されました。行政権は文民の手に戻りましたが、軍は1965年10月まで政治の舞台を支配し続けました。"
    TUR_1966_revolution.t:0 "ジェヴデト・スナイの台頭？"
    TUR_1966_revolution.d:0 "ギュルセルの大統領職が健康の悪化により憲法の規定に従って終了すると、1966年3月28日にジェヴデト・スナイがトルコ大国民議会によって第5代大統領に選出されました。彼はテロ活動の増加や学生による暴動、クーデターの脅威にもかかわらずその職を守り抜きました。1973年3月28日まで憲法の定める7年の任期を務め上げ、その後は終身上院議員となりました。"
    TUR_1971_revolution.t:0 "トルコ軍事覚書？"
    TUR_1971_revolution.d:0 "1971年3月12日に突きつけられたトルコ軍事覚書は、1960年の先例から11年を経てトルコ共和国で起きた2度目の軍事介入でした。軍がかつてのように戦車を出動させる代わりにこれを手交したことから「覚書によるクーデター」として知られています。この出来事は国内対立が悪化するさなかに起きましたが、結局その流れを食い止めることはほとんどできませんでした。"
    TUR_1980_revolution.t:0 "トルコクーデター？"
    TUR_1980_revolution.d:0 "参謀総長ケナン・エヴレン将軍が主導した1980年のトルコクーデターは、1960年のクーデターと1971年の覚書によるクーデターに続くトルコ共和国史上3度目のクーデターでした。その後3年間トルコ軍は国家保安評議会を通じて国家を統治し、1983年のトルコ総選挙によって民主主義が回復されました。この時期には国家によるトルコ民族主義が強まりクルド語も禁止されました。トルコは1983年に部分的に、そして1989年に完全に民主主義へ復帰しました。"
    TUR_1983_revolution.t:0 "民主主義への復帰？"
    TUR_1983_revolution.d:0 "1983年11月6日、トルコで総選挙が実施されました。1980年の軍事クーデター後に民主的な権利が放棄されて以来、1977年以来初めての選挙です。国家保安評議会は従来の政党の参加を禁じ、その結果として新たな政党が次々と結成されました。トゥルグト・オザル率いる祖国党（ANAP）は45.14％の票を獲得し、この選挙で大勝を収めました。"
    TUR_2014_revolution.t:0 "レジェップ・タイイップ・エルドアンの台頭？"
    TUR_2014_revolution.d:0 "2014年、エルドアンは同国初の直接選挙による大統領となりました。その大統領職は民主主義の後退と、より権威主義的な統治への移行によって特徴づけられています。彼の経済政策は高いインフレ率とトルコリラの価値下落を招きました。シリアとリビアの紛争に介入し、イスラム国、シリア民主軍、アサド政権軍に対する軍事作戦を開始し、ギリシャに対しては威嚇を繰り返しています。"
    TUR_2017_revolution.t:0 "トルコ憲法改正国民投票？"
    TUR_2017_revolution.d:0 "2017年4月16日、トルコで憲法改正を問う国民投票が実施されました。与党の公正発展党（AKP）と民族主義者行動党（MHP）が提出した18項目の憲法改正案を承認するか否かを問うものです。承認の結果、首相職は廃止され、従来の議院内閣制は執行権を持つ大統領職と大統領制に置き換えられました。議会の議席数は550から600へ増やされ、他の一連の提案とあわせて大統領は裁判官検察官高等評議会（HSYK）の人事により大きな権限を持つこととなりました。"
    
    PER_1949_revolution.t:0 "制憲議会選挙？"
    PER_1949_revolution.d:0 "シャーは君主制の権力を強めるための諸計画の一環として憲法の改正を検討していました。シャーはより大きな権力を得るため憲法を修正する制憲議会の招集を求め、その議員を自らの支持者のなかから選びました。さらに1906年の憲法に規定されながら一度も設置されなかった議会上院、イラン元老院の設立に向けた圧力も強めました。元老院はシャーに有利に働くと見込まれていました。制憲議会は1949年4月21日から3週間にわたって開かれ、1949年5月8日に憲法の大幅な改正に署名しました。"
    PER_1952_revolution.t:0 "モハンマド・モサッデクの台頭？"
    PER_1952_revolution.d:0 "1952年7月、モハンマド・モサッデクは大規模な抗議のなかでイラン首相の座を取り戻し、シャーに非常大権の付与を認めさせました。この広範な権限によってモサッデクは議会を迂回して統制を固め、石油国有化の取り組みを強化しました。王権に対する文民統治の劇的な主張でした。"
    PER_1953_revolution.t:0 "イランのクーデター？"
    PER_1953_revolution.d:0 "1953年のイランのクーデターは、イランではモルダード28日クーデターとして知られ、1953年8月19日に米英が扇動しイラン軍が主導して、民主的に選出された首相モハンマド・モサッデクを打倒し、シャーであるモハンマド・レザー・パフラヴィーの君主制支配を強化したものです。"
    PER_1979_revolution.t:0 "イラン革命？"
    PER_1979_revolution.d:0 "イラン革命は1979年のパフラヴィー朝打倒に至った一連の出来事です。この革命によってイラン帝国は現在のイラン・イスラム共和国へと置き換えられ、モハンマド・レザー・パフラヴィーの君主制政府は、反体制派の一派を率いた宗教指導者アーヤトッラー・ルーホッラー・ホメイニーの神権政治に取って代わられました。"
    PER_1989_revolution.t:0 "アリー・ハーメネイーの台頭？"
    PER_1989_revolution.d:0 "ハーメネイーは1981年から1989年までイランの第3代大統領を務め、初代最高指導者ルーホッラー・ホメイニーの盟友となりました。ホメイニーは死の直前に自ら後継者に選んでいたホセイン・アリー・モンタゼリーと対立したため、その死去時には合意された後継者がいませんでした。専門家会議は1989年6月4日、50歳のハーメネイーを次の最高指導者に選出しました。アクバル・ハーシェミー・ラフサンジャーニーによれば、ハーメネイーこそホメイニーが死の前に後継者として選んだ人物でした。"
    PER_1998_revolution.t:0 "クッズ部隊を創設する？"
    PER_1998_revolution.d:0 "クッズ部隊はイラン・イスラム革命防衛隊（IRGC）を構成する5つの部門のひとつで、非正規戦と軍事諜報活動を専門としています。国外での作戦を担うクッズ部隊はヒズボラ、ハマース、パレスチナ・イスラム聖戦、フーシ派、さらにイラク・シリア・アフガニスタンのシーア派民兵など、多くの国の非国家主体を支援しています。"
    PER_2008_revolution.t:0 "モジュタバー・ハーメネイーの台頭？"
    PER_2008_revolution.d:0 "モジュタバー・ホセイニー・ハーメネイーは2026年3月にイランの第3代最高指導者に指名されたシーア派の聖職者です。ハーメネイー家の一員であり、前最高指導者アリー・ハーメネイーの次男にあたります。1987年にイスラム革命防衛隊（IRGC）へ入隊しイラン・イラク戦争に従軍しました。1999年にはゴムで聖職者となるべく学業を続け、その後ゴム神学校に神学教師として加わりました。2009年には準軍事的な志願民兵組織バシージを掌握しました。"
    PER_2026_revolution.t:0 "アリー・ハーメネイーの暗殺"
    PER_2026_revolution.d:0 "2025年から2026年にかけてイスラエルおよびアメリカとの緊張が高まり、まず12日間戦争として噴出したのち、全面的な紛争へと拡大しました。その渦中で最高指導者アリー・ハーメネイーが暗殺されました。3月8日、専門家会議は体制の継続を保つべく速やかに動き、息子のモジュタバーを後継者に選出しました。"
    
    ARG_1955_revolution.t:0 "解放革命？"
    ARG_1955_revolution.d:0 "解放革命は、1955年9月16日にアルゼンチンでフアン・ペロンの2期目の大統領任期を終わらせたクーデターです。解放革命の後、ペロンとその支持者は反逆罪で告発され、エバ・ペロンの遺体は秘密裏にイタリアへ運ばれて偽名のままミラノの墓地に埋葬されました。歌や文章、写真を含め、ペロンと亡き妻に公然と言及することは禁じられました。"
    ARG_1966_revolution.t:0 "アルゼンチン革命？"
    ARG_1966_revolution.d:0 "アルゼンチン革命とは、1966年6月にアルゼンチン政府を打倒し、以後1973年まで軍事評議会による軍事独裁の時代を開いた軍事クーデターに対し、その指導者たちが与えた名称です。1966年6月のクーデターは、書記長アウグスト・バンドルをはじめとする労働総同盟（CGT）の複数の指導者に支持され、フアン・カルロス・オンガニーア将軍を事実上の大統領の座に就けました。オンガニーアはコーポラティズム政策を実施し、とりわけカルロス・カバジェロが統治するコルドバで実験的な試みを進めました。"
    ARG_1973_revolution.t:0 "民主主義への復帰？"
    ARG_1973_revolution.d:0 "数年にわたる軍政の後、1971年にアレハンドロ・アグスティン・ラヌセが軍事評議会によって大統領に任命されました。民主主義の回復を求める政治的圧力が高まるなか、ラヌセは1973年の選挙実施を表明しました。ペロン本人の立候補は禁じられましたが、ペロン党の参加は認められました。政治・社会・経済の混乱のさなか、カンポラとビセンテ・ソラーノ・リマ副大統領は1973年7月に辞任し、今度はペロンを正義党の候補とする新たな選挙を求めました。ペロンは妻のイサベル・ペロンを副大統領候補として選挙に勝利しました。"
    ARG_1976_revolution.t:0 "アルゼンチンのクーデター？"
    ARG_1976_revolution.d:0 "1976年3月24日にイサベル・ペロンをアルゼンチン大統領の座から追放した1976年のアルゼンチンクーデターは、秩序と治安の重視といった右翼的な要素を持つ一方で、伝統的な右翼クーデターではなく特定のイデオロギーに従うものでもありませんでした。このクーデターはコンドル作戦の枠組みの中で計画・実行されました。これは国家安全保障ドクトリンの一環として合衆国が推進したラテンアメリカ諸国間の秘密の弾圧協力体制であり、冷戦期にこれらの国々への支配を維持するためラテンアメリカ全域に独裁政権を広げるものでした。"
    ARG_1983_revolution.t:0 "民主主義への復帰？"
    ARG_1983_revolution.d:0 "1983年のアルゼンチン総選挙は10月30日に実施され、1976年に成立した自称「国家再編成プロセス」の独裁に終止符を打つ立憲統治の復活を告げるものとなりました。"
    ARG_2023_revolution.t:0 "ハビエル・ミレイ大統領の誕生？"
    ARG_2023_revolution.d:0 "ハビエル・ヘラルド・ミレイはアルゼンチンの政治家・経済学者であり、2023年にアルゼンチン大統領に就任しました。ミレイは派手な人柄と独特の風貌、そして強い発信力で知られています。政治的には右派ポピュリストかつ右派リバタリアンと評され、自由放任経済を支持して、とりわけ最小国家主義とアナルコ・キャピタリズムの原則に近い立場を取っています。"
    
    GUY_1964_revolution.t:0 "フォーブス・バーナムの台頭？"
    GUY_1964_revolution.d:0 "法律家として教育を受けたバーナムは、のちにガイアナ政治を支配することになる2つの政党（人民国民会議と人民進歩党）の創設に大きな役割を果たしました。彼が政府首班であった時期にガイアナは英国の植民地から、英国との憲法上のつながりを持たない共和国へと移行しました。その首相在任期は外国資本の民間産業の国有化、非同盟運動への加盟、権威主義的な内政によって特徴づけられます。ガイアナの政治的・社会的・経済的発展に大きな役割を果たしたと広く評価される一方で、その大統領在任期はアフロセントリズム、国家公認の暴力、汚職、選挙不正の非難によって傷つけられました。"
    GUY_1980_revolution.t:0 "ガイアナ協同共和国？"
    GUY_1980_revolution.d:0 "1980年に憲法が改正され、大統領職は執行権を持つ地位となりました。それまでこの職はアーサー・チャンが儀礼的な国家元首として務めていました。バーナムは同年の選挙で大統領に当選し、公式の結果では得票率76％を得てジェーガンの20％を退けました。国際監視団は複数の投票所でインド系ガイアナ人の有権者が投票を妨げられたと抗議し、選挙不正の非難が広がりました。執行大統領には議会を任意に解散する権限、法案への拒否権、政府高官のほぼすべてを任免する権限が与えられました。"
    GUY_1985_revolution.t:0 "フォーブス・バーナムの死"
    GUY_1985_revolution.d:0 "バーナムは1985年8月6日、ジョージタウンでの喉の手術中に心不全により62歳で死去しました。複数の資料によれば、フォーブスは死の数年前から心臓に問題を抱え、糖尿病を患っていた可能性もあります。バーナムの死後、デズモンド・ホイトが大統領に就任しました。1985年のガイアナ総選挙もまた不正なものと見なされ、次の「自由かつ公正な」選挙は1964年以来初となる1992年まで訪れず、そこでチェディ・ジェーガンが大統領に選出されました。"
    GUY_1992_revolution.t:0 "チェディ・ジェーガンの勝利？"
    GUY_1992_revolution.d:0 "1985年にバーナムが死去するとデズモンド・ホイトが政権を握りました。ジミー・カーターの影響を受けたホイトは選挙制度の改革を打ち出し、1992年の選挙は国際的に自由かつ公正なものと認められました。28年間の野党生活の末にPPPは1992年10月5日の選挙で約54％の票を得て勝利しジャガンが大統領に就任しました。諸外国がかつて抱いた懸念とは裏腹に、彼はマルクス・レーニン主義者ではなく民主社会主義者として統治しました。ジャガンは外国投資を呼び込む政策を推し進め自由市場路線へと歩みを進めていきます。"
    
    SUR_1975_revolution.t:0 "ヘンク・アーロンの首相就任？"
    SUR_1975_revolution.d:0 "ヘンク・アルフォンスス・ウジェーヌ・アーロンはスリナムの政治家であり、1975年の独立後に初代首相を務めた人物です。スリナム国民党に所属し1973年12月24日の移行政府から1980年2月25日まで首相の座にありました。彼はデシ・ボーターセ率いる軍のクーデターによって失脚しました。"
    SUR_1980_revolution.t:0 "軍曹たちのクーデター？"
    SUR_1980_revolution.d:0 "1980年のスリナムのクーデターは通称「軍曹たちのクーデター」（オランダ語：De Sergeantencoup）と呼ばれ、1980年2月25日にデシ・ボーターセ率いるスリナム軍（SKM）の軍曹16名が首相ヘンク・アーロンの政権を暴力によって打倒した軍事クーデターです。これは1980年から1991年まで同国を支配した軍事独裁の始まりとなりました。"
    SUR_1987_revolution.t:0 "スリナムの雪解け？"
    SUR_1987_revolution.d:0 "1985年の後半に政府は野党の活動禁止を解除し文民統治への移行が始まりました。1987年9月30日の国民投票では新憲法が圧倒的な賛成多数で承認されました。その2か月後に選挙が行われボーターセに反対するラムセワク・シャンカルが1988年1月に大統領へ選出されました。しかしボーターセは軍司令官として大きな権力を握り続けました。彼はジャングル・コマンドとの交渉に向けた政府の試みをことごとく潰し、ボーターセに敵対する者の多くが殺害されるか行方不明となりました。"
    SUR_1991_revolution.t:0 "スリナムの民主化への移行？"
    SUR_1991_revolution.d:0 "1987年に国政選挙が実施されました。国民議会はボーテルセが軍の指揮権を保持し続けることを認める新憲法を採択しました。政府に不満を抱いたボーテルセは1990年に電話一本で閣僚を一方的に解任しました。この出来事は「電話クーデター」として広く知られるようになりました。彼の権力は1991年の選挙を境に衰え始めました。"
    
    BRZ_1954_revolution.t:0 "ジェトゥリオ・ヴァルガスの自殺？"
    BRZ_1954_revolution.d:0 "ヴァルガスの政敵たちが引き起こした危機は空軍将校ルーベンス・ヴァス少佐の殺害という結末を迎えました。彼はヴァルガス最大の政敵であった出版経営者で政治家のカルロス・ラセルダの自宅があるトネレーロ街180番地の路上で起きた暗殺未遂の際に命を落としました。「黒い天使」の異名を持つヴァルガスの親衛隊長グレゴリオ・フォルトゥナート中尉がこの犯行に関与していました。これにより軍内部でヴァルガスへの怒りが高まり将軍たちは辞任を要求しました。事態を収拾できなくなったヴァルガスは1954年8月24日に公邸カテテ宮殿3階の寝室でリボルバーによって自らの胸を撃ちました。"
    BRZ_1964_revolution.t:0 "ブラジル第五共和政？"
    BRZ_1964_revolution.d:0 "ブラジル第五共和政とも呼ばれるブラジルの軍事独裁政権は、アメリカ政府の支援を受けたブラジル軍がジョアン・グラール大統領に対して起こしたクーデターを経て1964年4月1日に成立しました。このクーデターはブラジル陸軍の最高幹部たちによって計画・実行され、軍高官のほぼ全員に加えてカトリック教会やブラジルの中産・上流階級における反共産主義の市民運動といった社会の保守層からも支持を受けました。"
    BRZ_1985_revolution.t:0 "民主主義の回復？"
    BRZ_1985_revolution.d:0 "左翼ゲリラを打ち破った後も弾圧を緩めることのなかった長年の独裁支配は、体制そのものを疲弊させていきました。当時の経済危機に対処できなかったことと民衆の圧力により開放政策は避けられないものとなり、体制側ではエルネスト・ガイゼル将軍とゴルベリ・ド・コウト・エ・シルヴァ将軍がこれを主導しました。1979年の恩赦法の制定を機に、ブラジルは緩やかな民主主義への回帰を始め、それは1980年代のうちに完了しました。"
    BRZ_1993_revolution.t:0 "ブラジル憲法国民投票"
    BRZ_1993_revolution.d:0 "1993年4月21日、国の政体を決めるための憲法国民投票がブラジルで実施されました。再民主化の後、新憲法の条項によって、共和制を維持するか再び君主制に戻すか、また統治体制を大統領制とするか議院内閣制とするかを有権者が決める国民投票の実施が定められていたのです。"
    BRZ_2016_revolution.t:0 "ジルマ・ルセフの弾劾？"
    BRZ_2016_revolution.d:0 "2016年8月31日、上院は61対20の票決でルセフ大統領を罷免し、ブラジルの予算関連法に違反したとして有罪を認定しました。しかし公民権を剥奪するのに必要な票は集まりませんでした。こうしてテメルがブラジル第37代大統領として宣誓就任しました。"
    BRZ_2023_revolution.t:0 "ブラジル議会襲撃事件"
    BRZ_2023_revolution.d:0 "2023年1月8日、2022年ブラジル総選挙で当時の大統領ジャイル・ボルソナロが敗北し、後任のルイス・イナシオ・ルラ・ダ・シルヴァが就任したことを受けて、ボルソナロ支持者の群衆が首都ブラジリアの連邦政府施設を襲撃しました。群衆は三権広場にある連邦最高裁判所、国民議会議事堂、大統領府プラナルト宮殿に侵入して意図的な破壊行為を働き、1月1日に就任したばかりの民主的に選ばれた大統領ルラを暴力によって打倒しようとしました。"
    
    BRZ_1993_revolution.option.1:0 "大統領制共和国を樹立する"
    BRZ_1993_revolution.option.2:0 "議会制共和国を樹立する"
    BRZ_1993_revolution.option.3:0 "立憲君主制を樹立する"
    
    BOL_1952_revolution.t:0 "ボリビア国民革命？"
    BOL_1952_revolution.d:0 "ボリビア国民革命は1952年4月、革命的民族主義運動（MNR）の主導で始まりました。この蜂起は軍事政権を打倒しビクトル・パス・エステンソロを権力の座に就けました。革命は普通選挙の導入、錫鉱山の国有化、農地改革といった広範な改革をもたらしました。"
    BOL_1964_revolution.t:0 "ボリビアのクーデター？"
    BOL_1964_revolution.d:0 "1964年11月4日、副大統領ルネ・バリエントスは軍部の支持を得てビクトル・パス・エステンソロ大統領を打倒しました。このクーデターはMNRによる革命政権の終焉を告げボリビア政治における軍部支配の時代を開きました。"
    BOL_1969_revolution.t:0 "ルネ・バリエントスの死？"
    BOL_1969_revolution.d:0 "1969年4月27日、バリエントスはボリビアのアルケ付近でヘリコプターの墜落により死亡しました。まもなく憲法の規定に従い、無名のキリスト教民主派政治家ルイス・アドルフォ・シレス副大統領が大統領に就任しました。オバンドは選挙を待たないことを決め（人気のあるエスコバルが候補となる以上勝利を保証できる者はいませんでした）1969年9月26日にクーデターを起こしシレスを打倒したのです。"
    BOL_1970_revolution.t:0 "ボリビアのクーデター？"
    BOL_1970_revolution.d:0 "1970年10月、保守派将校によるクーデター未遂の後にフアン・ホセ・トーレス将軍が権力を掌握しました。トーレスは左派寄りの軍事政権を樹立し労働者と農民の政治参加を推進しましたが、その統治は右派の強い抵抗に直面しました。"
    BOL_1971_revolution.t:0 "ボリビアのクーデター？"
    BOL_1971_revolution.d:0 "1971年8月21日、ウゴ・バンセル大佐はフアン・ホセ・トーレス将軍に対するクーデターを成功させました。バンセルは1978年まで続く軍事独裁を樹立し、左翼運動の弾圧と保守勢力との連携をその特徴としました。"
    BOL_1978_revolution.t:0 "1978年のウゴ・バンセル失脚？"
    BOL_1978_revolution.d:0 "1978年までに政情不安と経済的困難が高まりウゴ・バンセル政権は弱体化しました。抗議行動と選挙をめぐる混乱の中でバンセルは退陣を余儀なくされ、7年に及ぶ独裁は幕を閉じ短命政権が相次ぐ激動の時代が始まりました。" 
    BOL_1985_revolution.t:0 "ビクトル・パス・エステンソロの大統領就任？"
    BOL_1985_revolution.d:0 "1985年7月14日、ボリビアで総選挙が実施されました。大統領候補のいずれも得票率50％を超えなかったため、8月4日に国民会議が大統領を選出することとなりました。民族民主行動（ADN）のウゴ・バンセルが最多得票を集めたものの、国民会議は民族革命運動（MNR）のビクトル・パス・エステンソロを大統領に選出しました。"
    
    CLM_1953_revolution.t:0 "コロンビアのクーデター？"
    CLM_1953_revolution.d:0 "ロハス・ピニージャは、1940年代後半から1950年代初頭にかけて与党保守党と自由党ゲリラが争ったコロンビアの内乱期「ラ・ビオレンシア」において大佐として頭角を現し、保守党のマリアノ・オスピナ・ペレス大統領の内閣に登用されました。1953年にはオスピナの後任である極右のラウレアノ・ゴメス・カストロ大統領に対するクーデターを成功させ、戒厳令を敷きました。政治的暴力の抑制を目指した彼は軍事独裁として国を統治し、労働組合指導者と手を結び、インフラ整備計画を進め、女性参政権を拡大しました。"
    CLM_1958_revolution.t:0 "民主主義の回復？"
    CLM_1958_revolution.d:0 "ロハスの失脚後、コロンビア保守党とコロンビア自由党は、両党が共同で国を統治する連合「国民戦線」の結成に合意しました。この取り決めにより大統領職は16年間にわたり4年ごとに保守派と自由派の間で交代し、その他のすべての公選職も両党で均等に分け合うこととされました。国民戦線は「ラ・ビオレンシア」を終わらせ、その歴代政権は進歩のための同盟と協力して広範な社会・経済改革の実現を試みました。"
    
    CHL_1973_revolution.t:0 "チリのクーデター？"
    CHL_1973_revolution.d:0 "1973年のチリ・クーデターは、チリ大統領を務めた民主社会主義者サルバドール・アジェンデが率いる人民連合政権を軍が打倒した事件です。ラテンアメリカの自由民主主義国で民主的に選出された初のマルクス主義者の大統領と評されるアジェンデは、深刻な社会不安と、野党が支配するチリ国民議会との政治的緊張、そしてアメリカ合衆国大統領リチャード・ニクソンが命じた経済戦争に直面していました。1973年9月11日、アウグスト・ピノチェト将軍率いる軍人の一団がクーデターで権力を掌握し、文民統治は終わりを迎えました。"
    CHL_1990_revolution.t:0 "民主主義への復帰？"
    CHL_1990_revolution.d:0 "1980年代後半、1982年の経済破綻や1983年から88年にかけての大規模な市民的抵抗を主な要因として、政府は集会・言論・結社の自由を段階的に認め、労働組合活動や政治活動も容認するようになりました。1988年10月5日の国民投票でピノチェトは2期目となる8年の大統領任期を否認されました（反対56％・賛成44％）。チリ国民は1989年12月14日に新大統領と二院制議会の議員の大半を選出しました。アイルウィン大統領は1990年から1994年まで在任し、この期間は移行期とみなされています。"
    
    ECU_1972_revolution.t:0 "エクアドルのクーデター？"
    ECU_1972_revolution.d:0 "1972年、「革命的かつ民族主義的」を掲げる軍事評議会がベラスコ・イバラ政権を打倒しました。このクーデターはギジェルモ・ロドリゲス将軍が主導し、海軍司令官ホルヘ・ケイロロが実行しました。新大統領はホセ・マリア・ベラスコをアルゼンチンへ追放しました。彼は1976年に別の軍事政権によって排除されるまで権力の座にとどまりました。"
    ECU_1979_revolution.t:0 "民主主義の復活？"
    ECU_1979_revolution.d:0 "エクアドルでは1978年と1979年に総選挙が実施されました。大統領選挙の第1回投票は1978年7月16日に行われ、決選投票は1979年4月29日に議会選挙と同時に実施されました。大統領選挙を制したのは人民勢力集中（CPF）のハイメ・ロルドス・アギレラで、決選投票で68.5％を得票し、同国初の自由な選挙で選ばれた大統領となりました。"
    
    PRG_1954_revolution.t:0 "パラグアイのクーデター？"
    PRG_1954_revolution.d:0 "1954年のパラグアイ・クーデターは1954年5月に発生しました。アルフレド・ストロエスネルが主導しエピファニオ・メンデス・フレイタスの支持を受けて、フェデリコ・チャベス政権を打倒しました。このクーデターは与党コロラド党内の複雑な政治的対立の帰結でした。この政変では約25人が死亡し、同年後半のストロエスネルのパラグアイ大統領選出への道を開きました。"
    PRG_1989_revolution.t:0 "民主主義の復活？"
    PRG_1989_revolution.d:0 "1989年のパラグアイ・クーデターは1989年2月2日から3日にかけてパラグアイのアスンシオンで発生し、アンドレス・ロドリゲス将軍が長年の指導者アルフレド・ストロエスネルの体制に対して主導しました。市街戦で多数の兵士が死亡したこの流血の政変は、政府最高層の権力闘争によって引き起こされました。ロドリゲスの権力掌握は当時ラテンアメリカ最長であったストロエスネルの34年に及ぶ統治「エル・ストロナート」に終止符を打ち、数々の過酷な法律を廃止する一連の改革とパラグアイの自由化をもたらしました。"
    
    VNZ_1948_revolution.t:0 "ベネズエラのクーデター？"
    VNZ_1948_revolution.d:0 "1948年のベネズエラ・クーデターは1948年11月24日に発生しました。カルロス・デルガド・チャルボー、マルコス・ペレス・ヒメネス、ルイス・フェリペ・リョベラ・パエスが、選出された大統領ロムロ・ガリェゴスを打倒しました。ガリェゴスは1947年のベネズエラ総選挙（一般に同国初の公正な選挙とされます）で選出され1948年2月に就任していました。"
    VNZ_1950_revolution.t:0 "カルロス・デルガド・チャルボーの暗殺？"
    VNZ_1950_revolution.d:0 "チャルボーは1950年11月13日、ラファエル・シモン・ウルビナとその甥ドミンゴ・ウルビナが率いる一団に誘拐され殺害されました。誘拐はカラカスのカントリー・クラブ地区とチャペジン地区の間で行われ、殺害は半ば打ち捨てられたラス・メルセデス地区で起きました。この殺害はチャルボー政権の打倒を狙ったシモン・ウルビナによる誘拐計画の失敗が招いた、意図せぬ結末であったとみられます。"
    VNZ_1958_revolution.t:0 "ベネズエラの民主主義への復帰？"
    VNZ_1958_revolution.d:0 "1958年のベネズエラクーデターは1958年1月23日に発生し独裁者マルコス・ペレス・ヒメネスが打倒されました。まずウォルフガング・ララサバル提督、次いでエドガー・サナブリアの下で暫定政府が置かれ、1958年12月の選挙で民主行動党の候補ロムロ・ベタンクールが当選し1959年2月13日に就任しました。"
    VNZ_1999_revolution.t:0 "ボリバル革命？"
    VNZ_1999_revolution.d:0 "既存政党への信頼が崩壊した結果1998年にウゴ・チャベスが大統領に選出され、続いて『ボリバル革命』が始まりました。その第一歩が新たなベネズエラ憲法を起草するための1999年の制憲議会でした。『ボリバル革命』は大衆運動を築き上げ、ボリバル主義——人民民主主義、経済的独立、収益の公平な分配、そして政治腐敗の終焉——をベネズエラで実現しようとしました。"
    VNZ_2013_revolution.t:0 "ニコラス・マドゥロの大統領就任？"
    VNZ_2013_revolution.d:0 "バス運転手として働き始めたマドゥロは労働組合の指導者へと上り詰め、2000年に国民議会議員に選出されました。ウゴ・チャベス大統領の下で数々の役職に任命され、2005年から2006年まで国民議会議長、2006年から2012年まで外務大臣、2012年から2013年までチャベスの下で副大統領を務めました。2013年3月5日にチャベスの死去が発表されるとマドゥロが大統領職を引き継ぎました。"
    
    GUA_1954_revolution.t:0 "カルロス・カスティージョ・アルマスのクーデター？"
    GUA_1954_revolution.d:0 "1954年のグアテマラクーデターは民主的に選出されたグアテマラ大統領ハコボ・アルベンスを失脚させ、グアテマラ革命の終焉を告げました。このクーデターによりカルロス・カスティージョ・アルマスの軍事独裁政権が成立し、以後グアテマラで続く米国の後ろ盾を得た権威主義的支配者の第一号となりました。このクーデターは大部分がPBSuccessという暗号名のCIA秘密作戦によるものでした。"
    GUA_1957_revolution.t:0 "カルロス・カスティージョ・アルマスの暗殺？"
    GUA_1957_revolution.d:0 "カスティージョ・アルマスは1957年7月26日まで統治しましたが、親衛隊員のロメオ・バスケスに暗殺されました。その後の不正選挙を経てミゲル・イディゴラス・フエンテス将軍が権力を握りました。彼はメキシコ漁船によるグアテマラ太平洋岸での違法操業をめぐる確執に決着をつけるため、南部国境の橋の上でメキシコ大統領に紳士の決闘を挑んだことで知られています。その漁船のうち2隻はグアテマラ空軍に撃沈されました。"
    GUA_1982_revolution.t:0 "エフライン・リオス・モントのクーデター？"
    GUA_1982_revolution.d:0 "1982年、ロメオ・ルーカス・ガルシア将軍の統治への不満とグアテマラの治安悪化、そして選挙不正の告発により、若手将校の一団がクーデターを起こしリオス・モントを軍事評議会の長に据えました。リオス・モントは軍事独裁者として17か月に満たない期間統治した後、国防相のオスカル・メヒア・ビクトレス将軍による新たなクーデターで打倒されました。"
    GUA_1986_revolution.t:0 "民主主義の復活？"
    GUA_1986_revolution.d:0 "1985年11月3日の大統領選挙第1回投票でセレソは得票率38.6％で首位に立ちました。12月8日の決選投票では68.4％を獲得しホルヘ・カルピオを破りました。DCGは議会の100議席のうち51議席を得て全国の多くの自治体でも過半数を占めました。彼は1966年以来初めて民主的に選出されて就任した大統領であり文民でもありました。"
    
    HON_1957_revolution.t:0 "ラモン・ビジェダ・モラレスの選出？"
    HON_1957_revolution.d:0 "ラモン・ビジェダ・モラレスは長期にわたる軍政の後のホンジュラス民主化を支持した自由主義者でした。彼は20年以上ぶりの自由選挙となった1954年の大統領選挙に自由党候補として出馬し分裂した国民党を上回る相対多数を得ましたが過半数には届きませんでした。"
    HON_1963_revolution.t:0 "オスワルド・ロペスのクーデター？"
    HON_1963_revolution.d:0 "1963年のホンジュラスクーデターは選挙予定日の10日前にあたる1963年10月3日に軍がホンジュラス政府を転覆させた事件です。オスワルド・ロペス・アレジャーノがラモン・ビジェダ・モラレスに代わって大統領となり20年に及ぶ軍政が始まりました。"
    HON_1975_revolution.t:0 "オスワルド・ロペスの失脚？"
    HON_1975_revolution.d:0 "1975年のホンジュラスのクーデターは1975年4月22日に起こり、オスワルド・ロペス・アレジャーノは同僚の将軍フアン・アルベルト・メルガル・カストロが率いる軍事クーデターによって追放されました。このクーデターの一因となったのは1975年に米国証券取引委員会が明るみに出した「バナナゲート」事件で、ユナイテッド・ブランズ社がバナナ輸出税の一部引き下げと引き換えにロペス大統領へUS$1.25 million, and the promise of another $125万の賄賂を贈ることに同意していました。"
    HON_1982_revolution.t:0 "民主主義の復活？"
    HON_1982_revolution.d:0 "1979年、この国は文民統治に復帰しました。新憲法を起草するため1980年4月に制憲議会が民選で選ばれ、1981年11月には総選挙が行われました。憲法は1982年に承認され、ロベルト・スアソ率いるPLH政権が、ホンジュラスが陥っていた景気後退に対処する野心的な経済・社会開発計画を実行するという公約を掲げて選挙に勝利しました。"
    
    PNM_1968_revolution.t:0 "オマル・トリホスのクーデター？"
    PNM_1968_revolution.d:0 "オマル・エフライン・トリホス・エレーラはパナマの独裁者であり、1968年から1981年に死去するまでパナマ国家警備隊の司令官およびパナマの軍事指導者を務めました。トリホスが正式にパナマ大統領となることはなく、代わりに「パナマ革命最高指導者」などの称号を名乗りました。トリホスはクーデターによって権力を握り、数々の社会改革を実施しました。"
    PNM_1981_revolution.t:0 "オマル・トリホスの死？"
    PNM_1981_revolution.d:0 "トリホスは1981年7月31日、搭乗していたパナマ空軍のデ・ハビランド・カナダDHC-6ツインオッターがパナマのペノノメ近郊コクレシートにあるセロ・マルタへ墜落し、52歳で死去しました。機体は好天の中でレーダーから消えましたが、当時のパナマのレーダー覆域は限られていたため、行方不明が報告されたのは1日近く経ってからでした。墜落現場は数日後に発見され、トリホスの遺体は8月最初の数日のうちに特殊部隊の一隊によって収容されました。"
    PNM_1983_revolution.t:0 "マヌエル・ノリエガの台頭？"
    PNM_1983_revolution.d:0 "マヌエル・アントニオ・ノリエガ・モレノはパナマの独裁者であり軍人で、1983年から1989年までパナマの事実上の統治者でした。正式に大統領を務めたことは一度もなく、傀儡の大統領を立てて選挙を経ない軍事独裁者として君臨しました。パナマ軍による麻薬密売で莫大な私財を築いたノリエガは、アメリカによるパナマ侵攻で失脚するまで、長年にわたりアメリカの情報機関と関係を保っていました。"
    PNM_1989_revolution.t:0 "パナマにおける民主主義の回復？"
    PNM_1989_revolution.d:0 "アメリカは1989年12月20日、「ジャスト・コーズ作戦」の名の下にパナマへ侵攻しました。ノリエガは拘束され裁判のためマイアミへ移送されました。戦闘は1990年1月31日に終結しました。パナマの選挙裁判所は文民による立憲政府の復活へ迅速に動き、1989年12月27日に同年5月の選挙結果を有効と認め、ギジェルモ・エンダラ大統領とギジェルモ・フォード、リカルド・アリアス・カルデロン両副大統領の勝利を確定しました。"
    
    MEX_2000_revolution.t:0 "PRI支配の終焉？"
    MEX_2000_revolution.d:0 "大統領選挙は変革のための同盟のビセンテ・フォックスが43.4％を得票して制し、メキシコ革命以来初めて野党が選挙に勝利しました。議会選挙では変革のための同盟が下院500議席のうち224議席を得て第一勢力となり、制度的革命党は上院128議席のうち60議席を保って引き続き上院の第一勢力となりました。"
    
    PEU_1963_revolution.t:0 "フェルナンド・ベラウンデの当選？"
    PEU_1963_revolution.d:0 "ベラウンデは1962年の総選挙に、今度は自らの政党アクシオン・ポプラール（人民行動党）を率いて立候補しました。結果はきわめて僅差となり、ビクトル・ラウル・アヤ・デ・ラ・トーレ（APRA）に1万4000票足らずの差で及ばず2位に終わりました。いずれの候補も当選に必要な憲法所定の3分の1の得票に届かなかったため、大統領の選出は議会に委ねられることとなりました。軍とAPRAの長年にわたる敵対関係を背景に、アヤ・デ・ラ・トーレは3位につけた元独裁者オドリアと取引を結び、連立政権のもとでオドリアが大統領職に就く運びとなりました。しかし不正の疑惑が広く取り沙汰されたことでペルー軍はプラドを追放し、リカルド・ペレス・ゴドイを首班とする軍事評議会を樹立しました。ペレス・ゴドイは短期の暫定政権を率いて1963年に改めて選挙を実施し、ベラウンデがより余裕のある、それでもなお僅差の5％の差で勝利を収めました。"
    PEU_1968_revolution.t:0 "ペルーのクーデター？"
    PEU_1968_revolution.d:0 "1968年のペルーのクーデターは、フェルナンド・ベラウンデの第1次政権期（1963年～1968年）に起こりました。政争が常態化し、APRA・UNO（オドリア派国民同盟）連合が支配する議会とベラウンデ大統領との深刻な対立が高まったうえ、大統領と自らの与党アクシオン・ポプラール（人民行動党）との衝突すら珍しくありませんでした。クーデター後の午前7時、ベラウンデは兵営へ連行され、そのままペルーのカヤオにあるホルヘ・チャベス国際空港へ強制的に移送されました。権力を掌握したベラスコは、直ちにベラウンデの国外追放を命じました。"
    PEU_1975_revolution.t:0 "ペルーのクーデター？"
    PEU_1975_revolution.d:0 "インフレ、失業、食糧不足といった経済的困難と、1974年の報道弾圧後に高まった政治的反発は、最終的にベラスコ政権への圧力を増大させ、その崩壊を招きました。1975年8月29日、複数の有力な軍司令官がクーデターを起こしました。その後フランシスコ・モラレス・ベルムーデス首相が、新たな軍事評議会の全会一致の決定により大統領に任命されました。"
    PEU_1980_revolution.t:0 "民主主義への回帰？"
    PEU_1980_revolution.d:0 "モラレス・ベルムーデスの任期終盤には住宅危機が発生し、「失われた10年」が幕を開けました。四方から政治的圧力を受けたモラレス・ベルムーデスは、政治・経済改革を成功させることができませんでした。1978年にはモラレス・ベルムーデス政権の招集による制憲議会が設置され、オスカル・R・ベナビデス大統領期に制定された1933年憲法に取って代わりました。1980年に選挙が実施された後、彼は12年間の軍政を経て初めて民主的に選出された政府、すなわちフェルナンド・ベラウンデ大統領率いる政府へ権力を返上しました。"
    PEU_1990_revolution.t:0 "アルベルト・フジモリの大統領就任？"
    PEU_1990_revolution.d:0 "フジモリは1990年の大統領選挙に「カンビオ90」を掲げるダークホース候補として出馬し、バルガス・リョサを破る驚くべき番狂わせで勝利しました。彼は退任するアラン・ガルシア大統領とアメリカ人民革命同盟（APRA）への根深い幻滅を巧みに利用したのです。憲法を改正した彼はモンテシノスとペルー軍の下で傀儡の大統領を務め、伝えられるところでは「プラン・ベルデ」を採用しました。これは貧困層と先住民のペルー人の虐殺、国内メディアの統制・検閲、そして軍事評議会が支配する新自由主義経済の確立を含む計画でした。"
    PEU_2000_revolution.t:0 "アルベルト・フジモリの失脚？"
    PEU_2000_revolution.d:0 "ウラジミロ・モンテシノスが関与する汚職スキャンダルが表面化し、2000年9月14日夜にケーブルテレビ局カナルNがモンテシノスが野党議員アルベルト・コウリをフジモリのペルー2000党へ寝返らせるために買収したとみられる映像を放送したことで一気に噴出しました。フジモリへの支持は事実上崩壊し、数日後に彼は国民向け演説でSINを解体し自らは出馬しない新たな選挙を実施すると表明しました。11月10日、フジモリは2001年4月8日に選挙を行うことについて議会の承認を得ました。11月13日、フジモリはアジア太平洋経済協力会議に出席するためブルネイへ向けてペルーを発ちました。11月17日、フジモリはブルネイから東京へ移り、そこからファクスで大統領辞任を提出しました。議会はその辞任を受理せず、代わりに62対9でフジモリの罷免を可決しました。"
    PEU_2022_revolution.t:0 "ペルーの自己クーデター計画？"
    PEU_2022_revolution.d:0 "2022年12月7日、当時のペルー大統領ペドロ・カスティリョは罷免手続きが迫るなかで議会を違法に解散しようと試みました。この動きには夜間外出禁止令の即時発令、非常政府の樹立の試み、制憲議会の招集の呼びかけが含まれていました。"
    
    URU_1973_revolution.t:0 "ウルグアイの文民・軍事独裁政権？"
    URU_1973_revolution.d:0 "ウルグアイの文民・軍事独裁政権（1973年〜85年）はウルグアイ独裁とも呼ばれ、1973年6月27日の1973年クーデターの後から1985年3月1日まで12年間にわたりウルグアイを支配した権威主義的な軍事独裁政権です。この独裁政権は人権侵害や拷問の行使、そして多数のウルグアイ人が理由も明かされぬまま失踪したことにより、大きな論争の的となってきました。"
    URU_1985_revolution.t:0 "民主主義への回帰？"
    URU_1985_revolution.d:0 "1984年には政権に反対し政治犯を支持するストライキが起こりました。1984年1月13日には1973年以来初となる24時間ゼネストが組織されました。ウィルソン・フェレイラ・アルドゥナーテのように依然として有力な政治指導者がいたにもかかわらず、軍首脳部と文民政治家の対話は加速しました。1984年8月3日には海軍クラブ協定が調印され、1967年憲法が復活するとともに、軍が治安問題について助言し高級士官の任命を統制することが認められました。1984年11月25日に選挙が実施され、ラファエル・アディエゴ・ブルーノの短い大統領任期を経て、1985年3月1日にコロラド党のフリオ・マリア・サンギネッティが新大統領となりました。"
    
    SPA_1947_revolution.t:0 "王政の宣言？"
    SPA_1947_revolution.d:0 "国家元首継承法は、スペインのフランコ体制における権力機構を定めた8つの王国基本法のうち5番目にあたるものでした。同法は（1931年に第二共和政によって廃止された）スペイン王政の復活に向けた規定を設け、フランシスコ・フランコを終身のスペイン元首に任じました。後継者は国王または王国摂政の称号をもってフランコ自身が指名すると定められましたが、それはスペイン議会（コルテス）の承認を要するものでした。"
    SPA_1973_revolution.t:0 "ルイス・カレーロ・ブランコの台頭？"
    SPA_1973_revolution.d:0 "ルイス・カレーロ・ブランコ海軍大将はスペイン海軍の軍人であり政治家でした。1947年の国家元首継承法の主たる起草者でもありました。フランコは彼を政府首班の座における後継者として自ら選び、カレーロは1973年6月に就任しました。"
    SPA_1975_revolution.t:0 "フランシスコ・フランコの死"
    SPA_1975_revolution.d:0 "1973年、フランコは高齢と病のため首相を辞任しました。首相職は1967年以降、国家元首の職から切り離されていました。それでも彼は国家元首かつ最高司令官として権力の座にとどまりました。フランコは1975年に82歳で死去し戦没者の谷に埋葬されました。晩年には王政を復活させ、スペイン国王フアン・カルロスがその後を継いでスペインの民主化移行を主導しました。"
    SPA_1976_revolution.t:0 "スペインの民主化移行？"
    SPA_1976_revolution.d:0 "スペインの民主化移行とは、フランコ独裁体制からフアン・カルロス1世のもとでの立憲君主制という形で議会制が確立されるまでの体制転換を含む、スペイン現代史の一時期です。"
    
    POR_1968_revolution.t:0 "マルセロ・カエターノの台頭？"
    POR_1968_revolution.d:0 "1968年8月、サラザールは自宅で転倒した後に脳卒中を起こし昏睡状態に陥りました。在任36年を数えた79歳の彼はアメリコ・トマス大統領によって解任されました。トマスは1968年9月27日、サラザールの後任にカエターノを任命しました。カエターノは経済成長の促進に加え、社会保障を納める機会の無かった農村労働者へ月額年金を支給するといった社会改善に乗り出しました。"
    POR_1974_revolution.t:0 "カーネーション革命？"
    POR_1974_revolution.d:0 "カーネーション革命は1974年4月25日にリスボンで左派の軍人たちが権威主義的なエスタド・ノーヴォ政権を打倒した軍事クーデターであり、「進行中の革命過程」を通じてポルトガルとその海外植民地に社会・経済・領土・人口・政治の各面で大きな変化をもたらしました。これによりポルトガルは民主化へ移行しポルトガル植民地戦争も終結しました。"
    
    GRE_1967_revolution.t:0 "大佐たちの体制？"
    GRE_1967_revolution.d:0 "ギリシャ軍事政権、いわゆる大佐たちの体制は1967年から1974年までギリシャを支配した右派の軍事独裁政権です。1967年4月21日、ゲオルギオス・パパンドレウ率いる中道連合の勝利が有力視されていた総選挙の1か月前に、大佐たちの一団が暫定政権を打倒しました。"
    GRE_1973_revolution.t:0 "ギリシャ王政の廃止？"
    GRE_1973_revolution.d:0 "1973年7月ギリシャの軍事政権は国民投票を実施し、ギリシャ史上2度目となる王政の廃止が決定されました。続く1974年には民主的に選出されたコンスタンティノス・カラマンリス首相が改めて国民投票を実施し、廃止は正統に追認されました。"
    GRE_1974_revolution.t:0 "軍事政権の崩壊？"
    GRE_1974_revolution.d:0 "軍事政権の思想的かつ政治的な崩壊は、パパドプロスによる自由化の試みの直後に相次いだ一連の出来事によって引き起こされ、思想面での崩壊が最終的な政治的崩壊に先行しました。この不運な過程の最中とその後に軍事政権内部の政治的軋轢が表面化して各派閥が互いに争い、一枚岩に見えた独裁体制の結束は崩れ去りました。"
    GRE_1974_revolution_1.t:0 "ギリシャ共和制国民投票"
    GRE_1974_revolution_1.d:0 "1967年以来この国を支配してきた軍事政権が崩壊すると、共和派と王党派の長年にわたる対立が再燃しました。軍事政権は前年にも同じ問いをめぐる公正さの疑わしい国民投票を実施しており、共和制支持という結果を得たゲオルギオス・パパドプロスはこれを口実に自らを大統領と宣言していました。しかし軍事体制の崩壊と前月の自由選挙を経て、新たに選出されたコンスタンティノス・カラマンリス首相の政権は投票のやり直しを決定しました。軍政期の国民投票は選挙運営上も法的にも問題があると広く見なされていたためです。投票率75.6％のもと有権者の69.2％が共和制を支持しました。"
    
    CYP_1974_revolution.t:0 "キプロスのクーデター？"
    CYP_1974_revolution.d:0 "1974年のキプロス・クーデターは、キプロス国家警備隊が実行しギリシャ軍事政権が後援した軍事クーデターです。1974年7月15日、首謀者たちは現職のキプロス大統領マカリオス3世大主教を解任し、エノシス派の民族主義者ニコス・サンプソンを大統領の座に据えました。"
    CYP_1974_revolution_1.t:0 "キプロス民主主義の復活？"
    CYP_1974_revolution_1.d:0 "サンプソンの大統領職は短命に終わりました。アテネのイオアンニディス政権がトルコの侵攻からわずか数日で崩壊したからです。当時トルコはギリシャ本土への侵攻も辞さない構えを見せており、大佐たちは権力の座に留まることよりも国土の防衛に専念せざるを得なくなったと指摘されています。トルコの介入を予測することも阻止することもできなかったことで、政権の正統性と権威は著しく損なわれました。後ろ盾を失ったサンプソンは7月23日に辞任し、大統領職はグラフコス・クレリディスに引き継がれました。マカリオスは5か月間ロンドンに留まり、自らの政権こそが島全体の正統な政府であるとの国際的承認を取りつけることに成功したのち、キプロスの領土回復を目指して帰国しました。"
    
    BEL_1951_revolution.t:0 "レオポルド3世国王の退位？"
    BEL_1951_revolution.d:0 "1950年7月22日のレオポルド3世国王のベルギー帰国は、同国史上でも有数の激しいゼネストに迎えられました。憲兵隊が自動火器で発砲し、デモ参加者3名が死亡しました。国は内戦の瀬戸際に立たされ、リエージュをはじめとするワロン地域の各自治体ではベルギー国旗がワロン旗に掛け替えられました。国土の分裂を避け王政を守るため、レオポルドは1950年8月1日に権限と職務を20歳の息子ボードゥアンへ委ね、摂政に据えることを決断しました。そして政府の強い要請を受け、1951年7月16日にボードゥアンへ譲位して退位しました。"
    BEL_1993_revolution.t:0 "ベルギー連邦？"
    BEL_1993_revolution.d:0 "1970年、ブリュッセルのオランダ語話者とフランス語話者の共同体の間で市民同士の対立が高まったことを受け、政府は「単一国家は、法に定められたその構造と機能において、すでに時代遅れとなった」と宣言しました。新憲法はベルギー国内に強い共同体的・地域的な差異が存在することを認めたうえで、権限を共同体と地域へ分散させることによってその差異の調和を図ろうとしました。1993年、議会はベルギーを本格的な連邦国家へと変える一連の憲法改正を承認しました。"
    
    NET_1970_revolution.t:0 "脱柱状化？"
    NET_1970_revolution.d:0 "第二次世界大戦（この間はオランダの抵抗運動さえ柱状化されていました）の後、自由主義者や社会主義者だけでなくプロテスタントやカトリックも柱状化された体制に疑問を抱き始めました。1960年代には、とりわけD66やPvdA内のグループ「新左翼（Nieuw Links）」からの政治的批判を受けて、柱はおおむね崩壊しました。これに加えて人々の移動が活発になったことで、多くの人が他の柱に属する人々も自分たちとさほど変わらないと気づくようになりました。豊かさと教育水準の向上は人々を柱状化された数多くの制度から自立させ、若者はもはやこうした組織と結びつけられることを望まなくなりました。"
    
    LUX_1948_revolution.t:0 "ルクセンブルクの中立性の終焉？"
    LUX_1948_revolution.d:0 "ルクセンブルクは1948年に正式に中立性を放棄し、この変更を反映して憲法も改正されました。これに続いて1948年にはブリュッセル条約へ、1949年にはNATOへ加盟し、その中立的地位は決定的に終わりを迎えました。"
    
    SWI_1971_revolution.t:0 "スイス女性参政権国民投票？"
    SWI_1971_revolution.d:0 "女性参政権の導入を問う国民投票が1971年2月7日にスイスで実施されました。投票を認められたのは男性のみで、結果は65.7％が導入に賛成というものでした。それ以前の数年間にいくつかのカントンがすでに女性参政権を導入しており、スイス政府や複数の政党も女性参政権を積極的に支持していたため、この結果は予想されたものでした。"
    
    FRA_1958_revolution_0.t:0 "五月危機？"
    FRA_1958_revolution_0.d:0 "1958年5月のフランス危機は、アルジェリア独立戦争をめぐる緊張から生じた決定的な政治的動乱でした。5月13日、アルジェの右派軍人と入植者たちは、ピエール・プフリムランの首相就任がアルジェリア民族主義者との交渉につながることを恐れ、これに反対してクーデターを起こしました。ジャック・マシュ将軍に率いられ元総督ジャック・スーステルの支持を受けたこの蜂起は、シャルル・ド・ゴールのもとでの公安政府の樹立を要求しました。この危機は第四共和政の不安定さを露呈し、ついにはその崩壊とド・ゴールの権力復帰をもたらしました。ド・ゴールはより中央集権的で強靭な第五共和政を打ち立てたのです。"
    FRA_1958_revolution.t:0 "フランス第五共和政？"
    FRA_1958_revolution.d:0 "第五共和政は第四共和政の崩壊から生まれ、それまでの議会制共和国に代わって、国家元首たる大統領と政府の長たる首相との間で権力を分割する半大統領制（二元執政制）を採用しました。1958年憲法はまたフランス連合をフランス共同体へと改め、14の加盟領土（アルジェリアを除く）が独立を主張できるようにしました。"
    FRA_1961_revolution.t:0 "アルジェ・クーデター？"
    FRA_1961_revolution.d:0 "アルジェ・クーデターは、シャルル・ド・ゴール大統領にフランス領アルジェリアと在住の欧州系住民、そして親フランス派アルジェリア人を見捨てさせまいとして起こされ、失敗に終わったクーデターでした。フランス領アルジェリアにおいて退役したフランス陸軍将軍のモーリス・シャール（元フランス領アルジェリア総司令官）、エドモン・ジュオー（元フランス空軍監察総監）、アンドレ・ゼレール（元フランス陸軍参謀総長）、ラウル・サラン（元フランス領アルジェリア総司令官）によって組織され、アルジェリア戦争（1954年〜1962年）のさなかの1961年4月21日午後から26日にかけて決行され、国を内戦の瀬戸際まで追い込みました。"
    
    GBR_1979_revolution.t:0 "内閣不信任決議？"
    GBR_1979_revolution.d:0 "1979年3月28日、ジェームズ・キャラハン率いるイギリス労働党政権に対する内閣不信任決議が行われました。決議は野党党首マーガレット・サッチャーによって提出され、労働党政権はわずか1票差（311対310）で敗れ、その結果は午後10時19分に発表されました。これにより総選挙の実施が決まり、サッチャー率いる保守党が勝利を収めました。"
    
    RUS_1993_revolution.t:0 "ロシア憲政危機？"
    RUS_1993_revolution.d:0 "1993年9月から10月にかけて、ボリス・エリツィン大統領とロシア議会の対立からロシア連邦に憲政危機が生じました。エリツィン大統領は自己クーデターを敢行し、議会を解散して大統領令による統治体制を敷きました。危機はエリツィンが軍事力を用いてモスクワの最高会議ビルを攻撃し、議員たちを逮捕したことで終結しました。この事件を経てエリツィンは自らの地位を固め、行政府の権限をさらに拡大し、1993年ロシア連邦憲法の採択を押し通しました。"
    RUS_2000_revolution.t:0 "ウラジーミル・プーチンの台頭？"
    RUS_2000_revolution.d:0 "1999年12月31日、エリツィン大統領は突如辞任し、就任間もない首相であり自ら後継者に指名したウラジーミル・プーチンにその職を委ねました。プーチンはその後2000年の大統領選挙に勝利し、第二次チェチェン戦争でチェチェンの武装勢力を打ち破りました。プーチンの統治は安定をもたらす一方で、ロシアを権威主義国家へと変貌させました。"
    RUS_2023_revolution.t:0 "ワグネル・グループの反乱？"
    RUS_2023_revolution.d:0 "2023年6月23日、ロシアの民間軍事会社ワグネル・グループがロシア政府に対する大規模な武装蜂起を起こしました。これは約半年前に始まったワグネル・グループと国防省の対立が頂点に達した出来事でした。ウクライナでワグネル・グループの活動を率いていたロシアの新興財閥エフゲニー・プリゴジンは、翌日に合意が成立すると矛を収めました。"
    RUS_2020_revolution.t:0 "ロシア憲法改正？"
    RUS_2020_revolution.d:0 "2020年1月に提案された2020年の憲法改正は、1993年制定のロシア連邦憲法に対する2度目の実質的な改正です。この改正を導入するため、ロシア大統領ウラジーミル・プーチンは全国投票を実施しました。改正案は7月1日の国民投票で承認されました。"
    
    UKR_2004_revolution.t:0 "オレンジ革命？"
    UKR_2004_revolution.d:0 "オレンジ革命は、2004年11月下旬から2005年1月にかけてウクライナに政変をもたらした一連の抗議運動です。大規模な汚職・有権者への威圧・選挙不正にまみれたとされる2004年ウクライナ大統領選挙の決選投票の結果をきっかけに、主に一般民衆の主導によって勢いを増しました。全国規模の抗議は、当初の決選投票の結果が無効とされ、ウクライナ最高裁判所が2004年12月26日の再投票を命じたことで実を結びました。国内外の監視団による厳しい監視の下で行われた2度目の決選投票は「自由かつ公正」と宣言されました。最終結果はユシチェンコが約52％、ヤヌコーヴィチが44％の得票となり、ユシチェンコの明確な勝利を示しました。"
    UKR_2010_revolution.t:0 "ヴィクトル・ヤヌコーヴィチの選挙？"
    UKR_2010_revolution.d:0 "ウクライナの大統領選挙は2010年1月17日に実施されました。過半数を得た候補がいなかったため、2月7日にユリヤ・ティモシェンコ首相と野党指導者ヴィクトル・ヤヌコーヴィチによる決選投票が行われました。2月14日にヤヌコーヴィチが得票率50％で次期大統領かつ勝者と宣言されました。"
    UKR_2014_revolution.t:0 "マイダン革命？"
    UKR_2014_revolution.d:0 "マイダン革命としても知られる尊厳の革命は、ユーロマイダン抗議運動の末期にあたる2014年2月のウクライナで起こりました。首都キーウで抗議者と国家治安部隊が衝突して死者を出し、選出された大統領ヴィクトル・ヤヌコーヴィチの追放、2004年ウクライナ憲法への復帰、そして2014年のロシア・ウクライナ戦争の勃発へとつながりました。"
    UKR_2019_revolution.t:0 "ヴォロディミル・ゼレンスキーの選挙？"
    UKR_2019_revolution.d:0 "ゼレンスキーは2018年12月31日の夜、当時の大統領ポロシェンコによる新年の挨拶と並んで2019年大統領選挙への出馬を表明しました。決選投票で73.23％を得票してポロシェンコを破り勝利しました。彼は反体制かつ反汚職の政治家として自らを位置づけています。"
    
    YUG_1974_revolution.t:0 "1974年憲法？"
    YUG_1974_revolution.d:0 "406の条文を備えた1974年憲法は世界で最も長い憲法の一つでした。自主管理制度を国家の干渉から守り、あらゆる選挙と政策の場における共和国および自治州の代表を拡大する詳細な条文が加えられました。憲法は再編された連邦議会を自主管理制度の最高の表現と称しました。"
    YUG_1980_revolution.t:0 "ヨシップ・ブロズ・チトーの死"
    YUG_1980_revolution.d:0 "チトーは1979年を通じて病状を悪化させていきました。1980年1月7日と1月11日の二度にわたり、チトーは脚の血行障害のためスロベニア社会主義共和国の首都リュブリャナにある大学医療センターへ入院しました。まもなく動脈の閉塞により左脚を切断し、88歳の誕生日を3日後に控えた1980年5月4日午後3時5分、リュブリャナ医療センターで壊疽のため死去しました。"
    
    tito_death.option:0 "安らかに眠れ"
    
    SER_2000_revolution.t:0 "民主主義への回帰？"
    SER_2000_revolution.d:0 "ミロシェヴィッチの統治は観察者から権威主義的あるいは独裁的、さらには収奪的だと評され、選挙不正や政治的暗殺、報道の自由の抑圧、警察による暴力が数多く告発されてきました。スロボダン・ミロシェヴィッチの打倒は2000年9月24日の総選挙を経てユーゴスラビア連邦共和国で始まり、2000年10月5日のミロシェヴィッチ政権の崩壊として結実しました。"
    
    ALB_1997_revolution.t:0 "アルバニア王政復古国民投票"
    ALB_1997_revolution.d:0 "1997年6月29日、アルバニアで議会選挙と同時に王政の復活を問う国民投票が実施されました。この提案は投票者の66.7％により否決されました。しかし元王太子レカは65.7％が賛成したと主張しました。"
    
    ROM_1965_revolution.t:0 "ニコラエ・チャウシェスクの台頭？"
    ROM_1965_revolution.d:0 "チャウシェスクはゲオルゲ・ゲオルギュ＝デジの社会主義政権で昇進を重ね、1965年のゲオルギュ＝デジの死去に伴いルーマニア共産党の書記長として指導者の地位を継ぎました。権力を握ると報道検閲を緩和し、1968年8月21日の演説ではワルシャワ条約機構軍によるチェコスロバキア侵攻を公然と非難して人気が急上昇しました。しかしその安定の時期は短く、政権はほどなく全体主義的なものとなり当時の東側諸国で最も抑圧的だとみなされるに至りました。"
    ROM_1967_revolution.t:0 "布告第770号を発布するか？"
    ROM_1967_revolution.d:0 "布告第770号は1967年に署名されたニコラエ・チャウシェスクの共産主義ルーマニア政府による布告です。中絶と避妊を制限し、新たに巨大なルーマニアの人口を生み出すことを狙いとしていました。"
    ROM_1974_revolution.t:0 "体系化政策を制定するか？"
    ROM_1974_revolution.d:0 "体系化政策とはチャウシェスク政権下で実施された都市計画の事業を指します。1974年に始まったこの政策は主として既存の村や町や都市を全部または一部取り壊して再建するもので、ルーマニアを「多面的に発展した社会主義社会」へと変えることを公式の目標に掲げていました。1980年代に入るとチャウシェスクは前例のない規模の宮殿と、それに見合う壮大な街区チェントルル・チヴィクの建設に取り憑かれていきました。"
    
    EGR_1950_revolution.t:0 "ヴァルター・ウルブリヒトの台頭？"
    EGR_1950_revolution.d:0 "第二次世界大戦の終結後、ウルブリヒトはソ連占領地区でドイツ共産党をスターリン主義の路線に沿って再編しました。1946年にはKPDとSPDを強制的に合同させてドイツ社会主義統一党（SED）を成立させる上で中心的な役割を果たしました。そして1950年にSEDの第一書記となり、成立して間もない東ドイツの事実上の指導者となりました。"
    EGR_1971_revolution.t:0 "エーリッヒ・ホーネッカーの台頭？"
    EGR_1971_revolution.d:0 "1970年、ホーネッカーは政治的な権力闘争を仕掛け、ソ連の指導者レオニード・ブレジネフの支持を得てヴァルター・ウルブリヒトに代わりSED書記長兼国防評議会議長の座に就きました。"
    
    POL_1956_revolution.t:0 "ポーランドの十月？"
    POL_1956_revolution.d:0 "ポーランドの十月とは1956年10月にポーランド人民共和国で起きた政治の転換です。ヴワディスワフ・ゴムウカが与党ポーランド統一労働者党（PZPR）の第一書記に就任し、ポーランドにおけるスターリン主義の終わりを告げました。ソ連はゴムウカ派との妥協を迫られ、短いながらも緊迫した交渉が行われました。ソ連はモスクワへの忠誠を保つことと引き換えに、ゴムウカの続投とポーランドのより大きな自治を認めました。"
    POL_1970_revolution.t:0 "十二月抗議運動？"
    POL_1970_revolution.d:0 "1970年のポーランド抗議運動は1970年12月事件とも呼ばれ、1970年12月14日から19日にかけてポーランド北部で発生しました。抗議のきっかけは食料品をはじめとする日用品の突然の値上げでした。党指導部はワルシャワで会合を開き、思い切った措置を取らなければ全面的な労働者階級の反乱は避けられないと判断しました。モスクワのレオニード・ブレジネフの同意のもとゴムウカやクリシュコら指導者は辞任を余儀なくされました。値上げがゴムウカに対する陰謀だったとすれば、それは成功したことになります。モスクワがミェチスワフ・モチャルを認めなかったため、新たな指導者にはエドヴァルド・ギェレクが起用されました。"
    POL_1981_revolution.t:0 "戒厳令？"
    POL_1981_revolution.d:0 "1981年2月11日、ヤルゼルスキは閣僚評議会議長（首相）に任命されました。10月18日、スタニスワフ・カニャはソ連指導部を批判する発言を盗聴器に記録され、ポーランド統一労働者党中央委員会第一書記の座を追われました。後任にはヤルゼルスキが選出されました。1981年12月13日、ヤルゼルスキはテレビ演説で戒厳令の導入を発表しました。前日には国家評議会の採決によりその導入が正式に承認されていました。"
    
    IRQ_1958_revolution.t:0 "7月14日革命？"
    IRQ_1958_revolution.d:0 "7月14日革命は1958年のイラク軍事クーデターとも呼ばれ、1958年7月14日にイラクで発生したクーデターです。これによりファイサル2世は退位させられ、ハーシム家が率いるイラク王国は打倒されました。その後に樹立されたイラク共和国は、わずか6か月前に成立したイラクとヨルダンによるハーシム家のアラブ連邦に終止符を打ちました。"
    IRQ_1963_revolution.t:0 "ラマダン革命？"
    IRQ_1963_revolution.d:0 "ラマダン革命は1963年にバアス党イラク地域指導部が起こした軍事クーデターであり、イラク首相アブドゥル・カリーム・カーシムを打倒しました。1963年2月8日から10日にかけて発生した出来事です。カーシムのかつての副官でバアス党員ではなかったアブドゥッサラーム・アーリフには、ほぼ儀礼的な地位である大統領の称号が与えられ、バアス党の有力な将軍アフマド・ハサン・アル＝バクルが首相に指名されました。この政権は約9か月続きましたが、1963年11月のイラク・クーデターでアーリフが国民警備隊を武装解除し、その後バアス党員の粛清が行われました。"
    IRQ_1966_revolution.t:0 "アブドゥッサラーム・アーリフの死？"
    IRQ_1966_revolution.d:0 "1966年4月13日、アーリフはバスラ空港から約10キロメートル離れたイラク南部で、イラク空軍のデ・ハビランドDH.104ダブ1型機RF392の墜落により死亡し、大統領の座は弟のアブドゥッラフマーンが継ぎました。アブドゥッラフマーン・アル＝バッザーズが3日間だけ大統領代行を務め、大統領職をめぐる権力闘争が起こりました。大統領を選出する国防評議会と閣議の最初の会合では、アル＝バッザーズが大統領の座を得るには3分の2の多数が必要でした。アル＝バッザーズはこれに失敗し、アブドゥッラフマーン・アーリフが大統領に選出されました。"
    IRQ_1968_revolution.t:0 "7月17日革命？"
    IRQ_1968_revolution.d:0 "7月17日革命は、アフマド・ハサン・アル＝バクル、アブド・アッ＝ラッザーク・アン＝ナーイフ、アブド・アッ＝ラフマーン・アッ＝ダーウードが主導した1968年のイラクにおける無血クーデターであり、アブドゥッラフマーン・アーリフ大統領とターヒル・ヤフヤー首相を追放してアラブ社会主義バアス党イラク地域指導部を政権の座につけました。このクーデターと、それに続くナーイフ率いる穏健派の粛清に関わったバアス党員には、ハルダーン・アッ＝ティクリーティー、サーリフ・マフディー・アンマーシュ、そして後のイラク大統領サダム・フセインがいました。"
    IRQ_1979_revolution.t:0 "バアス党政権下のイラク？"
    IRQ_1979_revolution.d:0 "1970年代半ばまでに、サダム・フセインは党の情報機関の長という地位を通じて、アル＝バクルが法律上の大統領であったにもかかわらず事実上の国家指導者となりました。サダムの新政策の下でイラク経済と国民の生活水準はともに向上し、アラブ世界におけるイラクの地位は大きく高まりました。"
    IRQ_2003_revolution.t:0 "サダム・フセインの裁判？"
    IRQ_2003_revolution.d:0 "2003年、米国主導の有志連合は、サダムが大量破壊兵器を開発しアルカイダと結びついているという虚偽の非難を掲げてイラクに侵攻しました。連合軍が戦争に早々と勝利するとバアス党は非合法化されサダムは潜伏しました。2003年12月13日に拘束された後、その裁判はイラク暫定政府の下で行われました。2006年11月5日、サダムは140人を超えるシーア派ムスリムが殺害された1982年のドゥジャイル事件をめぐり、人道に対する罪でイラク高等法廷から有罪判決を受け絞首刑を言い渡されました。刑は2006年12月30日に執行されました。"
    
    LBY_1963_revolution.t:0 "連邦王国の廃止？"
    LBY_1963_revolution.d:0 "1960年代初頭に石油資源の開発が進むと、リビアは1963〜68年の第一次5カ年計画に着手しました。しかし石油による新たな富がもたらした負の結果の一つが、顧みられなくなったことによる農業生産の落ち込みでした。リビアの国内政治は引き続き安定していましたが、連邦制の統治形態は非効率で煩雑であることが明らかになっていました。1963年4月、ムハンマド・オスマン・エセド首相は連邦制を廃止し、それに代えて中央政府が強い権限を持つ単一の君主制国家を樹立する法案を議会で可決させ、国王もこれを裁可しました。"
    LBY_1969_revolution.t:0 "アル・ファーティフ革命？"
    LBY_1969_revolution.d:0 "1969年のリビア革命は、アル・ファーティフ革命または9月1日革命とも呼ばれ、ムアンマル・カダフィ大佐が率いる自由将校団によって実行されたクーデターであり革命でした。これによりイドリース1世王のサヌーシー朝は打倒され、リビア・アラブ共和国が樹立されました。"
    LBY_1977_revolution.t:0 "社会主義人民リビア・アラブ国？"
    LBY_1977_revolution.d:0 "1977年3月2日、カダフィは全人民会議に人民権力樹立宣言を採択させ、リビアを社会主義人民リビア・アラブ国と宣言しました。カダフィの第三国際理論を具現化するものとされたこの体制は、従来の統治機構を全人民委員会と各地の基礎人民会議に置き換え、政党の無い直接民主制を実現すると称しました。しかし実際には権力はカダフィの指導の下に集中し、国民国家という観念よりも部族への忠誠が優先されました。"
    
    NYE_1962_revolution.t:0 "北イエメンのクーデター？"
    NYE_1962_revolution.d:0 "戦争は1962年、アブドゥッラー・アッ・サラールの指揮する軍を中心とした革命派の共和主義者によるクーデターで幕を開けました。彼は即位したばかりの国王兼イマームであるムハンマド・アル・バドルを退位させ、自らを大統領とする共和国の樹立を宣言しました。その政府はイエメンの奴隷制を廃止しました。"
    
    SYE_1969_revolution.t:0 "修正運動？"
    SYE_1969_revolution.d:0 "矯正運動とは、1969年6月22日の無血の内部クーデターにより、アブドゥル・ファッターフ・イスマーイールとサーリム・ルバイエが率いるマルクス主義派閥がイエメン民族解放戦線を掌握し、穏健派のカフターン・シャアビー大統領を打倒した出来事です。この左派による権力掌握はのちにイエメン社会党（YSP）の結成と、南イエメンの社会主義国家への転換をもたらしました。"
    SYE_1990_revolution.t:0 "共産主義政権の崩壊？"
    SYE_1990_revolution.d:0 "PDRYの主要な後ろ盾であったソ連でのペレストロイカを背景に、1980年代後半に政治改革が始まりました。政治犯は釈放され、政党が結成され、司法制度は北イエメンよりも公正だと見なされました。"
    
    SEY_1977_revolution.t:0 "セーシェル社会主義国家？"
    SEY_1977_revolution.d:0 "1977年から1991年までセーシェルは、フランス＝アルベール・ルネとセーシェル人民進歩戦線による一党制国家として統治されました。"
    SEY_1991_revolution.t:0 "民主主義の復活？"
    SEY_1991_revolution.d:0 "新憲法の最初の草案は1992年に必要な60％の賛成を得られませんでしたが、修正版が1993年に承認されました。"
    
    SOM_1969_revolution.t:0 "ソマリア民主共和国？"
    SOM_1969_revolution.d:0 "ソマリア民主共和国とは、1969年10月21日のクーデターで権力を握った社会主義軍事政権が、モハメド・シアド・バーレ大統領（少将）のもとでソマリアに与えた国名です。このクーデターは護衛が第2代大統領アブディラシッド・シェルマルケを暗殺した数日後に起こりました。バーレ政権はその後21年間ソマリアを統治し、1991年にソマリアは内戦へと崩れ落ちました。"
    SOM_1991_revolution.t:0 "ソマリア民主共和国の崩壊？"
    SOM_1991_revolution.d:0 "ソマリア反乱は1980年代から1990年代初頭にかけて起きたソマリア内戦の発端となりました。反乱が始まったのは1978年、シアド・バーレ大統領が自らの特殊部隊を用いて政権に反対する氏族単位の反体制派集団を攻撃し始めたときのことです。反体制派は、バーレがソ連からアメリカへ突如として支持を切り替え、さらに1977年から78年の破滅的なオガデン戦争を経たことで、10年近くにわたり勢力を強めていました。1986年5月23日にバーレが自動車事故で負傷すると、政権内の政敵や反体制勢力はいっそう大胆になり公然たる紛争へと突入しました。1991年1月26日のシアド・バーレの首都脱出は、紛争の明確な転機となりました。"
    SOM_1993_revolution.t:0 "ソマリア内戦？"
    SOM_1993_revolution.d:0 "1990年から92年にかけて慣習法は一時的に崩壊し、派閥間の戦闘が各地に広がりました。中央政府を欠いたソマリアは「破綻国家」となったのです。これを受けて1992年7月にUNOSOM Iの国連軍事監視員が到着し、続いてより大規模なUNITAFおよびUNOSOM IIの任務が展開されました。1993年にソマリアの武装勢力とUNOSOM II部隊との間で武力衝突が起きた後、国連は1995年にソマリアから撤退しました。"
    SOM_1995_revolution.t:0 "モハメド・ファッラ・アイディードの失脚？"
    SOM_1995_revolution.d:0 "1991年初頭、他の武装反体制勢力と共にモハメド・ファッラ・アイディードはバーレ大統領の22年に及ぶ政権の打倒に成功し、内戦の全面的な勃発を招きました。アイディードは新たなソマリア政府の大統領の座を望んでおり、国民政府を樹立すべく他の政治・軍事組織との同盟や統合を模索しました。1993年6月5日の衝突でUNOSOM II部隊に数十名の死者が出ると、SNAひいてはアイディードがその責を負わされ、彼は国際連合が最初に指名手配した人物の一人となりました。米国主導による1993年7月12日の「血の月曜日」襲撃で彼の属するハブル・ギディル氏族の有力者が多数死亡すると、アイディードは初めて意図的に米軍を標的とし始めました。ビル・クリントン大統領はこれに対しゴシック・サーペント作戦を発動し、彼を捕らえるためデルタフォースとレンジャー任務部隊を派遣しました。モガディシュにおける彼の民兵組織とかつての盟友オスマン・アリ・アトの勢力との戦闘中、アイディードは狙撃により致命傷を負い、1996年8月2日に死亡しました。"
    SOM_2006_revolution.t:0 "イスラム法廷連合の台頭？"
    SOM_2006_revolution.d:0 "イスラム法廷連合は、ソマリア内戦に起因する無法状態に対抗するため2000年代初頭にモガディシュのシャリーア法廷によって設立された法的・政治的組織です。2006年の半ばから後半にかけてイスラム法廷はその影響力を拡大し、ソマリア南部および中部の大半で事実上の政府となり、1991年以来初めて国家と呼べるものを築き上げることに成功しました。"
    
    CAR_1965_revolution.t:0 "サン＝シルヴェストルのクーデター？"
    CAR_1965_revolution.d:0 "サン＝シルヴェストルのクーデターは、1965年12月31日から1966年1月1日にかけて中央アフリカ共和国（CAR）軍の総司令官ジャン＝ベデル・ボカサとその配下の将校らがダビド・ダッコ大統領の政府に対して起こしたクーデターです。"
    CAR_1976_revolution.t:0 "中央アフリカ帝国？"
    CAR_1976_revolution.d:0 "中央アフリカ帝国は1976年12月4日、当時の中央アフリカ共和国大統領ジャン＝ベデル・ボカサが自ら中央アフリカ皇帝を名乗ったことで成立しました。ボカサの正式な称号は「国民政治政党MESANのもとに結集した中央アフリカ国民の意思による中央アフリカ皇帝」であり、「皇帝陛下」の敬称が用いられました。その宝器や豪奢な戴冠式、そして体制は、フランス第一共和政を第一帝政へと変えたナポレオン1世に大きく影響を受けたものでした。"
    CAR_1979_revolution.t:0 "カバン作戦？"
    CAR_1979_revolution.d:0 "カバン作戦は1979年9月にフランスが実施した無血の軍事作戦で、皇帝ボカサ1世を廃位し、亡命していた前大統領ダビド・ダッコを復権させ、中央アフリカ帝国の国名を中央アフリカ共和国へ戻すものでした。"
    
    CNG_1965_revolution.t:0 "コンゴのクーデター？"
    CNG_1965_revolution.d:0 "モブツは1965年11月25日に再びクーデターを起こし、大統領と首相の双方を排除して政権を掌握しました。断続的な蜂起や動乱はあったものの、モブツは1990年代半ばまでコンゴ（1971年にザイールと改称）を統治し続けました。"
    CNG_1971_revolution.t:0 "ザイール共和国？"
    CNG_1971_revolution.d:0 "1965年以降モブツは国の政治を支配し、幾度も国家体制を再編して「国父」の称号を名乗りました。そして1971年10月27日に国名をザイール共和国へ改めることを発表しました。"
    CNG_1997_revolution.t:0 "ザイールの崩壊？"
    CNG_1997_revolution.d:0 "ザイールは1990年代後半、ルワンダ虐殺の余波による東部地域の不安定化と民族間暴力の拡大のなかで崩壊しました。1996年、AFDL民兵組織を率いるローラン＝デジレ・カビラがモブツに対する民衆蜂起を主導しました。反乱軍が西へ進撃して戦果を挙げるなか、モブツは国外へ逃亡し、カビラの軍が国を掌握しました。翌年、国名はコンゴ民主共和国に戻されました。"
    CNG_2006_revolution.t:0 "民主主義の復活？"
    CNG_2006_revolution.d:0 "2006年7月30日にコンゴ民主共和国で総選挙が実施されました。41年ぶりとなる同国の複数政党制選挙であり、9年前に長期にわたる指導者モブツ・セセ・セコが打倒されて以来初の選挙でもありました。有権者は新たな共和国大統領と議会下院である国民議会の双方を選出するため投票所へ向かいました。"
    
    KNG_1960_revolution.t:0 "フュルベール・ユールーの大統領就任？"
    KNG_1960_revolution.d:0 "フュルベール・ユールーはコンゴの民族主義指導者であり、元カトリック司祭でもあった人物で、1960年の独立とともにコンゴ共和国の初代大統領となりました。1960年8月にユールーは自国を独立へと導きました。同年12月にはブラザヴィルで大陸間会議を主催し、経済的自由主義の利点を称賛して共産主義を非難しました。"
    KNG_1963_revolution.t:0 "トロワ・グロリユーズ？"
    KNG_1963_revolution.d:0 "トロワ・グロリユーズ（「栄光の三日間」の意）は1963年8月13日から15日にかけてコンゴ・ブラザヴィルで発生した蜂起です。野党系の労働組合運動とコンゴ青年同盟が軍と手を結んだことで、この蜂起は初代コンゴ大統領フュルベール・ユールーの統治を終わらせました。"
    KNG_1968_revolution.t:0 "コンゴのクーデター？"
    KNG_1968_revolution.d:0 "1968年9月4日、数日にわたる激しい衝突を経てアルフォンス・マサンバ＝デバの政権は軍によって倒され、マサンバ＝デバは辞任を強いられました。その後アルフレッド・ラウルが元首代行を務め、1969年1月にはマサンバ＝デバを権力の座へ押し上げたのと同じ政党の議長であるマリアン・ングアビが実権を握りました。"
    KNG_1977_revolution.t:0 "マリアン・ングアビ暗殺？"
    KNG_1977_revolution.d:0 "1977年3月18日14時30分、ングアビ大統領が暗殺されました。暗殺への関与を問われた者たちは裁判にかけられ、マサンバ＝デバやバルテルミー・キカディディを含む一部は処刑されました。暗殺後は党軍事委員会（CMP）が暫定政権を率いることとなり、保守派のジョアシャン・ヨンビ＝オパンゴ大佐が元首を務めました。"
    KNG_1979_revolution.t:0 "ドニ・サスヌゲソの台頭？"
    KNG_1979_revolution.d:0 "1977年3月のングアビ暗殺を受けヨンビ＝オパンゴが元首となりました。彼は2年近く在任しましたが1979年2月に辞任を余儀なくされました。PCT内で「右派分派」を結成しようとしたとして告発され、その後は後継者のドニ・サスヌゲソ大統領により数年にわたって拘束されました。自宅軟禁に置かれただけでなくPCTから除名され1979年には財産を没収されました。さらに1979年10月20日の発表によれば、将軍から一兵卒へと降格されました。"
    KNG_1992_revolution.t:0 "コンゴ人民共和国の終焉？"
    KNG_1992_revolution.d:0 "コンゴ人民共和国は1991年のソビエト連邦解体を受けて複数政党制へ移行し、かつての国名と国旗を復活させ1992年3月までに消滅しました。アンドレ・ミロンゴが暫定首相に任命されました。ドニ・サスヌゲソ大統領は移行期間中、儀礼的な地位で在任を認められました。"
    KNG_1997_revolution.t:0 "ドニ・サスヌゲソの復帰？"
    KNG_1997_revolution.d:0 "1997年、ドニ・サスヌゲソは凄惨な内戦の末にコンゴ＝ブラザヴィルで権力を奪還しました。アンゴラ軍の後ろ盾を得た彼のコブラ民兵はパスカル・リスバ大統領を追放しました。この紛争はブラザヴィルを荒廃させ数千人の死者を出しましたが、サスヌゲソの実力者としての復帰を決定づけ、コンゴの短い民主主義の実験に幕を引いて彼の統治を復活させました。"
    
    TAN_1962_revolution.t:0 "大統領制共和国？"
    TAN_1962_revolution.d:0 "イギリスの統治は1961年12月9日に終わりました。1952年にイギリス王位に就いたエリザベス2世はタンガニーカ独立後の最初の1年も君主であり続けましたが、それは明確にタンガニーカ女王としてであり、総督がその代理を務めました。1962年12月9日、タンガニーカは行政権を持つ大統領を戴く民主共和国となりました。"
    TAN_1964_revolution.t:0 "一党制国家？"
    TAN_1964_revolution.d:0 "1962年、タンガニーカは共和国となり、ニエレレが初代大統領に選出されました。その政権は脱植民地化と官僚機構の「アフリカ化」を推し進める一方、アフリカ系住民と国内のアジア系・ヨーロッパ系少数派との融和を促しました。彼は一党制国家の樹立を後押しし、汎アフリカ主義の立場からウガンダ・ケニアとの東アフリカ連邦の結成を目指しましたが実現しませんでした。1964年のザンジバル革命の後、ザンジバル島はタンガニーカと統合してタンザニアとなりました。これ以降ニエレレは国家の自立と社会主義をいっそう重視するようになりました。"
    TAN_1992_revolution.t:0 "部分的な民主化？"
    TAN_1992_revolution.d:0 "1992年、タンザニア憲法が改正され複数政党の存在が認められました。1995年に実施されたタンザニア初の複数政党制選挙では、与党のチャマ・チャ・マピンドゥジが国民議会の選挙議席232のうち186を獲得し、ベンジャミン・ムカパが大統領に選出されました。"
    
    UGA_1971_revolution.t:0 "ウガンダのクーデター？"
    UGA_1971_revolution.d:0 "1971年のウガンダのクーデターは、1971年1月25日にイディ・アミン将軍率いるウガンダ軍がミルトン・オボテ大統領の政権に対して実行した軍事クーデターです。権力の奪取は、オボテがシンガポールで開かれた英連邦首脳会議に出席するため国外にいる間に行われました。アミンは自分が解任されることを恐れ、自ら独裁者の座に就きました。"
    UGA_1979_revolution.t:0 "イディ・アミンの失脚？"
    UGA_1979_revolution.d:0 "1970年代後半にアミンの統治が進むにつれ、特定の民族集団や政治的反対派への迫害に対する不満が高まりました。加えて1976年にアミンがPFLP-EOとRZのハイジャック犯を支援してイスラエルのエンテベ作戦を招いたことで、ウガンダの国際的な立場は著しく悪化しました。さらにアミンは1978年、タンザニアのカゲラ地域の併合を試みます。これに対しタンザニアのジュリウス・ニエレレ大統領は軍にウガンダ侵攻を命じました。タンザニア軍と反乱勢力は1979年にカンパラの制圧に成功し、アミンを権力の座から追放しました。"
    UGA_1996_revolution.t:0 "部分的な民主化？"
    UGA_1996_revolution.d:0 "ムセベニ政権下で最初の選挙が1996年5月9日に実施されました。ムセベニは「政党間勢力連合」の候補として出馬した民主党のポール・セモゲレレと新興候補のキビリゲ・マヤンジャを破りました。有権者の投票率は72.6％で、ムセベニは75.5％の得票を集めて勝利しました。国際および国内の監視団は投票を有効と評価しましたが、敗れた両候補は結果を拒否しました。ムセベニは1996年5月12日に2度目の大統領就任宣誓を行いました。"
    
    BRD_1966_revolution.t:0 "ブルンジのクーデター？"
    BRD_1966_revolution.d:0 "1966年11月28日、ブルンジの26歳の首相ミシェル・ミコンベロがクーデターにより19歳のブルンジ国王（ムワミ）ンタレ5世を追放しました。ンタレは当時国外におりクーデターの指導者たちは速やかに実権を掌握しました。"
    BRD_1976_revolution.t:0 "ブルンジのクーデター？"
    BRD_1976_revolution.d:0 "1976年、ツチ人のジャン=バティスト・バガザ大佐が無血クーデターを主導してミコンベロを打倒し改革の推進に着手しました。彼の政権は1981年に新憲法を起草しましたが、ブルンジの一党制国家という体制は維持されました。1984年8月にバガザは国家元首に選出されました。在任中のバガザは政敵を抑圧し信教の自由を制限しました。"
    BRD_1987_revolution.t:0 "ブルンジのクーデター？"
    BRD_1987_revolution.d:0 "ツチ人のピエール・ブヨヤ少佐は1987年にバガザを打倒し、憲法を停止して政党を解散させました。彼は国家救済軍事委員会（CSMN）による軍政を復活させました。"
    BRD_1993_revolution.t:0 "憲法改革？"
    BRD_1993_revolution.d:0 "ブヨヤは国民和解委員会を設置し、同委員会は1992年に複数政党制と民族によらない政府を認める新憲法を作成しました。1993年のブルンジ大統領選挙に候補として出馬した彼は、野党FRODEBUのフツ人候補メルシオール・ンダダイエに敗れました。"
    
    ZAN_1964_revolution.t:0 "ザンジバル革命？"
    ZAN_1964_revolution.d:0 "ザンジバル革命は1964年1月12日に始まり、島の多数派である黒人アフリカ系住民がザンジバル・スルタンのジャムシド・ビン・アブドゥッラーとその主にアラブ系からなる政府を打倒しました。カルメはザンジバルとタンガニーカの合併交渉をまとめ上げ、新国家タンザニアを樹立しました。当時のメディアはこの合併をザンジバルへの共産主義的浸透を防ぐ試みと評しました。この革命はザンジバルにおける250年以上に及ぶアラブ人支配を終わらせました。"
    
    ETH_1974_revolution.t:0 "エチオピアのクーデター？"
    ETH_1974_revolution.d:0 "1974年9月12日、皇帝ハイレ・セラシエはソ連の支援を受けた軍事政権である軍・警察・郷土軍調整委員会によって廃位されました。同委員会はその後デルグとして1991年5月28日までエチオピアを統治しました。"
    ETH_1991_revolution.t:0 "デルグの崩壊？"
    ETH_1991_revolution.d:0 "デルグの崩壊とは、反政府連合であるエチオピア人民革命民主戦線（EPRDF）が1991年5月28日にアディスアベバで支配者である軍事政権デルグを打倒した軍事作戦であり、これによってエチオピア内戦は終結しました。"
    
    ANG_1975_revolution.t:0 "アンゴラ人民共和国？"
    ANG_1975_revolution.d:0 "アンゴラ人民共和国は1975年の独立から1992年8月25日まで、アンゴラ内戦のさなかにアンゴラを統治した自称社会主義国家です。これを率いたアンゴラ解放人民運動は内戦に勝利し、以後は社会民主主義共和国として同国を統治しています。"
    ANG_1979_revolution.t:0 "ジョゼ・エドゥアルド・ドス・サントス政権？"
    ANG_1979_revolution.d:0 "ジョゼ・エドゥアルド・ヴァン＝ドゥネン・ドス・サントスはアンゴラの政治家・軍人であり、1979年から2017年まで第2代アンゴラ大統領を務めました。大統領としてアンゴラ軍（FAA）の最高司令官を兼ね、1975年の独立以来アンゴラを統治してきた与党アンゴラ解放人民運動（MPLA）の議長も務めました。2017年の退任時点で在任期間はアフリカで2番目に長く、これを上回るのは赤道ギニアのテオドロ・オビアン・ンゲマ・ンバソゴだけでした。"
    ANG_1991_revolution.t:0 "ビセッセ合意？"
    ANG_1991_revolution.d:0 "ビセス合意（エストリル合意とも呼ばれます）は、国連UNAVEM II部隊の監視下でアンゴラを複数政党制民主主義へ移行させる道筋を定めたものです。MPLAのジョゼ・エドゥアルド・ドス・サントス大統領とUNITAのジョナス・サヴィンビが1991年5月31日にポルトガルのリスボンで合意に署名しました。"
    ANG_2017_revolution.t:0 "ジョアン・ロウレンソ政権？"
    ANG_2017_revolution.d:0 "ジョアン・マヌエル・ゴンサルベス・ロウレンソはアンゴラの政治家で、2017年9月26日より第3代アンゴラ大統領を務めています。[4]それ以前は2014年から2017年まで国防相を務めていました。2018年9月には与党アンゴラ解放人民運動（MPLA）の議長に就任しました。1998年から2003年までは同党の書記長を務めています。"
    
    MOZ_1975_revolution.t:0 "モザンビーク人民共和国？"
    MOZ_1975_revolution.d:0 "モザンビーク人民共和国は1975年から1990年まで現在のモザンビークに存在した社会主義国家です。1975年6月にポルトガルから独立を達成し、モザンビーク解放戦線（\"FRELIMO\"）がサモラ・マシェル率いる一党制社会主義国家を樹立したことで成立しました。"
    MOZ_1986_revolution.t:0 "ジョアキン・アルベルト・シサノ政権？"
    MOZ_1986_revolution.d:0 "1986年にサモラ・マシェルの大統領専用機が南アフリカの山岳地帯へ墜落したことを受け、シサノが大統領職を継承しFRELIMOの党首となりました。シサノは1992年に反乱軍との和平条約をまとめてモザンビーク内戦を終結させましたが、この条約は\"訴追も処罰も行わない\"と約束しモザンビーク軍の役職の50％を反乱軍に与えるものでした。"
    MOZ_1990_revolution.t:0 "新憲法？"
    MOZ_1990_revolution.d:0 "マシェルの後継者ジョアキン・シサノは国内で大規模な変革に着手し、マルクス主義から資本主義への転換といった改革を進めるとともにRENAMOとの和平交渉を開始しました。1990年に制定された新憲法は複数政党制、市場経済、自由選挙を定めました。同年モザンビークは正式国名から人民共和国の呼称を廃止しました。"
    MOZ_1994_revolution.t:0 "民主主義への移行？"
    MOZ_1994_revolution.d:0 "1994年10月27日から29日にかけてモザンビークで大統領と共和国議会を選出する総選挙が実施されました。同国で複数政党制の選挙が行われるのはこれが初めてであり、それまではFRELIMOが唯一の合法政党でした。しかしFRELIMOは両方の選挙に勝利し、国の政治体制に対する支配を維持しました。"
    
    GNB_1973_revolution.t:0 "ギニアビサウ人民共和国？"
    GNB_1973_revolution.d:0 "ギニア・カーボベルデ独立アフリカ党は1960年代に武装闘争へと転じ、ギニアビサウ独立戦争の交戦勢力のひとつとなりました。戦争の終盤に同党は社会主義の一党制国家を樹立し、これは1990年代初頭に複数政党制民主主義が導入されるまで維持されました。"
    GNB_1994_revolution.t:0 "民主主義への移行？"
    GNB_1994_revolution.d:0 "1994年7月3日にギニアビサウで総選挙が実施され、大統領選挙の決選投票は8月7日に行われました。これは独立以来初の複数政党制選挙であり、大統領が直接選挙で選ばれたのも初めてでした。それまで同職は国民人民議会によって選出されていたのです。大統領選挙ではギニア・カーボベルデ独立アフリカ党（PAIGC）の現職ジョアン・ベルナルド・ヴィエイラが決選投票で社会革新党のクンバ・ヤラを破り勝利しました。"
    
    LIB_1971_revolution.t:0 "リベリアの自由化？"
    LIB_1971_revolution.d:0 "ウィリアム・タブマンの死後、ウィリアム・トルバートが大統領に選出されました。トルバート政権の初期には自由主義的な改革と非同盟路線の採用が見られましたが、経済問題の深刻化とアメリコ・リベリア人と先住リベリア人の間の緊張が不安定化を招きました。1973年にはガブリエル・バッカス・マシューズが率いるリベリア進歩同盟が正当な野党として承認され、同国は二大政党制へ復帰しました。"
    LIB_1980_revolution.t:0 "リベリアのクーデター？"
    LIB_1980_revolution.d:0 "1980年4月12日、クラン人のサミュエル・ドウ曹長が率いる軍事クーデターによりウィリアム・R・トルバート・ジュニア大統領が打倒され殺害されました。ドウら首謀者はその後、トルバート内閣の大半とアメリコ・リベリア人の政府高官およびトゥルー・ホイッグ党員をモンロビアの海岸で処刑しました。クーデターの指導者たちは国を統治するため人民救済評議会（PRC）を結成しました。"
    LIB_1990_revolution.t:0 "第一次リベリア内戦？"
    LIB_1990_revolution.d:0 "全体主義と蔓延する汚職に彩られたサミュエル・ドウ大統領の政権は、1980年代後半までにアメリカ合衆国の支援打ち切りを求める声を招きました。1989年12月、チャールズ・テイラー率いるリベリア国民愛国戦線（NPFL）はドウを打倒すべくコートジボワールからリベリアへ侵攻し、1年のうちに国土の大半を掌握しました。1990年9月、ドウはプリンス・ジョンソン率いるNPFLの分派リベリア独立国民愛国戦線（INPFL）に捕らえられ処刑されました。"
    LIB_1997_revolution.t:0 "チャールズ・テイラーの台頭？"
    LIB_1997_revolution.d:0 "横領により解任されドウ大統領に投獄されたテイラーは、1989年に脱獄しました。やがてリビアへ渡り、そこでゲリラ戦の訓練を受けました。1989年、リビアの支援を受けた反乱組織リベリア国民愛国戦線の指導者としてリベリアへ戻り、ドウ政権を打倒すべく第一次リベリア内戦（1989年～1996年）を引き起こしました。ドウの処刑後、テイラーは国土の大部分を支配下に置き、アフリカで最も名高い軍閥指導者の一人となりました。戦争を終結させた和平合意を経て、テイラーは1997年の総選挙に国民愛国党（NPP）から臨み大統領に選出されました。国内では軍の粛清や政敵への暴力といった独裁的手段によって権力の集中を図りました。"
    LIB_2003_revolution.t:0 "リベリアにおける民主主義の回復？"
    LIB_2003_revolution.d:0 "チャールズ・テイラー大統領は第一次リベリア内戦に勝利したのち1997年に政権の座へ就き、2年間の平和がもたらされました。ギニア政府の支援を受けた反テイラー派の反乱勢力「和解と民主主義のためのリベリア人連合」（LURD）は1999年4月にリベリア北部へ侵攻しました。LURDは北部でテイラーに対し徐々に戦果を上げ、2002年初頭には首都モンロビアへ迫り始めます。2003年初頭には第二の反テイラー派反乱勢力「リベリア民主運動」（MODEL）が南部へ侵攻し、瞬く間に南部の大半を制圧しました。支配地域が国土の3分の1にまで縮小しモンロビア包囲戦の圧力にさらされたテイラーは、2003年8月に辞任してナイジェリアへ逃れました。その1週間後には交戦勢力によってアクラ包括和平合意が調印され、紛争は政治的な終結を迎えてリベリアの民主化への移行が始まりました。"
    
    BUF_1983_revolution.t:0 "ブルキナファソ革命？"
    BUF_1983_revolution.d:0 "1983年8月4日、オートボルタ共和国でクーデターが発生しました。この出来事は8月革命あるいはブルキナファソ革命と呼ばれることもあります。実行したのはトマ・サンカラとブレーズ・コンパオレに率いられた軍内の急進派で、ジャン＝バティスト・ウエドラオゴ少佐の政権を標的としたものでした。"
    BUF_1987_revolution.t:0 "ブルキナファソのクーデター？"
    BUF_1987_revolution.d:0 "1987年のブルキナファソ・クーデターは、1987年10月15日にブルキナファソで起きた流血を伴う軍事クーデターです。このクーデターはブレーズ・コンパオレ大尉が画策したもので、標的となったのは現職大統領である極左のトマ・サンカラ大尉、すなわち1983年の政変をともに戦ったかつての盟友でした。"
    BUF_2014_revolution.t:0 "民主主義の復活？"
    BUF_2014_revolution.d:0 "ブレーズ・コンパオレは1991年、1998年、2005年、2010年の選挙で勝利しましたが、いずれも公正さを欠くものとみなされていました。27年に及ぶ在任期間をさらに延ばそうと憲法改正を試みたことが2014年のブルキナファソ蜂起を招きます。2014年10月31日にコンパオレは辞任し、コートジボワールへ逃れました。"
    BUF_2022_revolution.t:0 "ブルキナファソのクーデター？"
    BUF_2022_revolution.d:0 "トラオレは2022年1月のブルキナファソのクーデターを支持し、救国復興愛国運動の軍事政権を樹立した将校集団の一員でした。首謀者たちが9月30日にクーデターを決行した時点で、トラオレはなお大尉の階級にありました。作戦は「コブラ」部隊の支援を受けて実行されました。クーデターの直後、トラオレは自らが救国復興愛国運動の新たな指導者であると宣言しました。10月6日には「元首かつ軍最高司令官」として暫定大統領の地位にも就きました。"
    
    MAD_1975_revolution.t:0 "マダガスカル社会主義革命？"
    MAD_1975_revolution.d:0 "ディディエ・ラツィラカは1975年12月21日の国民投票で7年任期の大統領に選出され、挙国一致の負託を確認するとともにマダガスカル第二共和政を発足させました。ラツィラカ政権の指導理念は、社会主義的な「上からの革命」の必要性でした。"
    MAD_1992_revolution.t:0 "社会主義政権の崩壊？"
    MAD_1992_revolution.d:0 "ラツィラカ政権への不満は1991年8月10日に頂点に達し、40万人を超える市民がラツィラカ政権の打倒と新たな複数政党制の樹立を求めて大統領府への行進を行いました。これらの出来事の結果、ラツィラカは1991年10月31日に新憲法の制定と自由で公正な複数政党制選挙の実施を伴う民主化移行の過程を支持することに同意しました。"
    
    NIC_1979_revolution.t:0 "ニカラグア革命？"
    NIC_1979_revolution.d:0 "ニカラグア革命とは、1960年代から1970年代にかけて高まったソモサ独裁への反対運動と、1978年から79年にかけてサンディニスタ民族解放戦線（FSLN）が独裁政権を打倒するために主導した闘争を指します。"
    NIC_1990_revolution.t:0 "ニカラグアにおける民主主義の回復？"
    NIC_1990_revolution.d:0 "1990年2月25日、ニカラグアで大統領と国民議会議員を選出する総選挙が実施されました。結果は国民野党連合（UNO）の勝利となり、その大統領候補ビオレタ・チャモロがサンディニスタ民族解放戦線（FSLN）の現職大統領ダニエル・オルテガを破るという番狂わせが起きました。これによりニカラグアでは歴史的な平和的・民主的政権移行が実現したのです。"
    NIC_2007_revolution.t:0 "ダニエル・オルテガ政権？"
    NIC_2007_revolution.d:0 "ホセ・ダニエル・オルテガ・サアベドラはニカラグアの政治家であり革命家、そして元ゲリラ戦士です。さまざまな肩書のもとで1979年から1990年まで、そして2007年以降はニカラグアの指導者の座にあります。1979年から1985年まで国家再建評議会の調整官として初めて権力を握り、続いて1985年から1990年までニカラグア大統領を務めました。2007年に大統領職へ復帰し、2025年2月からは妻ロサリオ・ムリーリョとともに共同大統領を務めています。オルテガは権威主義的な指導者と評されてきました。"
    NIC_2025_revolution.t:0 "ニカラグアの共同大統領？"
    NIC_2025_revolution.d:0 "2025年にニカラグア憲法が改正され、大統領の権限を一人ではなく二人の共同大統領が行使できるようになりました。男性と女性の共同大統領が普通選挙により6年の任期で選出されます。改正が可決された際には現職大統領ダニエル・オルテガと妻で副大統領のロサリオ・ムリーリョが初代共同大統領に就任し、ニカラグアは現在世界で唯一夫婦による二頭政治が敷かれる国となりました。"
    
    ELS_1956_revolution.t:0 "ホセ・マリア・レムスの大統領時代？"
    ELS_1956_revolution.d:0 "ホセ・マリア・レムス・ロペス中佐は1956年9月14日から1960年10月26日までエルサルバドル大統領を務めました。大統領就任以前は国防次官と内務大臣を歴任しています。前任者の社会経済改革を引き継ぎましたが、労働者階級の生活水準が向上することはありませんでした。"
    ELS_1960_revolution.t:0 "エルサルバドルの一連のクーデター？"
    ELS_1960_revolution.d:0 "1961年のエルサルバドル・クーデターは1960年に権力を握った短命の政府評議会に対しアニバル・ポルティージョ大佐が主導した反クーデターであり成功を収めました。改革派の軍事評議会は熱烈な反共主義を掲げる軍民指導部という政府に取って代わられました。その年の終わりまでに軍政は民主的な統治へと道を譲りました。"
    ELS_1979_revolution.t:0 "エルサルバドルのクーデター？"
    ELS_1979_revolution.d:0 "1979年のエルサルバドル・クーデターは1979年10月15日にエルサルバドルで発生した軍事クーデターです。若手将校たちが主導したこのクーデターは軍人大統領カルロス・ウンベルト・ロメロを無血で打倒し亡命へと追いやりました。国民和合党による強固な支配は終わりを告げこれに代わって軍はエルサルバドル革命政府評議会（JRG）を樹立しました。"
    ELS_1984_revolution.t:0 "ホセ・ナポレオン・ドゥアルテの当選？"
    ELS_1984_revolution.d:0 "ホセ・ナポレオン・ドゥアルテ・フエンテス（1925年11月23日～1990年2月23日）は1984年6月1日から1989年6月1日までエルサルバドル大統領を務めた政治家です。1972年の大統領選に出馬する前はサンサルバドル市長でした。この選挙では敗れましたが不正選挙であったと広く見なされています。1979年のクーデターの後ドゥアルテは1980年から1982年まで軍民合同の評議会を率いました。その後1984年に大統領へ選出されARENA党の指導者ロベルト・ダビュイソンを破りました。"
    ELS_1992_revolution.t:0 "チャプルテペック和平合意？"
    ELS_1992_revolution.d:0 "チャプルテペック和平合意は1992年1月16日に調印された一連の和平協定であり、この日をもってエルサルバドル内戦は終結しました。この条約はエルサルバドル政府とファラブンド・マルティ民族解放戦線（FMLN）との間に和平をもたらしました。"
    
    NEP_1990_revolution.t:0 "ネパールの人民運動？"
    NEP_1990_revolution.d:0 "1990年の人民運動はネパールで起きた複数政党制を求める運動であり絶対王政を終わらせ立憲君主制の始まりをもたらしました。またパンチャヤト制の廃止も実現しました。"
    NEP_2008_revolution.t:0 "王政の廃止？"
    NEP_2008_revolution.d:0 "1990年代にはネパール内戦（1996〜2006年）が始まりました。これは政府軍とネパール共産党（マオイスト）の反乱勢力との紛争です。2001年のネパール王族殺害事件によってネパール王政の立場はさらに不安定になりました。この事件の結果ギャネンドラが王位に復帰しました。2005年に彼が直接統治を敷いたことは、マオイストの反乱勢力と民主化活動家を結集させる抗議運動を引き起こしました。翌年に行われた選挙を経て、ネパール制憲議会は2008年5月28日の初会合で正式に王国を廃止し、これに代えてネパール連邦民主共和国の樹立を宣言しました。"
    
    PAK_1958_revolution.t:0 "パキスタンのクーデター？"
    PAK_1958_revolution.d:0 "10月7日、ミルザはパキスタン憲法を破棄し戒厳令を布告しました。1956年から1958年にかけて何人もの首相が入れ替わり、ついにアユーブ・ハーン将軍は安定を取り戻すために軍が実権を握るべきだと考えるに至りました。"
    PAK_1970_revolution.t:0 "民主主義への復帰？"
    PAK_1970_revolution.d:0 "1970年12月7日、国民議会の議員を選出するためパキスタンで総選挙が行われました。これはパキスタン独立以来初の直接総選挙であり、結果としてバングラデシュ独立以前に実施された唯一の総選挙となりました。投票は300の一般選挙区で行われ、うち162は東パキスタン、138は西パキスタンにありました。"
    PAK_1973_revolution.t:0 "1973年憲法？"
    PAK_1973_revolution.d:0 "1973年憲法は、パキスタンで初めて選挙で選ばれた代表者によって起草された憲法です。1962年憲法とは異なり議院内閣制の民主主義をもたらし、行政権は首相の職に集中され、形式上の国家元首である大統領は首相の助言に基づいて行動するにとどまりました。憲法はすべての法律がクルアーンとスンナに示されたイスラムの戒律に適合すべきことを定めています。"
    PAK_1977_revolution.t:0 "パキスタンのクーデター？"
    PAK_1977_revolution.d:0 "1977年のパキスタン軍事クーデター（作戦名「フェアプレー作戦」）は1977年7月5日に発生したパキスタンで2度目の軍事クーデターです。陸軍参謀長ムハンマド・ジア・ウル・ハクによって実行され、ズルフィカール・アリー・ブットー首相の政権を打倒しました。クーデター自体は無血でしたが、その前段には社会不安と、ブットー率いる左派の与党パキスタン人民党政権と1977年総選挙での不正を訴える右派イスラム主義の野党パキスタン国民同盟との政治的対立がありました。"
    PAK_1988_revolution.t:0 "民主主義への復帰？"
    PAK_1988_revolution.d:0 "1988年にジア大統領が飛行機事故で死亡すると、ズルフィカール・アリー・ブットーの娘ベナジール・ブットーが同国初の女性首相に選出されました。PPPの後を継いだのは保守派のパキスタン・ムスリム連盟（N）であり、その後10年にわたって両党の指導者は政権を交代しながら権力を争い、その間に国内情勢は悪化し1980年代とは対照的に経済指標は急落しました。"
    
    HND_1947_revolution.t:0 "総督アーチボルド・ウェーベルの解任？"
    HND_1947_revolution.d:0 "アーチボルド・ウェーベルは1947年初頭にインド総督を解任され、後任にはマウントバッテン卿が就きました。ホワイトホールとの緊張した関係、シムラ会議（1945年）と内閣使節団（1946年）での失敗、そして宗派対立を収拾できなかったことが、インドの移行には新たな指導者が不可欠であるとアトリー首相に確信させたのです。"
    HND_1952_revolution.t:0 "ジャンムー・カシミールの特別な地位？"
    HND_1952_revolution.d:0 "1952年、ネルー首相とシェイク・アブドゥラーが結んだデリー協定は、第370条に基づくジャンムー・カシミールの特別な地位を確認しました。市民権・財産・内政に関する自治を認める一方でインドは防衛・外交・通信の統制を保持し、連邦内における同地域の独特な憲法上の位置づけを固めたのです。1952年7月24日に調印されたこの協定は、カシミールをインドの憲法体制へ組み込みつつその自治を公式化するものでした。協定は妥協の産物であり、ジャンムー・カシミールは独自の憲法と旗を保持できる一方でインド議会の立法権は限定されました。"
    KAS_Special_Status.option.1:0 "共和制の地方行政機構を創設する。"
    KAS_Special_Status.option.2:0 "地方行政に君主制を残す。"
    KAS_Special_Status.option.3:0 "領土を併合する！"
    HND_1975_revolution.t:0 "非常事態宣言？"
    HND_1975_revolution.d:0 "インドの非常事態宣言とは、1975年から1977年までの21か月にわたり、インディラ・ガンディー首相が全国に非常事態を発令させた期間を指します。「国内の混乱」を理由にファクルディン・アリ・アフマド大統領が憲法第352条に基づいて正式に発したこの命令は、首相に布告による統治の権限を与え、選挙の中止と市民的自由の停止を可能にしました。"
    HND_1977_revolution.t:0 "非常事態を終わらせるか？"
    HND_1977_revolution.d:0 "1977年1月18日、ガンディーは3月の総選挙実施を表明し、野党指導者の一部を釈放しました。しかし非常事態が3月21日に正式に解除され彼女が退陣した後も、多くの者が獄中にとどまりました。3月16日から20日にかけて実施された1977年のインド総選挙はジャナタ党とCFDの地滑り的勝利に終わり、ローク・サバーで298議席を獲得しました。一方で与党のインド国民会議派は154議席しか得られず、前回の選挙から198議席を減らしたのです。"
    HND_1984_revolution.t:0 "インディラ・ガンディー暗殺？"
    HND_1984_revolution.d:0 "インド首相インディラ・ガンディーは1984年10月31日午前9時30分、ニューデリーのサフダルジャン通りにある自邸で暗殺されました。彼女を殺害したのは護衛官のサトワント・シンとベアント・シンであり、これはブルースター作戦の報復でした。同作戦はシク教最高の聖地であるパンジャーブ州アムリトサルの黄金寺院ハリマンディル・サーヒブに打撃を与えるためインディラ・ガンディーが命じ、1984年6月1日から8日にかけて実行されたインド軍の軍事行動です。"
    HND_1991_revolution.t:0 "ラジーヴ・ガンディー暗殺？"
    HND_1991_revolution.d:0 "インド元首相ラジーヴ・ガンディーの暗殺は1991年5月21日、インドのタミル・ナードゥ州スリペルンブドゥールで起きた自爆テロによるものでした。ラジーヴ・ガンディーのほか少なくとも14名が死亡しています。実行犯は22歳のカライヴァニ・ラジャラトナム（偽名のテンモリ・ラジャラトナムおよびダヌの名で広く知られる）で、スリランカのタミル人非合法分離主義組織タミル・イーラム解放のトラ（LTTE）の一員でした。"
    HND_2019_revolution.t:0 "ジャンムー・カシミールの直接統治？"
    HND_2019_revolution.d:0 "2019年8月、インドは憲法第370条によるジャンムー・カシミールの特別な地位を撤廃し直接統治を敷きました。ジャンムー・カシミール再編法により同州は2019年10月31日付でジャンムー・カシミールとラダックという2つの連邦直轄領に分割されました。地方の自治は中央政府による統治に取って代わられ、憲法上・政治上の歴史的な転換となりました。政府はこの措置を統合と発展に向けた一歩だと正当化しましたが、批判派は民主的な代表性と地域の自治を損なうものだと主張しました。"
    
    BHU_1952_revolution.t:0 "ジグミ・ドルジ・ワンチュクの即位？"
    BHU_1952_revolution.d:0 "ジグミ・ワンチュクの跡を継いだのは息子のジグミ・ドルジ・ワンチュクでした。1972年7月まで続いた20年の治世の間にブータン社会の根本的な方向転換が始まりました。ワンチュクは社会と政府の再編を成し遂げただけでなくブータンの主権と安全保障も強固なものとしました。"
    BHU_1972_revolution.t:0 "ジグミ・シンゲ・ワンチュクの即位？"
    BHU_1972_revolution.d:0 "1972年7月21日にブータン第3代国王が崩御し、16歳の皇太子ジグミ・シンゲ・ワンチュクが即位して当時世界最年少の君主となりました。その治世の間にブータンは絶対君主制から民主的な立憲君主制へと移行しました。"
    BHU_2006_revolution.t:0 "ジグミ・ケサル・ナムゲル・ワンチュクの即位？"
    BHU_2006_revolution.d:0 "ジグミ・ケサル・ナムゲル・ワンチュクの治世は、父ジグミ・シンゲ・ワンチュクの退位を受けて2006年に始まりました。若き国王は選挙法や土地改革などの重要な問題が討議された最後の議会に臨席し、ブータンの民主化を見守りながら治世を開始しました。"
    BHU_2008_revolution.t:0 "ブータンの議会制民主主義？"
    BHU_2008_revolution.d:0 "国民議会の初の総選挙は2008年3月24日に実施されました。主な争いはジグミ・ティンレー率いるブータン平和繁栄党（DPT）とサンゲ・ンゲドゥップ率いる国民民主党（PDP）の間で繰り広げられました。DPTは47議席中45議席を獲得して選挙に勝利しました。2008年4月9日にジグミ・ティンレーが初の民選首相となり、同国初の民主的選挙を経て就任しました。"
    
    BUR_1962_revolution.t:0 "ビルマのクーデター？"
    BUR_1962_revolution.d:0 "1962年のビルマのクーデターは、ビルマにおける一党支配の始まりと軍部による政治的支配の幕開けとなりました。1962年3月2日のクーデターで、軍部はウー・ヌ首相が率いる文民のAFPFL政権を、ネー・ウィン将軍を議長とする連邦革命評議会に置き換えました。"
    BUR_1974_revolution.t:0 "ビルマ式社会主義？"
    BUR_1974_revolution.d:0 "ビルマ式社会主義は、1962年から1988年までビルマ社会主義計画党（BSPP）が統治した社会主義国家ビルマ連邦社会主義共和国の国家イデオロギーでした。"
    BUR_1988_revolution.t:0 "8888蜂起？"
    BUR_1988_revolution.d:0 "8888蜂起は1988年8月8日にヤンゴン（ラングーン）の学生たちによって始められました。学生の抗議運動は全土へと広がりました。数十万人の僧侶や子供、大学生、主婦、医師、そして一般市民が政府に抗議しました。"
    BUR_1990_revolution.t:0 "タッマドーのクーデター？"
    BUR_1990_revolution.d:0 "1990年5月27日、ミャンマーで総選挙が実施されました。1960年以来初の複数政党制選挙であり、それまで同国は軍事独裁政権に支配されていました。結果はアウンサンスーチー率いる国民民主連盟（NLD）の圧勝で、492議席中392議席を獲得しました。しかし軍事政権は選挙結果の承認を拒み、そのまま国の統治を続けました。"
    BUR_2007_revolution.t:0 "サフラン革命？"
    BUR_2007_revolution.d:0 "サフラン革命は、2007年8月から10月にかけてミャンマーで起きた一連の経済的・政治的な抗議と示威行動です。発端は、軍事政権が燃料の販売価格に対する補助金を撤廃すると決定したことでした。"
    BUR_2015_revolution.t:0 "民主化への道？"
    BUR_2015_revolution.d:0 "2015年11月8日に総選挙が実施されました。無効とされた1990年の総選挙以来、ミャンマーで初めて自由に争われた選挙です。結果としてNLDは国会の両院で絶対多数の議席を獲得し、自党の候補を大統領に就ける勢力を確保しました。ただしNLD党首のアウンサンスーチーは、憲法の規定により大統領に就任できません。"
    BUR_2021_revolution.t:0 "タッマドーのクーデター？"
    BUR_2021_revolution.d:0 "2021年2月1日の朝、ミャンマーでクーデターが始まりました。民主的に選出された与党・国民民主連盟（NLD）の議員たちが、ミャンマー国軍タッマドーによって追放され、権力は軍事政権の手に委ねられました。"
    BUR_2026_revolution.t:0 "名目上の文民政権？"
    BUR_2026_revolution.d:0 "2026年3月30日、2021年のクーデターで権力を握ったミン・アウン・フライン将軍は、2026年ミャンマー大統領選挙に向けた委員会の指名を得るため、連邦団結発展党の議員チョー・チョー・テーによって人民代表院の選挙人団から副大統領候補に指名されました。軍を退役する必要があったため、憲法に基づいて大統領選に出馬すべく同日付で国軍最高司令官を辞任しました。NDSCは後任として、ミン・アウン・フラインの忠実な支持者であるイェー・ウィン・ウーを任命しました。4月3日、ミン・アウン・フラインは同国の第11代大統領に選出されました。"
    
    CAM_1955_revolution.t:0 "ノロドム・シハヌークの退位？"
    CAM_1955_revolution.d:0 "ノロドム・シハヌーク国王は政治に直接関与するため1955年に退位し、父スラマリットが王位を継ぎました。同年の総選挙ではシハヌークの政治組織サンクムが勝利し、彼はカンボジアの首相に就任しました。彼は一党支配のもとで国を統治し政治的な異論を弾圧しました。"
    CAM_1960_revolution.t:0 "ノロドム・スラマリット国王の崩御"
    CAM_1960_revolution.d:0 "シハヌークの父スラマリットは数か月にわたる体調不良の末、1960年4月3日に崩御しました。シハヌークはその不調を、父が小包爆弾による襲撃で受けた衝撃のせいだとしていました。翌日、カンボジア王室評議会が招集されモニレットを摂政に選びました。続く2か月の間にシハヌークは憲法改正を進め、国王に相当する儀礼的権限を備えたカンボジア元首という新たな職を創設しました。1960年6月5日に実施された国民投票でシハヌークの提案は承認され、同年6月14日に彼は正式に元首へ任命されました。元首としてシハヌークは、公開謁見の開催や王室耕耘祭の主宰など、国王の様々な儀礼的責務を引き継ぎました。"
    CAM_1970_revolution.t:0 "クメール共和国？"
    CAM_1970_revolution.d:0 "クメール共和国は、1970年から1975年まで、アメリカの支援を受けたロン・ノル元帥の軍事独裁下に置かれたカンボジアの国家です。1970年3月18日のクーデターによりノロドム・シハヌーク政権が打倒され王制が廃止された後、同年10月9日に正式に建国が宣言されました。"
    CAM_1975_revolution.t:0 "クメール・ルージュの台頭？"
    CAM_1975_revolution.d:0 "カンプチアは1975年から1979年までのカンボジアの国家であり、ポル・ポトとカンプチア共産党（CPK）、通称クメール・ルージュ（KR）による全体主義独裁下にありました。クメール・ルージュが首都プノンペンを制圧し、アメリカの支援を受けたロン・ノルのクメール共和国を事実上崩壊させたことで樹立されました。"
    CAM_1979_revolution.t:0 "ポル・ポトの失脚？"
    CAM_1979_revolution.d:0 "クメール・ルージュによるベトナム領への暴力的な侵入と虐殺が数年にわたって続いた末、1978年12月にベトナムがカンボジアへ侵攻しました。1979年1月までにポル・ポトとクメール・ルージュは打倒されました。生き残ったクメール・ルージュの構成員はタイ国境付近に点在する密林へ退き、そこから戦闘と襲撃を続けました。著しく弱体化した彼らは、1989年の撤退までベトナム兵に追討され続けました。"
    CAM_1989_revolution.t:0 "パリ和平協定？"
    CAM_1989_revolution.d:0 "1978年11月、ベトナム軍はクメール・ルージュによる国境襲撃を受けてカンボジアへ侵攻し、これを征服しました。カンプチア人民革命党が率いる親ソ国家として、カンプチア人民共和国（PRK）が樹立されました。この新国家に対抗し、1981年には3つの派閥から民主カンプチア連合政府（CGDK）と呼ばれる亡命政府が結成されました。1989年にはカンボジア国のもとでパリにて和平交渉が始まり、2年後の1991年10月にパリ包括和平協定として結実しました。"
    CAM_1993_revolution.t:0 "王制の復活？"
    CAM_1993_revolution.d:0 "1978年11月、クメール・ルージュによる国境襲撃への対応としてベトナム軍がカンボジアへ侵攻し、これを制圧しました。1989年にはカンボジア国のもとパリで和平の努力が始まり、2年後の1991年10月にパリ和平協定として結実しました。国連は停戦の実施と難民および武装解除への対処を担う任務を与えられ、これは国連カンボジア暫定統治機構（UNTAC）として知られます。1993年には王政が復活してノロドム・シハヌークが国王に復位し、戦後初の選挙がUNTACの調整のもとで実施されました。"
    CAM_1997_revolution.t:0 "カンボジアのクーデター？"
    CAM_1997_revolution.d:0 "1997年のカンボジアのクーデターは1997年7月から9月にかけてカンボジアで発生しました。その結果、共同首相のフン・センがもう一方の共同首相ノロドム・ラナリットを追放しました。クーデターの間に少なくとも32人が死亡しました。"
    CAM_2018_revolution.t:0 "フン・センによる権力の掌握？"
    CAM_2018_revolution.d:0 "フン・センの命令を受け2017年1月31日、国民議会は野党の影響力を弱めるため少数党リーダーと多数党リーダーの役職を廃止する議案を全会一致で可決しました。2017年2月2日、フン・センは野党が一部の閣僚に質問することを禁じました。さらにフン・センは憲法改正を明言し、後に野党のカンボジア救国党が解党されることとなりました。この動きにより野党指導者サム・レンシーが突如辞任しました。2018年7月29日日曜日、第6期国民議会の議員を選ぶ総選挙がカンボジアで実施されました。結果は広く予想されていた通り与党カンボジア人民党（CPP）の圧勝となり、同党は国民議会の125議席をすべて獲得しました。"
    CAM_2023_revolution.t:0 "フン・マネットの台頭？"
    CAM_2023_revolution.d:0 "フン・マネット（1977年10月20日生まれ）はカンボジアの政治家であり軍人で、2023年からカンボジア首相および与党カンボジア人民党（CPP）の副総裁を務めています。上院議長で元首相のフン・センとブン・ラニーの次男です。"
    
    IDO_1959_revolution.t:0 "指導民主主義？"
    IDO_1959_revolution.d:0 "指導された民主主義は、1959年から1966年に新体制が始まるまでインドネシアで敷かれていた政治体制です。スカルノ大統領の発案によるもので、政治的な安定をもたらすための試みでした。スカルノは自由民主主義期のインドネシアで導入された議会制が当時の分裂した政治状況のために機能していないと考えていました。彼が代わりに求めたのは、村の長老の指導のもとで行われる伝統的な村落の討議と合意の仕組みに基づく体制でした。戒厳令の布告とこの体制の導入によってインドネシアは大統領制に戻り、スカルノは再び政府の長となりました。"
    IDO_1968_revolution.t:0 "新体制？"
    IDO_1968_revolution.d:0 "1965年9月30日から10月1日にかけてのクーデター未遂は、スハルト率いる部隊によって鎮圧されました。軍が作成した公式の歴史によれば、この企てはインドネシア共産党（PKI）の支援を受けたものとされています。軍はその後に全国規模の暴力的な反共粛清を主導し、スハルトはインドネシア建国の大統領スカルノから権力を奪い取りました。「新体制」政権のもとでスハルトは強力で中央集権的な軍主導の政府を築き上げました。寡頭的な軍事独裁として始まったものは、やがてスハルト個人を中心とする権威主義体制へと姿を変えました。"
    IDO_1998_revolution.t:0 "インドネシアの民主化？"
    IDO_1998_revolution.d:0 "スハルトが深刻化する経済危機と政治危機の元凶とみなされるようになるなか、イスラム系政治家アミン・ライスをはじめとする有力な政治家が彼の大統領職を公然と批判し、1998年1月には大学生が全国規模のデモを組織し始めました。危機は1998年5月12日、スハルトがエジプトを公式訪問している最中に頂点に達し、治安部隊がジャカルタのトリサクティ大学のデモ参加者4名を殺害しました。1998年5月21日にスハルトは辞任を表明し、憲法の規定に従ってハビビ副大統領が大統領職を継承しました。"
    IDO_2001_revolution.t:0 "西パプアの特別自治権？"
    IDO_2001_revolution.d:0 "西パプアは2001年にインドネシア政府が法律第21号を制定したことで正式に特別自治権を獲得しました。この法律は同地域に大幅な地方分権と、地方行政・教育・保健・天然資源に対するより大きな権限、さらに地方歳入のより多くの配分を認めることを目的としていました。"
    IDO_2005_revolution.t:0 "ヘルシンキ合意？"
    IDO_2005_revolution.d:0 "アチェの特別自治権は2005年8月15日のヘルシンキ覚書（MoU）によって確立されました。フィンランドのマルッティ・アハティサーリ元大統領が仲介したこの歴史的な協定は、インドネシア政府と自由アチェ運動（GAM）との間で30年続いた凄惨な分離独立紛争を終結させました。"
    
    MSY_1969_revolution.t:0 "5月13日事件"
    MSY_1969_revolution.d:0 "5月13日事件は1969年5月13日にマレーシアの首都クアラルンプールで起きた華人とマレー人の民族抗争です。この暴動は1969年のマレーシア総選挙で民主行動党やゲラカンなどの野党が与党連合である同盟党の議席を奪って躍進した直後に発生しました。人種暴動を受けてヤン・ディ・プルトゥアン・アゴン（国王）が国家非常事態を宣言し議会は停止されました。1969年から1971年まで国を暫定的に統治する管理内閣として国家行動評議会（NOC）が設置されました。"
    MSY_1971_revolution.t:0 "マレーシア新経済政策？"
    MSY_1971_revolution.d:0 "新経済政策（NEP）はマレーシアの5月13日事件を受けて国家行動評議会（NOC）が策定した社会再編と積極的差別是正の計画です。ブミプトラ優遇政策が強力に推し進められました。"
    MSY_1981_revolution.t:0 "新UMNO？"
    MSY_1981_revolution.d:0 "マハティールの第1次政権下でマレーシアは近代化と経済成長を遂げ、その政府は産業の大規模な民営化と大胆なインフラ計画を次々に着手しました。マハティールは5回連続で総選挙を制しUMNO指導部の座を狙う幾人もの対抗馬を退けた圧倒的な政治的存在でした。彼は司法の独立を切り崩し王族の法的免責を撤廃する憲法改正を支持することで権力を自らに集中させました。またブミプトラ優遇政策も継続しました。"
    MSY_1998_revolution.t:0 "アンワル・イブラヒムのソドミー裁判？"
    MSY_1998_revolution.d:0 "1997年のアジア通貨危機に際しアンワルは財務大臣としてIMFの計画を支持しました。マハティールはジョージ・ソロスら通貨投機筋を危機の元凶と非難し通貨管理と外国投資への規制強化を支持しました。しかし同年、4年に1度のUMNO党大会をめぐってアンワルとマハティールの対立は頂点に達しました。アンワルは捜査対象になっているとの警察発表のさなか1998年9月2日に閣僚を解任され、翌日にはUMNOを除名されました。アンワルの元スピーチライターであるムナワル・アニースとアンワルの義兄弟スクマ・ダルマワン・サスミタ・アトマジャが同性愛行為に及んだ疑いで逮捕されました。"
    MSY_2018_revolution.t:0 "ナジブ・ラザクの失脚？"
    MSY_2018_revolution.d:0 "首相在任中ナジブは1MDB（1Malaysia Development Berhad）構想をはじめとする様々な経済・インフラ開発計画を実行しました。しかしその指導力は1MDBスキャンダルをめぐる汚職と資金流用の疑惑によって傷つけられ政治的失脚を招きました。2018年、彼の党である国民戦線（バリサン・ナショナル）が総選挙で希望連盟（パカタン・ハラパン）に敗れナジブの政治生命は大きな打撃を受けました。その後彼は1MDBスキャンダルに関連して訴追されました。"
    MSY_2020_revolution.t:0 "シェラトン・ムーブ？"
    MSY_2020_revolution.d:0 "2020年から2022年にかけてのマレーシア政治危機は、第14期マレーシア議会の複数の国会議員（MP）が支持政党を変えたことをきっかけに始まりました。これにより議会の過半数が失われ、2つの連立政権が相次いで崩壊し、2人の首相が辞任しました。この政治危機は2022年の解散総選挙へと至り、最終的に連立政権が樹立されて収束しました。"
    MSY_2022_revolution.t:0 "パカタン・ハラパンの台頭？"
    MSY_2022_revolution.d:0 "ハング・パーラメントとなった2022年の総選挙の後、首相兼PH議長アンワル・イブラヒムが率いるパカタン・ハラパン（希望同盟）は、国民戦線（BN）、サラワク政党連合（GPS）、サバ人民連合（GRS）、ワリサン党（WARISAN）、マレーシア人民党（PBM）、社会民主調和党（KDM）および無所属議員とともに連立政権を組み、3分の2の多数を得て政権に復帰しました。一方ムヒディン・ヤシンの国民同盟（ペリカタン・ナショナル）は連立への参加を拒み、74議席を擁して野党の座に就きました。"
    
    BRU_1967_revolution.t:0 "オマール・アリ・サイフディン3世の退位？"
    BRU_1967_revolution.d:0 "1967年10月4日、17年にわたる治世と長期の闘病の末、オマール・アリ・サイフディンは、21歳の長男である皇太子ハサナル・ボルキアが成長し国政について一定の理解を得たとして、自らの意思により息子へ譲位することを宣言しました。"
    
    THI_1957_revolution.t:0 "サリット・タナラットのクーデター？"
    THI_1957_revolution.d:0 "1957年9月13日、サリットはピブーンに陸軍の最後通牒を突きつけました。58名の陸軍将校が署名したこの最後通牒は、政府の総辞職を求めるものでした。翌朝サリットと配下の軍はクーデターを決行しました。軍は1時間と経たないうちに、何の抵抗も受けることなく要所の制圧に成功しました。"
    THI_1973_revolution.t:0 "タイの民衆蜂起？"
    THI_1973_revolution.d:0 "1973年10月14日の民衆蜂起はタイの歴史における一大転換点となりました。この蜂起は反共主義者タノーム・キッティカチョーンによる軍事独裁政権に終止符を打ちタイの政治体制を一変させました。とりわけタイの大学生が政治において影響力を強めつつあることを浮き彫りにしました。"
    THI_1976_revolution.t:0 "タイのクーデター？"
    THI_1976_revolution.d:0 "蜂起後の混乱と不安定な情勢に加え1975年のサイゴン陥落を受けて高まった共産主義勢力による政権奪取への恐怖は、1976年10月のタンマサート大学虐殺事件として頂点に達しました。同日のクーデターによってタイには新たな極右政権が誕生し報道機関や官僚や知識人を弾圧した結果、共産主義勢力の武装闘争を招きました。"
    THI_1980_revolution.t:0 "プレーム・ティンスーラーノンの首相就任？"
    THI_1980_revolution.d:0 "インドシナ難民危機やベトナム軍の越境襲撃や経済的困窮によって高まった右派感情の波に乗り、軍の実力者プレーム・ティンスーラーノンが1980年に首相へ就任しました。プレームとの交渉の末、共産主義勢力は1983年までに武装闘争を放棄しました。プレーム政権は下院が全議席公選である一方で上院が全議席任命制であったことから「半民主主義」と呼ばれました。"
    THI_1997_revolution.t:0 "人民憲法？"
    THI_1997_revolution.d:0 "仏暦2540年（1997年）タイ王国憲法は1991年憲法に代わるものとして1997年10月11日に公布されたタイの憲法であり、タイの民主的な憲法改革における画期的な成果として広く称賛され同国史上もっとも民主的な憲法となりました。1997年憲法は二院制の議会を創設しました。タイの歴史上はじめて両院ともに直接選挙で選ばれることとなったのです。"
    THI_2006_revolution.t:0 "タイのクーデター？"
    THI_2006_revolution.d:0 "2006年のタイのクーデターは2006年9月19日に起こり、タイ王国陸軍が選挙で選ばれたタクシン・シナワット首相の暫定政権に対して決起しました。1991年のクーデター以来15年ぶりとなるタイの非立憲的な政権交代であり、タクシンとその与党および政敵を巻き込んだ1年に及ぶ政治危機の末、全国規模の下院選挙が予定されていた1か月足らず前に発生しました。"
    THI_2011_revolution.t:0 "タイは民主主義へ回帰するのか？"
    THI_2011_revolution.d:0 "2010年4月から5月にかけてバンコク中心部を占拠した反独裁民主戦線（UDD）、通称「赤シャツ隊」の抗議者たちは新たな選挙を要求しました。2010年11月14日に選挙を行うという政府の対案は拒否され、抗議者たちが解散を拒んだため激しい弾圧が続きました。選挙はついに2011年5月に発表されました。"
    THI_2014_revolution.t:0 "プラユット・チャンオチャのクーデターか？"
    THI_2014_revolution.d:0 "2014年5月22日、タイ王国陸軍（RTA）司令官プラユット・チャンオチャ将軍率いるタイ王国軍は、6か月に及ぶ政治危機を経てタイの暫定政権に対しクーデターを起こしました。1932年の最初のクーデター以来12回目のことでした。軍は国家平和秩序評議会（NCPO）と称する軍事政権を樹立して国を統治しました。このクーデターは「未完のクーデター」と呼ばれる2006年のタイのクーデター以来続いてきた軍主導の体制と民主勢力の政治的対立に終止符を打ちました。"
    THI_2023_revolution.t:0 "タイは民主主義へ回帰するのか？"
    THI_2023_revolution.d:0 "2023年5月、タイの改革派野党である進歩主義政党の前進党（MFP）とポピュリスト政党のタイ貢献党が総選挙で勝利し、プラユット・チャンオチャ首相を支えてきた王党派・軍部系の政党は政権を失いました。[121]2023年8月22日にはタイ貢献党のセター・タウィーシンが新首相に就任し、同党の象徴である富豪タクシン・シナワットも長年の亡命生活を終えてタイへ帰国しました。"
    
    JAP_1947_revolution.t:0 "日本の戦後憲法？"
    JAP_1947_revolution.d:0 "日本国憲法は日本の憲法であり、国の最高法規です。第二次世界大戦後の連合国による日本占領下で、主にアメリカの文民官僚の手によって起草されました。現行の日本国憲法は1890年の明治憲法の改正として1946年11月3日に公布され、1947年5月3日に施行されました。"
    notice_of_3P_action.option:0 "仕方がない。"
    JAP_1955_revolution.t:0 "55年体制？"
    JAP_1955_revolution.d:0 "55年体制とは、1955年の保守合同以降に自由民主党が支配した戦後日本の政治秩序です。強固な官財の結びつき、公共事業の利益誘導的な配分、そして党内派閥の競争に支えられ、長期にわたる一党支配をもたらしました。政策の安定と急速な経済成長を実現した一方で、個人本位の地方組織と汚職を生む選挙制度上の誘因に依存しており、相次ぐ不祥事と1990年代初頭の経済危機、そして選挙制度改革によって次第に弱体化していきました。"
    JAP_1994_revolution.t:0 "1994年の選挙制度改革？"
    JAP_1994_revolution.d:0 "1994年、日本は汚職の温床となっていた中選挙区制を廃し、小選挙区と比例代表を組み合わせた混合制を導入しました。この改革は二大政党による競争を育て、選挙の焦点を地元への「利益誘導」政治から全国的な政党の政策へ移すことを目指したものです。最終的に党指導部の権限は強化され権力の集中が進みましたが、自由民主党は依然として支配的な勢力であり続けました。"
    
    NKO_1994_revolution.t:0 "金正日の台頭？"
    NKO_1994_revolution.d:0 "金正日は北朝鮮の政治家であり、同国の第2代最高指導者でした。1994年に父・金日成が死去してから、2011年に自身が死去するまで北朝鮮を率い、その後は息子の金正恩が後を継ぎました。"
    NKO_2012_revolution.t:0 "金正恩の台頭？"
    NKO_2012_revolution.d:0 "金正恩は北朝鮮の政治家で、2011年から同国の最高指導者、2012年から朝鮮労働党（WPK）の指導者を務めています。1994年から2011年に死去するまで北朝鮮の第2代最高指導者であった金正日と、高容姫との間に生まれた三男です。"
    
    SKO_1960_revolution.t:0 "四月革命？"
    SKO_1960_revolution.d:0 "四月革命は1960年4月11日から26日にかけて、李承晩大統領と第一共和国に対して韓国で起きた大規模な抗議運動であり、李承晩の辞任につながりました。発端となったのは、3月の不正選挙に抗議するデモの最中に警察に殺害された地元の高校生の遺体が発見されたことでした。李承晩の独裁的な統治、汚職、政敵への暴力の行使、そして韓国の不均衡な発展により、民衆の不満が高まっていたのです。"
    SKO_1961_revolution.t:0 "5・16クーデター？"
    SKO_1961_revolution.d:0 "5・16軍事クーデターは1961年に韓国で起きた軍事クーデターであり、朴正煕とその同志が結成した軍事革命委員会によって計画・実行されました。同委員会は名目上、クーデター当日にこれを黙認した陸軍参謀総長の張都暎が率いていました。このクーデターによって民主的に選出された張勉首相と尹潽善大統領の政権は無力化され、第二共和国は終焉を迎えます。そして朴が事実上率いる改革志向の軍事機関「国家再建最高会議」が設置され、7月に張将軍が逮捕された後、朴が議長の座に就きました。"
    SKO_1972_revolution.t:0 "維新憲法？"
    SKO_1972_revolution.d:0 "1972年10月、朴正煕は自らクーデターを起こして国会を解散し1963年憲法を停止しました。その後、新憲法の起草作業が始まります。いわゆる維新憲法と呼ばれる新憲法は、1972年11月に激しい不正の行われた国民投票で承認されました。朴正煕には大統領令によって統治し憲法上の自由を停止できる広範な権限が与えられます。大統領の任期は4年から6年に延長され、再選の制限も撤廃されました。これは事実上、朴正煕が前年から行使してきた非常大権を法制化するものであり、彼の政権を合法的な独裁へと変えたのです。"
    SKO_1979_revolution.t:0 "朴正煕暗殺事件？"
    SKO_1979_revolution.d:0 "1979年10月26日、韓国ソウル特別市鍾路区の大統領府・青瓦台に近い韓国中央情報部（KCIA）の安全家屋で、晩餐の最中に朴正煕は暗殺されました。犯行に及んだのはKCIA部長であり大統領警護の責任者でもあった金載圭です。朴正煕は胸と頭を撃たれほぼ即死しました。"
    SKO_1987_revolution.t:0 "六月民主抗争？"
    SKO_1987_revolution.d:0 "六月民主抗争は韓国全土に広がった民主化運動であり、1987年6月10日から29日にかけて大規模な抗議行動を引き起こしました。このデモによって当時の政権は大統領直接選挙の実施をはじめとする民主化改革を受け入れざるを得なくなり、現在の韓国政府である第六共和国の成立につながりました。"
    SKO_2016_revolution.t:0 "朴槿恵大統領の弾劾？"
    SKO_2016_revolution.d:0 "韓国大統領朴槿恵の弾劾は、側近の崔順実による大統領職への介入をめぐる政治スキャンダルの帰結でした。2016年10月下旬、政府の公職に就いていない朴槿恵大統領の側近崔順実が、その立場を利用してサムスン・ヒュンダイ・SKグループ・ロッテといった複数の企業グループ（財閥）から、自らが支配する2つの財団への資金提供を求めていたことが明るみに出ました。弾劾の採決は2016年12月9日に行われ、定数300の国会議員のうち234名が賛成し、朴槿恵の大統領としての権限と職務は一時停止されました。"
    SKO_2024_revolution.t:0 "戒厳令？"
    SKO_2024_revolution.d:0 "2024年12月3日22時27分（韓国標準時）、韓国大統領の尹錫悦はテレビ演説で戒厳令を宣布しました。宣布にあたり彼は、国会で過半数を占める共に民主党（DPK）が「反国家活動」を行い「北朝鮮の共産主義者」と結託して国を破壊し「立法独裁」を作り出していると非難しました。この出来事は韓国の政治家や国内外の報道機関から広くクーデター未遂と評されました。"
    SKO_2024_1_revolution.t:0 "尹錫悦の弾劾？"
    SKO_2024_1_revolution.d:0 "2024年12月14日、韓国大統領の尹錫悦は国会によって弾劾訴追されました。これは尹が2024年12月3日に宣布した戒厳令を受けたものであり、この戒厳令は国会によって覆され、6時間後の2024年12月4日に正式に解除されました。"
    
    ROC_1975_revolution.t:0 "蒋介石の死？"
    ROC_1975_revolution.d:0 "1975年、蒋が台湾へ渡ってから26年後、彼は87歳で台北にて死去しました。それに先立つ数か月のうちに心臓発作と肺炎を患い、4月5日に重度の心不全によって悪化した腎不全で世を去りました。蒋の葬儀は4月16日に執り行われました。蒋介石の死を受けて厳家淦が第2代総統となりました。"
    ROC_1978_revolution.t:0 "蒋経国の台頭？"
    ROC_1978_revolution.d:0 "蒋介石は晩年を迎えるにつれ、次第に多くの責務を息子へ委ねていきました。1975年4月に彼が死去すると、厳家淦副総統が蒋介石の残任期間を務める総統となり、蒋経国は国民党の指導者の地位を継承しました（彼は父の称号である「総裁」ではなく「主席」の称号を選びました）。蒋経国は1978年5月20日、国民大会による1978年の台湾総統選挙で中華民国総統に選出されました。"
    ROC_1996_revolution.t:0 "台湾の民主化？"
    ROC_1996_revolution.d:0 "1987年に戒厳令が解除され、台湾は民主化の過程を歩み始めました。それは動員戡乱時期臨時条款の廃止に始まり、1996年の初の総統直接選挙で結実しました。"
    
    NVM_1969_revolution.t:0 "レ・ズアンの台頭？"
    NVM_1969_revolution.d:0 "レ・ズアンはベトナムの共産主義政治家でした。1950年代後半に党内で頭角を現し、1960年の第3回全国大会でベトナム共産党（VCP）中央委員会書記長となりました。彼はホー・チ・ミンの集団指導による統治方針を引き継ぎました。1960年代半ば（ホーの健康が衰えつつあった頃）から1986年に自らが死去するまで、彼はベトナムにおける最高の意思決定者でした。"
    NVM_1986_revolution.t:0 "グエン・ヴァン・リンの台頭？"
    NVM_1986_revolution.d:0 "グエン・ヴァン・リンはベトナムの革命家であり政治家でした。1986年から1991年までベトナム共産党書記長を務め、ベトナム戦争中はベトコンの政治指導者でもありました。在任中のリンは「ドイモイ（刷新）」の強力な推進者でした。これはベトナム経済を社会主義志向の市場経済へ転換することを目指す経済計画です。そのためリンは、ペレストロイカを導入したソ連指導者になぞらえて「ベトナムのゴルバチョフ」としばしば称されました。"
    
    SVM_1955_revolution.t:0 "ベトナム国の国民投票"
    SVM_1955_revolution.d:0 "1955年のベトナム国国民投票は、のちにベトナム共和国（通称南ベトナム）となるベトナム国の将来の政体を決定しました。共和制を提唱する首相ゴ・ディン・ジエムと、1945年に退位し国民投票の時点では国家元首の地位にあった元皇帝バオ・ダイとの間で争われました。"
    SVM_1963_revolution.t:0 "南ベトナムのクーデター？"
    SVM_1963_revolution.d:0 "1963年11月、大統領ゴ・ディン・ジエムと南ベトナムの勤労人格主義革命党は、仏教徒危機および北ベトナムとベトコンによる南ベトナムへの脅威に対するジエムの対応に反発したCIA支援下のベトナム共和国陸軍の将校たちによって失脚させられました。"
    
    SRL_1956_revolution.t:0 "シンハラ語のみ法"
    SRL_1956_revolution.d:0 "公用語法（1956年法律第33号）は通称「シンハラ語のみ法」と呼ばれ、1956年にセイロン議会で可決された法律です。この法律はセイロンの唯一の公用語を英語からシンハラ語へ置き換え、タミル語を排除しました。支持者が独立を果たしたばかりの共同体による旧宗主国から距離を置く試みと見なした一方で、反対者は言語的多数派が少数派を抑圧し支配を押し付ける企てと見なしたため、この法律は物議を醸しました。"
    SRL_1978_revolution.t:0 "強力な大統領制を創設するか？"
    SRL_1978_revolution.d:0 "1978年9月7日に公布された新憲法は、一院制議会と執行大統領制を定めました。大統領の任期と議会の会期はいずれも6年とされました。新憲法はまた議会選挙に大選挙区比例代表制を導入し、議会は196議席で構成されることになりました（のちに憲法第14修正により225議席へ増加）。"
    
    BNG_1975_revolution.t:0 "大統領制の時代？"
    BNG_1975_revolution.d:0 "1975年1月、シェイク・ムジブル・ラフマンはBAKSALのもとで一党社会主義体制を導入しました。ラフマンは国営の4紙を除くすべての新聞を発禁とし、憲法を改正して自らの権限を強化しました。彼は1975年8月15日のクーデターで暗殺され、大統領職は4か月にわたり簒奪者ホンダケル・モスタク・アハメドの手に渡りました。バングラデシュは3年間、戒厳令執行長官が率いる軍事政権に統治されました。1977年には陸軍参謀長ジアウル・ラフマンが大統領に就任しました。"
    BNG_1991_revolution.t:0 "議会制民主主義への回帰？"
    BNG_1991_revolution.d:0 "1991年の総選挙の後、憲法第12修正により議会制共和国が復活し、ベグム・カレダ・ジアがバングラデシュ初の女性首相となりました。元ファーストレディであったジアは1990年から1996年までBNP政権を率いました。1991年には財務相サイフル・ラフマンがバングラデシュ経済を自由化する大規模な計画に着手しました。"
    BNG_2009_revolution.t:0 "シェイク・ハシナの台頭？"
    BNG_2009_revolution.d:0 "シェイク・ハシナの2度目の首相在任期は経済運営の失敗と横行する汚職に彩られ、対外債務の増大やインフレの加速、若年層の失業、銀行の不正を招きました。彼女の首相在任下でバングラデシュは民主主義の後退を経験したと広く考えられています。ヒューマン・ライツ・ウォッチは彼女の政権下で強制失踪と超法規的殺害が広範に行われたことを記録しました。数多くの政治家やジャーナリストが彼女の考えに異を唱えたために組織的かつ司法手続きを通じて処罰されました。"
    BNG_2024_revolution.t:0 "民主主義の復活？"
    BNG_2024_revolution.d:0 "2024年8月5日、大勢のデモ参加者が首相公邸を取り囲む中でハシナは辞任しました。辞任はワカル・ウズ・ザマン陸軍参謀総長によって発表されました。同日のうちにハシナは混乱の中をインドへ脱出し、まず車で、次にヘリコプターで、最後に飛行機で国を去りました。辞任演説は一切ありませんでした。2024年8月6日に議会を解散したバングラデシュのモハメド・シャハブディン大統領は、前首相シェイク・ハシナの辞任を受けた学生たちの要求に応え、ユヌスをバングラデシュ暫定政府の長に指名しました。"
    
    AST_1975_revolution.t:0 "白豪主義を終わらせるか？"
    AST_1975_revolution.d:0 "1950年代以降、オーストラリア人は人種問題への姿勢を見つめ直し始めました。アボリジニの権利運動が生まれて多くのリベラルな白人オーストラリア人がこれを支持し、白豪主義に反対する運動も始まりました。1967年には国民投票が実施され、圧倒的な賛成で憲法改正が承認されて差別的な条項が削除され、連邦議会は先住民オーストラリア人のために個別に立法する権限を得ました。1970年代に入ると先住民オーストラリア人もオーストラリアの議会に議席を占めるようになりました。"
    AST_1999_revolution.t:0 "共和制を問う国民投票"
    AST_1999_revolution.d:0 "1999年11月6日に実施されたオーストラリア共和制国民投票は、憲法改正の可否を2つの設問で問うものでした。第1の設問は、1998年2月にキャンベラで開かれた半数公選・半数任命の憲法制定会議が承認した超党派の任命方式に従って議会が大統領を任命する共和制へ移行すべきか否かを問いました。政治的な重要性ははるかに低いと見なされた第2の設問は、憲法を改正して前文を挿入すべきか否かを問うものでした。共和制を問う国民投票は否決されました。"
    
    FIJ_1987_revolution.t:0 "フィジーの連続クーデター？"
    FIJ_1987_revolution.d:0 "1987年のフィジークーデターは選挙で選ばれたティモシ・バヴァドラ首相の政権を打倒し、フィジー女王エリザベス2世を廃位して共和国の宣言をもたらしました。バヴァドラが失脚した第1次クーデターは1987年5月14日に起こり、9月25日の第2次クーデターで君主制が終わりを迎え、まもなく10月10日に共和国が宣言されました。いずれの軍事行動も当時フィジー王立軍の序列第3位であったシティベニ・ランブカ中佐が主導しました。"
    FIJ_2000_revolution.t:0 "フィジーのクーデター？"
    FIJ_2000_revolution.d:0 "2000年のフィジークーデターは2000年5月19日に強硬派のイタウケイ（先住フィジー人）民族主義者が選挙で選ばれたインド系フィジー人のマヘンドラ・チョードリー首相の政権に対して起こした文民クーデターです。これに続いて5月27日にはラトゥ・サー・カミセセ・マラ大統領が行政権の掌握を図り、さらに5月29日にはフィジー共和国軍司令官フランク・バイニマラマ准将による軍事クーデターが起こりました。"
    FIJ_2006_revolution.t:0 "フィジーのクーデター？"
    FIJ_2006_revolution.d:0 "2006年12月のフィジークーデターはフランク・バイニマラマ准将がライセニア・ガラセ首相とヨセファ・イロイロ大統領に対して起こしたクーデターです。これは前年にガラセ政権がフィジー議会へ3つの法案を提出したことに始まる政治危機の帰結でした。コリコリ法案、土地裁判所法案、和解・寛容・統一法案はフィジーで続く民族対立と2000年クーデターの後始末を扱うもので、先住フィジー人寄りとみなされていました。フィジー共和国軍（RFMF）司令官のバイニマラマは10月16日にこれらの法案の撤回を含む要求リストを政権へ突きつけました。"
    FIJ_2014_revolution.t:0 "民主主義への復帰？"
    FIJ_2014_revolution.d:0 "2014年9月17日、フィジーで国会議員50名を選出する総選挙が実施されました。[1][2][3]フランク・バイニマラマ首相率いるフィジー・ファースト党は50議席中32議席を獲得し圧勝しました。選挙は当初2009年3月に予定されていましたが、政治家たちが「変革・平和・進歩のための人民憲章」に同意しなかったため延期されました。2009年から2014年にかけて選挙を求める声明や要請が幾度も出され、2014年3月23日に暫定政府は2014年9月17日に選挙を実施すると発表しました。"
    
    AFG_1973_revolution.t:0 "アフガニスタン共和国？"
    AFG_1973_revolution.d:0 "1973年のアフガニスタン・クーデターは、1973年7月17日に陸軍将軍で王族のモハンマド・ダーウード・ハーンが従兄のモハンマド・ザーヒル・シャー国王に対して起こしたもので、その結果ダーウード・ハーン率いる一党制のアフガニスタン共和国が樹立されました。"
    AFG_1978_revolution.t:0 "サウル革命？"
    AFG_1978_revolution.d:0 "サウル革命は1978年4月27日から28日にかけてアフガニスタン人民民主党（PDPA）によって決行され、モハンマド・ダーウード・ハーン大統領を打倒しました。"
    AFG_1979_revolution.t:0 "ハフィーズッラー・アミーンのクーデター？"
    AFG_1979_revolution.d:0 "タラキー書記長との個人的な対立が深まった末、アミーンは権力を奪い取って彼を失脚させ、のちに処刑を命じました。1979年9月16日、アミーンは自ら閣僚評議会議長（政府首班）、革命評議会議長（国家元首）、PDPA中央委員会書記長（最高指導者）に就任しました。"
    AFG_1986_revolution.t:0 "国民和解？"
    AFG_1986_revolution.d:0 "ナジーブッラー大統領は1987年初頭に「民族和解」計画を開始しました。その目的は国民を統一し7年にわたって国土を覆ってきた戦争を終わらせることでした。1987年11月、ナジーブッラーはアフガニスタンの新憲法を成立させ、選挙で選ばれる二院制議会を備えた大統領制を打ち立てました。憲法は「神聖なるイスラムの宗教」を国教と定め、個人の民主的権利を保障し、「政党」の結成を合法化し、諸部族・諸民族の平等を推し進めました。新体制の一環として1988年には新たな国民議会の議員を選ぶ総選挙が実施され、アフガニスタンにとって19年ぶりの選挙となりました。"
    AFG_1996_revolution.t:0 "アフガニスタン・イスラム首長国？"
    AFG_1996_revolution.d:0 "1996年9月までにタリバンはカブールを制圧し、同国の大統領を殺害してアフガニスタン・イスラム首長国を樹立しました。タリバンが最初に行ったのはクルアーンの教えと法学の厳格な解釈を敷くことでした。"
    
    LAO_1975_revolution.t:0 "パテート・ラーオの台頭？"
    LAO_1975_revolution.d:0 "パテート・ラーオは正式名称をラオス人民解放軍といい、20世紀半ばに結成されたラオスの共産主義政治運動および組織です。この組織はラオス内戦を経て1975年についに全土を制圧しました。"
    
    MLY_1951_revolution.t:0 "ヘンリー・ガーニー卿の暗殺？"
    MLY_1951_revolution.d:0 "ヘンリー・ガーニー卿の暗殺はマラヤ危機の最中である1951年10月6日に起こりました。マラヤ駐在の英国高等弁務官であったガーニーは会議のためフレーザーズヒルへ向かう途中、クアラ・クブ街道でマラヤ共産党の党員に殺害されました。"
    MLY_1955_revolution.t:0 "マラヤの完全自治？"
    MLY_1955_revolution.d:0 "1955年7月27日水曜日、マラヤ連邦で総選挙が実施されました。これは1957年の独立以前に行われた唯一の総選挙です。それまで英国高等弁務官によってすべて任命されていた連邦立法評議会の議員を選出するために行われたものでした。投票は52の全連邦選挙区で実施され、各選挙区が1名の議員を選出しました。州選挙も1954年10月10日から1955年11月12日にかけてマラヤの9州と2つの直轄植民地にある136の全州選挙区で実施され、各選挙区が州議会または直轄植民地議会の議員1名を選出しました。"
    
    SGP_1963_revolution.t:0 "コールドストア作戦？"
    SGP_1963_revolution.d:0 "コールドストア作戦とは1963年2月2日にシンガポールで実行された秘密治安作戦の暗号名であり、113名が逮捕され公共役務保安条例（PSSO）に基づいて裁判なしに拘禁されました。公式の説明によればこれはシンガポールの国内治安を脅かす共産主義者の公然戦線組織を壊滅させることを目的とした治安作戦でした。作戦は英国政府・シンガポール政府・マラヤ連邦政府の代表で構成される内部治安評議会によって承認されました。"
    SGP_1990_revolution.t:0 "リー・クアンユーの引退？"
    SGP_1990_revolution.d:0 "リーはPAPを7度の選挙で勝利に導いた後、1990年11月28日に退任し首相の座をゴー・チョクトンに引き渡しました。その時点で彼は世界で最も在任期間の長い首相となっていました。これは独立以来初めての指導者交代でした。ゴーは当時在任していた若手閣僚たちによって新首相に選出されました。"
    SGP_2004_revolution.t:0 "リー・シェンロンの首相就任？"
    SGP_2004_revolution.d:0 "2004年8月12日、リーはゴー・チョクトンの後任として首相に就任し、シンガポール金融管理局の総裁職をゴーに譲りました。ヨン・プンハウ最高裁判所長官のもとでリーはイスタナにて宣誓を行いました。首相となったリーは人民協会の会長も兼ねることになりました。最初の2年間で彼の政権は週休2日制を導入し、産休日数を延長しました。観光収入を増やすために国内へ統合型リゾートを2か所建設するという彼の提案は、マリーナ・ベイ・サンズとリゾート・ワールド・セントーサの開発につながりました。"
    SGP_2024_revolution.t:0 "ローレンス・ウォンの首相就任？"
    SGP_2024_revolution.d:0 "2022年6月6日に内閣改造が発表され、ウォンは副首相へ昇格して、リー・シェンロン首相の後継者としての地位をさらに固めました。副首相就任に加え、リーの不在時には「首相代行」にも指名されました。こうしてウォンはリーの後を継ぐ首相候補と目されるようになったのです。70歳で退くというリーの当初の計画は、ヘンの辞退によって狂っていました。2024年4月15日、首相府はローレンス・ウォンがリー・シェンロンの後任として首相に就任することを確認する声明を発表しました。"
    
    PHI_1965_revolution.t:0 "フェルディナンド・マルコスの大統領就任？"
    PHI_1965_revolution.d:0 "フェルディナンド・マルコスは1965年12月30日に第10代フィリピン大統領として最初の任期に就任しました。1935年のフィリピン憲法が任期4年で2期までと定めていたにもかかわらず、この就任は20年に及ぶ長期支配の始まりとなりました。マルコスは1965年のフィリピン大統領選挙で現職のディオスダド・マカパガル大統領を破っていたのです。"
    PHI_1986_revolution.t:0 "ピープルパワー革命？"
    PHI_1986_revolution.d:0 "ピープルパワー革命は1986年2月22日から25日にかけてフィリピン各地、主にメトロマニラで行われた一連の民衆デモです。政権による暴力と選挙不正に対する市民的抵抗運動が粘り強く続けられました。この非暴力革命はフェルディナンド・マルコスの退陣と20年に及ぶ独裁の終焉、そしてフィリピンにおける民主主義の回復をもたらしました。"
    
    KAZ_1991_revolution.t:0 "ヌルスルタン・ナザルバエフの台頭？"
    KAZ_1991_revolution.d:0 "ナザルバエフの政治経歴はソビエト時代に始まりました。製鉄所の労働者として働きながら1962年にソビエト連邦共産党へ入党し、党内で昇進を重ねて1984年にカザフ・ソビエト社会主義共和国の首相、1989年にカザフスタン共産党第一書記となりました。1990年には最高会議が彼をカザフスタン大統領に選出します。ナザルバエフはソビエト連邦の解体という難局でカザフスタンを導く上で中心的な役割を果たし、1991年の独立へと国を導きました。同年に行われた同国初の直接大統領選挙では対立候補のないまま投票が行われ、圧倒的な勝利を収めました。"
    KAZ_2019_revolution.t:0 "カシム・ジョマルト・トカエフの台頭？"
    KAZ_2019_revolution.d:0 "2019年、トカエフはヌルスルタン・ナザルバエフの辞任を受けて大統領代行に就任しました。与党アマナト党の一員であった彼はナザルバエフの後押しで同党の候補となり、同年6月の臨時選挙に勝利します。大統領としては労働者の賃金引き上げ、汚職の抑制、死刑の廃止、地方行政の分権化など数々の改革を実行してきました。国の安定を保ち、政権移行を円滑に進め、新たな改革を行う一方で、トカエフの統治は人権侵害を伴う権威主義的なものにとどまっています。"
    
    UZB_1991_revolution.t:0 "イスラム・カリモフの台頭？"
    UZB_1991_revolution.d:0 "イスラム・アブドゥガニエヴィチ・カリモフは、1991年の独立から2016年に死去するまで初代ウズベキスタン大統領を務めたウズベキスタンの政治家です。政敵が暗殺され、人権が抑圧され、異論が禁じられる抑圧的な権威主義体制をウズベキスタンに敷きましたが、1998年には死刑を廃止しました。"
    UZB_2016_revolution.t:0 "シャヴカト・ミルジヨエフの台頭？"
    UZB_2016_revolution.d:0 "シャヴカト・ミロモノヴィチ・ミルジヨエフは、2016年12月14日よりウズベキスタン大統領およびウズベキスタン軍最高司令官を務めるウズベキスタンの政治家です。それ以前は2003年から2016年までウズベキスタン首相として政府を率いました。大統領としては外国投資の誘致、近隣の中央アジア諸国との関係改善、政治犯の釈放など、政治・経済体制の自由主義的な改革を数多く進め、政治犯釈放にあわせて2019年には悪名高いジャスリク刑務所を閉鎖しました。"
    
    TKM_1991_revolution.t:0 "サパルムラト・ニヤゾフの台頭？"
    TKM_1991_revolution.d:0 "サパルムラト・アタエヴィチ・ニヤゾフは、1985年から2006年に死去するまでトルクメニスタンを率いたトルクメニスタンの政治家です。1985年から1991年までトルクメニスタン共産党第一書記を務め、1991年のソ連のクーデター未遂を支持しました。1991年にソ連から独立した後も初代大統領として15年にわたりトルクメニスタンを統治し続けました。"
    TKM_2006_revolution.t:0 "グルバングルィ・ベルディムハメドフの台頭？"
    TKM_2006_revolution.d:0 "グルバングルィ・メリクグルィエヴィチ・ベルディムハメドフは、トルクメニスタン人民評議会議長を務めたトルクメニスタンの政治家で、元歯科医です。それ以前は2006年から2022年まで第2代トルクメニスタン大統領を務め、2022年に息子のセルダルとの権力分担体制に移行しました。"
    TKM_2022_revolution.t:0 "セルダル・ベルディムハメドフの台頭？"
    TKM_2022_revolution.d:0 "セルダル・グルバングルイェヴィチ・ベルディムハメドフはトルクメニスタンの政治家で、2022年より第3代および第4代大統領を務めています。ベルディムハメドフはそれ以前にも、長年トルクメニスタンを専制的に支配してきた父グルバングルイの政権下でいくつもの役職を歴任しました。父子は2022年に権力分担の取り決めを結び、トルクメニスタンの全体主義的独裁体制を共同で統治しています。"
    
    TAJ_1991_revolution.t:0 "ラフモン・ナビエフの台頭？"
    TAJ_1991_revolution.d:0 "ラフモン・ナビエヴィチ・ナビエフはタジキスタンの政治家で、1982年から1985年までタジキスタン共産党第一書記を務め、さらに1991年9月23日から10月6日までと1991年12月2日から1992年9月7日までの二度にわたり第2代タジキスタン大統領を務めました。"
    TAJ_1992_revolution.t:0 "エモマリ・ラフモンの台頭？"
    TAJ_1992_revolution.d:0 "エモマリ・ラフモンはタジキスタンの政治家で、1994年からタジキスタン大統領を務めています。ラフモンは個人崇拝の要素を伴う権威主義体制をタジキスタンで率いています。政敵は弾圧され、人権と自由の侵害は深刻で、選挙は自由でも公正でもなく、汚職と縁故主義が横行しています。"
    
    KYR_1990_revolution.t:0 "アスカル・アカエフの台頭？"
    KYR_1990_revolution.d:0 "アスカル・アカエヴィチ・アカエフはキルギスの元政治家で、1990年から2005年3月のチューリップ革命で失脚するまでキルギス大統領を務めました。"
    KYR_2005_revolution.t:0 "チューリップ革命？"
    KYR_2005_revolution.d:0 "第一次キルギス革命とも呼ばれるチューリップ革命は、当時のキルギス大統領アスカル・アカエフの失脚につながりました。革命は2005年2月27日と3月13日の議会選挙の後に始まりました。革命勢力はアカエフとその一族および支持者による汚職と権威主義を糾弾しました。アカエフはカザフスタンへ、次いでロシアへと逃れました。"
    
    SOV_stalin_succession.t:0 "スターリンの後継者？"
    SOV_stalin_succession.d:0 "1953年3月1日、73歳のソビエト連邦指導者ヨシフ・スターリンは脳出血に倒れ、4日後に死去しました。クレムリンでのスターリンの遺体安置には悲しみに暮れる数万の市民がモスクワ中心部に押し寄せました。スターリンがまだ死の床にあるうちから、1952年10月の第19回党大会で政治局に代わって設けられた拡大機関である党幹部会は、最終的な権力を誰が握るかを決めるために会合を開いていました。"
    SOV_khrushchev.option:0 "ニキータ・フルシチョフを選ぶ"
    SOV_beria.option:0 "ラヴレンチー・ベリヤを選ぶ"
    SOV_molotov.option:0 "ヴャチェスラフ・モロトフを選ぶ"
    SOV_zhukov.option:0 "ゲオルギー・ジューコフを選ぶ"
    SOV_khrushchev_succession.t:0 "ニキータ・フルシチョフの失脚？"
    SOV_khrushchev_succession.d:0 "フルシチョフはスエズ危機やスプートニクの打ち上げ、1957年のシリア危機、1960年のU-2撃墜事件といった大きな成果のおかげで1950年代を通じて強固な支持を得ていました。しかし1960年代初頭には政策の欠陥やキューバ危機への対応によってその人気は損なわれていきます。これに勢いづいた政敵たちは密かに力を蓄え、1964年10月に彼を失脚させました。"
    SOV_khrushchev_succession_option.1:0 "フルシチョフはブレジネフに取って代わられる"
    SOV_khrushchev_succession_option.2:0 "フルシチョフは権力闘争を生き延びた！"
    SOV_gorbachev_succession.t:0 "改革派の書記長？"
    SOV_gorbachev_succession.d:0 "1985年3月10日、チェルネンコが死去しました。グロムイコは次の書記長としてゴルバチョフを推し、古参の党員であるグロムイコの推薦は中央委員会で大きな重みを持ちました。ゴルバチョフは自らの書記長指名に強い反対が出ると予想していましたが、結局は政治局の他の面々も彼を支持しました。チェルネンコの死からまもなく、政治局はまた別の高齢の指導者ではなく彼を望み、満場一致でゴルバチョフを後継者に選出しました。こうして彼はソビエト連邦の8人目の指導者となったのです。彼が実際に示したほど急進的な改革者になると想像していた者は、政府内にはほとんどいませんでした。"
    SOV_gorbachev.option:0 "より活力ある指導者を歓迎する！"
    SOV_other.option:0 "我々は別の高齢の指導者のほうがよい……"
    SOV_august_coup.t:0 "八月クーデター"
    SOV_august_coup.d:0 "八月クーデターは、ソビエト連邦共産党の強硬派が、当時ソ連大統領兼共産党書記長であったミハイル・ゴルバチョフから国家の支配権を武力で奪おうとして失敗した企てです。首謀者はゲンナジー・ヤナーエフ副大統領をはじめとする軍と政府の高官たちで、彼らは共同で国家非常事態委員会（GKChP）を組織しました。彼らはゴルバチョフの改革路線に反対し、東欧諸国への統制を失ったことに憤るとともに、調印目前だったソ連の新連邦条約を恐れていました。この条約は中央政府の権限の多くを分散させ、15の共和国へ配分するものだったのです。"
    SOV_august_coup.optio:0 "クーデターは失敗する！"
    SOV_august_coup_other.option:0 "クーデターは成功する。"
    SOV_khrushchev_thaw.t:0 "フルシチョフの雪解け？"
    SOV_khrushchev_thaw.d:0 "フルシチョフの雪解けとは、ニキータ・フルシチョフによる非スターリン化と諸国との平和共存の政策により、ソビエト連邦における弾圧と検閲が緩和された1950年代半ばから1960年代半ばまでの時期を指します。"
    SOV_detente.t:0 "西側との和解？"
    SOV_detente.d:0 "18年に及ぶソ連指導者としての在任中、ブレジネフの外交政策における目玉はデタント（緊張緩和）の推進でした。フルシチョフの雪解け期に追求された路線と共通する面もありましたが、ブレジネフの政策は2つの点で先例と大きく異なっていました。第一に目的がより包括的かつ広範であり、軍備管理、危機防止、東西貿易、欧州の安全保障、人権に関する協定の締結を含んでいた点です。第二の柱は、アメリカとソビエト連邦の軍事力を均衡させることの重要性に置かれていました。"
    SOV_brezhnev_succession.t:0 "レオニード・ブレジネフの死"
    SOV_brezhnev_succession.d:0 "1975年以降ブレジネフの健康は急速に悪化し、権力を手放さないまま国際問題から次第に身を引いていきました。1982年11月10日に死去し、書記長の座はユーリ・アンドロポフが継ぎました。"
    SOV_andropov_succession_option.1:0 "ユーリ・アンドロポフこそ我々の未来だ！"
    SOV_andropov_succession.t:0 "ユーリ・アンドロポフの死"
    SOV_andropov_succession.d:0 "1983年2月に腎不全を起こして以降、アンドロポフの健康は急速に悪化していきました。彼は約15か月にわたり国を率いた末、1984年2月9日に死去します。ブレジネフとその後継者ユーリ・アンドロポフの死を受け、チェルネンコは1984年2月に書記長へ選出され、同年4月には最高会議幹部会議長に就任しました。しかし健康の急速な衰えにより、公務を果たせないことも少なくありませんでした。"
    SOV_chernenko_succession_option.1:0 "コンスタンチン・チェルネンコが我々の未来なのか？"
    SOV_glasnost.t:0 "グラスノスチを制定するか？"
    SOV_glasnost.d:0 "グラスノスチとは、ソビエト連邦（USSR）における政府機関や政権活動の開放性と透明性の向上を意味する言葉でした。グラスノスチは、ソ連市民が自国のシステムの諸問題や潜在的な解決策について公に議論することを認めるという、ゴルバチョフ政権の決意を反映したものでした。"
    SOV_democratisation.t:0 "デモクラチザーツィヤを制定するか？"
    SOV_democratisation.d:0 "デモクラチザーツィヤとは、ソ連共産党書記長ミハイル・ゴルバチョフが1987年1月に打ち出したスローガンであり、一党制のソ連政府に「民主的」な要素を注入することを求めるものでした。ゴルバチョフのいうデモクラチザーツィヤは、地方の共産党（ソ連共産党）幹部やソビエトの選挙に、複数政党制ではないものの複数候補制を導入することを意味していました。こうして彼は自らの制度改革と政策改革を担う進歩的な人材によって、党を若返らせることを期待したのです。"
    
    PRC_1954_revolution.t:0 "中華人民共和国憲法？"
    PRC_1954_revolution.d:0 "1954年の中華人民共和国憲法は共産主義国家の憲法であり、中国史上7番目の憲法として1954年9月20日に北京で開かれた第1期全国人民代表大会第1回会議で採択・施行されました。この憲法は1949年に暫定憲法の役割を果たした中国人民政治協商会議共同綱領を基礎として修正・制定されたもので、中華人民共和国として最初の憲法です。中華人民共和国憲法は中華人民共和国の基本法であり、最高の法的効力を持ちます。"
    PRC_1966_revolution.t:0 "文化大革命？"
    PRC_1966_revolution.d:0 "文化大革命は正式には「プロレタリア文化大革命」として知られる中華人民共和国の社会政治運動でした。1966年に毛沢東によって発動され1976年の彼の死まで続きました。その公称の目的は資本主義的・伝統的要素の残滓を中国社会から一掃し中国の共産主義を守ることにありました。主たる目的は達成されませんでしたが、文化大革命は毛沢東が権力の中枢へ事実上復帰したことを意味しました。"
    PRC_1966_revolution.option.1:0 "反対派を粛清せよ！"
    PRC_1966_revolution.option.2:0 "反対されても構わない……"
    PRC_mao_succession.t:0 "毛沢東の後継者？"
    PRC_mao_succession.d:0 "毛沢東の健康は晩年に衰え、絶え間ない喫煙がそれを悪化させたと見られています。彼が晩年に複数の肺と心臓の疾患を患っていたことは国家機密とされました。最後に公の場へ姿を見せ、生前最後の写真が撮られたのは1976年5月27日、パキスタンのズルフィカール・アリー・ブットー首相の訪問を受けたときのことでした。3月と7月に大きな心臓発作を起こし、さらに9月5日の3度目の発作で寝たきりとなりました。そのおよそ4日後の1976年9月9日0時10分、82歳で死去しました。"
    PRC_deng.option:0 "鄧小平が後を継ぐのだ！"
    PRC_jing_qing.option:0 "四人組が中国を支配する！"  
    PRC_1989_1_revolution.t:0 "六四天安門事件"
    PRC_1989_1_revolution.d:0 "天安門広場の抗議運動は中国国内で六四天安門事件と呼ばれ、1989年4月15日から6月4日まで中国の北京にある天安門広場で続いた学生主導のデモでした。デモ隊と中国政府が平和的な解決を探る試みは数週間にわたって実を結ばず、中国政府は6月3日の夜に戒厳令を布告し、軍を派遣して広場を占拠させました。"
    PRC_1989_revolution.option.1:0 "あの夜は何も起きなかった！"
    PRC_1989_revolution.option.2:0 "あの夜に何かが起きた。"   
    PRC_1989_2_revolution.t:0 "江沢民政権？"
    PRC_1989_2_revolution.d:0 "江沢民は1985年に上海市長に任命され、1987年には上海市の共産党委員会書記、さらに中国共産党政治局員へと昇進しました。1989年の天安門広場での抗議と弾圧の後、学生運動を支持したことで趙紫陽が失脚すると、江沢民は妥協的な候補として予想外に党総書記の座を引き継ぎ、権力を握りました。「八大元老」の中国政治への関与が次第に弱まるなか、江沢民は権力基盤を固め、1990年代には国の「最高指導者」となりました。"  
    PRC_2002_revolution.t:0 "胡錦濤の国家主席就任？"
    PRC_2002_revolution.d:0 "胡錦濤は中国共産党の内部で頭角を現し、とりわけ貴州省とチベット自治区の党委員会書記として、反対派への厳しい弾圧によって最高指導部の注目を集めました。その後、江沢民総書記のもとで党中央書記処の筆頭書記および国家副主席へと昇進しました。胡錦濤は、内戦と建国に参加した世代よりも若い世代から出た初の共産党指導者でした。その急速な出世は、旧世代の影響力ある後ろ盾によって支えられました。" 
    PRC_2012_revolution.t:0 "習近平の国家主席就任？"
    PRC_2012_revolution.d:0 "2008年、習近平は胡錦濤の後を継ぐ最高指導者と目される立場に置かれました。2013年3月14日、北京で開かれた第12期全国人民代表大会の信任投票により、習近平は国家主席に選出されました。賛成2,952票、反対1票、棄権3票でした。2期を務めて退いた胡錦濤の後任となりました。"
    
    MGL_1952_revolution.t:0 "ユムジャーギーン・ツェデンバルの台頭？"
    MGL_1952_revolution.d:0 "1952年1月26日、チョイバルサンの死去を受けてユムジャーギーン・ツェデンバルがモンゴルの実権を握りました。ツェデンバルは30年以上にわたりモンゴル政界の中心人物であり続けました。"
    MGL_1984_revolution.t:0 "ジャムビーン・バトムンフの台頭？"
    MGL_1984_revolution.d:0 "1984年、バトムンフはD・モロムジャムツとともに、ツェデンバルを権力の座から退かせるうえで重要な役割を果たしました。同年、党の長年の指導者であったユムジャーギーン・ツェデンバルが党大会で解任されると、バトムンフが国家元首の座に就きました。"
    
    USA_1963_revolution.t:0 "ジョン・F・ケネディ暗殺？"
    USA_1963_revolution.d:0 "1963年11月22日、アメリカ合衆国第35代大統領ジョン・F・ケネディはテキサス州ダラスのディーリー・プラザを大統領専用車列で進む最中に暗殺されました。ケネディは妻ジャクリーン、テキサス州知事ジョン・コナリー、そしてコナリーの妻ネリーとともに車に乗っており、元アメリカ海兵隊員リー・ハーヴェイ・オズワルドに近くのテキサス教科書倉庫ビルから銃撃されて致命傷を負いました。"
    USA_1964_revolution.t:0 "公民権法を成立させる？"
    USA_1964_revolution.d:0 "1964年公民権法は人種・肌の色・宗教・性別・出身国に基づく差別を禁じるアメリカ合衆国の画期的な公民権法にして労働法です。有権者登録要件の不平等な適用、学校や公共施設における人種隔離、そして雇用差別を禁止しています。"
    USA_1974_revolution.t:0 "ウォーターゲート事件"
    USA_1974_revolution.d:0 "ウォーターゲート事件は1972年から1974年にかけてリチャード・ニクソン大統領の政権が関与したアメリカ合衆国の重大な政治スキャンダルであり、ニクソンの辞任につながりました。この事件は1972年6月17日にワシントンD.C.のウォーターゲート・ビルにある民主党全国委員会本部で起きた侵入事件への関与を、ニクソン政権が隠蔽しようとしたことに端を発しています。"
    USA_1998_revolution.t:0 "ビル・クリントンの弾劾？"
    USA_1998_revolution.d:0 "アメリカ合衆国第42代大統領ビル・クリントンは1998年12月19日、第105議会の下院により「重大な犯罪および非行」を理由に弾劾訴追されました。下院はクリントンに対する2件の弾劾条項を可決し、その容疑は宣誓下での偽証と司法妨害でした。他に2件の条項も審議されましたが下院の採決で否決されました。可決された弾劾条項は1999年1月7日に上院へ提出されました。そしてウィリアム・レンキスト最高裁長官が主宰する弾劾裁判が上院で始まりました。2月12日、いずれの訴追も有罪認定と罷免に必要な出席議員の3分の2の賛成に達せず、クリントンは無罪となりました。"
    USA_2019_revolution.t:0 "ドナルド・トランプの弾劾？"
    USA_2019_revolution.d:0 "アメリカ合衆国第45代大統領ドナルド・トランプに対する1度目の弾劾は、第116議会中の2019年12月18日に下院が権力の濫用と議会妨害という2件の弾劾条項を可決したことで始まりました。2020年2月5日、上院はドナルド・トランプを無罪とする評決を下しました。"
    USA_2020_revolution.t:0 "米国の公務員制度を政治化する？"
    USA_2020_revolution.d:0 "スケジュールFは2020年10月21日の大統領令13957号によって創設されました。この規定の目的は連邦の職業公務員に対する大統領の統制を強めることにありました。これは政治的な理由で連邦職員に報復する手段を与えるものだとして広く批判されました。数万から数十万人の職業公務員が身分保障を失い、政治任用の数が10倍に増える可能性があると見積もられていました。"
    USA_2021_revolution.t:0 "1月6日の反乱？"
    USA_2021_revolution.d:0 "2021年1月6日、2020年大統領選挙での敗北から2か月後、ワシントンD.C.のアメリカ合衆国議会議事堂が当時のアメリカ大統領ドナルド・トランプの支持者からなる暴徒に襲撃されました。彼らは次期大統領ジョー・バイデンの勝利を確定させる選挙人団投票の集計を行う両院合同会議を妨害し、トランプを権力の座にとどめようとしました。しかしこの襲撃は選挙結果の認定を阻止するには至りませんでした。"
    
    historical_gov_changes.option.1:0 "史実の道を歩もう！"
    historical_gov_changes.option.2:0 "我々は異なる未来を求める"
    
    stirrings_of_revolution:0 "大規模な国内騒乱"
    
    soviet_east_germany.indy.t:0 "東ドイツにさらなる自治を？"
    soviet_east_germany.indy.d:0 "1949年10月7日、SEDは社会主義的な政治憲法に基づきドイツ民主共和国を樹立し、東ドイツのあらゆる政党と大衆組織を包括する連合体「ドイツ民主共和国反ファシズム国民戦線」を自らの統制下に置きました。国民戦線は東ドイツ議会である人民議会（Volkskammer）の選挙に臨むために設立されました。ドイツ民主共和国の最初にして唯一の大統領はヴィルヘルム・ピークでした。しかし1950年以降、東ドイツの政治権力を握っていたのはSED第一書記のヴァルター・ウルブリヒトでした。"
    soviet_baltic_states.indy.t:0 "バルト三国の独立？"
    soviet_baltic_states.indy.d:0 "1980年代後半、ソ連の支配に対する大規模な市民的抵抗運動「歌う革命」が始まりました。1989年8月23日には200万人が参加した人間の鎖「バルトの道」がタリンからヴィリニュスまで600kmにわたって連なりました。ソ連は1991年9月6日にバルト三国の独立を承認しました。"
    soviet_weaken_eastern_bloc.indy.t:0 "シナトラ・ドクトリン？"
    soviet_weaken_eastern_bloc.indy.d:0 "史実では、シナトラ・ドクトリンとはミハイル・ゴルバチョフの下でワルシャワ条約機構の加盟国に自国の内政を自ら決定させることを認めたソ連の外交政策です。この名称はフランク・シナトラの歌唱で知られる「マイ・ウェイ」になぞらえた冗談であり、ソ連がこれらの国に我が道を行くことを許したという意味でした。その実施はゴルバチョフが掲げた新思考外交の一環でした。"
    soviet_weaken_eastern_bloc.indy.f:0 "このイベントは[ROOT.GetCountry.GetName]が債務不履行に陥っているか経済が健全でないか革命が起きており、かつ民主的な統治者がいるために発生しました。"
    eastern_bloc_revolution.t:0 "[ROOT.GetCountry.GetNameNoFlag]における共産主義の終焉？"
    eastern_bloc_revolution.d:0 "史実において1989年の革命は共産主義の崩壊とも呼ばれ、東側ブロックをはじめ世界各地のマルクス・レーニン主義政権の大半を崩壊させた自由民主主義運動の革命的な波でした。"
    eastern_bloc_revolution.f:0 "このイベントは[ROOT.GetCountry.GetName]が史実の条件を満たしているか、債務不履行に陥っているか経済が健全でないか民主主義を支持する革命的政治運動が存在するために発生しました。"
    sino_soviet_split.t:0 "中ソ対立？"
    sino_soviet_split_prc.t:0 "中ソ対立"
    sino_soviet_split.d:0 "中ソ対立とは、1947年から1991年の冷戦下で双方の地政学的事情に影響されたマルクス・レーニン主義の解釈と実践の相違から生じた教義上の乖離によって引き起こされた、中国とソビエト連邦の関係の段階的な悪化です。1950年代後半から1960年代初頭にかけて正統マルクス主義の解釈をめぐる中ソ間の論争は、ソビエト連邦の非スターリン化政策と西側ブロックとの平和共存政策をめぐる具体的な対立へと発展し、中国建国の父である毛沢東はこれを修正主義として糾弾しました。"
    sino_soviet_split_ussr.f:0 "このイベントは[SCOPE.sCountry('communist_china_scope').GetName]の[concept_ruler]が[ROOT.GetCountry.GetName]の[concept_ruler]と相容れないために発生しました。"
    sino_soviet_split.f:0 "このイベントは[SCOPE.sCountry('sino_soviet_split_ussr').GetName]の[concept_ruler]が[ROOT.GetCountry.GetName]の[concept_ruler]と相容れないために発生しました。"
    yugoslav_soviet_split.t:0 "ソ連・ユーゴ対立"
    yugoslav_soviet_split.d:0 "チトー・スターリン分裂、またはソ連・ユーゴスラビア分裂は、第二次世界大戦後の数年間にヨシップ・ブロズ・チトー率いるユーゴスラビアとヨシフ・スターリン率いるソ連の政治指導部の間で高まった対立が頂点に達したものです。双方はこれをイデオロギー上の論争として示しましたが、この対立はアルバニアやブルガリア、そしてチトーのユーゴスラビアが支援しソ連が密かに反対したギリシャの共産主義蜂起をも巻き込んだバルカン半島の地政学的抗争の産物でもありました。"
    yugoslav_soviet_split_ussr.f:0 "このイベントは[SCOPE.sCountry('communist_yugoslavia_scope').GetName]の[concept_ruler]が[ROOT.GetCountry.GetName]の[concept_ruler]と相容れないために発生しました。"
    soviet_east_germany_1.indy.t:0 "東ドイツの建国？"
    soviet_east_germany_1.indy.d:0 "東ドイツの建国は1949年10月7日に行われ、続く数日のうちに関連する出来事が相次ぎました。臨時人民議会、州議会、東ドイツ臨時政府が設置され、ヴィルヘルム・ピークが初代大統領に選出されました。ドイツ民主共和国が存続した期間中、この建国は祝日である共和国記念日として毎年祝われました。"
    
    eastern_europe_indy.option.1:0 "彼らにもっと自由を与えよう。"
    eastern_europe_indy.option.2:0 "奴らに自由などくれてやるものか！"
    sino_soviet_split.option.1:0 "議論はもう十分だ。ソ連と決別する！"
    sino_soviet_split.option.2:0 "意見の相違はこのままにしておこう…"
    sino_soviet_split.option.3:0 "どうせ中国など好きではなかった！"
    yugoslav_soviet_split.option.1:0 "議論はもう十分だ。ユーゴスラビアと決別する！"
    yugoslav_soviet_split.option.2:0 "意見の相違はこのままにしておこう…"
    yugoslav_soviet_split.option.3:0 "どうせソ連など好きではなかった！"
    
    weaken_the_warsaw_pact.tt:0 "ワルシャワ条約機構を弱体化させる"
    
    algerian_war.t:0 "アルジェリア独立戦争"
    algerian_war.d:0 "アルジェリア戦争は1954年から1962年にかけてフランスとアルジェリア民族解放戦線の間で戦われた大規模な武力紛争であり、アルジェリアはこれによってフランスからの独立を勝ち取りました。重要な脱植民地化戦争であり、ゲリラ戦と戦争犯罪を特徴とする複雑な紛争でした。"
    angolan_war.t:0 "アンゴラ独立戦争"
    angolan_war.d:0 "アンゴラ独立戦争はアンゴラでは「ルタ・アルマダ・デ・リベルタサン・ナシオナル」として知られ、綿花の強制栽培に対する蜂起として始まり、3つの民族主義運動と1つの分離独立運動がポルトガルの海外州アンゴラの支配権を争う多勢力間の闘争へと発展しました。"
    mozambican_war.t:0 "モザンビーク独立戦争"
    mozambican_war.d:0 "モザンビーク独立戦争はモザンビーク解放戦線（FRELIMO）のゲリラ勢力とポルトガルとの間の武力紛争でした。戦争は1964年9月25日に正式に始まり1974年9月8日の停戦で終結し、1975年の交渉による独立へと至りました。"
    bissau_guinean_war.t:0 "ギニアビサウ独立戦争"
    bissau_guinean_war.d:0 "ギニアビサウ独立戦争（ビサウ・ギニア独立戦争）は1963年から1974年にかけてポルトガル領ギニアで戦われた武力独立紛争です。"
    cameroonian_war.t:0 "カメルーン独立戦争"
    cameroonian_war.d:0 "カメルーン戦争とはカメルーンの民族主義運動とフランスとの間の独立闘争の呼称です。この運動はカメルーン人民同盟が主導しました。独立後も反乱は続き、現代の政治を形作っています。"
    namibian_war.t:0 "ナミビア独立戦争"
    namibian_war.d:0 "南アフリカ国境戦争はナミビア独立戦争としても知られ、南アフリカではアンゴラ・ブッシュ戦争と呼ばれることもある紛争で、1966年8月26日から1990年3月21日までナミビア（当時の南西アフリカ）、ザンビア、アンゴラにおいて主に非対称な形で戦われました。"
    kenyan_war.t:0 "ケニア非常事態"
    kenyan_war.d:0 "マウマウ団の乱はマウマウ蜂起、マウマウの反乱、ケニア非常事態とも呼ばれ、イギリス領ケニア植民地においてマウマウの名でも知られるケニア土地自由軍とイギリス当局との間で戦われた戦争です。"
    cypriot_war.t:0 "キプロス非常事態"
    cypriot_war.d:0 "キプロス非常事態は1955年11月から1959年3月にかけて英領キプロスで戦われた紛争です。ギリシャ系キプロス人の右翼民族主義ゲリラ組織であるキプロス闘士民族組織（EOKA）は1955年、イギリスの植民地支配の終結とキプロスのギリシャへの統合（エノシス）を求めて武装闘争を開始しました。トルコ系キプロス人がエノシスに反対したことはキプロス分割を支持するトルコ抵抗組織（TMT）の結成を招きました。キプロス非常事態は1959年のロンドン・チューリッヒ協定の調印により終結しました。"
    malayan_emergency.t:0 "マラヤ非常事態"
    malayan_emergency.d:0 "マラヤ非常事態は英領マラヤで戦われたゲリラ戦争であり、独立を求める共産主義勢力のマラヤ民族解放軍と、マラヤ連邦・大英帝国・イギリス連邦の軍とが交戦しました。"
    Malagasy_war.t:0 "マダガスカル蜂起"
    Malagasy_war.d:0 "マダガスカル蜂起は1947年3月から1949年2月まで続いた、マダガスカルにおけるフランスの植民地支配に対するマダガスカル民族主義者の反乱です。1947年3月29日の夜、主に槍で武装したマダガスカル民族主義者が島東部のモラマンガとマナカラ周辺に集中する軍事基地とフランス人所有の農園へ連携した奇襲攻撃を仕掛けました。民族主義の大義は南部で急速に広まり、翌月には中央高地と首都アンタナナリボにまで波及し、マダガスカル民族主義勢力の戦闘員は100万人以上に達したと推定されています。"
    brunei_revolt_1962.t:0 "ブルネイ反乱"
    brunei_revolt_1962.d:0 "ブルネイ反乱はイギリス保護領ブルネイで起きた武装蜂起であり、王政が進めようとしたマレーシア連邦への参加に反対する勢力が引き起こしました。蜂起の担い手はTNKU（北カリマンタン国民軍）の構成員で、インドネシアから物資の供給を受け、親インドネシアの北ボルネオ連邦を志向する左派のブルネイ人民党（BPR）と結びついた民兵組織でした。"
    
    historical_colonial_wars.option.1:0 "取るに足らぬ反乱など叩き潰せ！"
    historical_colonial_wars.option.2:0 "反乱者に譲歩する"
    
    eritrean_war.t:0 "エリトリア独立戦争"
    eritrean_war.d:0 "エリトリア独立戦争は、エリトリアの独立闘争勢力が1961年9月1日から1991年5月24日にかけて歴代のエチオピア政府と戦った独立戦争です。"
    congolese_war.t:0 "コンゴ動乱"
    congolese_war.d:0 "コンゴ動乱は1960年から1965年にかけてコンゴ共和国で起きた政治的混乱と紛争の時代です。この動乱はコンゴがベルギーから独立した直後に始まり、非公式には全土がジョゼフ＝デジレ・モブツの支配下に入ったことで終結しました。"
    yugoslav_war.SLO.t:0 "スロベニアの独立？"
    yugoslav_war.SLO.d:0 "スロベニアは1991年6月25日に独立を宣言しユーゴスラビア社会主義連邦共和国から離脱しました。1990年12月23日に行われた国民投票では、スロベニアの有権者の88.2％が独立に賛成しました。"
    yugoslav_war.CRO.t:0 "クロアチアの独立？"
    yugoslav_war.CRO.d:0 "1991年6月25日、この国はユーゴスラビア社会主義連邦共和国からの独立を宣言し、構成共和国としての地位に終止符を打つ取り組みを完了させました。"
    yugoslav_war.BOS.t:0 "ボスニアの独立？"
    yugoslav_war.BOS.d:0 "1991年10月15日の主権宣言に続き、1992年2月29日と3月1日にユーゴスラビアからの独立を問う国民投票が実施されました。この投票はボスニアのセルビア人の大多数にボイコットされたため投票率は64％にとどまり、そのうち98％が提案に賛成しました。"
    yugoslav_war.KOS.t:0 "コソボの独立？"
    yugoslav_war.KOS.d:0 "1989年にセルビア当局によって解散させられたものの、アルバニア系議員が地下で会合を続けていた州議会は、1991年9月22日にコソバ共和国を主権を有する独立国家として宣言しました。投票率87％のもと、99％を超える有権者が独立に賛成しました。"
    yugoslav_war.MCD.t:0 "マケドニアの独立？"
    yugoslav_war.MCD.d:0 "1991年9月8日に行われた国民投票では、投票者の95％がマケドニアの独立を支持しました。アルバニア系住民は自らの憲法上の地位が不当に低いとして抗議し、この投票をボイコットしました。10月初旬、憲法委員会は新憲法の最終草案を採択しました。"
    chechen_war.RUS.t:0 "チェチェンの独立？"
    chechen_war.RUS.d:0 "第一次チェチェン戦争は第一次露チェチェン戦争とも呼ばれ、1994年12月11日から1996年8月31日にかけてチェチェン・イチケリア共和国がロシア連邦に対して戦った独立闘争です。"
    kurdish_war.IRQ.t:0 "クルドの独立？"
    kurdish_war.IRQ.d:0 "1991年のイラク蜂起はシーア派とクルド人が主導したイラクのサダム・フセイン政権に対する民族的・宗教的な蜂起です。湾岸戦争終結後の停戦を経て1991年3月から4月まで続きました。"
    gazan_war.PAL.t:0 "ガザの戦闘？"
    gazan_war.PAL.d:0 "2023年10月7日、イスラエルとハマス率いるパレスチナ武装勢力との武力紛争が主にガザ地区とその周辺で始まりました。ハマスがガザ地区からイスラエル南部へ奇襲を仕掛けたのが発端です。"
    cypriot_war.CYP.t:0 "北キプロスの蜂起"
    cypriot_war.CYP.d:0 "キプロス問題はキプロス共和国を統治するギリシャ系キプロス人社会とトルコ共和国軍が駐留する島北部のトルコ系キプロス人社会との間で続く対立です。"
    isis_war.t:0 "ISISの蜂起"
    isis_war.d:0 "イスラム国はシリア内戦に乗じて戦闘員がイラク北西部とシリア東部の広大な領域を征服した2014年に世界的な注目を集めました。2015年末には推定1200万人が暮らす地域を支配し、独自に解釈したイスラム法を強制し、年間10億米ドルを超える予算を運用し、3万人以上の戦闘員を指揮下に置いていました。アメリカ、イラク、クルド各勢力との激しく消耗する戦闘を経て、2019年までに中東の領域をすべて失い、かつて支配した地域では反乱戦術へと回帰しました。"
    biafran_war.NGE.t:0 "ビアフラ戦争？"
    biafran_war.NGE.d:0 "ビアフラ戦争は、ナイジェリアと1967年にナイジェリアからの独立を宣言した分離主義国家ビアフラ共和国との間で戦われた内戦です。ビアフラはイボ人の民族主義的悲願を体現する存在であり、その指導部は北部ナイジェリアのムスリムであるハウサ・フラニ人の利害に支配された連邦政府とはもはや共存できないと考えていました。"
    bougainville_war.PNG.t:0 "ブーゲンビル紛争"
    bougainville_war.PNG.d:0 "ブーゲンビル内戦とも呼ばれるブーゲンビル紛争は、1988年から1998年にかけてパプアニューギニア（PNG）の北ソロモン地方で戦われた重層的な武力紛争です。PNGとブーゲンビル革命軍（BRA）の分離主義勢力との間、さらにBRAとブーゲンビル島内の他の武装集団との間で争われました。"
    Cabinda_war.ANG.t:0 "カビンダ戦争"
    Cabinda_war.ANG.d:0 "カビンダ戦争は、カビンダ飛び地解放戦線（FLEC）がアンゴラ政府に対して続けている分離主義の武装闘争です。FLECはアンゴラのカビンダ地方の領域内に位置する自称カビンダ共和国の復活を目指しています。"
    Tigray_war.ETH.t:0 "ティグレ戦争"
    Tigray_war.ETH.d:0 "ティグレ戦争は2020年11月3日から2022年11月3日まで続いた武力紛争です。戦闘は主にエチオピアのティグレ地域で行われ、エチオピア連邦政府とエリトリアに与する勢力と、ティグレ人民解放戦線（TPLF）とが戦いました。"
    yemeni_war.YEM.t:0 "イエメン内戦"
    yemeni_war.YEM.d:0 "イエメン内戦は2014年末に始まった多勢力入り乱れる内戦で、主にラシャド・アル＝アリミ率いる大統領指導評議会とマハディ・アル＝マシャト率いる最高政治評議会、そしてそれぞれの支持者や同盟勢力の間で戦われています。双方とも自らがイエメンの正統な政府であると主張しています。内戦は2014年9月にフーシ派の部隊が首都サヌアを制圧したことで始まり、続いてフーシ派が急速に政府を掌握しました。"
    Aceh_war.IDO.t:0 "アチェ紛争"
    Aceh_war.IDO.d:0 "アチェ紛争は、1976年から2005年にかけて自由アチェ運動（GAM）が戦った紛争であり、アチェ州をインドネシアから独立させることを目的としていました。2003年の大規模な軍事攻勢の結果と2004年のインド洋大地震を経て和平合意が結ばれ、紛争は終結しました。"
    Kurdish_war.IRQ.t:0 "クルド人蜂起"
    Kurdish_war.IRQ.d:0 "1991年のイラク蜂起は、シーア派とクルド人が主導した、イラクのサッダーム・フセイン政権に対する民族的・宗教的な蜂起です。湾岸戦争の終結に伴う停戦の後、1991年3月から4月にかけて続きました。ほとんど連携の取れていなかったこの蜂起は、イラクのサッダーム・フセイン大統領が政権転覆に対して脆弱になったという見方に後押しされたものでした。"
    LTTE_war.SRL.t:0 "スリランカ内戦"
    LTTE_war.SRL.d:0 "スリランカ内戦は、1983年から2009年までスリランカで戦われた内戦です。1983年7月23日に始まり、ヴェルピライ・プラバカランが率いるタミル・イーラム解放の虎（LTTE、タミル・タイガーとも呼ばれる）による、政府への断続的な武装闘争でした。LTTEは、シンハラ人主導のスリランカ政府によるスリランカ・タミル人への絶え間ない差別と暴力的な迫害を背景に、島の北東部にタミル・イーラムと呼ばれる独立したタミル人国家を築くために戦いました。"
    Darfur_war.SUD.t:0 "ダルフール紛争"
    Darfur_war.SUD.d:0 "ダルフール紛争は、スーダンのダルフール地方で起きた大規模な武力紛争です。2003年2月、スーダン解放運動（SLM）と正義と平等運動（JEM）の反政府勢力が、ダルフールの非アラブ系住民を抑圧しているとしてスーダン政府に対する戦闘を開始したことで始まりました。"
    Zapatista_Uprising.t:0 "サパティスタ蜂起"
    Zapatista_Uprising.d:0 "1994年1月1日、サパティスタ民族解放軍（EZLN）は北米自由貿易協定の発効に抗議し、メキシコのチアパス州で12日間にわたる蜂起を起こしました。反乱軍はチアパスの諸都市を占拠して囚人を解放し土地台帳を破壊しました。メキシコ陸軍および警察との戦闘を経て1月12日に停戦が仲介されました。犠牲者は約300人に上りました。"
    moro_war.PHI.t:0 "モロ紛争"
    moro_war.PHI.d:0 "モロ紛争はフィリピンのミンダナオ地方で発生した反乱であり、複数の武装勢力が関与しました。その根源は、1898年のアメリカによるフィリピン併合をはじめとする外国支配に対し、バンサモロの人々が長きにわたり続けてきた抵抗の歴史にあります。"
    CCW_war.ROC.t:0 "海南島の戦い"
    CCW_war.ROC.d:0 "海南島の戦いは中国内戦の最終局面にあたる1950年に起こりました。中華人民共和国（PRC）は4月16日に海南島への上陸作戦を実施し、島の内陸部の大半を掌握していた海南の共産主義運動がこれを支援しました。一方、沿岸部を支配していた中華民国（ROC）の兵力は北部の海口周辺に集中しており、上陸を受けて南へ退却せざるをえませんでした。共産側は月末までに海南南部の諸都市を制圧し5月1日に勝利を宣言しました。"
    chinese_civil_wars.option.1:0 "海南で戦争を止める"
    chinese_civil_wars.option.2:0 "海南へ、そして台湾へ！"
    maluku_war.IDO.t:0 "南マルク蜂起"
    maluku_war.IDO.d:0 "ジャワ人とムスリムが主導するインドネシア共和国を信用しない南モルッカ人は、大半がプロテスタントで親オランダ的であり、長らく王立オランダ領東インド軍（KNIL）に兵力を提供してきました。彼らは1950年4月25日にアンボン島とセラム島で南マルク共和国の独立を宣言しました。スカルノはこれを認めず、その命によりインドネシア軍がモルッカ諸島のブル島とセラム島の一部に侵攻しました。"
    khuzestan_war.PER.t:0 "フーゼスターン蜂起"
    khuzestan_war.PER.d:0 "1979年のフーゼスターン蜂起は、イラン革命の余波で発生したイラン各地の蜂起の一つです。この動乱はアラブ人による自治の要求によって煽られました。蜂起はイラン治安部隊によって事実上鎮圧され、双方で100人を超える死者を出しました。"
    azawad_war.MAL.t:0 "マリ戦争"
    azawad_war.MAL.d:0 "2012年3月22日、アマドゥ・トゥマニ・トゥーレ大統領は危機への対応をめぐるクーデターによって失脚しました。大統領選挙の予定日の1か月前のことです。自らを民主主義国家回復国民委員会（CNRDR）と名乗る反乱兵たちが実権を握り、マリ憲法を停止しました。クーデター後の混乱の結果、マリ北部の三大都市であるキダル・ガオ・トンブクトゥが3日連続で反乱勢力に制圧されました。2012年4月5日、ドゥエンツァ攻略の後にMNLAは目的を達成したと表明し攻勢を中止しました。その翌日、マリ北部の独立を宣言しアザワドと改称したのです。"
    kurdish_war.PER.t:0 "クルド人の反乱"
    kurdish_war.PER.d:0 "1979年のイランにおけるクルド人の反乱は、イラン革命後の新国家に対する同国最大級の全国的蜂起の一つでした。この反乱は革命終結からわずか2か月後の3月中旬に始まり、近代イランで最も激しいクルド人の反乱の一つとなりました。"
    balochistan_war.PAK.t:0 "バローチスタンの反乱"
    balochistan_war.PAK.d:0 "第四次バローチスターン紛争は、1973年から1977年まで4年間続いた軍事紛争であり、パキスタン最大の州バローチスターンでパキスタン陸軍とバローチ人の分離主義者や部族民が戦いました。紛争は1973年、当時のパキスタン大統領ズルフィカール・アリー・ブットーが、イラク大使館でバローチ人反乱勢力向けとされる武器が発見されたことを口実に選挙で選ばれたバローチスターン州政府を解任した直後に始まりました。正当に選出された政府の解任に対する抗議はやがてバローチスターンの分離独立を求める声へと広がり、ブットーはパキスタン陸軍に州への進駐を命じました。"
    chechen_war_2.RUS.t:0 "第二次チェチェン戦争"
    chechen_war_2.RUS.d:0 "第二次チェチェン戦争は1999年8月から2009年4月にかけて、チェチェンおよび北カフカースの周辺地域でロシア連邦と分離独立を宣言したイチケリア・チェチェン共和国との間で戦われました。1999年8月、チェチェンのイスラム過激派がロシアのダゲスタンに侵入します。さらに9月にはロシア各地の都市でアパート爆破事件が起こり、300人以上が死亡しました。ロシア当局はただちにチェチェン人の犯行だと断じましたが、野戦司令官を含めチェチェン側で犯行を認めた者はいませんでした。緒戦ではロシア軍と親ロシア派チェチェン人武装組織がチェチェン分離主義勢力と正面から交戦し、1999年12月から2000年2月まで続いた冬の包囲戦の末にチェチェンの首都グロズヌイを制圧しました。"
    bosnian_war.BOS.t:0 "ボスニア戦争"
    bosnian_war.BOS.d:0 "ボスニア戦争は1992年から1995年にかけてボスニア・ヘルツェゴビナで起こった国際的な武力紛争です。それ以前にも暴力的な事件が相次いでいましたが、一般には1992年4月6日に始まったとされます。戦争は1995年12月14日にデイトン合意が調印されて終結しました。主な交戦勢力はボスニア・ヘルツェゴビナ共和国、ヘルツェグ＝ボスナ共和国、スルプスカ共和国の各軍であり、後者2つはそれぞれクロアチアとセルビアが主導し支援した事実上の国家でした。"
    tajikistani_war.TAJ.t:0 "タジキスタン内戦"
    tajikistani_war.TAJ.d:0 "タジキスタン内戦は1992年5月に始まり1997年6月に終結しました。タジキスタンのガルムおよびゴルノ・バダフシャン地方の地域勢力が、ホジェンドとクロブ出身者に牛耳られたラフモン・ナビエフ大統領の新政権に対して蜂起しました。反乱勢力を率いたのは自由民主主義的な改革派とイスラム主義者の連合であり、彼らは後に統一タジク反対派の旗の下に結集することになります。"
    angolan_war.ANG.t:0 "アンゴラ内戦"
    angolan_war.ANG.d:0 "アンゴラ内戦は1975年に始まり中断を挟みながら2002年まで続いたアンゴラの内戦です。この戦争は1975年11月にアンゴラがポルトガルから独立した直後に勃発しました。共産主義のアンゴラ解放人民運動（MPLA）と反共産主義のアンゴラ全面独立民族同盟（UNITA）という、かつて反植民地闘争を戦った2つのゲリラ運動の間の権力闘争でした。"
    mozambican_war.MOZ.t:0 "モザンビーク内戦"
    mozambican_war.MOZ.d:0 "モザンビーク内戦は国内の対立と冷戦政治による分極化の影響が重なって1977年から1992年までモザンビークで戦われた内戦です。戦闘はモザンビークの支配政党であるマルクス主義のモザンビーク解放戦線（FRELIMO）、反共産主義の武装勢力であるモザンビーク民族抵抗運動（RENAMO）、そしてPRM、UNAMO、COREMO、UNIPOMO、FUMOといった数多くの小規模な党派の間で繰り広げられました。"
    Casamance_war.SEN.t:0 "カザマンス紛争"
    Casamance_war.SEN.d:0 "カザマンス紛争は1982年から続くセネガル南部の長期にわたる分離独立闘争です。カザマンス民主勢力運動（MFDC）を中心とするこの紛争は、周縁化や土地の権利、文化的アイデンティティをめぐる地域の不満に端を発しています。地理的に孤立し民族的にも異質なカザマンスは中央政府からの自治を求めてきました。激しい戦闘は1990年代に頂点を迎えましたが、散発的な衝突や地雷の脅威という形で低い水準の暴力が今なお続いています。"
    kashmir_insurgency_war.t:0 "カシミールの反乱"
    kashmir_insurgency_war.d:0 "1989年、政治制度への幻滅が武装反乱を煽り、ジャンムー・カシミールで反乱が勃発しました。ジャンムー・カシミール解放戦線によるルビヤ・サイードの誘拐はこの混乱の象徴となりました。パキスタンの支援を受けた武装組織は官僚や民間人を標的とし、地域の地政学と安全保障を塗り替える数十年に及ぶ紛争に火をつけました。"
    sudan_civil_war_2023.t:0 "スーダン内戦"
    sudan_civil_war_2023.d:0 "2023年4月15日以降、スーダンでは軍事政権内で対立する2つの派閥による内戦が続いています。この紛争の当事者は、アブドゥル・ファッターフ・アル・ブルハン将軍が率い陸軍・海軍・空軍・共和国防衛隊から成る国際的に承認されたスーダン軍（SAF）の政府と、より広範なジャンジャウィード連合を統率するヘメティ将軍の指揮する準軍事組織・即応支援部隊（RSF）です。"
    SSD_war.SUD.t:0 "アニャニャの反乱"
    SSD_war.SUD.d:0 "第一次スーダン内戦（アニャニャの反乱とも呼ばれます）は1955年から1972年にかけてスーダン北部と、代表権の拡大とより大きな地域自治を求める南部スーダン地域との間で戦われました。この戦争は大きく4つの段階に分かれます。初期のゲリラ戦、アニャニャ反乱軍の結成、政府内部の政争、そして南スーダン解放運動の樹立です。17年近くに及んだ戦争で約100万人が命を落としました。"
    myanmar_civil_war_2021.t:0 "ミャンマー内戦？"
    myanmar_civil_war_2021.d:0 "ミャンマー内戦は2021年2月1日の軍事クーデターを機に始まりました。この権力奪取は大規模な反クーデターデモとタットマドー（ミャンマー国軍）による暴力的な弾圧を招き、同国で長く続く反政府武装闘争を大きく激化させました。"
    
    historical_civil_wars.option.1:0 "戦争を始めよう！"
    historical_civil_wars.option.2:0 "平和的な道を選ぶ。"
    
    historical_abolish_monarchy.t:0 "[SCOPE.sCountry('monarch_home_country').GetAdjective]の君主制を廃止するか？"
    historical_abolish_monarchy.d:0 "[SCOPE.sCountry('abolishing_monarchy_country').GetName]は現在[SCOPE.sCountry('monarch_home_country').GetAdjective]の君主を戴く君主制国家です。しかし歴史上この時期に君主制は[SCOPE.sCountry('abolishing_monarchy_country').GetAdjective]の大統領に取って代わられました。我々も歴史にならって同じ道を進むべきでしょうか？"
    historical_abolish_monarchy.option.1:0 "そうだ、君主制は過去の無用な遺物にすぎない。"
    historical_abolish_monarchy.option.2:0 "いや、我々は君主制を愛している！"
    
    1950_recession.t:0 "戦後不況"
    1950_recession.d:0 "1949年の不況は、トルーマン大統領の「フェアディール」経済改革の直後に始まった短期的な景気後退です。第二次世界大戦の終結がもたらした余波が主な原因だったと言われています。"
    1950_recession.f:0 "経済の安定に1年ほどかかることへの、ゲーム内での理由付けです。"
    1971_bretton_woods_system.t:0 "ブレトン・ウッズ体制の終焉？"
    1971_bretton_woods_system.d:0 "国際収支の赤字、ベトナム戦争と「偉大な社会」計画による政府債務の増大、そして連邦準備制度による通貨インフレによって、ドルはますます過大評価されるようになりました。1971年にはワシントンでさらに多くのドルが刷られ、軍事費と社会政策への支出を賄うために海外へ送り出されていきました。1971年の最初の半年だけで220億ドルの資産が米国から流出しました。これを受けてニクソンは1971年8月15日に大統領令11615号を発し、一方的に金の窓口を閉鎖して、公開市場を除きドルと金の直接交換を停止しました。"
    1971_bretton_woods_system.f:0 "これは史実に基づくイベントです。"
    1971_bretton_woods_system.1:0 "ブレトン・ウッズ体制を終わらせる"
    1971_bretton_woods_system.2:0 "何としても体制を維持する！"
    2000_new_year.t:0 "新たなミレニアムの幕開け"
    2000_new_year.d:0 "2000年（MM）はグレゴリオ暦で土曜日から始まる世紀うるう年でした。2000年は「Y2K」と略されることがあります（「Y」はyear、「K」は千を意味するkiloを表します）。2000年はY2K問題の対象となりました。これはコンピュータが1999年から2000年へ正しく移行できないのではないかという懸念です。しかし1999年末までに多くの企業がすでに新しいソフトウェアへ移行するか既存のものを更新しており、Y2K認証を取得した企業さえありました。膨大な労力の結果、実際に起きた問題は比較的わずかでした。"
    2000_new_year.f:0 "2000年という年が我々を未来へ進ませてくれるのならそれでよい。だが人々がそれを終止符と見なし、その後にひと息つけると考えてはいないか。そんなことはできないのだ。"
    communist_economic_liberalisation.t:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の特色ある社会主義？"
    communist_economic_liberalisation.d:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の経済が低迷していることから、完全な計画経済を終わらせて民間企業を認めるため、政府が国民経済を自由化すべきだと提案されています。この方策は現在この国を悩ませている経済問題を解決すると見込まれます。"
    communist_economic_liberalisation.f:0 "このイベントは[ROOT.GetCountry.GetAdjectiveNoFlag]の経済が健全でないために発生しました。"
    SOV_Kosygin_Reforms.t:0 "コスイギン経済改革？"
    SOV_Kosygin_Reforms.d:0 "コスイギン経済改革は、ソ連経済に対して計画された一連の変革です。その中心は、企業の成功を測る2つの主要指標として収益性と売上高を導入することでした。企業利益の一部は労働者への報奨と事業拡大に充てる3つの基金へ回され、大半は中央予算へ納められます。これらはソ連の数理志向の経済計画者たちが長年温めてきた構想を反映したものであり、経済計画の過程における分権化へ向けた転換の端緒となりました。"
    Indian_Economic_Liberalisation.t:0 "インドの経済自由化？"
    Indian_Economic_Liberalisation.d:0 "インドの経済自由化とは、自国経済を世界へ開放し、より市場志向で消費主導のものとすることを目指した一連の政策転換を指します。その狙いは民間投資と外国投資の役割を拡大することにあり、それが経済成長と発展を実現する手段と見なされました。1966年と1980年代初頭にも自由化の試みはありましたが、より本格的な自由化は1991年に始まりました。"
    HUN_NEM_Reforms.t:0 "新経済メカニズム？"
    HUN_NEM_Reforms.d:0 "新経済メカニズム（NEM）は、1968年にハンガリー人民共和国で始まった大規模な経済改革です。1972年から1978年にかけては東側ブロックの政治情勢に押されて縮小されました。続く10年間、1989年の革命がこの時代を終わらせるまで、NEMという名が前面に出されない場合でもその原則はハンガリー経済に影響を与え続けました。NEMにより、1980年代のハンガリーは東側ブロックのどの経済よりも中央計画に対する市場メカニズムの比率が高くなりました。"
    PRC_GLF_Reforms.t:0 "大躍進？"
    PRC_GLF_Reforms.d:0 "大躍進は1958年から1962年にかけて中華人民共和国（PRC）で行われた中国共産党（CCP）主導の経済・社会運動です。党主席の毛沢東は人民公社の設立によって農業経済の国を工業化社会へと作り変えるためこの運動を開始しました。毛沢東は穀物収穫量を倍増させ農村部へ工業をもたらす取り組みを強化するよう布告しました。"
    SOV_VLC_Reforms.t:0 "処女地開拓運動？"
    SOV_VLC_Reforms.d:0 "処女地開拓運動はソ連国民を苦しめる食糧不足を緩和するため農業生産を飛躍的に増大させようとした1953年のニキータ・フルシチョフの計画です。数十万人の若い志願者が西シベリアと北カザフスタンの土地に入植し耕作を行いました。この計画は最終的にソ連農業にとって甚大な失敗となりましたが当初は成功を収めていました。"
    EGR_NES_Reforms.t:0 "新経済システム"
    EGR_NES_Reforms.d:0 "新経済システムは1963年にドイツ民主共和国（GDR）の支配政党である社会主義統一党（SED）が実施した経済政策です。その目的は1951年以降GDRの経済運営に用いられてきた五か年計画方式を置き換えることでした。このシステムは既存の中央計画の成果を改善し経済を可能な限り効率的に運営するためヴァルター・ウルブリヒトによって導入されました。"
    SOV_economic_perestroika.t:0 "協同組合法？"
    SOV_economic_perestroika.d:0 "1988年5月に制定された協同組合法はゴルバチョフ時代初期の経済改革の中でおそらく最も急進的なものでした。1928年にウラジーミル・レーニンの新経済政策が廃止されて以来初めてこの法律はサービス・製造・対外貿易の各部門で企業の私的所有を認めました。"
    BUL_NEM_Reforms.t:0 "新管理システム？"
    BUL_NEM_Reforms.d:0 "改革を促した具体的な要因は1960年代半ばの「雪解け」期における労働力とエネルギーの不足、そして対外貿易の重要性の高まりでした。その結果1962年の第4次五カ年計画は集約的成長という旧来の目標に一連の新たな手法をもたらす経済改革の時代を開きました。工業では1964年に「新管理制度」が導入され1968年まで続きました。この手法は経済単位を合理化し企業経営者に業績への責任をより強く負わせることを狙ったものでした。"
    CHI_USA_Investment.t:0 "中国への国外投資を促進する？"
    CHI_USA_Investment.d:0 "冷戦期には中国と第三世界との貿易のかなりの部分が無償援助や借款その他の支援によって賄われていました。しかし1976年に毛沢東が死去すると、こうした取り組みは縮小されました。その後発展途上国との貿易は微々たるものとなりましたが、同じ時期に香港と台湾がいずれも主要な貿易相手として台頭し始めました。1970年代末に経済改革が始まって以降、中国は国際貿易体制に組み込まれるべく対外貿易制度の分権化を図ってきました。"
    DAI_USA_Investment.t:0 "ベトナムへの国外投資を促進する？"
    DAI_USA_Investment.d:0 "1990年には民間企業に法的根拠を与える民間企業法が制定され、会社法が株式会社と有限会社を認めました。同年、党は国有企業（SOE）の民営化の可能性を議論し始め、あわせて中華人民共和国との関係正常化も進めました。続く1992年の憲法は民間部門の役割を公式に認めました。対外貿易は国家が中央で統制していましたが、国家はその統制を緩め始めたのです。"
    SOV_USA_Investment.t:0 "ソビエト連邦への国外投資を促進する？"
    SOV_USA_Investment.d:0 "ゴルバチョフは当時のソ連の経済学者たちが大胆と評した施策によって、ソ連の対外経済部門にペレストロイカをもたらしました。その計画はかつて対外貿易省がほとんどの貿易業務に対して握っていた独占を事実上撤廃しました。これにより各工業・農業部門の省庁は貿易省系組織の官僚機構を通じて間接的に動くのではなく、自らの所管分野で直接対外貿易を行えるようになりました。さらに地方・地域の組織や個々の国営企業にも対外貿易が認められました。"
    PRC_LRR_Reforms.t:0 "土地改革運動？"
    PRC_LRR_Reforms.d:0 "土地改革運動は1945年に日中戦争が終結した後の中国内戦末期から建国間もない中華人民共和国にかけて、中国共産党の指導者毛沢東が主導した大衆運動であり、農民への土地の再分配を実現しました。地主——その身分は理論上、労働ではなく搾取から得る収入の割合によって定義されていました——は土地を没収され、中国共産党とかつての小作人による大量殺害の対象となり、死者数は数十万人から数百万人に上ると推定されています。"
    NVM_LRR_Reforms.t:0 "土地改革運動？"
    NVM_LRR_Reforms.d:0 "1953年に土地改革に関する一連の政令と法律が公布されました。ベトナム労働党中央委員会は土地革命の最終段階である農地の再分配へ進む可能性を検討し、これを受けて1953年12月19日に土地改革の綱領かつ前提とも言うべき最重要の土地改革法が公布されました。この法が国会で可決された直後の1953年12月から1954年3月にかけて、タイグエン省で試験的な土地改革が実施されました。その後土地改革は5次にわたる波となってより広い地域へ拡大していきました。"
    SRL_NEM_Reforms.t:0 "スリランカ経済改革？"
    SRL_NEM_Reforms.d:0 "ジュニウス・リチャード・ジャヤワルダナはスリランカの法律家・官僚・政治家であり、1977年から1978年まで首相を、1978年から1989年まで第2代大統領を務めました。スリランカ史における毀誉褒貶の激しい人物ですが、1978年に導入した開放経済体制は、それ以前の閉鎖的な経済政策によって陥っていた経済的混乱から国を救い出しました。"
    PER_NEM_Reforms.t:0 "白色革命？"
    PER_NEM_Reforms.d:0 "白色革命は1963年1月26日にシャーのモハンマド・レザー・パフラヴィーが開始し1979年まで続いた広範な改革であり、イラン帝国に急進的な近代化をもたらしました。この改革によってイランの労働者階級へ大規模な富の再分配が行われ、その後数十年にわたる爆発的な経済成長と急速な都市化、そしてイランの封建的慣習の解体が進みました。"
    european_welfare_state.t:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]の福祉国家？"
    european_welfare_state.d:0 "ヨーロッパの政治経済は1950年代以降、各国で多かれ少なかれ包括的な福祉モデルが発展してきたことに特徴づけられてきました。国家が幅広い社会保障を提供する中心的な役割を担い、その中で最も費用がかかるのが年金・貧困層への支援・公営住宅・医療です。"
    PER_ELR_Reforms.t:0 "イランの経済自由化？"
    PER_ELR_Reforms.d:0 "アリー・アクバル・ハーシェミー・バフラマーニー・ラフサンジャーニーはイランの政治家・著述家であり、1989年から1997年まで第4代イラン大統領を務めました。国内では資本主義的な自由市場を支持して国有産業の民営化を進め、対外的には穏健な立場をとりアメリカや西側との対立を避けようとしました。"
    ISR_ELR_Reforms.t:0 "イスラエルの経済自由化？"
    ISR_ELR_Reforms.d:0 "ラビンはイスラエルの経済に加え教育制度と医療制度にも大きな改革を加えました。その政権は企業の民営化を大幅に推し進め、従来の社会主義的な経済からの脱却を図りました。1993年には「ヨズマ」計画を創設し、イスラエルへ投資する海外のベンチャーキャピタルに手厚い税制優遇を与えたうえで、投資額と同額を政府資金で上乗せすると約束しました。その結果、海外のベンチャーキャピタルは成長するイスラエルのハイテク産業へ多額の資金を投じ、イスラエルの経済成長とハイテク分野における世界的地位の確立に寄与しました。"
    oil_crisis_1973.t:0 "第一次石油危機？"
    oil_crisis_1973.d:0 "1973年10月、アラブ石油輸出国機構（OAPEC）は第四次中東戦争の期間中に一度でもイスラエルを支持した国に対し全面的な石油禁輸を実施すると発表しました。この戦争は1967年の第三次中東戦争でイスラエルに奪われた領土を取り戻そうとしたエジプトとシリアが大規模な奇襲を仕掛けたことで始まりましたが、その企ては最終的に失敗に終わりました。発動された禁輸は石油危機、いわゆる「オイルショック」を引き起こし、世界経済と国際政治の双方に短期的にも長期的にも多くの影響を及ぼしました。"
    oil_crisis_1979.t:0 "第二次石油危機？"
    oil_crisis_1979.d:0 "イラン革命を受けた石油生産の落ち込みは1979年のエネルギー危機を招きました。世界の石油供給の減少はおよそ4％にすぎませんでしたが、石油市場の反応によって原油価格はその後の12か月で急騰し、2倍を超える$39.50 per barrel ($248/m3)まで跳ね上がりました。この急激な値上がりは1973年の石油危機と同様の燃料不足を伴いました。"
    GUA_Land_Reforms.t:0 "布告900号を制定する？"
    GUA_Land_Reforms.d:0 "布告第900号は1952年6月17日、グアテマラ革命の最中に可決されたグアテマラの土地改革法です。この法律はハコボ・アルベンス・グスマン大統領が提出しグアテマラ議会で可決されました。面積90ヘクタール（224エーカー）を超える未利用地を地元の農民に再分配し、地主には政府債で補償するものでした。最大1,700の大農園の土地が国民の6分の1にあたる約50万人へ再分配されました。この立法の目的はグアテマラ経済を擬似封建制から資本主義へ移行させることでした。"
    historical_oil_production.t:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]の石油産業を発展させるか？"
    historical_oil_production.d:0 "[ROOT.GetCountry.GetName]の調査員が国内の一部地域で[GetGoods('oil').GetName]を発見しました。これを受けて[ROOT.GetCountry.GetName]の産業界の指導者たちはこの新たに見つかった資源を活用すべく[concept_government]に[GetBuildingType('building_oil_rig').GetName]の建設を求めています。"
    GBR_brexit.t:0 "ブレグジット？"
    GBR_brexit.d:0 "ブレグジットとはイギリス（UK）の欧州連合（EU）からの離脱です。2016年6月23日にイギリスで行われた国民投票を経て、ブレグジットは2020年1月31日23時（GMT。中央ヨーロッパ時間では2020年2月1日0時）に正式に実現しました。1973年1月1日にEUの前身である欧州共同体（EC）へ加盟したイギリスは、EUから離脱した唯一の加盟国です。ブレグジット後はEU法も欧州連合司法裁判所もイギリスの法律に優越しなくなりました。2018年欧州連合（離脱）法は関連するEU法を国内法として存続させており、イギリスはこれを改正も廃止もできます。"
    JAP_ELR_Reforms.t:0 "アベノミクスを実施するか？"
    JAP_ELR_Reforms.d:0 "アベノミクスとは2012年12月の総選挙以降に日本政府が実施した経済政策を指します。アベノミクスは3本の矢に基づいており、それは日本銀行による金融緩和、政府支出による財政出動、そして構造改革です。エコノミスト誌はこの政策を「20年以上にわたり日本経済を捉えてきた仮死状態から経済を揺り起こすために練られた、リフレ政策と政府支出と成長戦略の組み合わせ」と評しました。アベノミクスという語は安倍（Abe）と経済学（economics）を組み合わせたかばん語です。"
    PHI_ELR_Reforms.t:0 "経済自由化を制定する？"
    PHI_ELR_Reforms.d:0 "フィデル・バルデス・ラモス（CCLH、GCS、KGCR）は、FVRの通称で広く知られるフィリピンの軍人・政治家であり、1992年から1998年まで第12代フィリピン大統領を務めました。政権下でラモスは、かつて閉鎖的だった国民経済を開放し、民間企業を奨励し、国内外からのさらなる投資を呼び込み、汚職を減らすことを目指した経済改革に着手しました。ラモスは政府による空の独占を終わらせ、航空分野を新規参入者に開放したのです。"
    USA_Trade_War_2025.t:0 "トランプの貿易戦争？"
    USA_Trade_War_2025.d:0 "ドナルド・トランプの第2次政権下で導入された関税は、米国における保護主義的な貿易政策が一気に強まったことを示すものでした。トランプ大統領は米国へ輸入されるほぼすべての物品に高率の関税を課すと相次いで発表したのです。物議を醸す「相互関税」の名で呼ばれたこの発表は貿易相手国の報復を招き、株式市場の暴落を引き起こしました。"
    SOV_Kosygin_Reforms_Rollback.t:0 "コスイギン改革の失敗？"
    SOV_Kosygin_Reforms_Rollback.d:0 "1965年のソ連経済改革は、コスイギン改革、あるいはE・G・リーベルマンの名を取ってリーベルマン改革とも呼ばれ、ソ連経済に対して計画された一連の変革でした。その中心にあったのは、企業の成否を測る2つの主要指標として収益性と売上高を導入したことです。この改革の成功は長続きせず、東側ブロック諸国へのモスクワによる改革導入が火種となった1968年のプラハでの事件を経て、改革は縮小へと追い込まれました。"
    SPA_ELR_Reforms.t:0 "経済自由化を受け入れる？"
    SPA_ELR_Reforms.d:0 "1936年から1939年の内戦がもたらした荒廃からの回復は極めて緩やかでしたが、フランシスコ・フランコの後ろ盾を得た経済「テクノクラート」の一団が推進した改革によって「経済の奇跡」が幕を開けました。その多くがオプス・デイの会員であった「テクノクラート」は、旧来のファランヘ党守旧派に取って代わった新しい世代の政治家でした。彼らはアウタルキー（自給自足）政策を放棄して「開発計画」を実行に移し、貿易の自由化と工業の急速な成長を実現しました。"
    SIR_ELR_Reforms.t:0 "経済自由化を受け入れる？"
    SIR_ELR_Reforms.d:0 "「ケルトの虎」とは1990年代半ばから2000年代後半にかけてのアイルランド経済を指す言葉であり、海外直接投資に支えられた実質経済の急成長期を意味します。歴史家R・F・フォスターは、その要因を新たな進取の気風とインテルをはじめとするアメリカ企業の進出が重なったことに求めています。彼が主因として挙げるのは、低い税率、企業寄りの規制政策、そして若く技術に明るい労働力です。多くの多国籍企業にとって、アイルランドで事業を営むという決断は産業開発庁の手厚い優遇措置によっていっそう容易なものとなりました。"
    XEU_EE_Expansion_2004.t:0 "欧州連合に加盟するか？"
    XEU_EE_Expansion_2004.d:0 "加盟国数と人口の規模において欧州連合（EU）史上最大となる拡大は、2004年5月1日に実現しました。2004年には加盟が叶わなかったブルガリアとルーマニアの2007年の加盟も同じ拡大の波に属するものであり、欧州委員会によれば第5次拡大の一部を構成します。"
    GBR_ELR_Reforms.t:0 "ビッグバンを起こすか？"
    GBR_ELR_Reforms.d:0 "マーガレット・サッチャー率いる1980年代の保守党政権は、マネタリズム、とりわけ金融部門（たとえば1986年のビッグバン）と労働市場における規制緩和、国有企業の売却（民営化）、そしてその他の企業への補助金打ち切りという急進的な政策に着手しました。"
    BRU_SGP_Reforms.t:0 "ブルネイ・シンガポール経済連携を結ぶか？"
    BRU_SGP_Reforms.d:0 "シンガポールとブルネイは信頼と相互尊重に根ざした類を見ないほど深い経済的・戦略的パートナーシップで結ばれています。両国の通貨交換協定、防衛協力、そして金融・エネルギー・教育分野の共同事業は、その永続的な結び付きを物語っています。"
    PER_Oil_Nationalisation_1951.t:0 "イラン石油産業を国有化する？"
    PER_Oil_Nationalisation_1951.d:0 "1951年、モハンマド・モサッデクの率いるイラン議会はアングロ・イラニアン石油会社の国有化を可決しました。この大胆な一手はイラン石油に対するイギリスの支配を終わらせ、イラン国営石油会社が誕生します。しかしイギリスとアメリカを中心に激しい国際的反発を招きました。"
    GCC_Union.t:0 "湾岸協力会議？"
    GCC_Union_1.t:0 "湾岸協力会議を拡大する？"
    GCC_Union_2.t:0 "湾岸協力会議に加盟する？"
    GCC_Union.d:0 "湾岸アラブ諸国協力会議、通称湾岸協力会議は、バーレーン、クウェート、オマーン、カタール、サウジアラビア、アラブ首長国連邦からなる地域的な政府間の政治・経済連合であり軍事同盟でもあります。本部はサウジアラビアの首都リヤドに置かれています。GCC憲章は1981年5月25日に署名され、この機構が正式に発足しました。"
    Eurasian_Economic_Community.t:0 "ユーラシア経済共同体？"
    Eurasian_Economic_Community.d:0 "ユーラシア経済共同体（EAECまたはEurAsEC）は加盟国の経済統合を目指した地域機構で、2000年から2014年まで存在しました。その源流は1996年3月29日の独立国家共同体（CIS）にあり、2000年10月10日にカザフスタンの首都アスタナでユーラシア経済共同体設立条約が署名されました。"
    Eurasian_Single_Market.t:0 "ユーラシア関税同盟？"
    Eurasian_Single_Market.d:0 "ユーラシア関税同盟は、ユーラシア経済連合（EAEU）の加盟国であるアルメニア、ベラルーシ、カザフスタン、キルギス、ロシアによる関税同盟です。同盟内における物品の自由な移動と、域外から流入する物品への共通対外関税を定めています。"
    Mercosur_Economic_Community.t:0 "アスンシオン条約？"
    Mercosur_Economic_Community.d:0 "1991年3月26日にアルゼンチン、ブラジル、パラグアイ、ウルグアイが署名したアスンシオン条約は、共同市場の設立を目指してメルコスールを創設しました。オウロプレト条約によって補完され、法的な承認を得ています。関税の段階的な撤廃を定め、1994年までの自由貿易圏の実現を目標としました。"
    Mercosur_Single_Market.t:0 "オウロプレト議定書？"
    Mercosur_Single_Market.d:0 "1994年のオウロプレト議定書は、その4年前にメルコスール原加盟4か国であるアルゼンチン、ブラジル、パラグアイ、ウルグアイがアスンシオン条約で定めた経済政策を引き継ぎ、関税同盟を築くものでした。これによりメルコスールは国際的な関税同盟として正式に確立されました。"
    Andean_Economic_Community.t:0 "アンデス自由貿易圏？"
    Andean_Economic_Community.d:0 "カルタヘナ協定のもとで設立されたアンデス自由貿易圏は1993年1月1日に全面的に発足し、ボリビア、コロンビア、エクアドル、ベネズエラを無関税の通商で結びつけました。これは地域統合に向けた決定的な一歩であり、のちにアンデス共同体（CAN）へと発展し、1997年にはペルーが復帰しました。"
    SACU_Single_Market.t:0 "南部アフリカ関税同盟？"
    SACU_Single_Market.d:0 "1910年に成立した南部アフリカ関税同盟（SACU）は世界最古の関税同盟であり、ボツワナ、エスワティニ、レソト、ナミビア、南アフリカを結んでいます。加盟国に共通の対外関税と物品の自由な移動を定め、関税収入は一括して集められたうえで分配されます。SACUは南部アフリカにおける地域経済協力の礎であり、南アフリカの圧倒的な経済力と公平な分配の仕組みとの均衡を図っています。"
    EAC_Single_Market.t:0 "東アフリカ共同体関税同盟？"
    EAC_Single_Market.d:0 "2000年に再興された東アフリカ共同体（EAC）は、ブルンジ、ケニア、ルワンダ、南スーダン、タンザニア、ウガンダ、コンゴ民主共和国を束ねる地域ブロックです。その単一市場構想は、加盟国間で物品、サービス、資本、人の自由な移動を実現し、貿易政策を調和させ、より深い統合を促すことを目指しています。EACはアフリカで最も野心的な経済統合と共同発展の試みの一つです。"
    CEMAC_Economic_Community.t:0 "ブラザヴィル条約とは？"
    CEMAC_Economic_Community.d:0 "中部アフリカ関税経済同盟（UDEAC）は1964年12月8日に調印されたブラザヴィル条約によって創設され、1966年1月1日に発効しました。カメルーン、中央アフリカ共和国、チャド、コンゴ共和国、ガボンが結集し、1985年には赤道ギニアも加わりました。UDEACは加盟国間の自由貿易と共通対外関税を確立し、より深い地域統合の基礎を築きました。"
    CEMAC_Single_Market.t:0 "CEMAC条約とは？"
    CEMAC_Single_Market.d:0 "中部アフリカ経済通貨共同体（CEMAC）は1994年1月16日にチャドのンジャメナで条約により設立され、中部アフリカ関税経済同盟（UDEAC）を引き継ぎました。カメルーン、中央アフリカ共和国、チャド、コンゴ共和国、赤道ギニア、ガボンを関税同盟と通貨同盟の双方で結びつけるものです。CEMACは共通対外関税と加盟国間の物品の自由移動、そして中部アフリカ諸国銀行が管理する共通通貨・中央アフリカCFAフランを導入しました。"
    WAEMU_Single_Market.t:0 "ダカール条約とは？"
    WAEMU_Single_Market.d:0 "西アフリカ経済通貨同盟（WAEMU、フランス語ではUEMOA）は1994年1月10日にセネガルのダカールで条約により設立されました。ベナン、ブルキナファソ、コートジボワール、マリ、ニジェール、セネガル、トーゴが結集し、1997年にはギニアビサウも加わりました。WAEMUは共通対外関税と物品の自由移動を伴う関税同盟に加え、西アフリカ諸国中央銀行（BCEAO）が管理する共通通貨・西アフリカCFAフランに基づく通貨同盟を創設しました。"
    CACM_Economic_Community.t:0 "テグシガルパ議定書とは？"
    CACM_Economic_Community.d:0 "1991年のテグシガルパ議定書によって設立された中米統合機構（SICA）は、政治・経済・社会・環境における協力の枠組みのもとに中米諸国を結びつけています。域内の関税や安全保障、開発政策を調整し、民主主義の強化と統合の促進、そして地域全体の持続可能な成長を目指しています。"
    CHI_Hainan_SAR.t:0 "海南自由貿易港とは？"
    CHI_Hainan_SAR.d:0 "海南自由貿易港は中国海南省に設けられた自由貿易港です。離島である海南は中華人民共和国（PRC）最大の経済特区でもあります。中国が経済改革を全面的に深化させ、最高水準の対外開放政策を試みる特別な地域と位置づけられています。海南自由貿易港は通常の意味での港ではなく、海南島全体が特別な経済開発区域とみなされています。"
    CHI_One_Child_Policy_1980.t:0 "一人っ子政策？"
    CHI_One_Child_Policy_1980.d:0 "一人っ子政策は1979年から2015年まで中国で実施された人口抑制政策であり、多くの家庭に子どもを1人までと制限することで人口増加を抑えようとするものでした。この政策は社会・文化・経済・人口動態に広範な影響を及ぼしましたが、一人っ子制限が人口抑制策全体にどれだけ寄与したかについては議論があります。出生率低下における有効性も、人権の観点からの正当性も論争の的となっています。"
    MLD_HND_Reforms.t:0 "インド・モルディブ二国間貿易協定？"
    MLD_HND_Reforms.d:0 "1981年に締結された二国間貿易協定により、両国は互いに最恵国待遇を与えることで合意しました。この協定の規定に基づき、インドは自国では輸入禁止・制限品目に該当しうる特定の物資をモルディブへ供給し続けています。米・小麦粉・砂糖・ジャガイモ・タマネギ・卵・野菜といった主要品目や、川砂・建設資材などの物資の大半がインドから輸入されている点は見逃せず、この分野で成長を続けるインドの投資家にとってモルディブはますます魅力的な市場となっています。"
    PHI_First_Policy.t:0 "フィリピン人優先政策？"
    PHI_First_Policy.d:0 "「フィリピン人第一主義」とは、当時のフィリピン大統領カルロス・P・ガルシアの政権が初めて導入し実施した保護主義的かつ経済ナショナリズム的な政策です。この政策の下ではフィリピン人が所有する企業が外国企業よりも優先され、フィリピン人によるフィリピン製品の愛用も奨励されました。ガルシアは1958年8月28日に国家経済評議会決議第202号を発し、この政策を初めて制度化しました。"
    NAU_guano_island_delete_2000.t:0 "ナウルのリン鉱石埋蔵量が枯渇"
    NAU_guano_island_delete_2000.d:0 "ナウルの主要な高品位リン鉱石の埋蔵量は2000年代初頭（2000年～2005年頃）までに事実上枯渇しましたが、低品位の二次採掘は小規模ながら続いています。"
    
    GBR_IRE_customs_union_special.tt:0 "ウィンザー枠組みを実施する ― #y $NIR$#!と[ROOT.GetCountry.GetName]の間に国内関税境界を設け、[SCOPE.sCountry('SIR_scope').GetName]と#y $NIR$#!の間に[concept_customs_union]を形成する"
    
    western_economic_liberalisation.t:0 "経済自由化？"
    western_economic_liberalisation.d:0 "新自由主義は、第二次世界大戦後に衰退した自由市場資本主義と結び付けられる思想です。保守派や右派リバタリアンの団体・政党・シンクタンクの台頭を支えた主要な要因であり、主にそれらによって唱えられてきました。一般には民営化、規制緩和、グローバル化、自由貿易、マネタリズム、緊縮財政、そして経済と社会における民間部門の役割を高めるための政府支出の削減といった経済自由化政策と結び付けられています。"
    western_economic_liberalisation.f:0 "このイベントにより[ROOT.GetCountry.GetAdjectiveNoFlag]の経済における自由市場の水準が1段階上昇します。"
    historical_economy_western.option.1:0 "自由市場の影響力をさらに広げよう！"
    historical_economy_western.option.2:0 "今あるもので十分だ。"
    
