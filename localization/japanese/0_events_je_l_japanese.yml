    american_puerto_rico.sgc.t:0 "プエルトリコ自治連邦区？"
    american_puerto_rico.sgc.d:0 "アメリカ政府は1950年のプエルトリコ連邦関係法により、プエルトリコが独自の憲法を起草することを認めました。制憲議会は1951年から1952年にかけて数か月にわたり開かれ、その間に憲法の草案が書き上げられました。法が起草者に課した基本的な要件はわずか2つで、共和制の統治形態と権利章典を盛り込むことだけでした。"
    american_NMI.sgc.t:0 "北マリアナ諸島自治連邦区？"
    american_NMI.sgc.d:0 "第二次世界大戦で日本が敗れた後、北マリアナ諸島は安全保障理事会決議21に基づき、国連の太平洋諸島信託統治領の一部としてアメリカの施政下に置かれました。この決議は施政権者であるアメリカに防衛と外交の責任を委ねるものでした。北マリアナ諸島の人々は1970年代に独立を求めず、アメリカとのより緊密な結びつきを築く道を選びます。自治連邦区としての地位を巡る交渉は1972年に始まり、アメリカとの政治的統合のもとで自治連邦区を設ける盟約が1975年の住民投票で承認されました。新たな政府と憲法は1978年1月9日にその一部が発効しています。"
    american_ESM.sgc.t:0 "アメリカ領サモアの自治？"
    american_ESM.sgc.d:0 "1900年と1904年に割譲証書が調印されて以来、サモア人はアメリカの制度へこれ以上組み込まれることを避けてきました。1949年に内務省は組織法によってアメリカ領サモアを編入領域としようと動きます。編入がサモアの文化と伝統的な土地所有を損ないかねないと恐れたサモアのマタイたちが介入し、連邦議会は編入を取りやめました。代わりにサモアは在来の統治制度に基づく独自の政府、サモア・フォノを創設します。以来サモア人は連邦地方裁判所の設置を拒み、出生地主義による市民権も退け、独自の移民制度を持つ唯一のアメリカ領であり続けています。"
    
    american_decolonisation.option.1:0 "植民地の自治を認める"
    american_decolonisation.option.2:0 "奴らに自治を与える資格などない"
    
    american_west_germany.indy.t:0 "西ドイツの独立？"
    american_west_germany.indy.d:0 "ボン＝パリ諸条約は1952年5月に調印され、1955年の批准を経て発効しました。これらの条約により連合国による西ドイツ占領は終結しました。"
    american_japan.indy.t:0 "サンフランシスコ講和条約？"
    american_japan.indy.d:0 "サンフランシスコ講和条約は法的な戦争状態を終わらせ、第二次世界大戦までの敵対行為への賠償を定めることで、国際連合を代表する連合国と日本との平和的な関係を回復しました。同日に調印された安全保障条約とともに、1951年のこの条約は日本と合衆国の関係および国際社会における日本の役割を規定するサンフランシスコ体制の始まりを画すものです。"
    american_japan.indy_2.t:0 "日米安全保障条約？"
    american_japan.indy_2.d:0 "1960年の条約は日米の安全保障の取り決めを両国のより対等な関係へと大きく改定しました。1951年の旧条約には日本との事前協議なしに在日米軍を東アジア全域で運用できる規定があり、日本が攻撃された場合に防衛するという明確な約束は無く、日本国内の争乱に米軍が介入できる条項まで含まれていました。これらの部分は1960年の改定で改められました。改定条約には相互の防衛義務を定め、合衆国が兵力を動員する前に日本へ事前に通報するよう求める条項が盛り込まれました。日本の内政への合衆国の干渉を認める条項も削除されました。"
    plaza_accords_USA.t:0 "プラザ合意？"
    plaza_accords_USA.d:0 "プラザ合意は1985年9月22日にニューヨークのプラザホテルでフランス・西ドイツ・日本・イギリス・合衆国の間で調印された共同協定であり、為替市場への介入によって米ドルをフランス・フラン、ドイツ・マルク、日本円、英ポンドに対して切り下げるものでした。"
    american_micronesia.indy.t:0 "ミクロネシアの独立？"
    american_micronesia.indy.d:0 "$generic_independence_decolonisation_loc_desc$"
    american_iraq.indy.t:0 "イラクからの撤退？"
    american_iraq.indy.d:0 "イラク戦争が2003年の侵攻から10年近い占領へと長期化するにつれ、アメリカの世論は撤兵を支持する方向へ傾いていきました。米軍のイラクからの撤退は2007年の増派終了に伴って同年12月に始まり、2011年12月までにほぼ完了してイラク戦争は終結しました。イラクからの米軍撤退は2000年代の大半を通じてアメリカ国内で論争の的となっていました。"
    american_afghanistan.indy.t:0 "アフガニスタンからの撤退？"
    american_afghanistan.indy.d:0 "2021年8月、アメリカはアフガニスタンから最後の部隊を撤退させ、20年近くに及ぶ軍事的展開に終止符を打ちました。米軍の撤退はタリバンによる国土の再掌握を招き、多くのアフガニスタン人が国外へ逃れる難民危機を引き起こしました。"
    american_germany.indy.t:0 "主権国家ドイツ？"
    american_germany.indy.d:0 "ドイツに関する最終規定条約は、1990年代初頭のドイツ再統一を可能にした国際協定です。1990年に「2つのドイツ」であるドイツ連邦共和国とドイツ民主共和国に加え、ヨーロッパにおける第二次世界大戦終結時にドイツを占領していた4カ国、すなわちフランス・ソビエト連邦・イギリス・アメリカとの間で交渉されました。この条約は1945年のポツダム協定に取って代わるもので、4カ国はドイツに対して有していたすべての権利を放棄し、翌年の完全な主権国家としての再統一に道を開きました。"
    american_italy.indy.t:0 "パリ条約？"
    american_italy.indy.d:0 "イタリアと連合国との間のパリ条約は1947年2月10日に調印され、両者の戦争状態を正式に終結させました。条約は1947年9月15日に全面的に発効しました。"
    american_south_korea.indy.t:0 "韓国の独立？"
    american_south_korea.indy.d:0 "大韓民国第一共和国は1948年8月から1960年4月までの韓国の政府です。第一共和国は1945年の日本統治終結以降に韓国を統治してきた在朝鮮アメリカ陸軍軍政庁からの権限移譲を経て1948年8月15日に成立し、朝鮮における最初の独立した共和制政府となりました。"
    american_FRG.indy.t:0 "ドイツ連邦共和国？"
    american_FRG.indy.d:0 "西側連合国は西ドイツの当局者へ次第に大きな権限を委ね、自らの占領地区に中央経済評議会を設けて将来のドイツ政府の中核を築こうとしました。この計画はのちに西ドイツ制憲議会の設置、連合国とドイツ当局の関係を定める占領規約、そしてフランス占領地区と英米占領地区の政治的・経済的統合を定めました。1949年5月23日、ドイツ連邦共和国の憲法である基本法（Grundgesetz）が公布されました。"
    american_philippines.indy.t:0 "マニラ条約？"
    american_philippines.indy.d:0 "1946年のマニラ条約は正式には一般関係条約および議定書と呼ばれ、フィリピンの首都マニラで1946年7月4日に署名された一般関係に関する条約です。これによりアメリカはフィリピンに対する主権を放棄し、フィリピン共和国の独立を承認しました。"
    american_iceland.indy.t:0 "ケフラヴィーク協定？"
    american_iceland.indy.d:0 "ケフラヴィーク協定は第二次世界大戦の終結を受けて1946年にアメリカ合衆国政府と新たに成立したアイスランド共和国との間で結ばれた協定です。この協定はアメリカ軍が6か月以内に国外へ撤退し、アイスランド側がケフラヴィーク空港を引き継ぐことを定めていました。"
    american_iceland_2.indy.t:0 "アイスランド防衛隊を撤収させるか？"
    american_iceland_2.indy.d:0 "2006年3月15日、駐アイスランドアメリカ大使キャロル・ヴァン・ヴォーストはアメリカ合衆国がアイスランド防衛隊を2006年9月末までに撤収させる決定を発表しました。9月30日、アメリカ軍は最後の空軍戦闘機4機と救難ヘリコプター飛行隊をケフラヴィークから撤退させました。"
    american_south_vietnam.indy.t:0 "南ベトナムからのアメリカ軍撤退？"
    american_south_vietnam.indy.d:0 "新たに大統領へ選出されたリチャード・M・ニクソンは1969年、紛争を終わらせアメリカとその同盟国である南ベトナムのために「名誉ある平和」を確保するべく、ベトナム戦争へのアメリカの関与を継続すると宣言しました。その要点は次の通りです。全当事者は協定調印の24時間後に現地で停戦を開始する。アメリカ軍とすべての外国軍は協定調印から60日以内に南ベトナムから撤退する。アメリカ人捕虜はアメリカ軍および外国軍の撤退と同時に解放される。そして南部の政治的将来を決める自由で民主的な選挙を実施・監督するため、民族和解和合全国評議会を設置する。"
    american_palau.indy.t:0 "パラオの独立？"
    american_palau.indy.d:0 "パラオは他の太平洋諸島とともに1947年にアメリカが統治する太平洋諸島信託統治領の一部とされました。1978年の住民投票でミクロネシア連邦への加入を否決したこの島々は、1994年にアメリカとの自由連合盟約のもとで完全な主権を獲得しました。"
    
    american_decolonisation_indy.option.1:0 "独立を認める"
