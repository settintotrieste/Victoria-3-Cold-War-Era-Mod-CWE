    je_non_aligned_movement:0 "非同盟運動"
    je_non_aligned_movement_reason:0 "[ROOT.GetCountry.GetName]は非同盟運動の加盟国です。\n\n非同盟運動（NAM）は冷戦期にいずれの主要な陣営にも正式に与せず敵対もしなかった[GetPlayer.MakeScope.Var('NAM_member_count').GetValue]か国による会議体です。\n\nこの運動は朝鮮戦争の後に生まれました。冷戦期には二大国がそれぞれ陣営を形成し残りの国々を自らの勢力圏に引き込む政策に乗り出したため世界の二極化が急速に進みました。一部の国々はこれに対抗しようとしてこの運動を始めたのです。"
    je_non_aligned_movement_status:0 "総加盟国数：[GetPlayer.MakeScope.Var('NAM_member_count').GetValue]"
    non_aligned_movement_member:0 "非同盟運動加盟国"
    
    cold_war_is_over.tt:0 "冷戦が終結している"
    
    je_corruption_system:0 "[ROOT.GetCountry.GetNameNoFlag]の汚職"
    je_corruption_system_reason:0 "[concept_corruption]とは、政府高官やその人脈が不正な私的利益のために権力を行使することです。汚職の形態は様々ですが、贈収賄、ロビー活動、恐喝、縁故主義、身内びいき、地域偏重、情実人事、口利き、不正利得、横領などが含まれます。\n\n[ROOT.GetCountry.GetAdjective][concept_government]には汚職が存在するため、この問題を取り除くにはより強力な$lawgroup_corruption_policy$を制定する必要があります。\n\nしかし@armed_forces!$ig_armed_forces$と@intelligentsia!$ig_intelligentsia$は国内の汚職を減らす試みにことごとく反対するため、より強力な$lawgroup_corruption_policy$の制定を試みている間は、これらの[Concept('concept_interest_group', '$concept_interest_groups$')]を支持する人々の急進性が高まります。"
    
    very_high_corruption:0 "非常に高水準の[concept_corruption]"
    high_corruption:0 "高水準の[concept_corruption]"
    medium_corruption:0 "中程度の[concept_corruption]"
    low_corruption:0 "低水準の[concept_corruption]"
    very_low_corruption:0 "非常に低水準の[concept_corruption]"
    
    add_nuclear_fallout.t:0 "放射性降下物"
    add_nuclear_fallout.d:0 "近隣国への核攻撃による放射性降下物が[ROOT.GetCountry.GetName]に拡散しました。科学者の推定によれば、放射性降下物は被害を受けた州に隣接する州の放射能が消えるまで消散しません。"
    add_nuclear_fallout.f:0 "我々が核兵器による被害を受けた[Concept('concept_state', '$concept_states$')]に隣接する[Concept('concept_state', '$concept_states$')]を保有しているため、このイベントが発生しました。"
    add_nuclear_fallout.option:0 "まずいことになった…"
    
    remove_nuclear_fallout.t:0 "放射性降下物の消散"
    remove_nuclear_fallout.d:0 "[ROOT.GetCountry.GetName]の一部の[Concept('concept_state', '$concept_states$')]で放射性降下物が消散しました。"
    remove_nuclear_fallout.f:0 "放射性降下物のある[Concept('concept_state', '$concept_states$')]が核兵器による被害を受けた[Concept('concept_state', '$concept_states$')]に隣接しなくなったため、このイベントが発生しました。"
    remove_nuclear_fallout.option:0 "ようやくだ！"
    
