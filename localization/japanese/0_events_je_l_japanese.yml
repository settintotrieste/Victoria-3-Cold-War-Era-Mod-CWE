    diplomatic_neutrality_violated.t:0 "[SCOPE.sCountry('neutrality_violated_country').GetAdjective]の中立性侵害"
    diplomatic_neutrality_violated.d:0 "[SCOPE.sCountry('neutrality_violated_country').GetName]の外交的中立が侵略国によって侵害されました。この国際法への明白な違反を受けて国際連合は有志連合の結成を呼びかけ[SCOPE.sCountry('neutrality_violated_country').GetName]の戦争を軍事的に支援するよう求めました。"
