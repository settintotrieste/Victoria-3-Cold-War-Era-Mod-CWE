    cabinet_minister_resigns.t:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('cabinet_name_custom_title')]のメンバーが辞任！"
    cabinet_minister_resigns.d:0 "[SCOPE.gsInterestGroup('angry_cabinet_ig').GetName]の[SCOPE.gsInterestGroup('angry_cabinet_ig').GetLeader.GetFullName]は[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')][ROOT.GetCountry.GetRuler.GetFullName]との根本的かつ和解しがたい意見の相違を理由に[SCOPE.GetRootScope.GetCountry.GetCustom('cabinet_name_custom_title')]を辞任しました。これにより[concept_government]は政治的な打撃を受けました。"
    cabinet_minister_resigns.f:0 "このイベントは$cabinet_minister_ig$である[SCOPE.gsInterestGroup('angry_cabinet_ig').GetName]が現在制定中の[concept_law]に強く反対しているか、[concept_government]に対する[concept_approval]が不満または怒りであるために発生しました。"
    cabinet_system_option:0 "[SCOPE.gsInterestGroup('angry_cabinet_ig').GetLeader.GetFirstName]など大したものではなかった！"
    
