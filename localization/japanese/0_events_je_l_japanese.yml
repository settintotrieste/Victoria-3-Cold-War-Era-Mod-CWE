    je_cabinet:0 "[ROOT.GetCountry.GetRuler.GetLastName][SCOPE.GetRootScope.GetCountry.GetCustom('cabinet_name_custom_title')]"
    je_cabinet_reason:0 "$RULING_PARTY_IDEOLOGY_cabinet_JE$\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('cabinet_name_custom_title')]は国家元首に助言する機関であり、その構成員は政府各省の長も務めます。構成員は[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]によって任命されます。\n\n[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]はキャラクターインタラクションで指導者に閣僚職を与えることにより、任意の[concept_government][concept_interest_group]を[SCOPE.GetRootScope.GetCountry.GetCustom('cabinet_name_custom_title')]へ招くことができます。$cabinet_minister_ig$を持つ[concept_government][concept_interest_group]はすべて[SCOPE.GetRootScope.GetCountry.GetCustom('cabinet_name_custom_title')]の一員となります。\n\n#BOLD 内閣結束度：#!#BOLD [SCOPE.GetRootScope.GetCountry.GetCustom('cabinet_unity_level_custom_title')]（[GetPlayer.MakeScope.Var('cabinet_unity_var').GetValue]％）#!\n\n@information!内閣結束度は、[concept_official_character]の職に就くすべての[Concept('concept_character', '$concept_characters$')]の[concept_character][concept_loyalty]の合計を、国内のそうした[Concept('concept_character', '$concept_characters$')]の総数で割って算出されます。"
    je_cabinet_status:0 "[concept_cabinet_unity]：[GetPlayer.MakeScope.Var('cabinet_unity_var').GetValue]％\n[concept_cabinet_incompetence]：[GetPlayer.MakeScope.Var('cabinet_incompetence_var').GetValue]％"
    
    concept_cabinet_unity:0 "内閣結束度"
    concept_cabinet_unity_desc:0 "内閣結束度は、閣僚職または主要な国家要職に就いているすべての[Concept('concept_character', '$concept_characters$')]の[concept_loyalty]の平均値です。"
    
    concept_cabinet_incompetence:0 "内閣無能度"
    concept_cabinet_incompetence_desc:0 "内閣無能度は、内閣または主要な国家公職に就いている[concept_character]のうち、次の[Concept('concept_character_trait','$concept_character_traits$')]のいずれかを持つ者がいると上昇します：\n\n• $alcoholic$ \n• $opium_addiction$ \n• $cocaine_addiction$ \n• $grifter$ \n• $senile$ \n• $reckless$ \n• $bandit$ \n• $political_appointee$ \n• $inept$ \n• $inexperienced$ \n• $social_bandit$"
    
    je_issue_executive_order_button:0 "行政命令を発する"
    je_issue_executive_order_button_desc:0 "行政命令により[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]で#y 過半数#!を確保する必要を回避し[concept_legitimacy]を増加させられます。"
    
    je_issue_royal_decree_button:0 "勅令を発する"
    je_issue_royal_decree_button_desc:0 "[concept_monarch_character]は#y 勅令#!を発し、[concept_government]と[concept_opposition]に対し対立を棚上げして挙国一致内閣を樹立するよう求めることができます。この王権による介入により、思想的に隔たりのある[Concept('concept_interest_group', '$concept_interest_groups$')]同士でも政権を組みやすくなります。"
    
    je_call_elections_button:0 "選挙を実施する"
    je_call_elections_button_desc:0 "[ROOT.GetCountry.GetName]の議院内閣制の下では、[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]はいつでも議会を解散して[concept_election]を実施できます。"
    je_enact_state_of_emergency_button:0 "非常事態を宣言する"
    je_enact_state_of_emergency_button_desc:0 "[concept_government]は非常事態を宣言し、[SCOPE.GetRootScope.GetCountry.GetCustom('legislature_name')]の同意なしに[Concept('concept_law','$concept_laws$')]を[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')]できるようにします。"
    je_lift_state_of_emergency_button:0 "非常事態を解除する"
