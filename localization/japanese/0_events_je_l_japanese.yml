    je_generic_decolonisation_system:0 "植民地の分離独立運動"
    je_generic_decolonisation_system_reason:0 "[ROOT.GetCountry.GetName]は[concept_homeland]を持たない[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]を所有しています。こうした帝国主義的な行為はかつて国際的に認められていましたが、第二次世界大戦後には支持を失いました。それどころか国際社会は今や、我々が植民地帝国を解体し従属民に民族自決を認めるよう要求しています。さらに悪いことに[ROOT.GetCountry.GetAdjective]の植民地に暮らす現地の人々も不穏な空気に包まれており、その多くが独立を求め、一部は植民地当局に暴力的な攻撃さえ加えています。"
    
