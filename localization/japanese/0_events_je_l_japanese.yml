    je_colonial_empire:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('imperial_conference_custom_adjective')]会議"
    je_colonial_empire_reason:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('imperial_conference_custom_adjective')]会議は[ROOT.GetCountry.GetAdjectiveNoFlag]帝国の自治植民地および自治領の政府首脳が定期的に集う会合です。会議はすべて帝国の中枢である[ROOT.GetCountry.GetName]で開かれます。\n\nこの会議を通じて[concept_dominion]と[ROOT.GetCountry.GetName]の貿易統合の度合いを決定できます。\n\nまた会議を通じて全植民地に防衛戦争への支援を呼びかけることもできます。"
