    italian_SUT.indy.t:0 "南チロル問題"
    italian_SUT.indy.d:0 "南チロル問題（Südtirolfrage）は国際問題へと発展しました。この問題は1971年に新たな墺伊条約が署名・批准されたことで決着します。条約は南チロルをめぐる紛争をハーグの国際司法裁判所に付託して解決すること、同州がイタリア国内でより大きな自治を得ること、そしてオーストリアが南チロルの内政に干渉しないことを定めました。この新たな取り決めは関係各国にとっておおむね満足のいくもので、分離主義による緊張はほどなく和らぎました。1972年に認められた自治権は相当な水準の自治をもたらし、徴収された税のほぼ90％を手元に残すことも可能としています。"
    
    italian_decolonisation_indy.option.1:0 "自治を認める"
    italian_decolonisation_indy.option.2:0 "彼らに自由を得る資格は無い"
    
    united_libya.t:0 "リビアによる併合？"
    united_libya.d:0 "トリポリタニアとキレナイカはイギリスの統治下に留まり、フェザーンはフランスが支配しました。1944年にイドリースはカイロでの亡命生活から帰還しましたが、外国による統制の一部が撤廃される1947年まではキレナイカへの定住再開を拒みました。同盟国との1947年の講和条約の条項により、トリポリタニアの植民地維持を望んだイタリアとフェザーンを求めたフランスは、リビアに対するあらゆる請求権を放棄しました。こうしてリビアは統一を保ったのです。"
    united_arab_republic.t:0 "アラブ連合共和国を結成する？"
    united_arab_republic.d:0 "アラブ連合共和国は1958年から1971年まで中東に存在した主権国家です。当初はエジプト（占領下のガザ地区を含む）とシリアによる政治的連合でしたが、1961年のシリア・クーデターの後にシリアが連合から離脱しました。エジプトはその後も公式にはアラブ連合共和国を名乗り続け、1971年9月にアンワル・サダトによって正式に解消されました。"
    hashemite_arab_federation.t:0 "ハーシム家アラブ連邦を結成する？"
    hashemite_arab_federation.d:0 "ハーシム家アラブ連邦は1958年にハーシム家イラク王国とヨルダン王国の合邦によって成立した短命の国家です。名称は連邦制を示唆していますが、実質的には国家連合でした。"
    RUS_BYE_union.t:0 "ロシア・ベラルーシ連合国家？"
    RUS_BYE_union.d:0 "ロシア・ベラルーシ連合国家はベラルーシとロシアからなる超国家連合であり、経済政策と防衛政策の統合を通じて両国の関係を深化させることを目的として掲げています。当初、連合国家は国家連合の創設を目指していましたが、現在も両国はそれぞれ独立を維持しています。"
    SEN_GAM_union.t:0 "セネガンビア国家連合？"
    SEN_GAM_union.d:0 "セネガンビアは正式にはセネガンビア国家連合と呼ばれ、20世紀後半に西アフリカのセネガルと、周囲をほぼ完全にセネガルに囲まれた隣国ガンビアとの間で結ばれた緩やかな国家連合でした。"
    KAS_HND_union.t:0 "ジャンムー・カシミールのインドへの帰属？"
    KAS_HND_union.d:0 "1947年インド独立法の規定に基づき、藩王ハリ・シンは帰属文書に調印し、自らの藩王国をインド自治領へ帰属させることに同意しました。"
    NET_IDO_union.t:0 "オランダ・インドネシア連合？"
    NET_IDO_union.d:0 "オランダ・インドネシア連合は1949年から1956年まで存在したオランダとインドネシアの国家連合的な結び付きです。1949年に合意されたこの枠組みは、独立を認めた後も旧植民地のオランダ領東インド（現在のインドネシア）を、少なくとも同君連合という形で国家連合的にオランダへつなぎとめようとするオランダ側の試みでした。"
    MLT_GBR_union.t:0 "マルタ・イギリス統合住民投票"
    MLT_GBR_union.d:0 "1956年2月11日と12日、マルタでイギリスとの統合の是非を問う住民投票が行われました。投票率は59％にとどまり、投票した者の77％が提案を承認しました。投票率が低かったのは国民党がボイコットを呼びかけたことも一因です。提案が完全に実施されることはなく、8年後にマルタはイギリス連邦内の独立した王国「マルタ国」となりました。"
    FRA_GBR_union.t:0 "英仏連合？"
    FRA_GBR_union.d:0 "1956年9月、スエズ危機で共通の敵を前にして英仏合同機動部隊が編成されました。フランス首相ギー・モレは、エリザベス2世を元首とし市民権を共通とするイギリスとフランス連合の合同を提案しました。代案としてモレはフランスの英連邦加盟も提示しました。イギリス首相アンソニー・イーデンは両案とも拒否し、フランスは欧州経済共同体を設立するローマ条約へ進むことになりました。"
    YUG_BUL_union.t:0 "バルカン連邦？"
    YUG_BUL_union.d:0 "ブレド協定は1947年8月1日ユーゴスラビア連邦人民共和国スロベニア人民共和国のブレドにおいてゲオルギ・ディミトロフとヨシップ・ブロズ・チトーによって署名され、新たなバルカン連邦のもとでのブルガリアとユーゴスラビアの将来的な統一への道を開きました。この協定に基づく政策は1948年6月のチトー・スターリン決裂の後に覆されます。ブルガリアはチトーが構想したようなユーゴスラビアの第7の共和国となることを望まず、ソビエト連邦の利益に結びついていたため、ユーゴスラビアに反対する立場を取りました。コミンフォルムによる対ユーゴスラビア攻撃がユーゴスラビア共産党指導部を切り離すと、ブルガリア政府は1949年10月1日ブレドで結ばれた友好協力相互援助条約をその一切の取り決めもろとも破棄しました。"
    LBY_EGY_union.t:0 "アラブ共和国連邦？"
    LBY_EGY_union.d:0 "アラブ共和国連邦は統一アラブ国家の創設を目指してリビア・エジプト・シリアの統合を図ったムアンマル・カダフィの試みであり、失敗に終わりました。1971年9月1日に各国の国民投票で承認されたものの、3国は統合の具体的な条件をめぐって合意できませんでした。連邦は1972年1月1日から1977年11月19日まで存続しました。"
    IRQ_SYR_union.t:0 "アラブ共和国連合？"
    IRQ_SYR_union.d:0 "1972年3月バアス党政権下のイラクはエジプトとシリアに対し1963年に頓挫したアラブ連合共和国の再建を提案しました。このイラクの提案はヨルダンが唱えたアラブ連合王国構想への即座の反応でしたが、すでに成立していたアラブ共和国連邦と衝突し、イラクとシリアの対立によって実現しませんでした。"
    UAR_NYE_union.t:0 "アラブ合衆国？"
    UAR_NYE_union.d:0 "アラブ連合共和国は1958年にエジプトとシリアが統合して成立した主権国家です。同年すでにエジプトと防衛協定を結んでいたイエメン王国（北イエメン）は1958年3月8日にこの新国家と結び、アラブ連合国と呼ばれる緩やかな連合を形成しました。この決定の理由の一つは、イエメンが長年にわたり自国よりはるかに大きく強力な北の隣国サウジアラビアから脅威を感じており、この連合を安全保障の拠り所と見なしたことにあります。ただしアラブ連合共和国の構成国とは異なり、北イエメンは独立した主権国家であり続けました。"
    GHA_GUI_union.t:0 "アフリカ諸国連合？"
    GHA_GUI_union.d:0 "アフリカ諸国連合はガーナ・ギニア・マリ連合とも呼ばれ、1958年に西アフリカのガーナとギニアを結んで独立アフリカ諸国連合として結成された短命で緩やかな地域組織です。1961年にマリが加盟し1963年に解散しました。"
    HZB_RSK_BOS_union.t:0 "デイトン合意？"
    HZB_RSK_BOS_union.d:0 "デイトン合意は、アメリカ合衆国オハイオ州デイトン近郊のライト・パターソン空軍基地で1995年11月21日にまとめられ、同年12月14日にパリで正式に調印された和平協定です。この協定はより大規模なユーゴスラビア紛争の一部であった3年半に及ぶボスニア紛争を終結させました。交戦各派は和平に合意し、セルビア人が多数を占めるスルプスカ共和国とクロアチア人・ボシュニャク人が主体のボスニア・ヘルツェゴビナ連邦という二つの構成体から成る単一の主権国家ボスニア・ヘルツェゴビナを樹立することで一致しました。"
    IDO_EID_union.t:0 "インドネシア合衆国の解体？"
    IDO_EID_union.d:0 "1950年3月から4月にかけて、東スマトラと東インドネシアを除くRISの全構成国が自ら解散して共和国へ統合されました。5月3日から5日には東インドネシア国・東スマトラ国・インドネシア共和国による三者会談が行われ、3つの主体を単一の統一国家へ統合することが決定されました。インドネシア合衆国は独立宣言から5周年にあたる1950年8月17日にスカルノ大統領によって正式に解散され、統一国家であるインドネシア共和国に置き換えられました。"
    JOR_PAL_union.t:0 "ヨルダン川西岸地区の併合？"
    JOR_PAL_union.d:0 "1948年12月のエリコ会議においてヨルダン川西岸地区のパレスチナ人名士数百人が集まり、ヨルダンの統治を受け入れ国王アブドゥッラー1世を統治者として承認しました。西岸地区は1950年4月24日に正式に併合されましたが、この併合はアラブ連盟を含む国際社会の大半から違法かつ無効であると広くみなされました。アラブ連盟は最終的に、将来の解決までヨルダンを暫定的な管理者として扱うことを決定しました。ヨルダンの併合宣言を承認したのはイギリス、イラク、そしておそらくパキスタンのみでした。"
    
    historical_union_formation.option.1:0 "はい"
    historical_union_formation.option.2:0 "いや、我々は独立を保つ！"
    
    transfer_territory_libya.t:0 "フェザーンをリビアへ譲渡しますか？"
    transfer_territory_libya.d:0 "トリポリタニアとキレナイカはイギリスの統治下に留まり、フェザーンはフランスが支配しました。1944年にイドリースはカイロでの亡命生活から帰還しましたが、外国による統制の一部が撤廃される1947年まではキレナイカへの定住再開を拒みました。同盟国との1947年の講和条約の条項により、トリポリタニアの植民地維持を望んだイタリアとフェザーンを求めたフランスは、リビアに対するあらゆる請求権を放棄しました。こうしてリビアは統一を保ったのです。"
    transfer_territory_somalia.t:0 "ソマリアをイタリアへ譲渡しますか？"
    transfer_territory_somalia.d:0 "ソマリランド信託統治領は現在のソマリアに位置する国際連合の信託統治領でした。首都はモガディシュで、かつてのイギリス軍政の終了を受けて1950年から1960年までイタリアが統治しました。1960年に独立を達成しています。"
    transfer_territory_eritrea.t:0 "エリトリアをエチオピアへ譲渡しますか？"
    transfer_territory_eritrea.d:0 "第二次世界大戦後、エリトリアは1952年までイギリス軍政の統治下に置かれました。1952年の国連総会の決定により、エリトリアは現地のエリトリア議会によって自治を行う一方、外交と防衛については10年間エチオピアとの連邦を構成することとなりました。"
    transfer_territory_tangier.t:0 "タンジェ国際管理地域を廃止しますか？"
    transfer_territory_tangier.d:0 "1956年3月2日にフランスの保護領統治が終わり4月7日にスペインの保護領統治も終わったことを受けて、タンジール地帯管理委員会は1956年6月に会合を開き暫定体制に関する議定書を提案しました。この議定書は1956年7月5日にスルタン・ムハンマド5世に代わってモロッコ外相アフメド・バラフレジがラバトで署名しました。その結果、行政長官の職は廃止され1956年7月10日にモロッコ人総督（アーミル）の職へ置き換えられ、メンドゥーブのアフマド・アッタージーが直ちにこれに就任しました。同時にタンジールの警察もモロッコの統治下へ移されました。"
    transfer_territory_saarland.t:0 "ザールラントを西ドイツへ移譲するか？"
    transfer_territory_saarland.d:0 "1954年、フランスとドイツ連邦共和国（西ドイツ）は独立したザールラントを樹立するためザール憲章（Saarstatut）と呼ばれる詳細な計画を策定しました。これは1954年10月23日にパリ協定の一つとして両国間の合意として署名されましたが、1955年10月23日の住民投票で67.7％の反対により否決されました。1956年10月27日にザール条約がザールラントの西ドイツ編入を認めると宣言し、1957年1月1日に編入が実現しました。"
    transfer_territory_ruhr.t:0 "ルールを西ドイツへ移譲するか？"
    transfer_territory_ruhr.d:0 "ルール国際管理機関は、アメリカ合衆国・イギリス・フランス・ベネルクス諸国によるロンドン六カ国会議を経て1948年6月7日に発表されたコミュニケで設立が定められました。1951年のパリ条約により廃止され、その業務は欧州石炭鉄鋼共同体（ECSC）へ引き継がれました。IARを終了させる協定は1951年10月19日にパリで署名され、IARの機能停止に関する合意は1952年6月25日に発効しました。"
    transfer_territory_trieste.t:0 "ロンドン覚書？"
    transfer_territory_trieste.d:0 "トリエステ自由地域は第二次世界大戦後に国際連合安全保障理事会の直接の責任下に置かれた南欧の独立地域で、イタリア北部とユーゴスラビアの間に位置しアドリア海北部に面していました。この地域は1954年に事実上解体され、ゾーンAはイタリアへ、ゾーンBはユーゴスラビアへ引き渡されました。これにより国境紛争が生じ、20年後の1975年に二国間のオジモ条約が調印されてようやく決着しました。同条約は1977年に批准されました。"
    transfer_territory_port_arthur.t:0 "旅順を中国に引き渡しますか？"
    transfer_territory_port_arthur.d:0 "旅順海軍基地の管理権は中国から、1895年から1904年はロシア帝国、1905年から1945年は大日本帝国、1945年から1956年はソビエト連邦へと移り、1956年以降に再び中国の手に戻りました。"
    transfer_territory_panama_canal.t:0 "パナマ運河をパナマに引き渡しますか？"
    transfer_territory_panama_canal.d:0 "1977年9月7日、アメリカ合衆国大統領ジミー・カーターとパナマの事実上の指導者オマール・トリホスによって条約が調印されました。これにより、運河の恒久的中立を保証する条約にパナマが署名することを条件として、パナマ人に運河の自由な管理権を与える手続きが動き出しました。この条約により1999年12月31日正午をもってパナマの完全な管理権が発効し、パナマ運河庁（ACP）が水路の管理を引き継ぎました。"
    transfer_territory_hong_kong.t:0 "香港を中国に引き渡しますか？"
    transfer_territory_hong_kong.d:0 "イギリスから中華人民共和国への香港返還は1997年7月1日午前0時に行われました。この出来事は1841年に始まった旧植民地における156年間のイギリス統治に終止符を打ちました。香港は50年間にわたり中国の特別行政区（SAR）とされ、その間は中国本土とは異なる独自の経済制度と統治制度を維持することとなりました。"
    transfer_territory_macau.t:0 "マカオを中国に引き渡しますか？"
    transfer_territory_macau.d:0 "ポルトガル共和国から中華人民共和国へのマカオ返還は1999年12月20日午前0時に行われました。この出来事は1557年に始まった旧居留地における442年間のポルトガル統治に終止符を打ちました。"
    transfer_territory_west_papua.t:0 "西パプアをインドネシアに引き渡しますか？"
    transfer_territory_west_papua.d:0 "1940年代後半、オランダ領東インドの領土は西ニューギニアを除いて独立国インドネシアとなりました。オランダは1962年8月15日のニューヨーク協定によって同地域がインドネシアへ引き渡されるまで西ニューギニア（オランダ領ニューギニア）の主権を保持しました。"
    transfer_territory_somaliland.t:0 "ソマリランドをソマリアに移譲しますか？"
    transfer_territory_somaliland.d:0 "1960年6月26日、イギリス領ソマリランドはイギリスから正式に独立を認められソマリランド国となりました。その5日後の1960年7月1日、ソマリランド国は自発的にソマリア信託統治領（旧イタリア領ソマリア）と統合しソマリ共和国を形成しました。"
    transfer_territory_japanese_okinawa.t:0 "沖縄を日本に移譲しますか？"
    transfer_territory_japanese_okinawa.d:0 "沖縄返還協定は、太平洋戦争の結果としてアメリカが獲得したサンフランシスコ平和条約第3条に基づくすべての権利と権益を日本のために放棄することに合意した、アメリカと日本の間の協定です。これにより沖縄県は日本の主権下に復帰しました。"
    transfer_territory_south_cameroon.t:0 "南カメルーンをカメルーンに移譲しますか？"
    transfer_territory_south_cameroon.d:0 "1959年と1961年、カメルーンではナイジェリアとカメルーンのいずれと統合するかを決める住民投票が行われました。1961年、北カメルーンはナイジェリアとの統合を、南カメルーンは（旧フランス領の）カメルーンとの統合を選びました。"
    transfer_territory_french_india.t:0 "インドの植民地をインドに移譲しますか？"
    transfer_territory_french_india.d:0 "1954年10月18日、ポンディシェリ市部とコミューン・パンチャーヤトの178名が参加した総選挙において、170名が併合に賛成し8名が反対しました。フランス領インド領土のフランス統治からインド連邦への事実上の移譲は1954年11月1日に行われ、連邦直轄領ポンディシェリとして設置されました。法律上の移譲を定める条約は1956年に調印されました。"
    transfer_territory_christmas_island.t:0 "クリスマス島をオーストラリアに移譲しますか？"
    transfer_territory_christmas_island.d:0 "オーストラリアの要請を受け、イギリスは主権をオーストラリアへ移譲し、オーストラリア政府はリン鉱石収入の逸失に対する補償としてシンガポールへ2000万ドルを支払いました。イギリスのクリスマス島法は1958年5月14日に裁可され、枢密院令によってクリスマス島の統治権をシンガポールからオーストラリアへ移すことが可能になりました。オーストラリアのクリスマス島法は1958年9月に成立し、同島は1958年10月1日に正式にオーストラリア連邦の統治下に置かれました。"
    transfer_territory_israel_egypt.t:0 "キャンプ・デービッド合意？"
    transfer_territory_israel_egypt.d:0 "キャンプ・デービッド合意は、メリーランド州にあるアメリカ大統領の別荘キャンプ・デービッドでの12日間にわたる秘密交渉を経て、1978年9月17日にエジプトのアンワル・サダト大統領とイスラエルのメナヘム・ベギン首相が署名した2つの政治合意です。"
    transfer_territory_israel_palestine.t:0 "オスロI合意？"
    transfer_territory_israel_palestine.d:0 "オスロI合意（オスロI）は、正式には「暫定自治措置に関する原則宣言」（略称・原則宣言、DOP）と呼ばれ、続いていたイスラエル・パレスチナ紛争の解決へ導く枠組みを築こうとした1993年の試みです。"
    transfer_territory_crimea.t:0 "クリミア併合？"
    transfer_territory_crimea.d:0 "2014年2月から3月にかけて、ロシアはウクライナの一部であるクリミア半島へ侵攻し、これを併合しました。尊厳の革命の直後に生じた相対的な権力の空白のなかでの出来事でした。"
    transfer_territory_aouzou_strip.t:0 "アオゾウ地帯を割譲する？"
    transfer_territory_aouzou_strip.d:0 "リビアへのフランスの圧力とニジェールのハマニ・ディオリ大統領の仲介により、リビアとチャドは1972年4月17日に外交関係を回復しました。その直後トンバルバイはイスラエルとの外交関係を断絶し、11月28日にアオゾウ地帯をリビアへ割譲することを秘密裏に合意したとされています。その見返りとしてカダフィはチャド大統領へ4000万ポンドを供与すると約束し、両国は1972年12月に友好条約を締結しました。"
    transfer_territory_china_SAR.t:0 "一国二制度を終わらせる？"
    transfer_territory_china_SAR.d:0 "「一国二制度」は香港とマカオの特別行政区の統治を定めた[ROOT.GetCountry.GetName]の憲法上の原則です。中国はひとつであるとしつつも、これらの地域は独自の経済制度と行政制度を維持でき、中国本土の他の地域は異なる制度を用いることとされました。この原則の下では両地域はそれぞれ独自の統治機構、法制度、経済・財政、さらには外国との通商関係までも本土から独立して保持し続けることができます。これを[SCOPE.sCountry('1_country_2_systems_SAR').GetName]において続けるかどうかを選ぶ時が来ました。"
    transfer_territory_china_SAR.f:0 "このイベントは[SCOPE.sCountry('1_country_2_systems_SAR').GetName]が50年以上にわたり[ROOT.GetCountry.GetName]の$special_administrative_region$であったために発生しました。"
    transfer_territory_omani_gwadar.t:0 "グワダルをパキスタンに売却？"
    transfer_territory_omani_gwadar.d:0 "1947年にパキスタンが独立した時点でグワダルはオマーンの統治下に留まっていました。しかしパキスタンはグワダルへの関心を示し始めます。パキスタン首相フィーローズ・ハーン・ヌーンとオマーンのスルタンであるサイード・ビン・タイムールの尽力によって取引がまとまり、パキスタンは1958年9月8日にこの土地を購入することができ、1958年12月8日に正式にパキスタンの一部となりました。"
    transfer_territory_portuguese_cabinda.t:0 "カビンダをアンゴラへ移譲？"
    transfer_territory_portuguese_cabinda.d:0 "1975年1月15日にポルトガルのアルヴォルで署名されたアルヴォル協定は11月11日にアンゴラのポルトガルからの独立を認め、13年に及んだアンゴラ独立戦争を正式に終結させました。FLECが決して同意しなかったこの条約はカビンダを「アンゴラの不可分かつ不可譲の一部」と規定しています。"
    transfer_territory_british_bizonia.t:0 "ドイツにバイゾニアを形成？"
    transfer_territory_british_bizonia.d:0 "バイゾーンあるいはバイゾニアは第二次世界大戦後のドイツ占領において1947年1月1日にアメリカ占領地区とイギリス占領地区を統合したものです。"
    transfer_territory_french_trizonia.t:0 "ドイツにトリゾニアを形成？"
    transfer_territory_french_trizonia.d:0 "ビゾニアの統治機構は1948年8月1日にフランス占領地区を含む形へ拡大され、こうして生まれた体制は非公式にトリゾニアあるいはトリゾネジアと呼ばれました。4つの占領国の関係は悪化を続け、四カ国による統治機構は手に負えないものとなりました。1948年3月には連合国管理理事会が活動を停止し、トリゾニアにおいては連合国高等弁務官委員会がこれに取って代わりました。"
    transfer_territory_KMT_PRC.t:0 "台湾への脱出？"
    transfer_territory_KMT_PRC.d:0 "中華民国政府の台湾撤退とは、中国大陸での国共内戦に敗れた後、当時国際的に承認されていた国民党統治下の中華民国（ROC）政府の残存勢力が1949年12月7日に台湾島（フォルモサ）へ移った出来事を指します。"
    transfer_territory_dutch_east_indonesia.t:0 "デンパサール会議？"
    transfer_territory_dutch_east_indonesia.d:0 "デンパサール会議は1946年12月7日から24日にかけてデンパサールのホテル・バリで開催され、インドネシア合衆国の一部をなす東インドネシア国の樹立につながりました。オランダ政府が西ニューギニアの統治権をオランダ領東インドの他の地域と同時には引き渡さないとの立場を表明したのも、この会議の場でした。"
    transfer_territory_port_porkkala.t:0 "ポルッカラ海軍基地の返還？"
    transfer_territory_port_porkkala.d:0 "ポルッカラ海軍基地は、フィンランドのヘルシンキから西へ30キロメートルのポルッカラ半島にあるキルッコヌンミ、インコー、シウンティオの各自治体に1944年から1956年まで置かれていたソ連の海軍基地です。この地域は1944年にフィンランド、ソ連、イギリスが署名したモスクワ休戦協定に基づきソ連へ貸与されました。1956年にこの地域はフィンランドへ返還されました。"
    transfer_territory_port_bornholm.t:0 "ボーンホルム島占領の終結？"
    transfer_territory_port_bornholm.d:0 "5月9日にソ連軍が島へ上陸し、短い戦闘の末に約1万2000名のドイツ軍守備隊が降伏しました。ソ連軍は1946年4月5日に島を去りました。"
    transfer_territory_port_dodecanese.t:0 "ドデカネス諸島のギリシャへの移譲？"
    transfer_territory_port_dodecanese.d:0 "戦後この島々はイギリスの軍事保護領となり、ほぼ即座に自らの民政運営を認められました。その結果、主権と軍事統制は別個のままながら非公式にギリシャと一体化しました。同じく島々の領有を望んだトルコの反対にもかかわらず、1947年のイタリアとの平和条約によって正式にギリシャへ編入されました。"
    transfer_territory_british_newfoundland.t:0 "ニューファンドランドをカナダ連邦へ加入させる？"
    transfer_territory_british_newfoundland.d:0 "1948年のニューファンドランド住民投票は、自治領ニューファンドランドの政治的将来を決めるために行われた2度の住民投票です。投票以前のニューファンドランドは負債を抱えており、カナダへ加わるか（「連邦加入」）、イギリス統治下にとどまるか、独立を回復するかを定めるため幾度も代表団を送りました。投票は1948年6月3日と7月22日に実施されました。最終的な結果は連邦加入であり、1949年3月31日にニューファンドランドはカナダの10番目の州となりました。"
    transfer_territory_british_sarawak.t:0 "サラワクを併合する？"
    transfer_territory_british_sarawak.d:0 "サラワク王国は1841年に建国された独立国家であり、1888年からはイギリスと保護条約を結んでいました。1888年にこの王国は併合を免れつつイギリス政府から保護国の地位を得ました。第二次世界大戦と日本軍の到来はついに王国の終焉をもたらし、1945年の日本降伏とともに領土は軍政下に置かれ、1946年には大西洋憲章に反してイギリス最後の獲得地となる直轄植民地として併合されました。"
    transfer_territory_lebanon_ISR.t:0 "レバノン占領の終結？"
    transfer_territory_lebanon_ISR.d:0 "1999年5月のイスラエル総選挙を前にイスラエル首相エフード・バラクは1年以内に全イスラエル軍が南レバノンから撤退すると約束し、事実上南レバノン軍への支援を打ち切りました。イスラエルとレバノンの和平合意をも目指したイスラエル・シリア間の交渉がシリアによるレバノン支配（2005年まで）によって失敗すると、バラクはイスラエル国防軍をイスラエル国境まで撤退させる決定に至りました。"
    transfer_territory_lebanon_SYR.t:0 "レバノン占領の終結？"
    transfer_territory_lebanon_SYR.d:0 "イスラエルの南レバノンからの撤退と2000年のハーフィズ・アル＝アサドの死を経てシリアの軍事的プレゼンスはレバノン国民の批判と抵抗に直面しました。これに続く国連安全保障理事会決議1559の採択とレバノン元首相ラフィク・ハリーリーの暗殺、さらにその死へのシリア関与疑惑を受け、杉の革命と呼ばれる民衆蜂起が国中に広がりました。2005年3月5日、シリア大統領バッシャール・アル＝アサドは議会での演説でシリア軍がレバノンからの撤退を開始すると発表しました。シリアは2005年4月30日にレバノンからの完全撤退を完了しました。"
    transfer_territory_SAF_NMB.t:0 "ウォルビスベイのナミビアへの返還？"
    transfer_territory_SAF_NMB.d:0 "1990年に南西アフリカはナミビアとして独立しましたが、ウォルビスベイは南アフリカの主権下に留まりました。アパルトヘイト終結に先立つ1993年8月、南アフリカの多党交渉フォーラムはウォルビスベイと沖合諸島のナミビアへの編入・再統合を求める決議を可決しました。同年には南アフリカ議会でウォルビスベイ・ナミビア移譲法が可決されました。両国間の条約調印を経て、南アフリカは1994年3月1日にウォルビスベイとペンギン諸島の主権を正式にナミビアへ移譲しました。"
    transfer_territory_spanish_morocco.t:0 "スペイン領リーフのモロッコへの返還？"
    transfer_territory_spanish_morocco.d:0 "1956年にフランスがモロッコに対する保護領を終了させると、スペインも保護領を解消し、新たに独立した王国へ領土を返還しました。ただし植民地時代以前からスペインの一部であったプラサス・デ・ソベラニア（主権地）と、ケープ・ジュビーやイフニ、さらにモロッコ域外のその他の植民地（スペイン領サハラなど）は保持しました。"
    transfer_territory_bahrain.t:0 "バーレーン問題？"
    transfer_territory_bahrain.d:0 "1970年のバーレーン独立調査は1970年3月28日から5月11日にかけて実施されました。3月28日に国連事務総長はヴィットーリオ・ウィンスピアーレ＝グイッチャルディを任命し、バーレーンの人々に将来についての意見を聴取させました。5月11日までに国連安全保障理事会は、圧倒的多数が完全独立を支持しているという彼の結論を承認しました。この調査の契機となったのは、1971年末までにペルシア湾から撤退するという1968年の英国の決定であり、バーレーンの将来は不透明になっていました。イランはバーレーンに対する領有権主張を復活させていましたが、国連主導の協議は住民が独立を望んでいることを確認し、この紛争を解決しました。"
    transfer_territory_gaza.t:0 "ガザ地区の将来"
    transfer_territory_gaza.d:0 "2025年1月中旬に暫定的な停戦が始まり2か月間続きました。8月にはイスラエルがガザ市への攻勢を開始しました。2025年10月9日までにイスラエルとハマスは、米国主導の和平案の第一段階に合意しました。2025年11月17日に採択された国際連合安全保障理事会決議2803には、ガザ地区の暫定統治に関する規定が含まれています。"
    transfer_territory_DPR.t:0 "ロシアによる[ROOT.GetCountry.GetNameNoFormatting]の併合？"
    transfer_territory_DPR.d:0 "2022年9月30日、ウクライナ侵攻が続くなかでロシアは、ドネツク、ヘルソン、ルハンシク、ザポリージャという4つのウクライナの州とその周辺地域の併合を一方的に宣言しました。ルハンシク州の大部分とドネツク州の一部は2014年以来、親ロシア派の分離主義者に支配されており、ヘルソン州とザポリージャ州は2022年にロシアの侵攻を受けていました。併合対象となる地域の範囲もその境界も定められておらず、ロシア当局は後日定めるとしました。"
    end_berlin_occupation.t:0 "ベルリン占領の終結？"
    end_berlin_occupation.d:0 "西ベルリンは1990年10月3日、東ドイツと東西ベルリンがドイツ連邦共和国と統一される日まで軍事占領下に置かれていました。西ドイツ連邦政府および大半の西側諸国の政府は東ベルリンを東ドイツとは「別個の存在」とみなしており、西側同盟国は後に東ベルリンへ大使館を開設したものの、この都市をドイツ民主共和国の政府所在地としてのみ認め、その首都とは認めませんでした。"
    transfer_territory_british_ogaden.t:0 "イギリスのオガデン占領の終結？"
    transfer_territory_british_ogaden.d:0 "1941年から1955年にかけて、イギリスは東アフリカ戦役の後にオガデンとハウドを統治しました。イギリスは大ソマリアの実現を目指し、エチオピア領とエリトリアを求めるハイレ・セラシエの要求を無視しました。アメリカの圧力を受けてイギリスはこの計画を断念し1948年にオガデンを、1955年にハウドを割譲しましたが、これがソマリ人の抵抗と反乱を招きました。"
    transfer_territory_british_iran.t:0 "イギリスのイラン占領の終結？"
    transfer_territory_british_iran.d:0 "英ソのイラン侵攻は、1941年8月にイギリスとソ連が公式には中立だったイラン帝国へ共同で侵攻した出来事です。両国は共通の敵であるナチス・ドイツとの戦争が終結してから6か月後まで留まると宣言し、その期限は1946年3月2日となりました。"
    transfer_territory_soviet_iran.t:0 "ソ連のイラン占領の終結？"
    transfer_territory_soviet_iran.d:0 "アメリカは赤軍のイランからの撤退とソ連の影響力の低下を迫るため、段階的にソ連へ強い圧力をかけました。アメリカの正式な抗議を受けて国連安全保障理事会は1946年1月30日に決議2を採択しました。3月24日にスターリンは1946年4月30日までにソ連軍をイランから撤退させるよう命じ、ソ連軍は5月6日までに撤退を完了しました。"
    transfer_territory_west_papua_1969.t:0 "自由選択法？"
    transfer_territory_west_papua_1969.d:0 "自由選択法は1969年7月14日から8月2日にかけて行われた物議を醸す住民投票で、西ニューギニアにおいてインドネシア軍が選んだ1,025人が全会一致でインドネシアによる統治に賛成しました。その過程が問題視されたことから、この出来事は「選択なき法」と揶揄されることもあります。"
    transfer_territory_soviet_manchuria.t:0 "ソ連、満洲から撤退？"
    transfer_territory_soviet_manchuria.d:0 "ソ連による満州占領は、1945年8月に赤軍が大日本帝国の傀儡国家である満州国へ侵攻した後に始まりました。占領は1946年5月にソ連軍が撤退するまで続きました。"
    transfer_territory_KMT_PRC_1.t:0 "南京陥落？"
    transfer_territory_KMT_PRC_1.d:0 "1949年4月に南京を失った国民党（KMT）は、広州・重慶・成都という複数の臨時首都を経て南へ後退しました。"
    transfer_territory_british_chagos_islands.t:0 "ディエゴガルシアの米英海軍基地？"
    transfer_territory_british_chagos_islands.d:0 "1966年12月30日、アメリカとイギリスは交換公文によって協定を結び、アメリカが2016年12月までの50年間にわたり英領インド洋地域（BIOT）を防衛目的で使用することを認めました。さらに2014年12月から2016年12月までの2年間にいずれの当事国も終了を通告しなければ20年間（2036年まで）延長され、イギリスは延長にあたっての追加条件を定めることができます。この協定およびその後の修正において、アメリカからイギリスへの金銭の支払いは行われていません。"
    
    historical_territorial_transfers.option.1:0 "領土を移譲する"
    historical_territorial_transfers.option.2:0 "あの領土は我々のものであり続ける！"
    
    historical_territorial_annexation.option.1:0 "領土を併合する！"
    historical_territorial_annexation.option.2:0 "これ以上の土地は必要ない"
    
    malaysia_singapore.t:0 "シンガポールの独立？"
    malaysia_singapore.d:0 "1965年8月9日、マレーシア議会はシンガポール選出議員全員がボイコットするなか、126対0で追放に賛成しました。同日、リー・クアンユーは涙ながらにテレビ中継の記者会見で、シンガポールが主権を持つ独立国家であると宣言しました。"
    CAF_rhodesia.t:0 "ローデシア・ニヤサランド連邦を解体する？"
    CAF_rhodesia.d:0 "連邦は1963年12月31日に正式に解消されました。解体から間もない1964年、北ローデシアとニヤサランドはそれぞれザンビア、マラウイの名で独立しました。1965年11月には南ローデシアがイギリスからの独立を一方的に宣言し、ローデシア国となりました。"
    uar_syria.t:0 "シリアの独立？"
    uar_syria.d:0 "多くのシリア人が思い描いていた二つのアラブ民族による連邦とは異なり、アラブ連合共和国はエジプト人が完全に支配する国家となりました。ナセルがシリア国内の全政党の解散を要求したため、シリアの政治活動も衰退しました。その過程で高度に中央集権化されたエジプトはナセルの社会主義的な政治・経済体制を弱体なシリアに押し付け、シリアの実業界と軍部の反発を招き、1961年9月28日のシリアでのクーデターとアラブ連合共和国の終焉をもたらしました。"
    west_indies_dissolution.t:0 "西インド諸島連邦の解散？"
    west_indies_dissolution.d:0 "西インド諸島連邦はイギリス議会の1962年西インド諸島法により法的に解散しました。残された「リトル・エイト」の各州は再びロンドンが直接統治する個別の植民地となり、その多くは後に独立を果たしました。"
    NET_IDO.t:0 "オランダ・インドネシア連合の解散？"
    NET_IDO.d:0 "オランダ・インドネシア連合は1949年から1956年まで存在したオランダとインドネシアの国家連合的な関係です。1954年8月17日インドネシア独立9周年を祝う演説で、スカルノ大統領は連合をインドネシアの発展の妨げであるとして一方的に解消しました。"
    ussr_dissolution.t:0 "ソビエト連邦の解体？"
    ussr_dissolution.d:0 "ソビエト連邦の解体はソビエト連邦（USSR）内部で進行した崩壊の過程であり、主権国家としての同国と連邦政府の終焉、さらには1991年12月26日における15の構成共和国の完全独立をもたらしました。"
    ussr_dissolution.f:0 "このイベントは、解体の史実上の条件が満たされたか、反共産主義の利益団体を含む革命運動が存在し、かつ国内経済が低迷しているために発生しました。"
    CZH_dissolution.t:0 "チェコスロバキアの解体？"
    CZH_dissolution.d:0 "1992年12月31日に発効したチェコスロバキアの解体は、連邦国家であったチェコスロバキアがチェコ共和国とスロバキアという独立国家へ自ら分離したものです。両国はいずれも1969年にチェコスロバキア社会主義共和国の構成国として創設され1989年末まで存続したチェコ社会主義共和国とスロバキア社会主義共和国を引き継ぐものでした。"
    CZH_dissolution.f:0 "このイベントは、解体の史実上の条件が満たされたか、反共産主義の利益団体を含む革命運動が存在し、かつ国内経済が低迷しているために発生しました。"
    SER_MON_dissolution.t:0 "モンテネグロの独立？"
    SER_MON_dissolution.d:0 "2006年5月21日にモンテネグロで独立を問う住民投票が実施されました。賛成は有権者の55.5％に達し可決要件である55％をわずかに上回りました。"
    CAN_QUE_1_dissolution.t:0 "第1回ケベック住民投票？"
    CAN_QUE_1_dissolution.d:0 "1980年のケベック独立住民投票は、カナダにおけるケベックの地位とケベックが主権獲得への道を進むべきかどうかを問うた、ケベックで初めての住民投票でした。この投票はカナダからの分離独立を掲げるケベック党（PQ）政権によって実施されました。州全体での投票は5月20日に行われ、分離独立を目指す提案は59.56％対40.44％で否決されました。"
    CAN_QUE_2_dissolution.t:0 "第2回ケベック住民投票？"
    CAN_QUE_2_dissolution.d:0 "1995年のケベック住民投票は、フランス語話者が多数を占めるカナダのケベック州で、カナダに政治的・経済的な協定を提案することを前提としてケベックが主権を宣言し独立国家となるべきかどうかを有権者に問うた2度目の住民投票でした。投票は1995年10月30日に行われケベック史上最高の投票率（93.52％）を記録しました。「反対」が54,288票差で上回り有効投票の50.58％を獲得しました。"
    IRQ_KUR_dissolution.t:0 "クルドの自治権を承認する？"
    IRQ_KUR_dissolution.d:0 "2003年のイラク戦争に先立ち、両党はサダム・フセインに対抗するアラブ人反体制派との交渉で足並みをそろえ、政治・経済・安全保障上の成果を収めることに成功しました。アラブ人反体制派はサダム・フセインが権力の座から追われた場合にクルド人の自治を承認することに同意しました。またクルディスタンは数千の兵士を受け入れ、アメリカと共同でハラブジャ地域のイスラム主義組織アンサール・アル・イスラームを掃討しました。1992年以来存続してきたクルド人自治は2005年に新イラク政府によって新憲法の中で正式に承認されました"
    GBR_SCO_dissolution.t:0 "スコットランド独立住民投票"
    GBR_SCO_dissolution.d:0 "イギリスからのスコットランド独立に関する住民投票が、2014年9月18日にスコットランドで開催されました。住民投票の質問は「スコットランドは独立国となるべきか？」であり、有権者は「賛成」または「反対」で回答しました。「反対」側が勝利し、独立に反対する票は2,001,926票、賛成する票は1,617,989票でした。"
    SPA_CAT_dissolution.t:0 "カタルーニャ独立住民投票"
    SPA_CAT_dissolution.d:0 "2017年10月1日、スペインの自治州カタルーニャで独立住民投票が実施されました。これはカタルーニャ州議会が「カタルーニャの自己決定に関する住民投票法」として可決したものです。この住民投票はスペイン政府の要請を受けて2017年9月7日に違憲と宣言され、スペイン憲法裁判所によって停止されました。同政府はこれをスペイン憲法への違反であるとしています。"
    SKN_GBR_dissolution.t:0 "セントクリストファー＝ネイビス＝アンギラの解体？"
    SKN_GBR_dissolution.d:0 "西インド連邦の一部であった短い期間を経て、アンギラ島は1967年に完全な内政自治権を持つ連合州セントキッツ＝ネイビス＝アンギラの一部となりました。しかし多くのアンギラ人はこの連合に加わることを望まず、その中でのセントキッツの優位に反感を抱いていました。1980年、アンギラはついにセントクリストファー・ネイビスからの正式な分離を認められ、独立した英国海外領土となりました。"
    FRA_NCD_dissolution.t:0 "ニューカレドニア独立住民投票"
    FRA_NCD_dissolution.d:0 "2021年12月12日、南太平洋のフランス領ニューカレドニアで独立住民投票が実施されました。この投票はヌメア協定の定めに基づく3回目にして最後のものであり、2018年と2020年の投票では独立がそれぞれ57％と53％で否決されていました。"
    UAS_GHA.t:0 "アフリカ諸国連合の解体"
    UAS_GHA.d:0 "この連合は1963年5月にさしたる注目も集めないまま解消されました。UASの失敗については互いに競合するナショナリズムや、ンクルマが影響を受けたアメリカ型連邦制に内在する欠陥など様々な説明がなされています。アドム・ゲタチューは連邦的統合と加盟国の独立との厳密な均衡をめぐる深い意見の対立こそが失敗の原因であったと論じています。"
    PHI_MGD_dissolution.t:0 "バンサモロ基本法？"
    PHI_MGD_dissolution.d:0 "バンサモロ基本法はムスリム・ミンダナオ・バンサモロ自治地域（BARMM）の設立を定めたフィリピンの法律です。組織法たるこの基本法はムスリム・ミンダナオ自治地域（ARMM）を廃止し、2014年にフィリピン政府とモロ・イスラム解放戦線との間で調印されたバンサモロ包括合意に定められた取り決めに従ってバンサモロの統治機構の基本的枠組みを定めました。"
    SOM_SML_dissolution.t:0 "ソマリランドの独立？"
    SOM_SML_dissolution.d:0 "ソマリランド国は自らの意思でソマリア信託統治領（旧イタリア領ソマリア）と統合しソマリア共和国を形成しました。しかし両者の統合は早くから問題を抱えており、破滅的なオガデン戦争の終結後まもなくソマリアのバーレ政権がソマリランドの主要氏族であるイサークに対して過酷な政策を実施したことを受け、10年に及ぶ独立戦争の末に1991年にソマリランドの独立が宣言されました。"
    MOR_WSA_dissolution.t:0 "西サハラの停戦？"
    MOR_WSA_dissolution.d:0 "国連の仲介による1991年の西サハラ停戦は1991年9月6日に発効しました。これは停戦を監視し当地の将来を問う住民投票を準備するための国連西サハラ住民投票ミッション（MINURSO）の設置を含む、より広範な和平プロセスの要となるものでした。停戦は30年近く維持されたものの最終的に紛争の解決には至りませんでした。"
    
    historical_union_dissolution.option.1:0 "独立を認める"
    historical_union_dissolution.option.2:0 "我が国を分裂させるわけにはいかない！"
    
    dissolve_the_ussr.tt:0 "ソビエト社会主義共和国連邦を解体する"
    dissolve_the_warsaw_pact.tt:0 "ワルシャワ条約機構を解体する"
    create_russian_federation.tt:0 "ロシア連邦になる"
    
    korean_war.t:0 "朝鮮戦争"
    korean_war.d:0 "朝鮮戦争は1950年から1953年にかけて北朝鮮と韓国の間で戦われた戦争です。両国の間で数年にわたる敵対が続いた末、1950年6月25日に北朝鮮が韓国へ侵攻して開戦しました。北朝鮮は中国とソビエト連邦の支援を受け、韓国はアメリカ合衆国と同盟諸国の支援を受けました。戦闘は1953年7月27日の休戦協定によって終結しました。"
    sino_tibetan_war:0 "中国・チベット戦争"
    sino_tibetan_war.t:0 "中国・チベット戦争"
    sino_tibetan_war.d:0 "チベットはチベット政府が十七か条協定に署名し第14代ダライ・ラマが1951年10月24日にこれを批准したことで中華人民共和国（PRC）の支配下に入りましたが、ダライ・ラマは後に強要のもとで承認したものだとしてこれを否認しました。数か月に及ぶ交渉の決裂、チベットによる外国の支援獲得の試み、中華人民共和国とチベット双方の兵力増強を経て、人民解放軍（PLA）は1950年10月6日または7日に金沙江を渡りチベットを併合しました。"
    portugal_india_war.t:0 "ゴア併合"
    portugal_india_war.d:0 "ゴア併合はインド共和国が当時のポルトガル領インドであったゴア・ダマン・ディーウを併合した過程であり、1961年12月のインド軍による武力行動から始まりました。"
    suez_crisis_war.t:0 "スエズ危機"
    suez_crisis_war.d:0 "スエズ危機は1956年末にイスラエルが、続いてイギリスとフランスがエジプトとガザ地区へ侵攻した事件です。その狙いは西側諸国がスエズ運河の管理権を取り戻すこと、そして運河を運営していた外国資本のスエズ運河会社を国有化したばかりのエジプト大統領ガマール・アブドゥル・ナーセルを排除することでした。"
    vietnam_war.t:0 "ベトナム戦争"
    vietnam_war.d:0 "ベトナム戦争は1955年11月1日から1975年4月30日のサイゴン陥落まで、ベトナム・ラオス・カンボジアで続いた戦争です。インドシナ戦争の2度目にあたり冷戦期の主要な紛争の一つでした。公式には北ベトナムと南ベトナムの間の戦争でしたが、北はソ連や中国をはじめとする共産主義諸国の支援を受け、南はアメリカなど反共諸国の支援を受けたため、米ソの代理戦争となりました。戦争は20年近く続き、アメリカ軍の直接介入は1973年に終わりました。"
    second_indo_pakistan_war.t:0 "第二次カシミール戦争"
    second_indo_pakistan_war.d:0 "1965年の印パ戦争は第二次印パ戦争とも呼ばれ、1965年8月から9月にかけてパキスタンとインドの間で戦われた武力紛争です。"
    falklands_war.t:0 "フォークランド紛争"
    falklands_war.d:0 "フォークランド紛争は1982年に南大西洋の2つのイギリス海外領土、フォークランド諸島とその属領サウスジョージア・サウスサンドイッチ諸島をめぐってアルゼンチンとイギリスの間で戦われた、宣戦布告なき10週間の戦争です。1982年4月2日にアルゼンチンがフォークランド諸島へ侵攻して占領し、翌日にはサウスジョージアにも侵攻したことで紛争が始まりました。4月5日、イギリス政府はアルゼンチン海軍・空軍と交戦したうえで諸島へ上陸作戦を行うため機動部隊を派遣しました。戦闘は74日間続き、6月14日のアルゼンチンの降伏によって終結し、諸島はイギリスの統治下に戻りました。"
    third_indo_pakistan_war.t:0 "第三次印パ戦争"
    third_indo_pakistan_war.d:0 "1971年の印パ戦争は、東パキスタンでのバングラデシュ独立戦争のさなか、1971年12月3日からダッカでパキスタン軍が降伏する同年12月16日まで続いたインドとパキスタンの軍事衝突です。"
    6_day_war.t:0 "アラブ・イスラエル戦争"
    6_day_war.d:0 "六日間戦争または6月戦争は、1967年アラブ・イスラエル戦争あるいは第三次アラブ・イスラエル戦争とも呼ばれ、1967年6月5日から10日にかけてイスラエルとアラブ諸国連合との間で戦われました。"
    ifni_war.t:0 "イフニ戦争"
    ifni_war.d:0 "イフニ戦争はスペインでは「忘れられた戦争」とも呼ばれ、1957年10月に始まったモロッコ人反乱勢力によるスペイン領西アフリカへの一連の武力侵入であり、シディ・イフニ包囲戦の失敗をもって幕を閉じました。"
    IDO_ETM_war.t:0 "東ティモール侵攻"
    IDO_ETM_war.d:0 "インドネシアによる東ティモール侵攻は1975年12月7日に始まりました。インドネシア軍（ABRI/TNI）は反植民地主義と反共産主義を口実に、1974年に成立したフレテリン政権を打倒すべく東ティモールへ侵攻しました。"
    iran_iraq_war.t:0 "イラン・イラク戦争"
    iran_iraq_war.d:0 "イラン・イラク戦争は1980年9月から1988年8月まで続いたイランとイラクの間の武力紛争です。イラクによるイラン侵攻で戦闘が始まり、双方が国際連合安全保障理事会決議598を受諾するまで8年間続きました。"
    france_tunisia_war.t:0 "ビゼルト危機"
    france_tunisia_war.d:0 "ビゼルト危機は1961年7月、チュニジアがビゼルトのフランス海軍基地を撤退させようと封鎖を実施したことで発生しました。危機はフランス軍とチュニジア軍による3日間の戦闘に発展し、チュニジア側630名とフランス側24名の死者を出した末、1963年にフランスは市と海軍基地をチュニジアへ譲り渡すこととなりました。"
    yom_kippur_war.t:0 "ヨム・キプール戦争"
    yom_kippur_war.d:0 "ヨム・キプール戦争はラマダン戦争、十月戦争、1973年アラブ・イスラエル戦争、第四次アラブ・イスラエル戦争とも呼ばれ、1973年10月6日から25日にかけてイスラエルとエジプト・シリア率いるアラブ諸国連合との間で戦われた武力紛争です。"
    morocco_sahara_war.t:0 "西サハラの併合？"
    morocco_sahara_war.d:0 "西サハラの併合は1976年と1979年の二段階で行われました。1975年にスペインがスペイン領サハラの統治を放棄した直後、モーリタニアとモロッコの両国が同地を占領しました。1976年4月14日、両国は西サハラ分割協定によって同地を分け合い併合しました。"
    iraq_kuwait_war.t:0 "湾岸戦争？"
    iraq_kuwait_war.d:0 "1990年8月2日、独裁者サダム・フセインが統治するイラクは隣国クウェートへの侵攻を開始し、2日のうちに全土を占領しました。クウェート侵攻は直ちに国際的な非難を浴び、国連安全保障理事会（UNSC）は決議660を採択、さらに決議661で全会一致によりイラクへの経済制裁を科しました。1990年11月29日に採択された国連安保理決議678は、決議660を履行してクウェートから撤退する最後の機会を1991年1月15日までイラクに与え、さらに期限後は「あらゆる必要な手段」を用いてイラクをクウェートから排除する権限を各国に認めました。"
    soviet_afghan_war.t:0 "ソ連・アフガン戦争？"
    soviet_afghan_war.d:0 "ソビエト・アフガン戦争は1979年から1989年にかけてソ連の支配下にあったアフガニスタン民主共和国（DRA）で戦われた長期の武力紛争です。レオニード・ブレジネフの指揮のもと、ソ連がストーム333作戦で擁立された現地の親ソ政権を支援するためアフガニスタンへの侵攻を開始したことで戦争は始まりました。"
    vietnam_cambodian_war.t:0 "カンボジア侵略？"
    vietnam_cambodian_war.d:0 "1978年12月25日、15万のベトナム軍が民主カンプチアに侵攻し、わずか2週間でカンプチア革命軍を制圧してポル・ポト政権を終わらせました。同政権は1975年から1978年12月にかけてのカンボジア虐殺で全カンボジア人のおよそ4分の1を死に至らしめた責任を負っています。"
    russia_ukraine_war.t:0 "ロシア・ウクライナ戦争？"
    russia_ukraine_war.d:0 "ロシア・ウクライナ戦争は2014年2月に始まったロシアとウクライナの間の国際紛争です。ウクライナの尊厳の革命を受け、ロシアはウクライナからクリミアを併合し、ドンバス戦争でウクライナ軍と戦う親ロシア派分離主義者を支援しました。最初の8年間の紛争には海上での衝突やサイバー戦、政治的緊張の高まりも含まれます。2022年2月、ロシアはさらなる領土の併合と政権交代を目的としてウクライナへの全面侵攻を開始しました。"
    second_iraq_war.t:0 "イラク戦争？"
    second_iraq_war.d:0 "イラク戦争は2003年から2011年までイラクで続いた長期の武力紛争です。アメリカ主導の有志連合によるイラク侵攻で始まり、サッダーム・フセインのバアス党政権が打倒されました。その後も連合軍と侵攻後のイラク政府に抵抗する武装勢力が現れ、紛争はその後10年近く続きました。米軍は2011年に正式に撤退しました。"
    chad_libya_war.t:0 "トヨタ戦争？"
    chad_libya_war.d:0 "トヨタ戦争は1987年にチャド北部とチャド・リビア国境で起こり、チャド・リビア紛争の最終局面となりました。その名は、チャド軍がリビア軍と戦う際に機動力を得るため、また武装車両（テクニカル）として用いたトヨタのピックアップトラック、主にトヨタ・ハイラックスとトヨタ・ランドクルーザーに由来します。チャドはチャド北部のほぼ全域を奪回し、続く数か月でリビア軍にさらなる大敗を与え、9月に紛争を終結させる停戦が調印されました。"
    us_afghan_war.t:0 "アフガニスタン戦争？"
    us_afghan_war.d:0 "アフガニスタン戦争は2001年から2021年まで続いた武力紛争です。アメリカ主導の多国籍軍がアフガニスタンへの侵攻を開始したことで始まり、ターリバーンが支配するイスラム首長国を打倒し、3年後に国際的に承認されたイスラム共和国が樹立されました。"
    us_panama_war.t:0 "パナマ侵攻？"
    us_panama_war.d:0 "アメリカは1989年12月中旬、ジョージ・H・W・ブッシュ大統領の下でパナマに侵攻しました。侵攻の主な目的は、恐喝と麻薬密輸で米当局に指名手配されていたパナマの事実上の支配者マヌエル・ノリエガ将軍を排除することでした。「ジャストコーズ作戦」と名付けられたこの作戦は1990年1月下旬にノリエガの投降をもって終結しました。パナマ国防軍（PDF）は解体され、大統領に当選していたギジェルモ・エンダラが就任しました。"
    first_congo_war.t:0 "第一次コンゴ戦争？"
    first_congo_war.d:0 "第一次コンゴ戦争は主にザイール（この過程でコンゴ民主共和国へ改称されました）で発生した内戦であり国際的な軍事衝突でもあり、スーダンとウガンダにも大きく波及しました。紛争は最終的に外国による侵攻へと至り、ザイールのモブツ・セセ・セコ大統領は反乱指導者ローラン・デジレ・カビラに取って代わられました。その後カビラの不安定な政権は同盟者たちと対立し、1998年から2003年の第二次コンゴ戦争の下地となりました。"
    second_congo_war.t:0 "第二次コンゴ戦争？"
    second_congo_war.d:0 "第二次コンゴ戦争は第一次コンゴ戦争からわずか1年余り後の1998年8月にコンゴ民主共和国で始まり、いくつか同じ問題を抱えていました。やがてアフリカ大陸各地の勢力を巻き込み、2003年7月にコンゴ民主共和国移行政府が発足したことで公式に終結しました。"
    russia_georgia_war.t:0 "ロシア・ジョージア戦争？"
    russia_georgia_war.d:0 "ジョージア共和国はソビエト連邦の解体が進む1991年3月に独立を宣言しました。しかしジョージアと分離主義勢力の戦闘により、旧南オセチア自治州の一部はロシアの支援を受けつつ国際的には承認されない分離主義勢力の事実上の支配下に置かれました。1992年から1993年にアブハズ人分離主義勢力が戦争を起こしたアブハジア地方でも同様の膠着状態が生じました。2000年のロシアにおけるウラジーミル・プーチンの当選と2003年のジョージアでの親欧米的な政権交代を経て、ロシアとジョージアの関係は悪化し始めました。2008年4月にNATOがジョージアの加盟申請を検討すると約束したことで、関係は完全な外交危機に至りました。"
    israel_gaza_war.t:0 "イスラエル・ガザ戦争？"
    israel_gaza_war.d:0 "イスラエルとハマスを中心とするパレスチナ武装勢力との武力紛争は2023年10月7日から主にガザ地区とその周辺で行われ、ヨルダン川西岸やイスラエル・レバノン国境でも衝突が発生しました。この日、武装勢力はガザ地区から南部イスラエルへ奇襲攻撃を仕掛け、1973年の第四次中東戦争以来この地域で最も重大な軍事的エスカレーションの始まりとなりました。イスラエル軍はハマスの戦闘員を掃討した後、ハマスの目標に対する大規模な航空爆撃作戦で報復し、続いてガザへの大規模な地上侵攻を実施しました。"
    moldova_gagauzia_war.t:0 "ガガウジア紛争？"
    moldova_gagauzia_war.d:0 "ガガウジア紛争は、モルダビア・ソビエト社会主義共和国とその後独立したモルドバ共和国が、モルドバ国内でのさらなる自治を求めるガガウズ人住民と対立した紛争です。この紛争はモルダビアから分離したガガウズ共和国の宣言に至り、同国はソビエト連邦への残留を目指しましたが、ソ連の解体後には事実上の独立国家となりました。1995年にガガウジアが国内の自治領域単位として公式に承認され、正式にモルドバへ再統合されました。"
    uganda_tanzania_war.t:0 "ウガンダ・タンザニア戦争？"
    uganda_tanzania_war.d:0 "ウガンダ・タンザニア戦争は1978年10月から1979年6月までウガンダとタンザニアの間で戦われ、ウガンダ大統領イディ・アミンの失脚をもたらしました。開戦に先立ち、1971年にアミンがタンザニア大統領ジュリウス・ニエレレと親密だったミルトン・オボテ大統領を打倒したことで、ウガンダとタンザニアの関係は悪化していました。戦争勃発を巡る状況は明らかではなく、経緯については異なる説が存在します。1978年10月、ウガンダ軍はタンザニアへの侵入を始めました。同月後半にはウガンダ軍が侵攻を開始し、財産を略奪して民間人を殺害しました。ウガンダの公式メディアはカゲラ突出部の併合を宣言しました。"
    azerbaijan_artsakh_war.t:0 "ナゴルノ・カラバフの併合？"
    azerbaijan_artsakh_war.d:0 "2023年9月19日から20日にかけてアゼルバイジャンは自称独立国家アルツァフに対する大規模な軍事攻勢を開始しました。これは2020年の第二次ナゴルノ・カラバフ戦争の後に結ばれた停戦合意への違反と見なされています。9月28日アルツァフ大統領サムベル・シャフラマニャンは2024年1月1日までにすべての国家機関を解体する大統領令に署名し、この分離独立国家はその存在に終止符を打ちました。"
    us_libya_war.t:0 "リビアへの介入？"
    us_libya_war.d:0 "2011年3月19日NATO主導の多国籍連合軍が国連安全保障理事会決議1973（UNSCR 1973）を履行するためリビアへの軍事介入を開始しました。その目的はムアンマル・カダフィ政権の打倒です。アメリカとイギリスの海軍は110発を超えるトマホーク巡航ミサイルを発射して海上封鎖を敷き、フランス空軍・イギリス空軍・カナダ空軍はリビア全土で出撃を行いました。"
    us_grenada_war.t:0 "グレナダ侵攻？"
    us_grenada_war.d:0 "アメリカ合衆国によるグレナダ侵攻は1983年10月25日の夜明けに始まりました。アメリカとカリブ海6カ国の連合軍が、ベネズエラの北100マイル（160km）に浮かぶ島国グレナダへ侵攻したのです。米軍が「アージェント・フューリー作戦」と名付けたこの作戦は数日のうちに軍事占領をもたらしました。きっかけは人民革命政府内部の抗争であり、前指導者でグレナダ第2代首相のモーリス・ビショップの自宅軟禁と処刑、そしてハドソン・オースティンを議長とする革命軍事評議会の樹立を招きました。侵攻の結果暫定政府が任命され、1984年には選挙が実施されました。"
    us_dominican_republic_war.t:0 "ドミニカ共和国侵攻？"
    us_dominican_republic_war.d:0 "ドミニカ共和国の反乱勢力を共産主義者が支援しているとの疑惑から、アメリカは同国の紛争へ介入しました（作戦名「パワーパック作戦」）。介入は後に米州機構の米州平和軍による同国の占領へと移行します。1966年には選挙が行われ、その結果ホアキン・バラゲールが大統領の座に就きました。同じ年の後半に外国軍は同国から撤退しました。"
    ogaden_war.t:0 "オガデン戦争？"
    ogaden_war.d:0 "オガデン戦争は1977年7月から1978年3月にかけてエチオピアのオガデン地方をめぐりソマリアとエチオピアの間で戦われた軍事紛争です。"
    badme_war.t:0 "バドメ戦争？"
    badme_war.d:0 "エリトリア・エチオピア戦争、別名バドメ戦争は1998年5月から2000年6月にかけてエチオピアとエリトリアの間で起きた大規模な武力紛争です。1993年にエリトリアがエチオピアから独立した当初、両国の関係は友好的でした。しかし新たに引かれる国境線の位置をめぐる対立から関係は大きく悪化し、ついには全面戦争へと発展しました。"
    sino_vietnamese_war.t:0 "中越戦争？"
    sino_vietnamese_war.d:0 "中越戦争は1979年初頭に中国とベトナムの間で起きた短期間の紛争です。中国は1978年のベトナムによるカンボジア侵攻と占領への対抗として攻勢を開始しました。この侵攻により中国が支援するクメール・ルージュの統治は終わりを迎えていました。紛争は約1か月続き、中国は1979年3月に軍を撤退させました。"
    saudi_north_yemen_war.t:0 "北イエメンへの介入？"
    saudi_north_yemen_war.d:0 "北イエメン内戦は、1962年から1970年にかけて北イエメンで戦われた内戦で、ムタワッキル王国の支持者とイエメン・アラブ共和国の支持者が争いました。発端は1962年、アブドゥッラー・アッサラール指揮下の軍を率いた革命派共和主義者によるクーデターです。彼らは戴冠したばかりの国王でありイマームでもあるムハンマド・アル＝バドルを廃位し、アッサラールを大統領とする共和国の樹立を宣言しました。イマームはサウジアラビア国境へ逃れ、北部のシーア派部族から民衆の支持を集めて権力の奪還を図り、事態は急速に全面的な内戦へと拡大しました。"
    PRC_korean_war.t:0 "朝鮮戦争への介入？"
    PRC_korean_war.d:0 "1950年10月3日、中国はインドの大使館を通じ、国連軍が鴨緑江を越えるなら介入すると米国に警告しようとしました。しかしトルーマンをはじめとするワシントンの政策立案者はこの警告をはったりとみなし、米国は応じませんでした。一方10月13日、政治局はソ連の航空支援が無くとも介入する方針を決定します。装備に勝る敵も士気の優越によって打ち破れるという確信に基づく判断でした。こうして20万の人民志願軍（PVA）部隊が鴨緑江を越えて北朝鮮へ入りました。10月19日に密かに渡河した人民志願軍第13兵団は、10月25日に第一次戦役を発動し、中朝国境付近で前進する国連軍を攻撃しました。"
    NEJ_yemen_civil_war.t:0 "イエメン内戦に介入しますか？"
    NEJ_yemen_civil_war.d:0 "2015年3月26日、サウジアラビアは西アジアと北アフリカの9か国からなる連合を率いてイエメンへの介入に踏み切りました。イエメン内戦の最中にフーシ派の武装勢力によってサヌアを追われたイエメンのアブドラッボ・マンスール・ハーディー大統領から、あらためて共同での軍事支援要請があったことを受けたものです。"
    cenepa_war.t:0 "セネパ戦争？"
    cenepa_war.d:0 "セネパ戦争は、エクアドルとペルーの間で戦われた短期かつ局地的な軍事衝突であり、両国国境付近のペルー領内の地域（すなわちペルー共和国アマソナス州コンドルカンキ地方のコンドル山脈東側）の掌握をめぐって争われました。"
    yemenite_war.t:0 "イエメン戦争？"
    yemenite_war.d:0 "第二次イエメン戦争は、イエメン・アラブ共和国とイエメン人民民主共和国の間で起きた短期の軍事衝突です。1978年6月24日に北イエメン大統領アフマド・アル＝ガシュミが殺害され、その2日後には両イエメンの統合案に取り組んでいた穏健派マルクス主義者サリム・ルバイ・アリも殺害されたことで両国の関係が破綻し、この戦争へと発展しました。"
    sino_indian_war.t:0 "中国・インド戦争？"
    sino_indian_war.d:0 "中国・インド戦争は、1962年10月から11月にかけて中国とインドの間で発生した武力紛争です。これは中国・インド国境紛争が軍事的に激化したものでした。戦闘はインドと中国の国境沿い、ブータン東方のインド北東辺境特別区、そしてネパール西方のアクサイチンで行われました。紛争は1962年11月20日に中国が一方的に停戦を宣言し、同時に開戦前の位置、すなわち事実上の中印国境（実効支配線とも呼ばれます）への撤退を発表したことで終結しました。"
    IDO_MSY_war.t:0 "コンフロンタシ？"
    IDO_MSY_war.d:0 "インドネシア・マレーシア対決またはボルネオ対決（インドネシア、マレーシア、シンガポールでは単にコンフロンタシと呼ばれます）は、マラヤ連邦からマレーシアという国家を創設する動きにインドネシアが反対したことに端を発し、1963年から1966年まで続いた武力紛争です。1966年にインドネシアのスカルノ大統領が失脚すると、この争いは平和的に終結しました。"
    SAF_ANG_war.t:0 "サバンナ作戦？"
    SAF_ANG_war.d:0 "サバンナ作戦は、1975年から1976年にかけて行われたアンゴラへの軍事侵攻に南アフリカが付けた作戦名です。これは南アフリカ国境戦争の一環であり、アンゴラ独立戦争を契機として発生しました。その目的は、南アフリカに敵対する国家がアンゴラに誕生するのを阻止することでした。"
    USA_korean_war.t:0 "朝鮮戦争への介入？"
    USA_korean_war.d:0 "1950年6月25日、北の朝鮮人民軍（KPA）が38度線を越えて南下しました。国連安全保障理事会は侵攻を非難し、国連軍司令部にKPAの撃退を認めました。開戦から2か月で韓国軍（ROKA）と同盟軍はほぼ敗北し、釜山橋頭堡を保持するのみとなりました。しかし1950年9月、国連軍は仁川に上陸してKPAの部隊と補給線を遮断しました。国連軍は1950年10月に北朝鮮へ侵攻し、中国との国境である鴨緑江へ進軍しました。"
    india_hyderabad_war.t:0 "ハイダラーバードの併合？"
    india_hyderabad_war.d:0 "1947年11月、ハイダラーバードはインド自治領と現状維持協定を結び、藩王国へのインド軍駐留を除く従来の取り決めをすべて継続しました。インドはハイダラーバードに共産主義国家が成立すれば自国への脅威になると考えていました。ニザームの権力はテランガーナ反乱と、鎮圧しきれなかった過激民兵組織ラザカールの台頭によって弱まっていました。9月7日、ジャワハルラール・ネルーはニザームに最後通牒を突きつけ、ラザカールの禁止とセクンデラバードへのインド軍の復帰を要求しました。インドは1948年9月13日までに同国へ侵攻しました。"
    arab_israeli_war.t:0 "アラブ・イスラエル戦争？"
    arab_israeli_war.d:0 "1948年のアラブ・イスラエル戦争は第一次アラブ・イスラエル戦争としても知られ、1948年パレスチナ戦争の第二かつ最終段階として委任統治領パレスチナの内戦に続いて起こりました。この内戦は1948年5月14日のイスラエル独立宣言と、同日深夜のイギリスによるパレスチナ委任統治の終了、そして翌朝のアラブ諸国連合軍による委任統治領パレスチナへの進入によって、国家間の戦争へと変わりました。"
    first_indo_pakistan_war.t:0 "第一次印パ戦争？"
    first_indo_pakistan_war.d:0 "1947年から1948年の印パ戦争は第一次カシミール戦争としても知られ、藩王国ジャンムー・カシミールをめぐってインドとパキスタンの間で戦われた戦争です。"
    football_war.t:0 "サッカー戦争？"
    football_war.d:0 "サッカー戦争は1969年にエルサルバドルとホンジュラスの間で戦われた短期の軍事衝突です。両国間にくすぶっていた緊張が1970年FIFAワールドカップ予選での暴動と重なりました。戦争は1969年7月14日にエルサルバドル軍がホンジュラスへの攻撃を開始したことで始まりました。"
    agacher_strip_war.t:0 "アガシェル地帯戦争？"
    agacher_strip_war.d:0 "アガシェル地帯戦争は1985年12月25日から30日にかけてブルキナファソ北部の国境沿いに延びる全長160キロメートル（100マイル）の細長い土地をめぐり、ブルキナファソとマリの間で戦われた戦争です。戦争は停戦によって終結しました。"
    ISR_LEB_war.t:0 "リタニ作戦？"
    ISR_LEB_war.d:0 "1978年3月11日、11人のPLO戦闘員がイスラエルのハイファの南30キロの海岸に上陸し、乗客を満載したバスを乗っ取って乗っていた人々を殺害しました。沿岸道路虐殺として知られる事件です。これに対しイスラエルは1978年3月14日にリタニ作戦を発動し、2万5千の兵力でティルスの街を除くレバノン南部を占領しました。"
    SYR_LEB_war.t:0 "シリアのレバノン侵攻？"
    SYR_LEB_war.d:0 "1976年5月31日、シリア軍は2,000の兵力と60両の戦車で三方向からの攻勢をかけてレバノンへ侵攻しました。第一の縦隊はシューフを越えて南のシドンへ進軍しましたがPLO軍に阻まれました。第二の縦隊はベイルート・ダマスカス街道を西へ進みましたがベイルートで食い止められました。もう一つの縦隊はベカー高原を北上した後トリポリへ向けて西進しましたがキリスト教勢力に阻止されました。攻勢は6月10日までに頓挫しました。"
    vietnam_war_1975.t:0 "春季攻勢？"
    vietnam_war_1975.d:0 "米軍は1972年までにベトナムからおおむね撤退し、1973年のパリ和平協定により残る部隊も引き揚げました。協定はほぼ即座に破られて戦闘は続き、1975年の春季攻勢とベトナム人民軍（PAVN）によるサイゴン陥落をもって戦争は終結しました。南北ベトナムは1976年に統一されました。"
    ETH_SOM_border_war.t:0 "エチオピア・ソマリア国境戦争？"
    ETH_SOM_border_war.d:0 "エチオピア・ソマリア国境戦争は1982年6月から1983年8月にかけて発生し、エチオピアはソマリア中部へ大規模な侵攻を行いました。戦闘機と装甲部隊の支援の下、エチオピアは1万人規模の部隊と数千人のソマリア救国民主戦線（SSDF）の反乱軍を投入しました。この作戦は当初ソマリアの海岸線まで進撃し最終的にバーレ政権を打倒することを目指していました。しかしエチオピア軍とSSDFのゲリラは要衝であるガルカイヨとベレドウェインの攻略に失敗し、ソマリア軍は主攻撃の撃退に成功しました。その後戦況はガルドゴブとバランバレの国境の町をめぐる軍事的な膠着状態へと陥りました。"
    USA_SOM_1993_war.t:0 "ゴシックサーペント作戦？"
    USA_SOM_1993_war.d:0 "ゴシックサーペント作戦は1993年のソマリア内戦中にタスクフォース・レンジャーというコードネームのアメリカ軍部隊がソマリアのモガディシュで実施した軍事作戦です。作戦の主目的は国連部隊への攻撃を理由にUNOSOM IIから指名手配されていたソマリア国民同盟の指導者モハメド・ファッラ・アイディードの捕縛でした。作戦は1993年8月から10月にかけて行われ、アメリカ統合特殊作戦軍（JSOC）が指揮しました。1993年10月3日、この部隊はアイディードの側近2名を捕らえる任務を実行しました。任務は最終的にモガディシュの戦闘として知られる戦いへと発展しました。戦闘は極めて凄惨なものとなり、部隊はソマリア民兵に多大な損害を与えた一方で自らも甚大な被害を被りました。"
    ankoko_island_war.t:0 "アンココ島侵略？"
    ankoko_island_war.d:0 "1966年2月、ベネズエラ、イギリス、ガイアナの各政府はエセキボをめぐる領土問題の解決を目指してジュネーヴ合意に署名しました。ガイアナがイギリスから独立した5か月後の1966年10月、ベネズエラ軍はアンココ島の占領を開始しました。[4]ベネズエラ軍はただちに軍事施設と滑走路を建設しました。"
    Mauritania_Senegal_Border_War.t:0 "モーリタニア・セネガル国境戦争とは？"
    Mauritania_Senegal_Border_War.d:0 "モーリタニア・セネガル国境戦争（1989年〜1991年）は、土地と民族と国家的アイデンティティをめぐる対立から生じた激しい紛争です。1989年4月にセネガル川沿いでモーリタニアの牧畜民とセネガルの農民が衝突し緊張が噴出しました。当初は局地的な争いでしたが、やがて広範な民族的・外交的危機へと発展し、両政府は互いの国民を数万人規模で国外追放しました。歴史的な遺恨と人種的分断に煽られて住民同士の暴力も広がりました。数百人が死亡し25万人以上が家を追われています。戦争は1991年に脆弱な和平と国境の再開放をもって終結しましたが、そこに残された不信と避難の記憶は今なおモーリタニアとセネガルの関係を規定し続けています。"
    Heglig_Crisis_War.t:0 "ヘグリグ危機とは？"
    Heglig_Crisis_War.d:0 "ヘグリグ危機（2012年3月〜9月）は、石油資源の豊かなヘグリグ地域をめぐってスーダンと南スーダンの間で起きた短期間ながら激しい国境紛争です。2011年の南スーダン独立後、未解決の国境画定と石油収入の分配をめぐる対立が武力衝突へと発展しました。南スーダン軍はヘグリグ——南スーダンでの呼称はパンソウ——を占領して同地がユニティ州の一部であると主張し、一方のスーダンはこの地域に対する主権を主張しました。最終的にスーダンが支配を回復し、2012年9月に両国は国境と資源に関する合意に署名しました。"
    PAK_AFG_2026_war.t:0 "アフガニスタン・パキスタン戦争とは？"
    PAK_AFG_2026_war.d:0 "2026年2月21日、パキスタン空軍（PAF）はアフガニスタンのナンガルハル州・パクティカ州・ホースト州に対し空爆を実施しました。2026年2月26日にはアフガニスタンがパキスタンへの報復作戦を開始しています。これを受けてパキスタンはターリバーンに対する「ガザブ・リル・ハク作戦」を発動しました。その翌日、パキスタンはアフガニスタンとの「公然たる戦争」状態にあると宣言しました。"
    USA_PER_2026_war.t:0 "米イラン戦争とは？"
    USA_PER_2026_war.d:0 "2026年2月28日、アメリカとイスラエルはイランに対する大規模な共同軍事作戦を開始しました。ドナルド・トランプ大統領はこれを「大規模戦闘作戦」と表現しています。この事態の激化は、イランの核開発計画をめぐる土壇場の仲介協議が決裂したことを受けたものでした。"
    ETH_SOM_2006_war.t:0 "エチオピアのソマリア侵略？"
    ETH_SOM_2006_war.d:0 "エチオピアのソマリア侵略は2006年半ばから2009年初頭まで続いた武力紛争です。アメリカの支援を受けたエチオピア軍が、イスラム法廷連合（ICU）を打倒して暫定連邦政府（TFG）を樹立するためソマリアへ侵攻したことに始まります。紛争はやがて軍事占領へと発展し、反エチオピアの武装闘争が急速に拡大しました。2008年までに武装勢力は侵攻でICUが失った領域の大半を奪還しました。この紛争は1991年以降で2番目に大規模な住民の避難を引き起こしました。"
    USA_Saudi_Arabia_petrodollar.t:0 "ペトロダラー協定？"
    USA_Saudi_Arabia_petrodollar.d:0 "ペトロダラー協定は1974年に米国とサウジアラビアの間で結ばれた取り決めです。サウジアラビアは石油の販売価格を米ドルのみで設定し、余剰収入を米国債へ投資することとなりました。その見返りに米国は安全保障の保証と軍事装備を提供し、ドルを世界の石油取引を支配する通貨として確立しました。"
    HND_Indo_Sikkimese_Treaty.t:0 "インド・シッキム条約？"
    HND_Indo_Sikkimese_Treaty.d:0 "1950年12月5日に調印されたインド・シッキム条約により、シッキムはインドの保護国となりました。ハリスワル・ダヤルとチョギャルが取りまとめたこの協定のもとで、インドがシッキムの防衛・外交・戦略通信を担い、シッキムは内政の自治を保持しました。この体制は1975年にシッキムが併合されインド22番目の州となるまで続きました。"
    PRC_annexation_of_ETS_1949.t:0 "新疆の編入？"
    PRC_annexation_of_ETS_1949.d:0 "1949年夏、人民解放軍は甘粛省の河西回廊へ進撃し新疆へ迫りました。1949年10月1日に中華人民共和国（PRC）が成立し、人民解放軍の王震将軍は上官の彭徳懐から新疆の攻略を命じられました。1949年秋、中国共産党は中華民国（ROC）の政治指導部と三区の政治指導部それぞれと個別に合意を結びました。中国共産党は中華民国の省政府と軍の指導部を説得し降伏させたのです。"
    SKO_USA_military_command_1950.t:0 "米韓連合軍司令部？"
    SKO_USA_military_command_1950.d:0 "米韓連合軍司令部（CFC）は大韓民国軍と在韓米軍で構成される連合作戦司令部です。戦時には朝鮮半島で戦う韓国軍と米軍の陸・空・海（海兵隊を含む）および特殊作戦部隊すべての作戦指揮を担う司令部となります。CFCを通じてアメリカが大韓民国軍を完全に掌握しているかのような印象とは裏腹に、平時における韓国軍部隊は完全に独立しています。韓国軍がCFCの作戦指揮下に入るのは戦時のみです。"
    
