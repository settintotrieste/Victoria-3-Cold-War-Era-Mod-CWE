    praised_for_winning_war:0 "戦勝による称賛"
    blamed_for_losing_war:0 "敗戦による非難"
    blamed_for_pointless_war:0 "無益な戦争による非難"
    
    je_wartime_measures_martial_law_button:0 "戒厳令を布告する"
    je_wartime_measures_martial_law_button_desc:0 "戒厳令とは文民統治に代えて一時的に軍が権限を行使するもので、通常は戦争や反乱、自然災害の際に発動されます。戒厳令の施行中はその地域または国の軍司令官が法律を制定し執行する無制限の権限を持ちます。"
    je_wartime_measures_martial_law_remove_button:0 "戒厳令を解除する"
    je_wartime_measures_martial_law_remove_button_desc:0 "[concept_government]は戦争中いつでも戒厳令を解除できます。"
    recently_enacted_martial_law.tt:0 "戒厳令の布告から3か月以上が経過している"
    wartime_measures_martial_law:0 "戦時戒厳令"
    
    je_wartime_measures_rationing_button:0 "配給制を導入する"
    je_wartime_measures_rationing_button_desc:0 "配給制とは需要が高く供給が不足している物資やサービスを制限することです。政府が物資不足の影響を和らげ経済的困難に対処する手段として実施することが多くあります。"
    je_wartime_measures_rationing_remove_button:0 "配給制を終了する"
    je_wartime_measures_rationing_remove_button_desc:0 "[concept_government]は戦争中いつでも配給制を解除できます。"
    recently_enacted_wartime_measures_rationing.tt:0 "配給制の実施から3か月以上が経過しています"
    wartime_measures_rationing:0 "戦時配給制"
    
    je_wartime_measures_propaganda_button:0 "プロパガンダを広める"
    je_wartime_measures_propaganda_button_desc:0 "プロパガンダは戦争における強力な武器です。兵士や市民の心に偽りのイメージを植え付けることで、国内外の敵とされる者を非人間化し憎悪を煽ることができます。\n\nこの戦時措置が有効な間、毎月[concept_war_support]が5追加されます。"
    je_wartime_measures_propaganda_remove_button:0 "プロパガンダを停止する"
    je_wartime_measures_propaganda_remove_button_desc:0 "[concept_government]は戦争中いつでもプロパガンダの流布を停止できます。毎月の5[concept_war_support]の追加は行われなくなります。"
    recently_enacted_wartime_measures_propaganda.tt:0 "プロパガンダの流布から3か月以上が経過しています"
    wartime_measures_propaganda:0 "戦時プロパガンダ"
    
    je_wartime_measures_war_bonds_button:0 "戦時国債を発行する"
    je_wartime_measures_war_bonds_button_desc:0 "戦時国債とは戦争や紛争の際に軍事行動の資金を賄うため政府が発行する債券です。戦時国債の利回りは市場金利を下回っていたため、愛国心に訴える感情的な呼びかけによって市民から資金を集めました。"
    recently_enacted_wartime_measures_war_bonds.tt:0 "直近1か月間に戦時国債を発行していません"
    
    je_wartime_measures_total_war_button:0 "総力戦を宣言する"
    je_wartime_measures_total_war_button_desc:0 "政府は戦争遂行のため社会のあらゆる部門を動員し、健常な男性はすべて徴兵されます。"
