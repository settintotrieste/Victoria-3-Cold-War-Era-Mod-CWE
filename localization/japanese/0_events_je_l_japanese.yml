    subject_interactions.1.t.1: "新たな[SCOPE.sCharacter('relevant_character').GetPrimaryRoleTitle]の任命"
    subject_interactions.1.d: "[SCOPE.sCountry('target_country').GetName]の総督の地位にはいくつかの型の候補者が考えられます。どのような指導者を求めるべきでしょうか？"
    subject_interactions.1.d.1: "[SCOPE.sCountry('target_country').GetName]の[SCOPE.sCharacter('relevant_character').GetPrimaryRoleTitle]の地位にはいくつかの型の候補者が考えられます。どのような指導者を求めるべきでしょうか？"
    subject_interactions.1.f: "統治とは非常に繊細なものです。どの国にもそれぞれ固有の圧力やロビー団体、懸念事項があります。こうした問題をすべて盤上から一掃し、二度と我々の目的を妨げさせないようにするのが我々の務めです。"
