    je_start_inject_sovereign_fund_button:0 "資金の注入を開始"
    je_start_inject_sovereign_fund_button_desc:0 "[concept_treasury]が少なくとも@money!#yellow 10000#!を保有している場合、[concept_government]は毎月[ROOT.GetCountry.GetAdjectiveNoFlag]の[concept_treasury]から[concept_investment_pool]へ資金を移します。"
