    national_reconciliation:0 "国民和解"
    je_apartheid:0 "[ROOT.GetCountry.GetNameNoFlag]のアパルトヘイト"
    je_apartheid_reason:0 "アパルトヘイトとは、特定の文化が政治的・社会的・経済的に国を支配し続けることを確実にする目的で作られた、制度化された人種隔離の体制です。\n\n我々は$law_ethnostate$、$law_national_supremacy$、$law_racial_segregation$のいずれかの[concept_law]を制定しているため、現在[ROOT.GetCountry.GetName]でアパルトヘイト体制を運用しています。このアパルトヘイト体制は$law_multicultural$[concept_law]を制定した場合にのみ完全に解体されます。"
    
    je_develop_nuclear_weapons:0 "核兵器開発計画"
    je_develop_nuclear_weapons_reason:0 "[ROOT.GetCountry.GetName]は現在、独自の核兵器の開発を試みています。これは途方もない事業であり、[ROOT.GetCountry.GetAdjective]の科学者が$tech_military_nuclear_3$[concept_technology]を研究し、軍が国内に少なくとも1つの$building_nuclear_weapons_silo$[concept_building]を建設する必要があります。"
    je_develop_nuclear_weapons_1.tt:0 "国内に$building_nuclear_weapons_silo$[concept_building]が少なくとも1つ存在します"
    je_develop_nuclear_weapons_2.tt:0 "いかなる国とも$pause_nuclear_weapons_development$を有していません"
    
    je_develop_chemical_weapons:0 "化学兵器開発計画"
    je_develop_chemical_weapons_reason:0 "[ROOT.GetCountry.GetName]は現在、独自の化学兵器の開発を試みています。これには[ROOT.GetCountry.GetAdjective]の科学者が$tech_military_support_1$ [concept_technology]を研究し、軍が国内に少なくとも1つの$building_industrial_chemicals_factory$ [concept_building]を建設する必要があります。"
    je_develop_chemical_weapons_1.tt:0 "国内に$building_industrial_chemicals_factory$ [concept_building]が少なくとも1つあります"
    
    je_develop_chemical_weapons_goal:0 "化学兵器開発計画の進捗が100％"
    
    je_develop_biological_weapons:0 "生物兵器開発計画"
    je_develop_biological_weapons_reason:0 "[ROOT.GetCountry.GetName]は現在、独自の生物兵器の開発を試みています。これには[ROOT.GetCountry.GetAdjective]の科学者が$tech_agriculture_4$ [concept_technology]を研究し、軍が国内に少なくとも1つの$building_university$ [concept_building]を建設する必要があります。"
    je_develop_biological_weapons_1.tt:0 "国内に$building_university$ [concept_building]が少なくとも1つあります"
    
    je_develop_biological_weapons_goal:0 "生物兵器開発計画の進捗が100％"
    
    political_survivor:0 "政界の生き残り"
    
    gold_standard_leader:0 "金本位制リーダー"
    je_bretton_woods_system_leader.1.tt:0 "$law_gold_standard$を持つ国の[concept_gdp]が[SCOPE.sCountry('bretton_woods_system_leader').GetName]を上回っています"
    je_bretton_woods_system_leader.2.tt:0 "世界のどの国も$law_semi_gold_standard$を持っていません"
    je_bretton_woods_system_leader.3.tt:0 "この国は$law_gold_standard$を持つすべての国の中で最も高い[concept_gdp]を持っています"
    je_bretton_woods_system_leader:0 "ブレトン・ウッズ体制"
    je_bretton_woods_system_leader_reason:0 "[SCOPE.sCountry('bretton_woods_system_leader').GetName]が主導するブレトン・ウッズ体制は、独立国家間の通貨関係を規律するために全面的な交渉を経て築かれた通貨秩序です。この体制の下で各国は、自国通貨を固定平価の1％以内で[SCOPE.sCountry('bretton_woods_system_leader').GetAdjectiveNoFlag]のドルへ交換できることを保証する義務を負い、ドルは外国政府や中央銀行に対して純金1トロイオンスあたり定められた量で金地金と交換可能とされました。\n\nこの体制の効果として、$law_semi_gold_standard$を持つすべての国の$lawgroup_monetary_policy$は[ROOT.GetCountry.GetName]のものとは逆になります。"
    je_bretton_woods_system_leader_status:0 "署名国：[GetPlayer.MakeScope.Var('bretton_woods_total_members').GetValue]"
    je_bretton_woods_system_member.1.tt:0 "世界のどの国も$gold_standard_leader$ではありません"
    je_bretton_woods_system_member.2.tt:0 "$gold_standard_leader$である国が存在します"
    je_bretton_woods_system_member.3.tt:0 "この国は[concept_currency_union]の加盟国です"
    je_bretton_woods_system_member.4.tt:0 "この国は[concept_currency_union]の加盟国ではありません"
    je_bretton_woods_system_member:0 "ブレトン・ウッズ体制"
    je_bretton_woods_system_member_reason:0 "[SCOPE.sCountry('bretton_woods_system_leader').GetName]が主導するブレトン・ウッズ体制は、独立国家間の通貨関係を統御するために全面的な交渉を経て築かれた通貨秩序です。この体制の下で各国は、固定平価の1%以内で自国通貨を[SCOPE.sCountry('bretton_woods_system_leader').GetAdjectiveNoFlag]ドルへ交換できることを保証する義務を負い、ドルは外国政府と中央銀行に対して純金1トロイオンスあたり一定額で金地金と交換可能とされました。\n\nこの体制の効果として、$law_semi_gold_standard$を有するすべての国の$lawgroup_monetary_policy$は[SCOPE.sCountry('bretton_woods_system_leader').GetName]のものと反対になります。"
    je_bretton_woods_system_member_status:0 "署名国：[GetPlayer.MakeScope.Var('bretton_woods_total_members').GetValue]"
    
    je_perestroika:0 "ペレストロイカ"
    je_perestroika_reason:0 "民主的な[concept_ruler]である[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')][SCOPE.sCharacter('perestroika_ruler').GetFullName]が、[ROOT.GetCountry.GetName]のための大胆な計画を発表しました。全面的な中央経済計画を廃止し政治的統制を緩和した$gov_soviet_republic$へと国を改革するというのです。そのため[SCOPE.sCharacter('perestroika_ruler').GetFullName]は、この新たな労働者の楽園を築く[Concept('concept_law', '$concept_laws$')]の制定を目指しています。\n\nただし[ROOT.GetCountry.GetName]の共産主義強硬派はこの計画を快く思わず、[SCOPE.sCharacter('perestroika_ruler').GetFullName]の排除を求めて扇動するでしょう。"
    
    icj_judgement_winner.t:0 "国際司法裁判所の有利な判決"
    icj_judgement_winner.d:0 "国際司法裁判所は[SCOPE.sCountry('icj_judgement_winner').GetNameNoFlag]対[SCOPE.sCountry('icj_judgement_loser').GetNameNoFlag]の領土仲裁裁判において[SCOPE.sCountry('icj_judgement_winner').GetName]の主張を認め、係争中の[SCOPE.sCountry('icj_judgement_loser').GetName]の[concept_homeland]は正当かつ排他的に[SCOPE.sCountry('icj_judgement_winner').GetAdjective]のものであるとの判断を示しました。これにより裁判所は[SCOPE.sCountry('icj_judgement_loser').GetName]に対し、それらを[SCOPE.sCountry('icj_judgement_winner').GetName]へ返還するよう命じました。"
    icj_judgement_winner.f:0 "[SCOPE.sCountry('icj_judgement_loser').GetName]は、保有する[SCOPE.sCountry('icj_judgement_winner').GetAdjective]と[SCOPE.sCountry('icj_judgement_loser').GetAdjective]の故郷すべてにおいて故郷を失いません。[SCOPE.sCountry('icj_judgement_loser').GetName]はそれらの州を返還するかどうかを選択できるようになります。"
    icj_judgement_winner.option:0 "正義は果たされた！"
    
    icj_judgement_loser_target.t:0 "国際司法裁判所の不利な判決"
    icj_judgement_loser_target.d:0 "国際司法裁判所は[SCOPE.sCountry('icj_judgement_winner').GetNameNoFlag]対[SCOPE.sCountry('icj_judgement_loser').GetNameNoFlag]の領土仲裁裁判において[SCOPE.sCountry('icj_judgement_winner').GetName]の主張を認め、[SCOPE.sCountry('icj_judgement_loser').GetName]の係争中の[concept_homeland]は正当かつ排他的に[SCOPE.sCountry('icj_judgement_winner').GetAdjective]のものであると判示しました。これにより裁判所は[SCOPE.sCountry('icj_judgement_loser').GetName]に対しそれらを[SCOPE.sCountry('icj_judgement_winner').GetName]へ返還するよう命じました。"
    icj_judgement_loser_target.f:0 "[SCOPE.sCountry('icj_judgement_loser').GetName]はそれらを[SCOPE.sCountry('icj_judgement_winner').GetName]へ返還することを選んでも[SCOPE.sCountry('icj_judgement_winner').GetAdjective]と[SCOPE.sCountry('icj_judgement_loser').GetAdjective]のすべての故地において故地を失いません。"
    icj_judgement_loser.option.1:0 "裁判所の判決を受け入れる"
    icj_judgement_loser.option.2:0 "裁判所は誤っていた！"
    
    icj_judgement_rejection.t:0 "[SCOPE.sCountry('icj_judgement_loser').GetName]が国際司法裁判所の判決を拒否"
    icj_judgement_rejection.d:0 "[SCOPE.sCountry('icj_judgement_loser').GetName]は[SCOPE.sCountry('icj_judgement_winner').GetName]に有利な国際司法裁判所の判決を承認することを拒否しました。判事らは偏向しており国際法の適用を誤ったと主張しており、その判決が[SCOPE.sCountry('icj_judgement_loser').GetName]に承認されることはありません。"
    icj_judgement_rejection.f:0 "[SCOPE.sCountry('icj_judgement_loser').GetName]は保有する[SCOPE.sCountry('icj_judgement_winner').GetAdjective]と[SCOPE.sCountry('icj_judgement_loser').GetAdjective]のすべての故地において故地を維持します。"
    icj_judgement_rejection.option:0 "国際法など笑い話だ"
    
    icj_judgement_loser.t:0 "国際司法裁判所の不利な判決"
    icj_judgement_loser.d:0 "国際司法裁判所は[SCOPE.sCountry('icj_judgement_winner').GetName]対[SCOPE.sCountry('icj_judgement_loser').GetName]の領土仲裁裁判において[SCOPE.sCountry('icj_judgement_winner').GetName]の主張を認め、[SCOPE.sCountry('icj_judgement_winner').GetName]の係争中の[concept_homeland]は正当かつ排他的に[SCOPE.sCountry('icj_judgement_winner').GetAdjective]のものであると判示しました。これにより裁判所は両国間の国境について変更を命じませんでした。"
    icj_judgement_loser.f:0 "[SCOPE.sCountry('icj_judgement_loser').GetName]は[SCOPE.sCountry('icj_judgement_winner').GetName]が保有する[SCOPE.sCountry('icj_judgement_winner').GetAdjective]と[SCOPE.sCountry('icj_judgement_loser').GetAdjective]のすべての故地において故地を失いません。"
    
    won_a_war.t:0 "戦争に勝利"
    won_a_war.d:0 "[ROOT.GetCountry.GetName]は参戦していた戦争で勝利を収めました。[ROOT.GetCountry.GetAdjectiveNoFlag]の国民は歓喜し[SCOPE.sCharacter('war_ruler_scope').GetFullName]と[SCOPE.sCharacter('supreme_commander_scope').GetFullName]将軍の指導を称賛しています！"
    won_a_war.f:0 "このイベントは[ROOT.GetCountry.GetName]が[concept_war]において[concept_war_goal]を強制したために発生しました。"
    won_a_war.option:0 "素晴らしい！"
    
    lost_a_war.t:0 "戦争に敗北"
    lost_a_war.d:0 "[ROOT.GetCountry.GetName]は参戦していた戦争で敗北しました。[ROOT.GetCountry.GetAdjectiveNoFlag]の国民は激怒し恥ずべき敗北の責任を[SCOPE.sCharacter('war_ruler_scope').GetFullName]と[SCOPE.sCharacter('supreme_commander_scope').GetFullName]将軍の指導に帰しています！"
    lost_a_war.f:0 "このイベントは[ROOT.GetCountry.GetName]が[concept_war]において降伏したために発生しました。"
    lost_a_war.option:0 "仕方がない。"
    
    inconclusive_war.t:0 "戦争が終結"
    inconclusive_war.d:0 "[ROOT.GetCountry.GetName]は参戦した戦争で多くの血と財を費やしましたが、自国は何も得られませんでした。[ROOT.GetCountry.GetAdjectiveNoFlag]の国民は自国が他者の利益のために戦ったことに不満を抱いており、この無益な戦争を招いた[SCOPE.sCharacter('war_ruler_scope').GetFullName]と[SCOPE.sCharacter('supreme_commander_scope').GetFullName]将軍の指導を批判しています！"
    inconclusive_war.f:0 "このイベントは、[ROOT.GetCountry.GetName]が[concept_war]で降伏もせず、[ROOT.GetCountry.GetName]の[concept_war_goal]も強制しなかったため発生しました。"
    inconclusive_war.option:0 "全力は尽くした……"
    
    won_a_war_event.tt:0 "政府および軍事キャラクターの人気度が上昇"
    lost_a_war_event.tt:0 "政府および軍事キャラクターの人気度が低下"
    
