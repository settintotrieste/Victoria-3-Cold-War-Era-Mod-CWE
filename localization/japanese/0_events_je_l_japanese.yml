    je_start_imperial_preference_button:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('imperial_conference_custom_adjective')]特恵を制定"
    je_start_imperial_preference_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('imperial_conference_custom_adjective')]特恵は[ROOT.GetCountry.GetAdjective]帝国全域で施行される相互的な関税引き下げの制度です。その目的は帝国内の貿易を促進することにあります。\n\nゲーム上では[SCOPE.GetRootScope.GetCountry.GetCustom('imperial_conference_custom_adjective')]特恵は[ROOT.GetCountry.GetName]が[concept_dominion]と[concept_customs_union]を共有することで表現されます。"
    
