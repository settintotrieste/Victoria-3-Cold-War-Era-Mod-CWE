    warlord_state_start.t:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]の軍閥の台頭"
    warlord_state_start.d:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]の中央政府の弱体化に乗じて各地の軍司令官がそれぞれの管轄区域を掌握しました。彼らの政権は名目上はなお[ROOT.GetCountry.GetName]への忠誠を表明していますが、その狙いが[ROOT.GetCountry.GetCapital.GetCityHubName]の国際的に承認された現政府の打倒にあることは明らかです。"
    warlord_state_start.f:0 "中央政府が弱体であり、#r 不忠#!の[concept_general]または[concept_official_character][Concept('concept_character', '$concept_characters$')]が存在するため、このイベントが発生しました。"
