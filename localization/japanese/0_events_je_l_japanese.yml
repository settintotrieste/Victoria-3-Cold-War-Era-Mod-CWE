    develop_cybersin_decision:0 "社会主義サイバネティクス網を建設する"
    develop_cybersin_decision_desc:0 "1960年代初頭から共産党は既存のスターリン主義的な指令型計画から脱却し、サイバネティクスの原理に基づく相互接続されたコンピューターによる資源配分システムの開発を検討していました。この開発は最適計画へ移行する土台とみなされ、情報の分散化と革新に基づくより高度な社会主義経済の基礎となり得るものでした。"
    
    je_develop_cybersin:0 "サイバネティクス網の建設"
    je_develop_cybersin_reason:0 "計画では首都にコンピューターセンターを置き、他の主要都市に最大200の中位センター、経済的に重要な地点に最大20,000の端末を配置する3層のネットワークを建設し、既存の電話網を用いてリアルタイムで通信させます。この構造ではどの端末も他の任意の端末と通信できます。完成したネットワークは中央統計局が運用します。\n\nヒント：[Concept('concept_government_wage', '$concept_government_wages$')]を増やすとサイバーシンの月間進捗量が増加します。"
    
    je_cybersin_system:0 "社会主義サイバネティクス・ネットワーク"
    je_cybersin_system_reason:0 "全国自動化システム（OGAS）は既存および新設の電話線の上に構築された、リアルタイムで遠隔アクセス可能な全国規模のコンピューターネットワークです。計画経済のあらゆる工場と企業に神経系のように張り巡らされています。そのネットワークは国家と経済の3層ピラミッド構造に倣って階層化されており、首都の中央コンピューターセンターが主要都市の最大200か所の中位コンピューターセンターに接続し、それらがさらに国民経済の主要生産拠点に配置された最大20,000台のコンピューター端末へとつながります。"
    
