    power_vacuum.t:0 "[ROOT.GetCountry.GetNameNoFlag]の権力の空白"
    power_vacuum.d:0 "[ROOT.GetCountry.GetNameNoFlag]の前[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は強力な独裁者であり、何者にも挑まれることのない専制者として国を支配していました。しかし独裁者の死は反対派を抑えつけてきた鉄の蓋を取り払い、権力の空白を生んで国を大きく不安定化させました。今や様々な派閥がこの状況につけ込み、さらなる権力を求めて争い、あるいは政府そのものの転覆さえ目論んでいます。[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')][ROOT.GetCountry.GetRuler.GetFullName]が相争う諸部族を抑え政治的な泥沼に終止符を打つには、しばらく時間がかかるでしょう。"
    power_vacuum.f:0 "このイベントは独裁的な統治者が老齢で死亡したか交代したために発生しました。"
    power_vacuum.option:0 "新たな[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は長続きするだろうか？"
    
