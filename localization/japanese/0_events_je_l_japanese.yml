    rio_pact_leader:0 "リオ協定主導国"
    form_rio_pact_decision:0 "米州相互援助条約を締結する"
    form_rio_pact_decision_desc:0 "米州相互援助条約（通称リオ協定）は、1947年にリオデジャネイロで南北アメリカの多くの国々の間で署名された協定です。その条文が定める中心的な原則は、一国への攻撃を全加盟国への攻撃とみなすというものです。これは「半球防衛」ドクトリンとして知られていました。それにもかかわらず複数の加盟国が幾度となく条約に違反してきました。この条約は1947年に創設され、条約第22条に従って1948年に発効しました。"
    join_rio_pact_decision:0 "米州相互援助条約（リオ条約）に加盟する"
    join_rio_pact_decision_desc:0 "米州相互援助条約（通称リオ協定）は、1947年にリオデジャネイロで南北アメリカの多くの国々の間で署名された協定です。その条文が定める中心的な原則は、一国への攻撃を全加盟国への攻撃とみなすというものです。これは「半球防衛」ドクトリンとして知られていました。それにもかかわらず複数の加盟国が幾度となく条約に違反してきました。この条約は1947年に創設され、条約第22条に従って1948年に発効しました。注：申請の処理には通常1か月ほどかかります。"
    leave_rio_pact_decision:0 "米州相互援助条約（リオ協定）を脱退する"
    leave_rio_pact_decision_desc:0 "米州相互援助条約（通称リオ協定）は、1947年にリオデジャネイロで南北アメリカの多くの国々の間で署名された協定です。その条文が定める中心的な原則は、一国への攻撃を全加盟国への攻撃とみなすというものです。これは「半球防衛」ドクトリンとして知られていました。それにもかかわらず複数の加盟国が幾度となく条約に違反してきました。この条約は1947年に創設され、条約第22条に従って1948年に発効しました。"
