    je_war_system:0 "[ROOT.GetCountry.GetAdjectiveNoFlag]の戦争評議会"
    je_war_system_reason:0 "[ROOT.GetCountry.GetName]が現在[concept_war]に参戦しているため、[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')][ROOT.GetCountry.GetRuler.GetFullName]によって戦時内閣が組織され、[SCOPE.sCharacter('supreme_commander_scope').GetFullName]将軍が戦争遂行の全責任を負うことになりました。[ROOT.GetCountry.GetAdjectiveNoFlag]の国民は最終的な勝利を待ち望んでおり、それが実現しなければ大いに失望するでしょう。"
    
