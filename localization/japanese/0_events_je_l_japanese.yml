    je_commence_democratic_reform_button:0 "民主化改革を開始する"
    je_commence_democratic_reform_button_desc:0 "現行の[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は[SCOPE.GetRootScope.GetCountry.GetCustom('cabinet_name_custom_title')]によって民主的なものへと置き換えられ、[concept_government]はより自由主義的な[Concept('concept_law','$concept_laws$')]の施行に着手できるようになります。"
    
    unconstitutional_state_of_emergency.t:0 "違憲の非常事態宣言"
    unconstitutional_state_of_emergency.d:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('supreme_court_name')]は、[ROOT.GetCountry.GetRuler.GetFullName]の[ROOT.GetCountry.GetName]における非常事態宣言について、国内に実際の緊急事態が存在しない時期に発動されたものであり違法であるとの判断を示しました。よって裁判所は政府に対し非常事態の解除を命じます。"
    unconstitutional_state_of_emergency.f:0 "このイベントは[ROOT.GetCountry.GetName]が[concept_war]でも[concept_revolution]でもないために発生しました。"
