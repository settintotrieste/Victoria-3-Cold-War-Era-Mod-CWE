    soviet_north_korea.indy.t:0 "北朝鮮の独立？"
    soviet_north_korea.indy.d:0 "第二次世界大戦末期の日本の降伏を受けて1945年、朝鮮は北緯38度線を境に2つの地域へ分割され、北部をソ連が、南部をアメリカが占領しました。1948年には朝鮮にそれぞれ別個の政府が成立しました。北部には社会主義でソ連寄りの朝鮮民主主義人民共和国が、南部には資本主義で西側寄りの大韓民国が誕生しました。"
    soviet_afghanistan.indy.t:0 "アフガニスタンから撤退する？"
    soviet_afghanistan.indy.d:0 "1985年3月にソビエト連邦共産党書記長となったミハイル・ゴルバチョフは、政治局に選出されて間もなくアフガニスタンからの軍事的撤退の計画に着手しました。その指導の下でソ連はアフガニスタン人民民主党（PDPA）による権力基盤の強化を支援しようとし、アフガニスタン秘密警察（KHAD）の元長官モハンマド・ナジーブッラーが書記長に選出され後に革命評議会議長にも就任するとともに、ソ連軍は段階的にアフガニスタンから撤退していきました。ソ連軍の撤退後もゴルバチョフ政権は反体制勢力に対抗するナジーブッラーを軍事的・政治的に支援し続けました。"
    
