    OECD_expulsion.f:0 "このイベントは、この国が自治権の不十分な従属国になったか、条件を満たさない政体になったか、あるいは国際的に阻害されたために発生しました。"
    
    join_WTO_decision:0 "世界貿易機関に加盟する"
    join_WTO_decision_desc:0 "世界貿易機関（WTO）は国際貿易を規制し円滑化する政府間機関です。WTOは貿易協定を交渉するための枠組みを提供することで、加盟国間の物品・サービス・知的財産の貿易を促進します。これらの協定は通常、関税や数量制限その他の制限の削減または撤廃を目指します。"
    leave_WTO_decision:0 "世界貿易機関を脱退する"
    leave_WTO_decision_desc:0 "世界貿易機関（WTO）は国際貿易を規制し円滑化する政府間機関です。WTOは貿易協定を交渉するための枠組みを提供することで、加盟国間の物品・サービス・知的財産の貿易を促進します。これらの協定は通常、関税や数量制限その他の制限の削減または撤廃を目指します。"
