    je_secret_police_system_dismiss_spymaster_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は[SCOPE.GetRootScope.GetCountry.GetCustom('secret_police_custom_title')]の長官を解任します。"
    
