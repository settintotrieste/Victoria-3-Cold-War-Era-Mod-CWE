    je_un_peacekeeping_system_reason:0 "[SCOPE.sCountry('un_peacekeeping_applicant_scope').GetName]は国連総会に決議案を提出し、[SCOPE.sCountry('un_peacekeeping_applicant_enemy_scope').GetName]とそのすべての共同交戦国に即時の敵対行為停止を要求することで、全メンバーが[SCOPE.sCountry('un_peacekeeping_applicant_scope').GetAdjectiveNoFlag]・[SCOPE.sCountry('un_peacekeeping_applicant_enemy_scope').GetAdjectiveNoFlag]戦争に介入するよう求めています。\n\n申請国：[SCOPE.sCountry('un_peacekeeping_applicant_scope').GetName]\n\n標的国：[SCOPE.sCountry('un_peacekeeping_applicant_enemy_scope').GetName]\n\n安保理の投票差：[GetPlayer.MakeScope.Var('unsc_peackeeping_vote_count_var_display').GetValue]／安保理メンバー総数：[GetPlayer.MakeScope.Var('unsc_members_count_display').GetValue]\n\n国連総会の投票差：[GetPlayer.MakeScope.Var('unga_peackeeping_vote_count_var_display').GetValue]／国連総会メンバー総数：[GetPlayer.MakeScope.Var('unga_members_count_display').GetValue]"
