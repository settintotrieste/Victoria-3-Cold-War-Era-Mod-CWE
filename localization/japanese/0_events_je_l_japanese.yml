    je_secret_police_system:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('secret_police_custom_title')]"
    je_secret_police_system_status:0 "忠実性：[GetPlayer.MakeScope.Var('secret_police_loyalty').GetValue]％\n利用可能な秘密工作ポイント：[GetPlayer.MakeScope.Var('secret_police_action_points').GetValue]"
    je_secret_police_system_reason:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('secret_police_custom_title')]は[ROOT.GetCountry.GetName]の秘密警察です。\n\n秘密警察（または政治警察）とは政府の政治的・宗教的・社会的な反対者や反体制派に対して秘密工作を行う警察・情報機関・治安機関のことです。独裁者や政権の政治権力を守り、しばしば法の枠外で活動して反体制派を弾圧し政治的反対勢力を弱体化させます。その際に暴力を用いることも少なくありません。\n\n利用可能な秘密工作ポイント：[GetPlayer.MakeScope.Var('secret_police_action_points').GetValue]\n\n情報長官：[SCOPE.sCharacter('head_of_intelligence').GetFullName]（[SCOPE.gsInterestGroup('secret_police_IG').GetName]）\n\n機関の忠実性：[GetPlayer.MakeScope.Var('secret_police_loyalty').GetValue]％\n\n注意：[SCOPE.GetRootScope.GetCountry.GetCustom('secret_police_custom_title')]は忠実性が50％を下回ると[concept_government]に敵対する行動をとります。\n\nヒント：[SCOPE.GetRootScope.GetCountry.GetCustom('secret_police_custom_title')]の忠実性は[SCOPE.sCharacter('head_of_intelligence').GetFullName]の[concept_loyalty]と等しくなります。"
    
