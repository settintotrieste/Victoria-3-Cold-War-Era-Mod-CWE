    je_civil_service_system_subvert_civil_service_button:0 "官僚機構の掌握"
    je_civil_service_system_subvert_civil_service_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は[ROOT.GetCountry.GetAdjectiveNoFormatting]の官僚機構に属する不忠な者たちに辞職するよう圧力をかけ、思想的に忠実な官僚と入れ替えます。"
    
    je_civil_service_system_reform_civil_service_button:0 "官僚機構の改革"
    je_civil_service_system_reform_civil_service_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は国民を代表する官僚を要職に任命し、官僚機構の思想傾向が民意を反映したものとなるようにします。"
    
    je_civil_service_system_restore_civil_service_button:0 "官僚機構の脱政治化"
    je_civil_service_system_restore_civil_service_button_desc:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('government_ruler_custom_title')]は[ROOT.GetCountry.GetAdjectiveNoFormatting]の官僚機構が自ら人員を任命することを認めます。これにより官僚機構はエリート主義的かつテクノクラート的な組織となるでしょう。"
    
