    je_german_unification:0 "ドイツ再統一"
    je_german_unification_reason:0 "第二次世界大戦後、ドイツは東西に分断され（ベルリンもまた分割されました）、ソ連圏と西側諸国の間の冷戦による分断を象徴する存在となりました。双方で経済成長と政治的安定が進んだにもかかわらず、多くのドイツ人は国民の統一と共通のアイデンティティを取り戻し、イデオロギー対立を超えた未来を築くために再統一を望み続けました。"
    
    je_austrian_unification:0 "オーストリア再統一"
    je_austrian_unification_reason:0 "第二次世界大戦後、オーストリアは占領地区に分割され連合国の管理下に置かれました。再統一への願いは主権を回復し統治を一本化して外部の支配から脱し、統一されたオーストリア国家を築こうとする意志の表れでした。"

    je_chinese_unification:0 "中国再統一"
    je_chinese_unification_reason:0 "国共内戦の後、中華民国と中華人民共和国という対立する政府が生まれました。再統一の問題は競合する主権の主張を解決し政治体制を統合して、国際秩序における中国の役割を再定義することにかかっています。"

    je_vietnamese_unification:0 "ベトナム再統一"
    je_vietnamese_unification_reason:0 "ベトナムは植民地支配とその後の紛争を経て南北に分断されました。再統一はイデオロギーによる分断を乗り越え、単一の政府を樹立し統一された指導の下で国家を再建する試みでした。"

    je_korean_unification:0 "朝鮮再統一"
    je_korean_unification_reason:0 "朝鮮半島は第二次世界大戦後、冷戦の対立を反映して南北に分断されました。再統一は民族の統一を取り戻し政治的な違いを乗り越え、東アジアの地域情勢を塗り替えるという願いであり続けています。"

    je_yemeni_unification:0 "イエメン再統一"
    je_yemeni_unification_reason:0 "北イエメンと南イエメンはそれぞれ異なる政治的道のりを経て別々に発展しました。再統一はこれらの国家を単一の国民国家に統合し、統治と経済統合、そしてアラビア半島の地域的安定の均衡を図ろうとするものでした。"
    
    je_german_unification_button:0 "ドイツを再統一する"
    je_german_unification_button_desc:0 "ドイツ再統一のプロセスを開始します。これにより分断されたドイツ諸国家が単一の国家に統合され、新たな現実に合わせて政治構造・経済体制・外交関係が変化します。"
    GER_has_same_gov_type_tt:0 "#y $WGR$#!、#y $EGR$#!、#y $SGR$#!はすべて同じ[concept_government_type]です"
    
    je_austrian_unification_button:0 "オーストリアを再統一する"
    je_austrian_unification_button_desc:0 "オーストリア再統一の手続きを開始します。これにより分断されたオーストリアの諸国家は単一の国家に統合され、新たな現実に合わせて政治構造、経済体制、外交関係が変化します。"
    AUS_has_same_gov_type_tt:0 "#y $WAU$#!と#y $EAU$#!は同じ[concept_government_type]です"
    
    je_chinese_unification_button:0 "中国を再統一する"
    je_chinese_unification_button_desc:0 "中国再統一の手続きを開始します。これにより分断された中国の諸国家は単一の国家に統合され、新たな現実に合わせて政治構造、経済体制、外交関係が変化します。"
    CHI_has_same_gov_type_tt:0 "すべての#y 中国系国家#!が同じ[concept_government_type]です"

