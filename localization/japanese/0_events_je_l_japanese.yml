    olympics_commencement_date.tt:0 "開催時期は[GetPlayer.MakeScope.Var('olympic_games_year_display').GetValue]の夏です"
    olympics_not_host_country.tt:0 "この国はオリンピックの開催国ではありません"
    olympic_infrastructure_timer.tt:0 "過去6か月間にオリンピックインフラを建設していません"
