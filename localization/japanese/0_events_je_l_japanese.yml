    je_climate_change_reforestation_start_button:0 "森林再生政策を開始する"
    je_climate_change_reforestation_start_button_desc:0 "森林再生とは、破壊あるいは損傷する以前の森林や樹林地を回復させる取り組みです。\n\nこの政策を制定することで、気候変動の速度を遅らせることができます。"
    je_climate_change_reforestation_end_button:0 "森林再生政策を終了する"
    je_climate_change_reforestation_end_button_desc:0 "森林再生とは、破壊あるいは損傷する以前の森林や樹林地を回復させる取り組みです。"
    je_climate_change_recycling_start_button:0 "リサイクル政策を開始する"
    je_climate_change_recycling_start_button_desc:0 "リサイクルとは、廃棄物を新しい材料や製品に変換するプロセスです。リサイクルの概念には、しばしば廃棄物からのエネルギー回収が含まれます。材料のリサイクル性は、元の状態の特性を取り戻せるかに依存します。\n\nこの政策を制定することで、気候変動の速度を遅らせることができます。"
    je_climate_change_recycling_end_button:0 "リサイクル政策を終了する"
    je_climate_change_recycling_end_button_desc:0 "リサイクルとは、廃棄物を新しい材料や製品に変換するプロセスです。リサイクルの概念には、しばしば廃棄物からのエネルギー回収が含まれます。材料のリサイクル性は、元の状態の特性を取り戻せるかに依存します。"
    je_climate_change_carbon_capture_start_button:0 "二酸化炭素回収政策を開始する"
    je_climate_change_carbon_capture_start_button_desc:0 "二酸化炭素回収・貯留(CCS)とは、産業活動から生じる比較的純度の高い二酸化炭素を分離、処理し、長期的な貯留場所へと輸送するプロセスです。\n\nこの政策を制定することで、気候変動の速度を遅らせることができます。"
    je_climate_change_carbon_capture_end_button:0 "二酸化炭素回収政策を終了する"
    je_climate_change_carbon_capture_end_button_desc:0 "二酸化炭素回収・貯留(CCS)とは、産業活動から生じる比較的純度の高い二酸化炭素を分離、処理し、長期的な貯留場所へと輸送するプロセスです。"
    
