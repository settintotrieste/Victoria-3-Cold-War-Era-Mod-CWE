    treaty_port_terminated_lease.d:0 "[SCOPE.sState('treaty_port_lease_state').GetPortHubName]を直ちに[SCOPE.sCountry('treaty_port_lease_landlord').GetName]へ割譲する代わりに[SCOPE.sCountry('treaty_port_lease_tenant').GetName]は[SCOPE.sState('treaty_port_lease_state').GetPortHubName]の主権を[SCOPE.sCountry('treaty_port_lease_landlord').GetName]へ移譲し、その見返りとして[SCOPE.sCountry('treaty_port_lease_landlord').GetName]が数年間にわたりこの領土を[SCOPE.sCountry('treaty_port_lease_tenant').GetName]へ租借することを提案しました。"
