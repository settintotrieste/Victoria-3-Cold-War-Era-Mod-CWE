    concept_protectorate_desc:2 "衛星国とは、ある国の影響下に入った主権国家であり、事実上その国の[concept_overlord]です。$concept_protectorate$は独自の[Concept('concept_diplomatic_play','$concept_diplomatic_plays$')]を開始でき、$concept_overlord$のすべての[Concept('concept_war','$concept_wars$')]に参加する義務はありません。[concept_country]は[concept_overlord]のもとで$concept_protectorate$となるよう求める、または求められることがあり、申し出が断られても[concept_war]の恐れはありません。\n\n衛星国は常に自国の[concept_market]を掌握しています。"
    
    concept_literacy:0 "高等教育"
    concept_literate:0 "高等教育を受けた"
    concept_literacy_desc:2 "[concept_pop]のうち高等教育の資格を取得した個人の割合または実数です。一部の[Concept('concept_profession', '$concept_professions$')]は他よりも多くの$concept_literacy$を必要とするため、$concept_literacy$が十分に高くない限り、他の$concept_professions$にいる$concept_pops$の[concept_pop_qualifications]が制限されます。[SelectLocalization(GetPlayer.IsValid,'concept_literacy_desc_added','Education')]に投資すれば、時間とともに$concept_population$の$concept_literacy$を高められます。"
    concept_literacy_desc_added:0 "[GetInstitutionType('institution_schools').GetName]"

    concept_culture:0 "アイデンティティ"
    concept_cultures:1 "アイデンティティ"
    concept_culture_possessive:1 "アイデンティティの"
    concept_culture_desc:2 "すべての[Concept('concept_pop', '$concept_pops$')]は$concept_culture$を持ち、これは[concept_assimilation]によってのみ変化します。$concept_culture$によって、どの[Concept('concept_state_region','$concept_state_regions$')]を[Concept('concept_homeland','$concept_homelands$')]とみなすか、また[concept_country]において[Concept('concept_discrimination','$concept_discriminated_against$')]であるかどうかが決まります。"

    concept_accepted_culture:0 "受容アイデンティティ"
    concept_accepted_cultures:0 "受容アイデンティティ"
    concept_accepted_culture_short:0 "受容"
    concept_accepted_culture_desc:2 "[Concept('concept_country','$concept_country_possessive$')]の$concept_accepted_cultures$は、その[concept_primary_cultures]に加え、$concept_country$の現在の[SelectLocalization(GetPlayer.IsValid, 'concept_accepted_culture_desc_added','Citizenship')][concept_law]によって$concept_accepted_culture_short$とみなされるその他の[Concept('concept_culture','$concept_cultures$')]で構成されます。"
    concept_accepted_culture_desc_added:0 "[GetLawType('law_national_supremacy').GetGroup.GetName]"

    concept_primary_cultures:0 "一次アイデンティティ"
    concept_primary_culture:0 "一次アイデンティティ"

    concept_cultural_trait:0 "文化特性"
    concept_cultural_traits:1 "文化特性"
    concept_cultural_trait_desc:2 "主要な言語や世界のどの地域を起源とするかといった、[concept_culture]の特徴です。[Concept('concept_country','$concept_country_possessive$')][Concept('concept_primary_cultures','$concept_primary_culture$')]の$concept_cultural_traits$と[concept_pop]の$concept_culture$の類似性に加え、$concept_country$の現在の[GetLawType('law_national_supremacy').GetGroup.GetName][concept_law]によって、その$concept_pop$が[Concept('concept_discrimination','$concept_discriminated_against$')]となるかどうかが決まります。"

    concept_cultural_heritage_trait:0 "系統文化特性"
    concept_cultural_heritage_traits:0 "系統文化特性"
    concept_cultural_heritage_trait_desc:2 "[concept_culture]が発祥した世界のおおまかな地域を示す[concept_cultural_trait]の一種です。一部の[SelectLocalization(GetPlayer.IsValid,'concept_accepted_culture_desc_added','Citizenship')][Concept('concept_law','$concept_laws$')]は、[concept_pop]を[Concept('concept_discrimination','$concept_discriminated_against$')]とすべきか判断する際に、他の$concept_cultural_traits$よりも$concept_cultural_heritage_traits$を重視します。"
    concept_cultural_heritage_trait_desc_added:0 "[GetLawType('law_national_supremacy').GetGroup.GetName]"
    
