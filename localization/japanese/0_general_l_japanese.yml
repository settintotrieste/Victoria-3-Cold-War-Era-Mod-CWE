    objective_democratic_victory_cold_war:0 "民主主義の勝利"
    objective_democratic_victory_cold_war_desc:0 "西側陣営の勝利を達成してください。世界中に民主主義と資本主義を広め、共産主義を完全に打ち砕きましょう。"
    objective_democratic_victory_cold_war_idle_header:0 "冷戦に勝利する"
    objective_democratic_victory_cold_war_idle_hint:0 "すべての共産主義[concept_super_power]を排除し、唯一の民主主義[concept_super_power]として君臨せよ！"
    objective_democratic_victory_cold_war_name_USA:0 "アメリカ合衆国"
    objective_democratic_victory_cold_war_desc_USA:0 "1941年の日本による真珠湾攻撃後、米国は連合国側として第二次世界大戦に参戦しました。戦後、米国とソ連は世界の二大超大国となり、冷戦へと発展しました。冷戦期間中、両国はイデオロギーの覇権を巡る争いに身を投じましたが、直接的な軍事衝突は避けられました。"
    objective_democratic_victory_cold_war_name_GBR:0 "イギリス"
    objective_democratic_victory_cold_war_desc_GBR:0 "大英帝国は1920年代に最盛期を迎え、世界の陸地と人口のおよそ4分の1を占める史上最大の帝国でした。しかし第一次世界大戦と第二次世界大戦への関与、度重なる危機と威信の失墜により、イギリス植民地の大半が脱植民地化し、やがて帝国は終焉を迎えました。"
    objective_democratic_victory_cold_war_name_FRA:0 "フランス"
    objective_democratic_victory_cold_war_desc_FRA:0 "フランスは第二次世界大戦において連合国の一員でしたが、1940年に降伏し枢軸国に占領されました。1944年の解放後には短命な第四共和政が成立し、アルジェリア戦争の敗北のなかで解体されました。現在の第五共和政は1958年にシャルル・ド・ゴールによって樹立されました。アルジェリアと大半のフランス植民地は1960年代に独立しましたが、その多くはフランスと密接な経済的・軍事的結び付きを保ちました。"
    objective_democratic_victory_cold_war_name_ROC:0 "中華民国"
    objective_democratic_victory_cold_war_desc_ROC:0 "第二次世界大戦は中国を荒廃させ、甚大な人的損失と物的破壊をもたらしました。中国と日本の戦争は1945年の第二次世界大戦終結時における日本の降伏まで続き、これにより台湾は中国の統治下に置かれました。大戦後には中華民国が解放した地域と共産党が解放した地域との間で内戦が再開しました。1949年、中華民国は共産党の進撃を逃れるため首都を台湾へ移しました。"
    
    objective_non_aligned_victory_cold_war:0 "非同盟の勝利"
    objective_non_aligned_victory_cold_war_desc:0 "世界の舞台で主流派となれるのは、ヨーロッパ人や北米人だけではないことを証明してください。"
    objective_non_aligned_victory_cold_war_idle_header:0 "非同盟の[concept_super_power]になる"
    objective_non_aligned_victory_cold_war_idle_hint:0 "世界初の非ヨーロッパ・非北米の[concept_super_power]となり、東側陣営にも西側陣営にも属さない存在を目指してください。"
    objective_non_aligned_victory_cold_war_name_HND:0 "インド"
    objective_non_aligned_victory_cold_war_desc_HND:0 "1947年、イギリス領インド帝国はヒンドゥー教徒が多数を占めるインド自治領とイスラム教徒が多数を占めるパキスタン自治領という2つの独立した自治領に分割され、その過程で大規模な人命の喪失と前例のない移住が生じました。独立国家としてのインドの自己像にとって不可欠だったのが1950年に完成した憲法であり、これにより世俗的かつ民主的な共和国が確立されました。"
    objective_non_aligned_victory_cold_war_name_YUG:0 "ユーゴスラビア"
    objective_non_aligned_victory_cold_war_desc_YUG:0 "王国は1941年4月6日に枢軸国の侵攻を受けました。1943年にはパルチザンの抵抗運動がユーゴスラビア民主連邦の樹立を宣言しました。1944年、当時亡命中であった国王ペータル2世はこれを正統な政府として承認しました。君主制はその後1945年11月に廃止されました。ユーゴスラビアは共産主義政権が樹立された1945年にユーゴスラビア連邦人民共和国と改称されました。"
    objective_non_aligned_victory_cold_war_name_IDO:0 "インドネシア"
    objective_non_aligned_victory_cold_war_desc_IDO:0 "第二次世界大戦中の日本による占領はオランダの支配を終わらせ独立運動を後押ししました。1945年8月の日本の降伏から2日後、スカルノとモハマッド・ハッタがインドネシア独立宣言を発表しました。オランダは支配の再建を試みてインドネシア独立戦争が始まりましたが、国際的な圧力に直面したオランダが1949年12月にインドネシアの独立を承認したことで終結しました。"
    objective_non_aligned_victory_cold_war_name_EGY:0 "エジプト"
    objective_non_aligned_victory_cold_war_desc_EGY:0 "1947年にイギリス軍の大半はスエズ運河地帯へ撤退しましたが、戦後も民族主義的で反英的な感情は高まり続けました。第一次中東戦争における王国の惨憺たる戦績を受けて反王政の気運はさらに強まりました。1950年の選挙では民族主義政党のワフド党が圧勝し国王はムスタファ・ナッハースを新首相に任命せざるを得ませんでした。"
    
    objective_communist_victory_cold_war:0 "共産主義の勝利"
    objective_communist_victory_cold_war_desc:0 "東側陣営の勝利を達成せよ。世界中に共産主義を広め、資本主義を永遠に粉砕するのだ。"
    objective_communist_victory_cold_war_idle_header:0 "冷戦に勝利する"
    objective_communist_victory_cold_war_idle_hint:0 "すべての民主主義[concept_super_power]を排除し、唯一の共産主義[concept_super_power]として君臨せよ！"
    objective_communist_victory_cold_war_name_SOV:0 "ソビエト連邦"
    objective_communist_victory_cold_war_desc_SOV:0 "終戦直後の時期、ソビエト連邦は厳格な中央集権的統制を維持しながら経済を再建し拡大させました。東欧諸国の大半（ユーゴスラビアとのちのアルバニアを除く）を実効支配下に置き衛星国としました。その野心を恐れた戦時中の同盟国であるイギリスとアメリカは、ソビエト連邦の敵となりました。続く冷戦において両陣営は代理戦争という形で間接的に衝突しました。"
    objective_communist_victory_cold_war_name_PRC:0 "中華人民共和国"
    objective_communist_victory_cold_war_desc_PRC:0 "国共内戦の末、毛沢東の共産党軍が蒋介石総統の率いる国民党軍に勝利し、蒋介石は台湾へ逃れました。1949年10月1日、毛沢東は中華人民共和国の建国を宣言します。毛沢東の統治下で中国は伝統的な農民社会から社会主義への変革を遂げ、計画経済のもとで重工業に傾斜していきました。"
    
