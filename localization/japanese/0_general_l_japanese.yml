    treaty_port_lease_terminated.d:0 "根拠となる[concept_treaty]が破棄されたため[ROOT.GetCountry.GetName]の[SCOPE.sState('treaty_port_lease_state').GetPortHubName]における[concept_treaty_port]の租借は終了しました。これにより国際法上[ROOT.GetCountry.GetName]は[SCOPE.sState('treaty_port_lease_state').GetPortHubName]を[SCOPE.sCountry('treaty_port_lease_landlord').GetName]へ返還しなければなりません。"
