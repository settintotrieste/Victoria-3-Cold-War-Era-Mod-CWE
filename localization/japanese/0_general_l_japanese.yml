    treaty_port_lease_terminated.3:0 "[SCOPE.sState('treaty_port_lease_state').GetPortHubName]の返還を拒否する。"
    
    treaty_port_lease_terminated_SAR.t:0 "[SCOPE.sState('treaty_port_lease_state').GetPortHubName]の租借終了"
    treaty_port_lease_terminated_SAR.d:0 "[SCOPE.sState('treaty_port_lease_state').GetPortHubName]における[SCOPE.sCountry('treaty_port_lease_tenant').GetName]の[concept_treaty_port]の租借は、その根拠となる[concept_treaty]からの脱退により終了しました。これにより国際法上、[SCOPE.sCountry('treaty_port_lease_tenant').GetName]は[SCOPE.sState('treaty_port_lease_state').GetPortHubName]を[SCOPE.sCountry('treaty_port_lease_landlord').GetName]へ返還する義務を負います。\n\nしかし[SCOPE.sCountry('treaty_port_lease_tenant').GetName]は、[SCOPE.sCountry('treaty_port_lease_landlord').GetName]の[concept_special_administrative_region]とすることを条件に掲げ、[SCOPE.sState('treaty_port_lease_state').GetPortHubName]の返還を拒否しています。"
    treaty_port_lease_terminated_SAR.f:0 "このイベントは#y $treaty_port_leased$#![concept_article]を含む[concept_treaty]が破棄されたため発生しました。"
