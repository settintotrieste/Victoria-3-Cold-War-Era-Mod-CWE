    concept_dominion_desc:0 "[Concept('concept_recognized_power','$concept_recognized_powers$')]はより弱い[concept_country]を自国の$concept_dominion$（[concept_subject]）にすることができます。$concept_dominion$はより自治権の高い[concept_subject_type]であり、独自に[Concept('concept_diplomatic_play','$concept_diplomatic_plays$')]を開始でき、[Concept('concept_overlord','$concept_overlord_possessive$')]の[Concept('concept_war','$concept_wars$')]へ強制的に参加させられます。毎週[concept_treasury]収入の#v 10%#!を$concept_overlord$へ支払わなければなりません。"
    
    concept_personal_union_desc:0 "[SelectLocalization(GetPlayer.IsValid,'concept_personal_union_desc_added','Monarchy')][concept_law]を戴く2つの[Concept('concept_country', '$concept_countries$')]は$concept_personal_union$として結ばれることがあります。これは[Concept('concept_overlord','$concept_overlord_possessive$')]の[concept_ruler]が両[Concept('concept_country', '$concept_countries$')]の[concept_head_of_state]を兼ねる[concept_subject_type]です。\n\n[concept_subject]は独自に[Concept('concept_diplomatic_play','$concept_diplomatic_plays$')]を開始でき、$concept_overlord$の[Concept('concept_war','$concept_wars$')]へ強制的に参加させられることがあります。$concept_overlord$が$law_monarchy$を廃止した場合[concept_diplomatic_pact]は解消されます。\n\n同君連合は常に自国の[concept_market]を自ら統制します。"
    
