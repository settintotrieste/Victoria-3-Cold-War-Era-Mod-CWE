    concept_fervor_desc:1 "$concept_fervor$は[concept_culture]の民族精神を測る指標です。$concept_fervor$の高い$concept_culture$の[Concept('concept_pop', '$concept_pops$')]はより緩やかに[Concept('concept_assimilation','$concept_assimilate$')]し、征服された際により多くの[Concept('concept_radical','$concept_radicals$')]を形成し、[concept_liberty_desire]を増加させ、[Concept('concept_cultural_movement', '$concept_cultural_movements$')]に加わりやすくなります。\n\n#title 次の条件は$concept_fervor$を#b 増加#!させます：#!#indent_newline:3 \n• #tooltippable;tooltip:[GetPlayer.GetTooltipTag],fervor_effects_from_citizenship_laws_tt 適用可能#!な[SelectLocalization(GetPlayer.IsValid,'CITIZENSHIP_LINK','lawgroup_citizenship')][concept_law]を持つ独立した[concept_country]の[Concept('concept_primary_cultures','$concept_primary_culture$')]であること\n• [concept_war]におけるこの[concept_culture]の[concept_casualties]の数\n• 平均[concept_literacy]が高いこと\n• この$concept_culture$の[GetPopType('academics').GetName]$concept_pops$の数\n• [GetTechnology('tech_politics_2').GetName]または[GetTechnology('tech_politics_3').GetName]の[Concept('concept_technology', '$concept_technologies$')]を持つ$concept_countries$に居住するこの文化の$concept_pops$\n• 適用可能な[GetInstitutionType('institution_schools').GetName][concept_institution]を持つ$concept_country$の$concept_primary_culture$であること\n• 他の$concept_culture$が独立した$concept_countries$として解放されていること\n• [concept_national_awakening]を経験していること#!\n\n#title 次の条件は$concept_fervor$を#b 減少#!させます：#!#indent_newline:3 \n• [GetLawType('law_multicultural').GetName]$concept_law$を持つ$concept_country$の$concept_primary_culture$であること\n• 平均[concept_acceptance]が高いこと#!"
    
