    treaty_port_lease_terminated_war.d:0 "[SCOPE.sState('treaty_port_lease_state').GetPortHubName]における[SCOPE.sCountry('treaty_port_lease_tenant').GetName]の[concept_treaty_port]の租借は、その根拠となる[concept_treaty]からの脱退により終了しました。これにより国際法上、[SCOPE.sCountry('treaty_port_lease_tenant').GetName]は[SCOPE.sState('treaty_port_lease_state').GetPortHubName]を[SCOPE.sCountry('treaty_port_lease_landlord').GetName]へ返還する義務を負います。\n\nしかし[SCOPE.sCountry('treaty_port_lease_tenant').GetName]は条約上の義務に違反し、[SCOPE.sState('treaty_port_lease_state').GetPortHubName]の返還を拒否しています。"
