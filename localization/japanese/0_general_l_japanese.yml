    ship_type_troop_ship_0_desc:0 "$ship_type_troop_ship_desc$"
    ship_type_troop_ship_1_desc:0 "兵員と物資を効率よく長距離輸送するために設計された近代型の兵員輸送艦で、改良型の推進機関と安全システムを備えています。"
    ship_type_troop_ship_2_desc:0 "輸送能力と自動化、兵站支援を強化した先進的な兵員輸送艦で、世界各地の戦域における大規模展開を支えられます。"
    
    ship_type_battleship_0_desc:0 "$ship_type_pre_dreadnought_desc$"
    ship_type_battleship_1_desc:0 "$ship_type_dreadnought_desc$"
    ship_type_battleship_2_desc:0 "$ship_type_super_dreadnought_desc$"
    ship_type_battleship_3_desc:0 "装甲を犠牲にして速力を得た高速主力艦で、巡洋艦を上回る火力と戦艦を振り切る速度を備えています。"
    ship_type_battleship_4_desc:0 "誘導ミサイルシステムを搭載した近代型の巡洋戦艦で、従来の砲撃をはるかに超える射程を持ちます。"
    ship_type_battleship_5_desc:0 "レーダーと電子機器、改良型推進機関を統合した先進的な巡洋戦艦で、火力と生存性を両立しています。"
    ship_type_battleship_6_desc:0 "モジュール式の部品で建造された柔軟な設計であり、新型兵器や新技術へ迅速に対応できます。"
    ship_type_battleship_7_desc:0 "強大な火力と強化装甲を備えた大型巡洋戦艦で、速力を保ちながら戦艦に匹敵する戦闘力を発揮します。"
    ship_type_battleship_8_desc:0 "無人システムとドローン群を運用する巡洋戦艦で、乗員を危険にさらすことなく戦闘能力を拡張します。"
    ship_type_battleship_9_desc:0 "単独行動が可能な高度に自動化された主力艦で、必要な乗員を減らしつつ効率を最大化します。"
    ship_type_battleship_10_desc:0 "巡洋戦艦進化の頂点に立つ巨大戦闘艦で、圧倒的な火力と先進的な自動化、比類なき継戦能力を兼ね備えます。"
    ship_type_aircraft_carrier_0_desc:0 "限定的な航空作戦のために設計された小型空母で、偵察と軽度の打撃能力を提供します。"
    ship_type_aircraft_carrier_1_desc:0 "大規模な航空団を運用できる正規空母で、洋上での攻撃・防御の両任務に対応します。"
    ship_type_aircraft_carrier_2_desc:0 "航続距離が事実上無制限の原子力空母で、燃料補給なしに世界規模の作戦を継続できます。"
    ship_type_aircraft_carrier_3_desc:0 "先進的な電子機器やレーダー、推進システムを統合した現代的な空母で、打撃と支援の双方をバランスよくこなします。"
    ship_type_aircraft_carrier_4_desc:0 "巨大な規模と搭載能力を備えた超大型空母で、圧倒的な航空戦力を地域全体へ投射できます。"
    ship_type_aircraft_carrier_5_desc:0 "最先端のシステムと自動化、高い残存性を備えた先進超大型空母で、高烈度の戦闘に対応します。"
    ship_type_aircraft_carrier_6_desc:0 "適応性の高い部品で建造されたモジュール式超大型空母で、兵装・センサー・航空設備を迅速に強化できます。"
    ship_type_aircraft_carrier_7_desc:0 "無人航空機を運用するドローン超大型空母で、搭乗員の危険を減らしつつ打撃圏を拡大します。"
    ship_type_aircraft_carrier_8_desc:0 "最小限の乗員で運用できる自律型超大型空母で、先進的なAIと自動化により世界規模の優位を維持します。"
    ship_type_cruiser_0_desc:0 "$ship_type_protected_cruiser_desc$"
    ship_type_cruiser_1_desc:0 "$ship_type_armored_cruiser_desc$"
    ship_type_cruiser_2_desc:0 "$ship_type_light_cruiser_desc$"
    ship_type_cruiser_3_desc:0 "重武装と強化装甲を備えた巡洋艦で、敵水上艦との交戦や艦隊作戦の支援が可能です。"
    ship_type_cruiser_4_desc:0 "誘導ミサイルシステムを搭載するよう改装された巡洋艦で、従来の砲撃をはるかに超える攻撃範囲を得ています。"
    ship_type_cruiser_5_desc:0 "先進的なレーダー・電子機器・推進機関を統合した現代型ミサイル巡洋艦です。攻撃と防御を高い次元で両立します。"
    ship_type_cruiser_6_desc:0 "適応性の高い構成要素で建造されたモジュール式ミサイル巡洋艦です。兵装とセンサーを迅速に更新できます。"
    ship_type_cruiser_7_desc:0 "圧倒的な大きさと火力を誇る超大型ミサイル巡洋艦です。海戦を支配し艦隊指揮能力も備えます。"
    ship_type_cruiser_8_desc:0 "無人システムを運用するドローンミサイル巡洋艦です。偵察と攻撃を担い乗員の危険を減らします。"
    ship_type_cruiser_9_desc:0 "最小限の乗員で運用できる自律型ミサイル巡洋艦です。高度な自動化により持続的な戦闘力を発揮します。"
    ship_type_cruiser_10_desc:0 "巡洋艦の進化の頂点に立つ超弩級ミサイル巡洋艦です。圧倒的な火力と高度な自動化、比類なき航続力を兼ね備えます。"
    ship_type_destroyer_0_desc:0 "$ship_type_coastal_defense_ship_desc$"
    ship_type_destroyer_1_desc:0 "$ship_type_torpedo_boat_desc$"
    ship_type_destroyer_2_desc:0 "$ship_type_destroyer_desc$"
    ship_type_destroyer_3_desc:0 "重武装と航続力の向上を果たした大型駆逐艦です。敵水上艦と潜水艦への対処を目的としています。"
    ship_type_destroyer_4_desc:0 "誘導ミサイルシステムを搭載した駆逐艦です。従来の砲熕兵装を超える攻防の射程を得ました。"
    ship_type_destroyer_5_desc:0 "先進的なレーダー・電子機器・推進機関を統合した現代型ミサイル駆逐艦です。艦隊護衛と攻撃を高い次元で両立します。"
    ship_type_destroyer_6_desc:0 "適応性の高い構成要素で建造されたモジュール式ミサイル駆逐艦です。兵装とセンサーを迅速に更新できます。"
    ship_type_destroyer_7_desc:0 "強大な大きさと火力を誇る超大型ミサイル駆逐艦です。海戦を支配し艦隊防空を担います。"
    ship_type_destroyer_8_desc:0 "無人システムを運用するドローンミサイル駆逐艦です。偵察と攻撃を担い乗員の危険を減らします。"
    ship_type_destroyer_9_desc:0 "最小限の乗員で運用できる自律型ミサイル駆逐艦です。高度な自動化により持続的な戦闘力を発揮します。"
    ship_type_destroyer_10_desc:0 "駆逐艦の進化の頂点に立つ超弩級ミサイル駆逐艦です。圧倒的な火力と高度な自動化、比類なき航続力を兼ね備えます。"
    ship_type_submarine_1_desc:0 "初期の実験的な潜水艦です。航続距離と行動持続力に劣りますが敵の商船を攻撃できます。"
    ship_type_submarine_2_desc:0 "信頼性と航続力を高めた戦間期の潜水艦です。沿岸防衛と限定的な艦隊支援のために設計されました。"
    ship_type_submarine_3_desc:0 "長距離哨戒のために建造された艦隊型潜水艦です。主力艦隊と行動を共にして大洋で活動できます。"
    ship_type_submarine_4_desc:0 "航続力と経済性を両立したディーゼル電気推進型潜水艦です。冷戦期に広く配備されました。"
    ship_type_submarine_5_desc:0 "事実上無制限の航続力を持つ原子力攻撃型潜水艦です。敵艦艇や敵潜水艦の狩り出しを目的に設計されました。"
    ship_type_submarine_6_desc:0 "核兵器を搭載する弾道ミサイル潜水艦です。隠密性と残存性によって戦略抑止を担います。"
    ship_type_submarine_7_desc:0 "最新鋭のセンサーと静粛推進システムを備えた先進的なステルス潜水艦です。隠密作戦に最適化されています。"
    ship_type_submarine_8_desc:0 "偵察・打撃任務に無人システムを投入する自律型ドローン潜水艦です。乗員の危険を大きく減らします。"
    ship_type_submarine_9_desc:0 "超高速兵器を発射できる極超音速打撃型潜水艦です。前例のない速度によって海中戦のあり方を塗り替えます。"
    ship_type_submarine_10_desc:0 "潜水艦設計の究極形である超大型潜水艦です。圧倒的な火力・高度な自動化・比類なき航続力を兼ね備えています。"
    
