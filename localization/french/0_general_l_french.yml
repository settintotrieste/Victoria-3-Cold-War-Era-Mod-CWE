    ship_type_troop_ship_0_desc:0 "$ship_type_troop_ship_desc$" 
    ship_type_troop_ship_1_desc:0 "Un transport de troupes modernisé conçu pour le transport efficace à longue distance de soldats et de fournitures, avec une propulsion et des systèmes de sécurité améliorés." 
    ship_type_troop_ship_2_desc:0 "Un transport de troupes avancé doté d'une capacité accrue, d'automatisation et de soutien logistique, capable de soutenir des déploiements à grande échelle sur les théâtres mondiaux." 
 
    ship_type_battleship_0_desc:0 "$ship_type_pre_dreadnought_desc$" 
    ship_type_battleship_1_desc:0 "$ship_type_dreadnought_desc$" 
    ship_type_battleship_2_desc:0 "$ship_type_super_dreadnought_desc$" 
    ship_type_battleship_3_desc:0 "Un navire de ligne rapide sacrifiant le blindage pour la vitesse, conçu pour surpasser les croiseurs tout en échappant aux cuirassés." 
    ship_type_battleship_4_desc:0 "Un croiseur de bataille modernisé équipé de systèmes de missiles guidés, prolongeant sa portée bien au-delà de l'artillerie traditionnelle." 
    ship_type_battleship_5_desc:0 "Un croiseur de bataille avancé intégrant radar, électronique et propulsion améliorée pour un équilibre entre puissance de feu et survivabilité." 
    ship_type_battleship_6_desc:0 "Un design flexible construit avec des composants modulaires, permettant une adaptation rapide aux nouvelles armes et technologies." 
    ship_type_battleship_7_desc:0 "Un croiseur de bataille agrandi avec une puissance de feu immense et un blindage renforcé, rivalisant avec les cuirassés tout en conservant sa vitesse." 
    ship_type_battleship_8_desc:0 "Un croiseur de bataille déployant des systèmes sans équipage et des essaims de drones, prolongeant ses capacités de combat sans risquer l'équipage." 
    ship_type_battleship_9_desc:0 "Un navire de ligne hautement automatisé capable d'opérations indépendantes, réduisant les besoins en équipage tout en maximisant l'efficacité." 
    ship_type_battleship_10_desc:0 "Le summum de l'évolution du croiseur de bataille, un navire de guerre colossal combinant puissance de feu écrasante, automatisation avancée et endurance inégalée." 
    ship_type_aircraft_carrier_0_desc:0 "Un porte-avions plus petit conçu pour des opérations aériennes limitées, offrant reconnaissance et capacité de frappe légère." 
    ship_type_aircraft_carrier_1_desc:0 "Un porte-avions de flotte de taille normale capable de soutenir de grandes ailes aériennes pour des missions offensives et défensives en mer." 
    ship_type_aircraft_carrier_2_desc:0 "Un porte-avions à propulsion nucléaire avec une portée pratiquement illimitée, permettant des opérations mondiales soutenues sans ravitaillement." 
    ship_type_aircraft_carrier_3_desc:0 "Un porte-avions moderne intégrant des systèmes électroniques, radar et de propulsion avancés pour des rôles équilibrés de frappe et de soutien." 
    ship_type_aircraft_carrier_4_desc:0 "Un superporte-avions de taille et de capacité immenses, capable de projeter une puissance aérienne écrasante sur des régions entières." 
    ship_type_aircraft_carrier_5_desc:0 "Un superporte-avions avancé doté de systèmes de pointe, d'automatisation et d'une meilleure survivabilité pour la guerre de haute intensité." 
    ship_type_aircraft_carrier_6_desc:0 "Un superporte-avions modulaire construit avec des composants adaptables, permettant des mises à niveau rapides des armes, capteurs et installations aéronautiques." 
    ship_type_aircraft_carrier_7_desc:0 "Un superporte-avions drone déployant des systèmes aériens sans pilote, prolongeant sa portée de frappe tout en réduisant les risques pour les pilotes humains." 
    ship_type_aircraft_carrier_8_desc:0 "Un superporte-avions autonome capable de fonctionner avec un équipage minimal, s'appuyant sur l'IA avancée et l'automatisation pour une domination mondiale durable." 
    ship_type_cruiser_0_desc:0 "$ship_type_protected_cruiser_desc$" 
    ship_type_cruiser_1_desc:0 "$ship_type_armored_cruiser_desc$" 
    ship_type_cruiser_2_desc:0 "$ship_type_light_cruiser_desc$" 
    ship_type_cruiser_3_desc:0 "Un croiseur lourdement armé avec un blindage renforcé, capable d'engager des navires de surface ennemis et de soutenir les opérations de flotte." 
    ship_type_cruiser_4_desc:0 "Un croiseur modernisé avec des systèmes de missiles guidés, prolongeant sa portée offensive bien au-delà de l'artillerie traditionnelle." 
    ship_type_cruiser_5_desc:0 "Un croiseur à missiles moderne intégrant radar, électronique et propulsion avancés pour des rôles équilibrés de frappe et de défense." 
    ship_type_cruiser_6_desc:0 "Un croiseur à missiles modulaire construit avec des composants adaptables, permettant des mises à niveau rapides des armes et des capteurs." 
    ship_type_cruiser_7_desc:0 "Un super croiseur à missiles de taille et de puissance de feu immenses, conçu pour dominer les engagements navals et assurer le commandement de la flotte." 
    ship_type_cruiser_8_desc:0 "Un croiseur à missiles drone déployant des systèmes sans équipage pour des missions de reconnaissance et de frappe, réduisant les risques pour les équipages humains." 
    ship_type_cruiser_9_desc:0 "Un croiseur à missiles autonome capable de fonctionner avec un équipage minimal, s'appuyant sur l'automatisation avancée pour une efficacité de combat durable." 
    ship_type_cruiser_10_desc:0 "Le summum de l'évolution du croiseur, un méga croiseur à missiles combinant puissance de feu écrasante, automatisation avancée et endurance inégalée." 
    ship_type_destroyer_0_desc:0 "$ship_type_coastal_defense_ship_desc$" 
    ship_type_destroyer_1_desc:0 "$ship_type_torpedo_boat_desc$" 
    ship_type_destroyer_2_desc:0 "$ship_type_destroyer_desc$" 
    ship_type_destroyer_3_desc:0 "Un destroyer plus grand avec un armement plus lourd et une endurance accrue, conçu pour contrer les navires de surface et sous-marins ennemis." 
    ship_type_destroyer_4_desc:0 "Un destroyer équipé de systèmes de missiles guidés, prolongeant sa portée offensive et défensive au-delà de l'artillerie traditionnelle." 
    ship_type_destroyer_5_desc:0 "Un destroyer à missiles moderne intégrant radar, électronique et propulsion avancés pour des rôles équilibrés d'escorte de flotte et de frappe." 
    ship_type_destroyer_6_desc:0 "Un destroyer à missiles modulaire construit avec des composants adaptables, permettant des mises à niveau rapides des armes et des capteurs." 
    ship_type_destroyer_7_desc:0 "Un super destroyer à missiles de taille et de puissance de feu formidables, capable de dominer les engagements navals et d'assurer la défense de la flotte." 
    ship_type_destroyer_8_desc:0 "Un destroyer à missiles drone déployant des systèmes sans équipage pour des missions de reconnaissance et de frappe, réduisant les risques pour les équipages humains." 
    ship_type_destroyer_9_desc:0 "Un destroyer à missiles autonome capable de fonctionner avec un équipage minimal, s'appuyant sur l'automatisation avancée pour une efficacité de combat durable." 
    ship_type_destroyer_10_desc:0 "Le summum de l'évolution du destroyer, un méga destroyer à missiles combinant puissance de feu écrasante, automatisation avancée et endurance inégalée." 
    ship_type_submarine_1_desc:0 "Un sous-marin expérimental précoce, limité en portée et en endurance mais capable de frapper la navigation marchande ennemie." 
    ship_type_submarine_2_desc:0 "Un sous-marin d'entre-deux-guerres avec une fiabilité et une endurance améliorées, conçu pour la défense côtière et un soutien limité à la flotte." 
    ship_type_submarine_3_desc:0 "Un sous-marin de flotte construit pour des patrouilles à longue distance, capable d'opérer aux côtés des principales forces navales à travers les océans." 
    ship_type_submarine_4_desc:0 "Un sous-marin diesel-électrique équilibrant endurance et coût, largement déployé durant la guerre froide." 
    ship_type_submarine_5_desc:0 "Un sous-marin nucléaire d'attaque avec une portée pratiquement illimitée, conçu pour chasser les navires et sous-marins ennemis." 
    ship_type_submarine_6_desc:0 "Un sous-marin lanceur d'engins transportant des armes nucléaires, assurant la dissuasion stratégique par la furtivité et la survivabilité." 
