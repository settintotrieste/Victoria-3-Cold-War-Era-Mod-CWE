    concept_puppet:0 "Fantoche"
    concept_puppets:0 "Fantoches"
    concept_puppet_desc:0 "Une [Concept('concept_recognized_power','$concept_recognized_powers$')] peut transformer un [concept_country] plus faible en leur $concept_puppet$. Un $concept_puppet$ est un type de [concept_subject] qui ne peut pas démarrer son propre [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] mais est forcé de rejoindre son [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_war','$concept_wars$')], et doit également payer #v 30%#! de son revenu [concept_treasury] à son $concept_overlord$ chaque semaine. Le [concept_rank] d'un $concept_puppet$ ne peut pas augmenter pour égaler ou dépasser celui de son $concept_overlord$, et son $concept_overlord$ peut le cibler avec l'#b Annexion#! $concept_diplomatic_play$."
    
