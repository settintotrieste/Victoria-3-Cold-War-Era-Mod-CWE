    concept_puppet_desc:0 "[Concept('concept_recognized_power','$concept_recognized_powers$')] peut transformer un [concept_country] plus faible en $concept_puppet$. Un $concept_puppet$ est un type de [concept_subject] qui ne peut pas lancer ses propres [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] mais doit rejoindre les [Concept('concept_war','$concept_wars$')] de son [Concept('concept_overlord','$concept_overlord_possessive$')]. Le [concept_rank] d'un $concept_puppet$ ne peut pas égaler ou dépasser celui de son $concept_overlord$, et ce dernier peut le cibler avec le $concept_diplomatic_play$ #b Annexion#!." 
 
