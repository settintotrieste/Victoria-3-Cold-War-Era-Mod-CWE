    nuclear_ultimatum_white_peace_proposal_notification_effects_desc:0 "[TARGET_COUNTRY.GetName] lancera une frappe de représailles contre [INITIATOR_COUNTRY.GetName] s'il possède des armes nucléaires."
    
    station_nuclear_weapons:0 "Station d'Armes Nucléaires"
    station_nuclear_weapons_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] stationne ses armes nucléaires à [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]. Cela permet à [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] de réduire la capacité de tout pays voisin [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] pour se défendre contre une attaque nucléaire hostile [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
    station_nuclear_weapons_action_name:0 "Station d'Armes Nucléaires"
    station_nuclear_weapons_action_break_name:0 "Retirer les Armes Nucléaires Stationnées"
