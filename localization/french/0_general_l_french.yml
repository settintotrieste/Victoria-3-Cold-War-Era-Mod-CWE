    station_nuclear_weapons_desc:3 "[INITIATOR_COUNTRY.GetAdjectiveNoFlag] propose d'installer ses armes nucléaires à [TARGET_COUNTRY.GetName]. Cela lui permet de frapper n'importe quel pays voisin de [TARGET_COUNTRY.GetName] plus efficacement."
    station_nuclear_weapons_action_notification_name:0 "Une Station d'Armes Nucléaires [INITIATOR_COUNTRY.GetAdjectiveNoFlag] à [TARGET_COUNTRY.GetName]"
    station_nuclear_weapons_action_notification_desc:2 "[INITIATOR_COUNTRY.GetName] a stationné ses armes nucléaires à [TARGET_COUNTRY.GetName] ce qui leur permet de frapper n'importe quel pays voisin de [TARGET_COUNTRY.GetName] plus efficacement."
    station_nuclear_weapons_proposal_notification_name:0 "Des Armes Nucléaires [INITIATOR_COUNTRY.GetAdjectiveNoFlag] stationnées à [TARGET_COUNTRY.GetName]"
    station_nuclear_weapons_proposal_notification_desc:3 "[INITIATOR_COUNTRY.GetName] a stationné ses armes nucléaires à [TARGET_COUNTRY.GetName] ce qui leur permet de frapper n'importe quel pays voisin de [TARGET_COUNTRY.GetName] plus efficacement." 
    station_nuclear_weapons_proposal_notification_effects_desc:0 "[INITIATOR_COUNTRY.GetName] sera en mesure d'attaquer n'importe quel pays voisin  [TARGET_COUNTRY.GetName] avec des armes nucléaires plus efficacementen réduisant de 25 % les points de défense qu'un pays obtient en fonction du nombre d'États qu'il possède, et ce pour chaque pays où nos armes sont stationnées."
    
