    concept_corruption:0 "Corruption du gouvernement"
    concept_corruption_desc:0 "La corruption fait référence à une conduite malhonnête ou frauduleuse de la part des fonctionnaires, généralement par l'acceptation de pots-de-vin ou le détournement de fonds publics à des fins personnelles. De telles activités sont représentées dans ce mod en obligeant [concept_government] [Concept('concept_building', '$concept_buildings$')] à consommer des $illegal_services$, ce qui a pour effet de rendre la bureaucratie plus inefficace et de faire fuir l'argent public vers le secteur privé."
    very_low_corruption.tt:0 "Le pays devient très faible [concept_corruption]"
    low_corruption.tt:0 "Le pays connaît un faible [concept_corruption]"
    medium_corruption.tt:0 "Le pays obtient un niveau de corruption modérément bas [concept_corruption]"
    high_corruption.tt:0 "Le pays devient de plus en plus corrompu"
    very_high_corruption.tt:0 "Le pays devient très corrompu [concept_corruption]"
    
