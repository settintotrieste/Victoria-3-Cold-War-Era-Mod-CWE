    concept_dominion_desc:0 "[Concept('concept_recognized_power','$concept_recognized_powers$')] peut transformer un [concept_country] plus faible en $concept_dominion$ ([concept_subject]). Un $concept_dominion$ est un type de [concept_subject_type] plus autonome qui peut lancer ses propres [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] et doit rejoindre les [Concept('concept_war','$concept_wars$')] de son [Concept('concept_overlord','$concept_overlord_possessive$')]. Il doit verser #v 10%#! de ses revenus du [concept_treasury] à son $concept_overlord$ chaque semaine." 
 
    concept_personal_union_desc:0 "Deux [Concept('concept_country', '$concept_countries$')] ayant la [SelectLocalization(GetPlayer.IsValid,'concept_personal_union_desc_added','Monarchie')] [concept_law] peuvent être unies en une $concept_personal_union$. Il s'agit d'un [concept_subject_type] où le [Concept('concept_overlord','$concept_overlord_possessive$')] [concept_ruler] est le [concept_head_of_state] des deux [Concept('concept_country', '$concept_countries$')].\n\nLe [concept_subject] peut lancer ses propres [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] et peut être forcé de rejoindre les [Concept('concept_war','$concept_wars$')] de son $concept_overlord$. Le [concept_diplomatic_pact] sera rompu si le $concept_overlord$ abolit sa $law_monarchy$.\n\nLes unions personnelles contrôlent toujours leur propre [concept_market]." 
