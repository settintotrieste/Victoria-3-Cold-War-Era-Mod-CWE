    conduct_hostile_espionage_proposal_notification_effects_desc:0 "[INITIATOR_COUNTRY.GetName] aura une chance hebdomadaire d'obtenir des événements d'espionnage qui lui permettent d'interférer dans notre politique intérieure et notre économie."
    
