    conduct_hostile_espionage_action_notification_desc:2 "[INITIATOR_COUNTRY.GetName] a mis en place un réseau d'espionnage [TARGET_COUNTRY.GetName] ce qui leur permet de mener des opérations secrètes contre [TARGET_COUNTRY.GetName]."
