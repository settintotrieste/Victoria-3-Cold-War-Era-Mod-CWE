    amendment_quasi_monarchy:0 "Quasi-monarchie"
    amendment_quasi_monarchy_desc:0 "Une quasi-monarchie est un système qui reprend les apparences d'une monarchie — titres, cérémonies et succession dynastique — mais dans lequel le souverain n'est monarque que d'une partie du pays, voire ne l'est pas du tout."

