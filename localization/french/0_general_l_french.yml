    seize_shipping:0 "Saisie de Navires"  
    seize_shipping_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] saisit les [concept_convoys] appartenant à [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]."  
    seize_shipping_action_name:0 "Saisir des Navires"  
    seize_shipping_action_propose_name:0 "Saisir des Navires"  
    seize_shipping_action_break_name:0 "Arrêter la Saisie de Navires"  
    seize_shipping_desc:3 "Cette action diplomatique permet à l’initiateur de saisir les [concept_convoys] appartenant au pays cible. En termes de jeu, cela crée un flux financier inverse où l’initiateur reçoit un transfert de revenus du pays cible, calculé en fonction du revenu fiscal du pays cible."  
    seize_shipping_action_notification_name:0 "[INITIATOR_COUNTRY.GetName] Saisit les [concept_convoys] de [TARGET_COUNTRY.GetAdjective]"  
    seize_shipping_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] a commencé à saisir des [concept_convoys] transportant des cargaisons précieuses appartenant à [TARGET_COUNTRY.GetName]."  
    seize_shipping_action_notification_break_name:0 "[INITIATOR_COUNTRY.GetName] Arrête de Saisir les [concept_convoys] de [TARGET_COUNTRY.GetAdjective]"  
    seize_shipping_action_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] a cessé de saisir les [concept_convoys] appartenant à [TARGET_COUNTRY.GetName]."  
    
    seize_shipping_trigger_desc_third:0 "[COUNTRY.GetName] saisit les [concept_convoys] de [TARGET_COUNTRY.GetName]"
    seize_shipping_effect_desc_global:0 "Commencer la saisie des convois"    
    strike_infrastructure:0 "Frapper les infrastructures"
    strike_infrastructure_action_name:0 "Frapper les infrastructures de [TARGET_COUNTRY.GetAdjective]"
    strike_infrastructure_action_propose_name:0 "Frapper les infrastructures de [TARGET_COUNTRY.GetAdjective]"
    strike_infrastructure_desc:0 "Cette [concept_diplomatic_action] permet à l'initiateur de détruire des bâtiments d'infrastructure dans une [concept_state_region] aléatoire du pays cible."
    strike_infrastructure_action_notification_name:0 "Infrastructures de [TARGET_COUNTRY.GetAdjective] ciblées"
    strike_infrastructure_action_notification_desc:0 "L'armée de l'air [INITIATOR_COUNTRY.GetAdjective] a attaqué et détruit des bâtiments d'infrastructure dans une [concept_state_region] aléatoire de [TARGET_COUNTRY.GetName], causant d'importants dégâts et une grande [concept_devastation] pour la population locale."

