    objective_democratic_victory_cold_war:0 "Victoire démocratique"
    objective_democratic_victory_cold_war_desc:0 "Obtenez la victoire du bloc occidental. Répandez la démocratie et le capitalisme à travers le monde et écrasez le communisme pour de bon."
    objective_democratic_victory_cold_war_idle_header:0 "Gagner la Guerre Froide"
    objective_democratic_victory_cold_war_idle_hint:0 "Éliminez tous les [concept_super_power] communistes et soyez le seul [concept_super_power] démocrate debout !"
    objective_democratic_victory_cold_war_name_USA:0 "Etats-Unis d'Amérique"
    objective_democratic_victory_cold_war_desc_USA:0 "Après l’attaque japonaise de Pearl Harbor en 1941, les États-Unis entrent dans la Seconde Guerre mondiale aux côtés des Alliés. Les conséquences de la guerre ont fait des États-Unis et de l’Union soviétique les deux superpuissances mondiales et ont conduit à la guerre froide. Pendant la guerre froide, les deux pays se sont engagés dans une lutte pour la domination idéologique mais ont évité un conflit militaire direct."
    objective_democratic_victory_cold_war_name_GBR:0 "Royaume-Uni"
    objective_democratic_victory_cold_war_desc_GBR:0 "L'Empire britannique, à son apogée dans les années 1920, représentait près d'un quart de la masse terrestre et de la population mondiale et était le plus grand empire de l'histoire. Cependant, son implication dans la Première Guerre mondiale et la Seconde Guerre mondiale, la crise cumulative et la perte de prestige ont conduit à la décolonisation de la plupart des colonies britanniques et à la fin éventuelle de l'Empire.."
    objective_democratic_victory_cold_war_name_FRA:0 "France"
    objective_democratic_victory_cold_war_desc_FRA:0 "La France faisait partie des puissances alliées de la Seconde Guerre mondiale, mais elle capitula et fut occupée par l'Axe en 1940. Après la libération en 1944, l'éphémère Quatrième République fut établie puis dissoute au cours de la défaite de la guerre d'Algérie. L'actuelle Cinquième République a été créée en 1958 par Charles de Gaulle. L'Algérie et la plupart des colonies françaises sont devenues indépendantes dans les années 1960, la majorité conservant des liens économiques et militaires étroits avec la France.."
    objective_democratic_victory_cold_war_name_ROC:0 "République de Chine"
    objective_democratic_victory_cold_war_desc_ROC:0 "La Seconde Guerre mondiale a dévasté la Chine, entraînant d’énormes pertes en vies humaines et des destructions matérielles. La guerre entre la Chine et le Japon s'est poursuivie jusqu'à la capitulation du Japon à la fin de la Seconde Guerre mondiale en 1945, qui a conduit à la mise de Taiwan sous administration chinoise. Au lendemain de la Seconde Guerre mondiale, la guerre civile reprend entre les zones libérées par la République de Chine et celles libérées par les communistes. En 1949, la République de Chine a transféré sa capitale à Taiwan pour éviter l’avancée communiste."
    
    objective_non_aligned_victory_cold_war:0 "Victoire des non-alignés"
    objective_non_aligned_victory_cold_war_desc:0 "Prouver que ce ne sont pas seulement les Européens ou les Nord-Américains qui peuvent être puissants sur la scène mondiale."
    objective_non_aligned_victory_cold_war_idle_header:0 "Devenez une [concept_super_power] non-alignée."
    objective_non_aligned_victory_cold_war_idle_hint:0 "Devenez le premier [concept_super_power] non européen et non nord-américain au monde et ne vous alignez ni sur le bloc de l’Est ni sur le bloc de l’Ouest."
    objective_non_aligned_victory_cold_war_name_HND:0 "Inde"
    objective_non_aligned_victory_cold_war_desc_HND:0 "En 1947, l'Empire britannique des Indes a été divisé en deux dominions indépendants, un dominion de l'Inde à majorité hindoue et un dominion du Pakistan à majorité musulmane, au milieu d'une perte de vies à grande échelle et d'une migration sans précédent. La constitution, achevée en 1950, qui a mis en place une république laïque et démocratique, a été essentielle à l'image de l'Inde en tant que nation indépendante."
    objective_non_aligned_victory_cold_war_name_YUG:0 "Yougoslavie"
    objective_non_aligned_victory_cold_war_desc_YUG:0 "Le royaume fut envahi par les puissances de l'Axe le 6 avril 1941. En 1943, une Yougoslavie fédérale démocratique fut proclamée par la résistance partisane. En 1944, le roi Pierre II, alors en exil, le reconnut comme gouvernement légitime. La monarchie fut ensuite abolie en novembre 1945. La Yougoslavie fut rebaptisée République populaire fédérale de Yougoslavie en 1945, lorsqu'un gouvernement communiste fut établi.."
    objective_non_aligned_victory_cold_war_name_IDO:0 "Indonésie"
    objective_non_aligned_victory_cold_war_desc_IDO:0 "L'occupation japonaise pendant la Seconde Guerre mondiale a mis fin à la domination néerlandaise et a encouragé le mouvement indépendantiste. Deux jours après la capitulation du Japon en août 1945, Sukarno et Mohammad Hatta publièrent la Proclamation de l'indépendance de l'Indonésie. Les Pays-Bas ont tenté de rétablir leur domination, déclenchant la Révolution nationale indonésienne qui s'est terminée en décembre 1949 lorsque les Néerlandais ont reconnu l'indépendance indonésienne face à la pression internationale."
    objective_non_aligned_victory_cold_war_name_EGY:0 "Egypte"
    objective_non_aligned_victory_cold_war_desc_EGY:0 "La plupart des troupes britanniques furent retirées dans la région du canal de Suez en 1947, mais les sentiments nationalistes et anti-britanniques continuèrent de croître après la guerre. Les sentiments anti-monarchiques se sont encore accrus à la suite de la performance désastreuse du Royaume lors de la première guerre israélo-arabe. Les élections de 1950 ont vu une victoire écrasante du parti nationaliste Wafd et le roi a été contraint de nommer Mostafa El-Nahas comme nouveau Premier ministre."
    
    objective_communist_victory_cold_war:0 "Victoire communiste"
    objective_communist_victory_cold_war_desc:0 "Obtenez la victoire du bloc de l’Est. Répandez le communisme à travers le monde et écrasez le capitalisme pour de bon."
    objective_communist_victory_cold_war_idle_header:0 "Gagner la Guerre Froide"
    objective_communist_victory_cold_war_idle_hint:0 "Éliminez tous les [concept_super_power] démocrates et soyez le seul [concept_super_power] communiste debout !"
    objective_communist_victory_cold_war_name_SOV:0 "Union Soviétique"
    objective_communist_victory_cold_war_desc_SOV:0 "Au cours de l’immédiat après-guerre, l’Union soviétique a reconstruit et développé son économie, tout en maintenant son contrôle strictement centralisé. Elle a pris le contrôle effectif de la plupart des pays d’Europe de l’Est (à l’exception de la Yougoslavie et plus tard de l’Albanie), les transformant en États satellites. Craignant ses ambitions, les alliés de guerre de l'Union soviétique, le Royaume-Uni et les États-Unis, sont devenus ses ennemis. Au cours de la guerre froide qui a suivi, les deux parties se sont affrontées indirectement dans le cadre de guerres par procuration."
    objective_communist_victory_cold_war_name_PRC:0 "République Populaire de Chine"
    objective_communist_victory_cold_war_desc_PRC:0 "Après la guerre civile chinoise et la victoire des forces communistes de Mao Zedong sur les forces du Kuomintang du généralissime Chiang Kai-shek, qui ont fui vers Taiwan, Mao Zedong a proclamé la fondation de la République populaire de Chine (RPC) le 1er octobre 1949. Sous le règne de Mao, La Chine a connu une transformation socialiste, passant d'une société paysanne traditionnelle à une économie planifiée, s'orientant vers les industries lourdes."
    
    objective_hegemon_idle_header:0 "Domination mondiale"
    objective_hegemon_idle_hint:0 "Devenir l'unique [concept_super_power] au monde."
    objective_hegemon_name_USA:0 "États-Unis d'Amérique"
    objective_hegemon_desc_USA:0 "$objective_democratic_victory_cold_war_desc_USA$"
    objective_hegemon_name_SOV:0 "Union Soviétique"
