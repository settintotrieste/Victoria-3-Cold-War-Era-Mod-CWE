    does_not_share_same_international_alliance_target_country_diplo_action.tt:0 "[SCOPE.sCountry('target_country').GetName] n'appartient pas à la même ou aux mêmes #y Alliances internationales#! que les [Concept('concept_country', '$concept_countries$')] en [concept_war] contre [ROOT.GetCountry.GetName]"
    does_not_share_same_international_alliance_actor_country_diplo_action.tt:0 "[ROOT.GetCountry.GetName] n'appartient pas à la même ou aux mêmes #y Alliances internationales#! que les [Concept('concept_country', '$concept_countries$')] en [concept_war] contre [SCOPE.sCountry('target_country').GetName]"
    does_not_share_same_international_alliance_actor_country_treaty.tt:0 "[ROOT.GetCountry.GetName] n'appartient pas à la même ou aux mêmes #y Alliances internationales#! que les [Concept('concept_country', '$concept_countries$')] en [concept_war] contre [SCOPE.sCountry('other_country').GetName]"
    no_alliance_or_guarantee_independent_with_target.tt:0 "[ROOT.GetCountry.GetName] n'a aucun [concept_treaty] lui interdisant d'entrer en [concept_war] contre [SCOPE.sCountry('target_country').GetName]"
    target_has_aggressive_war_goal.tt:0 "[SCOPE.sCountry('enemy_country').GetName] a l'intention de mener une [concept_war] #y agressive#! contre [SCOPE.sCountry('target_country').GetName], tandis que [SCOPE.sCountry('target_country').GetName] n'a pas l'intention d'en faire autant"
