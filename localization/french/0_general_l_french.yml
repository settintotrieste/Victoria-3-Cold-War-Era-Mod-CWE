    amendment_corporate_state_voting_rights:0 "Circonscriptions socioprofessionnelles"
    amendment_corporate_state_voting_rights_desc:0 "Certains sièges législatifs sont réservés à des secteurs professionnels, commerciaux et économiques plutôt qu'à des zones géographiques. Selon la circonscription, les électeurs peuvent être des personnes physiques (comme les enseignants ou les avocats inscrits à un registre professionnel) ou des personnes morales (comme certaines entreprises, certains syndicats ou des associations professionnelles)."
    amendment_council_state_voting_rights:0 "République des conseils"
    amendment_council_state_voting_rights_desc:0 "Une république des conseils est une forme de gouvernement dans laquelle le pouvoir est détenu par des conseils élus d'ouvriers ou de soldats plutôt que par un parlement traditionnel ou un monarque."

