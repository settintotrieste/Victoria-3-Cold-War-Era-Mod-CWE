    combat_unit_type_artillery_1_desc:0 "Équipages d'artillerie traditionnelle assurant un appui-feu indirect depuis des positions retranchées, idéales pour les bombardements prolongés." 
    combat_unit_type_artillery_2_desc:0 "Emplacements de gros calibre destinés à percer les fortifications et à détruire les cibles renforcées lors de longs sièges." 
    combat_unit_type_artillery_3_desc:0 "Plateformes mobiles combinant blindage et artillerie, capables de se repositionner rapidement et d'assurer un soutien réactif." 
    combat_unit_type_artillery_4_desc:0 "Unités d'artillerie lourdement blindées avec protection et puissance de feu accrues pour les combats de première ligne." 
    combat_unit_type_artillery_5_desc:0 "Systèmes de roquettes à lancement multiple couvrant de larges zones, idéaux pour la suppression des formations ennemies." 
    combat_unit_type_artillery_6_desc:0 "Systèmes de roquettes de haute précision et grande mobilité, optimisés pour des frappes rapides et lointaines." 
    combat_unit_type_artillery_7_desc:0 "Plateformes avancées capables de lancer des missiles balistiques aéroportés pour des frappes stratégiques en profondeur." 
    combat_unit_type_artillery_8_desc:0 "Unités de drones autonomes réalisant des frappes précises avec un minimum de supervision humaine, idéales pour la guerre asymétrique." 
    combat_unit_type_artillery_9_desc:0 "Essaims de drones coordonnés submergeant les défenses par des attaques synchronisées et adaptatives." 
    combat_unit_type_artillery_10_desc:0 "Plateformes à canon électromagnétique délivrant des projectiles hypersoniques à très longue portée et fort impact cinétique." 
 
    combat_unit_type_airforce_1_desc:0 "Avions de reconnaissance légers utilisés pour repérer les positions ennemies et transmettre les renseignements du champ de bataille." 
    combat_unit_type_airforce_2_desc:0 "Appareils agiles conçus pour les combats rapprochés et la défense aérienne de base à basse vitesse." 
    combat_unit_type_airforce_3_desc:0 "Chasseurs à réaction de première génération offrant une meilleure vitesse et altitude que les appareils à hélice." 
    combat_unit_type_airforce_4_desc:0 "Intercepteurs rapides capables de franchir le mur du son et de dominer les zones de combat aérien." 
    combat_unit_type_airforce_5_desc:0 "Appareils polyvalents adaptés aux missions air-air et air-sol, flexibles face aux besoins tactiques changeants." 
    combat_unit_type_airforce_6_desc:0 "Chasseurs furtifs conçus pour des frappes précises et la survie en espace aérien contesté." 
    combat_unit_type_airforce_7_desc:0 "Plateformes furtives avancées alliant polyvalence et discrétion, avec systèmes de combat en réseau." 
    combat_unit_type_airforce_8_desc:0 "Chasseurs de haute altitude opérant à la limite de l'atmosphère, optimisés pour l'interception stratégique et la surveillance." 
    combat_unit_type_airforce_9_desc:0 "Systèmes aériens autonomes ou télépilotés assurant reconnaissance, frappes et soutien avec un risque minimal." 
    combat_unit_type_airforce_10_desc:0 "Commandements aériens massifs combinant vol, puissance de feu et coordination de flotte dans une forteresse volante." 
 
    combat_unit_type_light_ship_1_desc:0 "Navires d'escorte rapides et agiles conçus pour la lutte anti-sous-marine, la protection des convois et l'intervention rapide." 
    combat_unit_type_light_ship_2_desc:0 "Chasseurs silencieux sous-marins, capables de reconnaissance furtive et de frappes dévastatrices à la torpille." 
    combat_unit_type_light_ship_3_desc:0 "Prédateurs des grands fonds propulsés par des réacteurs nucléaires, offrant une grande autonomie et endurance sous-marine." 
    combat_unit_type_light_ship_4_desc:0 "Sous-marins modernes équipés de sonar, missiles et capacités de furtivité accrues." 
    combat_unit_type_light_ship_5_desc:0 "Sous-marins de nouvelle génération optimisés pour la discrétion acoustique et les frappes de précision en zone hostile." 
 
    combat_unit_type_capital_ship_1_desc:0 "Navires de guerre lourdement blindés d'une autre époque, armés de canons pour dominer la ligne de bataille." 
    combat_unit_type_capital_ship_2_desc:0 "Forteresses flottantes à la puissance de feu massive, conçues pour contrôler les routes maritimes et affronter les flottes ennemies." 
    combat_unit_type_capital_ship_3_desc:0 "Navires de surface modernes armés de missiles guidés pour des frappes de précision à longue portée et la défense de flotte." 
    combat_unit_type_capital_ship_4_desc:0 "Navires capitaux rapides alliant puissance de feu et manœuvrabilité, idéaux pour les combats navals dynamiques." 
    combat_unit_type_capital_ship_5_desc:0 "Navires compacts et polyvalents adaptés aux opérations côtières, combinant vitesse, furtivité et armement modulable." 
 
    combat_unit_type_carrier_1_desc:0 "Bases aériennes flottantes projetant la puissance à travers les océans, capables de lancer et récupérer des avions en zone de combat." 
    combat_unit_type_carrier_2_desc:0 "Porte-avions nucléaires à portée et endurance inégalées, pour des déploiements mondiaux prolongés." 
    combat_unit_type_carrier_3_desc:0 "Superporte-avions accueillant de vastes ailes aériennes, centres de commandement et systèmes de défense avancés." 
    combat_unit_type_carrier_4_desc:0 "Porte-avions furtifs conçus pour éviter la détection et coordonner opérations aériennes et guerre électronique." 
    combat_unit_type_carrier_5_desc:0 "Plates-formes navales titanesques intégrant capacités aériennes, navales et drones en une seule forteresse mobile." 
 
