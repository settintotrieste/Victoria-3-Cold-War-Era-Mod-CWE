    combat_unit_type_infantry_1_desc:0 "Fantassins aguerris entraînés à la guerre de position, excellant en défense et en tactiques d'usure." 
    combat_unit_type_infantry_2_desc:0 "Unités légères capables de déploiement rapide et de manœuvres flexibles sur tous les terrains." 
    combat_unit_type_infantry_3_desc:0 "Troupes soutenues par des transports blindés, alliant mobilité et résilience accrue sur le champ de bataille." 
    combat_unit_type_infantry_4_desc:0 "Unités lourdement blindées intégrant infanterie et chars pour des percées et des assauts soutenus." 
    combat_unit_type_infantry_5_desc:0 "Force équilibrée mêlant infanterie, blindés, artillerie et éléments de soutien pour une grande polyvalence stratégique." 
    combat_unit_type_infantry_6_desc:0 "Formation modulaire optimisée pour l'autonomie, intégrant puissance de feu et mobilité." 
    combat_unit_type_infantry_7_desc:0 "Unités mécanisées d'élite dotées d'armures de pointe et de systèmes d'IA pour la coordination tactique." 
    combat_unit_type_infantry_8_desc:0 "Force blindée de nouvelle génération avec survivabilité, puissance de feu et soutien drone intégrés." 
    combat_unit_type_infantry_9_desc:0 "Force tournée vers l'avenir, capable d'opérations multi-domaines et de coordination inter-unités fluide." 
    combat_unit_type_infantry_10_desc:0 "Unités expérimentales pilotant des exosquelettes mécanisés, redéfinissant mobilité, puissance de feu et domination tactique." 
 
    combat_unit_type_tanks_1_desc:0 "Chars de la Première Guerre mondiale" 
    combat_unit_type_tanks_2_desc:0 "Chars de la Seconde Guerre mondiale" 
    combat_unit_type_tanks_3_desc:0 "Chars du début de la Guerre froide" 
