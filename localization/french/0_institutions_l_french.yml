l_french:  

    institution_gulag:0 "Réseau de camps de concentration" 
    institution_gulag_desc:0 "Les camps de concentration sont des lieux où le travail forcé, les incarcérations politiques et les exécutions de masse sont pratiqués." 
 
    institution_home_affairs:0 "Police secrète" 
 
    institution_pop_growth:0 "Bureau des affaires familiales" 
    institution_pop_growth_desc:0 "Le Bureau des affaires familiales est l'organisme chargé de mettre en œuvre les politiques de croissance démographique." 
 
    institution_espionage:0 "Services de renseignement" 
    institution_espionage_desc:0 "Le service de renseignement est une branche du gouvernement chargée des opérations secrètes à l'étranger." 
 
    institution_economic_planning_office:0 "Comité de planification économique" 
    institution_economic_planning_office_desc:0 "Le Comité de planification économique est l'agence responsable de la planification économique centrale du pays. Sa mission principale est la création et la gestion de plans quinquennaux encadrant l'économie nationale." 
 
    institution_environmental_protection_agency:0 "Agence de protection de l'environnement" 
    institution_environmental_protection_agency_desc:0 "L'Agence de protection de l'environnement protège la population et l'environnement contre les risques majeurs pour la santé, finance et mène des recherches, et élabore et applique la réglementation environnementale." 