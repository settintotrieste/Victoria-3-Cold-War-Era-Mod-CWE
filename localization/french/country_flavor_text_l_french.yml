l_french:

    GENERIC_FLAVOR_TEXT:0 "La guerre froide est une période de tension géopolitique entre le Bloc de l'Ouest et le Bloc de l'Est. Quels nouveaux défis cette époque apportera-t-elle ?" 
    REV_GENERIC_FLAVOR_TEXT:1 "Insatisfaits de la direction prise par le soi-disant gouvernement organisé, ces révolutionnaires ont décidé de prendre les armes pour le renverser. Réussiront-ils à s'emparer du pouvoir ou seront-ils écrasés comme tant d'autres révolutions oubliées du passé ?" 
    DECENTRALIZED_FLAVOR_TEXT:0 "Enserré par des puissances plus organisées, ce pays lutte pour préserver son autonomie. Verront-ils l'aube d'un nouveau siècle ou leur nom ne survivra-t-il que dans les livres d'histoire ?" 