    tech_construction_infrastructure_1:0 "Outils Électroportatifs"
    tech_construction_infrastructure_2:0 "Béton Armé"
    tech_construction_infrastructure_3:0 "Préfabrication"
    tech_construction_infrastructure_4:0 "Machinerie de Construction Avancée"
