    tech_chemicals_8:0 "Chimie verte"
    tech_chemicals_9:0 "Chimie computationnelle"
    tech_chemicals_10:0 "Chimie avancée"
    
    tech_chemicals_1_desc:0 "La chimie basique comprend la compréhension des éléments, des composés, des réactions chimiques simples et la synthèse de matériaux basiques."
    tech_chemicals_2_desc:0 "Les matériaux synthétiques sont fabriqués par des procédés chimiques et souvent conçus pour avoir des propriétés spécifiques."
    tech_chemicals_3_desc:0 "Les produits chimiques avancés incluent des composés complexes utilisés dans diverses industries pour des applications spécifiques."
    tech_chemicals_4_desc:0 "Les polymères modernes sont des macromolécules synthétiques ayant une large gamme d’applications, des plastiques aux fibres textiles."
    tech_chemicals_5_desc:0 "Les matériaux composites combinent plusieurs matériaux pour créer un matériau aux propriétés améliorées."
    tech_chemicals_6_desc:0 "Les nanotechnologies chimiques impliquent la manipulation de la matière à l’échelle nanométrique pour créer de nouveaux matériaux et dispositifs."
    tech_chemicals_7_desc:0 "Les biotechnologies chimiques utilisent des systèmes biologiques pour produire ou modifier des substances chimiques."
    tech_chemicals_8_desc:0 "La chimie verte vise à concevoir des produits et processus chimiques qui réduisent ou éliminent l’utilisation et la production de substances dangereuses."
    tech_chemicals_9_desc:0 "La chimie computationnelle utilise des simulations informatiques pour modéliser et prédire les comportements chimiques."
    tech_chemicals_10_desc:0 "La chimie avancée intègre des techniques et connaissances modernes pour développer des matériaux et réactions innovants."
    
    tech_manufacturing_1:0 "Production mécanisée"
    tech_manufacturing_2:0 "Lignes d’assemblage"
    tech_manufacturing_3:0 "Automatisation"
    tech_manufacturing_4:0 "Robotique industrielle"
    tech_manufacturing_5:0 "Fabrication additive"
    tech_manufacturing_6:0 "Impression 3D avancée"
    tech_manufacturing_7:0 "Production flexible"
    tech_manufacturing_8:0 "Usines intelligentes"
    tech_manufacturing_9:0 "Fabrication pilotée par IA"
    tech_manufacturing_10:0 "Production autonome"
    
    tech_manufacturing_1_desc:0 "La production mécanisée utilise des machines pour remplacer le travail manuel dans la fabrication de biens."
    tech_manufacturing_2_desc:0 "Les lignes d’assemblage organisent la production en étapes séquentielles pour améliorer l’efficacité."
    tech_manufacturing_3_desc:0 "L’automatisation utilise des systèmes automatiques pour contrôler les processus de production."
    tech_manufacturing_4_desc:0 "La robotique industrielle emploie des robots pour effectuer des tâches répétitives ou dangereuses."
    tech_manufacturing_5_desc:0 "La fabrication additive construit des objets couche par couche, souvent utilisée dans l’impression 3D."
    tech_manufacturing_6_desc:0 "L’impression 3D avancée permet de créer des pièces complexes avec des matériaux variés."
    tech_manufacturing_7_desc:0 "La production flexible s’adapte rapidement aux changements de produit ou de volume."
    tech_manufacturing_8_desc:0 "Les usines intelligentes intègrent des technologies numériques pour optimiser la production."
    tech_manufacturing_9_desc:0 "La fabrication pilotée par IA utilise l’intelligence artificielle pour améliorer les processus de production."
    tech_manufacturing_10_desc:0 "La production autonome fonctionne sans intervention humaine grâce à des systèmes intelligents."
    
    tech_consumer_manufacturing_1:0 "Produits faits main"
    tech_consumer_manufacturing_2:0 "Production artisanale"
    tech_consumer_manufacturing_3:0 "Production de masse"
    tech_consumer_manufacturing_4:0 "Produits standardisés"
    tech_consumer_manufacturing_5:0 "Personnalisation"
    tech_consumer_manufacturing_6:0 "Produits durables"
    tech_consumer_manufacturing_7:0 "Fabrication écologique"
    tech_consumer_manufacturing_8:0 "Production locale"
    tech_consumer_manufacturing_9:0 "Commerce électronique"
    tech_consumer_manufacturing_10:0 "Production à la demande"
    
    tech_consumer_manufacturing_1_desc:0 "Les produits faits main sont fabriqués individuellement avec un savoir-faire artisanal."
    tech_consumer_manufacturing_2_desc:0 "La production artisanale combine méthodes manuelles et mécanisées à petite échelle."
    tech_consumer_manufacturing_3_desc:0 "La production de masse fabrique de grandes quantités de produits identiques."
    tech_consumer_manufacturing_4_desc:0 "Les produits standardisés respectent des spécifications uniformes pour assurer la compatibilité."
    tech_consumer_manufacturing_5_desc:0 "La personnalisation adapte les produits aux besoins spécifiques des consommateurs."
    tech_consumer_manufacturing_6_desc:0 "Les produits durables sont conçus pour une longue durée de vie et une faible maintenance."
    tech_consumer_manufacturing_7_desc:0 "La fabrication écologique minimise l’impact environnemental à travers les matériaux et processus."
    tech_consumer_manufacturing_8_desc:0 "La production locale favorise la fabrication proche des marchés pour réduire les coûts logistiques."
    tech_consumer_manufacturing_9_desc:0 "Le commerce électronique permet la vente directe de produits via Internet."
    tech_consumer_manufacturing_10_desc:0 "La production à la demande fabrique des produits uniquement lorsque la demande est confirmée."
    
    tech_mining_1:0 "Extraction manuelle"
    tech_mining_2:0 "Machinerie minière basique"
    tech_mining_3:0 "Extraction mécanisée"
    tech_mining_4:0 "Mines souterraines avancées"
    tech_mining_5:0 "Extraction à ciel ouvert"
    tech_mining_6:0 "Traitement minier"
    tech_mining_7:0 "Technologies minières modernes"
    tech_mining_8:0 "Automatisation minière"
    tech_mining_9:0 "Mines intelligentes"
    tech_mining_10:0 "Extraction autonome"
    
    tech_mining_1_desc:0 "L’extraction manuelle utilise des outils simples et la force humaine pour extraire les ressources."
    tech_mining_2_desc:0 "La machinerie minière basique comprend des équipements simples pour faciliter l’extraction."
    tech_mining_3_desc:0 "L’extraction mécanisée utilise des machines pour améliorer la productivité et la sécurité."
    tech_mining_4_desc:0 "Les mines souterraines avancées emploient des techniques complexes pour accéder à des gisements profonds."
    tech_mining_5_desc:0 "L’extraction à ciel ouvert consiste à enlever la surface terrestre pour accéder aux ressources."
    tech_mining_6_desc:0 "Le traitement minier transforme les minerais extraits en matériaux utilisables."
    tech_mining_7_desc:0 "Les technologies minières modernes intègrent des outils et systèmes avancés pour optimiser l’extraction."
    tech_mining_8_desc:0 "L’automatisation minière réduit l’intervention humaine grâce à des machines autonomes."
    tech_mining_9_desc:0 "Les mines intelligentes utilisent des capteurs et l’IA pour améliorer la gestion et la sécurité."
    tech_mining_10_desc:0 "L’extraction autonome se réalise sans opérateurs humains grâce à des systèmes entièrement automatisés."
    
    tech_services_1:0 "Machines à écrire"
    tech_services_2:0 "Stratégies organisationnelles"
    tech_services_3:0 "Audit & Comptabilité"
    tech_services_4:0 "Gestion scientifique"
    tech_services_5:0 "Bureaux en open space"
    tech_services_6:0 "Bureaux à plan ouvert"
    tech_services_7:0 "Bureaux virtuels"
    tech_services_8:0 "Services infusés à l’IA"
    tech_services_9:0 "Bureaux intelligents"
    tech_services_10:0 "Travailleurs de bureau IA"

    tech_services_1_desc:0 "Une machine à écrire est un appareil mécanique ou électromécanique pour taper des caractères."
    tech_services_2_desc:0 "La stratégie organisationnelle désigne le plan bien défini d’une organisation pour atteindre ses objectifs globaux, incluant sa mission, vision, valeurs et initiatives stratégiques pour rester compétitive."
    tech_services_3_desc:0 "Un audit est un examen indépendant des informations financières d’une entité, quel que soit son type ou taille, effectué dans le but de formuler une opinion."
    tech_services_4_desc:0 "La gestion scientifique est une théorie qui analyse et synthétise les flux de travail afin d’améliorer l’efficacité économique, notamment la productivité du travail."
    tech_services_5_desc:0 "Un bureau en open space est un espace de travail partiellement cloisonné séparé par des cloisons de 1,5 à 2 mètres de haut, destiné à isoler les travailleurs des distractions visuelles et sonores."
    tech_services_6_desc:0 "Un bureau à plan ouvert est une configuration où tous les employés travaillent sur un même étage dans un espace ouvert."
    tech_services_7_desc:0 "Un bureau virtuel fait partie de l’espace de travail flexible, offrant services, espace et technologie sans les coûts d’une location ou propriété traditionnelle."
    tech_services_8_desc:0 "L’infusion d’IA consiste à appliquer l’intelligence artificielle dans les entreprises pour prédire, automatiser et optimiser les décisions et opérations."
    tech_services_9_desc:0 "Les bureaux intelligents sont équipés de logiciels pour automatiser les tâches basiques comme la gestion des salles de réunion, réduisant les frustrations et distractions."
    tech_services_10_desc:0 "La majorité des travaux de bureau sont remplacés par l’intelligence artificielle."

    tech_electronics_1:0 "Circuits simples"
    tech_electronics_2:0 "Théorie informatique"
    tech_electronics_3:0 "Ordinateurs analogiques"
    tech_electronics_4:0 "Circuits intégrés"
    tech_electronics_5:0 "Ordinateurs programmables"
    tech_electronics_6:0 "Systèmes d’exploitation"
    tech_electronics_7:0 "Réseaux neuronaux"
    tech_electronics_8:0 "IA générative"
    tech_electronics_9:0 "Calcul quantique"
    tech_electronics_10:0 "Informatique biologique"

    tech_electronics_1_desc:0 "Un circuit simple est un circuit permettant le passage du courant électrique, utilisé dans des appareils électriques domestiques basiques."
    tech_electronics_2_desc:0 "La théorie informatique étudie comment calculer efficacement, les modèles de calcul et leurs limites."
    tech_electronics_3_desc:0 "Les ordinateurs analogiques sont des machines physiques utilisant des propriétés comme la tension ou la pression pour résoudre des problèmes."
    tech_electronics_4_desc:0 "Un circuit intégré (CI) est un petit dispositif électronique contenant plusieurs composants interconnectés sur une puce semi-conductrice."
    tech_electronics_5_desc:0 "Un ordinateur programmable est un appareil capable de suivre un ensemble d’instructions ou code pour effectuer des tâches."
    tech_electronics_6_desc:0 "Un système d’exploitation gère les ressources matérielles d’un ordinateur et fournit des services communs aux programmes."
    tech_electronics_7_desc:0 "Un réseau neuronal est un algorithme d’apprentissage machine inspiré du cerveau humain, utilisant des nœuds interconnectés pour traiter des données."
    tech_electronics_8_desc:0 "L’IA générative est un type d’intelligence artificielle capable de créer du contenu nouveau comme textes, images, musiques ou vidéos."
    tech_electronics_9_desc:0 "Le calcul quantique utilise la mécanique quantique pour résoudre des problèmes complexes plus rapidement que les ordinateurs classiques."
    tech_electronics_10_desc:0 "L’informatique biologique utilise des organismes ou processus biologiques pour stocker, traiter et transmettre des informations."

