    ### Military Techs ###
    
    tech_military_ground_forces_1:0 "Fusils à verrou"
    tech_military_ground_forces_2:0 "Artillerie lourde"
    tech_military_ground_forces_3:0 "Premiers chars"
    tech_military_ground_forces_4:0 "Véhicules blindés de transport de troupes"
