    tech_sea_infrastructure_1_desc:0 "La machinerie portuaire englobe une variété d’équipements essentiels, notamment des manutentionnaires de conteneurs vides, des chariots élévateurs de différentes capacités, des grues pour manutention de matériaux, des portiques, des grues navire-terre, des portiques à pneus en caoutchouc pour conteneurs, des télescopiques, et bien plus."
    tech_sea_infrastructure_2_desc:0 "Un moteur diesel marin est un moteur à allumage par compression installé ou destiné à être installé sur un navire."
    tech_sea_infrastructure_3_desc:0 "Les navires sont conçus selon des normes acceptées internationalement."
    tech_sea_infrastructure_4_desc:0 "La conteneurisation est un système de transport intermodal utilisant des conteneurs intermodaux."
    tech_sea_infrastructure_5_desc:0 "Les mégaships sont une classe de très grands navires principalement utilisés à des fins commerciales, comme le transport de grandes quantités de marchandises ou de groupes importants de personnes."
    tech_sea_infrastructure_6_desc:0 "Alors que les premiers ports étaient souvent de simples havres, les ports modernes sont des hubs multimodaux de distribution, avec des connexions par mer, rivière, canal, route, rail et air."
    tech_sea_infrastructure_7_desc:0 "Le concept de navires intelligents découle de la tendance plus large à la numérisation dans divers secteurs, intégrant des technologies de pointe pour améliorer l'efficacité, la sécurité et la durabilité."
    tech_sea_infrastructure_8_desc:0 "Un navire électrique est une embarcation propulsée par des moteurs électriques, alimentés par des batteries embarquées, panneaux solaires ou générateurs."
    tech_sea_infrastructure_9_desc:0 "Les navires autonomes, aussi appelés navires conteneurs autonomes ou navires autonomes de surface maritime (MASS), sont des navires sans équipage transportant des conteneurs ou des cargaisons en vrac avec peu ou pas d'intervention humaine."
    tech_sea_infrastructure_10_desc:0 "Les ports sont désormais de méga complexes s'étendant sur de vastes terrains."
    
    tech_air_infrastructure_1:0 "Premiers Aéroports"
    tech_air_infrastructure_2:0 "Petits Avions à Hélice"
    tech_air_infrastructure_3:0 "Avions à Réacteurs"
    tech_air_infrastructure_4:0 "Aéroports Internationaux"
    tech_air_infrastructure_5:0 "Automatisation du Poste de Pilotage"
    tech_air_infrastructure_6:0 "Méga Aéroports"
    tech_air_infrastructure_7:0 "Avions Intelligents"
    tech_air_infrastructure_8:0 "Avions Électriques"
    tech_air_infrastructure_9:0 "Avions Entièrement Autonomes"
    tech_air_infrastructure_10:0 "Méga Avions"
    
    tech_air_infrastructure_1_desc:0 "Les premiers aéroports étaient souvent petits et rudimentaires, avec des pistes austères et peu d’équipements."
    tech_air_infrastructure_2_desc:0 "En opérant dans des aéroports régionaux avec des pistes courtes, les avions à hélice peuvent atteindre des vitesses de croisière de 300 nœuds et des distances sans escale d'environ 2 400 km, avec une durée moyenne de vol d'environ 3 heures."
    tech_air_infrastructure_3_desc:0 "Un avion à réaction est un avion propulsé par des moteurs à réaction. En général, les avions commerciaux ont deux ou quatre moteurs à réaction; les modèles à trois moteurs étaient populaires dans les années 1970 mais sont moins courants aujourd’hui."
    tech_air_infrastructure_4_desc:0 "Un aéroport international est un aéroport avec des installations de douane et de contrôle des frontières permettant aux passagers de voyager entre les pays du monde entier."
    tech_air_infrastructure_5_desc:0 "Certaines tâches ou parties de tâches effectuées par l’équipage humain peuvent être déléguées, par choix de l’équipage, à la machinerie."
    tech_air_infrastructure_6_desc:0 "Les méga aéroports sont définis comme ceux accueillant 33 millions de passagers
    tech_air_infrastructure_5_desc:0 "Certaines tâches ou parties de tâches effectuées par l’équipage humain peuvent être déléguées, par choix de l’équipage, à la machinerie."
    tech_air_infrastructure_7_desc:0 "Le Système d’Avion Intelligent intègre des capteurs avancés et de l’apprentissage automatique pour offrir des informations augmentant la conscience situationnelle et améliorant la sécurité."
    tech_air_infrastructure_8_desc:0 "Un avion électrique est un aéronef propulsé par électricité. Les avions électriques sont vus comme une solution pour réduire les impacts environnementaux de l’aviation, offrant zéro émission et des vols plus silencieux. L’électricité peut être fournie par diverses méthodes, la plus courante étant les batteries."
    tech_air_infrastructure_9_desc:0 "L’avion pilote, navigue et communique de manière autonome. Il est entièrement autonome et vole tout seul."
    tech_air_infrastructure_10_desc:0 "Les avions de ligne sont énormes."
    
    tech_energy_infrastructure_1:0 "Centrales Thermiques au Charbon et au Pétrole"
    tech_energy_infrastructure_2:0 "Centrales au Gaz Naturel et Hydroélectriques"
    tech_energy_infrastructure_3:0 "Centrales Nucléaires"
    tech_energy_infrastructure_4:0 "Centrales Géothermiques"
    tech_energy_infrastructure_5:0 "Premières Énergies Renouvelables"
    tech_energy_infrastructure_6:0 "Énergies Renouvelables Modernes"
    tech_energy_infrastructure_7:0 "Centrales Thermiques Modernes"
    tech_energy_infrastructure_8:0 "Centrales Nucléaires Modernes"
    tech_energy_infrastructure_9:0 "Centrales à Fusion"
    tech_energy_infrastructure_10:0 "Mégacentrales"
    
    tech_energy_infrastructure_1_desc:0 "Une centrale thermique à combustible fossile brûle un combustible fossile, tel que charbon, pétrole ou gaz naturel, pour produire de l’électricité. Ces centrales ont des machines qui convertissent la chaleur de la combustion en énergie mécanique, laquelle entraîne un générateur électrique."
    tech_energy_infrastructure_2_desc:0 "Dans une centrale au gaz naturel, le gaz est mélangé à l’air et brûlé. Les produits de combustion (principalement CO2 et H2O) se dilatent rapidement, cette expansion entraînant l’arbre qui fait tourner l’aimant. Dans une centrale hydroélectrique, l’eau tombe d’une haute altitude vers une basse altitude, entraînant l’arbre qui fait tourner l’aimant."
    tech_energy_infrastructure_3_desc:0 "Une centrale nucléaire est une centrale thermique dont la source de chaleur est un réacteur nucléaire. Comme dans les centrales thermiques classiques, la chaleur génère de la vapeur qui entraîne une turbine reliée à un générateur produisant de l’électricité."
    tech_energy_infrastructure_4_desc:0 "La géothermie produit de l’électricité à partir de l’énergie géothermique. Les technologies incluent les centrales à vapeur sèche, à vapeur flash et à cycle binaire."
    tech_energy_infrastructure_5_desc:0 "L’énergie renouvelable (ou énergie verte) provient de ressources naturelles renouvelables qui se reconstituent à l’échelle du temps humain."
    tech_energy_infrastructure_6_desc:0 "Les renouvelables, incluant solaire, éolien, hydroélectricité, biocarburants et autres, sont au cœur de la transition vers des systèmes énergétiques moins carbonés et plus durables."
    tech_energy_infrastructure_7_desc:0 "Une centrale thermique à combustible fossile brûle un combustible fossile, tel que charbon, pétrole ou gaz naturel, pour produire de l’électricité. Ces centrales ont des machines qui convertissent la chaleur de la combustion en énergie mécanique, laquelle entraîne un générateur électrique."
    tech_energy_infrastructure_8_desc:0 "Une centrale nucléaire est une centrale thermique dont la source de chaleur est un réacteur nucléaire. Comme dans les centrales thermiques classiques, la chaleur génère de la vapeur qui entraîne une turbine reliée à un générateur produisant de l’électricité."
    tech_energy_infrastructure_9_desc:0 "La fusion nucléaire est une forme proposée de production d’énergie qui génèrerait de l’électricité en utilisant la chaleur provenant des réactions de fusion nucléaire. Dans un processus de fusion, deux noyaux atomiques légers se combinent pour former un noyau plus lourd, libérant de l’énergie. Les dispositifs conçus pour exploiter cette énergie sont appelés réacteurs à fusion."
    tech_energy_infrastructure_10_desc:0 "Les centrales électriques sont énormes, avec des capacités de production d’énergie vastes."
    
