    tech_construction_infrastructure_10:0 "Robots Constructeurs"
    
    tech_construction_infrastructure_1_desc:0 "Un outil électroportatif est un outil actionné par une source d’énergie supplémentaire et un mécanisme autre que le travail manuel seul utilisé avec des outils manuels."
    tech_construction_infrastructure_2_desc:0 "Le béton armé, aussi appelé ferrobéton, est un matériau composite dans lequel la faible résistance à la traction et la ductilité du béton sont compensées par l’inclusion d’un renforcement ayant une résistance à la traction ou une ductilité plus élevée."
    tech_construction_infrastructure_3_desc:0 "La préfabrication est la pratique d’assembler des composants d’une structure dans une usine ou autre site de fabrication, puis de transporter les assemblages complets ou sous-ensembles sur le chantier de construction où la structure sera située."
    tech_construction_infrastructure_4_desc:0 "La machinerie de construction comprend toutes les machines utilisées pour les activités de construction, allant de l’excavation des sols au transport, chargement, déchargement des matériaux et à la gestion des déchets."
    tech_construction_infrastructure_5_desc:0 "Le cœur contreforté est un système structurel pour les bâtiments hauts, composé d’un noyau hexagonal renforcé par trois contreforts formant une forme en Y."
    tech_construction_infrastructure_6_desc:0 "L’acier structurel est une catégorie d’acier utilisée pour fabriquer des matériaux de construction sous diverses formes. Beaucoup de formes d’acier structurel prennent la forme d’une poutre allongée avec un profil de section transversale spécifique."
    tech_construction_infrastructure_7_desc:0 "La conception de bâtiments, aussi appelée conception architecturale, fait référence aux applications larges d’architecture, d’ingénierie et de techniques pour la conception de bâtiments."
    tech_construction_infrastructure_8_desc:0 "Le béton est un matériau composite composé d’agrégats liés ensemble par un ciment fluide qui durcit en un solide au fil du temps."
    tech_construction_infrastructure_9_desc:0 "Un outil électroportatif est un outil actionné par une source d’énergie supplémentaire et un mécanisme autre que le travail manuel seul utilisé avec des outils manuels."
    tech_construction_infrastructure_10_desc:0 "Les robots de construction sont un sous-ensemble de robots industriels utilisés pour la construction de bâtiments et d’infrastructures sur site."
    
    tech_agriculture_1:0 "Engrais"
    tech_agriculture_2:0 "Machinerie Agricole"
    tech_agriculture_3:0 "Élevage en Cage"
    tech_agriculture_4:0 "Méga Fermes"
    tech_agriculture_5:0 "Pesticides"
    tech_agriculture_6:0 "Organismes Génétiquement Modifiés"
    tech_agriculture_7:0 "Robots Agricoles"
    tech_agriculture_8:0 "Agriculture Guidée par IA"
    tech_agriculture_9:0 "Fermes Intelligentes"
    tech_agriculture_10:0 "Fermes Entièrement Automatisées"
    
    tech_agriculture_1_desc:0 "Un engrais est toute matière d’origine naturelle ou synthétique appliquée au sol ou aux tissus végétaux pour fournir des nutriments aux plantes."
    tech_agriculture_2_desc:0 "La machinerie agricole concerne les structures mécaniques et dispositifs utilisés en agriculture ou dans les travaux agricoles."
    tech_agriculture_3_desc:0 "L’élevage en cage, aussi appelé élevage intensif ou industriel, désigne une méthode d’élevage de bétail, notamment de volailles et d’œufs, dans des espaces confinés avec une forte densité d’animaux."
    tech_agriculture_4_desc:0 "Les méga-fermes et fermes intensives occupent beaucoup moins d’espace que les fermes traditionnelles, et permettent de garder les animaux en sécurité, à l’abri des prédateurs."
    tech_agriculture_5_desc:0 "Les pesticides sont des substances utilisées pour contrôler les nuisibles. Ils incluent herbicides, insecticides, nématicides, fongicides et bien d’autres."
    tech_agriculture_6_desc:0 "Un organisme génétiquement modifié est tout organisme dont le matériel génétique a été modifié par des techniques de génie génétique."
    tech_agriculture_7_desc:0 "Un robot agricole est défini comme tout dispositif robotique pouvant améliorer les processus agricoles en prenant en charge de nombreuses tâches laborieuses ou lentes du fermier. L’usage des robots en agriculture rend les tâches plus simples, rapides et efficaces."
    tech_agriculture_8_desc:0 "L’IA en agriculture de précision (AP) permet aux agriculteurs et gestionnaires d’exploiter des pratiques agricoles très ciblées et précises basées sur des mesures agroclimatiques spécifiques au site."
    tech_agriculture_9_desc:0 "L’agriculture intelligente, aussi appelée agriculture connectée, est l’adoption de technologies avancées et d’opérations agricoles basées sur les données pour optimiser et améliorer la durabilité de la production agricole."
    tech_agriculture_10_desc:0 "L’agriculture automatisée utilise divers dispositifs technologiques pour améliorer et automatiser les opérations agricoles et le cycle de production des cultures ou du bétail, rendant les fermes plus efficaces."
    
    tech_land_infrastructure_1:0 "Routes et Chemins de Fer de Base"
    tech_land_infrastructure_2:0 "Premiers Systèmes de Contrôle du Trafic"
    tech_land_infrastructure_3:0 "Réseaux Intégrés de Transport Urbain"
    tech_land_infrastructure_4:0 "Trains à Grande Vitesse et Autoroutes"
    tech_land_infrastructure_5:0 "Chemins de Fer et Autoroutes à Grand Volume"
    tech_land_infrastructure_6:0 "Systèmes Modernes de Contrôle du Trafic"
    tech_land_infrastructure_7:0 "Véhicules Électriques"
    tech_land_infrastructure_8:0 "Véhicules Autonomes"
    tech_land_infrastructure_9:0 "Infrastructures Intelligentes"
    tech_land_infrastructure_10:0 "Mégainfrastructures"
    
    tech_land_infrastructure_1_desc:0 "Routes et chemins de fer de base"
    tech_land_infrastructure_2_desc:0 "L’infrastructure de base comprend les principales voies ferrées, routes, canaux, ports et quais, le télégraphe électromagnétique, le drainage, les digues et le drainage des terres."
    tech_land_infrastructure_3_desc:0 "Le transport public intégré combine divers modes de transport et opérateurs, via des processus organisationnels et de planification, facilitée par l’adoption d’infrastructures et technologies pour maximiser la facilité et l’efficacité pour les usagers."
    tech_land_infrastructure_4_desc:0 "Le train à grande vitesse (TGV) est un réseau de transport ferroviaire utilisant des trains circulant beaucoup plus vite que les trains traditionnels. Une autoroute est une route principale, particulièrement celle reliant villes et agglomérations."
    tech_land_infrastructure_5_desc:0 "Les chemins de fer et autoroutes sont très larges et peuvent accueillir un volume élevé de trafic."
    tech_land_infrastructure_6_desc:0 "La gestion du trafic est une branche clé de la logistique. Elle concerne la planification, le contrôle et l’achat de services de transport nécessaires pour déplacer physiquement véhicules et marchandises."
    tech_land_infrastructure_7_desc:0 "Un véhicule électrique est un véhicule qui utilise un ou plusieurs moteurs électriques pour la propulsion. Le véhicule peut être alimenté par un système collecteur, avec électricité provenant de sources extérieures, ou être autonome via une batterie ou conversion de carburant en électricité par générateur ou pile à combustible."
    tech_land_infrastructure_8_desc:0 "Les véhicules autonomes fonctionnent grâce à des technologies de détection à distance incluant radar, GPS, caméras et lidar pour surveiller et créer une carte 3D de leur environnement."
    tech_land_infrastructure_9_desc:0 "Une infrastructure intelligente est un système intelligent utilisant une boucle de rétroaction de données pour améliorer la prise de décision sur un sujet donné."
    tech_land_infrastructure_10_desc:0 "Les routes et chemins de fer sont gigantesques."
    
    tech_communication_infrastructure_1:0 "Réseau télégraphique"
    tech_communication_infrastructure_2:0 "Réseau radio et téléphonique"
    tech_communication_infrastructure_3:0 "Réseau de télévision monochrome"
    tech_communication_infrastructure_4:0 "Réseau de télévision couleur"
    tech_communication_infrastructure_5:0 "Système de positionnement global"
    tech_communication_infrastructure_6:0 "Réseau Internet précoce"
    tech_communication_infrastructure_7:0 "Internet intégré à l’IA"
    tech_communication_infrastructure_8:0 "Internet haut débit"
    tech_communication_infrastructure_9:0 "Internet avancé"
    tech_communication_infrastructure_10:0 "Internet des objets"

    tech_communication_infrastructure_1_desc:0 "Un télégraphe est un système de communication qui envoie des informations en établissant et interrompant une connexion électrique. Il est principalement associé à l’envoi d’impulsions électriques le long d’un fil avec un codage en code Morse."
    tech_communication_infrastructure_2_desc:0 "Un réseau sans fil utilise des signaux radio pour échanger des données entre deux dispositifs physiques ou plus."
    tech_communication_infrastructure_3_desc:0 "Un téléviseur monochrome est un appareil électrique conçu pour convertir les signaux diffusés en images télévisées en noir et blanc ainsi que le son associé."
    tech_communication_infrastructure_4_desc:0 "La télévision couleur est une technologie de transmission télévisée incluant les informations de couleur pour l’image, afin que celle-ci puisse être affichée en couleur sur le téléviseur. Elle améliore la technologie monochrome, qui affiche l’image en nuances de gris."
    tech_communication_infrastructure_5_desc:0 "Le Système de positionnement global est un système de navigation radio basé sur des satellites."
    tech_communication_infrastructure_6_desc:0 "Un réseau Internet est un système de communication mondial composé de réseaux autonomes interconnectés."
    tech_communication_infrastructure_7_desc:0 "L’intelligence artificielle, ou IA, est une technologie qui permet aux ordinateurs et aux machines de simuler l’intelligence humaine et leurs capacités de résolution de problèmes."
    tech_communication_infrastructure_8_desc:0 "En télécommunications, le haut débit désigne la transmission de données à large bande exploitant des signaux sur une large plage de fréquences ou plusieurs fréquences simultanées, utilisée pour un accès rapide à Internet."
    tech_communication_infrastructure_9_desc:0 "L’intelligence artificielle (IA) est utilisée pour développer de nouvelles façons d’interagir avec Internet, telles que les chatbots et les assistants virtuels."
    tech_communication_infrastructure_10_desc:0 "L’Internet des objets décrit des dispositifs équipés de capteurs, de capacités de traitement, de logiciels et d’autres technologies qui se connectent et échangent des données avec d’autres dispositifs et systèmes via Internet ou d’autres réseaux de communication."
    
