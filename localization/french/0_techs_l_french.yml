    tech_military_ground_forces_6:0 "Blindage réactif"
    tech_military_ground_forces_7:0 "Armement compact"
    tech_military_ground_forces_8:0 "Systèmes d’armes guidés par IA"
    tech_military_ground_forces_9:0 "Véhicules de combat entièrement automatisés"
    tech_military_ground_forces_10:0 "Soldats bioniques"

    tech_military_ground_forces_1_desc:0 "Le fusil à verrou est un type d’arme à feu manuelle qui fonctionne en manipulant directement le verrou via une poignée, généralement située du côté droit de l’arme."
    tech_military_ground_forces_2_desc:0 "L’artillerie est une arme à distance qui lance des munitions bien au-delà de la portée et de la puissance des armes d’infanterie."
    tech_military_ground_forces_3_desc:0 "Les chars sont des véhicules de combat lourdement armés et blindés, se déplaçant sur deux chaînes métalliques sans fin appelées chenilles. Ils servent essentiellement de plateformes d’armes, rendant les armes qu’ils portent plus efficaces grâce à leur mobilité tout-terrain et à la protection qu’ils offrent à leur équipage."
    tech_military_ground_forces_4_desc:0 "Un véhicule blindé de transport de troupes est un type large de véhicule militaire blindé conçu pour transporter du personnel et du matériel en zones de combat."
    tech_military_ground_forces_5_desc:0 "Un char de combat principal, aussi appelé char de bataille ou char universel, est un char qui remplit le rôle de feu direct protégé par un blindage et de manœuvre dans de nombreuses armées modernes."
    tech_military_ground_forces_6_desc:0 "Le blindage réactif est un type de blindage utilisé pour protéger les véhicules, notamment les chars modernes, contre les charges creuses et les projectiles cinétiques renforcés."
    tech_military_ground_forces_7_desc:0 "Les armes légères sont, au sens large, des armes portatives par l’infanterie, qu’il s’agisse d’armes à feu cinétiques servies par un équipage, d’engins incendiaires ou de lanceurs de munitions explosives."
    tech_military_ground_forces_8_desc:0 "Les systèmes d’armes autonomes létaux (LAWS) sont une catégorie spéciale d’armes utilisant des capteurs et des algorithmes informatiques pour identifier de manière indépendante une cible et engager celle-ci avec une arme embarquée sans contrôle manuel humain."
    tech_military_ground_forces_9_desc:0 "Un véhicule terrestre sans pilote (UGV) est un véhicule qui fonctionne en contact avec le sol sans présence humaine à bord."
    tech_military_ground_forces_10_desc:0 "Les soldats sont équipés d’implants pour les rendre plus efficaces au combat."
    
    tech_military_infantry_1:0 "Infanterie 1"
    tech_military_infantry_2:0 "Infanterie 2"
