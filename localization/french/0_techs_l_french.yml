    tech_military_space_program_1:0 "Physique spatiale"
    tech_military_space_program_2:0 "Observatoire"
    tech_military_space_program_3:0 "Fusées et sondes spatiales"
    tech_military_space_program_4:0 "Satellites et astronautes"
    tech_military_space_program_5:0 "Navette spatiale"
    tech_military_space_program_6:0 "Centres spatiaux"
    tech_military_space_program_7:0 "Fusées réutilisables"
    tech_military_space_program_8:0 "Grandes réseaux de satellites"
    tech_military_space_program_9:0 "Bases lunaires"
    tech_military_space_program_10:0 "Exploration du système solaire"

    tech_military_space_program_1_desc:0 "La physique spatiale, également appelée physique du plasma spatial, étudie les plasmas naturels présents dans la haute atmosphère terrestre et dans le reste du système solaire. Elle inclut les sujets d’aéronomie, d’aurores, d’ionosphères et magnétosphères planétaires, de ceintures de radiation et de météorologie spatiale."
    tech_military_space_program_2_desc:0 "Un observatoire est un lieu utilisé pour observer des événements terrestres, marins ou célestes."
    tech_military_space_program_3_desc:0 "Une sonde spatiale est un engin non habité envoyé pour explorer l’espace et recueillir des informations scientifiques."
    tech_military_space_program_4_desc:0 "Un satellite est un petit objet qui orbite autour d’un objet plus grand dans l’espace. Un satellite peut être une lune, une planète ou un engin qui orbite autour d’une planète ou d’une étoile."
    tech_military_space_program_5_desc:0 "Une navette spatiale est un engin spatial lancé par une fusée, capable d’atterrir comme un avion sans moteur, utilisé pour effectuer des voyages répétés entre la Terre et l’espace."
    tech_military_space_program_6_desc:0 "Les centres spatiaux sont généralement associés aux sites de lancement des engins spatiaux."
    tech_military_space_program_7_desc:0 "Un lanceur réutilisable a des parties pouvant être récupérées et réutilisées, tout en transportant des charges utiles de la surface vers l’espace."
    tech_military_space_program_8_desc:0 "Un réseau de satellites est une combinaison de nœuds fournissant une communication d’un point à un autre sur la Terre."
    tech_military_space_program_9_desc:0 "Une base lunaire est un avant-poste humain à la surface ou sous la surface de la Lune. Plus qu’un simple campement temporaire, ces bases soutiennent les activités robotiques ou humaines en fournissant une infrastructure de surface."
    tech_military_space_program_10_desc:0 "L’exploration spatiale est l’utilisation de l’astronomie et de la technologie spatiale pour explorer l’espace extra-atmosphérique. Elle est menée physiquement par des sondes robotiques non habitées et des vols habités."

    tech_military_airforce_1:0 "Biplans à hélice"
    tech_military_airforce_2:0 "Premiers bombardiers"
    tech_military_airforce_3:0 "Avions de guerre à réaction"
    tech_military_airforce_4:0 "Missiles air-air"
    tech_military_airforce_5:0 "Chasseurs polyvalents"
    tech_military_airforce_6:0 "Avions furtifs"
    tech_military_airforce_7:0 "Défenses anti-SAM modernes"
    tech_military_airforce_8:0 "Avions de guerre guidés par IA"
    tech_military_airforce_9:0 "Avions de guerre entièrement automatisés"
    tech_military_airforce_10:0 "Vaisseaux-mères aériens"

    tech_military_airforce_1_desc:0 "Un biplan est un avion à ailes fixes avec deux ailes principales superposées."
    tech_military_airforce_2_desc:0 "Un bombardier est un avion militaire équipé d’armes air-sol pour larguer des bombes, lancer des torpilles ou déployer des missiles de croisière aéroportés."
    tech_military_airforce_3_desc:0 "Un avion à réaction est un avion propulsé par un ou plusieurs moteurs à réaction."
    tech_military_airforce_4_desc:0 "Un missile air-air est un missile lancé depuis un avion dans le but de détruire un autre avion. Ils sont généralement propulsés par un ou plusieurs moteurs-fusées, souvent à propergol solide."
    tech_military_airforce_5_desc:0 "Un avion de combat polyvalent est destiné à accomplir plusieurs rôles en combat, incluant combat air-air, appui aérien, bombardement, reconnaissance, guerre électronique et suppression des défenses aériennes."
    tech_military_airforce_6_desc:0 "Les avions furtifs sont conçus pour éviter la détection grâce à diverses technologies réduisant la réflexion ou l’émission des ondes radar, infrarouges, lumière visible, radiofréquences et audio."
    tech_military_airforce_7_desc:0 "Un missile sol-air est un missile conçu pour être lancé depuis le sol ou la mer afin de détruire des avions ou autres missiles."
    tech_military_airforce_8_desc:0 "L’intelligence artificielle est utilisée pour piloter les avions de guerre."
    tech_military_airforce_9_desc:0 "Un véhicule aérien sans pilote, ou drone, est un avion sans pilote, équipage ni passagers à bord."
    tech_military_airforce_10_desc:0 "Un porte-avions aérien est un type de vaisseau-mère pouvant transporter, lancer, récupérer et soutenir d’autres petits avions parasites."

    tech_military_support_1:0 "Corps d’officiers professionnels"
    tech_military_support_2:0 "Jeux de guerre"
    tech_military_support_3:0 "Logistique et artillerie mécanisées"
    tech_military_support_4:0 "Renseignement militaire"
    tech_military_support_5:0 "Unité de commandement"
    tech_military_support_6:0 "Spécialisation au combat"
    tech_military_support_7:0 "Capacité ISR"
    tech_military_support_8:0 "Logistique et artillerie guidées par IA"
    tech_military_support_9:0 "Logistique et artillerie entièrement automatisées"
    tech_military_support_10:0 "Canons orbitaux"

    tech_military_support_1_desc:0 "Une unité tactique comprenant généralement deux divisions ou plus ainsi que des services auxiliaires."
    tech_military_support_2_desc:0 "Un jeu de guerre est un jeu de stratégie où deux joueurs ou plus commandent des forces armées opposées simulant un conflit armé. Utilisé pour le loisir, la formation ou l’étude des conflits."
    tech_military_support_3_desc:0 "La logistique militaire est la discipline qui planifie et exécute le mouvement, l’approvisionnement et la maintenance des forces armées."
    tech_military_support_4_desc:0 "Le renseignement militaire collecte et analyse des informations pour guider les décisions des commandants."
    tech_military_support_5_desc:0 "Dans l’organisation militaire, l’unité de commandement signifie que les subordonnés doivent répondre à un seul commandant."
    tech_military_support_6_desc:0 "Les spécialisations militaires sont des métiers ou carrières dans l’armée demandant qualification et compétences spécifiques."
    tech_military_support_7_desc:0 "ISR (Renseignement, Surveillance, Reconnaissance) désigne l’acquisition, le traitement et la fourniture coordonnés d’informations précises et en temps utile pour soutenir les opérations."
    tech_military_support_8_desc:0 "L’intelligence artificielle est intégrée dans les systèmes logistiques militaires."
    tech_military_support_9_desc:0 "L’artillerie automotrice est une artillerie équipée de son propre système de propulsion pour se déplacer vers sa position de tir."
    tech_military_support_10_desc:0 "Un canon orbital est un système de bombardement cinétique télécommandé."

    tech_military_naval_forces_1:0 "Cuirassés Dreadnought"
    tech_military_naval_forces_2:0 "Croiseurs de bataille"
    tech_military_naval_forces_3:0 "Premiers porte-avions"
    tech_military_naval_forces_4:0 "Sous-marins longue portée"
    tech_military_naval_forces_5:0 "Croiseurs lance-missiles"
    tech_military_naval_forces_6:0 "Porte-avions modernes"
    tech_military_naval_forces_7:0 "Cuirassés modernes"
    tech_military_naval_forces_8:0 "Navires de guerre modulaires"
    tech_military_naval_forces_9:0 "Navires de guerre autonomes"
    tech_military_naval_forces_10:0 "Forteresses flottantes"

    tech_military_naval_forces_1_desc:0 "Le dreadnought était le type prédominant de cuirassé au début du XXe siècle."
    tech_military_naval_forces_2_desc:0 "Le croiseur de bataille était un navire de premier rang durant la première moitié du XXe siècle, semblable en déplacement, armement et coût aux cuirassés, mais différent dans la forme et l’équilibre des attributs."
    tech_military_naval_forces_3_desc:0 "Un porte-avions est un navire de guerre servant de base aérienne flottante, équipé d’un pont d’envol complet et des installations pour transporter, armer, déployer et récupérer des avions."
    tech_military_naval_forces_4_desc:0 "Un sous-marin est un engin capable d’opérer de manière indépendante sous l’eau."
    tech_military_naval_forces_5_desc:0 "Les croiseurs lance-missiles sont des navires de guerre équipés de missiles guidés longue portée."
    tech_military_naval_forces_6_desc:0 "Un porte-avions moderne est un navire de guerre équipé d’un pont d’envol complet pour les opérations aériennes."
    tech_military_naval_forces_7_desc:0 "Les cuirassés modernes sont des navires très protégés avec des canons lourds."
    tech_military_naval_forces_8_desc:0 "Les navires de guerre modulaires peuvent changer de configuration selon la mission."
    tech_military_naval_forces_9_desc:0 "Les navires de guerre autonomes sont contrôlés par des systèmes automatisés sans équipage."
    tech_military_naval_forces_10_desc:0 "Les forteresses flottantes sont des structures navales fortement armées et défendues."
    
    tech_military_nuclear_1:0 "Physique nucléaire"
    tech_military_nuclear_2:0 "Extraction et enrichissement de l’uranium"
    tech_military_nuclear_3:0 "Bombe atomique"
    tech_military_nuclear_4:0 "Bombe à hydrogène"
    tech_military_nuclear_5:0 "Premiers missiles anti-balistiques"
    tech_military_nuclear_6:0 "Missiles hypersoniques"
    tech_military_nuclear_7:0 "Missiles anti-balistiques modernes"
    tech_military_nuclear_8:0 "Armes nucléaires à haute puissance"
    tech_military_nuclear_9:0 "Systèmes d’armes nucléaires opérés par IA"
    tech_military_nuclear_10:0 "Armes d’Armageddon"

    tech_military_nuclear_1_desc:0 "La physique nucléaire est la branche de la physique qui étudie les noyaux atomiques, leurs constituants et interactions, ainsi que d’autres formes de matière nucléaire. Elle ne doit pas être confondue avec la physique atomique, qui étudie l’atome dans son ensemble, y compris ses électrons."
    tech_military_nuclear_2_desc:0 "L’enrichissement élimine l’uranium-238 indésirable, augmentant la concentration en uranium-235."
    tech_military_nuclear_3_desc:0 "La bombe atomique est une arme à grande puissance explosive résultant de la fission des noyaux d’un métal lourd comme le plutonium ou l’uranium.\n\nNote : Les armes nucléaires peuvent être développées en cliquant sur la décision « Développer les armes nucléaires »."
    tech_military_nuclear_4_desc:0 "La bombe à hydrogène est une bombe extrêmement puissante dont la destruction provient de la libération rapide d’énergie lors de la fusion nucléaire d’isotopes d’hydrogène (deutérium et tritium), utilisant une bombe atomique comme amorce."
    tech_military_nuclear_5_desc:0 "Un missile anti-balistique est un missile sol-air conçu pour contrer les missiles balistiques. Ces derniers servent à délivrer des ogives nucléaires, chimiques, biologiques ou conventionnelles sur une trajectoire balistique."
    tech_military_nuclear_6_desc:0 "Une arme hypersonique est une arme capable de voyager à une vitesse hypersonique, définie entre 5 et 25 fois la vitesse du son, soit environ 1 à 5 miles par seconde."
    tech_military_nuclear_7_desc:0 "Un missile anti-balistique est un missile sol-air conçu pour contrer les missiles balistiques. Ces derniers servent à délivrer des ogives nucléaires, chimiques, biologiques ou conventionnelles sur une trajectoire balistique."
    tech_military_nuclear_8_desc:0 "Le rendement explosif d’une arme nucléaire est la quantité d’énergie libérée sous forme d’onde de choc, chaleur et radiation nucléaire lors de sa détonation."
    tech_military_nuclear_9_desc:0 "L’autorité pour lancer des armes nucléaires est déléguée à un système d’intelligence artificielle."
    tech_military_nuclear_10_desc:0 "Un dispositif de fin du monde est une construction hypothétique — généralement une arme ou un système d’armes — capable de détruire toute vie sur une planète."

    tech_military_carrier_1:0 "Porte-avions 1"
    tech_military_carrier_2:0 "Porte-avions 2"
    tech_military_carrier_3:0 "Porte-avions 3"
    tech_military_carrier_4:0 "Porte-avions 4"
    tech_military_carrier_5:0 "Porte-avions 5"
    tech_military_carrier_6:0 "Porte-avions 6"
    tech_military_carrier_7:0 "Porte-avions 7"
    tech_military_carrier_8:0 "Porte-avions 8"
    tech_military_carrier_9:0 "Porte-avions 9"
    tech_military_carrier_10:0 "Porte-avions 10"

    tech_military_navy_doctrine_1:0 "Signalisation navale de base"
    tech_military_navy_doctrine_2:0 "Écoles d’état-major naval"
    tech_military_navy_doctrine_3:0 "Premiers groupes de bataille de porte-avions"
    tech_military_navy_doctrine_4:0 "Flotte en existence"
    tech_military_navy_doctrine_5:0 "Stratégies de bombardement naval"
    tech_military_navy_doctrine_6:0 "Marine à réaction rapide"
    tech_military_navy_doctrine_7:0 "Systèmes modernes de navigation navale"
    tech_military_navy_doctrine_8:0 "Groupes de bataille de porte-avions modernes"
    tech_military_navy_doctrine_9:0 "Gestion mondiale de la flotte"
    tech_military_navy_doctrine_10:0 "Amiraux IA"
    
    tech_military_navy_doctrine_1_desc:0 "La signalisation navale par drapeaux couvre diverses formes de signalisation par drapeaux, telles que le sémaphore ou la manœuvre par pavillons, utilisées par différentes marines ; à distinguer de la signalisation maritime par des navires marchands ou autres non navals ou des drapeaux utilisés à des fins d’identification."
    tech_military_navy_doctrine_2_desc:0 "Les écoles d’état-major forment les officiers militaires aux aspects administratifs, du personnel militaire et des politiques de leur profession."
    tech_military_navy_doctrine_3_desc:0 "Un groupe de bataille de porte-avions est une flotte navale composée d’un navire amiral porte-avions et d’un grand nombre d’escortes, formant ensemble le groupe."
    tech_military_navy_doctrine_4_desc:0 "En guerre navale, une « flotte en existence » est une force navale exerçant une influence de contrôle sans jamais quitter le port."
    tech_military_navy_doctrine_5_desc:0 "Le soutien par le feu naval (NGFS), aussi appelé soutien par le feu de surface naval (NSFS) ou bombardement côtier, est l’utilisation de l’artillerie navale pour appuyer les assauts amphibies et autres troupes opérant à portée."
    tech_military_navy_doctrine_6_desc:0 "Une marine à réaction rapide est une flotte de navires toujours prête à un déploiement immédiat."
    tech_military_navy_doctrine_7_desc:0 "La navigation maritime est l’art et la science de diriger un navire d’un point de départ (la navigation) à une destination, de manière efficace et responsable."
    tech_military_navy_doctrine_8_desc:0 "Un groupe de bataille de porte-avions est une flotte navale composée d’un navire amiral porte-avions et d’un grand nombre d’escortes, formant ensemble le groupe."
    tech_military_navy_doctrine_9_desc:0 "La gestion mondiale de la flotte consiste à superviser une flotte opérant dans plusieurs pays."
    tech_military_navy_doctrine_10_desc:0 "L’intelligence artificielle est utilisée pour contrôler les navires de guerre."

    tech_military_theory_1:0 "Planification stratégique"
    tech_military_theory_2:0 "Guerre combinée"
    tech_military_theory_3:0 "Théâtres de guerre"
    tech_military_theory_4:0 "Destruction mutuelle assurée"
    tech_military_theory_5:0 "Guerre asymétrique"
    tech_military_theory_6:0 "ISR"
    tech_military_theory_7:0 "Force spatiale"
    tech_military_theory_8:0 "Guerre automatisée"
    tech_military_theory_9:0 "Espace de guerre numérique"
    tech_military_theory_10:0 "Généraux IA"

    tech_military_theory_1_desc:0 "La planification stratégique est le processus d’une organisation visant à définir sa stratégie ou sa direction, et à prendre des décisions sur l’allocation de ses ressources pour atteindre ses objectifs stratégiques."
    tech_military_theory_2_desc:0 "La guerre combinée est une approche militaire cherchant à intégrer différents corps de combat pour obtenir des effets complémentaires — par exemple, l’utilisation conjointe d’infanterie et de blindés en milieu urbain où chacun soutient l’autre."
    tech_military_theory_3_desc:0 "En guerre, un théâtre est une zone où des événements militaires importants ont lieu ou sont en cours. Un théâtre peut inclure la totalité de l’espace aérien, terrestre et maritime impliqué ou potentiellement impliqué dans les opérations de guerre."
    tech_military_theory_4_desc:0 "La destruction mutuelle assurée est une doctrine stratégique et de sécurité nationale affirmant que l’utilisation à grande échelle d’armes nucléaires par un attaquant contre un défenseur nucléaire capable de seconde frappe entraînerait l’anéantissement complet des deux parties."
    tech_military_theory_5_desc:0 "La guerre asymétrique est un type de conflit entre belligérants dont la puissance militaire, la stratégie ou les tactiques diffèrent significativement. Ce type de guerre implique souvent, mais pas nécessairement, des insurgés ou des milices de résistance qui peuvent être considérés comme combattants illégaux face à une armée régulière."
    tech_military_theory_6_desc:0 "L’ISR (Renseignement, Surveillance, Reconnaissance) est typiquement utilisé en contexte militaire. Il s’agit d’une fonction intégrée d’acquisition, de traitement et de fourniture d’informations et renseignements précis, pertinents et opportuns pour soutenir la prise de décision du commandant. La plupart des installations terrestres, maritimes, aériennes et spatiales jouent un rôle crucial dans l’acquisition ISR."
    tech_military_theory_7_desc:0 "Une force spatiale est une branche militaire des forces armées d’une nation qui conduit des opérations militaires dans l’espace extra-atmosphérique et la guerre spatiale."
    tech_military_theory_8_desc:0 "La planification stratégique est assistée par intelligence artificielle."
    tech_military_theory_9_desc:0 "La guerre numérique, sous-ensemble de la guerre de l’information, implique des attaques non physiques sur les informations, les processus d’information et les infrastructures d’information qui compromettent, altèrent, endommagent, perturbent ou détruisent les données et/ou retardent, confondent, trompent et perturbent le traitement de l’information et la prise de décision."
    tech_military_theory_10_desc:0 "L’armée est commandée par une intelligence artificielle puissante."

    ### Technologies Société ###

    tech_urbanization_1:0 "Services urbains basiques"
    tech_urbanization_2:0 "Transports publics"
    tech_urbanization_3:0 "Gratte-ciel"
    tech_urbanization_4:0 "Villes satellites"
    tech_urbanization_5:0 "Bâtiments à usage mixte"
    tech_urbanization_6:0 "Services urbains intégrés"
    tech_urbanization_7:0 "Espaces verts urbains"
    tech_urbanization_8:0 "Villes intelligentes"
    tech_urbanization_9:0 "La mégarégion"
    tech_urbanization_10:0 "L’écuménopolis"

    tech_urbanization_1_desc:0 "Les services publics fournissent des biens et services considérés comme essentiels ; eau, gaz, électricité, téléphone, gestion des déchets et autres systèmes de communication représentent une grande part du marché des services publics."
    tech_urbanization_2_desc:0 "Le transport public désigne un système de véhicules comme bus et trains opérant à horaires fixes sur des itinéraires définis et utilisés par le public."
    tech_urbanization_3_desc:0 "Les gratte-ciel sont des bâtiments à plusieurs étages suffisamment hauts pour nécessiter un système de transport vertical mécanique comme des ascenseurs."
    tech_urbanization_4_desc:0 "Une ville satellite est une municipalité plus petite faisant partie d’une grande zone métropolitaine et servant de centre régional de population et d’emploi."
    tech_urbanization_5_desc:0 "Un bâtiment à usage mixte est une structure servant plusieurs fonctions combinant résidentiel, commercial, commerce de détail, hôtel, parking, médical, loisirs et/ou industriel."
    tech_urbanization_6_desc:0 "Les services urbains sont dirigés et contrôlés par une autorité unique."
    tech_urbanization_7_desc:0 "En aménagement du territoire, les espaces verts urbains sont des zones ouvertes réservées aux parcs et autres espaces naturels, y compris la végétation, plans d’eau — aussi appelés espaces bleus — et autres environnements naturels."
    tech_urbanization_8_desc:0 "Le concept de ville intelligente implique l’intégration de technologies de pointe incluant Internet des objets, réalité augmentée, intelligence artificielle, entre autres."
    tech_urbanization_9_desc:0 "Une mégarégion englobe plusieurs villes et comtés, souvent plusieurs états, qui doivent travailler collectivement à sa gestion."
    tech_urbanization_10_desc:0 "L’écuménopolis est le concept hypothétique d’une ville planétaire."

    tech_economy_1:0 "Économie comportementale"
    tech_economy_2:0 "Économie keynésienne"
    tech_economy_3:0 "Système de Bretton Woods"
    tech_economy_4:0 "Monétarisme"
    tech_economy_5:0 "Mondialisation économique"
    tech_economy_6:0 "Assouplissement quantitatif"
    tech_economy_7:0 "Responsabilité sociale des entreprises"
    tech_economy_8:0 "Finance comportementale quantitative"
    tech_economy_9:0 "Économie numérique"
    tech_economy_10:0 "Néo-capitalisme"
    
    tech_economy_1_desc:0 "L’économie comportementale combine des éléments d’économie et de psychologie pour comprendre comment et pourquoi les gens se comportent dans la réalité. Elle diffère de l’économie néoclassique, qui suppose que la plupart des personnes ont des préférences bien définies et prennent des décisions bien informées, basées sur ces préférences."
    tech_economy_2_desc:0 "L’économie keynésienne est une théorie macroéconomique de la dépense totale dans l’économie et de ses effets sur la production, l’emploi, et l’inflation. Elle a été développée par l’économiste britannique John Maynard Keynes dans les années 1930 pour faire face aux effets de la Grande Dépression."
    tech_economy_3_desc:0 "Le système de Bretton Woods est un ensemble de règles et politiques unifiées qui ont fourni le cadre nécessaire pour créer des taux de change internationaux fixes. Essentiellement, l’accord appelait le FMI nouvellement créé à déterminer le taux fixe de change des devises dans le monde."
    tech_economy_4_desc:0 "Le monétarisme est une théorie en économie qui affirme qu’une croissance économique stable ne peut être assurée que par le contrôle du taux d’augmentation de la masse monétaire pour correspondre à la capacité de croissance de la productivité réelle."
    tech_economy_5_desc:0 "La mondialisation économique fait référence au mouvement international étendu des biens, capitaux, services, technologies et informations."
    tech_economy_6_desc:0 "L’assouplissement quantitatif (QE) est une stratégie de politique monétaire utilisée par les banques centrales. Avec le QE, une banque centrale achète des titres dans une tentative de réduire les taux d’intérêt, augmenter la masse monétaire et encourager plus de prêts aux consommateurs et aux entreprises."
    tech_economy_7_desc:0 "La responsabilité sociale des entreprises est un modèle commercial dans lequel les entreprises font un effort concerté pour fonctionner de manière à améliorer plutôt qu’à dégrader la société et l’environnement."
    tech_economy_8_desc:0 "La finance comportementale quantitative est une nouvelle discipline qui utilise la méthodologie mathématique et statistique pour comprendre les biais comportementaux en conjonction avec l’évaluation. La recherche peut être regroupée dans les domaines suivants : études empiriques qui démontrent des écarts significatifs par rapport aux théories classiques."
    tech_economy_9_desc:0 "The digital economy is the economic activity that results from billions of everyday online connections among people, businesses, devices, data, and processes."
    tech_economy_10_desc:0 "Neo-Capitalism is the materialisation of both the economic democracy to develop a wealth expansion and some pre-capitalistic aspects that need to exist in order to ensure the micro-economic and individual wealth."
    
    tech_economy_9_desc:0 "L’économie numérique est l’activité économique qui résulte de milliards de connexions quotidiennes en ligne entre personnes, entreprises, appareils, données et processus."
    tech_economy_10_desc:0 "Le néo-capitalisme est la matérialisation à la fois de la démocratie économique visant à développer une expansion de la richesse et de certains aspects pré-capitalistes nécessaires pour assurer la richesse microéconomique et individuelle."
    tech_politics_1:0 "Science politique précoce"
    tech_politics_2:0 "Nationalisme"
    tech_politics_3:0 "Mobilisation de masse idéologique"
    tech_politics_4:0 "Décolonisation"
    tech_politics_5:0 "Néo-libéralisme"
    tech_politics_6:0 "L’État de surveillance"
    tech_politics_7:0 "Manipulation des médias"
    tech_politics_8:0 "Science politique pluridisciplinaire"
    tech_politics_9:0 "Impérialisme culturel"
    tech_politics_10:0 "Utopianisme"
    tech_politics_1_desc:0 "La science politique est l’étude de la politique et du pouvoir selon des perspectives domestiques, internationales et comparatives. Elle implique la compréhension des idées politiques, idéologies, institutions, politiques, processus et comportements, ainsi que des groupes, classes, gouvernements, diplomatie, droit, stratégie et guerre."
    tech_politics_2_desc:0 "Le nationalisme est une idéologie qui met l’accent sur la loyauté, la dévotion ou l’allégeance à une nation ou un État-nation, et considère que ces obligations l’emportent sur d’autres intérêts individuels ou de groupe."
    tech_politics_3_desc:0 "La mobilisation de masse est définie comme un processus engageant et motivant un large éventail de partenaires et alliés aux niveaux national et local pour sensibiliser et exiger un objectif de développement particulier par un dialogue en face à face."
    tech_politics_4_desc:0 "La décolonisation est le processus de démantèlement du colonialisme, ce dernier étant le processus par lequel des nations impériales établissent et dominent des territoires étrangers, souvent outre-mer."
    tech_politics_5_desc:0 "Le néolibéralisme est aujourd’hui utilisé pour désigner des politiques de réforme orientées vers le marché telles que « éliminer les contrôles des prix, déréglementer les marchés de capitaux, abaisser les barrières commerciales » et réduire, notamment par la privatisation et l’austérité, l’influence de l’État dans l’économie."
    tech_politics_6_desc:0 "Un État de surveillance est un pays où le gouvernement pratique une surveillance pervasive d’un grand nombre de ses citoyens et visiteurs."
    tech_politics_7_desc:0 "La manipulation des médias désigne des campagnes orchestrées dans lesquelles des acteurs exploitent les caractéristiques distinctives des communications de masse ou des plateformes numériques pour induire en erreur, désinformer ou créer un récit qui fait avancer leurs intérêts et agendas."
    tech_politics_8_desc:0 "La science politique est l’étude de la politique et du pouvoir selon des perspectives domestiques, internationales et comparatives. Elle implique la compréhension des idées politiques, idéologies, institutions, politiques, processus et comportements, ainsi que des groupes, classes, gouvernements, diplomatie, droit, stratégie et guerre."
    tech_politics_9_desc:0 "L’impérialisme culturel comprend les dimensions culturelles de l’impérialisme. Le mot « impérialisme » décrit des pratiques par lesquelles un pays utilise la culture pour créer et maintenir des relations sociales et économiques inégales entre groupes sociaux."
    tech_politics_10_desc:0 "L’utopianisme est le terme général désignant diverses façons de rêver ou penser, décrire ou tenter de créer une société meilleure."
    tech_philosophy_1:0 "Système d’éducation primaire"
    tech_philosophy_2:0 "Système d’éducation secondaire"
    tech_philosophy_3:0 "Système d’éducation tertiaire"
    tech_philosophy_4:0 "Écoles professionnelles"
    tech_philosophy_5:0 "Tests standardisés"
    tech_philosophy_6:0 "Numérisation de l’éducation"
    tech_philosophy_7:0 "Apprentissage à distance"
    tech_philosophy_8:0 "Éducation pilotée par l’IA"
    tech_philosophy_9:0 "Éducation personnalisée"
    tech_philosophy_10:0 "Éducateurs robots"
    tech_philosophy_1_desc:0 "L’éducation primaire ou élémentaire est généralement la première étape de l’éducation formelle, venant après la maternelle/pré-scolaire et avant le secondaire."
    tech_philosophy_2_desc:0 "L’éducation secondaire se déroule généralement après six ans d’éducation primaire et est suivie par l’enseignement supérieur, la formation professionnelle ou l’emploi."
    tech_philosophy_3_desc:0 "L’éducation tertiaire, également appelée troisième niveau ou postsecondaire, est le niveau d’éducation suivant l’achèvement de l’éducation secondaire."
    tech_philosophy_4_desc:0 "Une école professionnelle, école de métiers ou école technique est un type d’établissement éducatif, qui selon les pays peut correspondre à l’éducation secondaire ou postsecondaire, conçu pour fournir une éducation professionnelle ou des compétences techniques requises pour accomplir les tâches d’un emploi spécifique."
    tech_philosophy_5_desc:0 "Un test standardisé est un test administré et noté de manière cohérente ou « standard ». Les tests standardisés sont conçus de manière à ce que les questions et interprétations soient cohérentes et soient administrés et notés selon un protocole prédéterminé et standard."
    tech_philosophy_6_desc:0 "La numérisation en éducation fait référence à l’intégration des technologies numériques dans l’apprentissage quotidien, comme les cours en ligne, les classes virtuelles et les manuels numériques."
    tech_philosophy_7_desc:0 "L’éducation à distance, aussi appelée apprentissage à distance, est l’éducation d’étudiants qui ne sont pas toujours physiquement présents à l’école, ou lorsque l’apprenant et l’enseignant sont séparés dans le temps et l’espace."
    tech_philosophy_8_desc:0 "L’intelligence artificielle (IA) a le potentiel de relever certains des plus grands défis actuels de l’éducation, en innovant les pratiques d’enseignement et d’apprentissage."
    tech_philosophy_9_desc:0 "L’apprentissage personnalisé, l’instruction individualisée, l’environnement d’apprentissage personnel et l’instruction directe font tous référence aux efforts visant à adapter l’éducation aux besoins différents des étudiants."
    tech_philosophy_10_desc:0 "L’apprentissage pendant le sommeil est une tentative de transmettre des informations à une personne endormie, généralement en lui faisant écouter un enregistrement sonore pendant qu’elle dort."
    tech_geopolitics_1:0 "Colonialisme"
    tech_geopolitics_2:0 "Organisations internationales"
    tech_geopolitics_3:0 "Endiguement"
    tech_geopolitics_4:0 "Conflit idéologique mondial"
    tech_geopolitics_5:0 "Traités multilatéraux complexes"
    tech_geopolitics_6:0 "Politique sans frontières"
    tech_geopolitics_7:0 "Intégration socio-économique"
    tech_geopolitics_8:0 "Régionalisation"
    tech_geopolitics_9:0 "Super-États mondiaux"
    tech_geopolitics_10:0 "Le Nouvel Ordre Mondial"
    tech_geopolitics_1_desc:0 "Le colonialisme est la poursuite, l’établissement et le maintien du contrôle et de l’exploitation des personnes et des ressources par un groupe étranger."
    tech_geopolitics_2_desc:0 "An international organisation is an organisation with its own international legal body, with members from more than one country, and often established by a treaty or other instrument, governed by international law."
    tech_geopolitics_2_desc:0 "Une organisation internationale est une institution ayant une personnalité juridique internationale, une autonomie et qui participe au processus législatif international, tout en agissant dans des domaines où elle possède des compétences."
    tech_geopolitics_3_desc:0 "L’endiguement est une stratégie géopolitique visant à arrêter l’expansion d’un ennemi. Cette stratégie est connue pour être utilisée pendant la guerre froide afin de limiter l’influence de l’Union soviétique."
    tech_geopolitics_4_desc:0 "Un conflit idéologique mondial désigne une confrontation à grande échelle où les idéologies opposées, comme le capitalisme et le communisme, s’affrontent à travers la politique, l’économie et la guerre par procuration."
    tech_geopolitics_5_desc:0 "Les traités multilatéraux complexes sont des accords internationaux impliquant plusieurs pays, souvent dans des domaines tels que le commerce, la sécurité et l’environnement, avec des obligations détaillées et interconnectées."
    tech_geopolitics_6_desc:0 "La politique sans frontières est un concept où la gouvernance et la coopération internationales dépassent les frontières nationales, favorisant la libre circulation des personnes, des idées et des biens."
    tech_geopolitics_7_desc:0 "L’intégration socio-économique est le processus par lequel différents pays ou régions coordonnent leurs politiques économiques, sociales et culturelles pour former un ensemble plus cohérent."
    tech_geopolitics_8_desc:0 "La régionalisation est la formation de blocs régionaux où les pays voisins coopèrent étroitement dans les domaines économiques, politiques ou sécuritaires."
    tech_geopolitics_9_desc:0 "Les super-États mondiaux sont des entités politiques regroupant plusieurs nations souveraines en un seul gouvernement centralisé, possédant un pouvoir significatif à l’échelle mondiale."
    tech_geopolitics_10_desc:0 "Le Nouvel Ordre Mondial est une vision hypothétique ou planifiée d’une gouvernance mondiale unifiée, souvent évoquée dans des contextes politiques ou conspirationnistes."
    
    tech_population_1:0 "Toniques de Santé" 
    tech_population_2:0 "Exercices de Base" 
    tech_population_3:0 "Science de la Nutrition" 
    tech_population_4:0 "Philosophie du Bien-être" 
    tech_population_5:0 "Compléments de Santé" 
    tech_population_6:0 "Gériatrie" 
    tech_population_7:0 "Vieillissement en Bonne Santé" 
    tech_population_8:0 "Assistance à la Vie" 
    tech_population_9:0 "Médecine Anti-Âge" 
    tech_population_10:0 "Gériatrie Avancée" 
 
    tech_population_1_desc:0 "Les toniques de santé sont des remèdes traditionnels et des concoctions censés restaurer la vitalité, renforcer le corps et promouvoir le bien-être général." 
    tech_population_2_desc:0 "Les exercices de base comprennent des activités physiques simples comme les étirements, la marche et la gymnastique, visant à améliorer la forme physique et à maintenir la santé." 
    tech_population_3_desc:0 "La science de la nutrition étudie la relation entre l’alimentation, les nutriments et la santé, fournissant la base des régimes équilibrés et de la prévention des maladies." 
    tech_population_4_desc:0 "La philosophie du bien-être met l’accent sur des approches holistiques de la santé, intégrant le bien-être physique, mental et social dans la vie quotidienne." 
    tech_population_5_desc:0 "Les compléments de santé sont des produits contenant des vitamines, des minéraux ou d’autres nutriments conçus pour soutenir l’alimentation et améliorer les fonctions corporelles." 
    tech_population_6_desc:0 "La gériatrie est la branche de la médecine consacrée aux soins de santé des personnes âgées, traitant les affections liées à l’âge et favorisant la qualité de vie." 
    tech_population_7_desc:0 "Le vieillissement en bonne santé consiste à maintenir le bien-être physique, mental et social tout au long de la vieillesse, permettant l’indépendance et la résilience." 
    tech_population_8_desc:0 "L’assistance à la vie offre un logement et des services de soutien aux personnes âgées qui ont besoin d’aide pour les activités quotidiennes tout en souhaitant conserver leur autonomie." 
    tech_population_9_desc:0 "La médecine anti-âge explore les traitements et interventions visant à ralentir ou inverser certains aspects du vieillissement biologique afin de prolonger la vitalité." 
    tech_population_10_desc:0 "La gériatrie avancée implique des soins médicaux spécialisés et des recherches sur les affections complexes liées à l’âge, en se concentrant sur la longévité et l’amélioration des soins aux personnes âgées." 
 
    tech_philosophy_1:0 "Enseignement primaire"
    tech_philosophy_2:0 "Enseignement secondaire"
    tech_philosophy_3:0 "Enseignement supérieur"
    tech_philosophy_4:0 "Écoles professionnelles"
    tech_philosophy_5:0 "Examens standardisés"
    tech_philosophy_6:0 "Numérisation de l'enseignement"
    tech_philosophy_7:0 "Enseignement à distance"
    tech_philosophy_8:0 "Enseignement assisté par l'IA"
    tech_philosophy_9:0 "Enseignement personnalisé"
    tech_philosophy_10:0 "Éducateurs robotisés"

    tech_philosophy_1_desc:0 "L'enseignement primaire, également appelé enseignement élémentaire, constitue généralement la première étape de l'éducation formelle. Il intervient après l'école maternelle et avant l'enseignement secondaire."
    tech_philosophy_2_desc:0 "L'enseignement secondaire intervient généralement après six années d'enseignement primaire. Il est suivi par l'enseignement supérieur, la formation professionnelle ou l'entrée dans la vie active."
    tech_philosophy_3_desc:0 "L'enseignement supérieur, également appelé enseignement du troisième degré ou postsecondaire, correspond au niveau d'études qui suit l'achèvement de l'enseignement secondaire."
    tech_philosophy_4_desc:0 "Une école professionnelle, une école de métiers ou une école technique est un établissement d'enseignement qui, selon les pays, relève du secondaire ou du postsecondaire. Elle vise à dispenser une formation professionnelle ou les compétences techniques nécessaires à l'exercice d'un métier précis."
    tech_philosophy_5_desc:0 "Un examen standardisé est une épreuve administrée et évaluée de manière uniforme. Les examens standardisés sont conçus de sorte que les questions et leur interprétation soient cohérentes, et que leur administration et leur notation suivent des règles prédéfinies."
    tech_philosophy_6_desc:0 "La numérisation de l'enseignement désigne l'intégration des technologies numériques dans l'apprentissage quotidien, notamment au moyen de cours en ligne, de salles de classe virtuelles et de manuels numériques."
    tech_philosophy_7_desc:0 "L'enseignement à distance consiste à former des élèves qui ne sont pas nécessairement présents physiquement dans un établissement scolaire, ou dans le cadre duquel l'enseignant et l'apprenant sont séparés dans le temps et dans l'espace."
    tech_philosophy_8_desc:0 "L'intelligence artificielle (IA) pourrait permettre de relever certains des plus grands défis actuels de l'éducation et d'innover dans les pratiques d'enseignement et d'apprentissage."
    tech_philosophy_9_desc:0 "L'apprentissage personnalisé, l'enseignement individualisé, l'environnement personnel d'apprentissage et l'enseignement direct désignent tous des approches visant à adapter l'éducation aux différents besoins des élèves."
    tech_philosophy_10_desc:0 "L'apprentissage durant le sommeil consiste à tenter de transmettre des informations à une personne endormie, généralement en lui faisant écouter un enregistrement sonore pendant qu'elle dort."

    tech_geopolitics_1:0 "Colonialisme"
    tech_geopolitics_2:0 "Organisations internationales"
    tech_geopolitics_3:0 "Endiguement"
    tech_geopolitics_4:0 "Conflit idéologique mondial"
    tech_geopolitics_5:0 "Traités multilatéraux complexes"
    tech_geopolitics_6:0 "Politique sans frontières"
    tech_geopolitics_7:0 "Intégration socio-économique"
    tech_geopolitics_8:0 "Régionalisation"
    tech_geopolitics_9:0 "Super-États mondiaux"
    tech_geopolitics_10:0 "Le nouvel ordre mondial"

    tech_geopolitics_1_desc:0 "Le colonialisme consiste à poursuivre, établir et maintenir le contrôle et l'exploitation de populations et de ressources par un groupe étranger."
    tech_geopolitics_2_desc:0 "Une organisation internationale est une organisation dotée de sa propre personnalité juridique internationale, dont les membres proviennent de plusieurs pays et qui est souvent créée par un traité ou un autre instrument régi par le droit international."
    tech_geopolitics_3_desc:0 "L'endiguement est une stratégie géopolitique de politique étrangère visant à contenir la puissance d'un État particulier."
    tech_geopolitics_4_desc:0 "Les conflits idéologiques naissent de désaccords profonds entre différents systèmes de croyances, englobant des valeurs politiques, économiques, religieuses et culturelles."
    tech_geopolitics_5_desc:0 "Les traités multilatéraux sont des accords conclus entre plus de deux parties. Ils résultent souvent d'une conférence internationale ou d'une réunion entre nations organisée sous l'égide d'une organisation internationale."
    tech_geopolitics_6_desc:0 "Le terme « sans frontières » décrit une situation dans laquelle les frontières entre les pays perdent de leur importance, généralement en ce qui concerne la circulation des marchandises, des personnes, etc."
    tech_geopolitics_7_desc:0 "L'intégration économique peut être comprise comme un processus conduisant à l'abolition complète de toute discrimination entre les unités économiques appartenant à différentes économies nationales, ou comme une étape de ce processus."
    tech_geopolitics_8_desc:0 "Le régionalisme désigne l'objectif politique consistant à créer un accord juridiquement contraignant entre des États à une échelle géographique limitée."
    tech_geopolitics_9_desc:0 "Un super-État est un État vaste et puissant formé par l'union de plusieurs pays plus petits."
    tech_geopolitics_10_desc:0 "L'expression « nouvel ordre mondial » désigne une nouvelle période de l'histoire marquée par des changements majeurs dans la pensée politique mondiale et dans l'équilibre des pouvoirs au sein des relations internationales. Malgré les différentes interprétations de cette expression, elle est généralement associée à la notion de gouvernance mondiale."

    tech_security_1:0 "Documents d'identité"
    tech_security_2:0 "Fichiers de surveillance policière"
    tech_security_3:0 "Casier judiciaire"
    tech_security_4:0 "Outils de surveillance élémentaires"
    tech_security_5:0 "Unités de police spécialisées"
    tech_security_6:0 "Outils de surveillance de masse"
    tech_security_7:0 "Police antiterroriste"
    tech_security_8:0 "Police fondée sur l'analyse des données"
    tech_security_9:0 "Réseaux de sécurité intégrés"
    tech_security_10:0 "Systèmes policiers fondés sur l'IA"

    tech_security_1_desc:0 "Les documents d'identité fournissent une méthode standardisée permettant de vérifier l'identité d'une personne. Ils permettent aux gouvernements de distinguer les citoyens, les résidents et les ressortissants étrangers à des fins administratives et sécuritaires."
    tech_security_2_desc:0 "Les fichiers de surveillance policière regroupent des informations sur les criminels connus, les suspects et les personnes présentant un intérêt particulier pour les autorités. Ils permettent aux forces de l'ordre de surveiller les menaces potentielles et de coordonner plus efficacement leurs enquêtes."
    tech_security_3_desc:0 "Les systèmes de casier judiciaire centralisent les informations relatives aux infractions, aux arrestations et aux condamnations. Ils permettent aux tribunaux et aux forces de l'ordre de mieux suivre les récidivistes et de faciliter les enquêtes criminelles."
    tech_security_4_desc:0 "Les outils de surveillance élémentaires, tels que la photographie, les écoutes téléphoniques et les postes d'observation, renforcent la capacité des forces de sécurité à recueillir des renseignements et à surveiller les activités suspectes."
    tech_security_5_desc:0 "Les unités de police spécialisées dans les stupéfiants, le crime organisé, la cybercriminalité ou la sécurité politique améliorent l'efficacité et l'expertise des opérations de maintien de l'ordre."
    tech_security_6_desc:0 "Les outils de surveillance de masse élargissent la capacité de l'État à surveiller les communications, les espaces publics et les déplacements de la population à l'échelle nationale, renforçant ainsi ses moyens de sécurité intérieure."
    tech_security_7_desc:0 "La police antiterroriste concentre les ressources des forces de l'ordre sur la prévention des violences extrémistes grâce à la collecte de renseignements, à des unités d'intervention rapide et à des opérations de sécurité coordonnées."
    tech_security_8_desc:0 "La police fondée sur l'analyse des données combine analyses statistiques, bases de données numériques et modèles prédictifs afin d'identifier les tendances criminelles et de répartir plus efficacement les ressources de sécurité."
    tech_security_9_desc:0 "Les réseaux de sécurité intégrés relient les forces de police, les services de renseignement, les autorités frontalières et les services d'urgence au moyen de systèmes d'information partagés, améliorant ainsi leur coordination lors des crises et des enquêtes."
    tech_security_10_desc:0 "Les systèmes policiers fondés sur l'IA utilisent une intelligence artificielle avancée pour traiter de vastes quantités de données, automatiser la détection des menaces et faciliter la prise de décision en temps réel dans le cadre des opérations de sécurité publique."