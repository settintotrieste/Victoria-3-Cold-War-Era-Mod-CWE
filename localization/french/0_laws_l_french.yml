    law_state_capitalism_desc:0 "Un système économique dans lequel l'État entreprend des activités commerciales et économiques, et où les moyens de production sont nationalisés en tant qu'entreprises publiques."
    
    #Energy Policy
    law_no_nuclear_energy_desc:0 "L'énergie nucléaire est interdite."
    law_nuclear_energy_desc:0 "L'énergie nucléaire est autorisée."
    
    #Environmental Policy
    law_no_environment_law_desc:0 "Le gouvernement n'a aucune réglementation ou loi protégeant l'environnement."
    law_weak_environment_law_desc:0 "Le gouvernement dispose de réglementations ou lois relativement faibles protégeant l'environnement."
    law_moderate_environment_law_desc:0 "Le gouvernement dispose de réglementations ou lois modérées protégeant l'environnement."
    law_strong_environment_law_desc:0 "Le gouvernement dispose de réglementations ou lois strictes protégeant l'environnement."
    
