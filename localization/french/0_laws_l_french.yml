    law_devolved_state:0 "État unitaire décentralisé" 
    law_devolved_state_desc:0 "Un État unitaire décentralisé est un pays où le gouvernement central détient l'autorité suprême mais a délégué certains pouvoirs à des niveaux inférieurs, comme les provinces ou les municipalités. Cela diffère d’un État unitaire centralisé où le gouvernement central conserve tous les pouvoirs importants." 

