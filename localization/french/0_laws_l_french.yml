    law_very_deflationary_monetary_policy_desc:0 "La politique budgétaire très déflationniste vise à réduire fortement la demande globale en diminuant les dépenses publiques et/ou en augmentant les impôts. Cette politique vise à réduire le déficit budgétaire et à décourager la consommation, car les consommateurs disposent désormais d’un revenu disponible plus faible."
