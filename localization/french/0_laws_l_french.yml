    law_weak_financial_regulations_desc:0 "Le gouvernement dispose de lois et réglementations financières faibles."
    law_moderate_financial_regulations_desc:0 "Le gouvernement dispose de lois et réglementations financières modérées."
    law_strong_financial_regulations_desc:0 "Le gouvernement dispose de lois et réglementations financières strictes."
    
