    law_parties_not_allowed:0 "Interdiction des Partis Politiques"
    law_parties_allowed:0 "Système Multipartite"
    law_parties_not_allowed_desc:0 "Aucun parti politique ne peut être enregistré dans le pays. \n\nCeci est représenté dans le jeu en désactivant les [Concept('concept_election','$concept_elections$')] compétitives."
    law_single_party_state:0 "État à Parti Unique"
    law_single_party_state_desc:0 "L'État est gouverné par un seul parti politique légal, qui détient le monopole de toute activité politique au sein de la nation. \n\nCeci est représenté dans le jeu en désactivant les [Concept('concept_election','$concept_elections$')] compétitives."
    law_dominant_party_state:0 "Parti Dominant"
    law_dominant_party_state_desc:0 "Bien que plusieurs partis politiques puissent exister dans le pays, le parti au pouvoir exerce une grande influence sur toute l'activité politique de la nation."
    law_parties_allowed:0 "Système Multipartite"
    law_parties_allowed_desc:0 "Tout parti politique peut être enregistré auprès de la commission électorale et se présenter aux élections."

