    #DESC#
    
    #Economic Specialization Laws
    law_no_economic_specialisation_desc:0 "Ce pays n'est pas spécialisé dans une industrie spécifique."
    law_natural_resource_focus_desc:0 "Ce pays est spécialisé dans l'exploitation de ses ressources naturelles."
    law_manufacturing_focus_desc:0 "Ce pays est spécialisé dans l'industrie manufacturière."
    law_services_focus_desc:0 "Ce pays est spécialisé dans l'industrie des services."
    
    #Economic System Laws
    law_state_capitalism_desc:0 "Système économique dans lequel l'État entreprend des activités économiques commerciales et où les moyens de production sont nationalisés en tant qu'entreprises d'État."
    
    #Energy Policy
    law_no_nuclear_energy_desc:0 "L'énergie nucléaire est interdite."
    law_nuclear_energy_desc:0 "L'énergie nucléaire est autorisée."
    
    #Environmental Policy
    law_no_environment_law_desc:0 "Le gouvernement ne dispose d'aucune réglementation ou loi protégeant l'environnement."
    law_weak_environment_law_desc:0 "Le gouvernement dispose de réglementations ou de lois relativement faibles en matière de protection de l'environnement."
    law_moderate_environment_law_desc:0 "Le gouvernement a adopté des réglementations ou des lois modérées en matière de protection de l'environnement."
    law_strong_environment_law_desc:0 "Le gouvernement a mis en place des réglementations ou des lois strictes pour protéger l'environnement."
    
    #Financial Regulation
    law_weak_financial_regulations_desc:0 "Les lois et réglementations financières du gouvernement sont insuffisantes."
    law_moderate_financial_regulations_desc:0 "Le gouvernement dispose d'une législation et d'une réglementation financières modérées."
    law_strong_financial_regulations_desc:0 "Le gouvernement dispose d'une législation et d'une réglementation financières solides."
    
    #Foreign Policy
    law_nationalist_fp_desc:0 "Une politique étrangère qui se concentre uniquement sur les efforts internes d'une nation."
    law_regionalist_fp_desc:0 "Une politique étrangère qui vise à établir des relations avec les voisins régionaux d'un pays."
    law_globalist_fp_desc:0 "Une politique étrangère qui vise à établir des relations avec le monde interconnecté dans son ensemble."
    
    #Industry Regulation
    law_pro_consumer_regulations_desc:0 "Le gouvernement met en place des réglementations qui favorisent le consommateur plutôt que l'industrie.."
    law_balanced_regulations_desc:0 "Le gouvernement a mis en place des réglementations visant à établir un équilibre entre les droits des consommateurs et ceux de l'industrie.."
    law_pro_industry_regulations_desc:0 "Le gouvernement a mis en place des réglementations qui favorisent le secteur industriel plutôt que le consommateur."
    
    #Monetary Policy
    law_deflationary_monetary_policy_desc:0 "Le gouvernement vise à équilibrer le budget national."
    
    law_no_term_limit:0 "Aucune limite de durée"
    law_no_term_limit_desc:0 "Le [concept_ruler] peut rester en fonction pour un nombre illimité de mandats."
    law_yes_term_limit:0 "Durée limitée"
    law_yes_term_limit_desc:0 "Le [concept_ruler] ne peut rester en fonction au-delà d'un nombre d'années déterminé."

    law_peasant_levies_additional_effects:0 ""

    law_command_economy:0 "Fully Planned Economy"
    law_semi_command_economy:0 "Partially Planned Economy"
    law_semi_command_economy_desc:0 "This is a form of economic system where the government owns and controls all enterprises but some operational decision making is left to the workers."
    law_social_capitalism:0 "Socialisme de marché"
    law_social_capitalism_desc:0 "Le socialisme de marché est un modèle socio-économique combinant un système économique capitaliste de marché libre avec des politiques sociales et une réglementation suffisante pour établir une concurrence loyale au sein du marché.."

    law_total_separation:0 "Séparation totale"

    law_unitary_state:0 "État unitaire"
    law_unitary_state_desc:0 "Un État unitaire est un État souverain gouverné comme une entité unique dans lequel le gouvernement central est l’autorité suprême."
    law_federal_state:0 "État fédéral"
    law_federal_state_desc:0 "Un État fédéral est une entité caractérisée par une union de provinces, états ou autres régions partiellement autonomes sous un gouvernement fédéral."
    law_politicised_judiciary:0 "Pouvoir judiciaire politisé"
    law_politicised_judiciary_desc:0 "Les juges sont directement nommés par le pouvoir exécutif."
    law_partially_politicised_judiciary:0 "Pouvoir judiciaire semi-indépendant"
    law_partially_politicised_judiciary_desc:0 "Les juges sont nommés conjointement par les pouvoirs exécutif et législatif."
    law_independent_judiciary:0 "Pouvoir judiciaire indépendant"
    law_independent_judiciary_desc:0 "La nomination des juges est libre de toute ingérence des pouvoirs exécutif et législatif."

    law_no_voting:0 "Pas de véritables élections"
    law_no_voting_desc:0 "Il n'y a pas d'élections ou seulement des élections où seuls les candidats approuvés par le parti au pouvoir sont autorisés."
    law_rigged_voting:0 "Élections truquées"
    law_rigged_voting_desc:0 "Un certain nombre de votes seront toujours en faveur du gouvernement."
    law_gerrymandered_voting:0 "Découpage électoral manipulé"
    law_gerrymandered_voting_desc:0 "Les circonscriptions électorales sont dessinées de manière à favoriser le parti au pouvoir."
    law_harassment_voting:0 "Harcellement électoral"
    law_harassment_voting_desc:0 "Les règles de campagne électorale sont défavorables aux candidats de l'opposition."
    law_fair_voting:0 "Élections équitables"
    law_fair_voting_desc:0 "Les règles de vote et de campagne sont libres et équitables."
    
    law_first_past_the_post:0 "Scrutin uninominal majoritaire à un tour"
    law_first_past_the_post_desc:0 "Le vote majoritaire à un tour est un système de vote majoritaire dans lequel les électeurs votent pour un seul candidat et le candidat ayant obtenu le plus de voix remporte l'élection."
    law_jefferson_system:0 "Méthode de Jefferson"
    law_jefferson_system_desc:0 "La méthode Jefferson est une méthode de répartition des sièges dans les parlements. Une fois tous les votes comptabilisés, des quotients successifs sont calculés pour chaque parti. Le parti ayant le quotient le plus élevé remporte un siège et son quotient est recalculé. Cette opération est répétée jusqu'à ce que le nombre de sièges requis soit pourvu."
    law_propotional_representation:0 "Représentation Proportionelle"
    law_propotional_representation_desc:0 "La représentation proportionnelle fait référence à tout type de système électoral dans lequel les sous-groupes d'un électorat sont représentés proportionnellement dans l'organe élu."
    
    law_parties_not_allowed:0 "Partis politiques interdits"
    law_parties_not_allowed_desc:0 "Aucun parti politique ne peut être enregistré dans le pays."
    law_parties_allowed:0 "Système multipartite"
    law_parties_allowed_desc:0 "Tout parti politique peut être enregistré auprès de la commission électorale et se présenter aux élections."
    
    law_appointed_legislature:0 "Législature nommée"
    law_appointed_legislature_desc:0 "Tous les membres de la législature sont sélectionnés par le gouvernement."
    law_technocratic_legislature:0 "Législature semi-nommée"
    law_technocratic_legislature_desc:0 "Certains membres de la législature sont sélectionnés par le gouvernement."
    law_democratic_legislature:0 "Législature élue"
    law_democratic_legislature_desc:0 "Tous les membres de la législature sont élus par le peuple."
    
    law_unicameralism:0 "Assemblée législative monocamérale"
    law_hybrid_chamber:0 "Législature hybride"
    law_bicameralism:0 "Législature bicamérale"
    law_unicameralism_desc:0 "Le monocaméralisme est un type de législature composé d’une seule chambre ou assemblée, qui légifère et vote en tant qu’entité unique."
    law_hybrid_chamber_desc:0 "Le pays possède une législature monocamérale avec un chef d’État largement cérémoniel, ou un organe exécutif indépendant du [concept_ruler] qui dispose d’un droit de veto sur les lois adoptées par le [concept_government]."
    law_bicameralism_desc:0 "Le bicaméralisme est un type de législature divisé en deux assemblées, chambres ou chambres séparées, appelées législature bicamérale."
    
    law_politicised_bureaucrats:0 "Fonctionnaires politisés"
    law_politicised_bureaucrats_desc:0 "Tous les fonctionnaires sont sélectionnés par le gouvernement en fonction de leur loyauté."
    law_elitist_bureaucrats:0 "Fonctionnaires élitistes"
    law_elitist_bureaucrats_desc:0 "Tous les fonctionnaires sont sélectionnés par les élites de la fonction publique."
    law_professional_bureaucrats:0 "Fonctionnaires professionnels"
    law_professional_bureaucrats_desc:0 "Tous les fonctionnaires sont sélectionnés via un processus de recrutement libre et équitable basé sur le mérite."
    
    law_weak_financial_regulations:0 "Réglementations financières faibles"
    law_moderate_financial_regulations:0 "Réglementations financières correctes"
    law_strong_financial_regulations:0 "Réglementations financières strictes"
    
    law_HOS_monarch:0 "$law_monarchy$"
    law_HOS_monarch_desc:0 "$law_monarchy_desc$"
    law_HOS_president:0 "$law_presidential_republic$"
    law_HOS_president_desc:0 "$law_presidential_republic_desc$"
    law_HOS_religious_leader:0 "$law_theocracy$"
    law_HOS_religious_leader_desc:0 "$law_theocracy_desc$"
    law_HOS_nationalist_leader:0 "Régime militaire"
    law_HOS_nationalist_leader_desc:0 "Il s'agit d'un [concept_government_type] où le pouvoir politique est concentré entre les mains des $ig_armed_forces$ du pays."
    law_HOS_communist_leader:0 "République socialiste"
    law_HOS_communist_leader_desc:0 "$law_council_republic_desc$"
    
    law_HOG_none:0 "Le dirigeant est chef du gouvernement"
    law_HOG_none_desc:0 "Le [concept_ruler] est à la fois chef de l’État et chef du gouvernement."
    law_HOG_prime_minister:0 "Premier ministre"
    law_HOG_prime_minister_desc:0 "Le chef de l’État n’a qu’un rôle cérémoniel tandis que le pouvoir réel revient au chef du gouvernement. Le [concept_ruler] est donc le chef du gouvernement."
    law_HOG_president_prime_minister:0 "Partagé avec le chef de l’État"
    law_HOG_president_prime_minister_desc:0 "Le [concept_ruler], qui est le chef de l’État, partage ses pouvoirs exécutifs avec un Premier ministre choisi parmi les membres de la législature."
    
    law_nepotistic_cabinet:0 "Cabinet népotiste"
    law_nepotistic_cabinet_desc:0 "Le cabinet est composé uniquement d’amis et de membres de la famille du dirigeant."
    law_semi_nepotistic_cabinet:0 "Cabinet semi-népotiste"
    law_semi_nepotistic_cabinet_desc:0 "Le cabinet est partiellement composé d’amis et de membres de la famille du dirigeant."
    law_meritocratic_cabinet:0 "Cabinet méritocratique"
    law_meritocratic_cabinet_desc:0 "Les membres du cabinet sont choisis selon leurs compétences et non leurs liens avec le dirigeant."
    
    law_executive_supremacy:0 "Suprématie de l’exécutif"
    law_executive_supremacy_desc:0 "La législature et la justice ne peuvent pas annuler une décision de l’exécutif."
    law_legislative_supremacy:0 "Suprématie parlementaire"
