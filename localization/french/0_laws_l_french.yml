    law_no_foreign_investment_policy_desc:0 "Le gouvernement est légalement interdit de conclure de nouveaux $foreign_investment_rights$ ou $foreign_investment_agreement$ [Concept('concept_diplomatic_pact','$concept_diplomatic_pacts$')]."
    law_nationalist_foreign_investment_policy_desc:0 "Le gouvernement ne peut conclure de nouveaux $foreign_investment_rights$ [Concept('concept_diplomatic_pact','$concept_diplomatic_pacts$')]."
    law_full_foreign_investment_policy_desc:0 "Le gouvernement peut librement conclure de nouveaux $foreign_investment_rights$ ou $foreign_investment_agreement$ [Concept('concept_diplomatic_pact','$concept_diplomatic_pacts$')]."
    
    lawgroup_secession_rights:0 "Droit à la Sécession"
    
    law_no_secession_rights:0 "Souveraineté Inviolable"
    law_limited_secession_rights:0 "Dévolution Autorisée"
    law_full_secession_rights:0 "Sécession Autorisée"
    
    law_no_secession_rights_desc:0 "Aucun État constituant n'est autorisé à obtenir plus d'autonomie ou à se séparer de ce pays."
    law_limited_secession_rights_desc:0 "Les États constituants peuvent obtenir plus d'autonomie mais ne peuvent pas se séparer de ce pays."
    law_full_secession_rights_desc:0 "Les États constituants peuvent obtenir plus d'autonomie et se séparer de ce pays."
    law_no_voting_additional_effects:0 "@information! Toutes les [Concept('concept_election','$concept_elections$')] seront non compétitives et le [concept_government] pourra suspendre la tenue des [Concept('concept_election','$concept_elections$')] pour une durée indéterminée."
    
    law_parties_not_allowed_additional_effects:0 "@information! Toutes les [Concept('concept_election','$concept_elections$')] seront non compétitives."
    law_dominant_party_state_additional_effects:0 "$can_ban_parties.tt$"
    law_parties_allowed_additional_effects:0 "$cannot_ban_parties.tt$"
    
    law_no_workers_rights:0 "Lois du travail faibles"
    law_regulatory_bodies:0 "Lois du travail modérées"
    law_worker_protections:0 "Lois du travail fortes"
    
    lawgroup_armed_forces_politicisation:0 "Politisation de l’armée"
    law_politicised_armed_forces:0 "Armée politisée"
    law_semi_politicised_armed_forces:0 "Armée semi-politisée"
    law_no_politicised_armed_forces:0 "Armée neutre"
    law_politicised_armed_forces_desc:0 "L’armée fait preuve d’une loyauté totale envers un seul parti politique et défend activement les positions et intérêts partisans de ce dernier."
    law_semi_politicised_armed_forces_desc:0 "L’armée montre une certaine loyauté envers un parti politique et défend régulièrement ses positions et intérêts partisans."
    law_no_politicised_armed_forces_desc:0 "L’armée reste totalement en dehors de la sphère politique."
    
    lawgroup_minority_issues:0 "Lois sur les modes de vie"
    law_no_minority_issues:0 "Modes de vie traditionalistes uniquement"
    law_some_minority_issues:0 "Lois conservatrices sur les modes de vie"
    law_full_minority_issues:0 "Modes de vie libéraux autorisés"
    law_no_minority_issues_desc:0 "Le gouvernement adopte une position traditionaliste sur les questions sociales telles que l’alcool, la drogue et les droits LGBTQ+. \n\nDans le cadre de cette [concept_law], la consommation de [GetGoods('opium').GetName], [GetGoods('tobacco').GetName], [GetGoods('liquor').GetName] et [GetGoods('wine').GetName] sera interdite."
    law_some_minority_issues_desc:0 "Le gouvernement adopte une position conservatrice sur les questions sociales telles que l’alcool, la drogue et les droits LGBTQ+. \n\nDans le cadre de cette [concept_law], la consommation de [GetGoods('opium').GetName] sera interdite."
    law_full_minority_issues_desc:0 "Le gouvernement adopte une position permissive sur les questions sociales telles que l’alcool, la drogue et les droits LGBTQ+."
    lawgroup_company_regulations:0 "Réglementation des entreprises" 
 
    law_weak_company_regulations:0 "Réglementation des entreprises faible" 
    law_moderate_company_regulations:0 "Réglementation des entreprises équilibrée" 
    law_strong_company_regulations:0 "Réglementation des entreprises stricte" 
 
    law_weak_company_regulations_desc:0 "Un cadre laxiste avec un contrôle minimal, offrant aux entreprises une grande liberté mais peu de protections pour les travailleurs et les consommateurs." 
    law_moderate_company_regulations_desc:0 "Un cadre équilibré avec un contrôle raisonnable, assurant des pratiques équitables tout en maintenant une certaine flexibilité pour les entreprises." 
    law_strong_company_regulations_desc:0 "Un cadre strict avec un contrôle étendu, donnant la priorité aux droits des travailleurs et à la protection des consommateurs, mais imposant des contraintes importantes aux entreprises." 
 
    lawgroup_gender_issues:0 "Droits LGBT" 
 
    law_no_gender_issues:0 "LGBT interdit" 
    law_some_gender_issues:0 "LGBT toléré" 
    law_full_gender_issues:0 "LGBT accepté" 
 
    law_no_gender_issues_desc:0 "Les relations entre personnes de même sexe et la diversité de genre sont criminalisées, avec une application stricte et aucune protection légale." 
    law_some_gender_issues_desc:0 "Les relations entre personnes de même sexe et la diversité de genre sont légalement autorisées mais font face à une stigmatisation sociale et à une reconnaissance limitée." 
    law_full_gender_issues_desc:0 "Les relations entre personnes de même sexe et la diversité de genre sont pleinement reconnues, avec une protection légale complète et une acceptation sociale." 
    lawgroup_minimum_wage:0 "Salaire Minimum" 
    law_no_minimum_wage:0 "Aucun Salaire Minimum" 
    law_no_minimum_wage_desc:0 "Les travailleurs reçoivent des salaires entièrement déterminés par les employeurs, sans minimum légal ni protection juridique." 
    law_low_minimum_wage:0 "Salaire Minimum Faible" 
    law_low_minimum_wage_desc:0 "Un salaire minimum de base est instauré, offrant une protection limitée mais souvent insuffisante pour couvrir le coût de la vie." 
    law_medium_minimum_wage:0 "Salaire Minimum Modéré" 
    law_medium_minimum_wage_desc:0 "Un salaire minimum modéré assure une rémunération plus équitable, équilibrant la protection des travailleurs et la flexibilité des entreprises." 
    law_high_minimum_wage:0 "Salaire Minimum Élevé" 
    law_high_minimum_wage_desc:0 "Un salaire minimum élevé offre une forte protection aux travailleurs et garantit un niveau de vie décent, bien qu'il impose des contraintes importantes aux employeurs." 
    law_independent_central_bank:0 "Banque centrale indépendante"
    law_independent_central_bank_desc:0 "La banque centrale fonctionne de manière autonome, à l'abri de l'influence de l'exécutif, et dispose d'une pleine autorité sur la politique monétaire."

    law_semi_independent_central_bank:0 "Banque centrale semi-indépendante"
    law_semi_independent_central_bank_desc:0 "La banque centrale conserve une autonomie partielle, mais les décisions importantes nécessitent une consultation ou une approbation de l'exécutif."

    law_non_independent_central_bank:0 "Banque centrale non indépendante"
    law_non_independent_central_bank_desc:0 "La banque centrale est directement contrôlée par l'exécutif et dispose de peu ou pas d'autorité indépendante sur la politique monétaire."
    
    je_central_bank_effect.tt:0 "Les effets de cette [concept_law] sont simulés par l' [concept_journal_entry] #y Banque centrale#!."